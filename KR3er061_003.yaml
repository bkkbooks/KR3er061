body:
  text: 卷之一中風論治風為百病之長故六淫先之以其善行數變受之者輕為感冒重則為傷最重則為中然有真中類中中血脈經絡腑臟之辨西北高寒風徑真氣虛者猝為所中是名真中經所謂中六腑五臟之俞也真中者風邪在表身痛拘急宜汗小續命湯或疏風散風邪在經口眼喎斜偏枯疼痛大秦艽湯或愈風湯風邪入里多滯九竅唇緩便祕口不能言耳聾鼻塞目瞀痰涎昏冒宜下三化湯或麻仁丸東南卑濕釀熱真陰虧者風自內生虛陽上冒亦致昏僕是為類中實與外風無涉經所謂陽之氣以天地之疾風名之也類中者痰多壅塞搗蘿蔔子以溫湯和飲吐之脾虛嘔痰者六君子湯異功散腎虛水泛為痰者六味丸或八味丸湯服中氣虛者補中湯陰虛者補陰煎夫以地分真類謂真中者西北為劇類中者東南為多未可膠柱以談也善乎石頑張氏之説曰嘗診西北中風者驗其喑痱遺尿詎非下元之憊當從事地黃三生等飲乎喎僻不遂詎非血脈之廢而從事建中十全等湯乎東南類中豈無六經形症見於外便溺阻隔見於內當從事續命三化等湯乎是真通論矣其中血脈則口眼喎僻中絡則肌膚不仁中經則脊重不伸中腑則肢節廢便溺阻中臟則舌喑吐沫金匱分析既明至千金引岐伯論中風大法有四一偏枯半身不遂也二風痱四肢不收也三風懿奄忽不知人舌強不能言也四風痹諸痹類風狀也迄乎河間主火謂心火暴盛腎水虛衰東垣主氣謂猝中乃本氣自病丹溪主痰謂濕生痰痰生熱熱生風總之氣虛則火動痰升其症似風非風皆辨明類中之由與真中症異專宜養氣血兼清痰火大忌風燥之劑凡虛風外中輕則麻痹不仁羌活愈風湯重則癱瘓不用大秦艽湯其痰火內生輕則舌強難語滌痰湯重則痰壅神昏至寶丹既辨其中絡中經中腑中臟及中經絡兼中腑臟並審其兼虛兼實兼寒兼熱兼痰而入手先分閉症脫症如牙關緊閉兩手握固是為閉症蘇合香丸三生飲開之如口開脾絶手撒心絶眼合肝絶遺尿腎絶鼻鼾肺絶以及吐沫直視搖頭面赤如妝汗出如珠皆為脫症大劑理中湯灌之兼灸臍下凡初中先用通關散吹鼻有嚏可治無嚏多死口噤足陽明之經上夾口風寒乘虛襲入則攣急口噤先用烏梅肉冰片生南星為末擦牙其噤可開宜竹瀝薑汁調蘇合香丸灌之再用巴豆油紙卷皂角末燒煙燻入鼻中人事自省痰壅宜吐之稀涎散加橘紅或薑鹽湯灌之以鵝翎探吐或三聖散加蠍吐之後用星香散二陳湯滌痰湯導痰湯挾虛加參耆竹瀝挾寒加桂附薑汁脾虛嘔痰六君子湯異功散中氣虛理中湯溫胃飲口眼喎僻因血液衰涸不能榮潤筋脈靈樞云足陽明筋病頰筋有寒則急引頰移口有熱則筋弛縱緩不勝收故僻又云足陽明手太陽筋急則口目為僻宜潤燥以熄風大秦艽湯或十全大補湯尤妥半身不遂因氣血不至故痛癢不知經曰營虛則不仁衛虛則不用營衛俱虛則不仁且不用自丹溪以左枯屬血虛用四物湯右枯屬氣虛用四君子湯氣血兩虛而挾痰用二陳湯加鉤藤竹瀝薑汁宗其治者多不效何也治偏枯宜從陰引陽從陽引陰從右引左從左引右使氣血灌注周流不息莫如養血溫經補中湯少加附子下七味地黃丸以附子能行參耆之力而陽和自轉肉桂能通血脈而筋節自榮挾痰者八珍十全等湯加南星半夏薑汁營衛俱虛者黃耆五物湯膝骨軟加牛膝虎骨節軟加木瓜當歸四肢不收諸陽經皆取於手足循行身體如邪氣客於肌膚隨其虛處停滯與氣血相搏故肢不舉脈緩大有力土太過也當瀉其濕胃苓湯脈細小無力土不足也當補其氣補中湯瘦人血枯筋急木旺風淫者四物湯加鉤藤秦艽防風木瓜肥人色白多痰者六君子湯加秦艽天麻竹瀝薑汁角弓反張邪入經絡則腰背反折攣急如角弓狀小續命湯如先受風復感寒無汗惡寒為剛痙先受風復感濕惡風有汗為柔痙剛痙續命湯去附子柔痙續命湯去麻黃瘛瘲因肝經風火搏於經絡則手足抽搐或伸或縮而動不止由血虛不能榮筋而燥氣乘之宜滋肝腎灌輸筋脈使水火熄則風木自平大秦艽湯或十補湯加減猝倒無知凡類中病出於臟精去則氣去所以眩暈猝倒氣去則神去所以昏憒無知陰陽脫離精氣不交須參附大劑峻補其陽繼以地黃丸加杞子當歸或十補丸填補真陰若心火盛腎水衰致猝倒神昏肢掣口喎宜地黃飲子去桂附巴戟峻補其陰繼以生脈散滋其化源舌強不語舌為心脾肝腎四經所繫邪中其經則痰涎閉其脈道舌機不掉因痰迷心竅者清心火滌痰湯因濕痰者清脾熱六君子湯加枳實竹茹因風熱者清肝火涼膈散加減腎虛內奪為喑痱地黃飲子舌強口角流涎脾不能攝者六君子湯加竹瀝薑汁驚痰堵塞舌本強硬者正舌散加薄荷舌麻語謇者省風湯加沉香唇緩舌強者解語湯肥人舌本強作濕痰治瘦人作心火治不可純補恐堵塞經絡中痰火通用加味轉舌膏外取龜尿少許點舌神效置龜於新荷葉上以豬鬃戳其鼻尿立出有飲食照常但失音不語者名曰啞風宜小續命湯去附子加石膏菖蒲遺尿系腎氣虧極用參耆朮附益智五味以保元陽之脫火虛者地黃飲子水虛者六味丸眩暈凡虛陽上巔得痰升則眩暈經所謂上虛則眩也宜培其中氣五福飲或大補元煎加甘菊炭牡蠣白芍天麻此猝倒所由來也麻木不仁遍體頑麻無汗氣實烏藥順氣散十指及面麻木乃氣虛風襲補中湯去朮歸陳加白芍五味子麻木體軟搔起白屑乃脾血不榮補中湯去柴胡加地黃白芍芝麻真中風雖風從外中亦由內虛召風其攣急偏枯口喎舌強二便不爽由風挾痰火壅塞致營衛脈絡失和先用通關繼則養血順氣佐以消痰清火大秦艽湯或愈風湯宣通經隧風閉用桂枝羌活寒凝用薑附桂心熱痞用梔芩石膏濕滯用蒼朴五苓血瘀用桃仁牛膝氣滯用木香枳殼青陳痰阻用星夏浮石牛黃類中風本非外風猝僕昏厥無喎斜偏廢等症是宜辨也故葉氏謂內風乃身中陽氣變化肝為風臟因血液衰耗水不涵木肝陽偏亢內風時起宜滋陰熄風濡養營絡以熟地首烏杞子當歸牛膝胡麻石斛五味子甘菊牡蠣補陰潛陽如虎潛固本復脈之類陰陽並損無陽則陰無以化宜溫柔濡潤如沙苑子蓯蓉杞子人參阿膠當歸通補如地黃飲子還少丹之類風木過動中土受戕致不寐不食衛疏汗泄飲食變痰如六君子湯玉屏風散茯苓飲酸棗仁湯之類風陽上升痰火阻竅神識不清至寶丹芳香宣竅或辛涼之品如菊葉菖蒲山梔羚羊角天麻丹皮鉤藤清上痰火若陰陽失交真氣欲絶用參附湯回陽佐以攝陰如五味龍骨牡蠣此其治也自士材以類中症條分火中虛中濕中寒中暑中氣中食中惡中而金鑑因之火中即河間所謂癱瘓多由火盛水衰心神昏冒筋骨不用也心火盛涼膈散腎水衰六味湯虛中即東垣所謂猝中昏憒皆屬氣虛煩勞氣陷補中湯房勞精脫生脈補精湯濕中即丹溪所謂東南濕土生痰痰熱生風因而昏冒內中濕者醇酒厚味生冷過節滲濕湯外中濕者陰雨霧露坐臥濕地除濕湯寒中體強口噤臍腹冷痛薑附湯身寒無汗附子麻黃湯暑中面垢暈倒須分陰陽得之受暑納涼寒外暑內香薷飲二香湯得之赤日長途中外皆熱昏僕不醒蒜汁合水灌之繼以辰砂益元散氣實者蒼朮白虎湯氣虛者人參白虎湯氣中氣逆痰潮牙關緊急極似中風但中風身溫中氣身冷中風脈浮應人迎中氣脈沉應氣口蘇合香丸灌之俟醒以八味順氣散加香附因怒氣逆忽然昏噤木香調氣飲有痰星香散食中醉飽後或感寒或惱怒胃氣不行忽然厥逆誤作中風中氣治必死薑鹽湯探吐感寒者藿香正氣散氣滯者八味順氣散惡中飛尸鬼擊卒厥客忤肢冷口噤蘇合香丸灌之俟少蘇服調氣平胃散中風脈候浮遲者吉堅大急疾者凶浮大為風浮遲為寒浮滑為痰浮數有力為火浮弦有力為氣沉澀而數為血凝寸關虛滑而大為真氣散尺脈浮而無力為腎氣不足尺脈洪弦而數為腎氣大虧類中風脈遲緩可生急數弦大者死舉之搏大按之絶無為孤陽無依者死口開眼閉手撒遺尿鼻鼾吐沫直視昏沉不醒髮直搖頭上竄面赤頭重山根青黑皆不治附方中風小續命湯麻黃人參黃芩芍藥甘草川芎杏仁防己官桂防風附子薑表邪疏風散麻黃三兩杏仁益智仁各一兩升麻一錢每服五錢經邪大秦艽湯茯苓白朮甘草生地白芍歸身川芎羌活獨活秦艽石膏白芷防風細辛黃芩薑通治愈風散大秦艽湯加人參黃耆桂心厚朴柴胡枳殼杜仲防己知母半夏薄荷蔓荊甘菊前胡蒼朮麻黃枸杞地骨皮府實三化湯大黃枳實厚朴羌活中臟麻仁丸大黃枳實厚朴芍藥麻仁杏仁蜜丸脾虛六君子湯人參白朮茯苓各二錢甘草一錢薑三片棗二枚名四君子湯此加陳皮半夏嘔痰異功散六君子湯除去半夏腎虛六味地黃丸熟地黃酒蒸曬八兩萸肉山藥各四兩茯苓丹皮澤瀉各三兩蜜丸陽虛八味地黃丸六味地黃丸加桂心一兩名七味地黃丸此再加附子一兩中虛補中益氣湯黃耆錢半人參甘草各一錢白朮陳皮當歸各五分升麻柴胡各三分薑棗滋腎補陰煎熟地黃柏知母龜板白芍當歸牛膝虎脛骨鎖陽廣皮除痰滌痰湯人參南星半夏枳實茯苓橘紅菖蒲竹茹甘草薑宣竅至寶丹烏犀角硃砂雄黃玳瑁琥珀各研一兩麝香龍腦各研一錢金銀箔各十五片牛黃研半兩安息香一兩將安息香熬膏和諸藥末分作百丸蠟護辟邪蘇合香丸蘇合香安息香各二兩薰陸香龍腦丁香麝香各研一兩青木香白朮沉香香附烏犀角各研一兩加煉白蜜和分作五十丸另以硃砂一兩水飛為衣蠟護原方又有檀香蓽茇訶黎勒閉症三生飲生南星生川烏生附子木香人參薑脫症理中湯白朮土炒二兩人參炮薑炙草各一兩每服四錢加附子名附子理中湯取嚏通關散南星皂角細辛薄荷生半夏為末吹鼻又南星冰片烏梅肉擦牙開噤名開關散吐涎稀涎散剛子仁六粒劈開牙皂角三錢礬一兩將礬化開入二味攪勻待礬枯研末用三分吹喉吐痰三聖散防風藜蘆甜瓜蒂吐痰瓜蒂散甜瓜蒂赤小豆全蠍又名全蠍散痰滯星香散南星四錢木香五分化痰二陳湯半夏二錢陳皮茯苓各一錢甘草五分加薑煎膠痰導痰湯二陳湯再加膽南星枳實溫中溫胃飲人參白朮炮薑扁豆當歸陳皮炙草補氣十全大補湯當歸生地各三錢芍藥二錢川芎錢半名四物湯合四君子湯名八珍湯再加黃耆肉桂名十全大補湯營衛黃耆五物湯黃耆白芍桂枝薑棗瀉濕胃苓湯蒼朮厚朴陳皮甘草名平胃散白朮澤瀉豬苓茯苓名四苓散合二方名胃苓湯補陰地黃飲子熟地桂心附子蓯蓉巴戟遠志萸肉石斛麥冬五味薄荷菖蒲茯苓瀉火涼膈散大黃芒硝連翹山梔甘草黃芩薄荷蜜去硝黃加桔梗竹葉名加減涼膈散舌強正舌散蠍尾醋泡炒三錢茯苓薑汁拌曬一兩為末每服二錢溫酒下並擦牙齦痰熱省風湯防風生南星各二錢生半夏黃芩甘草各一錢加薑煎不語解語湯防風天麻附子棗仁各錢半羚羊角官桂羌活各八分炙草五分竹瀝半杯言謇加味轉舌膏連翹遠志薄荷柿霜菖蒲梔子防風桔梗黃芩炙草犀角大黃元明粉川芎蜜丸補氣五福飲人參熟地當歸白朮炙草培中大補元煎人參熟地山藥杞子萸肉當歸炙草杜仲陽虛加薑附氣虛加耆術中絡烏藥順氣散麻黃枳殼桔梗烏藥殭蠶白芷陳皮乾薑川芎甘草補陰虎潛丸黃柏知母熟地龜板虎脛骨鎖陽當歸牛膝白芍陳皮羯羊肉搗丸補元固本丸人參二兩天冬麥冬生地熟地各四兩蜜丸潤燥復脈湯炙草四兩生薑桂枝人參阿膠各二兩生地一斤麥冬麻仁各八兩大棗十二枚水酒各半煎一名炙甘草湯通補還少丹熟地二兩山藥牛膝杞子各兩半萸肉茯苓杜仲遠志五味楮實茴香巴戟蓯蓉各一兩石菖蒲五錢加棗肉蜜丸鹽湯下表虛玉屏風散黃耆防風各一兩白朮二兩扶脾外臺茯苓飲茯苓人參白朮枳實橘皮生薑補脾酸棗仁湯棗仁甘草知母茯苓川芎精虛生脈補精湯人參麥冬五味熟地當歸鹿茸內濕滲濕湯即胃苓湯加香附川芎砂仁黃連外濕除濕湯羌活藁本升麻柴胡防風蒼朮身寒附子麻黃湯附子麻黃甘草驅暑香薷飲香薷厚朴扁豆黃連除扁豆名黃連香薷飲除黃連名三物香薷飲加苓草名五物香薷飲陰暑二香湯香薷飲合藿香正氣散名二香湯除熱蒼朮白虎湯石膏一斤知母六兩甘草二兩粳米六合名白虎湯此加蒼朮或加人參調氣八味順氣散人參茯苓白朮甘草烏藥白芷青皮陳皮暴怒木香藿香砂仁蔻仁炙草丁香檀香中暑藿香正氣散藿香紫蘇白芷腹皮茯苓各三兩白朮陳皮半夏厚朴桔梗各二兩甘草一兩加薑棗煎每服五錢惡中調氣平胃散木香檀香砂仁蔻仁厚朴陳皮蒼朮藿香甘草中風脈案楊冬月辦公夜半猝倒榻下不省人事身熱痰壅口喎舌強四肢不收脈左虛澀右浮滑先用薑汁熱挑與之痰頓豁暫用疏風化痰藥宣通經隧神識漸清右體稍能轉側但左體不遂語言模糊症屬真陰素虛以河間地黃飲子去桂附巴戟加杞子牛膝俱酒蒸木瓜何首烏數十服諸症漸退稍能步履惟左手不遂前方加桂枝薑黃數劑左腋時時微汗不一月左手如常按此症乃風自火出火自陰虧水不涵木肝風內煽痰火上乘堵塞清竅是以猝倒無知也口喎者胃脈挾口環唇寒則筋急熱則筋弛或左急右緩或右急左緩張氏醫通曰左寒右熱則左急而右緩右寒左熱則右急而左緩蓋左中寒則逼熱於右右中寒則逼熱於左陽氣不得宣通故也舌強者舌本心苗腎脈系舌本心火盛腎水衰故舌強肝主筋胃主四肢肝胃血虛則筋不榮而成痿軟也左脈澀則水虧右脈滑則痰盛此偏枯之象已具但非暫進豁痰則經隧不開湯液難下用地黃飲子減去陽藥正以五志過極而生火法當滋陰而風火自熄河間謂中風癱瘓非肝木之風亦非外中於風乃心火暴盛腎水虛衰不能制之而熱氣怫鬱心神昏冒猝倒無知也亦有因五志過極而猝中者皆非熱甚俗云風者言末而忘其本也制地黃飲子原主補腎之真陰但陰虛有二有陰中之水虛有陰中之火虛火虛者桂附巴戟可全用水虛者非所宜也族某左體麻木脛骨刺痛腰膝痿軟能飲多痰脈左大右濡此陰虛生熱而挾濕痰也用薛氏六味地黃丸作湯劑君茯苓加生朮薏仁牛膝黃柏俱酒炒十數服諸症悉退步履如初丹溪以麻為氣虛木為濕痰敗血其脛骨刺痛者腎虛挾火也腰膝痿軟腎將憊矣法當戒飲以六味湯滋化源而君茯苓佐朮薏引用牛膝黃柏以泄濕熱利腰膝不犯先哲類中禁用風燥之例李右體不遂艱於行步已為三年痼疾辭以難治詢所苦曰大便甚難但得爽利為幸耳診其脈右三部全伏左三部洪大無倫因思右枯既久腑陽必衰大腸曲折至右畔傳送自遲宜從風祕法以辛通濡潤如搜風順氣丸但命火衰微右體冰冷先用崔氏桂附八味丸作煎劑二服便爽右肢運動稍活後於八味丸加蓯蓉當歸蜜丸服效孫高年上盛下虛頭眩肢麻耳鳴舌強值少陽司令肝風內震脈象浮洪消穀善飢便溏汗泄皆液虛風動之咎交夏火旺遂口喎言謇此風火襲絡類中顯然最防傾僕痰湧又午刻火升頭汗身熱其由來則本陰不交陽無攻風劫痰之理治以水涵木兼攝虛陽熟地五錢五味子五分麥冬錢半茯神三錢牡蠣醋煅研三錢甘菊炒錢半鮮石斛三錢白芍二錢川貝母錢半丹皮一錢阿膠水化二錢三服諸症悉退脈漸平惟夜臥少安帖此肝虛而魂失靜鎮也原劑中加龍骨煅七分接服無間另訂膏方即用前味加洋參萸肉蓮實桑枝取嫩者熬膏收貯窨退火氣每服五錢能加意調攝可望回春傷風論治風者天之陽經云虛邪賊風陽先受之風邪傷衛故腠理疏者善病風其症惡風有汗脈浮頭痛鼻塞聲重咳嗽痰多或憎寒發熱惟其人衛氣有疏密感冒有淺深故見症有輕重治法不宜表散太過不宜補益太早須察虛實審輕重辨寒熱順時令經云風淫所勝平以辛涼佐以苦甘凡體實者春夏治以辛涼秋冬治以辛溫解其肌表風從汗散體虛者固其衛氣兼解風邪恐專行發散汗多亡陽也如初起風兼寒宜辛溫發表郁久成熱又宜辛涼疏解忌初用寒涼致外邪不得疏散鬱熱不得發越重傷肺氣也如體虛感風微覺寒熱參歸桂枝湯加陳皮風傷肺衛寒熱頭痛咳嗽脘悶豉桔湯風傷營衛頭痛咳則閃爍筋掣當歸建中湯太陽傷風發熱自汗惡風桂枝湯傷風頭痛鼻塞聲重川芎茶調散傷風兼寒咳嗽發熱柴陳煎風溫傷肺身痛脘痹梔豉湯加象貝杏仁鬱金枳殼桑葉栝蔞暑風上受痰熱喘嗽竹葉石膏湯加桔杏蔞草陳皮滑石感風兼濕頭目如蒙痰稠胸悶通草豆豉厚朴滑石桔梗杏仁栝蔞火傷風火鬱燥嗽咽痛甘桔湯加薄荷元參黃芩前胡花粉熱傷風咳而咽痛鼻塞吐痰消風散加減風邪外閉肢節煩痛里有鬱熱羌活散加減時行感冒寒熱往來傷風無汗參蘇飲人參敗毒散神朮散總之傷風須察其六淫兼症且經疏解後若仍惡風自汗但當調衛和營八珍湯或表虛易感受風邪必固實腠理玉屏風散斯為善後之防矣傷風脈候脈浮為傷風浮而緊者兼寒浮而緩者兼濕浮而洪者兼火浮而滑者多痰浮而有力為表實無力為表虛附方體虛參歸桂枝湯桂枝芍藥甘草生薑大棗名桂枝湯此加人參當歸傷衛豉桔湯豆豉桔梗滑石厚朴蘇梗連翹杏仁甘草營衛當歸建中湯桂枝芍藥甘草飴糖生薑大棗名小建中湯此加當歸疏散川芎茶調散薄荷川芎羌活甘草荊芥白芷防風細辛為末每服二錢茶調下兼寒柴陳煎柴胡黃芩製半夏茯苓陳皮甘草薑棗風溫梔豉湯豆豉山梔暑風竹葉石膏湯竹葉二把石膏一斤人參三兩炙草一兩麥冬一升半夏粳米各半升加薑煎兼火甘桔湯甘草桔梗痰熱消風散蒼朮麻黃荊芥白芷甘草陳皮蔥白薑熱鬱羌活散羌活麻黃防風細辛川芎甘菊枳殼蔓荊前胡茯苓甘草石膏黃芩感冒參蘇飲人參蘇葉葛根半夏前胡桔梗枳殼陳皮茯苓甘草木香薑棗時行人參敗毒散枳殼茯苓人參川芎獨活羌活前胡柴胡甘草桔梗時行神朮散蒼朮防風甘草生薑蔥白局方加川芎細辛白芷羌活藁本和衛八珍湯見前中風大補湯下表虛玉屏風散見前中風傷風脈案某風傷衛陽咳頻嚏多涕怯風頭目重眩宜辛以散之用防風蘇葉杏仁川芎桔梗甘菊薑微汗而愈某冬春喜浴腠疏感風以玉屏風散固之某風溫傷肺咳而眩用輕涼肅上丹皮杏仁桑葉山梔貝母枇杷葉再服效傷寒治要自霜降後天冷沍寒感之即病者傷寒也脈浮緊為傷寒脈浮緩為傷風感寒不即病者春為溫夏為熱一日太陽受之尺寸俱浮以其脈上連風府故頭項痛腰脊強二日陽明受之尺寸俱長以其脈挾鼻絡於目故身熱目痛鼻乾不得臥三日少陽受之尺寸俱弦以其脈循脅絡於耳故脅痛而耳聾此三陽受病未入腑可汗而已若不解四日太陰受之尺寸俱沉細以其脈布胃中絡於嗌故腹滿而嗌乾五日少陰受之尺寸俱沉以其脈絡於肺系舌本故口燥舌乾而渴六日厥陰受之尺寸俱微緩以其脈循陰器絡於肝故煩滿而囊縮此三陰受病已入腑可下而已三陰經有汗下溫三法不但可下而已也腑謂胃腑其兩感於寒者一日太陽與少陰俱病有頭痛項強而又口乾煩渴也二日陽明與太陰俱病有身熱譫語而又腹滿不欲食也三日少陽與厥陰俱病有脅痛耳聾而又囊縮厥逆也此陰陽表裡俱病欲汗之則有里症欲下之則有表症故內經仲景皆云必死潔古大羌活湯主之傷寒有傳經有直中傳經者由太陽傳陽明由陽明傳少陽由少陽傳太陰由太陰傳少陰由少陰傳厥陰此為循經傳太陽傳少陽為越經傳太陽傳太陰為誤下傳太陽傳少陰為表裡傳太陽傳厥陰為首尾傳太陽傳本腑膀胱為傳本陽明有不傳少陽而徑入本腑者胃腑少陽有不傳三陰而徑入胃腑者有傳一二經而止者有始終止在一經者當隨症施治不必拘日數其直中者則不出陽經傳入而徑中三陰者也夫傳經之邪在表為寒入里則化熱不比直中之邪但寒無熱為急宜溫也先明傳經直中庶寒熱之劑不致混投而表裡寒熱尤所宜辨太陽為表之表陽明為表之裡少陽居表裡之間為半表半裡太陰少陰厥陰俱為里凡傷寒自陽經傳入陰經者為熱邪不由陽經傳入而直入陰經者謂之中寒則為寒邪鍾齡程氏條而析之附録於此傷寒症有表寒有裡寒有表熱有裡熱有表裡皆熱有表裡皆寒有表寒裡熱有表熱裡寒何謂表寒傷寒初客太陽頭痛發熱而惡寒者名曰外感經所謂體若燔炭汗出而散是也陽明解肌少陽和解其理一也何謂裡寒凡傷寒不由陽經傳入而直入陰經者手足厥冷脈微細下利清穀名曰中寒仲景所謂急溫之宜四逆湯是也何謂表熱凡傷於寒則為病熱表邪壅遏不得外泄或榮弱衛強自汗不解宜桂芍和榮柴葛解肌是也何謂裡熱凡傷寒漸次傳裡與春溫夏熱症熱邪內發皆為裡熱其在太陰則津液少少陰則咽乾口燥厥陰則消渴仲景所謂急下之而用大柴胡三承氣者是也何謂表裡皆熱如傷寒陽明症傳於本腑外而肌肉內而胃腑熱氣熏蒸口渴譫語此散漫之熱邪未結聚治用白虎湯外透肌膚內清腑臟俾表裡兩解不比邪熱結實專在腸胃可下而愈也正傷寒有此溫熱症更多有此何謂表裡皆寒凡傷寒表受寒邪更兼直中於里此為兩感寒症仲景用麻黃附子細辛湯是也何謂表寒裡熱如兩感熱症一日太陽與少陰同病二日陽明與太陰同病三日少陽與厥陰同病三陽為寒三陰已成熱症豈非表寒而裡熱乎亦有火鬱在內更加外感於寒亦為表寒裡熱之候又有火亢已極反兼水化內熱閉結而外有惡寒之狀者表似寒而裡實熱誤投熱劑下咽即敗矣何謂表熱裡寒如人本體虛寒而外感溫熱之邪此為標熱本寒清劑不宜太過更有陰寒在下逼其無根失守之火發揚於上肌膚大熱欲坐臥泥水中表似熱而裡實寒誤投寒劑入胃即危矣傷寒變症不一總不外表裡寒熱其表裡寒熱之變總不外此八言以為綱領經腑論程氏曰經者徑也行於皮之內肉之中者也腑者器也所以盛水穀者也傷寒諸書以經為腑以腑為經混同立言惑人滋甚今特辨之夫邪之在三陽也有太陽之經有陽明之經有少陽之經凡三陽在經之邪未入腑者可汗而已邪之在三陰也有太陰之經有少陰之經有厥陰之經凡三陰之邪已入腑者可下而已所謂入腑之腑指陽明胃腑而言也三陽三陰之邪一入胃腑則無復傳矣胃者土也萬物歸土之義也傷寒論云有太陽陽明有正陽陽明有少陽陽明此陽明即胃腑非陽明之經也假令邪在太陽不傳陽明經而徑入胃腑曰太陽陽明邪在陽明經不傳少陽而自入本腑曰正陽陽明邪在少陽經不傳三陰而徑入胃腑曰少陽陽明凡三陽之邪已入胃腑俱下之勿疑矣雖然三陽入腑人所共知三陰入腑鮮或能識夫三陽之經去腑尚遠三陰之經與腑為近然既曰經則猶在徑路之間未嘗歸併於一處也傷寒論云太陰病脈浮者可發汗宜桂枝湯少陰中風脈陽微陰浮者為欲愈厥陰中風脈微浮為欲愈不浮為未愈俱言邪在於經故有還表向汗之時若既入腑則無外出之路惟有通其大便令邪從內出也此大小承氣調胃承氣所由設也然則以白虎湯治腑病何謂也以三陽之邪初入胃腑表裡皆熱邪未結聚熱勢散漫而無胃實不大便之症故用白虎湯內清胃腑外透肌膚令表裡兩解若邪已結聚在太陰之實痛少陰之咽乾口燥下利清水心下硬厥陰之煩滿囊縮白虎不中與也惟急下之而已此無他經腑明則施治不致舛錯矣然則太陽之邪自入本腑何謂也太陽之腑膀胱也膀胱主盛溺太陽病盛則移邪於腑而為口渴溺赤外現太陽病而兼有此症者名曰太陽傳本當五苓散以桂枝解外邪以豬苓澤瀉利小便而愈也或問陽邪入陰復有還表向汗之時其信然乎豫曰古人之言豈欺我哉夫經者徑也猶徑路然三陽之邪既有路以達三陰三陰之邪即有路以返三陽此循環之至理非若邪入胃腑更無外出之路也嘗見病人體質素厚有傳經盡而自愈者皆由汗解也傷寒論云其不再傳經不加異氣者七日太陽病衰頭痛稍愈八日陽明病衰身熱稍歇九日少陽病衰耳聾微聞十日太陰病衰腹減思食十一日少陰病衰渴止舌乾已而嚏也十二日厥陰病衰囊縱少腹微下大氣已去病人精神爽慧也由是觀之豈非經盡而愈還表向汗之明驗乎或曰陰不得有汗今太陰脈浮用桂枝湯然則三陰亦可汗解乎桂枝湯將為太陰正藥乎曰不然讀仲景書當會而通之夫邪已入里而復發其表是增其熱矣故曰陰不得有汗邪雖入里而復返乎表是邪外出矣故曰還陽而向汗夫桂枝湯太陽傷風藥也今太陰用桂枝湯者由太陽傷風為醫誤下而傳入太陰者也太陰脈當沉今反浮是症在太陰脈在太陽太陽之邪未盡入於陰太陰之邪大有還陽向汗之勢故用桂枝湯以徹散之令其從太陽來者仍自太陽出也推而論之若從太陽傷寒來得傷寒脈則桂枝可易麻黃仲景麻黃石膏湯之意可推也若從陽明來得陽明脈則桂枝可易葛根仲景葛根黃連黃芩湯之意可推也若從少陽來得少陽脈則桂枝可易柴胡是以大柴胡湯為少陽傳入太陰之的方也然必腹中實痛乃為脾邪干胃甫用大黃下之否則只於本方加芍藥以和之而已傷寒論云本太陽症為醫誤下傳入太陰而腹痛者桂枝湯加芍藥大實痛者桂枝湯加大黃亦此意也太陰如此少陰厥陰何獨不然仲景少陰篇內以四逆散治陽厥方用柴胡黃芩甘草枳實豈少陰亦用柴胡散之歟誠以熱邪傳裡遊行於少陰經絡之間尚未結聚成實內陷於胃腑中則用黃芩甘草以清傳經之熱邪用枳實以導胃中之宿滯使邪氣不得乘機而內合以作胃實不大便之症更用柴胡疏通三陽之路俾其從此來者仍從此出不必擾動中宮而病勢已解此仲景用藥之微權也愚遇陽邪入陰猶未結實之症仿古人三黃解毒之意而加以石膏以守陽明之中路加柴胡者亦望其返之故道而還陽向汗也大抵傷寒治法急於解表而緩於攻裡非惟三陽之邪務從表散即三陰未結之邪且冀其還陽而之表必俟邪氣結實乃用承氣湯攻下之且戒曰欲行大承氣先與小承氣腹中轉矢氣者方與大承氣若不轉失氣慎未可再攻兢兢然不苟下也有如此仲景又曰病發於陽而反下之熱入因作結胸病發於陰而下之因作痞熱入者言入胃也三陰下早雖不至成結胸而已不免為痞氣矣噫經腑之間其可不辨哉傷寒脈案王正月傷寒頭痛項強煩熱無汗脈浮緊雖立春後氣候尚寒非麻黃湯腠理不開一啜汗透而愈冷初春傷寒失表五六日後太陽症猶在頭痛身痛煩熱脈洪醫但用杏枳桔陳熱遂甚耳聾譫語自利豫謂表症未除原不宜拘日數況邪不透表勢必循經傳裡宜表裡分解用梔豉湯合芎蘇飲蓋以梔豉除煩芎蘇達表柴胡達半表半裡茯苓滲濕加黃芩麥冬清熱日再服汗透熱除族某冬季傷寒發熱頭痛拘急無汗嘔吐自利脈右緊左浮用葛根加半夏湯再服症退堂侄傷寒發熱頭重渴飲脅滿脈微緊此陽明而兼少陽症也用局方柴胡升麻湯去黃芩石膏二服汗出愈李氏寒熱煩渴耳聾胸滿腫痛或疑為外症用攻毒藥豫曰此傷寒少陽症若外症安得耳聾仿陶節庵法小柴胡湯去參棗加枳桔蔞陳諸症自愈陶氏曰表邪傳至胸中未入府故為半表半裡只須小柴胡湯加枳桔或對小陷胸湯一服豁然王海藏亦謂小陷胸為少陽藥以其能滌膈上結熱也族侄傷寒身熱浹旬脈沉微吐蛔足厥少腹滿而渴邪傳厥陰仿仲景烏梅丸加減烏梅二枚川椒炒十四粒赤苓三錢赤芍杏仁炒各二錢當歸山梔枳殼炒各一錢生薑三片一服脈浮微汗而解傷寒論云厥陰病脈微浮為欲愈以建中湯調理而平溫症論治春溫風溫濕溫冬溫溫毒附溫為春氣其病溫者因時令溫暖腠理開泄或引動伏邪或乍感異氣當春而發為春溫其因冬月傷寒至春變為溫病者伏邪所發非寒毒藏於肌膚亦非傷寒過經不解之謂王叔和云岐子之説吳又可柯韻伯已辨之乃由冬藏不密腎陰素虧虛陽為寒令所遏仍陷入陰中至春則裡氣大泄木火內燃始見必壯熱煩冤口乾舌燥經所謂冬不藏精春必病溫也故其發熱而渴不惡寒脈數盛右倍於左溫病脈多在肌肉之分不甚浮右倍於左者熱鬱在內也大異傷寒浮緊之脈若左脈盛或浮必重感風寒否則非溫症是非時暴寒耳此熱邪自內達外最忌發汗溫熱病無寒在表若誤與表散必至躁熱悶亂以至於死宜辛涼以解表熱蔥白香豉湯苦寒以泄裡熱黃芩湯裡氣一通自然作汗若舌乾便祕涼膈散或協熱下利葛根黃連黃芩湯咽痛桔梗湯心煩黃連阿膠湯此伏邪自內發無表症也其不由傷寒伏邪第從口鼻吸入而病溫者異氣所感邪由上受首先犯肺手太陰逆傳心包手厥陰或留三焦手少陽葉香岩謂溫由吸受乃手經為病非如傷寒足六經主治且傷寒多變症溫熱久在一經不移以此為辨夫肺主氣溫邪傷肺胸滿氣窒者宜辛涼輕劑杏仁桔梗栝蔞梔皮枳殼連翹挾風加薄荷牛蒡挾濕加蘆根滑石或透濕於熱外或滲濕於熱下俾風濕不與熱相搏則不貽風溫濕溫之患如辛涼散風甘淡驅濕熱勢不解則入心營而血液受劫咽燥舌黑煩渴不寐或見斑疹者宜清解營熱犀角生地麥冬石斛竹葉元參沙參青蒿兼透斑牛蒡山梔連翹銀花丹皮赤芍斑出熱不解者胃津亡也主以甘寒重則玉女煎輕則梨皮蔗漿之類若邪入心包神昏譫語目瞑而內閉者宜芳香逐穢宣神明之竅驅熱痰之結牛黃丸至寶丹蓋熱氣蒸灼瀰漫無形若藥味重濁直走腸胃全無病膈矣若氣病不傳血分而邪留三焦宜分消其上下之勢如杏仁厚朴茯苓等或溫膽湯因其仍在氣分猶可冀其戰汗解或轉瘧也若三焦不得從外解必致里結腸胃宜用下法承氣湯加元明粉若脘痞胸痛瀉心湯小陷胸湯若腹脹滿或痛邪已入里必驗其舌或灰黃或老黃或中有斷紋皆當下之承氣湯加檳榔青皮枳實之屬其病溫復感風者為風溫必陽脈浮滑陰脈濡弱風屬陽溫化熱兩陽熏灼先傷上焦上焦近肺肺氣既阻致頭脹脘痞身熱汗出宜微苦以清降微辛以宣通杏仁香豉鬱金栝蔞橘紅山梔薄荷牛蒡忌辛散劫津葳蕤湯去麻黃羌活木香若風溫誤汗身灼熱者脈陰陽俱浮自汗身重多眠鼻鼾語言難出危症也急用蔗漿麥冬白芍生地炙草玉竹阿膠之屬誤下誤火熏亦危其病溫而濕勝者為濕溫身熱頭重胸滿嘔惡足脛冷蒼朮白虎湯或滑石蘆根苡米茯苓半夏其冬行春令襲溫氣而成病者為冬溫蓋本秋燥之餘氣故發熱咳嗽喉腫咽乾痰結甚則見血與傷風之痰一咳即上者不同其脈虛緩或虛大無力亦有先病冬溫更加暴寒寒鬱熱邪則壯熱頭痛自汗喘咳陽旦湯加桔梗茯苓切忌風藥升舉其邪致咳愈劇熱愈甚遂變風溫灼熱以死亦忌辛散致咽喉不利痰唾膿血加減蔥白香豉湯調之若兼風寒外襲蔥豉湯加羌活紫蘇寒邪盛汗不出而煩擾者蔥豉湯加少許麻黃石膏若冬溫誤汗致發斑毒者升麻葛根湯加犀角元參如昏憒譫妄者大便瀉手足冷不治其病溫更遇時毒者為溫毒脈浮沉俱盛煩悶嘔咳甚則狂言下利而發斑凡煩悶躁熱起臥不安皆發斑候也傷寒溫疫諸症失於宣解邪蘊胃腑發出肌表熱毒內攻陷入營分乃發斑毒黃連解毒湯斑不透者犀角大青湯凡紅赤為胃熱人參化斑湯紫為胃傷犀角地黃湯黑為胃爛不治鮮紅起發者吉紫色成片者重黑色者凶青色者不治由失表者求之汗由失下者取乎攻火盛清之毒盛化之營氣不足助其虛而和之託之其輕者則有疹痧細碎如粟主治不外肺胃二經宜辛涼或甘寒淡滲等法皆溫症中所宜細審者春溫溫熱病不可作傷寒正治而用大汗大下初病憎寒發熱頭痛蔥豉湯得汗則解溫邪化熱傷肺上焦氣阻用辛涼輕劑梔豉芩翹杏桔花粉鬱金之屬嘔吐黃芩湯加半夏生薑濕邪內搏熱迫下泄稀水枳殼赤苓蘆根苡米滑石之屬脘中痞痛宜從開泄宣通氣滯杏蔻橘半蔞桔之屬上焦氣熱爍津涼膈散散其無形之熱勿用血藥滋膩熱傷胃津石膏竹葉生地麥冬其熱邪專在氣分必得戰汗或大渴索飲飲後熱達腠開邪從汗解但脈象和緩雖膚冷郤非脫症戰汗後脈急疾躁擾不臥膚冷汗出乃為氣脫之候更有邪勝正虛經一再戰汗而愈者葉氏溫熱論云肺主氣屬衛心主血屬營臨症者衛之後方言氣營之後方言血邪在衛汗之辛涼開肺便是汗劑到氣方可清氣入營猶可透熱轉氣如犀角元參羚羊角之類入血乃恐耗血動血直須涼血散血如生地丹皮阿膠赤芍之類否則前後不循緩急之法動手便錯且濕邪為害面色白者須顧其陽氣濕勝則陽微也雖濕邪化熱後法應清涼然到十分之六七不可過用寒涼恐成功反棄何也濕熱一去陽亦衰微也面色蒼者須顧其津液清涼到十分之六七往往熱減身寒不可遽謂虛寒而投補劑恐爐焰雖熄灰中有火也凡溫熱病救陰易通陽難救陰不在血而在津與汗通陽不在溫而在利小便較雜症自不同也如三焦不得從外解則熱結於腑必舌灰黃或老黃乃下之小承氣湯加減傷寒熱邪在裡下之猛此多濕邪內搏下之輕傷寒大便溏為邪已盡濕溫病大便溏為邪未盡至大便硬慎不可再攻以屎燥為無濕也若舌苔黃不厚而帶滑者熱未傷津猶可清熱透表若苔薄而乾者津傷也宜禁苦寒以甘寒輕劑治若熱傳營舌色必絳深紅色其絳色中兼黃白色者氣分之邪未盡泄衛透營兩和可也純絳鮮澤者胞絡受病也宜犀角鮮生地連翹鬱金石菖蒲等舌色絳而黏膩似苔非苔濕熱熏蒸為痰將閉心胞也急加芳香逐之醒頭蘭藿香鬱金菖蒲以開其閉恐昏厥為痙也平昔心虛有痰外熱一陷里絡就閉非鬱金菖蒲所能開須牛黃丸至寶丹舌絳而乾燥者火邪劫營涼血清火為要舌絳而有碎點黃白者當生疳也大紅點者熱毒乘心也用黃連金汁色絳而不鮮乾枯而痿者此腎陰涸急以阿膠雞子黃地黃天冬等救之緩則不及矣舌獨中心絳乾者胃熱而心營受爍也清胃方中加入清心之品否則延及舌尖為火盛津干也舌尖絳獨干此心火上炎用導赤散利其腑苔白而薄外感風寒也當疏散之白而干薄肺津傷也用麥冬花露蘆根汁輕清之品白苔絳底者濕遏熱伏也當先泄濕透熱防其就干也再從里透於外則變潤矣舌生芒刺上焦熱極也以絹蘸薄荷汁揩之即退者輕旋生者險舌苔不燥自覺悶極者脾濕盛也舌苔黏膩吐出濁沫者口必甜味此為脾痹乃濕熱與穀氣相搏用醒頭草即佩蘭芳香辛散以逐之即退若苔如鹼胃中宿滯挾穢濁鬱伏當急急開泄否則閉結中焦不能從募原達出矣舌黑而滑者水來剋火為陰症宜溫之若見短縮為腎氣竭欲救之如人參五味子勉希萬一舌黑而乾者津枯火熾急瀉火補水舌淡紅無色或干而色不榮胃津傷氣不化液也炙甘草湯勿用寒涼舌色紫而暗捫之濕乃熱傳營血或素有瘀傷宿血在胸膈為熱所搏宜加散血之品琥珀丹參桃仁丹皮之屬不爾瘀血與熱結阻遏正氣遂變如狂發狂症舌脹大不能出口者脾濕胃熱鬱極化風而毒延口也用大黃磨汁入當用劑內舌脹自消其舌白如粉滑四邊色紫絳者溫疫病初入募原未歸胃腑急急透解莫待傳陷而為險惡症婦人病溫有娠者保胎為要古法用四物湯加減護胎法用伏龍肝研細調塗臍下三寸干即易之熱極用井底泥塗或青布浸冷蓋腹産後慎用苦寒察其邪可從上中解者從症用之勿犯下焦恐血去多邪易內陷也至經水適來適斷熱陷血室與瘀血結少腹必滿痛小柴胡湯去參棗加丹皮延胡桃仁歸尾楂肉挾寒加桂心氣滯加香附陳皮枳殼若譫語如狂血結者身必重宜去瘀通絡若延久上逆心包胸痛不可按是血結胸也海蛤散加桃仁風溫溫症感風寸口脈大肺受熱爍宜辛涼清上杏貝梔蔞花粉沙參桑葉之屬身痛脘痹肺氣不舒梔豉杏蔞鬱金橘紅之屬頭脹咳嗽懊憹痞滿芩蔞梔豉枳桔桑葉鬱金貝母之屬熱灼劫陰煩躁麥冬白芍蔗漿生地阿膠之屬余參春溫治法濕溫傷於濕又中暑暑挾濕邪鬱蒸為熱其脈寸濡而弱尺小而急身痛頭重妄言自汗兩脛逆冷濕遏陽氣忌發汗汗之名重暍必死蒼朮白虎湯胸滿香薷飲加半夏蒼朮頭脹耳聾邪與氣混也正氣散去腹皮白朮薑棗加連翹銀花牛蒡子小便不利大便反快五苓散合白虎湯或天水散冬溫冬氣溫暖感而即發身熱頭痛不惡寒面腫咳嗽咽痛下利陽旦湯加減忌風藥升舉初感頭痛身熱蔥豉湯咽痛甘桔湯風寒外襲蔥豉湯加羌活蘇葉余參春溫治法溫毒病溫更遇時毒面赤斑如錦紋咽痛煩躁黃連解毒湯自汗而渴胃熱發斑者人參化斑湯斑已透熱不退者犀角大青湯去黃芩升麻加生地人參柴胡誤用熱藥邪毒深陷發為狂亂面赤眼紅舌黑鼻煤下利脈洪數者消斑青黛飲忌下藥惟便祕躁渴可微下之大柴胡湯凡斑疹初見胸背兩脅點大為斑粒小為疹斑屬血多疹屬氣多或陽症誤用熱藥或當下不下或下後不解皆能致之不可發汗重令開泄更增斑爛斑紫點小心胞熱也點大而紫胃中熱也斑黑而光亮熱毒盛也黑而晦者死若黑而暈腳紅者火內伏用清涼發散間有轉紅成可救者凡斑疹皆邪氣外透發出宜神情清爽為外解里和如斑疹出而昏者正不勝邪或胃津內涸有白泡如水晶者濕邪鬱於衛分汗不徹故也當理氣分之邪若毒壅消毒犀角飲大青四物湯溫症脈候溫病脈多在肉分不甚浮右脈倍於左熱氣佛郁在裡故也劉復真曰寒病傳經故脈日變溫熱不傳經故不變寒病浮洪有力易治芤細無力難治無脈不治溫熱不然溫有一二部無脈者有三四部無脈者被火所逼而伏非絶無也於病無妨照經用辛寒火散脈起病愈矣蓋溫病發在二三經始終在此更不遞傳他經其一二經或洪數他經弱且伏依經調之伏者起洪者平自愈附方涼解蔥豉湯蔥白豆豉解表熱又梔豉湯吐虛煩梔子豆豉徹熱黃芩湯黃芩芍藥甘草大棗瀉火涼膈散見前中風熱利葛根黃連黃芩湯葛根黃連黃芩甘草咽痛甘桔湯甘草桔梗除煩黃連阿膠湯黃連黃芩芍藥阿膠雞蛋黃生液玉女煎生石膏熟地麥冬知母牛膝清心牛黃清心丸黃連黃芩山梔鬱金辰砂西牛黃此萬氏牛黃清心丸與醫宗方別出宣竅至寶丹見前中風痰熱溫膽湯半夏陳皮茯苓甘草名二陳湯加竹茹枳實名溫膽湯攻裡承氣湯大黃枳實芒硝厚朴名大承氣湯去芒硝名小承氣湯消痞瀉心湯湯名有五若半夏黃連黃芩人參甘草乾薑大棗名半夏瀉心湯去熱開痞散結小陷胸湯黃連半夏栝蔞風溫葳蕤湯葛根白芷麻黃羌活杏仁甘草葳蕤川芎石膏木香濕溫蒼朮白虎湯見前中風冬溫陽旦湯麻黃桂枝杏仁甘草名麻黃湯加黃芩名陽旦湯發斑升麻葛根湯升麻葛根白芍甘草加紫草茸斑毒黃連解毒湯黃連黃芩黃柏山梔毒盛加大青透斑犀角大青湯大青犀角梔子香豉胃熱人參化斑湯即白虎湯加人參胃傷犀角地黃湯犀角生地赤芍丹皮利府導赤散生地木通甘草梢竹葉滋液炙甘草湯見前中風保胎四物湯見前中風熱陷小柴胡湯柴胡半夏人參甘草黃芩薑棗結胸海蛤散海蛤滑石甘草芒硝每服二錢雞子湯調下濕溫香薷飲見前中風濕溫正氣散見前中風利濕五苓散豬苓茯苓白朮澤瀉桂瀉濕天水散即六一散滑石六兩甘草一兩燈心湯調下加辰砂少許名益元散溫毒消斑青黛飲人參石膏知母甘草青黛黃連犀角元參山梔生地柴胡苦酒煎便祕大柴胡湯柴胡半夏黃芩芍藥枳實大黃薑棗毒壅消毒犀角飲犀角牛蒡子炒研荊芥穗防風甘草咽痛加桔梗薄荷斑毒大青四物湯大青錢半阿膠甘草各一錢豆豉百粒溫症脈案房師午園張公高年上盛下虛案牘勞神冬春不寐感溫嗆咳暈僕兩寸脈洪大由平昔陽不交陰內風上冒兼引溫邪表裡煽動症見眩僕喉痛聲啞舌如煤熏夫心為君主義不受邪因春溫傷肺逆傳心包神明俱為震動且素餌桂附致炎陽獨亢營液內劫此怔忡無寐根由師言昔病足痹徽醫用祛風藥兼桂附得效近三年矣愚謂風藥多燥況桂附乎以脈症參時令宜辛涼輕劑於熄風潤燥中佐以滋陰安神不過一劑當夜自能成寐再劑嗆嗽除悸眩止矣初劑鮮生地三錢沙參麥冬淡竹葉栝蔞仁甘菊炒山梔茯神各二錢貝母甜杏仁炒研各錢半棗仁八分蔗汁一杯諸品清輕涼潤能除上焦瀰漫之邪兼入空竅熄風火除悸眩清音平嗽若重濁便無效再劑前方加天冬玉竹百合減蔞仁六七服諸症平舌色復故後用膏方三才膏加五味核桃牛膝茯神棗仁柏子仁白芍玉竹杞子熬膏白蜜收白湯化服諸品能交心腎安神志利腰膝兼使金水相涵陰陽和平自無上盛下虛之患矣韋氏邪由鼻吸伏於募原發則頭暈痛口渴飲熱煩嘔悶溺痛帶下邪踞上中焦主以蔥豉湯散邪佐以清泄膽火豆豉蔥白山梔羚羊角嫩桑葉薄荷銀花花粉滑石二服汗出熱解此乍發散邪得解者族某溫邪內郁頭眩熱渴手心似烙舌苔淡黃寸脈浮大而數是邪留上焦宜肅清太陰氣分用黃芩酒炒川貝母杏仁山梔栝蔞仁麥冬嫩桑葉荷葉邊煎湯一啜眩渴稍定原方去芩梔加鮮石斛元參花粉蔗汁沖二服愈此溫邪上受治從氣分得解者族某邪從口入嘔渴惡熱舌膩脘痞溫從濕化宜與開泄中上豆豉蔞霜通草半夏薏苡赤苓竹茹枳殼鬱金汁沖蘆根煎湯一啜汗津津而愈同時李某症同但溺澀痛前方加燈心車前穗亦一劑愈此濕滯中上焦治從透滲得解者某脈浮大右數有汗熱熾渴眩譫煩溫邪挾風熱將陷營分用薄荷牛蒡羚羊角梔皮丹皮連翹嫩桑葉日再服夜半汗透身涼此清少陽膽熱得解者吳邪入膻中舌縮唇裂目瞑神迷沉昏不醒者七晝夜脈沉數此邪深將成內閉矣勉用鮮佩蘭菖蒲連翹銀花以解穢通閉鮮生地麥冬梨蔗汁以生津黃芩知母元參石斛以徹熱兼下牛黃丸二服神識漸清因尿管熱痛去佩蘭菖蒲黃芩加甘草梢車前穗以利腑熱而愈此清理心包熱閉得解者朱風木司天溫邪內熾脈數頭眩嗽血由木火併炎上迫竅絡舌鮮絳邪已入營用鮮生地羚羊角元參連翹山梔蔞霜貝母丹皮鮮藕三四服脈靜身涼此清營熱得解者蔣勞力傷陰感溫嗆咳不寐鼻衄痰紅下利血沫脈虛大不數誤用柴葛升散劫液動風法以甘酸平潤調之阿膠水化麥冬炙草潞參茯神白芍棗仁五味生地紅棗二服神安血止即飲糜粥原方去膠加甜杏仁山藥再劑而痊此邪傷血絡用調補得愈者族子溫邪鬱而化熱頭暈口乾舌燥唇血右脈大左模糊有汗不解胸腹悶溺渾濁熱邪蒸濕治宜上下分消淡豉蔞霜羚羊角丹皮麥冬山梔赤苓滑石嫩桑葉金銀花露二服熱輕渴減暈止舌潤但宵分譫語溺管澀痛齒燥液虛熱劫鮮石斛蘆根黑豆皮花粉天冬元參蔗汁二服疹現稀紅肺衛之邪已從外泄仍用輕清透發連翹牛蒡鮮生地丹皮赤芍沙參竹葉疹色淡忽又煩躁不寐舌心灰燥而尖絳邪入心營恐其蒸痰蔽竅急清營熱兼豁痰犀角尖磨汁生地鮮藕元參丹皮竹茹貝母菖蒲再服汗透而解此濕熱俱盛兼治肺衛心營得解者侄孫溫邪化熱頭眩痰嗽用辛涼清上豆豉杏仁貝母各錢半薄荷山梔花粉各一錢滑石赤苓各三錢加燈心桑葉二服熱退用甘涼調理胃陰得安此清降痰熱治從肺胃得解者族某溫邪逆入心包神識忽明忽昧舌乾津潤全無譫狂不近衣被欲掃熱痰熏灼急用芳香解穢犀角尖八分鮮生地一兩元參麥冬各五錢連翹山梔鬱金各二錢梨蔗汁各一杯沖再加至寶丹一丸日再服諸症立退此大劑救液開閉得解者某壯熱目赤煩冤不寐痧疹遍體急用救液養陰舌轉黑而燥厄逆昏厥服大劑犀角大黃湯加至寶丹不應仍用大劑犀角地黃湯日三四服加紫雪三分厄止厥回身涼而愈此大劑涼心瀉火得解者馬氏有年溫邪夾滯濕阻脘悶舌縮渴飲瀉汙水甚多此熱結旁流也用大承氣湯直至所下皆黑硬然後濕滯乃盡脘痞乃寬舌乾乃潤此攻蕩濕滯得解者潘伏邪內發兼旬未解譫聾肉脫自利純血唇縮舌強脈沉數邪陷血分症已瀕險急用犀角地黃湯加阿膠元參山梔鮮藕黑豆皮竹葉心四劑譫聾漸清利血止思糜粥矣此伏邪治從血分得解者陳姓兒周歲感溫邪熱內閉舌絳津干用麥冬連翹梔心菖蒲竹茹加紫雪二分汗解而愈此直瀉心包邪熱得解者李寒熱微汗口渴嗆嗽脈浮洪乃春溫犯肺用辛涼輕劑為手太陰治法山梔淡豉桔梗花粉杏仁象貝桑皮蜜炙薄荷蔗汁沖二服嗽減去梔豉桔粉加栝蔞橘紅前胡服愈此邪干肺從衛分得解者何氣粗目赤舌絳疹紅神機不發脈洪數宵煩無寐邪已入營急宜清透若再消導劫津必至液涸成痙犀角汁鮮生地天冬麥冬元參赤芍丹皮連翹藕汁菖蒲日三服汗徹熱退神識亦清但右脈長大胃火猶燔用石膏白芍黃芩知母甘草大便數次脈較平寐中手指微搐乃液虛風動欲成痙也用阿膠水化生地鉤藤當歸白芍石斛棗仁數劑症平此營虛用滋液熄風得愈者王夏至前驟暍邪從吸入踞募原熱渴引飲中脘格拒熱蒸濕騰嘔悶午煩舌膩白脈數溺渾是濕勝也治先滲濕於熱下則熱勢孤矣用藿梗佩蘭以逐穢通草滑石蘆根以驅濕栝蔞貝母以滌痰羚羊角山梔丹皮以清膽火鮮生地連翹麥冬以瀉心火日再服汗出溺清嘔悶除熱渴減然脈仍疾數兩寸大時煩不寐是欲發疹也明晨疹出舌苔轉黃是熱勝也治在透熱於濕外則濕不升矣原方去藿蘭通草滑石蘆根羚羊等加黃芩梨汁以清肺牛蒡銀花連翹赤芍以透疹青蒿石斛知母沙參以退熱生津二三服汗徹脈勻舌黃退日用大麥仁粥熱啜陰復全瘳此分利濕熱清涼疹毒得解者風溫脈案王氏七旬有三風溫傷肺頭暈目瞑舌縮無津身痛肢厥口乾不飲昏昧鼻鼾語言難出寸脈大症屬痰熱阻竅先清氣分熱邪杏仁象貝花粉羚羊角沙參嫩桑葉竹茹山梔一服症減肢和但舌心黑而尖絳乃心胃火燔懼其入營劫液用鮮生地犀角汁元參丹皮麥冬阿膠煨化蔗汁三服舌潤神蘇身涼脈靜但大便未通不嗜粥飲乃灼熱傷陰津液未復繼與調養胃陰兼佐醒脾旬日霍然冬溫脈案湯高年冬溫犯肺醫用傷寒發表致燥渴熱煩又進柴葛解肌嗆咳痰多竟夜無寐夫傷寒傳足經溫邪犯手經原不同治況溫邪忌汗表散即是劫津診脈虛數目赤舌絳溫已化熱再令液涸必延昏痙宜甘潤生津苦辛降氣麥冬杏仁栝蔞山梔知母貝母桑皮橘紅二服熱減嗽定因小溲赤澀去桑皮加沙參赤苓木通百合煎湯再經調理而康李冬溫表熱傳裡唇燥舌乾渴飲嘔沫大便迫瀉稀水無度脈濡緩乃濕甚生熱飲以鮮蘆根湯隨用黃芩栝蔞通草赤苓車前子豬苓半夏曲數服嘔渴自利悉定去豬苓夏曲加滑石燈心滲利濕熱而愈景氏冬溫挾虛灼熱咳嗽因誤治邪陷營分便血甚多陰液內涸舌黑齒焦神機不發脈左虛數右浮疾耳聾目瞑頰紅遺溺失禁此陰欲竭而孤陽浮也急救液以存陰用生地犀角汁五味子阿膠沙參麥冬石斛雞子黃三服能呻吟轉側第脈虛全不受按去犀角加洋參茯神棗仁白芍再服舌潤神清不飢不食此上脘熱痰結也再加川貝蔞霜嗣因肺虛氣不化液用復脈湯去薑桂麻仁加歸芍濁痰降大便得行脈勻有神而納穀頗少此脾陽困而未蘇也改用潞參茯神炙草白朮穀芽歸芍蓮棗而食進耿深秋陰瘧冬初重感異氣寒熱嘔悶醫謂傷寒發表不應即用承氣更加蒼朴頭暈壯熱煩渴下利更醫亦謂傷寒漏底症屬不治延至目閉語譫唇泡齒黑舌乾焦而縮伊祖系豫隔邑從姑丈年八十矣來曰三子僅存此一線今病至危奈何診脈右虛數左弦數豫謂此溫邪耳病在上焦只宜輕劑疏解氣分硝黃苦寒直降與無形瀰漫熱邪何干蒼朴溫燥劫津助灼今液涸神昏邪入心包急速生津清熱掃滌心包痰阻庶望轉機犀角五分磨汁鮮菖蒲三錢搗汁沖服山梔連翹各八分鮮生地鮮石斛各五錢沙參蔞霜麥冬貝母各二錢竹茹三錢一服舌潤神蘇熱減因小水短赤原方加元參二錢燈心車前各五分再服熱退索食頤下腫痛是名遺毒由感症初失於疏理仍須清解主治用豆豉桔梗花粉竹葉牛蒡貝母翹陳歸草數服而消袁陰瘧數年既傷生冷更感異氣始則寒熱咳喘繼則譫煩不寐上則唇燥舌灰鼻煤中則咳嘔胸脅牽痛下則遺溺自利汙溏脈弦大數醫不識何症漫言陰虛垂絶舉家哀懇勉疏蛤粉熟地補劑豫謂此溫邪化燥三焦皆受豈堪澀膩壅邪治以疏泄則愈安得此脈便死耶因思邪從上受取之上用薄荷山梔桑皮杏仁蔞仁貝母橘紅石斛梨皮赤苓燈心明晨嗽煩悉定胸脅痛平舌苔浮潤矣越三日因心事棖觸午寒晡熱氣粗語譫脈弦大而浮舌心干唇齒燥豫謂脈易得汗但須救液以清心胃燔灼先用生地天冬麥冬犀角花粉石斛蓮子心等再診胃脈大舌心無潤用石膏知母竹葉生白芍二冬等脈候乃平汗出熱退七八逾日舌尖再見干絳印堂發出紅斑仍屬心陽熾盛隨用生地鮮藕阿膠另化菖蒲元參丹參天冬防其熱陷心營二服舌尖潤紅斑較淡後用生地阿膠生鱉甲丹皮白芍青蒿等汗徹身涼調理而平熱症論治夏至前發為溫症夏至後發為熱症二症有因冬時伏寒有因當時乍感其冬月傷寒至春夏變為溫熱者邪有淺深則發有遲速柯韻伯曰凡病傷寒而成者根實種於鬱火其人腎陽有餘好行淫欲外傷於寒虛陽陷入陰中冬不遽發寒日少而蓄熱淺則陽火應春氣而病溫寒日多而鬱熱深則陽火應夏氣而病暑沈芊緑曰春溫有不盡由伏寒由現感春時之邪而病亦名溫者夏熱有不盡由伏寒由現感夏時之邪而病亦名熱者皆自內達外無表症若有表症必重感外邪溫病以黃芩湯為主方因春溫之發當少陽司令也熱病以白虎湯為主方因夏熱之發當陽明司令也且熱甚於溫必以白虎湯重為肅清以其時方炎暑其症不惡寒反惡熱自汗而渴脈洪大故以石膏之辛寒清胃腑蘊蓄之熱以知母之苦寒淨少陽伏邪之源以甘草粳米之甘平保肺胃之氣而熱可除也若舌上苔滑者尚有表邪梔子豉湯主之若渴欲飲水口乾舌燥者熱在裡必耗津人參白虎湯主之如惡熱煩渴腹滿舌黃燥或乾黑者宜下涼膈散承氣湯熱兼暑濕者涼膈散合天水散小便不利者竹葉石膏湯其感夏令之邪當時即發者邪由口鼻吸入治在手經不當用足經方其法與前乍感溫症條同參方見溫症熱脈案侄夏至後伏氣自里而發熱渴心煩頭汗氣促舌灰疹現厥逆譫語脈濡數夫濡為濕數為熱里邪蒸濕則為頭汗濕邪鬱熱則為渴煩邪壅肺竅則為氣促為紅疹干心包則為譫語為舌灰其手足厥逆乃熱深厥深誤用風藥升舉助邪遂致暈厥無寐躁擾宜清營中伏邪犀角汁羚羊角丹皮鮮生地鮮藕元參茯苓赤芍日再服汗透脈和諸症悉退調理得平族女熱症脈緩而濡濕甚於熱頭暈目瞑唇㾦齒燥胸腹滿痛濕蒸為熱小溲赤澀三焦皆邪勢瀰漫況疹現肢厥急須透解勿使熱釀濕痰矇蔽膻中致成內閉危症所用枳朴墮損胎元柴葛乃傷寒足經藥與三焦無涉醫不中窾焉望獲效通草豆豉羚羊角蔞霜麥冬連翹牛蒡山梔赤苓燈心鮮蘆根二服熱勢退手足和去通草香豉羚羊連翹蒡梔加鮮生地鮮石斛沙參象貝黃芩以防熱邪內陷兼以護胎數服汗解而愈幼孫晡熱頭暈汗渴煩躁脈洪數用大劑白虎湯加羚羊角一啜汗透而愈侄少陰伏邪內發壯熱煩冤頭目如蒙耳聾舌尖絳唇紫口乾手心如烙脈浮洪溢指外右尤甚交巳午刻症重初用辛涼以泄衛熱如薄荷露甘菊竹葉杏仁梔皮豆豉之屬頭目略清微汗不徹脘痞痰沫用疏利以滲痰濕如枳殼大貝蔞霜通草蘆根燈心之屬痰稀溺爽而臂膊紅疹隱現胸背全無再加清透之品如赤芍丹皮連翹牛蒡青蒿麥冬之屬疹雖淡而舌心灰膩舌尖紅暈必心胃火燔用導赤散加石膏午前服向晚防其邪入心營用透營救液法如犀角尖磨汁鮮生地鮮石斛元參花粉丹皮沙參之屬舌色未退轉益乾燥脈洪長防其入腑急用涼膈散芒硝改元明粉去甘草大棗得便二次里結乍通熱勢較退而神迷昏寐脈數譫語乃熱心包慮其蒸痰內閉用犀角汁下至寶丹及牛黃清心丸以宣竅驅熱數脈減再用清鎮神明佐豁痰通絡如血珀石決明茯神羚羊角象貝杏仁竹茹夜交藤通草之屬神識稍清脈仍浮大巳午為甚額顴疹現喜其邪從外解再與清透用茅根梨藕汁服明早浮脈稍斂灰舌轉潤決其陽極於午必俟夏至陰生陽退乃冀轉機且舌尖暈痕未消溺後色變渾濁用黃連人中黃山梔赤芍麥冬之屬加六一散沖服微汗脈平身始涼解乃用燕窩湯及粥飲調理漸次培養胃陰得安此症乃熱兼疫邪余於丙夏因診視時邪染恙寒熱脈浮大服梔豉蔥白湯胸背汗三日後熱甚渴煩少寐舌苔黃變黑服犀角羚羊角竹葉蘆根藕蔗諸汁熱稍平逾夕復壯熱譫語神昏服至寶丹分半鮮菖蒲根汁下神稍清又用前各汁加洋參鮮生地象貝龜板青蒿連翹滑石清營滋液專驅痰熱兼瀉三焦舌黑頗淡但汗出微涼汗收仍熱脈數氣粗煩擾竟夕又服至寶丹分半神未定直視氣促再服前丹二分半昏睡進洋參湯汗出熱退但舌心干用石膏煎清胃加梨藕汁稍津潤逾日目赤舌再灰黑神再煩擾改服牛黃清心丸二分橘紅湯下得寐專服洋參藕蔗汁麥冬橘紅湯寐熟熱輕再啜洋參湯汗出涼解越五宿欲大便以蜜煎導當夜感寒復熱舌苔如粉吐痰欲嘔此為復感用半夏曲杏仁茯苓紫蘇薄荷佩蘭葉加薑熱未退口燥脈數煩擾不寐再服牛黃清心丸五分犀角磨汁沖服逾日大汗如雨乃涼然已兼旬外矣此案芝本日記附志之見熱邪之劫爍津液甚熾也憶是夏坐臥樓窗吸受暑暍更加傳染病中苦熱見曦炎出如膏自焚口占七絶日十餘首有自笑吳牛喘明月簷稍怕見石榴紅之句左氏謂明淫心疾良不豫欺暑症論治冒暑傷暑中暑中暍夾暑暑風暑厥暑瘵疰夏濕溫暑瀉暑瘍伏暑附暑為陽邪感之者從口鼻吸入先阻上焦氣分則為頭脹脘悶漸至面垢舌苔煩渴自汗熱則氣泄或嘔惡腹痛泄瀉肢冷倦怠少神經所謂熱傷氣也仲景言傷暑脈虛夫肺主氣夏火鑠金則肺傷而氣虛心主血暑先入心則煩汗而脈虛此千金生脈散所以重保肺而清心也經云因於暑汗煩則喘渴靜則多言蓋暑內擾於營則汗上迫於肺則喘內干於心則言多知暑邪始傷肺繼傳心包也節齋曰夏至後病熱為暑相火行令人感之自口齒入傷心包絡經煩渴而熱頭痛自汗甚者火熱制金不能平木搐搦不省人事名曰暑風張兼善曰清邪中上濁邪中下其風寒濕皆地之氣系濁邪所以俱中足經惟暑乃天之氣系清邪所以中手少陰心經暑本屬火而兼風寒濕燥其傳變為瘧痢霍亂而條其淺深同異變症則有冒有傷有中有中暍暑風暑厥暑瘵濕溫之不同其感而不即病者至秋時為伏暑其候寒熱苦悶午後為甚日暮更劇得汗則減治不合法熱熾則傷陰化燥濕滯則傷陽化濁以致神昏內閉脘痞肢厥斯危候矣葉香岩宗河間三焦立法在上以辛涼清解如竹葉連翹杏仁薄荷梔皮鬱金沙參鮮荷葉在中以辛苦宣通如半夏瀉心湯之屬在下以溫行寒性質重開下如桂苓甘露飲之屬此治三焦之大旨也更宜細審邪在氣分營分治氣分有寒溫之別寒則宗白虎湯及天水散溫則從二陳湯及正氣散理營有清補之宜清則犀角地黃湯加入心之品補則如三才湯人參固本丸復脈湯又如濕熱沉混宜蒼朮石膏湯氣血兩燔宜玉女煎宣閉逐穢宜至寶丹牛黃丸紫雪等扶虛養正如參附湯及兩儀膏隨其變幻審其陰陽而治要得矣冒暑腹痛水瀉系胃與大腸受之香薷飲噁心者胃口有痰飲也香薷飲下消暑丸此暑病之輕者傷暑由靜而得之陰症也傷暑則暑邪傷及肉分納涼廣廈起居不時惡寒肢厥面垢煩躁汗出脈虛細清暑益氣湯或過襲陰涼惡寒頭痛肢體拘急膚熱無汗脈弦緊消暑十全散或外感暑邪內傷生冷腹痛吐利正氣散六和湯身熱煩渴小便不利乃濕盛而氣不施化益元散煩熱頭痛燥渴乃濕蒸而熱耗津液麥冬湯此暑病之稍重者中暑由動而得之陽症也中暑則暑邪傷及臟腑夏日遠行陽氣內伏熱舍於腎水不勝火煩渴喘促猝然昏暈用蒜搗汁和童便灌下待蘇醒後隨症用藥麥冬湯或人參白虎湯忌用香薷辛溫之品香薷飲可治傷暑不可治中暑此暑病之尤重者中暍行旅農夫日中勞役忽頭痛壯熱汗泄肌肉如火大渴引飲無氣以動乃熱傷元氣益元散白虎湯或清暑益氣湯若吐瀉脈沉微不宜用涼藥六和湯大順散脈虛身熱得之傷暑脈盛身熱得之中暍此暑與暍微有辨也內傷夾暑暑月房勞兼膏粱水果雜進致陽氣不得伸越脈沉細或弦緊面垢無汗惡寒四肢厥逆拘急霍亂嘔吐冷香飲子或吐利兼作脈微欲絶急宜漿水散溫之又有暑痿症暑月膏粱之人陽事頓痿不可全用熱藥亦不可全用涼藥黃連解毒湯合生脈散暑風因病暑忽手足搐搦昏迷不醒脈浮虛急先以溫水化蘇合香丸灌之俟醒再用藥黃連香薷飲加羌活大效此因痰火鼓風矇蔽心包若嘔吐前藥加陳皮藿香小便不利加茯苓豬苓澤瀉滑石痰多加石菖蒲薑汁口渴去半夏加花粉瀉利加白朮轉筋加木瓜腹滿身重難以轉側口不仁面垢譫語遺尿此熱兼暍也白虎湯暑厥中暑手足逆冷二香散或人參羌活散合香薷飲有熱深厥亦深煩躁昏冒便祕溺赤脈沉滑而數者大小承氣湯加減有濕熱沉混者蒼朮白虎湯加滑石若寒厥脈微者理中湯四逆湯加減暑瘵暑熱劫陰咳血吐血六味湯加阿膠麥冬丹皮或杏仁西瓜翠衣竹葉鮮石斛疰夏夏月患頭痛足軟食少體羸倦怠嗜臥五心煩熱多屬元氣不足補中湯去升麻加半夏白芍薏米五味子沙參肺胃陰虛生脈散或加玉竹杞子扁豆石斛等甘潤之品濕溫其人傷濕因而中暑兩脛逆冷胸滿頭重妄言多汗脈陽濡而弱陰小而急切不可汗汗之必死蒼朮白虎湯又有冷水澡浴致暑濕相搏一身盡痛自汗發熱五苓散加羌活若冒暑作勞乘汗冷浴身痹如針刺間有赤腫處或發水泡者六和湯加蒼朮荊防暑瀉暑傷腸胃或挾食挾濕煩渴溺赤腹痛陳瀉如水桂苓甘露飲加減久瀉者玉龍丸暑傷心脾嘔瀉浮腫霍亂轉筋六和湯暑熱引飲過多致水暑交併上吐下瀉解暑三白散傷暑吐瀉兼煩亂香朴飲子脾胃停積冷濕致成吐瀉大順散若暑盛傷於外陰冷傷於內內外受迫連理湯桂苓丸縮脾飲暑瘍暑月頭頂赤腫咽喉腫痛或腿足焮腫長至數寸不堪步履日夜發熱敗毒散熱解腫自消暑瘡發泡由濕熱入經腠黃連解毒湯香薷飲伏暑秋髮為伏暑初由口鼻吸受繼而內結募原至伏邪為新涼引動頭痛脘悶漸至唇燥齒乾烈焰內燔陰津消灼內熱煩冤忽然鼻冷氣窒夫暑穢熏蒸則為黏涎遏鬱則為厥冷得汗則涼然有一厥而熱便得汗解者有再厥三厥四厥而熱但頭汗出者有四末不和身溫而躁擾益甚者蓋邪伏募原之裡熱內結外反不熱仲景所謂熱深厥亦深也若用苦寒直降竟走腸胃與膈上結邪無干宜山梔石膏天冬淡竹葉枳殼栝蔞鬱金汁等味若初但氣分阻痹手太陰肺宜治上焦宜杏仁貝母薄荷薏米滑石通草半夏橘皮厚朴等味若由氣分延及血分神呆舌縮鼻煤唇血邪已逆走膻中包絡心主既入營絡神識漸昏內閉外脫危期至速急宜石菖蒲犀角尖磨汁連翹元參鮮生地金銀花露等或芳香逐穢宣竅如藿香佩蘭鬱金牛黃丸至寶丹紫雪等若熱痰黏膩用竹瀝貝母橘紅栝蔞花粉沙參甘草蔗梨汁俱可選用最忌脈象澀數正虛邪陷手足厥逆神昏液涸若溺短自利潮熱不解中下焦均受或參用六一散四苓散然總以清理上中焦為要治暑暍汗液大泄中氣先傷雖有膈滿潮熱最忌攻下以無形之熱不能隨藥攻散也雖有頭額重痛最忌發汗以表藥皆能升舉痰食濁氣支撑膈上也許學士治濕溫病胸項多汗兩足逆冷譫語其脈關前濡關後數此先受暑後受濕暑濕相搏濡弱見於陽部濕氣搏暑也小急見於陰部暑氣蒸濕也許氏以關前為陽關後為陰紀氏以浮為陽沉為陰是名濕溫先以白虎人參湯次用白虎加蒼朮湯頭痛漸退足漸溫汗漸止三日愈孫兆治濕溫病遍身皆潤兩足冷腹滿不省人事脈小弱而急以五苓散合白虎湯十餘劑少蘇更與清燥湯調理而安凡陰病厥冷脛臂皆冷今脛冷臂不冷故知非下厥上行是陽微寒厥而合用祛熱藥也張石頑曰中暍用白虎湯熱傷氣之治也用人參白虎湯兼傷無形之氣也中暑用生脈散暑傷無形之氣也用清暑益氣湯暑傷於氣兼挾風熱乘虛傷其經也傷暑用十味香薷飲風熱濕合而傷形氣也偏於表則變香薷飲為消暑十全偏於里則變香薷飲為六和湯此夏月鼎峙三法其用消暑丸者上盛之濕泛濫而為痞滿也用益元散者下盛之熱阻滯而為溺澀也用大順散者水果傷於脾也用冷香飲子者冷食內傷於胃也用來復丹者陰氣固結於下也用五苓散者陽氣遏絶於內也暑症脈候暑脈虛而微弱或虛大而散或隱伏仲景以弦細芤遲為傷暑皆虛類也活人書曰中暑與熱病相似但熱病脈盛中暑脈虛以此辨之附方開痞半夏瀉心湯見前溫清熱桂苓甘露飲肉桂茯苓豬苓白朮澤瀉名五苓散加石膏滑石寒水石名桂苓甘露飲中暍白虎湯見前中風瀉暑天水散見前溫除痰二陳湯見前中風調中藿香正氣散見前中風涼血犀角地黃湯見前溫滋陰三才湯天冬地黃人參名三才湯再加麥冬生地黃蜜丸名人參固本丸滋液復脈湯見前中風濕熱蒼朮石膏湯即蒼朮白虎湯見前中風生津玉女煎見前溫宣竅至寶丹見前中風清心牛黃丸見前溫開閉紫雪丹黃金十兩或真金葉煮取汁一斗去金入石膏寒水石磁石滑石各五兩以四味搗入前汁煮五升去渣入烏犀角鎊羚羊角鎊木香沉香研各五錢元參升麻各一兩六錢甘草八錢丁香搗一錢以八味入前汁煮取一升六合去渣入芒硝焰硝各二兩入前汁中微火煎以柳木槌攪不住手候熬至七合半傾入盆中半日欲凝入硃砂研細水飛五錢麝香當門子研一錢二分攪勻候結成霜紫色鉛罐收貯每服一分至二分冷水或薄荷湯下能治一切實火閉結狂越躁亂口舌生瘡回陽參附湯人參附子補潤兩儀膏人參熟地熬膏白蜜收除濕四苓散白朮茯苓豬苓澤瀉加桂名五苓散冒暑香薷飲見前中風滌飲消暑丸半夏茯苓甘草薑汁糊丸傷暑脈虛清暑益氣湯黃耆人參白朮蒼朮神麯青皮陳皮甘草麥冬五味子當歸黃柏澤瀉升麻葛根薑棗襲寒消暑十全飲香薷一錢半扁豆厚朴蘇術赤茯藿香木香檀香各一錢甘草五分食傷六合湯香薷厚朴扁豆甘草赤茯藿香砂仁木瓜人參半夏杏仁薑棗清燥麥冬湯石膏知母茯苓白芍山梔竹茹麥冬白朮扁豆人參陳皮烏梅蓮子甘草夾暑大順散乾薑杏仁官桂甘草內傷冷香飲子生附子草果橘紅甘草各一錢薑五片水煎冷服溫里漿水散肉桂附子乾薑甘草各五錢良薑半夏各二錢五分漿水即淡醋調藥末每服一錢暑痿黃連解毒湯見前溫保肺生脈散人參麥冬五味子暑厥二香散香附香薷各二錢蘇葉蒼朮陳皮各一錢厚朴扁豆甘草各五分木瓜二片蔥薑暑風人參羌活散二活二胡參苓芎草枳殼桔梗各六分天麻地骨薄荷各三分胃實大小承氣湯見前溫寒厥理中湯見前中風回陽四逆湯生附子乾薑甘草蔥冷服暑瘵六味湯見前中風氣虛補中益氣湯見前中風久瀉玉龍丸硫黃硝石滑石明礬水丸暑瀉解暑三白散茯苓白朮澤瀉各二錢薑三片燈心二十莖瀉煩香朴飲香薷厚朴扁豆甘草赤茯澤瀉陳皮木瓜半夏人參烏梅蘇葉薑棗理中連理湯理中湯加茯苓黃連止瀉桂苓丸肉桂茯苓蜜丸祛暑縮脾飲砂仁錢半草果烏梅香薷甘草各一錢葛根扁豆各七分薑五片濕溫清燥湯人參黃耆白朮茯苓甘草當歸麥冬五味子生地升麻豬苓神麯柴胡蒼朮黃柏澤瀉黃連陳皮暑脈案吳脈虛傷暑得汗身涼頭眩神疲懈言不食溺少而痛生脈散合六一散主之潞參五錢麥冬三錢五味五分赤苓二錢滑石甘草各六分荷葉一張燈心三分玉竹錢半二服效族某感暑頭暈微熱額汗左脅痞硬湯飲格拒不下脈濡澀此中焦氣阻濕聚用香薷飲加減香薷厚朴杏仁枳殼栝蔞橘白半夏薑製薄荷梗二服痞硬除熱眩減去朴枳蔞夏加梔子丹皮苓薏米燈心再劑而瘳厲氏暑熱傷氣勞倦食少煩滿口乾下部骨蒸足心如烙仿清暑益氣湯加減潞參麥冬五味陳皮神麯當歸生地沙參地骨皮數服效李暑症用傷寒六經治法致壯熱煩冤頭目重脹喉梗氣窒呼吸不利舌白不飢夫暑暍所傷必脈虛少氣自汗面垢縱有兼症大異傷寒浮緊脈象豈堪例治逮失治而症加重本症尚自顯然何者暑入心故煩冤暑挾濕故重脹暑犯肺故氣窒不利葉氏所謂暑由鼻吸必傷上焦氣分每引經義云自上受者治其上法宜辛涼微苦廓清上焦氣分自愈黃芩酒炒八分黑山梔橘白鬱金磨汁各一錢栝蔞仁麩炒赤苓各二錢薄荷梗八分沙參薏仁各三錢新荷梗五錢二服頭清咽爽煩熱大減去黃芩鬱金加麥冬鮮藕渴熱退而思食矣族某有年力農中暍惡熱無汗腹痛自利唇乾肌稿舌焦而燥脈小數乃熱爍肌消陽津陰液俱涸也經曰熱淫於內治以鹹寒佐以苦甘用花粉麥冬沙參黃芩酒炒枳殼白芍丹皮鮮石斛甘草三服舌潤利稀腹不痛身熱減去沙參黃芩枳殼加青蒿知母酒炒滑石赤苓生地車前子燈心數服熱退利止厄逆間作少寐此胃虛有痰用淡竹茹杏仁潞參茯神當歸白芍柿蒂橘紅棗仁二服厄止熟寐又調補乃平族某稟賦素弱中年暑熱傷氣神倦嗜臥食少肢麻聞腥欲嘔脈右虛左促按東垣論長夏濕熱損傷元氣肢倦神少足痿軟早晚發寒厥日午熱如火乃陰陽氣血俱不足也此症雖未至甚然熱傷元氣久則水不勝火發為骨痿先服清暑益氣湯蒼朮改生白朮去澤瀉升麻乾葛加歸芍半夏石斛茯神後服生脈散又服大補元煎加橘絡桑枝膏丸服而安張暑熱作勞汗泄面垢初起吐蛔厥陰受病已非淺恙消導表散延至譫妄神昏舌心灰而尖絳齒燥鼻煤津液告涸脈虛細澀數邪陷營絡治者徒知下焦火亢用黃柏知母苦寒直降與心包襲入暑邪全不相涉更醫用羚羊角陳海虴泄膽熱而降肺火究竟治不中病使熱邪漫布神明漸昏昔人治邪入心包每用芳香宣竅逐穢如至寶丹之類若得痰熱淨掃如清風捲霧神識稍開方不至內閉外脫然症險難挽姑據理論治而已犀角尖磨汁沖連翹心赤芍丹皮佩蘭葉琥珀石菖蒲搗汁沖鮮荷梗煎服明晨頗覺神氣清爽更酌加梨皮燈心麥冬銀花煎送至寶丹乃窮鄉一時竟同返魂香無覓處矣王脈不鼓指渴不多飲舌尖絳身熱語譫肢冷溺渾赤伏暑晚發熱深厥深之象川連酒製三分元參連翹山梔麥冬各錢半石斛梨肉赤苓各二錢燈心滑石各四分一服而手足溫譫語息去川連加生地再服再汗而解幼兒伏暑秋髮頭痛壯熱燥渴引飲自汗手足心如烙脈洪而疾溺赤而濁由素稟陰虛伏邪內爍仲景所謂陰氣先傷陽氣獨發不寒痹熱令人肌肉消爍者也宜甘寒生津以解熱煩用生地知母麥冬石斛丹皮花粉甘草鮮蘆根鮮荷梗一服汗徹身涼越日再發覺熱氣由腹背上蒸頃刻如焚一日夜渴飲唇乾前方去丹皮荷梗加石膏一服熱退越日又發一日兩夜汗出熱不解去石膏加鮮地黃緑豆皮車前穗又服又退越二日夜分又發熱勢較輕原方再加通草滑石青蒿半夜熱退調理而安暑必挾濕此症歷四五發於清暑中必兼利濕方得熱退涼解按暑濕傷人隨發者淺遲至秋後為伏氣晚發者深其候脈色必滯口舌必膩或微寒或單熱頭重脘痞渴煩溺濁午則甚暮尤劇一次汗則邪一次散比傷寒勢較緩比瘧疾發無時秋來此症最多名曰伏暑晚發不似風寒之邪一汗輒解溫熱之症投涼即安以暑濕為熏蒸黏膩之邪故難驟郤耳湯氏灼熱無汗下瀉後重舌乾少潤脈緩大乃濕熱交蒸用六一散加薄荷青蒿麥冬藿香赤苓石斛緑豆皮車前穗燈心一啜熱退去首四味加豬苓枳殼瀉止濕症論治風濕濕熱寒濕暑濕中濕附濕為陰邪乃重濁有質不比暑熱瀰漫無形其自外受者霧露泥水由地氣之上蒸經所謂地之濕氣感則害人皮肉筋脈也自內生者水穀生冷由脾陽之不運經所謂諸濕腫滿皆屬於脾也濕蒸於上則頭脹如蒙經所謂因於濕首如裹也濕感於下則跗腫攻注經所謂傷於濕者下先受之也在經絡則痹痿重著經所謂濕熱不攘大筋緛短小筋弛長緛短為拘弛長為痿也在臟腑則嘔惡腫脹小水赤澀經所謂濕勝則濡瀉也又或在肌表則惡寒自汗在肉分則麻木浮腫其身重如山不利轉側腰膝腫筋骨痛小溲祕大便溏則有濕兼風者有濕兼熱者有濕兼寒者有濕兼暑者有中濕而口喎舌強昏不知人類中風者不得誤作中風症治在表在上宜微汗在裡在下宜滲泄中虛宜實脾挾風而外感者宜解肌挾寒而在半表半裡者宜溫散挾暑熱而滯於三焦者宜清利分消其濕熱蒸痰內閉昏厥者宜宣竅逐穢此治濕之要也濕阻上焦頭脹脘悶不飢溺澀宜開肺氣通膀胱桔梗通草滑石半夏栝蔞厚朴杏仁蔻仁薏米茯苓香豉淡竹葉等濕滯中焦腸胃屬腑濕久生熱傳送既鈍大便不爽宜主溫通佐淡滲如枳殼砂仁殼橘白草果藿香半夏曲大腹皮豬苓澤瀉之類脾陽不運濕鬱腹膨用朮朴薑半之類以溫運之以苓澤腹皮滑石之類以滲泄之兼寒實脾飲兼風勝濕湯濕痰阻竅濕鬱蒸痰神呆語謇宜主開鬱佐辛香鬱金石菖蒲厚朴半夏佩蘭金銀花茯神栝萎枳殼之類神昏內閉邪入心包宜芳香宣竅佩蘭銀花露犀角連翹心等送至寶丹濕流關節體酸骨痛不利屈伸獨活寄生湯羌活勝濕湯其夾風者必加煩熱流走拘急防風湯夾寒者必加攣痛浮腫五積散加減風寒濕合則成痹詳痹風濕一身盡痛屬風濕相搏除濕羌活湯肢體煩痛頭重鼻塞或瀉利或下清血為風木之邪內乾溼土神術湯脈浮身重汗出惡風防己黃耆湯仲景論風濕之脈浮虛而澀濕熱脈滑數溺赤澀引飲自汗屬濕熱宜主清火佐分利清熱滲濕湯或小分清飲濕盛身痛溺澀體重發渴五苓散加羌活身黃如橘色溺澀腹微滿茵陳蒿湯身黃溺澀而渴五苓散加茵陳煩熱溺澀而渴桂苓甘露飲濕熱相搏清熱滲濕湯肩背沉重肢節煩痛或遍身痛腳膝腫痛屬外因濕熱當歸拈痛飲濕熱之內因則水腫小便不利五苓散神芎丸之類分輕重之泄後用實脾之劑調理六君子湯異功散陰虛多火兼走精者濕襲精竅也虎潛丸或加白朮牡蠣有氣如火從腳下起入腹屬濕鬱成熱二妙丸加牛膝防己叔和脈經云濕熱之脈滑疾寒濕脈不滑數溺清便利身痛無汗關節不利牽掣作痛屬寒濕宜溫利七味滲濕湯五苓散脈虛者宜溫補理中湯加茯苓薏米四肢浮腫不利屈伸大便多溏除濕湯或升陽除濕湯腰痛身重小便不利腎著湯如寒熱之氣中於外此與內生之濕不同宜溫而兼散五積散或加味五苓散叔和脈經云脈大而浮虛而澀皆寒濕暑濕溽暑釀濕嘔吐瀉利六和湯先傷於濕因而中暑兩脛逆冷胸滿頭重妄言多汗脈陽弱陰急病名濕溫切不可汗蒼朮白虎湯仲景論中暑之脈弦細芤遲若兼濕則虛濡或虛澀中濕關節重痛浮腫喘滿腹脹昏悶不知人脈必沉緩或沉微屬中濕除濕湯有破傷處因澡浴濕入瘡口昏迷沉重身強直口噤狀類中濕名破傷濕白朮酒或用煅牡蠣粉二錢甘草湯調服仍取粉敷瘡口叔和脈經云脈沉而緩沉而細皆中濕沈氏云濕在上宜防風風能燥濕也濕在中宜蒼朮土乾燥濕也濕在下宜利溺開溝利濕也濕在周身宜烏藥羌活濕在兩臂宜桑條威靈仙濕在兩股宜牛膝防風萆薢分部位治之其傷濕由腎虛者腰冷如坐水中腎著湯由脾虛者腹滿吐酸苓薑朮桂湯體氣虛弱者身重便溏清燥湯酒濕者嘔瀉發熱葛花解酲湯坐臥濕地當風涼足膝拘攣者獨活寄生湯年老衰憊婦人腎虛血竭致腰腳痛者獨活寄生湯脾胃不和伏濕水瀉者加味平胃散脾濕泄瀉者胃苓湯蒼朮丸濕家治法大概宜發微汗利小便使上下分消仲景謂濕家忌汗以身本有汗易至亡陽故濕溫症誤發其汗名曰重暍所宜深戒然久冒風涼以水灌汗遏郁生陽又不得不微汗之不可大發汗大發汗則濕去熱留防其變症東垣謂治濕不利小便非其治也然真陽素虛之人汗出小便滴瀝正泉竭而陽欲亡之候若以為濕熱而大利之真陽無水頃刻脫離而死矣不宜過利第去其六七即改用理脾之劑否則虧其腎水羅氏曰春夏之交病如傷寒其人汗自出肢體重痛轉側難小便不利此名風濕因時令陰雨或坐臥卑濕或引飲過多宜利小便五苓散濕去則愈切忌汗下誤則不救醫不識症誤作傷風治之發汗死下之亦死丹溪曰濕本土氣火熱能生濕土故夏熱則萬物潤秋涼則萬物燥也夫熱鬱生濕濕生痰用二陳湯加酒黃芩羌活防風去風行濕以風能勝濕也又曰濕甚而熱治以苦溫佐以甘辛平胃散主之濕在上宜微汗而解不欲汗多忌麻黃葛根等宜防己黃耆湯濕在中下宜利小便五苓散主之此淡滲治濕也濕症脈候傷濕之脈細濡濕熱之脈緩大浮緩濕在表沉緩濕在裡濕脈沉細與痙脈相似而症不同濕則身痛痙則身不痛弦緩為風濕相搏身痛脈沉為中濕脈浮為風濕虛澀為寒濕濕流關節一身盡痛脈沉而細為中濕為濕痹濕溫脈陽濡而弱陰小而急附方寒濕實脾飲白朮茯苓甘草厚朴大腹子草蔻木香木瓜附子炮薑棗風濕勝濕湯羌活防風蒼朮甘草黃連黃柏豬苓澤瀉宣竅至寶丹見前中風經絡獨活寄生湯獨活桑寄生熟地人參茯苓牛膝杜仲秦艽白芍當歸細辛防風甘草風濕羌活勝濕湯羌活獨活各一錢川芎藁本防風甘草各五分蔓荊子三分夾風防風湯防風葛根羌活秦艽桂枝甘草當歸杏仁黃芩赤苓薑酒煎夾寒加減五積散苓夏陳草麻黃白芷川芎當歸乾薑桔梗赤芍蒼朮厚朴外因除濕羌活湯見前中風風濕神朮散見前傷風惡風防己黃耆湯防己白朮黃耆甘草薑棗濕熱清熱滲濕湯黃柏黃連茯苓澤瀉蒼朮白朮甘草濕滯小分清飲茯苓澤瀉豬苓薏仁枳殼厚朴內因五苓散見前溫發黃茵陳蒿湯茵陳大黃梔子熱渴桂苓甘露飲見前暑外因當歸拈痛散二術二苓人參羌活葛根升麻當歸知母苦參防風茵陳導水神芎丸黃連黃芩川芎大黃薄荷滑石牽牛水丸理脾六君子湯見前中風化痰異功散見前中風陰虛虎潛丸見前中風濕火二妙丸黃柏蒼朮溫利七味滲濕湯蒼朮白朮茯苓炮薑丁香橘紅炙草溫補理中湯見前中風寒濕除濕湯六君子湯加藿香蒼朮大腹皮寒瀉升陽除濕湯升麻柴胡神麯澤瀉豬苓蒼朮陳皮甘草麥芽益智半夏腎虛腎著湯炮薑茯苓白朮甘草如溺赤便溏加蒼朮陳皮丁香溫散加味五苓散五苓散加羌活暑濕六和湯見前暑濕溫蒼朮白虎湯見前中風傷濕白朮酒白朮一兩酒三盞煎一盞腹滿苓薑朮桂湯苓薑術桂體虛清燥湯見前暑酒濕葛花解酲湯葛花砂仁蔻仁木香青皮陳皮人參白朮茯苓神麯乾薑豬苓澤瀉除濕平胃散見前中風脾濕胃苓湯見前中風止瀉蒼朮丸茯苓蒼朮厚朴白芍炙草川椒茴香破故紙糯米粥丸濕痰二陳湯見前中風濕脈案潘溽暑蒸濕水穀聚濕致胸脘煩悶厄逆吐噦口甜燥手心熱頭汗舌白不飢便溏溺少由濕邪瀰漫膈間鬱蒸成熱所服湯飲盡變濁瘀上泛脈息三五不調治宜辛以通壅苦以降逆佩蘭香薷白豆蔻公丁香柿蒂鬱金半夏曲枳殼杏仁俱炒按口甜經名脾疸用蘭草除陳遵經立治一服脾疸已除諸症俱減改用清輕淡滲淡竹茹通草滑石石斛蔞霜象貝赤苓藿梗燈心二服嘔止厄稀乃胃虛客氣上逆用一味大麥仁湯脘舒厄止汗徹知飢思食治用調補胃陰太子參麥冬沙參扁豆炒茯神棗仁薏仁小麥南棗數服進食如常潘六旬以上感冒春溫治者用傷寒法雜進桂枝柴葛兼旬不解延至濕熱釀痰舌膩口甜溺少赤痛不思傷寒遞傳足經溫邪專傷手經桂柴等溫升已屬誤治更醫見其里迫欲下竟用桂心焦術尤為可駭無怪唇乾舌灰矣夫病者自言不惡寒而但熱身重難移則春溫化濕瞭然況脈來氣口濡大濕甚生熱脈候可按更兼口味作甜經名脾疸黏痰稠膩氣窒不利皆濕熱混處上中焦顯象其欲瀉者亦濕邪下注得小水分利自不至下迫耳治法透熱泄濕數劑可安香豉杏仁貝母各二錢佩蘭前胡梔皮竹茹各錢半赤苓三錢滑石五分蔗汁半杯燈心一錢一服微汗煩熱退下迫除去香豉佩蘭加通草栝蔞沙參各一錢日再服痰較滑利舌灰漸脫可知溫邪本濕熱內搏用辛涼透熱甘淡驅濕口甜身重俱除惟小溲渾濁猶是濕邪未淨此輕清泄熱滲濕為一定治法花粉鮮生地麥冬各二錢赤苓薏仁各三錢梔皮川貝木通各八分燈心五分加鮮蘆根日再服溺清粥飲漸加轉側如常矣繼進調補胃陰法玉竹叉斛潞參各二錢麥冬一錢薏仁生二錢熟二錢小麥湘蓮各三錢甜杏仁錢半蔗汁沖服此甘潤以養胃陰兼用火肉汁吹去油麵飲之待腸腑一充大便得解則脘腑爽矣侄據述去秋瀕海潮溢淹沒民居凡受水濕者足跗腫潰今懋遷其地更冒時邪身痛頭暈嘔噦乃濕阻氣分治者誤汗劫液繼用消導遂致熱渴脘悶厄逆自利不思濕家忌汗消導更劫胃津再用丁香參甘以止厄溫補焉能利濕夫時邪本濕土鬱蒸所發感受不時熱騰濕滯先宜疏解再行滲利俾氣機升降如常豆豉枳殼梔皮蔞皮半夏制藿梗通草茯苓豬苓荷葉煎湯一服諸症俱減時有嘔渴乃中焦水穀之氣不運用半夏橘白茯苓杏仁薏米花粉砂仁再服得安族某客路感邪風熱上壅嘔渴頭重痛脈浮濡此熱蒸濕伏也治先宣解表分則風熱不與濕搏用薄荷牛蒡桔梗山梔甘菊桑葉赤苓薑皮汗解身涼因食荸薺重發熱下利煩悶乃溫邪未盡生冷引動濕濁用胃苓湯去二術加枳殼燈心蘆根煎服愈侄頭蒙如裹胸悶便艱腑氣失降以濕鬱論治通草白蔻殼枳殼蔞霜川芎山梔杏仁半夏淡竹葉冬桑葉三服愈侄絡熱蒸痰腮緊口甜脈沉濡左寸差大此風熱鬱於膽絡兼脾有濕痰壅熱而為脾疸也鉤藤絲瓜絡桔梗連翹象貝薄荷佩蘭橘紅鬱金三服而愈族弟嗜酒蘊濕又醉渴飲冷寒熱挾旬口乾舌膩嘔惡胸悶跗冷便瀉脈濡數濕甚於熱醫混稱溫瘧屢用芩膏生地濕愈搏結宜輕透濕於熱外毋令互相煽熾病可立除通草枳殼半夏赤苓車前石斛薏仁麥冬燈心花粉蘆根日再服汗徹熱退瀉止足和但微嗽去枳殼車前蘆根加杏仁象貝更適粥飲既進脾陽未醒間或腹痛用廣皮砂仁茯苓薏仁半夏曲生白朮枳椇子又數劑全愈燥症論治燥為陽明秋金之化金燥則水源竭而灌溉不周兼以風生燥火化燥原病式所謂諸澀枯涸幹徑皴揭皆屬於燥也燥有外因有內因因於外者天氣肅而燥勝或風熱致傷氣分則津液不騰宜甘潤以滋肺胃佐以氣味辛通因乎內者精血奪而燥生或服餌偏助陽火則化源日涸宜柔膩以養腎肝尤資血肉填補葉氏以上燥治氣下燥治血二語括之最為簡當今析言之燥在上必乘肺為燥嗽喻氏清燥救肺湯加減肺中有火為乾咳申先生瓊玉膏主之外內合邪千金麥門冬湯肺痿咳唾心中溫溫液液者仲景炙甘草湯燥在中必傷脾胃之陰為熱壅食不下金匱麥門冬湯胃脘有死血乾燥枯稿食下痛胃翻便祕丹溪韭汁牛乳飲胃熱善消水穀丹溪消渴方燥在下必乘大腸為大便燥結其氣祕濁陰不降者東垣通幽湯潤燥湯玉函麻仁丸風祕血燥東垣潤腸丸加郁李仁防風津枯祕結丹溪潤燥生津湯加麻仁或蜜煎導血枯膈噎便結如栗生料六味丸去山萸加首烏當歸或加肉蓯蓉桃仁搗水煎服兼食人乳酥蜜此燥在臟腑者也若燥在血脈多見風症宜滋燥養營湯治外大補地黃湯治內血虛外燥皮膚皴揭筋急爪枯滋燥養營湯諸痿由於肺熱熱亢則液耗百骸無所榮養故手足痿弱不能自收持反似痹濕之症養陰藥中加黃柏以堅之如虎潛丸之類切忌用風藥又婦人臟燥肺臟也悲傷欲泣仲景甘麥大棗湯以生肺津凡諸燥症多火灼真陰血液衰少故其脈皆細微而澀也通治滋燥飲生血潤膚飲燥症脈候燥症脈微細澀小間有虛大急數浮芤重按無不細澀而微者入門曰傷燥脈澀附方燥嗽清燥救肺湯霜桑葉三錢杏仁七分麥冬一錢二分石膏二錢半人參七分阿膠八分胡麻甘草各一錢枇杷葉一張乾咳瓊玉膏地黃四斤茯苓十二兩人參六兩白蜜二斤合邪千金麥門冬湯麥冬二錢桔梗桑皮半夏生地紫菀竹茹麻黃各七分炙草五分五味子十粒薑一片肺痿炙甘草湯見前中風傷陰金匱麥門冬湯麥冬半夏人參甘草粳米大棗胃稿韭汁牛乳飲韭汁牛乳有痰加薑汁血膈去牛乳加陳酒胃熱消渴方黃連花粉生地汁藕汁牛乳氣祕通幽湯當歸升麻桃仁紅花甘草生地熟地或加檳榔末陽結潤燥湯大黃歸尾桃仁麻仁升麻紅花生地熟地脾約麻仁丸厚朴芍藥枳實各二錢大黃四錢麻仁杏仁各一錢五分煉蜜為丸風祕潤腸丸麻仁桃仁羌活當歸大黃皂角秦艽蜜丸加郁李仁防風名潤燥丸津桔潤燥生津湯當歸白芍熟地天冬麥冬栝蔞桃仁紅花便燥蜜煎導白蜜熬捻如棗核納穀道中滋陰六味丸見前中風血燥滋燥養營湯當歸生地熟地白芍甘草黃芩秦艽防風血燥大補地黃湯二地山藥山萸杞子白芍當歸元參知母黃柏蓯蓉蜜痿弱虎潛丸見前中風臟燥甘麥大棗湯甘草小麥大棗通治滋燥飲秦艽花粉白芍生地天冬麥冬蜜或加人乳牛乳梨汁蔗汁亦可通治生血潤膚飲生地熟地各二錢天冬錢半麥冬當歸黃耆各一錢黃芩桃仁栝蔞各五分紅花一分五味子九粒燥脈案徐老年上盛下虛嗆咳上氣聲啞嗌乾咳則起坐臥不安枕溺黃便硬此由溫邪化燥漸傳入腑脈虛澀兩寸俱大治仍清上用生地麥冬竹葉沙參貝母玉竹山梔甘草枇杷膏數服遂平朱邑尊瘧瘳復感秋燥虛陽上冒則為頭眩耳鳴津不上供則為舌乾咽燥加以公事勞心渴飲脘悶不飢左寸關脈大於右是秋令亢陽致病後液涸最忌燥藥劫津用叉斛丹皮沙參麥冬鮮生地栝蔞霜洋參茯神二劑霍然王女秋感風燥頭暈熱煩咳連胸脅震痛吸氣有音治宜清肅上焦勿令氣痹豆豉杏仁貝母橘紅蔞皮桑皮蜜炙桔梗嫩桑葉枇杷膏和服三劑而平董氏經閉忽通下損佳兆近逢秋燥寒熱渴煩脈數唇乾嗽多寐少症由陰液不足肺脾感燥而成治在滋養營液用局方甘露飲生熟地黃麥冬石斛甘草茯神枇杷葉加五味杞子甜杏仁梨肉四服症退數脈頓改但著左臥則咳而脅痛去五味梨肉加桑皮蜜炙白芍四服更適飲食亦加調理漸愈嶽老年因怒失血渴煩羸瘦延秋燥氣加臨舌紫黑干薄無津溺澀痛右尺偏旺肺腎液涸心胃火燔恐延痙厥用犀角地黃湯加麥冬石斛鮮藕再服舌潤苔浮但厄逆頷動肉瞤筋惕乃風火成痙急宜滋液熄風復脈湯去薑桂麻仁加竹茹鉤藤乃定湯氏衰年食少病羸胃陰虛弱冬感風燥瘡疥搔癢時或寒熱譫煩口渴舌焦額汗冰指脈左虛大右疾數此陰陽交損兼風燥劫津治先甘潤除煩鮮地黃玉竹沙參石斛各二錢麥冬當歸各錢半黃耆八分霜桑葉二錢蔗汁半杯沖服熱退舌潤隨用潞參黃耆茯神棗仁當歸白芍玉竹蓮棗平補陰陽症愈火症論治風寒暑濕燥皆外因惟火多屬內因經言壯火食氣少火生氣注謂火在丹田之下為少火少火則生氣是為真火火離丹田而上為壯火壯火則食氣是為邪火然有實火虛火濕火鬱火陰火五臟六腑火遊行不歸經之火治實火上焦熱清心湯加減涼膈散中焦積熱渴燥便祕涼膈散三焦火盛狂躁吐衄黃連解毒湯陽明潮熱白虎湯下焦火溺血淋閉立效散一切血分火熱丹毒四順清涼飲治虛火飲食勞倦內生虛熱此傷脾陽也補中益氣湯思慮房勞血虛火亢此傷腎陰也六味地黃湯腎陰虛極火升躁渴舌刺脈洪此虛陽無附也急用八味丸料煎服産後陰傷發熱口渴面紅為無根之火獨參湯治濕火濕甚生熱腫脹溺閉胃苓湯治鬱火肌表熱五心煩如火燎及胃虛食冷遏抑脾陽升陽散火湯手心熱如烙脈沉數火鬱湯下部骨蒸屬血虛五蒸丸四物湯血中伏火加味四物湯風勞骨蒸秦艽鱉甲散治陰火氣從臍下起大補陰丸坎離既濟丸氣從足下起入腹為虛極難治七味地黃丸外以附子末津調敷湧泉穴治五臟火氣鬱火起於肺瀉白散清金丸大怒火起於肝加味逍遙飲加青皮膽草醉飽火起於脾瀉黃散加白芍枳殼怵惕思慮火起於心導赤散清心蓮子飲房欲火起於腎八味丸治六腑火胃火牙疼頤腫清胃散膽火眩暈口苦羚羊角丹皮山梔桑葉連翹龍膽草大腸火便祕不通通幽湯加槐米小腸火癃閉淋瀝八正散加減膀胱火腹痛溺澀大補丸三焦火肢熱體倦上焦山梔中焦連翹下焦地骨皮心包火怔忡不安麥冬丹皮犀角連翹菖蒲燈心其遊行之火或宜散宜清宜降各隨微甚而調之諸病屬火者多內經病機屬火五條其曰諸熱瞀瘛皆屬於火謂邪熱傷神則昏亂亢陽傷血則抽掣治以清心養肝地冬連芍之屬曰諸禁鼓栗如喪神守皆屬於火謂熱極反寒治以透熱安神梔連硃砂之屬曰諸逆衝上皆屬於火謂龍相上升治以鎮逆潛陽青鉛牡蠣之屬丹溪云病人言冷氣自下而上非真冷也上升之氣自肝而出中挾龍相火自下而上其熱為甚自覺冷者火極似水積熱之甚也陽亢陰微故見此症曰諸躁狂越皆屬於火謂重陽便祕治以清鎮通降牛黃石膏硝黃之屬曰諸病胕腫痠痛驚駭皆屬於火謂熱鬱神擾一治以升陽升麻薏仁當歸香附之屬一治以斂鎮棗仁茯神龍骨之屬此其概也丹溪云治火症不可驟用寒涼須兼溫散火甚用甘涼以緩之生甘草兼瀉兼緩火盛癲狂人壯氣實者可用正治冰水之類飲之虛者用生薑湯若投冰水立死或補陰令火自降地黃白芍之屬其勞倦內傷為氣虛火起於脾宜甘平溫養以退之參耆甘苓之屬經言勞者溫之損者溫之是也如陰虛躁煩唾痰如湧面目俱赤口渴便祕外極似火脈亦洪大然按之不鼓指此腎陰虛而陽浮越非火也乃假熱症用承氣白虎湯立斃當峻補真陰七味丸料重加肉桂水煎冷服諸症必退翌日畏寒足冷真候自現乃峻補其陽八味丸料煎服此脈症變常不可以常法治也又産後及大失血後陰傷發熱切忌涼劑即以四物湯滋陰亦屬不宜須獨參湯補氣方見陽生陰長之妙此宜辨陽虛陰虛陽虛者面必赤無根之火戴於上也果屬陽盛火鬱於內面必不赤其口渴者腎液干引水自救耳且口雖渴舌必滑潤脈雖數尺必無力惟過服涼藥脈反有力而鼓指戴復庵曰服涼藥而脈反數此火鬱也宜升宜補切忌寒涼犯之必死經曰一水不能勝二火二火君火相火也心為君火心主藏神屬陽在天為太陽之火相火附於肝腎代君行令屬陰在天為龍雷之火心火過亢可以寒涼正治如黃連生地黃之屬如天上太陽火人感之而傷熱中暍亦可以涼水苦寒解若龍蟠於海雷伏於地木水中之焰也秋後則蟄隨陽而升得雨益熾此不可以水滅矣人身命門相火龍火也少陽相火雷火也龍雷相附命火衰右尺脈弱治須益火之源桂附八味丸與火同氣據其窟宅而招之腎水虛左尺脈弱須壯水之主六味丸與火相配滋其真陰以潛之或腎陰弱相火強須從其性而伏之滋腎丸腎水虧龍火升須從其類而引之七味丸火起臍下衝脈上衝而喘都氣丸黑錫丹補而鎮之不可以水折也經曰一水不能勝五火五火者五志之火臨於五位即相火之煽而妄動者也相火易動五志激之變幻莫測煎灼真陰陰虛則病陰絶則死故東垣謂火為元氣之賊古云神靜則心火自降欲斷則腎水自升有以夫凡治五志之火起於五位者肺火以黃芩清肺飲加豆豉杏仁枇杷葉降之以人參平肺散調之心火以瀉心湯泄之以補心丹養之脾火以瀉黃散發之以補中益氣湯升之肝火以左金丸平之以龍薈丸折之腎火治法見上虛火以人參竹葉湯清之以保元湯補之虛火盛而狂亂以生薑湯從治之實火以三黃湯瀉之痰火以淡竹茹湯滌之鬱火以發郁湯散之一切壯火狂陽痰壅心包內外熱熾以紫雪平之積熱煩躁咽腫口瘡以碧雪主之好餌丹石藥毒發渴壯熱千金朴硝煎主之東垣曰黃連瀉心火黃芩瀉肺火柴胡瀉肝火黃連佐之知母瀉腎火木通瀉小腸火黃芩瀉大腸火羚羊角瀉膽火龍膽草佐之滑石瀉膀胱火麥冬丹皮瀉心包火連翹山梔瀉三焦火地骨皮佐之石膏大黃瀉胃火火症脈候火脈洪數虛則浮脈經火性燔烈抑之則空故火盛脈浮取洪大中按軟闊重按空豁洪盛滿指為實火數大無力為虛火惡寒戰栗脈小匿者為火鬱弦細而數按之益堅為少火氣衰而見肝腎真脈非火使然乃虛勞劇候或更虛大疾數為壯火食氣耗竭真陰虛陽飛越之象久病得此百不一生惟元氣暴脫猶可峻補以斂固之脈洪而重按益實者有形之濕熱與火無預張氏醫通附方上焦火清心湯甘草一錢七分連翹山梔薄荷黃連黃芩大黃各七分朴硝五分竹葉七片白蜜一匙中焦火加減涼膈散涼膈散見前中風此加桔梗竹葉減大黃芒硝三焦火黃連解毒湯見前溫陽明火白虎湯見前中風下焦火立效散瞿麥四錢山梔二錢甘草一錢薑一片燈心五條血分四順清涼飲蒸大黃赤芍歸身炙草各一錢二分薄荷十葉傷脾補中益氣湯見前中風傷腎六味地黃丸七味八味俱見前中風濕火胃苓湯見前中風鬱火升陽散火湯升麻葛根羌活獨活人參白芍各一錢柴胡甘草各七分防風五分炙草一錢加薑棗鬱火火鬱湯羌活升麻白芍人參葛根銀柴胡甘草各一錢防風五分蔥三條一方無人參骨蒸五蒸丸青蒿童便浸地骨皮生地石膏各一兩當歸七錢胡黃連五錢醋製鱉甲一片蜜丸血熱加味四物湯地芍歸芎加丹皮山梔柴胡各一錢風勞秦艽鱉甲散耆桂苓草地芍艽胡鱉甲天冬地骨皮桑皮紫菀知母半夏人參薑陰火大補陰丸黃柏知母各鹽酒炒四兩熟地龜板酒炒各六兩豬脊髓蒸熟蜜丸陰火坎離既濟丸生地熟地山萸牛膝天冬麥冬各四兩白芍五味山藥龜板各三兩當歸知母黃柏各二兩川芎一兩蜜丸鹽湯下肺火瀉白散桑皮地骨皮各一錢甘草五分粳米百粒此瀉肺經氣分之火肺火清金丸黃芩炒研水丸此瀉肺經血分之火肝火加味逍遙散歸芍苓術胡各一錢甘草五分薑薄荷少許名逍遙散此加丹皮梔子脾火瀉黃散防風四兩藿香七錢山梔一兩石膏五錢甘草二兩蜜酒調服心火導赤散見前溫心火清心蓮子飲蓮子二錢人參茯苓黃耆各一錢黃芩麥冬車前地骨皮甘草各七分胃火清胃散生地丹皮黃連當歸升麻一方加石膏大腸通幽湯見前燥小腸八正散車前子木通瞿麥萹蓄滑石甘草梢山梔大黃燈心膀胱大補丸黃柏鹽酒炒研米粥和丸血虛四物湯下氣虛四君湯下氣血虛八珍湯下相火滋腎丸黃柏二兩知母一兩俱酒炒肉桂一錢蜜丸火喘都氣丸即六味丸加五味子三兩氣衝黑錫丹黑鉛硫黃各二兩將錫熔化入硫黃候結成片傾地上出火毒研至無聲為度降肺黃芩清肺飲黃芩山梔或加鹽豉調肺人參平肺散人參青皮天冬各四分茯苓七分陳皮五分地骨皮炙草各五分桑皮一錢五味子十一粒加薑煎瀉心瀉心湯黃連一味煎養心天王補心丹生地四兩人參元參丹參茯神桔梗遠志各五錢天冬麥冬棗仁柏子仁五味子當歸各一兩蜜丸彈子大硃砂為衣平肝左金丸黃連六兩薑汁炒吳茱萸鹽水泡一兩水丸瀉肝龍薈丸當歸龍膽草山梔炒黃連黃柏黃芩各炒一兩大黃青黛蘆薈各五錢木香二錢麝香五分蜜丸虛火人參竹葉湯石膏麥冬各二錢半夏一錢炙草人參各五分竹葉七片粳米一撮補虛保元湯人參黃耆白朮各一錢炙草六分陳皮五分實火三黃湯黃連黃芩大黃痰火淡竹茹湯麥冬小麥各二錢半夏錢半茯苓人參各一錢甘草五分竹茹錢二分薑棗鬱火發郁湯升麻葛根羌活柴胡細辛香附蔥白火熾紫雪見前暑積熱碧雪寒水石芒硝朴硝焰硝馬牙硝石膏青黛甘草各等分先將甘草煎湯去渣入前藥再煎用柳木槌攪不住手入青黛和勻傾入砂盆內候冷結成霜研末每用少許含化津咽如喉閉用鵝管吹入喉中神效丹毒千金朴硝煎朴硝一斤芒硝八兩石膏二兩寒水石四兩先將二硝入湯中攪令消化以紙封一宿取清納銅器中另搗二石碎如豆粒以絹袋盛之入汁中以微火煎至沫起以箸投之著箸如雪凝白即傾瀉盆中待凝取出日乾如積熱成悶不已者以方寸匕白蜜一合和冷水五合攪和令消頓服日二次熱定即止火脈案胡時毒誤藥成淋咳嗽聲啞脈細模糊思面色蒼赤體質屬火時毒謬用補托溺道不清淋久腎虛火炎金燥致嗆嗽失音遂成重症今夏初巳火主令嗜寐健忘恍惚心神潰散焉能攝腎速用滋陰瀉火冀秋深氣肅得金水相涵火毒平音漸復元參生地麥冬貝母丹皮龜甲茯神遠志土茯苓淡竹葉井華水煎二十服淋愈音響加熟地阿膠甜杏仁棗仁蜜丸服症平疫症論治大頭瘟捻頸瘟瓜瓤瘟楊梅瘟疙瘩瘟絞腸瘟軟腳瘟附疫為時行癘氣有大疫有常疫大疫沿門闔境多發於兵荒之後不數見常疫則一隅數家一家數人症多相似春夏秋三時皆有之而夏秋為甚其癘邪之來皆從濕土鬱蒸而發觸之成病其後更相傳染必由口鼻吸受流入募原募原乃陽明胃絡在夾脊前腸胃後去表不遠附近於胃為表裡之分界從鼻吸入故頭額暈脹背微惡寒從口吸入故嘔惡滿悶臍痛下利足膝逆冷邪出募原故壯熱有汗不解必俟表氣入內精氣達外大發戰汗然後脈靜身涼亦有自汗而解者但以出表為順陷里為逆從表解者戰汗自汗發斑從里陷者胸腹痞痛便祕熱結旁流協熱下利嘔惡譫語舌黃黑刺疫證脈不沉不浮而數然必右盛於左以濕土之邪多犯陽明胃經也募原亦附胃陽明居太陽之裡少陽之外為三陽經之中道傷寒之邪自表傳裡溫熱之邪自里達表疫癘之邪自陽明中道隨表裡虛實而發不循經傳也邪伏中道必表裡分解然不能一發便盡故有得汗熱除二三日復熱如前者有得下里和二三日復見表症者有表和復見里症者有表裡偏勝者有表裡分傳者吳氏溫疫論謂疫有九傳綜其變也總由伏邪既潰傳變不一故屢奪屢發也疫症治法外解如香豉蔥白連翹薄荷之屬內清如山梔芩連人中黃滑石之屬下奪如芒硝大黃之屬且疫為穢濁之邪若熏蒸熱痰矇蔽心包則神識漸昏必用芳香宣逐清血絡以防結閉如犀角菖蒲銀花鬱金佩蘭之屬煩渴多汗用石膏知母斑發咽痛用犀角牛蒡生地衄血下血用山梔犀角丹皮發熱自利用葛根芩連胸膈痞滿用栝蔞枳桔嘔吐厄逆用藿香竹茹邪混三焦熱結血分宜大制鹹苦用元參金銀花露金汁之屬而人中黃香豉尤為時疫之專藥香豉黑豆所盦得濕熱之氣釀成敗穢之質能引內邪從巨陽蒸汗而解人中黃甘草所制漬以滓穢專解腸腑惡毒從下而泄得同氣相求之妙以其總解溫熱時行內外熱毒也蓋疫為燥熱毒癘從無辛溫發散之例一切風燥辛熱皆不可犯至於大疫又宜斟酌司天歲氣方向不拘一轍也其發於外者有大頭捻頸瓜瓤楊梅疙瘩絞腸軟腳等症亦條列治法備查用焉此症宜與溫熱同參傷寒時疫辨吳又可曰傷寒必有感冒之因然後頭疼身痛發熱惡寒時疫原無感冒之因忽覺凜凜以後但惡熱不惡寒傷寒不傳染時疫多傳染傷寒邪從毛竅入時疫邪從口鼻入傷寒感而即發時疫感久乃發傷寒投劑一汗而解時疫發散有汗不解傷寒汗解在前時疫汗解在後傷寒投劑可使立汗時疫俟其內潰乃得自汗戰汗疫邪始匿募原根深蒂固發時與營衛交併客邪經由之處營衛無不受傷故曰潰然不潰則不能傳不傳則邪不出邪不出則疾不瘳傷寒發斑則病篤時疫發斑則病衰傷寒感邪在經以經傳經時疫感邪在內內溢於經經不自傳傷寒感發甚暴時疫卻淹纏加重傷寒必先發表時疫必先疏利種種不同所同者傷寒時疫皆能傳胃故同用承氣湯導邪以出也然疫症下後多有未能頓解者由於表裡分傳一半向外傳邪留肌肉一半向里傳邪留胃腑留胃故里氣結表氣因而不通於是肌肉之邪不能即達肌表下后里氣通表氣亦順向郁肌肉乃或斑或汗脫然而愈傷寒下後無是矣疫症初起三日蔥豉湯加童便熱服汗之不汗少頃更服以汗出熱除為度三服不解而脈浮尚屬表症用白虎湯見里症用承氣湯解毒湯表裡不分用涼膈散雙解散加減汗下後復見表症再與白虎湯復見里症更與承氣湯表裡熱結用三黃石膏湯梔豉湯汗之有汗下三四次而熱退者有熱退後忽復壯熱用再汗再下而愈者若脈症皆虛用清熱解毒湯人中黃丸調之非如傷寒有下早變症之慮亦非溫熱不可頻下之比總當以熱除邪盡為度惟下元虛者非六味生料補其真陰不能化其餘熱纂張氏醫通初發邪伏募原營衛交阻凜寒發熱甚則厥逆逮陽鬱而通厥回而中外皆熱不可發汗宜透其邪用達原飲輕者舌苔白而薄脈不數可從汗解重者舌苔如粉舌根先黃延及中央邪漸入胃須下之達原飲加大黃若脈長洪而數大汗而渴此邪適離募原欲表未表也白虎湯舌黃兼里症邪已入胃大小承氣湯凡舌苔白邪在募原不可下苔黃邪在胃宜下黑而芒刺急下目赤咽乾氣噴如火揚手擲足脈沉數下之俱承氣湯凡失下循衣摸床撮空肉惕目不了了邪熱愈甚元氣將脫者宜陶氏黃龍湯既下急用生脈散加歸芍痰滯胸膈瓜貝養榮湯斑不透仍熱舉斑湯屢汗而液枯人參白虎湯表症多里症少達原飲加大黃枳實里症多表症少大柴胡湯燥結便祕熱結旁流日久失下自利黑水協熱下利潮熱便作泄瀉俱承氣湯疫兼痢者危檳榔順氣湯熱結下焦小便不利導赤散熱瘀發黃茵陳蒿湯血蓄膀胱夜熱譫語桃仁承氣湯婦人病疫經水適來邪入血海熱隨血下自愈小柴胡湯加赤芍丹皮生地黃如結胸狀者血因邪結也宜刺期門穴經水適斷血室乍空邪乘虛入難治柴胡養榮湯新産亡血柴胡養榮湯孕婦病疫隨症施治以安胎保胎為主亦有宜用承氣湯者用之反得母子俱全慎勿生疑掣肘也纂吳氏溫疫論大頭瘟濕熱傷巔腫大如斗赤㿔無頭或結核有根令人多汗氣蒸天行癘氣染之多死乃邪熱客於心肺上攻頭面而為腫也初則憎寒壯熱體重頭面痛目不能開上喘咽喉不利甚則堵塞不能飲食舌乾口燥恍惚不安不速治十死八九人中黃丸普濟消毒飲子便硬加酒大黃一二錢緩服或沈氏頭瘟湯若潰膿必染人若發於面部焮赤腫痛屬陽明普濟消毒飲子加石膏發於耳前後額角旁紅腫屬少陽普濟消毒飲子加柴胡天花粉發於腦頂後並耳後赤熱腫痛屬太陽荊防敗毒散去人參加芩連捻頸瘟喉痹失音項大腹脹如蝦蟆狀亦名蝦蟆瘟荊防敗毒散瓜瓤瘟胸高肋起嘔血如汁生犀飲便結加大黃渴加花粉虛加鹽水炒人參表熱去蒼朮加桂枝黃連便膿血倍黃土加黃柏便滑以人中黃代金汁楊梅瘟遍身紫塊忽然發出黴瘡清熱解毒湯下人中黃丸並宜刺塊出血疙瘩瘟發塊如瘤遍身流走旦發夕死急用三稜針刺入委中三分出血服人中黃散絞腸瘟腸鳴乾嘔水泄不通類絞腸痧急宜探吐服雙解散軟腳瘟便清泄白足腫難移此即濕溫症宜蒼朮白虎湯附方初起蔥豉湯蔥白豆豉表症白虎湯見前中風白虎湯辛涼發散清肅肌表氣分藥也里症承氣湯見前溫解毒解毒湯見前溫表裡涼膈散見前中風表裡雙解散荊防芩梔歸芍桔草麻黃薄荷川芎連翹石膏滑石白朮熱結三黃石膏湯芩連柏梔名黃連解毒湯此加石膏豆豉麻黃虛煩梔豉湯梔子豆豉清熱清熱解毒湯白虎湯去粳米加人參羌活升麻葛根白芍黃芩黃連生地黃夾虛人中黃丸大黃三兩人中黃蒼朮桔梗滑石各二兩人參芩連各一兩防風五錢香附一兩五錢透邪達原飲黃芩錢半炙草白芍厚朴草果各一錢知母檳榔各二錢薑七片棗一枚達原飲除邪破結潰散募原之伏疫也失下黃龍湯大承氣湯加參草歸桔薑棗生津生脈散見前暑痰滯栝貝養榮湯知母花粉貝母栝蔞橘紅白芍當歸蘇子薑透斑舉斑湯白芍當歸各一錢升麻五分白芷柴胡各七分甲片二錢薑表裡大柴胡湯見前溫疫痢檳榔芍藥枳實厚朴大黃薑溺澀導赤散見前溫發黃茵陳蒿湯見前濕血蓄桃仁承氣湯大黃芒硝桃仁桂枝甘草和解小柴胡湯見前溫症清血柴胡養營湯柴胡黃芩陳皮甘草當歸白芍生地知母花粉大頭普濟消毒飲芩連陳草胡桔元參連翹升麻薄荷板蘭根馬勃鼠黏子大頭頭瘟湯川芎一錢荊防桔各錢半柴胡七分黃芩歸尾各二錢風熱荊防敗毒散敗毒散見前傷風此再加荊芥防風瓜瓤生犀飲黃土二錢犀角二錢黃連蒼朮各一錢金汁半杯茶葉一撮疙瘩人中黃散辰砂雄黃各錢半人中黃一兩為末薄荷桔梗湯下二錢疫脈案本疫邪傳胃舌黃脈洪數汗渴白虎湯一服熱退明午復煩恐散漫之邪雖去已成里結也用苦辛寒方人中黃元明粉黃芩知母枳殼檳榔三服脈症俱平用蜜煎導糞下而解冷高年染疫脈右大於左由邪從口鼻吸受客於夾脊溢自募原見症頭痛胸中怫鬱務徹其邪使速離募原仿達原飲用黃芩知母花粉厚朴枳殼赤芍豆豉汗出熱退間日前症仍作惡熱更加譫妄診時揚手擲足揭去衣被臥不安席此欲戰汗也頃之臂脛冷身振戰逾一炊時肢溫汗透脈靜身涼白甲戌春大疫初病渴煩五日後液復神蘇毗陵醫按傷寒論治拘定日數謂邪入陽明之腑豫言疫邪始伏募原繼乃表裡分傳不比風寒自表傳裡治法必分徹表裡之熱方不逆入心包變現痙厥今邪有轉機再與透解營熱則不虞內陷矣乃用鮮生地石斛丹皮知母麥冬竹茹甘蔗參鬚一劑神識清洪脈退加青蒿地骨皮汗津津而熱退冷時邪傷肺逆傳膻中由衛入營釀毒發疹密入云片竟至神昏遺溺是邪方張而陰氣已虧也用沙參麥冬以保肺陰牛蒡連翹以泄疹毒生地五味以固腎氣丹皮鮮藕引入血分菖蒲鬱金開心竅降熱痰二服疹消加減症平張氏疫症投補壯熱煩冤齒焦唇血舌芒刺昏譫循衣撮空頷顫手戰脈小數此熱邪深陷液涸風生已顯痙象速用生地六錢鮮斛天冬各四錢赤芍元參各三錢連翹梔子知母各一錢鮮藕二兩石菖蒲汁沖服唇舌稍潤躁擾漸平三服神識清爽調理得痊趙氏疫癘用五積散煩渴昏譫不寐舌縮唇黑又誤進麻黃湯肢搐鼻衄脈數無度竊謂五積散治傷寒惡寒方中薑桂蒼朴皆熱燥疫症本不惡寒服此營液愈涸邪焰益熾是抱薪救焚再服麻桂強汗劫津更傷表氣與內陷熱邪風馬不及勢必痙厥衄紅矣勉用鮮生地石斛各五錢天冬麥冬各二錢山梔知母赤芍連翹各錢半犀角磨汁七分蔗汁一杯沖服即安睡醒而神蘇王氏初春感疫寒熱不時頭脹面腫此鼻吸癘邪襲入竅絡目閉項痛失治則結核潰膿急須解散仿普濟消毒飲升麻柴胡桔梗薄荷陳皮連翹甘草加山梔荊芥冬桑葉三服而消韋嫗病疫兼旬煩渴脈數舌黑神迷症成內閉用犀角尖元參牛黃鮮生地連翹麥冬石菖蒲銀花露二服熱減神清曹氏病起頭暈欲嘔是穢邪從口鼻吸入壯熱肢冷昏譫多寐邪已熏灼心包神明矇蔽急宜開解勿令竅閉羚羊角八分人中黃一錢豆豉二錢梔心連翹心各錢半薄荷一錢竹葉心五錢菖蒲根汁五匙一服神蘇汗出而解何氏暑疫汗煩疹出目瞑舌焦脈洪長症已傳胃仿石頑以穢攻穢人中黃豆豉石膏犀角汁銀花露知母山梔症退貢氏妹時疫秋髮傳染必深初起寒熱耳後結核頭眩脛冷疹出便瀉宜從少陽透熱泄濕表裡分解醫慮其體素陰虛早投阿膠熟地雞子黃滋膩致壅氣分之邪脈來沉數熱勢深陷必難汗解姑用清裡徹熱法黃芩羚羊角人中黃梔皮連翹滑石通草燈心日再服頭汗劑頸熱猶蒸濕思欲清掃瀰漫雖核消疹退瀉止脛溫而舌心已干邪劫胃液隨用鮮地黃石斛麥冬沙參花粉白蘆根舌已強光燥無津脈更促數用透營滋液犀角尖磨汁鮮地黃藕汁天冬西瓜翠衣蘆根淡竹葉梔心知母舌猶乾黑而縮目瞑多睡三焦受邪幸前藥沁透心包膻中不為熱痰蒸蔽然機竅不靈仍用昨犀角方加水甜梨肉二服即以梨片安舌上咀其涼潤越宿舌津黑蛻汗出熱解張氏據述病經旬余仍頭暈脘悶熱煩汗潮今夏延境沴疫皆濕土鬱蒸致病節交處暑炎熇未除必是時氣晚發膽火上冒濕熱交搏灼及心營神呆液涸撮空齒噤熱極生風遂成痙厥速宜透邪救液遙擬一方生地犀角羚羊角元參赤芍鮮梨麥冬蔞仁連翹蘆根三服症平肖體微熱而虛煩不渴不寐是疫症已退脈虛大按之如無此禁谷而胃虛也經云胃不和則臥不安得胃陰一復煩熱自除用潞參玉竹白芍歸身麥冬茯神棗仁石斛半夏曲甘草香稻葉數服全瘳眭女口鼻吸入癘邪頭暈脘痞煩熱面紅適值經行連小腹亦脹悶脈右小數左模糊乃濕熱與氣血混並治宜上下分解梔皮嫩桑葉枳殼栝蔞霜鬱金杏仁薄荷人參丹皮赤芍桃仁日二服頭暈腹脹已減但熱煩中脘微痛猶是熱蒸濕痰阻氣且煩出於肺防其變現斑疹用宣通法枳殼栝蔞霜白蔻殼大貝母杏仁丹皮赤芍牛蒡子連翹燈心二服汗出未徹紅疹稀疏邪已外透渴不多飲而溺赤便溏胸仍不寬脈仍小數濕熱尚熾法用辛涼透熱於表甘淡滲濕於裡薄荷豆豉通草牛蒡子杏仁貝母栝蔞枳殼赤苓滑石車前子燈心數服諸症漸平但口燥飢不思食乃病後胃津未復法宜涼潤調養胃陰麥冬石斛玉竹白芍沙參薏仁茯神蔗汁數服而瘳眭女熱渴脘悶舌苔里黃尖赤頭痛未解手心如烙濕邪搏熱僭踞上中焦速速透解毋俾出入募原釀成陷里重症枯芩酒炒豆豉枳殼蔞霜梔皮薄荷杏仁荷葉邊二服汗出熱減去豆豉荷葉邊加連翹牛蒡子丹皮預防入營發疹忽咳而衄此蘊熱迫血直犯清道為疫毒將解之兆用黑山梔鮮生地杏仁大貝母花粉沙參蘆根蔗汁數服愈族某疫後感暑舌光薄而干渴飲肢厥脈右緩左微便溏語譫仍理三焦在裡濕熱元參麥冬花粉石斛赤苓車前薏米知母二服肢和舌潤去元參車前知母加沙參玉竹大麥仁數服而安侄熱渴嘔眩而煩舌苔黃膩牙垢唇燥疫邪作熱由募原分布上中焦閲所服方未能透邪勢必表裡分傳宜急急宣解為要淡豆豉人中黃黃芩枳殼梔皮連翹半夏牛蒡子嫩桑葉二服煩眩嘔渴俱止舌苔黃膩亦消脈來虛大數象較退邪留氣分不難透解原方去人中黃枳殼連翹半夏桑葉加薄荷青蒿麥冬赤苓蔗汁一服微汗未徹兩寸脈仍大舌心灰尖絳火邪劫營用透熱救陰鮮生地花粉石斛麥冬知母元參丹皮赤芍蔗汁一服汗至胸項而還邪猶未徹舌心黑燥邊絳干心胃火燔清營熱以透表犀角尖汁鮮生地丹皮花粉元參滑石麥冬蘇梗燈心蔗汁甘草一服汗周熱解貢據述時疫脈數熱渴暈悶誤用蒼芷劫液柴葛升陽遂至躁煩譫妄舌黑齒焦循衣撮空此邪熱入營將變昏痙為棘手重症遙擬透營宣竅救液法用犀角磨汁五分鮮生地五錢乾生地三錢山梔連翹赤芍各二錢鮮石菖蒲四錢鮮藕西瓜翠衣各二兩二服神清舌潤去犀角鮮生地菖蒲西瓜翠衣加茯苓二錢燈心八分六一散六分沖服徹熱滲濕而平潘疫熱挾膽火上升頭痛如裂旬日外出熱減渴煩震眩不解脈虛面垢此疫邪兼暑也用羚羊角天麻嫩桑葉薄荷香薷山梔麥冬花粉石斛燈心日二服諸症悉平惟液涸口燥不思納食宜調肺胃之陰麥冬沙參玉竹白芍生地扁豆一服而思食米味得服平為過二三日可以全愈
