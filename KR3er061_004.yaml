body:
  text: 卷之二虛損勞瘵論治經言精氣奪則虛凡營虛衛虛上損下損不外精與氣而已精氣內奪則積虛成損積損成勞甚而為瘵乃精與氣虛憊之極也素問論五勞謂久視傷血久臥傷氣久坐傷肉久立傷骨久行傷筋金匱論五勞謂肺勞損氣心勞損神脾勞損食肝勞損血腎勞損精越人謂自上損下者一損肺勞嗽二損心盜汗三損胃食減四損肝鬱怒五損腎淋漏過胃則不治自下損上者一損腎遺濁經閉二損肝脅痛三損脾脹瀉四損心驚悸不寐五損肺喘咳過脾則不治誠以脾胃為精與氣生化之源也故治虛勞以能食為主考難經治法損其肺者益其氣保元湯損其心者調其營衛八珍湯損其脾者調其飲食適其寒溫四君子湯損其肝者緩其中牛膝丸損其腎者益其精金剛丸煨腎丸此固治損之要矣尤必辨其陽虛陰虛經曰陽虛生外寒陰虛生內熱凡怯寒少氣自汗喘乏食減無味嘔脹飧泄皆陽虛症也此脾肺虧損由憂思鬱結營衛失和惟四君保元養營歸脾諸湯宜之若怔忡盜汗咳血吐衄淋遺崩漏經閉骨蒸皆陰虛症也此心肝腎虧損由君相火炎精髓枯竭惟補心三才六味大造固本諸湯宜之又若腎中真陽虛者右尺必弱宜甘溫益火之品補陽以配陰八味丸或景嶽右歸飲右歸丸所謂益火之源以消陰翳也腎中真陰虛者左尺細數宜純甘補水之品滋陰以配陽六味丸加杞子魚膘或景嶽左歸飲左歸丸所謂壯水之主以鎮陽光也陽虛不復久則吸短偏臥脈弱陽痿宜參朮歸耆杞子山藥胡桃龍眼蓮棗沙苑子骨脂人乳鹿茸鹿膠羊肉羊腎海參陰虛不復久則咽瘡音啞色悴肌羸宜麥味杏貝熟地首烏蓯蓉燕窩烏雞阿膠淡菜秋石河車豬羊髓龜膠白蜜而勞瘵成矣由是火炎於上為嗽血宜五汁膏為潮熱宜清骨散火動於下為遺濁宜龍齒丸為泄瀉宜三白廣生湯而治療難矣夫水為萬物之元孫真人所以云補脾不若補腎土為萬物之母許學士所以云補腎不若補脾然喜燥者脾喜涼者腎欲補腎易傷脾欲補脾易傷腎不知土為金母金為水母勞瘵至陽虛泄瀉宜溫以補脾然補脾須不礙肺勞瘵至陰虛嗽熱宜潤以滋腎然滋腎須不妨脾補脾佐以五味杞子滋腎佐以蓮實砂仁不得偏用辛溫以助火桂附之屬亦不得偏用苦寒以戕胃知柏之屬且虛勞以受補為可治不受補為不治如人參之甘溫則大熱可除乃陽生陰長之理所謂血脫者益而葛可久治勞十方用參朮者七也故曰土旺而金生勿拘拘於保肺水壯而火熄勿汲汲於清心夫五勞者勞傷五臟乃虛損之源而六極七傷又虛損之流極勞瘵之深根也如皮毛枯稿為肺勞人參黃耆散血脈不榮為心勞大五補丸食少肌瘦為脾勞橘皮煎血虛筋緩為肝勞黑丸腹腫足弱為腎勞腎氣丸六極者數轉筋指甲痛為筋極滋補營養丸酒煮木瓜粥牙痛踵痛不耐久立為骨極茸珠丸面色無華頭髮墜落為血極補營湯膚如蟲行體肉乾黑為肉極參苓丸肌無膏澤目無精光羸瘦肌癢搔則成瘡為精極巴戟丸胸脅逆滿吸短難言為氣極益氣丸七傷者一陰寒二陰痿三里急四精漏五精少六精滑七竅數並宜鎖陽丹九龍丹幾虛損症多起於脾胃勞瘵症多起於腎經虛損潮熱多起於內傷勞瘵陰虛火動多起於傷風似瘧虛損蒸蒸發熱按至皮膚間甚熱不能食不覺瘦脈豁大重按無力勞瘵骨蒸按之皮膚不熱按之筋骨乃熱能食而瘦脈弦數虛損轉潮熱泄瀉脈短數者不治勞瘵轉陰虛火動喉痛脈細數死虛症頰赤或唇紅陰虛逼陽於上也音喑腎氣竭也咳而喘急肺虛氣不歸腎也喉乾咽痛真水涸虛火炎也不眠恍惚血不養心神不能藏也時多煩躁陽中無陰柔不濟剛也飲食不甘肌肉漸消脾元敗也盜汗不止有火則陰不能攝無火則陽不能固也骨痛如折腎主骨真陰竭也筋急痠痛水虧木燥肝失養也足心如烙虛火爍陰湧泉涸也虛損勞瘵脈候脈大為勞脈虛亦為勞大而無力為陽虛數而無力為陰虛沉遲小為脫氣大而芤為脫血細微而小為氣血俱虛寸弱而軟為上虛尺弱而澀為下虛兩關沉細為胃虛弦為中虛凡細數弱澀弦皆勞傷脈但漸緩則有生意若弦甚者病必進數甚者病必危附方益氣保元湯見一卷火緩肝牛膝丸牛膝萆薢杜仲防風蓯蓉桂心蒺藜菟絲餅益精金剛丸萆薢杜仲蓯蓉菟絲餅豬腰子酒煮為丸益精煨腎丸牛膝萆薢杜仲防風蓯蓉桂心故紙胡盧巴菟絲餅豬腰子酒煮蜜丸補陽右歸飲人參白朮山藥杞子杜仲萸肉炙草炮薑附子肉桂熟地補陽右歸丸前飲去朮草杞子加鹿膠菟絲餅蜜丸補陰左歸飲熟地山藥杞子炙草茯苓山萸補陰左歸丸前飲去茯苓炙草加牛膝菟絲餅鹿膠龜膠蜜丸咳血五汁膏天冬麥冬生地薄荷貝母丹皮阿膠茯苓犀角羚羊角人乳汁梨汁藕汁蔗汁蘿蔔汁蜜熬潮熱清骨散秦艽鱉甲知母青蒿地骨皮銀柴胡遺濁龍齒丸人參茯神遠志龍齒菖蒲知母黃柏泄瀉三白廣生湯苓術陳草芍貝地骨皮棗仁山藥丹皮芡實蓮子烏梅肺勞人參黃耆湯鱉甲錢半天冬一錢秦艽生地柴胡地骨皮各七分桑皮半夏知母紫菀黃耆赤芍甘草各五分人參茯苓桔梗各三分心勞大五補丸麥冬天冬人參熟地益智子枸杞子菖蒲遠志地骨皮茯苓脾勞橘皮煎橘皮五兩甘草三兩三錢當歸萆薢蓯蓉吳萸厚朴肉桂巴戟石斛附子牛膝鹿茸杜仲菟絲子乾薑各一兩酒半升沙鍋內入橘皮煎再入諸藥末為丸肝勞黑丸當歸鹿茸各一兩烏梅肉為丸酒下腎勞腎氣丸八味丸見一卷中風此再加牛膝車前筋極滋補養營丸遠志白芍黃耆白朮各兩半熟地人參五味芎歸山藥各二兩陳皮八錢茯苓七錢生地五錢山萸四錢蜜丸筋極酒煮木瓜粥大木瓜水酒煮爛研膏裹轉筋處冷即易之三五度可瘥骨極茸珠丸鹿茸鹿角膠鹿角霜熟地當歸各兩半蓯蓉棗仁柏子仁黃耆各七錢附子陽起石各二錢酒糊丸血極補營湯參苓陳草歸芍二地梔子麥冬棗仁烏梅肉極參苓丸參苓菖蒲遠志牛膝地骨皮蜜丸精極巴戟丸五味巴戟蓯蓉菟絲覆盆益智牡蠣龍骨人參白朮熟地骨碎補茴香蜜丸氣極益氣丸人參麥冬陳皮桔梗炙草五味蜜丸七傷鎖陽丹桑螵蛸三兩龍骨茯苓各一兩糊丸七傷九龍丹金櫻子杞子蓮鬚熟地芡實茯苓當歸山楂酒糊丸虛損脈案楊弱冠成損嗽血喘促身熱汗泄食減便溏脈弱數此上損及中補土生金自不易定法四君子湯加熟地砂仁末炒山藥茯神五味白芍蓮子小麥煎湯數服血止喘熱亦定然一陽初生必交節不至加重乃得轉危為安胡氏女寒熱咳嗽經斷食少肌削口乾無寐脈虛數損象已具經云二陽之病發心脾有不得隱曲在女子為不月二陽足陽明胃也胃虛則受谷少而血無由生故症見心脾心主血脾統血情志不遂日為憂思煩擾以耗竭之故月水枯也宜滋化源仿立齋先生法朝用歸脾湯加柏子仁夕用都氣丸加杞子白芍棗仁貝母兩月諸症悉退後經自通而病霍然狄氏月閉勞熱醫用通經之品喘嗽氣促怔忡自汗又用寒涼退熱食減肌削乍寒乍熱診其脈弱數而促此下損及中也急用潞參茯神黃耆炙草白芍當歸五味棗仁銀柴胡四劑諸症漸減加山藥熟地炭蓮棗補心脾兼調肺腎熱嗽悉除能進食矣逾月後忽腰腹痛下胎形三寸許兒頭已半損爛豫深自咎臨診未審其母舌青黑與否然計其經閉後已六閲月乃知胞宮血涸胎形不長乾黑纍月必反枯㿉深隱通經破血藥數十劑不能令墮俟氣血通調瘀腐之膈膜者乃去而不復留也況血枯經閉漫與三稜莪朮牛膝桃仁不速之斃乎志此為榨乾汁者鑑李肩挑傷力咳嗽胸痛其損在肺用黃耆潞參茯神百合貝母杏仁當歸白芍甘草紅棗二服即應此從安肺湯加減經所謂損其肺者益其氣也眭肝腎陰虛損久不復冬至後痰咳粉紅嗽聲子夜特甚想虛陽失藏龍火不伏交子時陽氣一動炎灼上凌浸至嬌臟受戕身熱喘促近又食減無味午後頰紅時覺懍懍憎寒是陰傷及陽非萸地酸膩可效必用甘藥培元佐以介屬潛陽冀其封固蟄藏至立春前後地氣上騰症不加重為幸潞參山藥百合甘草五味白芍牡蠣淡菜阿膠數服漸平堂弟嗆嗽氣急脈弦數適逢秋令豫謂此火刑金象也當滋化源以自知醫雜用梨膏止嗽豫謂非法入冬寒熱間作厥氣衝逆灰痰帶紅良由陽亢陰虧龍雷並擾冬藏不密今近立春地氣上升內氣應之喘嗽勢必加重擬方阿膠煬化山藥炒各二錢洋參熟地炒茯神藕節各三錢川貝母炒研一錢甜杏仁炒研錢半棗仁炒研八分五味五分數服頗效又五更服燕窩湯晚服秋石湯降虛火而喘定堂弟肺主出氣腎主納氣今腎少攝鈉時交驚蟄陽氣大升兩關尺通滑兼弦氣由衝脈逆沖而上子夜陽動喘嗽汗泄必起坐不能安臥皆真元不納之咎屢用參耆保固肺脾既屬不濟即用知柏名為滋腎豈能驟安仿葉氏鎮攝法青鉛三錢牡蠣煅研錢半茯神三錢五味八分炮薑四分遠志炒炭錢半故紙鹽水炒一錢三服氣平喘止飲食大進弦脈頓減後用峻補膏方得痊王勞力傷精右尺偏旺是火水未濟之象日晡寒熱嗽血神疲大宜小心調攝否則火燃金燥吐紅嗽喘行將日甚矣五味三分熟地山藥茯苓杞子丹皮各二錢潞參三錢白芍川貝各一錢半遠志錢八分蓮子十粒十數服諸症俱平妹積年羸怯經當斷不斷熱從腿膝上蒸今歲厥陰風木司天又值溫候地氣濕蒸連朝寒熱煩渴寤不成寐悸咳善驚總由陰虧心火燔灼兼乘木火司令氣泄不主內守陽維奇脈不振綱維越人云陽維為病苦寒熱今藩衛欲空足寒骨熱所固然已先培元氣退寒熱待津液上潮冀煩渴漸平用潞參茯神麥冬白芍丹皮龜板熟地柏子仁紅棗蔗汁三服寒熱大減煩渴漸止但覺寒起足脛原方去麥冬龜板加首烏杞子牛膝炒炭壯其奇脈二服不寒但熱原方又去首烏杞子柏子仁加蓮子龍眼肉數十服遂安貢弱冠未室勞力傷陽寒熱痰紅咳則氣促嘔沫頭眩食減色悴肌羸半載不復脈來虛數右部尤少神乃肺氣受傷脾元亦憊理陽兼泄濁為宜用六君子湯加山藥蓮子南棗淡薑煎服四劑寒熱止濁逆平去半夏加貝母茯神五味嗽稀而食進數脈較減又如薏米芡實黃耆歸芍煎丸兼服而瘳後因自服地黃滋膩丸劑食減便溏餌牛肚瀉痢不止又迫於完姻虛嗽聲啞午余寒熱旦夕利數行脈益虛數思食減脾損痢久腎傷陰陽告殘乃求挽救用藥頗難且終罔濟姑與扶肺脾以攝腎潞參茯苓炙草白芍山藥益智訶子五味蓮棗數服甚平但氣下陷則痢迫體懍寒手足口熱寐必口乾此陽虛生寒陰虛生熱而津不上潮也朝用補中湯去柴歸加益智茯神晚用熟地炭五味棗仁白芍貝母薏米麥冬俱炒蔗汁沖服寒熱輕痢如故與桃花湯加參苓五味烏梅溫攝下焦痢仍不減由腸液滑泄已久氣虛不受溫攝而喉痛聲嘶咳吐白沫因春分節後氣溫升泄故也轉方仍用參苓蓮藥補脾五味白芍斂肺沙參桔梗清咽熟地炭叉斛育陰訶子牡蠣醋淬澀下謝氏崩帶後蒸熱頭暈齒痛食後噯腐痞惡不時便瀉始由衝任經傷陰虛生火醫用青鉛鎮攝虛火愈炎中氣愈陷反使髮際汗多如水下部泄氣如風不知症緣陰虧肝陽失制上則為眩暈下則為蒸瀉中則為風翔浪掀食入漾漾欲嘔治宜和陽熄風佐以運脾否則補虛添脹滋腎礙脾勢必食減肌削延成下損及中之咎杞子炭甘菊炭牡蠣粉白芍山梔神麯俱炒半夏青鹽炒茯神丹皮嫩桑葉浮小麥煎湯三服諸症漸平原方去梔曲加鱉甲山藥熟地炭蒸熱漸愈族弟嗜飲傷中濕熱內蘊咳嗽潮熱腹痛嘔瀉脈沉小數左尤澀不戒飲則成酒勞生朮茯苓薏米橘紅茴香製半夏枳椇子砂仁湘蓮炒數服諸症稍定乃用葛花解酲湯去青皮乾薑加製半夏數十服全愈沈少年羸怯晡熱嗆嗽頭眩食減頻嘔苦酸濁沫大便忽溏忽祕脈弦數右尺搏指由相火太強疏泄失司痰濁不降必夢泄足心如烙先驅濕熱以熄龍雷黃柏酒炒六分半夏青鹽制錢半茯苓薏米各三錢吳萸鹽湯泡五分遠志山梔澤瀉各八分橘紅一錢六服痰火降遺泄止去吳萸山梔加生白朮錢半五味三分牡蠣粉二錢諸症俱減調理得平服侄誦讀神疲晡寒宵熱汗嗽食減脈虛右尺弦大此為童損由心脾肺兼及腎陰仿立齋先生治法朝用補中益氣湯去升麻加茯苓棗仁小麥晚用六味湯去山萸加白芍鱉甲五味十數劑寒熱止而精神復勞瘵論治凡男子之勞起於傷精女子之勞由於經閉小兒之勞得於母胎無不始於陰虛生熱然其源流宜條列施治焉有雜病久不愈因積損成勞者宜調營養衛湯有思慮太過郁損心脾而成勞者宜歸脾湯有房勞傷腎遺淋痿弱而成勞者宜鹿胎丸有飢飽傷脾而成勞者宜補中湯加柴胡山藥有積勞疲瘦嗜臥寒熱而成勞者宜十四味建中湯有負重致傷而成勞者宜補中湯有傷暑咯血而成勞者清暑益氣湯加減有縱酒傷脾而成勞者宜葛花解酲湯有童年稟賦怯弱骨蒸黃瘦而成勞者宜麥煎散有婦女經閉由血熱血枯而成勞者宜逍遙散補血養陰丸有情竇初開積想在心真陰煎耗而成勞者宜清離滋坎丸其為勞熱也有氣虛熱必兼少氣自汗體倦心煩八珍湯加減有血虛熱必兼燥渴睡臥不安聖愈湯參人中白丸有往來潮熱必兼膝軟骨節痛參苓建中湯有骨蒸熱必兼肌瘦頰紅鱉甲丸河車丸二仙膠有五心熱必兼體痛口乾逍遙散參生脈散有遍體熱必兼神困肌削十四味建中湯有病久結痰注絡腹脅常熱惟頭面手足於寅卯時乍涼六君子湯加薑汁竹瀝其為勞嗽也或由陰傷陽浮金燥喉癢致嗽宜甘潤養肺清安膏或由腎水虛涸火爍肺金致嗽宜壯水滋液六味丸加麥味或噙化丸或由脾土先虛不能制水水泛為痰致嗽立效方加陳皮白朮或由元陽下虧痰涎喘促虛寒致嗽六味回陽飲理中湯八味丸至勞嗽失音會厭傷也豬脂和白蜜膏肺痿吐膿形肉脫也太平丸白鳳膏勞嗽兼喘腎不納氣也都氣丸加參耆牛膝蛤蚧或杏仁膏其見為血症也嗽血出於肺憂悲所致也宜二冬二母白芨百合桔梗阿膠或潤肺膏痰血出於脾思慮所致也宜苓耆地斛丹陳甘草或酸棗仁湯吐血出於心驚恐所致也宜丹參山藥茯神當歸地黃麥冬或養心湯血成塊出於肝恚怒所致也宜柴芍丹梔生地棗仁沉香或柴胡疏肝散咯血出於腎房欲所致也宜地膝丹苓遠志童便阿膠或坎離既濟丹嘔血出於胃中氣失調火迫絡傷也宜犀角地黃湯凡積勞失血久病吐血並宜獨參湯若夫尸疰瘵症由瘵久生蟲食人臟腑其症蒸熱嗆嗽胸悶背痛或面色㿠白兩頰時紅亦有面色不衰肌肉不損名桃花疰宜紫金錠蘇合香丸又有尸鬼作祟其症沉沉默默不知所苦纍月經時羸頓至死同氣連枝多遭傳染名傳尸勞當補虛以復其元養營湯八味丸殺蟲以絶其根十疰丸桃奴丸凡診視者不宜空腹宜飽食或佩安息香及麝香則蟲鬼不敢侵也附方久勞調營養胃湯參術陳苓歸芍麥五味二地黃耆山藥遠志山萸鴨血蜜煎郁勞歸脾湯人參焦術茯神棗仁龍眼各二錢炙耆錢半當歸遠志各一錢木香甘草各五分薑棗水煎房勞鹿胎丸鹿胎煮熟地八兩用人乳粉山藥各一兩拌蒸菟絲子十兩酒煮杞子八兩乳浸制首烏六兩乳浸曬人參四兩金石斛六兩酒炒巴戟五兩酒炒黃耆五兩酥炙黃蒿膏丸補中補中益氣湯見一卷中風積勞十四味建中湯參耆桂附術草歸芍芎地苓夏麥冬蓯蓉薑棗暑勞清暑益氣湯見一卷暑酒勞葛花解酲湯見一卷濕童勞麥煎散赤苓歸術地草柴胡鱉甲小麥石膏常山乾膝大黃末四味慎用女勞逍遙散見一卷火女勞補血養陰丸歸芍丹地麥味牛膝杞子青蒿鱉甲川斷茯苓益母膏丸情勞清離滋坎丸六味丸料加二冬生地當歸白芍知母黃柏白朮甘草吐血加山藥蓮子咳加枇杷葉貝母栝蔞痰加橘紅熱加骨皮嗽加五味怔忡加遠志棗仁遺精加龍骨牡蠣咽瘡加甘草桔梗痰喘加蘇子久咳加阿膠五味紫菀麥冬虛熱八珍湯見一卷中風虛熱聖愈湯參耆芎歸二地血熱人中白丸歸芍二地人中白白朮鱉甲青蒿羚羊角阿膠百部膏丸潮熱參苓建中湯參苓歸芍陳草桂枝半夏麥冬前胡細辛骨蒸鱉甲散柴胡鱉甲知母秦艽當歸烏梅青蒿地骨皮早晚服骨蒸河車丸紫河車人中白秋石五味人參阿膠人乳地骨鱉甲銀柴胡以百部青蒿童便陳酒熬膏為丸骨蒸二仙膠鹿膠龜膠人參杞子口乾生脈散見一卷暑健脾六君子湯見一卷中風嗽血清安膏麥冬生地各十兩橘紅三兩桔梗甘草貝母各二兩龍眼苡仁各八兩薄荷五錢滋液六味丸見一卷中風勞嗽噙化丸玉露霜柿霜貝母百合茯苓海石秋石甘草薄荷硼砂少許蜜丸嗽痰立效方蔞杏桔貝五味子款冬天冬蔥白川椒每歲一粒共為末納豬肺中荷葉包蒸五更服陽虛六味回陽飲參附薑各二錢熟地五錢當歸三錢草一錢汗加黃耆泄加白朮烏梅陽虛理中湯見一卷中風虛寒八味丸見一卷中風肺痿太平丸二冬二母二地杏桔歸款冬阿膠蒲黃薄荷京墨麝蜜丸肺痿白鳳膏白鴨一隻元棗二升參苓平胃散一升陳酒一瓶將鴨頂血滴酒內飲再去鴨毛及肚雜拭淨將棗去核每棗納參苓平胃末入鴨腹麻線扎定砂鍋內煨將酒三次添入以干為度共搗為丸煎人參湯下嗽喘都氣丸六味丸加五味子勞嗽潤肺膏羊肺杏仁肺霜蛤粉各一兩真酥一兩此與白鳳膏葛可久方也脾血酸棗仁湯見一卷中風心血養心湯耆歸二茯川芎半夏各一兩柏子仁棗仁遠志五味人