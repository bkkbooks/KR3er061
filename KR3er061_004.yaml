脾如胃熱食則汗出如洗二甘湯或牡白散飲酒漏風汗出如浴白朮散肺虛腠易疏泄玉屏風散心虛神不安謐硃砂安神丸天王補心丹腎虛元府不閉六味丸還少丹肝脾虛精血久耗三陰煎士材亦云肺虛者固其皮毛黃耆六一湯心虛者益其血脈當歸六黃湯腎虛者助其封藏五味子湯脾虛者壯其中氣補中益氣湯肝虛者禁其疏泄白芍湯此從乎腑臟為治也其盜汗乃睡中自泄參苓散水火不交心腎丸陰陽偏勝黃耆湯虛損心陽柏子仁湯牡蠣散至如病後氣血俱虛自汗十全大補湯産後血脫孤陽無依大汗不止獨參湯凡津脫者汗大泄大補元煎去杜仲痰盛者汗自流理中降痰湯發汗過劑血虛成痙防風當歸湯汗多亡陽身冷拘急桂枝加附子湯若夫風濕相搏時自汗出防己黃耆湯惡風自汗桂枝湯傷寒陽明少陽症盜汗柴胡湯葛根湯選用溫熱症三陽合病目合則汗白虎湯額汗濕熱上蒸或血蓄胃口迫其津液致之蓄血頭汗劑頸而還犀角地黃湯頭汗小便不利渴而不飲此血瘀膀胱也桃仁承氣湯胃熱上蒸額汗發黃小水不利者五苓散加茵陳甚則茵陳蒿湯利之傷寒脅痛耳聾寒熱口苦頭汗劑頸而還屬少陽小柴胡湯加桂枝茯苓白朮和之少陽挾熱或為盜汗或腋汗脅汗須知從陰陽交互時及陰陽交互處發泄者皆陰陽不和半表半裡症小柴胡湯逍遙散皆合劑也外有頭汗頭者諸陽之會邪搏諸陽津液上湊則頭汗劑頸而還屬血症四物湯濕邪搏陽亦汗出頭額參用勝濕湯調衛湯水結胸無大熱亦汗出頭額小半夏加茯苓湯陽明胃實亦汗出頭額調胃承氣湯胃腑熱蒸手足自汗亦陽明病當下大柴胡湯心腋盜汗久不止參歸腰子當心一片津津自汗名心汗補心丹陰囊汗為腎虛有濕安腎丸主之兩腋汗腳心汗為濕熱流注牡礬丹主之有血汗因膽經熱血妄行與少陰氣並奪命散産後血汗蝟皮湯有黃汗因汗出浴水濕熱內郁耆陳湯一切汗出不止外治法紅粉散惟珠汗不流汗出如油額汗如雨喘促肢冷皆陽脫不治經曰陽有餘為身熱無汗陰有餘為多汗身寒又曰血與汗異名而同類故奪血者無汗奪汗者無血注云奪者迫之使出也又曰腎病者寢汗憎風寢汗即盜汗也東垣曰凡內傷自汗補中益氣湯稍加附子麻黃根浮小麥其效如神但升柴少用兼蜜炙以抑其升發暴悍之性又欲其引參耆等味達肌表也凡服止汗固表藥不應愈斂愈出者只理心血以汗乃心液心不攝血故溢為汗大補黃耆湯加棗仁微熱者加石斛當心汗為思慮傷脾補心丹凡久病不愈必氣血兩虛自汗熱不退補中益氣湯加川附或用歸脾湯如便燥自汗熱不退屬陰血六味地黃湯加生脈散如病陽虛熱極自汗而解汗後又熱汗出如水此陽被汗散發泄在外而不歸元保元湯加浮麥牡蠣或炒焦棉子煎湯如心神不安者加安神丸凡虛陽上攻必求下達保元湯加木瓜使陽氣回元凡汗症有陰陽陽汗者熱汗也陰汗者冷汗也汗之冷者以其陽氣內虛陰中無陽而汗隨氣泄凡大驚恐及病後産後失血後多有汗出是皆陽氣消耗真元失守候也故經曰陰勝則身寒汗出又曰極寒反汗出身必冷如冰是皆陰汗之謂治必扶其正氣其汗乃止若虛甚者非速救真元不可薑桂附子之屬必所當用凡病不當汗而誤汗或當汗而汗之過劑者皆汗多亡陽之症是亦陰症之屬當察其虛之或微或甚微虛者三陰煎或五陰煎獨參湯之類虛甚者非用大補元煎六味回陽飲之類不可凡衛虛不固腠理不密而易汗者是亦陰症之屬宜黃耆六一湯或耆附湯以上四段本景嶽全書醫通曰病後氣血俱虛而汗服諸止汗藥不應用十全大補湯半劑加熟棗仁五錢若胸臆煩悶不能勝陰藥者生脈散加黃耆二錢當歸六分熟棗仁三錢一服即驗夏月汗止半身由氣血不充內挾寒飲偏枯及夭之兆也用大劑十全大補湯人參養營湯大建中湯加行經豁痰藥治之若元氣稍充即間用小續命湯一劑以開發其表或防己黃耆湯加川烏以散其濕此症雖屬血虛不可用四物陰藥以其閉滯經絡故也丹溪曰自汗大忌生薑以其開腠理也凡有汗一切辛辣之味五辛之屬均忌之汗症脈候寸微尺緊虛損多汗肺脈軟而散者病灌汗平人脈虛微細者盜汗出自汗在寸盜汗在尺脈盛汗出病不衰者死汗出而脈脫者不治附方表虛補陽湯參耆術草五味虛加附子裡虛益陰湯萸地丹芍麥味山藥澤瀉燈草地骨皮蓮子虛加人參表裡黃耆湯耆地茯苓天冬麻黃根肉桂龍骨各一錢麥冬五味防風各八分歸草各七分陽虛耆附湯耆附各二錢薑十片陰虛當歸地黃湯歸芍苓術耆柏陳草人參熟地生地知母浮麥棗自汗黃耆建中湯見本卷衄血盜汗當歸六黃湯見本卷衄血胃汗二甘湯生甘草炙甘草五味烏梅薑棗胃汗牡白散煅牡蠣白朮防風各二錢酒風白朮散白朮一兩二錢五分防風一兩五錢牡蠣三錢衛虛玉屏風散見一卷中風心汗硃砂安神丸黃連五錢炙草生地各三錢半當歸二錢半硃砂一錢半心火天王補心丹見一卷火腎汗六味丸見一卷中風補腎還少丹見一卷中風肝脾三陰煎歸地參耆芍五味草棗仁肺汗黃耆六一湯耆六錢草一兩煎服腎汗五味子湯五味山萸龍骨牡蠣何首烏遠志五倍子地骨皮脾汗白芍湯白芍棗仁烏梅盜汗參苓散參苓棗仁心腎心腎丸參耆歸地苓味牛膝蓯蓉菟絲子山藥鹿茸附子龍骨遠志心惕柏子仁湯柏子仁半夏曲各二兩牡蠣人參白朮麻黃根五味各一兩麥麩半兩棗肉為丸斂汗牡蠣散黃耆麻黃根牡蠣小麥病後十全大補湯見一卷中風津脫大補元煎見一卷中風痰汗理中降痰湯參術薑草名理中湯此加苓夏蘇子汗痙防風當歸湯芎歸防地亡陽桂枝加附子湯桂芍草薑棗名桂枝湯此加附子風濕防己黃耆湯見一卷濕少陽小柴胡湯見一卷溫少陽葛根湯葛根麻黃薑桂芍草棗三陽白虎湯見一卷中風蓄血犀角地黃湯見一卷溫血瘀桃仁承氣湯見一卷疫胃熱五苓散見一卷溫發黃茵陳蒿湯見一卷濕陰陽逍遙散見一卷火濕邪勝濕湯茅朮厚朴半夏藿香陳皮甘草薑理濕調衛湯麻黃根黃耆羌麥冬地歸草芩夏豬苓蘇木紅花五味子結胸小半夏加茯苓湯見本卷痰飲胃實調胃承氣湯大黃芒硝甘草陽明大柴胡湯見一卷溫心汗參歸腰子人參當歸各五錢豬腰一個煮再蒸腎虛安腎丸蘆巴補骨脂川楝子茴香續斷各一兩半杏仁桃仁山藥茯苓各一兩外治牡礬丹牡蠣粉黃丹各二兩枯礬四兩研擦血汗奪命散硃砂寒水石麝香等分每服五分又名定命散産血汗蝟皮湯蝟皮燒灰米飲下蝟肉煮食更妙黃汗耆陳湯石膏耆芍麥冬豉草茵陳薑外治紅粉散麻黃根煅牡蠣各一兩赤石脂龍骨各五錢絹包擦之補虛大補黃耆湯參耆術草芎歸萸五味桂心防風各一兩茯苓一兩半熟地蓯蓉各三兩薑棗陰血生脈散見一卷暑培元保元湯見一卷火補虛六味回陽飲見本卷咳嗽偏枯人參養營湯見本卷勞瘵寒飲大建中湯蜀椒乾薑人參飴糖發表小續命湯見一卷中風脫症論治生命以陰陽為樞紐陰在內陽之守陽在外陰之使陰陽互根相抱不脫素問所謂陰平陽祕精神乃治也若夫元海根微精關直泄上引下竭陰陽脫離命立傾矣靈樞云精脫者耳聾氣脫者目不明津脫者腠理開汗大泄液脫者骨屬屈伸不利色夭腦髓消脛酸耳數鳴血脫者色白夭然不澤其脈空虛難經云脫陽者見鬼脫陰者目盲嘉言喻氏又分上脫下脫上下俱脫今詳斯症總由陰陽樞紐不固如上脫者喘促不續汗多亡陽神氣亂魂魄離即脫陽也下脫者血崩不止大下亡陰交合頻精大泄即脫陰也上下俱脫者類中眩僕鼻聲鼾絶汗出遺尿失禁即陰陽俱脫也更有內閉外脫者痙厥神昏産後血暈等症是也治法在未脫之先審其元陽欲絶者於回陽劑中兼引陰參附湯用童便煎真陰欲絶者於攝陰劑中兼固陽固陰煎其心神浮越起臥不安者招集潰散之陽龍蠣救逆湯去桂薑蜀漆加參附棗仁茯神脈微垂絶氣短汗出者收拾虛耗之陰生脈散或人參飲子血脫者益氣吐衄不止獨參湯加參三七童便精脫者填營縱欲走陽救脫湯魂離者鎮肝身外有身定魂丹崩中者固下血漏暴注安崩湯津脫者實衛大汗亡陽收汗丹液脫者滋陰血枯成痿加減四斤丸喘促而吸入短者資化源氣急不續都氣丸類中而神昏者息風火心火暴甚河間地黃飲子去桂附巴戟至於內閉外脫如痙厥神識不醒暫用豁痰鮮菖蒲根汁和送至寶丹産後血暈不蘇急為開竅外燒鐵器淬醋熏鼻或燒蘇合香嗅氣內灌清魂散若血悶用獨聖散參蘇飲凡諸暴脫或孤陽無根而陰失所繫或精血驟去而神失所依洵有如喻氏所見壯歲無病一笑而逝少年交合一注而傾者不早尋罅漏而緘固之其能拯危於一線也哉附方回陽參附湯參附薑攝陰固陰煎參地萸五味山藥遠志炙草菟絲餅救逆龍牡救逆湯龍骨四兩牡蠣五兩炙草二兩大棗十二枚桂枝薑蜀漆各三兩脈微生脈散見一卷暑氣短人參飲子見本卷血精脫救脫湯人參三兩附子一錢黃耆三兩熟地麥冬各一兩五味子一錢魂虛定魂丹參苓歸術麥冬柏子仁棗仁遠志白芥子丹砂龍齒暴注安崩湯參術耆各一兩三七根末五錢水煮津脫收汗丹參耆麥地各一兩棗仁五錢五味三錢當歸五錢甘草一錢液脫加減四斤丸熟地五味蓯蓉牛膝木瓜天麻鹿茸菟絲子喘虛都氣丸見一卷火類中地黃飲子見一卷中風痙厥至寶丹見一卷中風産暈清魂散人參甘草川芎澤蘭荊芥血悶獨聖散五靈脂半炒半生水煎服血悶參蘇飲人參蘇木脫脈案堂弟心力經營煩勞動火消穀善飢坐則手足俱顫寐則手足如墮夢則體析為二神志恍惚呵欠氣泄右脈小弱左虛軟不受按因操勞疲神元氣不受鎮攝若轉失氣須防暴脫食下煩嘈稍定足知中宮底柱乏權急攝陽以交陰潞參茯神山藥五味杞子白芍龍骨牡蠣俱煅研棗仁炒研三服神昏安貼諸症俱減惟巔痛唾涎原方加嫩桑葉炒甘菊以熄肝膽風熱加益智半夏青鹽炒以攝脾涎又數服間服膏方而安此症因其胃旺能納專受滋填用海參煨鴨及火腿雞蛋等皆血肉有情之品故未及兩旬已瘥
