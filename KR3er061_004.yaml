喘中有熱痰遇冷即發麻黃定喘湯遠年咳逆上氣胸滿痞塞聲不出者人參定喘湯虛冷上氣勞乏喘嗽千金用半夏人參薑桂心甘草煎服上氣不得臥生薑人參橘紅紫蘇各一錢五味數粒肥盛多痰喘不能臥元氣未衰者千緡湯或合導痰湯經年喘嗽遇寒更甚者九寶湯安嗽化痰膏喘嗽氣從臍下衝上尺脈洪數兼盜汗潮熱屬陰虛六味湯加補骨脂五味送靈砂丹凡衰病産後喘促者均為少氣雖素有痰火亦由氣虛須大劑生脈散若虛而欲脫元海根搖火沖臍下逆沖而上似喘非喘吞若不及急須峻補鎮攝丹田大劑六味湯加五味牛膝青鉛元武甲心磁石喘與脹二症相因皆小便不利故喘則脹脹必喘先喘後脹者治在肺先脹後喘者治在脾經曰肺朝百脈通調水道下輸膀胱膀胱者州都之官津液藏焉氣化則能出矣是小便之行由肺氣降下而輸化也若肺受邪則失降下之令以致水溢皮膚而生腫滿此喘為本腫為標治宜清金降氣為主而行水次之如脾主肌肉惡濕剋水若脾虛不能制水則水濕妄行外侵肌肉內壅滯上使肺氣不得下降而喘乃生此腫為本喘為標當實脾行水為主而清金次之若肺病而用燥脾之藥則金得燥而愈喘脾病而用清金之藥則脾得寒而益脹矣喘症脈候喘脈宜浮遲不宜急疾喘逆上氣不得臥者死上氣面目腫肩息脈浮大者危上氣喘息低昂脈滑手足溫者生脈澀肢寒者死右寸沉實而緊為肺感寒邪亦有六部俱伏者宜發散則喘定附方通治定喘湯麻杏芩夏草白果款冬蘇子桑皮補攝六味丸見一卷中風發散三拗湯見本卷哮解利華蓋散見本卷咳嗽痰火麻杏石甘湯麻杏石草飲邪桂枝加朴杏湯桂芍草薑棗朴杏暑暍香薷飲見一卷中風暑暍白虎湯見一卷中風利濕四苓散見一卷溫散邪麻黃湯麻桂杏草肺脹小青龍加石膏湯小青龍見本卷咳嗽此加石膏水停越婢加半夏湯見本卷咳嗽水逆真武湯術附苓芍薑氣痰溫膽湯見一卷溫火痰清膈煎廣皮錢半貝母浮石各二錢膽星一錢木通錢半白芥子七分怒喘三因四七湯苓夏蘇朴薑棗肺虛生脈散參五味麥冬胃虛人參五味湯參術廣皮各一錢五味九粒麥冬杏仁各八分薑三片棗二枚引火七味八味丸見一卷中風八味丸加牛膝車前名腎氣丸納氣都氣丸六味丸加五味子産喘參蘇飲人參一兩蘇木二兩敗血血竭散血竭沒藥各一錢以陳酒童便各半煎沸調服老人杏仁丸杏仁核桃肉蜜丸虛衰嵩崖脾腎丸腎氣丸加骨脂益智砂仁支飲苓桂朮甘湯苓桂術草少氣保元湯見一卷火少氣異功散見一卷中風氣逆四磨湯見本卷哮氣逆七氣湯參桂夏草薑氣逆杏子湯麻桂杏芍薑天冬降氣蘇子降氣湯見本卷失音腎氣麻黃附子細辛湯麻附辛氣衝靈砂丹水銀硫黃二味炒成砂子入水火鼎煅煉為末糯米糊丸麻子大每服三丸米飲下肺寒參蘇溫肺湯參苓術草桂夏陳蘇五味木香桑皮薑寒包熱麻黃定喘湯即前定喘湯久嗽人參定喘湯人參麻黃炙草阿膠半夏各一錢五味桑皮各五分粟殼二分薑三片痰喘千緡湯半夏七粒皂角去皮弦炙草各一寸薑二片膠痰導痰湯見一卷中風喘嗽九寶湯麻杏蘇桂陳荷薑草桑皮腹皮烏梅喘嗽安嗽化痰膏見本卷咳嗽喘脈案趙衰年喘嗽痰紅舌焦咽燥背寒耳鳴頰赤脈左弦疾右浮洪而尺搏指按脈症系冬陽不潛金為火爍背覺寒者非真寒也以父子懸壺忽而桂附忽而知柏忽而葶藶逐水忽而款冬泄肺致嗽血益加身動即喘坐則張口抬肩臥則體側喘劇因側臥則肺系緩而痰益壅也思桂附既辛熱助火知柏亦苦寒化燥非水焉用葶藶泄熱何借款冬細察吸氣頗促治宜攝納但熱蒸膩痰氣衝咽痛急則治標理先清降用川百合貝母杏仁麥冬沙參牡蠣阿膠水化燕窩湯煎一啜嗽定而痰紅止去杏仁牡蠣阿膠加生地竹茹丹皮元參羚羊角午服以清上中浮遊之火用熟地五味茯神秋石龜板牛膝青鉛晚服以鎮納下焦散越之氣脈症漸平族某七旬以來冒寒奔馳咳嘔喘急脈弦滑時喛冷氣夫寒痰停脘必嘔宿痰阻氣必咳老人元海根微不任勞動勞則嗽嗽則氣升而喘必靜攝為宜仿溫肺湯用辛溫止嗽以定喘淡乾薑五味乾薑五味攝太陽而定喘古人治嗽喘必二味同用桑皮炙茯苓潞參甜杏仁橘紅製半夏款冬花紫衣胡桃數服喘嘔俱定十服全瘳李喘由外感者治肺由內傷者治腎以肺主出氣腎主納氣也出氣阻而喘為肺病吸氣促而喘為腎病今上氣喘急遇煩勞則發不得臥息必起坐伏案乃定近則行步亦喘是元海不司收納之權致膠痰易阻升降之隧急急攝固真丸熟地炭牛膝炭茯神五味萸肉補骨脂蓮子俱炒數服頗安貢積年痰嗽脈細形衰動則疝氣偏墜病因肝腎久損客冬心事操勞身動即喘痰嗽益劇肉消骨立是五液悉化為痰偏臥不舒是陰陽亦乖於用所謂因虛致病積損成勞候也右脈沉數無力左脈浮數無根良由下元真氣失納以致下引上急吸入頗促而為短氣若不納使歸源將下元根蒂都浮喘嗽何由鎮靜況症本腎虛水泛為痰必非理嗽滌飲可效奈何膽星竺黃芥子芩柏等無理亂投不知顧忌昨議服固攝之品痰氣較平而脈象未改是損極難復維繫不固有暴脫之憂今酌定晨服都氣丸加參朮遠志故紙晚服腎氣湯去萸瀉丹皮桂附加茯神五味杞子沙苑子蓮子棗仁冀其氣平而痰嗽自定嶽少年體質陰虧兼傷煩勞脈虛促熱渴頰紅痰血喘急速進糜粥以扶胃食頃喘定症宜清調肺衛潤補心營甜杏仁阿膠水化沙參川貝茯神棗仁麥冬石斛蔞仁黃耆蜜炒三服脈勻症退繼進燕窩湯嗽喘悉止治以培土生金潞參山藥炙草玉竹五味茯神杏仁蓮子紅棗食進丸用加減都氣而安服侄初春脈左弦長直上直下喘嗽吐紅夢泄冬陽不潛足少陰經與衝脈同絡陰虛火炎氣衝為喘絡傷為血乃元海根蒂失固醫者不知納氣歸原泛用歸耆朮草症勢加劇寒熱咳逆血升氣促衝脈動諸脈皆動總由肺腎失交急急收納務令陽潛陰攝阿膠水化牡蠣醋煅龜板酥炙龍骨煅五味山藥高麗參茯神棗仁坎氣焙研數服嗽平血止去坎氣加青鉛沖氣亦定倪年近七旬木火體質秋嗽上氣喘急痰深而黃甚則不得臥息須防暈厥治先平氣定喘蜜桑皮蘇子杏仁川貝母茯神栝蔞百合二服後加白芍麥冬述舊服兩儀膏痰多食減今訂膠方減用熟地砂仁末拌熬曬乾四兩高麗參一兩茯苓三兩甜杏仁炒研五兩蓮子八兩棗仁一兩枇杷膏四兩燕窩兩半橘紅八錢貝母一兩山藥三兩阿膠一兩各味熬汁阿膠收開水化服某腎不納氣則喘息上奔脾不輸精則痰氣凝滯今痰哮不利呼吸頗促病本在脾腎而肺胃其標也由冬延春脈候若斷若續忽神煩不寐語譫舌灰虛中夾溫治先清降杏仁栝蔞象貝茯神潞參菖蒲汁沖服一劑嗽定得寐舌苔稍退進粳米粥喘息乃粗脈見虛促急用納氣歸原冀根蒂漸固高麗參五味牛膝炭遠志茯神杞子蓮子牡蠣粉六服間用七味地黃丸而安痰飲論治痰飲皆津液所化痰濁飲清痰因於火飲因於濕也痰生於脾濕勝則精微不運從而凝結或壅肺竅或流經隧飲聚於胃寒留則水液不行從而泛濫或停心下或漬腸間此由脾胃水濕陰凝必陽氣健運則濁陰下降如烈日當空則煙雲消散宜以理脾逐濕為治者也若夫腎陽虛火不制水水泛為痰則飲逆上攻故清而徹治宜通陽泄濕忌用膩品助陰如四物六味等湯腎陰虛火必爍金火結為痰為痰火上升故稠而濁治宜滋陰清潤忌用溫品助燥如二陳六君子等湯治法所必辨也夫清徹為飲稠濁為痰飲惟停蓄腸胃而痰則隨氣升降遍身皆到龐氏云天下無逆流之水因乎風也人身無倒上之痰因乎氣也在肺則咳在胃則嘔在心則悸在頭則眩在背則冷在胸則痞在脅則脹在腸則瀉在經絡則腫在四肢則痹變幻百端昔人所謂怪症多屬痰暴病多屬火也然又謂見痰休治痰者以治必探本恐專事消滌重虛其胃氣反滋膨脹耳丹溪云胃氣亦賴痰以養攻滌則胃虛而痰愈劇亦有但治其痰者如風痰散之防風丸加南星生薑風兼寒者青州白丸子寒痰溫之理中化痰丸暑痰豁之消暑丸濕痰燥之二術二陳湯白朮丸燥痰潤之潤肺飲加杏仁白蜜火痰清之清氣化痰丸食痰消之保和丸栝蔞丸酒痰化之瑞竹堂化痰丸郁痰解之三因七氣湯加鬱金菖蒲香附氣痰利之咯不出咽不下如敗絮如梅核七氣湯三仙丸驚痰泄之控涎丹加辰砂蠍尾老痰軟之如海石海粉芒硝瓦楞子之類或青礞石丸頑痰吐之三聖散青緑丸虛者參蘆散加竹瀝在上者湧之桔梗蘆散或稀涎散在下者導之導痰湯甚者滾痰丸在脾者黃滑而易出二陳湯加枳術在肺者白如米粒澀而難出利金湯去薑枳加玉竹蜜水沖在肝者青而多泡川芎丸加星枳甚者千緡湯在心者赤結如膠黏半黃丸在腎者黑而多咸桂苓丸加澤瀉車前留脅下者天陰隱痛二陳湯加白芥子滯經絡者筋骨牽痛荊瀝竹瀝薑汁行之或旋覆花湯加桂枝入四肢者手足疲軟導痰湯加桂枝薑黃竹瀝隱皮裡膜外者腫而麻木二陳湯加白芥子薑汁竹瀝或成塊流走不定導痰湯加薑汁竹瀝或成核結聚項間痰核丸痰核酒膈上停痰痞悶小陷胸湯加茯苓枳實薑汁竹瀝脘中伏痰臂痛指迷茯苓丸痰滯氣逆嗽多六安煎寒涎沃膽不眠溫膽湯多驚者加蠍尾痰挾死血攻注控涎丹加韭汁桃仁木香胡椒鯪鯉甲痰結窠囊嘔吐薑汁竹瀝韭汁飲中風痰迷心竅屬寒者滌痰湯下牛黃丸屬熱者下二丹丸癲癇痰悶抽掣牛黃丸此皆治其標也如求其本脾虛濕痰宜健脾以運之四君子湯參朮健脾丸肺熱火痰宜清肺以潤之清肺飲四陰煎脾肺氣虛不運生痰者六君子湯加木香肺胃氣虛不化生痰者六君子湯加桔梗脾氣滯者異功散加砂仁中氣弱者補中益氣湯脾胃虛挾濕者脈濡緩痰清稀六君子湯加炮薑補中益氣湯加茯苓半夏肝腎虛痰中見血者六味湯加烏鰂魚骨參三七腎陰虧火動痰升者五味天冬丸百花膏相火爍痰津涸者滋陰清化丸腎陽衰水泛為痰者薛氏八味丸如不應真武湯勞損咳白痰如雞蛋清俗名白血者補肺湯此乃治痰之本矣且痰飲同稱而殊治豈可混乎試由痰論飲內經有飲無痰其論飲病皆由濕淫土鬱至金匱乃立痰飲懸飲溢飲支飲留飲伏飲等名皆停水為患如其人昔肥今瘦水走腸間漉漉有聲為痰飲必目眩短氣飲在陽則呼氣短苓桂朮甘湯飲在陰則吸氣短腎氣丸金匱云短氣有微飲當從小便利之苓桂朮甘湯腎氣丸主之飲後水流脅下咳唾引痛為懸飲脈必沉弦十棗湯飲水流於四肢當汗不汗身體疼重為溢飲小青龍湯咳逆倚息短氣不得臥形如腫為支飲葶藶瀉肺湯或五苓散水停心下背寒冷如掌大短氣肢節痛脅痛引缺盆脈沉為留飲導痰湯膈滿喘咳嘔吐寒熱腰背痛身振瞤為伏飲倍術丸加茯苓半夏痰飲不渴小半夏湯支飲眩冒澤瀉湯心下痞膈間有水悸眩小半夏加茯苓湯茶飲過多成癖及飲酒成癖薑桂丸飲癖嘔酸嘈雜心懸如飢三聖丸蒼朮丸別有非痰非飲吐清涎沫者脾虛不能收攝也六君子湯加益智薑渴欲飲水水入即吐者名水逆五苓散大法外飲在脾內飲在腎治脾苓桂朮甘湯治腎腎氣丸氣壅者開之小青龍湯去麻辛嗆咳者平之鮮枇杷葉杏仁茯苓前胡蘇子桑皮濁逆者溫之真武湯陽微者和之外臺茯苓飲濕滯者滲之五苓散留飲者逐之桂苓湯支結入絡者通之茯苓桂枝湯加參草川椒半夏薑蜀漆飲症通治五飲湯仲景云治痰飲當以溫藥和之此可謂一言提要者矣仲景曰飲而兼咳者但治飲不必治咳繆仲淳曰生痰之源不一治各不同由陰虛火炎上迫乎肺凝結為痰是謂陰虛痰火痰在肺而本於腎治宜降氣清熱益陰滋水忌辛溫燥熱補氣藥由脾胃寒濕生痰或飲啖過度致脾氣壅滯為痰此病在脾胃無關肺腎治宜燥脾利氣忌滯膩寒苦濕潤藥由風寒鬱熱生痰病亦在肺治宜豁痰清利中佐以辛溫麻黃生薑之類以散外寒忌溫補酸收藥則藥無格拒之患夫痰質稠黏飲惟清水或青緑苦酸多因過飲茶酒或情抱抑鬱中寒濕阻治宜燥濕利水溫通陽氣以行之二陳五苓真武之屬張路玉曰痰飲變生諸症必以治飲為先諸症自愈如頭風眉稜骨痛屢用風藥不效投以痰劑收功患眼赤羞明而痛與涼藥弗瘳畀以痰劑獲效凡此之類不一而足在審症圓機耳如太陰痰厥頭痛不專治風亦此意也痰飲脈候脈沉者留飲雙弦者寒也偏弦者飲也肺飲不弦但苦喘滿短氣支飲亦喘不得臥短氣其脈平沉而弦者懸飲肝脈軟而散色澤者溢飲提綱曰痰脈弦滑三因曰飲脈皆沉細弦滑病人一臂不遂時復移在一臂其脈沉細非風也必有飲在上焦痰得澀脈必費調理以痰膠固脈道阻塞也左右關脈實大而浮膈上有稠痰也宜吐之病人百藥不效關上脈伏而滑者痰也眼胞上下如黑煤者亦痰也回春曰眼黑而行步呻吟舉動艱難入骨痰也非萆薢苦參不除其遍體骨節痛審氣血加化痰藥入門曰痰厥者因內虛受寒痰氣阻塞手足厥冷麻痹暈倒脈沉細也用藥濕痰主半夏佐茯苓蒼朮風痰主南星佐前胡白附燥痰主貝母佐栝蔞杏仁火痰主竹瀝佐花粉黃芩寒痰主薑汁佐半夏蘇子食痰用神麯山楂麥芽酒痰用花粉白朮神麯或四苓散驚痰用天竺黃牛黃膽星老痰用海浮石栝蔞川貝氣痰用廣皮枳殼鬱金汁膠痰用橘紅杏仁荊瀝痰核半夏連翹貝桔枳星夏枯草等痰結朴硝枳實海藻薑汁痰在四肢非竹瀝不達痰在脅下非白芥子不除痰在皮裡膜外非薑汁竹瀝白芥子不到痰在經絡非薑汁竹瀝不行痰中帶血宜韭汁阿膠痰迷癲癇宜控涎丹氣實痰盛宜三子養親湯實熱老痰礞石滾痰丸風寒痰湧及小兒驚風青州白丸子痰血塞心竅癲狂白金丸痰實積飲宜小胃丹降痰氣宜蘇子降氣湯潤下丸海粉熱痰能清濕痰能燥堅痰能軟頑痰能消石膏墜痰火極效黃芩青黛治熱痰假其下行也枳實治痰有推牆倒壁之功五倍子治老痰元明粉治熱痰以其能降火軟堅也硝石礞石大能降火消痰結研細和白糖舌餂服效蒼朮治痰飲成窠囊行痰極效附方風痰防風丸防風川芎天麻甘草蜜丸硃砂為衣荊芥湯下寒痰青州白丸子生白附子生南星生半夏川烏糯米汁為丸寒痰理中化痰丸參術薑草加苓夏暑痰消暑丸見一卷暑濕痰二術二陳湯二術苓夏陳草濕痰白朮丸星夏術為丸薑湯下燥痰潤肺飲二母陳苓麥桔花粉生地草薑火痰清氣化痰丸杏蔞枳夏星陳芩苓薑汁糊丸食痰保和丸楂肉二兩半夏神麯橘紅麥芽茯苓各一兩黃連連翹蘿蔔子各五錢水丸食痰栝蔞丸蔞仁半夏山楂神麯糊丸酒痰瑞竹堂化痰丸星夏青陳杏葛蘿蔔子蘇子楂肉麥芽神麯香附薑汁郁痰七氣湯見本卷咳嗽氣痰三仙丸南星曲半夏曲各四兩香附二兩糊丸驚痰控涎丹甘遂大戟白芥子糊丸薑湯下一名妙應丸老痰青礞石丸礞石打碎用焰硝二兩同入瓦罐內泥封煅石色如金為度水丸一名奪命丹頑痰青緑丸石青一兩石緑五錢研飛曲糊丸緑豆大每服十丸吐痰不損人吐痰參蘆散參蘆二錢或加竹瀝和服取吐虛人最宜膈痰桔梗蘆散桔梗蘆一二錢研服探吐湧吐稀涎散見一卷中風降下導痰湯見一卷中風降下滾痰丸礞石一兩沉香五錢大黃黃芩各八兩百藥煎一兩水丸肺痰利金湯桔貝陳各三錢茯苓二錢枳殼錢半甘草五分薑煎肝痰川芎丸芎荷辛防桔草蜜丸喘痰千緡湯見本卷喘熱痰半黃丸南星半夏黃芩各一兩薑汁浸蒸餅為丸腎痰桂苓丸肉桂茯苓蜜丸絡痰旋覆花湯旋覆花蔥管新絳痰核痰核丸硼砂沉香貝母百草霜鍾乳粉陳苓術草蘇葉鵝管石石膏白糖和丸痰核痰核酒都管草根三升兔耳一枝箭白果紫花地丁各一斤威靈仙二兩酒一罈煮痰痞小陷胸湯黃連半夏栝蔞伏痰指迷茯苓丸半夏曲二兩茯苓一兩枳殼五錢風化硝二錢半薑汁糊丸薑湯下痰嗽六安煎見本卷咳嗽膽虛溫膽湯見一卷溫痰迷滌痰湯見一卷中風痰癇牛黃丸膽星全蠍蟬蛻各二錢半牛黃白附子殭蠶防風天麻各錢半麝香五分煮棗肉水銀為丸熱痰二丹丸丹參熟地天冬各兩半麥冬茯神甘草各一兩丹砂人參菖蒲遠志各五錢蜜丸健脾四君子湯六君子湯見一卷中風補脾參朮健脾丸參苓術草陳名異功散此再加歸芍薑棗潤燥清肺飲見本卷咳嗽清肺四陰煎生地麥冬白芍百合沙參貝母阿膠各二錢茯苓花粉各錢半生甘草五分補中補中益氣湯見一卷中風痰血六味丸八味丸見一卷中風薛氏八味丸以茯苓為君火升五味天冬丸天冬味搗丸痰嗽百花膏百合款冬蜜丸加紫菀百部烏梅名加味百花膏相火滋陰清化丸二冬二地二母苓五味草花粉山藥蜜丸陽衰真武湯術附苓芍薑勞嗽補肺湯參耆五味紫菀痰飲苓桂朮甘湯苓桂術草逐飲腎氣丸即八味丸加牛膝車前懸飲十棗湯芫花甘遂大戟大棗溢飲小青龍湯見本卷咳嗽支飲葶藶瀉肺湯葶藶大棗泄濕五苓散見一卷溫伏飲倍術丸白朮桂心乾薑蜜丸痰飲小半夏湯半夏生薑支飲澤瀉湯澤瀉白朮悸眩小半夏加茯苓湯夏苓薑飲癖薑桂丸南星半夏肉桂飲癖三聖丸即前三聖散嘔酸蒼朮丸蒼朮棗為丸和陽外臺茯苓飲見一卷中風留飲桂苓湯茯苓四錢桂枝白朮各三錢甘草一錢通絡茯苓桂枝湯苓桂芍草薑棗通治五飲湯參術橘枳夏朴桂芍澤瀉草二苓旋覆花痰逆三子養親湯蘇子白芥子蘿蔔子痰血白金丸白礬三兩鬱金七兩薄荷糊丸逐水小胃丹芫花甘遂大戟大黃黃柏以白朮膏丸降痰蘇子降氣湯見本卷失音熱痰潤下丸半夏二兩南星炙草黃連黃芩各一兩橘紅半斤鹽水制蒸餅為丸痰飲脈案朱氣逆濁飲上升甚則中夜起坐醫用二陳兼旋覆代赭湯不應診脈乃陽微濁逆用外臺茯苓飲加乾薑沉香汁愈侄脈沉弦為停飲由脾陽不運輸水濕留胃故食後清稀宿水傾吐而出按仲景論飲邪當以溫藥和之金匱治痰飲胸脅支滿苓桂朮甘湯主之今仿其法而更其制以茯苓泄水桂枝通陽白朮燥濕甘草和中加砂仁半夏枳殼蘇子運脾以降濁研末服薑湯下積飲遂除貢飲症吐青緑苦沫乃膽氣所溢用溫膽湯加吳萸乾薑蒼朮逐濕滌飲吐止嗣用蒼半苓陳散加益智仁焦朮粳米共為末薑湯調服溫理脾陽而安丁積年痰飲脈虛右尺大宿疴因勞力中虛而發用六君子湯加薏苡煨薑椒目服效貢痰飲久嗽清晨濁沫上干必傾咳吐出膈上乃寬此由宿食化痰趁胃虛隨氣上升故也然細參症脈必腎中陽虛仲景所謂腎虛水泛為痰以腎氣丸補而逐之向服崔氏八味丸雖未速效猶是對症主治惟客歲自用倒倉法洗滌停痰宿飲乃為間道出奇王節齋明醫雜著云腸胃為倉倉中有陳腐敗谷須倒出之腸胃中有痰血積滯須蕩滌之若病不屬腸胃不可輕用據此宜乎用之無益王脈沉弦始則頭痛悶嘔舌白惡食繼則氣阻脘痛攻注腰臍隨觸輒嘔背寒心悸下利溺少九晝夜不能著枕固是濕阻氣痹但醫者混治謬托消和不知飲邪入絡上干為頭痛下滲為瀉利漬入太陽為背寒停於心下為悸動金匱云口乾不欲飲水者為飲邪未去故也今飲入支絡不用辛溫通逐痛嘔焉止仿小半夏湯加茯苓川椒目枳殼吳萸桂枝沉香磨汁日再服痛緩得臥糜粥得下背寒心悸俱卻惟臍腹㽱結時嘔時痛乃支絡濁滯未淨改用通絡導滯歸鬚小茴香生楂肉橘核青鹽拌炒山梔薑汁炒茯苓枳殼降香末痛嘔悉平改用和中運濕製半夏砂仁茯苓炙草穀芽大豆黃卷薏苡陳皮全瘳血症總論稟水穀之精華出於中焦以調和五臟灑陳六腑者血也生化於脾宣布於肺統於心藏於肝化精於腎灌輸百脈其清而純者為守臟之血清中之濁者為腑絡之血清中之清者為營經之血皆有氣以護之膜以隔之絡以通之原不至上溢而下脫也一有偏傷或怒勞迫而上升或陰陽虛而失守則為吐為衄為嘔為咯為咳血唾血經所謂陽絡傷則血外溢也或陰虛陽搏或陽衰陰脫或濕熱下陷則為崩中為漏下為溺血為便血為腸風血痢經所謂陰絡傷則內溢也更有瘀血在裡漱血不欲咽小腹滿身黃便黑在上則喜忘在下則如狂傷寒論所謂三焦蓄血證也夫血行清道出於鼻行濁道出於口吐血出於胃衄血咳血出於肺嘔血出於肝咯血出於心痰涎之血出於脾唾血出於腎鼻血為衄口鼻俱出為腦衄耳血為衈目血為眼衄齒血為牙衄舌血為舌衄九竅俱出為大衄胸前一孔出血為心漏臍間出為胃血膚血為紅汗為肌衄上出如泉湧為血溢衝任不攝為崩漏由精竅出溺孔出為血淋由膀胱出不痛為溺血色稠紅為結陰便血清而色鮮四射如濺為腸風濁而色暗為臟毒膿血雜痢為腸癖射血如線為痔血凡血色鮮濃者屬火紫黑者火極晦淡無光者陽衰不能攝陰粉紅者肺血赤如朱漆光者心包血鮮稠濃紫者脾肝血痰唾雜紅點紅絲者腎血血雖少治最難吐多成碗成盆者胃血胃多氣多血欲知何臟之血吐在水碗中浮者肺血沉者肝血半沉半浮者心血各隨所見以羊肺羊肝羊心煮熟蘸白芨末日食之吐血服藥而血不止乃肺上有竅也用白芨末以豬肺煮熟蘸食之日服三四次使竅為芨末填滿其血自止方名獨勝散下注之血血淋多因房勞腎虛溺血多因氣化移熱便後血為遠血由腸胃來便前血為近血由肛門出濺射者風淫點滴者濕著血下行為順其治易上行為逆其治難得寒則凝澀得溫則行見黑則止常隨氣行氣和則血循經氣逆則血越絡上溢之血火乘之實氣逆之也故治血宜調氣不宜降火猛進苦寒以寒能凝澀且易傷脾若脾傷則愈不能統攝諸血以歸經矣入手須辨陰陽陽症吐衄血色鮮紅陰症血色紫暗如豬肝陽症脈洪滑口渴面紅喘煩溺赤火載血升宜清降涼劑陰症脈虛數口乾頰赤煩躁足冷乃真陽失守無根之火上炎宜引火歸元切忌寒涼降火治火前後調理須按三經用藥宜歸脾湯蓋心主血肝藏血脾統血此方乃三經主劑也遠志棗仁補肝以生心火茯神龍眼補心以生脾土參耆術草補脾以固肺金木香香先入脾總欲使血歸於脾故名歸脾湯有鬱怒傷肝思慮傷脾者尤宜如火旺加黑梔丹皮火衰加桂心再以八味地黃丸培先天根本治得其要矣凡血症見咳嗽喘滿及膈左右脹痛者病在肺也宜清降不宜升浮如膻中一絲牽痛或懊惱嘈雜者病在心包也宜營養不宜耗散如腹膨不飢食不知味吐涎沫者病在脾也宜溫中不宜酸寒如脅肋牽痛躁擾不安往來寒熱者病在肝也宜甘緩宜疏利不宜祕滯如氣短似喘咽痛音啞骨蒸盜汗者病在腎也宜滋陰壯水不宜香燥如嘔吐煩渴大熱不得臥者病在胃也補瀉當察兼症勿謂陽明儘可攻也至用藥有君臣或專用兼用當知其類如治血虛甘溫為主宜人乳鹿膠阿膠熟地杞子炙草龍眼紅棗甘酸為佐山藥茯苓棗仁山萸五味牛膝白芍又如天真丸海參膠烏骨雞丸河車膏燕窩飲皆血肉有情補法血虛熱當涼潤生地麥冬蓮子茯神小麥沙參玉竹藕汁茅根童便血虛寒宜辛熱桂心炮薑杜仲沉香必火不歸元者用之氣逆血升宜苦降山梔丹皮赤芍栝蔞枳殼杏仁蘇子鬱金血熱妄行宜鹹寒苦寒犀角元參三七鮮生地黃連黃芩知母青黛血虛而滯宜辛甘以和之桂枝當歸橘皮丹參澤蘭益母側柏葉血滯而痛宜辛溫以行之韭汁當歸鬚延胡鬱金便香附五靈脂降香末血陷下宜辛苦香以舉之白芷川芎升麻血滑脫宜酸澀收之花蕊石續斷白芨蓮房地榆百草霜烏梅蒲黃灰棕灰發灰氣虛血脫宜溫補以攝之人參黃耆白朮炙草血枯經閉宜鹹溫以通之烏鰂魚骨藘茹牛膝肉蓯蓉血瘀而結宜苦瀉之酸泄之大黃桃仁三稜蘇木紅曲紅花茜根山楂琥珀血積而堅宜鹹寒以軟之元明粉牡蠣青鹽旋覆花秋石鯪鯉甲血燥宜甘潤以滑之乳酪蜂蜜黃明膠核桃肉柏子仁雞蛋黃麻仁芝麻其風淫襲血散之防風炒荊芥秦艽紫蘇葉溫邪嗆血清之甘蔗甜梨石斛銀花露天冬象貝母暑暍嗽血涼之杏仁扁豆沙參竹葉麥冬薄荷百合火熱迫血瀉之石膏花粉連翹犀角龍膽草梔心地骨皮生地丹皮童便此用藥類例也凡口鼻出血皆陽盛陰衰有升無降血隨氣上越出上竅法當補陰抑陽氣降血自歸經矣然有陽氣本虛復為寒涼所傷致脈沉而不浮尺小於寸右弱於左色夭而血黯宜生脈散加肉桂熟附炙草繼以理中湯八味丸間服若果受寒氣食冷物血得寒則凝不歸經絡色必黑黯脈必沉遲身必清涼若此者不用薑桂而用涼血之劑殆矣吐血論治咳血嗽血咯血唾血嘔血附吐血陽亢陰虛症也症有三因外因系火風暑燥之邪內因系肝腎心脾之損不內外因系墜跌努力煙酒之傷外因者火灼風溫之嗆血暑瘵燥咳之傷血邪在肺衛心營理肺衛宜甘涼肅降如沙參麥冬貝母花粉玉竹石斛治心營宜輕清滋養如生地元參丹參連翹竹葉茯神以此二法為宗隨症加減火灼則加入苦寒如山梔黃芩知母地骨皮風溫則參以甘涼如蔗汁蘆根羚羊角桑葉暑瘵入營則兼清潤如杏仁銀花鮮生地犀角燥咳在氣則佐純甘如天冬梨棗阿膠別有內熱外寒吐血者宜麻黃參芍湯主之此治客感吐血大略也內因者怒動肝火宜苦辛降氣如蘇子鬱金降香丹皮山梔栝蔞橘白郁損肝陽宜六郁湯郁損肝陰宜甘酸熄風如阿膠雞蛋黃金橘白芍生地思傷心脾宜甘溫益營如保元湯歸脾湯房勞傷腎其陰虛失納者宜壯水鎮陽青鉛六味飲加五味牛膝童便陽虛不攝者宜導火歸窟肉桂七味丸加童便奪精亡血者急固真元大填精血如人參海參熟地河車膠杞子五味紫石英此治內損吐血大略也不內外因者墜跌血瘀上泛先須導下復元活血湯代抵當湯或用韭白汁散之再用通補元戎四物湯或當歸鬱金牛膝白芍三七若努力傷血調補忌用凝澀宜和營通絡理虛當歸建中湯旋覆花湯或六味飲加牛膝杜仲若煙酒傷肺煙辛泄肺酒熱戕胃皆能助火動血嗆血改定紫菀茸湯去朮加芍飲多傷胃失血六君子湯加香砂葛花此治不內外因大略也以上參用指南邵序凡血來如潮湧喘息未定飲還元水立定吐血乍止用燕窩冰糖各四餞煎服七日可不復發血出汪洋不即凝者煩勞動胃火也犀角地黃湯加桃仁藕汁童便血出散漫不聚者煩勞傷肺氣也補中益氣湯去柴胡加麥味茯苓山藥脅痛吐血者肝氣逆也化肝煎神勞吐血者心氣損也天冬湯龍焰升則吐衄驟加宜潛火海參淡菜龜甲心茯神熟地五味子熬膏秋石湯下元海空則行動喘促速固根蒂人參核桃坎氣杞子牛膝五味沙苑子茯苓人乳粉胃納少則中宮乏鎮須扶胃陽切勿清嗽人參建中湯歸耆異功散胃絡虛則厥陽易犯急調胃陰可免升逆生脈散加白扁豆沙參玉竹石斛茯神或金匱麥門冬湯去半夏加杏仁仁齋所謂血症經久多以胃藥收功也若夫肺痿吐血人參固本膏勞怯吐血四陰煎血虛發熱當歸補血湯血虛發痙十全大補湯脾肺氣虛養營湯絡脈不和當歸鬚雞血藤膏牛膝降香鬱金韭白汁血色鮮紫吐後神疲懶言以補氣藥攝之獨參湯血色晦淡息微脈緩為血寒不得歸經以辛甘溫攝之大劑理中湯尺脈虛弦大劑生料六味丸加肉桂其勞動火口津干能食脈洪數元霜紫雪膏數吐血兩口不渴不發熱數月又發胸中刺痛小烏沉湯送黑神散吐後胸滿痛脈洪大有力用當歸丹皮酒大黃元明粉桃仁延胡從大便導之不可驟用止澀不可專行膩補不可輕用苦寒不可妄用攻伐審症切脈以調之勿拘成法可耳繆仲淳曰吐血有三訣宜行血不宜止血血不循經絡者氣逆上壅也行血令循經絡不止自止止之則血凝血凝必發熱胸脅痛病日痼矣宜補肝不宜伐肝經云五臟者藏精氣而不瀉者也肝主藏血吐血者肝失其職也養肝則肝平而血有所歸伐肝則肝虛不能藏血愈不止矣宜降氣不宜降火氣有餘便是火氣降則火降火降則氣不升血隨氣行無溢出上竅之患且降火必寒涼之劑反傷胃氣胃氣傷則脾不能統血血愈不能歸經矣咳血因咳見血系火乘肺金乾咳絡傷而血滲出也治同嗽血嗽血因嗽時氣急喘促痰雜血絲血點亦火傷血膜而血隨痰出也諸家以咳嗽血出於肺景嶽謂咳嗽咯唾諸血皆源於腎以腎脈貫膈入肺循喉肺腎相聯因腎水虧則火爍金肺燥絡損液涸成痰病之標在肺其本固由腎也治主壯水清金宜六味丸加麥冬五味兼潤肺止嗽宜阿膠貝母百合紫菀血止後胃虛食少氣息不續劫勞散去半夏加紫菀茸及瓊玉膏等其先嗽痰後見紅者為積痰生熱宜降痰火以栝蔞貝母山梔橘紅水煎下天門冬丸先見紅後嗽痰者為陰虛火動宜滋化源六味阿膠飲陰虛久嗽痰中血星如珠生料六味丸加茜根烏鰂骨和童便久嗽痰帶血絲如縷六味丸加蛤粉阿膠童便臨臥服嗽血潮熱八珍湯加貝母五味嗽血成勞肌削神疲五心煩熱咽乾頰赤盜汗減食人參飲子或四君子湯加黃耆鱉甲麥冬五味天士先生曰凡咳血之脈右堅者治在氣分系震動胃絡所致宜薄味調養胃陰如生扁豆茯苓北沙參薏苡仁石斛等左堅者乃肝腎陰傷所致宜地黃阿膠杞子五味等脈弦脅痛者宜蘇子桃仁降香鬱金等成盆盈碗者葛可久花蕊石散仲景大黃黃連瀉心湯一症而縷析條分從此再加分別則臨症有據矣石頑老人曰咳血之脈微弱平緩易治弦數急實氣促聲嘶咽痛者不治咯血不嗽而喉中咯出小血塊或血點是也症最重由房勞傷腎火載血升咯血成塊不比咳嗽痰中帶出也亦有兼痰咯出者系腎虛痰泛初起用白芍丹皮茯苓棗仁山藥山梔麥冬童便以清手足少陽厥陰諸經遊火若膈熱頰紅咽喉不清清咽太平丸後必滋補腎陰以安其血六味飲加牛膝麥冬五味景嶽以為心不主血宜養心湯嘉言以為陰氣上奔宜四君湯黃耆山藥亦可加入脾中陽氣旺而龍雷之火潛伏也唾血鮮血隨唾而出或涎中有血纏如絲散如點者多源於腎右尺虛者都氣丸加桂心右尺大者清唾湯其有兼心胃者由脾虛不能攝也兼心則加味歸脾湯兼胃則七珍散食少痰清者異功散加枇杷葉扁豆灰勞嗽唾血者黃耆散肺痿吐血者人參平肺散嘔血血從脘脅嘔出系木火乘胃所致良由暴怒火逆胸滿脅痛傷肝動血柴胡疏肝散或負重努力傷胃動血是齋白朮散或飲酒火熱上升嘔血葛黃散或房勞竭力傷腎嘔血症必面紅足冷煩躁口渴生脈散合加減八味丸或虛勞火升嘔血不止花蕊石散血症脈候失血脈數大為陽盛澀細為血少細數為陰火鬱於血中芤為失血弦緊脅痛為瘀結寸大尺微為肺中伏火尺盛而寸虛為腎虛陰火尺滑而疾為血虛有熱右脈虛大為脾胃火左脈數盛為肝膽火失血脈微弱細小和緩者易治洪數實大弦急或雖小按之如循刃及衄血身熱脈至而搏嘔血胸滿引背脈小而疾皆不治咳出白血似肉似肺淺紅色者死喘咳失血氣逆脈見弦緊細數有熱不得臥者死吐唾血脈細弱者生實大者死附方心脾歸脾湯見本卷勞瘵益肺生脈散參麥五味虛寒理中湯參術薑草補腎六味丸七味丸八味丸俱見一卷中風六味丸加五味名都氣丸熱寒麻黃人參芍藥湯麻桂參耆歸芍麥五味草補氣保元湯見一卷火壯水青鉛六味飲六味湯加青鉛導下復元活血湯柴胡當歸花粉甲片紅花桃仁大黃甘草攻瘀代抵當湯大黃歸尾生地甲片元明粉桂通補元戎四物湯地芍歸芎加桃仁紅花和營當歸建中湯見一卷傷風加人參名人參建中湯通絡旋覆花湯見本卷痰飲煙酒紫草茸湯紫草茸白朮澤瀉丹皮麥冬犀角甘草藕汁薇銜胃火犀角地黃湯見一卷溫肺傷補中益氣湯見一卷中風肝逆化肝煎青陳芍貝各二錢丹梔澤各錢半心氣天冬湯參耆歸芍地草二冬遠志阿膠沒藥藕節薑胃陽歸耆異功散參苓術草陳歸耆胃陰金匱麥門冬湯見一卷燥肺痿人參固本丸見一卷中風勞怯四陰煎見本卷痰飲血虛當歸補血湯耆一兩歸二兩血虛十全大補湯見一卷中風氣虛養營湯見本卷勞瘵津涸元霜紫雪膏雪梨六十枚藕汁十杯生地汁十杯麥冬汁五杯萊蔔汁五杯茅根汁十杯合煎去渣入煉蜜一斤飴糖八兩薑汁半杯再熬服胸痛小烏沉湯童便制香附三錢烏藥錢半炙草一錢沉香五分磨汁加入鹽一字去瘀黑神散熟地歸尾赤芍蒲黃桂心炮薑甘草黑豆炒去皮童便酒各半煎虛勞劫勞散見本卷咳嗽乾咳瓊玉膏見一卷燥降痰天門冬丸一兩阿膠茯苓杏仁貝母各五錢蜜丸陰虛六味阿膠飲六味丸加阿膠潮熱八珍湯見一卷中風勞嗽人參飲子人參二錢五味二十粒耆麥歸芍各錢半甘草一錢止血花蕊石散花蕊石煅研細三錢以童便煎溫調下男用酒一半女用醋一半和逐瘀大黃黃連瀉心湯大黃黃連咽火清咽太平丸薄荷十兩川芎防風犀角柿霜甘草各二兩桔梗三兩蜜丸補心養心湯見本卷勞瘵唾血清唾湯二母桔梗元參黃柏熟地天冬遠志麥冬各一錢炮薑五分胃虛七珍散參苓術草耆山藥粟米勞唾黃耆散炙耆糯米炒阿膠等分為末米湯下三錢肺痿人參平肺散見一卷火怒嘔柴胡疏肝散見本卷勞瘵胃傷是齋白朮散參術耆苓各一錢山藥百合各八分薑三片棗二枚酒傷葛黃散黃連四兩葛花三兩用大黃末水熬成膏為丸或為末服溫湯下吐血脈案族弟陰虛發熱吐紅脈洪虛疾左關尺為甚思積損幾及三年龍雷不伏直至真陰內爍肺絡受傷陰益虧陽益熾矣不從咸降諒難猝止用秋石阿膠熟地五味山藥百合貝母丹皮白芍淡菜熬膏藕湯下紅止而損漸愈毛勞怯失血尺寸脈俱洪數乃肺腎虧損用三才湯加丹皮白芍麥冬鮮藕數服血止惟晡熱咳嗽用六味丸去萸瀉加五味白芍龜板炙阿膠蜜丸服二料全痊丁痰中血點溲後遺濁五更不夢自泄此腎陰虛相火強也六味去山萸加魚鰾炒蓮鬚菟絲餅稍佐黃柏鹽水炒蜜丸淡鹽湯下漸愈韋氏晡熱嘔咳痰血此上損候也用阿膠蛤粉炒百合茯神鮮藕各三錢潞參山藥白芍丹皮各二錢貝母一錢五味四分紅棗五枚二劑紅止熱漸退去丹皮阿膠鮮藕加栝蔞仁二服痰嗽亦除眭初夏吐紅深秋未止或主燥火刑金或主龍雷亢逆診脈右寸短澀左關沉弦應主郁慮不舒由氣分傷及血絡自述每午後喉間氣窒不利則嗽作血腥夫陽主開陰主合午後屬陽中之陰主斂而氣隧阻閉非郁慮內因不至此用桔梗貝母木香栝蔞茯神當歸白芍降香末服二劑脘舒血止去木香降香加鬱金熟地二服脈平又服歸脾湯去耆術加熟地貝母白芍蓮子愈錢失血三次皆由食頃今吐紅又適當飯時自系食入氣阻胃管嗆血故咽津時脘間若噎也診脈各部俱弦宜調其逆氣兼彌其滲絡用栝蔞貝母當歸玉竹阿膠紅棗服愈後頻服牛乳永不發黎立冬後陽伏地中龍潛海底今值冬至陽始生而龍已不藏致五夜陽升灰痰帶血右尺不平此知柏八味丸症也又夙有肝氣左脅刺痛則龍雷交焰矣初服壯水潛陽痰血已減繼服加減歸脾湯左脅痛止灰痰亦少血絲淡而若無脈症將愈兆也昨診惟肝脈稍弦左尺強於右是水尚能制火從此平心靜攝戒怒節欲明春木火不至偏旺則痊平可冀熟地水煮丹皮酒炒澤瀉鹽水炒茯苓乳蒸山藥炒遠志甘草汁炒白芍炒女貞子藕粉淡菜牡蠣煅研煉蜜丸服蔣氏小産後痰嗽帶血晡寒宵熱食減肌削脈小弱此病損已久胞系不固胎墮後營衛益傷宜仿立齋先生治法以甘溫補陽則寒熱可減近人專事杏貝希冀嗽止恐寒涼損脾反致不救用潞參山藥茯神炙草阿膠白芍五味杞子蓮棗數服頗安再加黃耆鹿角霜數服諸症漸止飲食漸加又丸方調理得痊荊氏高年食後觸怒氣升血湧洞瀉稀水身熱背寒心煩頭眩經云怒則氣逆甚則嘔血及飧泄故令氣上症由肝陽鬱勃震傷血絡疏泄太甚木必侮土胃中水穀不化更兼暑濕司令地氣泛潮故下迫暴注氣上故中脘失寬主以降逆佐以除滿則血歸經而胃自和用厚朴制山梔炒鬱金磨蘇梗茯苓薏苡砂仁降香枳殼一啜微汗前症若失戴氏情志內損火迫絡傷嗽血晡寒宵熱脈右虛左數營損衛怯先以膩潤彌絡育陰和陽待夏至陰生陽不加灼復元可望阿膠水化生地炒麥冬各一錢茯神三錢杞子山藥甜杏仁俱炒二錢丹皮石斛各錢半五味焙五分六服諸症向安惟胸微痛加白芍二錢蔞皮八分痛止王淋症愈後遂發漏瘍必固澀藥用早瘍醫用線藥膿管未拔忽咳血塊左脈虛右尺搏指此龍火不潛上為咯紅下為漏膿勞則淋遺溺痛非壯水制陽漏卮何已勢將由下損上為勞嗽為吐衄肛漏安可平也暫服煎劑仿虎潛丸加減熟地水煮龜膠淡菜白芍當歸五味杞子知母黃柏俱酒炒六服脈症平後用煉蜜為丸加茯苓山藥丹皮牛膝鹽湯下漏瘍亦愈史氏胸痛嘔血色兼紅紫頭眩脘悶脈芤微此憂思損營宜斂補心神兼舒脾結凡離絡之血色變紫非必積瘀使然潞參茯神白芍五味棗仁炙草當歸醋炒合歡花鬱金木香俱磨汁沖三服已安調理尋起衄血論治口鼻衄耳衄眼衄齒衄舌衄肌衄九竅衄血溢心漏臍血附血從清道出於鼻為衄症多火迫血逆亦有因陽虛致衄者火亢則治宜清降生地黃飲子茜根散陽虛則治宜溫攝理中湯黑神散既於脈之洪滑弦細別之暴衄則治涼瀉犀角地黃湯七汁飲久衄則治須滋養止衄散生脈散更以血色之鮮濃暗淡辨之且火迫致衄有六淫之火有五志之火如風寒壅盛於經迫血妄行表症仍在脈浮緊用麻黃湯緩用桂枝湯成氏謂此非治衄仍以散邪仲景固言衄不可汗也若感溫熱風暑而衄者宜辛潤清涼如杏仁丹皮山梔茅花丹參鮮地黃連翹石斛犀角麥冬阿膠蔗汁藕汁因火邪亢極而衄者宜苦寒鹹寒如黃連黃芩山梔枳殼栝蔞元參犀角童便此治衄外因也其思傷心脾驚悸不眠歸脾湯勞傷元氣咳嗽發熱補中益氣湯去白朮加麥冬五味或當歸補血湯加薄荷杏仁怒傷肝陰火冒頭暈生地丹皮白芍山梔阿膠甘菊鮮桑葉欲傷腎精陰虛失納上喘下遺都氣丸加杞子菟絲餅若火不歸源喘促煩躁脈微肢厥八味地黃丸鎮陰煎陰虛陽浮六味飲加秋石龜甲白芍五味衛虛營損氣短色枯養營湯氣衰血脫神疲昏憒獨參湯胃火血升犀角地黃湯加茅花此治衄內因也其酒升血沸面赤汗多四生丸努力負重傷中損絡保元湯加阿膠此治衄不內外因也若衄多服涼劑不止系內虛寒而外假熱千金當歸湯衄久不止熱在下焦血分六味飲加五味童便衄久成勞照虛損治病後小勞屢衄石膏牡蠣湯衄後屢發或洗面即衄並以茅花煎湯調止衄散服衄血未淨停瘀入胃致面黃屎黑加味犀角地黃湯大衄而頭痛口渴玉女煎大衄不止面目浮腫蘇子降氣湯使血隨氣下得力全在肉桂凡久衄須加氣藥如木香黑香附之屬所以引血歸經耳口鼻衄血出口鼻屬肺脾二經積勞傷脾補中益氣湯倍耆歸如不應歸脾湯加藕節童便耳衄血出耳竅屬肝腎二經暴衄腫痛左關弦數多肝經風火沸膝柴胡清肝散若常有點血不腫痛尺中沉數多腎經陰虛火升生料六味丸加五味元參外用龍骨煅研吹入即止眼衄血出目眥屬肝火迫絡損系若猝視無睹滋陰地黃丸去柴胡常流血淚駐景丸外以炒黑槐花末研敷眼角齒衄血出齒縫牙齦屬胃腎二經陽明入下齒少陰入上齒陽明火盛必口臭牙齦腐腫甘露飲或血湧齒不搖必酒食炙爆積熱清胃散外敷冰玉散甚則衄不止大便祕調胃承氣湯陽明風壅齒齦微腫或牽引作痛消風散加犀角連翹外擦青鹽藁本末少陰虛口不臭齒浮動不痛牙縫中衄點滴而出系腎陰不固虛火偶動六味飲加山梔赤芍若隱隱作痛系陽虛於下火炎於上七味地黃丸或鹽湯下安腎丸外擦青鹽炒香附末齦底成塊血出鹽湯下六味丸舌衄血出舌上如線或有針孔多屬心包火先以蒲黃煎湯漱之次以槐花炒研摻之內服黃耆六一散合生脈散若舌出血如泉塗舌丹或川文蛤研末摻舌脹大出血不止乾薑灰生蒲黃為末摻肌衄血出膚孔屬衛氣不固血乘陽分脈洪當歸六黃湯脈弱保元湯脈數當歸補血湯脈浮黃耆建中湯有紅汗色紅染衣黃耆建中湯兼用妙香散小麥煎湯調下九竅衄諸竅齊衄總治側柏散犀角湯有中毒者飲生羊血顛撲傷者灌熱童便煩勞傷者補中益氣湯倍參耆若五臟內崩者不治有遍體無故血出五花湯血溢血從上出隨火妄行原病式以為心火銷爍用黃連瀉心湯或偶觸破傷血湧不止內服十全大補湯外用百草霜摻之心漏胸前一孔出血水名心漏用嫩鹿茸去毛酥炙附子炮去皮臍和鹽花共研末以棗肉杵丸酒下臍血血出臍中胃受火逼不得運輸宜熟地當歸白芍丹皮甘草白芷側柏葉茅根汁藕汁之屬衄血脈候衄而不止脈大者逆靈樞脈至而搏血衄身熱者死素問病若吐衄脈當沉細反浮大而牢者死難經脈得諸澀