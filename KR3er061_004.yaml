食減於前下損及脾無清嗽治痰之理燕窩清補希冀嗽止痰消恐初春氣已交懍寒必憎安望嗽減益脾肺交心腎調理如法寒熱可止嗆嗽可平潞參山藥茯神生黃耆皮桑皮蜜炙甜杏仁五味枇杷葉蓮子棗仁阿膠龍骨數服嗽減寒止痰血若失去枇杷葉龍骨阿膠加炒熟地丹皮熱漸退嗣用潞參熟地山藥茯神遠志黃耆蜜炙龍骨白芍棗仁五味龍眼肉熬膏二料全愈肺痿肺癰論治肺痿者津枯葉悴因熱在上焦咳久傷肺始則寒熱自汗口吐濁沫或吐紅絲膿血脈數而虛者是也肺癰者咽乾吐膿因風熱客肺蘊毒成癰始則惡寒毛聳喉間燥咳胸前隱痛痰膿腥臭按右脅必痛著左臥則喘脈滑數有力者是也肺痿傷在無形之氣氣傷者調其元肺癰毒結有形之血血結者排其毒此治法之概也分而論之肺痿由津液枯燥至肺管日窒咳聲不揚動即氣喘治在補氣血生津液佐以止嗽消痰宜人參玉竹五味阿膠白芍麥冬當歸熟地紫菀川貝杏仁等其肺勞成痿虛熱咳血者人參固本丸不時噙化肺虛喘急自汗者安肺湯往來寒熱自汗煩渴者紫菀散加銀柴胡薑用蜜制咳膿血發熱盜汗者劫勞散涎唾多心中溫溫液液者炙甘草湯痰嗽午熱聲嘶者紫菀散加丹皮薑棗喘咳失音咯血者人參蛤蚧散其虛寒羸瘦噓吸胸滿者千金生薑溫中湯凡肺痿症咳唾咽燥欲飲水者自愈張口短氣者危肺傷咯血喉啞者不治肺癰由熱蒸肺竅至咳吐臭痰胸脅刺痛呼吸不利治在利氣疏痰降火排膿宜安肺桔梗湯初起肺受風寒喘嗽者小青龍湯散解之喘不得臥胸脹者葶藶大棗瀉肺湯瀉之肺氣不化水道不利者葦莖湯疏利之葦莖湯大疏肺氣使濕濁悉從溺孔去咳逆上氣時時唾濁者皂莢丸滌之皂莢丸蕩滌痰濁無堅不入咳膿腥穢者桔梗湯開提之咳而短氣溺少者參耆補肺湯調之體倦食少脾虛者參朮補脾湯養之膿已㿉者排膿散或金鯉湯或薏苡根煎汁飲大效痰中帶血胸痛者枯梗杏仁煎或肺癰神湯主之吐膿咽痛者甘桔湯加杏仁貝母癰久不斂者川槿湯如思慮勞心致動陰火痰臭轉甚者六味丸加麥冬紫菀二症潰後宜補脾肺滋腎水不宜專攻其瘡凡肺癰症初起痰覺腥臭用陳醃芥滷溫服或濃煎荷葉汁加白蜜服效咳則微痛痛在胸右為肺之長葉坐臥如常飲食知味者易治若潰後寒熱脅痛痛在胸左為肺之短葉或坐臥不安飲食無味者難治若喘鳴不休坐不得臥咯吐膿血色如敗滷飲食艱進聲啞鼻扇者不治肺癰已破入風者濃煎蔥白香豉湯頻服然多不救肺痿肺癰脈候脈數而虛者肺痿數而實者肺癰微緊而數者未成膿緊甚而數者已成膿吐膿如米粥者難治嘔膿不止者脈浮洪而大者難治肺痿六脈浮澀而急或細數無神者死肺癰潰後脈忌短澀緩滑面白者生弦急面赤者死附方肺勞固本丸見一卷中風肺喘安肺湯見本卷咳嗽嗽血紫菀散人參桔梗茯苓各一錢阿膠甘草紫菀各五分知母貝母各錢半五味子十五粒虛勞劫勞散見本卷咳嗽涎唾炙甘草湯見一卷中風喘咳蛤蚧散蛤蚧十對酥炙二母桑皮茯苓各二兩人參甘草各三兩杏仁五錢為末每服三錢虛寒生薑溫中湯薑桂陳草麻黃肺癰安肺桔梗湯杏蔞枯桔歸耆二母桑皮防己百合苡仁地骨葶藶五味草表邪小青龍湯見本卷咳嗽宿水葶藶大棗湯甜葶藶三錢炒研大棗十枚去核疏利葦莖湯蘆管取節薏仁桃仁瓜瓣甜瓜子降濁皂莢丸皂莢去皮弦子酥炙研末蜜丸梧子大以棗湯服三丸日三服夜一服開提桔梗湯見本卷咳嗽疏肺補肺參耆補肺湯參耆五味紫菀各八分熟地桑皮各錢半水煎加白蜜健脾參朮補脾湯參術各二錢黃耆二錢半苓歸陳各一錢桔麥各八分五味草各四分化膿排膿散參耆芷五味為末每服三錢排膿金鯉湯活鯉魚四兩貝母一錢研以鯉魚去鱗雜不見水入貝母於魚腹外以線扎之浸童便煮熟食之胸痛桔梗杏仁煎杏貝枳翹麥草銀花阿膠百合夏枯草紅藤吐膿甘桔湯甘草桔梗癰久川槿湯川槿皮白蘞等分水煎陰火六味丸見一卷中風通用肺癰神湯桔梗銀花炙耆白芨各一錢苡仁五錢貝母錢六分甘草節錢半陳皮錢二分甜葶藶炒八分薑二片水煎肺癰肺痿脈案本老年嗜飲熱火酒致熱毒熏肺發瘡主癰咳吐穢膿胸右痛不利轉側脈左大初用桔梗湯去耆薑加連翹山梔四服咳稀痛止仍宜排膿解毒用桔梗銀花各一錢貝母錢半生薏苡五錢當歸甘草節廣皮各一錢二分白芨生耆各一錢甜葶藶炒七分數服膿稀瘡癰皆平韋嗽重痰腥胸背隱痛脈數有力已成肺癰此肺受風寒蘊邪壅熱宜疏痰導熱則呼吸自利不至脹痛喘急而腥痰漸少桔梗湯三服兼用陳醃芥滷汁一杯溫服愈戴氏元氣久削痰嗽肺痿寸脈虛數少神難治之症紫菀湯三服阿膠水煨沖服後去桔梗知母加山藥蓮子黃耆取補土以生金嗽熱漸減失音論治肺為音所自出而腎為之根以肺通會厭而腎脈挾舌本也夫金空則鳴失音一症亦如金實則喑金碎則啞必辨其虛實而後治法可詳其寒包內熱閉窒氣分致失音者以麻杏湯之屬開其痹其醉臥當風邪干肺竅猝失音者以蘇子湯之屬降其痰其木火犯肺咽乾喉痹致失音者以麥冬湯之屬潤其燥其痰熱客肺喘急上氣致失音者以桔干湯之屬疏其壅其逆風叫號致傷會厭者以養金湯之屬清其音其暴嗽失音者杏仁桑皮湯久咳失音者蛤蚧散若由陰虛勞嗽聲嘎者相火爍金也百合固金湯去元參桔梗加五味訶子或扶羸湯去秦艽柴胡其內奪而厥為喑痱者腎虛也地黃飲子減桂附戟其中風症舌喑不能言者音如故而舌不掉也虛者六君子湯加竹茹薑汁實者大秦艽湯仍宜加減其總治氣血虛燥喉音不清者清音湯加減訶子湯脂蜜膏方此失音症治大約潤肺滋腎之品為宜也醫通曰失音大都不越於肺須分暴喑久喑暴喑多是寒包熱邪宜辛涼和解消風散用薑汁沖服肺虛傷風喘咳聲嘶千金酥蜜膏火邪傷肺咽痛聲啞生脈散合六味丸或豬脂白蜜熬膏挑服久病失音氣虛挾痰宜滋肺腎之化源生脈散下都氣丸咽乾聲稿潤肺為主生脈散加玉竹若不應生脈散噙童真丸景嶽全書因陳載祕方竹衣麥冬湯治勞瘵痰嗽聲啞不出難治者服此神效竹衣鮮者一錢竹茹三錢麥冬二錢竹葉十四片甘草五分橘紅五分茯苓桔梗各一錢杏仁七粒竹瀝一杯煎七分竹瀝和勻服徐靈胎指南批本曰諸症失音皆有可愈之理惟用麥冬五味熟地桂枝等藥補住肺中痰火以致失音則百無一生又云久嗽失音必由藥誤麥冬五味是失音之靈藥也服之久無不失音者倘風寒痰火偶爾失音即不治亦愈但更加以麥冬五味則弄假成真矣附方開痹麻杏石甘湯麻杏石草降痰蘇子降氣湯蘇子橘紅半夏當歸前胡肉桂厚朴炙草薑一方有沉香無肉桂潤燥麥門冬湯見一卷燥疏壅桔干湯荊防翹桔牛蒡射干元參山豆根竹葉甘草清音養金湯生地桑皮杏仁阿膠知母沙參白蜜麥冬水煎暴喑杏仁桑皮湯杏仁桑皮五味紫菀通草貝母薑汁白蜜沙糖久咳蛤蚧散見本卷肺痿補肺百合固金湯二地歸芍桔貝麥草元參百合啞勞秦艽扶羸湯柴胡二錢人參秦艽當歸鱉甲地骨皮各錢半紫菀半夏炙草各一錢薑棗水煎喑痱地黃飲子見一卷中風啞風六君子湯見一卷中風啞風大秦艽湯見一卷中風虛燥清音湯參苓歸地二冬烏梅訶子阿膠人乳牛乳梨汁蜜清降訶子湯訶子桔梗童便水煎咽痛脂蜜膏豬脂白蜜散邪消風散參苓陳草荊防羌芎藿香殭蠶蟬蛻厚朴為末茶調潤肺千金酥蜜膏真酥崖蜜飴糖薑汁生百部汁杏仁棗肉柑皮熬膏溫酒和服清補生脈散人參五味麥冬清補六味丸見一卷中風納氣都氣丸六味丸加五味勞嗽童真丸秋石貝母紅棗肉為丸薄荷湯下失音脈案某肺受冬溫蘊而成熱脈洪搏指痰阻喉癢嗆咳失音與苦辛泄降痰火清音自出所謂金空則鳴也用杏仁桑皮蔞皮川貝麥冬橘紅竹葉三服嗆嗽平惟溺赤間有寒熱前方加香豉梔皮赤苓燈心二服寒熱除膈間覺燥去桑皮香豉加白蜜三匙和服二劑音漸復族弟怯症嗽久吐血曾用熟地黃阿膠淡秋石燕窩等藥獲愈經十數載至今秋寒熱宵嗽勞則喉痛欲裂氣急聲啞呼吸有音氣不歸源實水虧火炎金畏火灼重症古云金碎不鳴務滋腎陰俾金水相涵冀龍焰稍熄而已仿大補元煎熟地黃八錢山藥白芍百合各三錢牛膝蒸五味焙各八分洋參棗仁阿膠水煨貝母各二錢龜板炙女貞子各三錢三十劑後精神稍復兼服人乳數月喜其胃納頗健調理如法可望延年族子因驚遺泄嗆嗽聲啞繼乃寒熱喉痛梗礙妨食口乾脈細數醫與清金降火屢服不效豫謂水涸於下火炎於上心腎諸脈挾咽循喉既非肺痹梅核無清肺降痰之理宜滋填鎮攝俾龍焰伏潛喉痛息寒熱漸止方用熟地四錢山藥龍齒杞子炭天冬元參女貞子各二錢茯神三錢丹皮柏子仁各八分五味四分淡菜三錢煎服甚適時用白蜜及豬膚湯潤喉喉痛寒熱若失若精關扃固月餘不泄即用原方去元參加牡蠣蓮子煉蜜丸竹葉湯下庶望音復後將煎劑去淡菜加龜甲心石斛淡秋石煎丸並服漸效乃誤信喉科鐵烙喉大痛暈絶遂成不救惜夫王氏室女久嗽失音呼吸痰響勞則發熱頰紅乾飯稍納粥入隨出肺氣既失肅降痰火升逆擾及中宮胃土運納不安然胃虛谷少脈來微數非火滌痰所得效治以平氣降逆兼培胃氣倘痰火一清聲音可出海浮石蘇子貝母前胡茯苓山藥炙草薑汁竹瀝和服呼吸利痰嗽平再去前胡加訶子蛤粉數服哮止而音漸復哮症論治哮者氣為痰阻呼吸有聲喉若拽鋸甚則喘咳不能臥息症由痰熱內郁風寒外束初失表散邪留肺絡宿根積久隨感輒發或貪涼露臥專嗜甜咸膠痰與陽氣並於膈中不得泄越熱壅氣逆故聲粗為哮須避風寒節厚味審其新久虛實而治之大率新病多實久病多虛喉如鼾聲者虛如水雞者實遇風寒而發者為冷哮為實傷暑熱而發者為熱哮為虛其鹽哮酒哮糖哮皆虛哮也冷哮有二一則中外皆寒宜溫肺以劫寒痰溫肺湯鍾乳丸冷哮丸並以三建膏護肺俞穴一則寒包熱宜散寒以解鬱熱麻黃湯越婢加半夏湯如邪滯於肺咳兼喘者六安煎加細辛蘇葉冬感寒邪甚者華蓋散三拗湯外感寒內兼微火者黃芩半夏湯熱哮當暑月火盛痰喘者桑白皮湯或白虎湯加芩枳栝蔞霜痰壅氣急者四磨飲蘇子降氣湯氣降痰自清痰多者吐之勿純用涼藥須帶辛散小青龍湯探吐腎哮火急者勿驟用苦寒宜溫劫之用椒目五六錢細研分二三次薑湯調服俟哮止後因痰因火治之治實哮用百部炙草各二錢桔梗三錢半夏陳皮各一錢茯苓一錢半一服可愈治虛哮用麥冬三兩桔梗三錢甘草二錢一服可愈此煎劑內冷哮加乾薑一錢熱哮加元參三錢鹽哮加飴糖三錢酒哮加柞木三錢糖哮加佩蘭三錢再用海螵蛸火煅研末大人五錢小兒二錢黑砂糖拌勻調服一服除根其遇厚味而發者清金丹消其積食傷鹹冷飲食而發者白麵二錢沙糖二錢飴糖化汁捻作餅炙熟加輕粉四錢食盡吐出病根即愈年幼體虛者分三四次服吐後用異功散加細辛脾胃陽微者急養正四君子湯久發中虛者急補中益氣湯宿哮沉痼者攝腎真腎氣丸加減總之哮既發主散邪哮定則扶正為主也附方冷哮溫肺湯見本卷咳嗽溫肺鍾乳丸鐘乳石甘草湯煮研麻黃醋湯泡焙乾杏仁炙草蜜丸溫肺冷哮丸麻杏辛草星夏川烏川椒白礬牙皂紫菀茸款冬神麯糊丸外治三建膏天雄川烏川附桂心官桂桂枝細辛川椒乾薑各二兩麻油熬加黃丹攤貼肺俞散邪麻黃湯麻桂杏草散寒越婢加半夏湯