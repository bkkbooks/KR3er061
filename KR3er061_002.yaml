body:
  text: 卷之首內景綜要自天以氣煦地以形嫗生其間者陽化氣而陰成形喉以通天和咽以納地產喉前咽後受谷者濁受氣者清清者注肺濁者走胃濁則為衛清則為營營陰衛陽營行脈中衛行脈外陰陽相貫如環無端中氣出上焦營氣出中焦衛氣出下焦皆水穀之精悍水穀之精氣為營水穀之悍氣為衛流布於臟腑者也臟有五心藏神肺藏魄肝藏魂脾藏意腎藏志也腑有六膽無出入胃受水穀大小腸主津液膀胱三焦司氣化也五臟藏精不瀉滿而不能實故以守為補焉六腑傳化不藏實而不能滿故以通為補焉肺右降肝左升脾陰運胃陽納膀胱司開腎司闔胃喜涼腸喜熱膽喜溫心惡熱肺惡寒肝惡風腎惡燥脾惡濕知五臟之苦欲而補瀉殊肝苦急心苦緩脾苦濕肺苦氣上逆腎苦燥肝欲散心欲耎脾欲緩肺欲收腎欲堅審六腑之入出而清濁別由臟陰腑陽之不一其性也五臟外加心包絡即膻中代心行令與三焦相配則十二臟腑具焉其十二經之隸於各臟腑者行有順逆手之三陰手太陰肺手少陰心手厥陰心包從臟走手手之三陽手太陽小腸手少陽三焦手陽明大腸從手走頭足之三陽足太陽膀胱足少陽膽足陽明胃從頭走足足之三陰足太陰脾足少陰腎足厥陰肝從足走腹太陽與少陰為表裡少陽與厥陰為表裡陽明與太陰為表裡皆一臟一腑相配也諸陽經會頭面於上諸陰經至胸頸而還惟厥陰肝經上入顙連目系上額與督脈會於巔其行身之後者足太陽經也主表病主頭痛脊強行身之前者足陽明經也主表主裡病主身熱目痛行身之側者足少陽經也主半表半裡病主脅痛耳聾寒熱往來足厥陰為陰中之陽病主煩滿囊縮足少陰為陰中之陰病主舌乾口燥足太陰為陰中之至陰病主腹滿嗌乾皆主裡若夫奇經八脈陰維由內踝而上主身之裡陽維由外踝而上主身之表所以綱維周身之營衛也陰維為病苦心痛陽維為病苦寒熱陰蹺起跟中循內踝上行主一身左右之陰陽蹺起跟中循外踝上行主一身左右之陽所以統陰陽而行蹺捷也陰蹺病陰急而足直陽蹺病陽急而狂奔督起會陰循背而行身之後所以督率諸陽督病脊強折厥任起會陰循腹而行身之前所以擔任諸陰任病男疝女瘕沖亦起會陰夾臍而上行胸中當諸氣之衝要蓋一源而三歧沖病逆氣裡急帶起季肋橫束於腰為諸脈之總約帶病腹脹腰痛八者無表裡配合故謂之奇經經脈蓄溢則注奇脈猶溝渠雨溢旁流湖澤也既有經脈復有絡絡凡十五十二經各有一絡又陽蹺陰蹺二絡及脾之大絡凡十五蓋直行為經橫支為絡絡之別為孫絡凡三百六十五初病在絡久病入經所以行氣血通陰陽以榮於身者也且夫氣主呴血主濡太陽膀胱經常多血少氣少陰腎經常少血多氣陽明胃經常多血多氣太陰脾經常多血少氣少陽膽經常少血多氣厥陰肝經常多血少氣其盈虧有如此者氣血所周子時注膽丑時注肝寅時注肺卯時注大腸辰時注胃巳時注脾午時注心未時注小腸申時注膀胱酉時注腎戌時注心包亥時注三焦其迭更有如此者血隨氣運春氣在經脈夏氣在孫絡長夏在肌肉秋氣在皮膚冬氣在骨髓其深淺有如此者海有四沖為血海膻中為氣海腦為髓海胃為水穀海門有七唇為飛門齒為戶門會厭為吸門胃上口為賁門下口為幽門小腸下口為闌門大腸下為魄門即肛門竅有九肺竅於鼻脾竅於口心竅於舌肝竅於目腎竅於耳亦竅二陰脊二十一椎肺六葉兩耳附脊第三椎為華蓋心七孔附脊第五椎如蓮蕊外有包絡中通肺脾肝腎心下有膈膜周遮濁氣肝七葉左三右四附脊第九椎膽三寸居肝葉下為清淨府脾象刀鐮與胃連膜胃當脊十一椎分上中下脘以達腸為太倉腎兩枚附脊十四椎下中間命門真陽為生身根蒂小腸連胃下口前附臍後近脊左回疊十六曲以泌別清濁大腸屬小腸下口當臍右疊十六曲達廣腸抵直腸傳濁出後陰膀胱無上口當脊第十九椎化氣滲水以出前陰細思交腸一症知膀胱亦有上口而常閉得三焦氣化水滲脬中而為溺耳三焦相火遊行諸經周身上下上焦如霧在胃上脘主出陽氣中焦如漚當胃中脘蒸化精微下焦如瀆當臍下濟泌別汁此十二臟腑之象形部位宜按圖而審指者也驗於內則諸氣皆屬於肺諸血皆統於脾諸脈皆屬於心諸筋皆隸於肝諸髓皆司於腎諸臟皆稟氣於胃驗乎外則肺主皮毛脾主肌肉肝主爪甲胃主四肢腎主五液心為汗肺為涕肝為淚脾為涎腎為唾心主舌色一身所寶惟精氣神神生於氣氣生於精精化氣氣化神故精者身之本氣者神之主形者神之宅也精者神倚之如魚得水氣依之如霧復淵故陰精所奉其人壽言乎形則頭者陽之會囟者髓之門發者腦之華庭者眉之宇瞳者腎之精明堂者色之應口角者地之倉齦者胃之絡齒者骨之餘會厭者音聲之戶廉泉者津之道舌者心之苗咽者脈之聚脾胃心腎肝小腸脈循咽挾咽脈者營之居玄府者汗之孔胸中者陽氣之郛離宮者神之舍募原者五臟之空膈肓者上下之蔽氣街者經之隧神闕者臍之宮背者經之俞十二經俞穴脊者身之柱膂者脊之輔腋者肩之谷肘者肢之節臂者身之使肩下臂上內為臑外為膊節次為肘肘下為臂臂下為腕關者腕骨之中寸者關之前尺者關之後合谷者骨之歧大次指陷中虎口穴勞宮者掌之心腰者精之府命門者生之根腎者胃之關季脅者膽之部宗筋者莖之系睪丸者腎之外候胞宮者任之內維任主胞胎尻者節之骶節者骨之樞股者髀之續膝者筋之總膕者膝之曲腨者足之肚踝者骨之突跗者足之面踹者足之跟湧泉者足之心此按部定名所可臚指者也
