body:
  text: 卷之四癲狂論治癲狂心脾肝胃病也經曰重陰則癲重陽則狂陽並於陰則癲陰並於陽則狂癲多喜笑症屬心脾不足狂多忿怒症屬肝胃有餘癲則或笑或歌或悲或泣如醉如癡語言顛倒穢潔不知經年不愈多由心脾鬱結志願不遂更或因驚恐致神不守舍者有之狂則自悲喜忘善怒善恐少臥不飢自賢自貴此為心疾或邪並陽明發狂罵詈不避親疏登高而歌棄衣而走不食數日逾垣上屋此為胃火或陽氣暴折而難決為怒狂此名陽厥多由肝膽謀慮不決屈無所伸怒無所泄木火合邪乘心則神魂失守乘胃則暴橫莫制總之癲狂皆心火自焚痰迷竅絡故癲始發其情志失常狀亦如狂狂經久其神魂迷瞀狀乃類癲治癲先逐其痰控涎丹次復其神琥珀散養其陰滋陰安神湯治狂先奪其食食入於陰長氣於陽次下其痰安神滾痰丸降其火生鐵落飲用生鐵落者金以制木木平則火降也二症如因怒動肝火風痰上湧而發導痰湯加芩連菖遠煎成入辰砂沉香汁如痰火久郁神志恍惚牛黃清心丸驚憂氣結痰血壅蔽白金丸心虛悸動寤不穩寐補心丹心氣不足神不守舍歸神丹大劑獨參湯癲久不愈必養神通志歸脾湯枕中丹狂久不愈必壯水制火二陰煎生熟養心湯此治之大要在參求脈症之虛實而分治之癲狂因驚憂而致抱膽丸因鬱怒而致安神導痰湯痰火俱盛甘遂散吐下之痰火驟壅發為怪狀清心滾痰丸氣結為痰閉其神識四七湯心熱煩躁芩連清心丸陰虧暈僕滋陰安神湯痰迷心竅金箔鎮心丸思慮鬱結歸脾湯加辰砂心慮疑畏定志丸心臟氣血不足清心溫膽湯病後神虛氣怯歸神丹久癲神魂不定靈苑丹癲已愈復發斷癇丹婦人患癲由血不調加味逍遙散別有悲哭呻吟為邪所憑非狂也一味蠶蛻紙燒灰好酒調服二錢許狂症上焦實者從高抑之生鐵落飲陽明實者脈伏大承氣湯下之痰火在上因而越之來蘇膏三聖散湧吐之立安後用洗心散涼膈散調之形症脈氣俱實當湧吐兼利之勝金丹肝膽火旺木來乘心降龍丹抑之心火狂亂黃連瀉心湯痰擾心包鬱金丸風涎暴僕通泄散失魂若神靈所憑鎮心丹因勞神致傷心血驚悸不安辰砂安志丸悲哀動中則傷魂魂傷則狂妄不精當以喜勝之以溫藥補魂之陽龍齒清魂散因喜樂無極則傷魄魄傷則狂當以恐勝之以涼藥補魄之陰清神湯肺虛喘乏加沙參胃虛食少加人參膽虛驚恐加羚羊角熱入血室發狂小柴胡湯加犀角生地黃猝發狂言針手大指甲角一韭葉許少商穴肝盛怒狂針足大趾甲角一韭葉許大敦穴癲狂脈候凡脈急甚皆癲狂厥疾癲脈搏大滑久自已脈小堅急死不治癲脈虛則可治實則死狂脈實大者生沉小則死恍惚癲狂實大為順沉細為逆附方逐痰控涎丹見二卷痰飲安神琥珀散琥珀人參茯神遠志菖蒲乳香棗仁硃砂養陰滋陰安神湯地芍歸芎參術茯神遠志南星各一錢棗仁甘草各五分黃連四分降痰安神滾痰丸煅礞石風化硝硃砂各一兩沉香珍珠各五錢為細末用天麻煎成膏杵丸芡實大每服三十丸平肝生鐵落飲生鐵落八兩石膏三兩龍齒茯神防風各兩半元參秦艽各一兩煎成入竹瀝一杯服痰壅導痰湯見一卷中風清心牛黃清心丸見一卷溫痰血白金丸見二卷痰飲心虛天王補心丹見一卷火神虛歸神丹硃砂二兩入豬心血酒蒸研人參棗仁茯神當歸各二兩西琥珀姜炒遠志龍齒各一兩金箔銀箔各二十片為衣酒糊丸麥冬湯下九丸養神歸脾湯見二卷勞瘵通竅枕中丹龜甲龍骨遠志石菖蒲為末酒調一錢日三服壯水二陰煎生地三錢麥冬棗仁各二錢元參茯苓木通各錢半黃連一錢生甘草五分燈心竹葉各十四片水煎服滋陰生熟養心湯生地熟地當歸茯神各二錢人參麥冬各一錢半五味十五粒棗仁柏子仁各八分炙草五分因驚抱龍丸水銀二兩黑鉛一兩半硃砂乳香各一兩將鉛入銚內熔化下水銀結成砂子次下硃砂乳香木錘杵丸因怒安神導痰湯陳夏苓星枳草芩連遠志菖蒲硃砂痰壅清心滾痰丸酒炒大黃黃芩各四兩礞石同焰硝煅犀角皂角硃砂各五錢沉香二錢麝香五分水丸痰結甘遂散甘遂一兩研末豬心血和勻將豬心切開入甘遂末於內紮緊煨熟取藥末入辰砂末一錢和勻分作四丸每服一丸氣結四七湯一名七氣湯見二卷咳嗽心火芩連清心湯黃芩黃連麥冬花粉茯神丹參牛黃菖蒲遠志痰迷金箔鎮心丸膽星一兩天竺黃琥珀硃砂各五錢牛黃雄黃珍珠各二錢麝香五分蜜丸金箔為衣心虛定志丸人參茯神茯苓各三兩菖蒲姜炒遠志各二兩硃砂一兩半為衣蜜丸氣血清心溫膽湯二陳湯加竹茹枳實名溫膽湯此加白朮菖蒲香附當歸白芍黃連麥冬人參遠志生薑補攝靈苑丹硃砂一兩棗仁乳香各五錢共研細酒調勻作一服服後安臥勿喚醒則神魂自定若喚醒驚寤則不可治復發斷癇丹黃耆鉤藤細辛甘草各五錢蛇蛻一條蟬蛻四個牛黃二釐棗肉為丸桐子大每服二十丸人參湯下婦癲加味逍遙散見一卷火瀉火大承氣湯見一卷溫症湧痰來蘇膏皂角二兩酸漿水浸透研汁砂鍋內熬用槐柳枝攪熬成膏攤紙上陰乾用溫水化入左右鼻孔取涎湧痰三聖散見一卷中風表裡洗心散當歸二兩麻黃大黃生術白芍荊芥炙草各一兩每服三四錢姜五片薄荷七葉水煎瀉火涼膈散見一卷中風吐下勝金丹白砒一錢綠豆三百六十粒浸去殼同白砒研泥陰乾山梔十四枚雄黃雌黃各一錢急性子二錢為末入牛黃冰片和糕餅食降火降龍丹黑鉛水銀各一兩先將鉛入銚熔化次入水銀炒成粉入金銀箔各五百張辰砂蛇含石各五錢蜜丸芡實大茯神湯下三丸狂亂黃連瀉心湯黃連生地知母各一兩黃芩二兩甘草五錢每服五錢心包鬱金丸鬱金硃砂白礬風涎通泄散瓜蒂末三錢加輕粉一字水調勻灌之涎自出如未出含沙糖一塊下咽涎即出神亂鎮心丹硃砂枯礬水丸芡實大參湯下一丸驚悸辰砂安志丸辰砂二兩姜炒遠志菖蒲棗仁乳香歸身茯苓茯神各七錢人參五錢豬心一個研如泥酒丸棗湯下補魂龍齒清魂散龍齒遠志人參歸身各兩半茯神麥冬桂心甘草各三錢延胡一兩細辛錢半每服四錢補魄清神湯黃連茯苓柏子仁遠志菖蒲棗仁各錢半甘草五分薑汁竹瀝各一匙水煎血室小柴胡湯見一卷溫癲狂脈案某氏因驚致癲向暗悲泣坐臥如癡十餘年神衰肌削此失心難治痼疾非大補元氣不為功仿安心丸人參黃精茯神當歸遠志棗仁菖蒲乳香各研極細用豬心切開入硃砂以線縛定再箬裹紮緊酒煮研爛入各藥末加煮棗肉搗丸桐子大另用硃砂為衣每服六七十丸參湯下以無力用參而止惜夫王因郁發狂笑詈善怒面赤目紅脈洪大此陽氣暴折因怒觸發木火失制熱痰上乘心包病名陽厥用生鐵落飲去芄防加山梔連翹羚羊角竹瀝石菖蒲丹皮數劑而狂定張氏恍惚狂妄視夫若仇持械棄衣莫之敢近脈滑而弦用獨聖散吐之去黏涎宿沫頗多捶胸言痛診脈稍平然猶獨言獨笑知其痰沫去而心舍虛神魂未復也用栝蔞仁貝母橘紅膽量菖蒲汁鬱金汁薑汁枳殼茯苓一劑胸痛定乃仿龍齒清魂散用龍齒煅茯神鐵粉牡蠣乳香遠志棗仁當歸二劑如常包因恐發狂神擾語妄脈右大左軟症由心虛受嚇驚痰亂其神明非癇疾也癇乃一時昏僕醒即明瞭即用膽星川連等泄降痰火月來神識稍清宜用白金丸六服再以清心溫膽湯安神定志可冀向安潞參淡竹茹枳殼橘紅茯神生棗仁梔心遠志麥冬蓮子心鮮菖蒲汁沖三四劑已效改湯為丸服遂復常王氏獨言獨笑痰多氣鬱用溫膽湯降滌擾心涎沫數服效張少年懷抱不遂漸次神明恍惚言語失倫面赤眼斜棄衣裂帳曾服草藥吐瀉痰火略定今交午火升獨言獨笑半昧半明左脈弦長自屬肝膽火逆直犯膻中神明遂為痰涎所蔽經謂肝者謀慮所出膽者決斷所出凡肝膽謀慮不決屈何所伸怒何所泄木火熾煽君主無權從此厥逆不寐重陽必狂前已服牛黃清心丸今擬平肝膽之火滌心包之痰暫服煎劑期於清降火逆掃蕩黏涎後服丸方緩收其效煎方龍膽草山梔鬱金磨汁貝母連翹茯神天竺黃知母石菖蒲搗汁橘紅金器同煎五六服狂態大斂談及前轍深知愧赧一切如常診脈左右已勻沉按有力再疏丸方膽南星川貝各二錢山梔五錢鬱金龍齒煅各三錢牛黃八分羚羊角二錢茯神五錢生地一兩用淡竹瀝為丸硃砂為衣開水下一料遂不復發癇症論治癇症肝膽心腎病而旁及陰陽維蹺督諸經俱動也脈經曰前部左右彈者陽蹺也動則苦癲癇羊鳴從少陰斜至太陽者陽維也動苦癲癇羊鳴從少陽斜至厥陰者陰維也動苦癲癇三部俱浮直上直下為督脈動則大人癲小兒癇經言二陰急為癇厥足少陰腎為二陰謂少陰氣逆於經而上行則喉塞音喑而癇發矣症由心腎虛怯肝風膽火倏逆痰涎上壅心包經脈閉阻猝然暈僕口眼牽掣腰背反張手足抽搐此由熱極生風喊作畜聲因其近似分馬癇搖頭張口應心牛癇直視腹脹應脾豬癇吐沫應腎羊癇揚目吐舌應肺雞癇搖頭反折應肝以內應五臟而五癇名焉癇症幼小為多大人亦有之經久失調遂成痼疾一觸厥氣鼓風涎沫升逆莫遏痰在膈間則眩微不僕痰溢膈上則眩甚而倒必待其氣反吐去驚涎宿沫而後蘇若元氣虛甚乃屢發不止癇與中風中寒中暑屍厥等仆地不同癇僕時口中作聲將醒吐沫醒後又發若中風等病僕時無聲醒時無沫後不復發又與痙症相似但癇發身軟時醒痙則身強直角弓反張不時醒痙比癇為重雖分五癇治要在火與痰通治定癇丸參湯下或人參琥珀丸愈後必斷其根河車丸其因驚發癇者神出舍空驚涎乍服溫膽湯加竹瀝膽星愈後必復其神七福飲遠志丸其膽火生風者熱痰阻絡直視吐沫用羚羊角鉤藤天麻丹皮連翹膽星竹瀝橘紅前胡怒觸肝火者咬牙齧舌叫吼遺尿小柴胡湯去甘草加青皮甚則瀉肝湯痰火阻竅者神機不發昏不知人龍腦安神丸或膽星牛黃菖蒲鬱金汁薑汁橘紅湯灌之因抑鬱發者調其氣四七湯加木香南星因腎經虛者培其源六味湯加首烏白芍棗仁龍骨肝腎陽亢者和其陰虎潛丸心氣不足者安其神養心湯思慮煩勞者補其營益營煎胎癇得之母腹中者鎮其怯燒丹丸又按千金方分陽癇陰癇以先體熱瘛瘲驚啼而後發脈浮洪者為陽癇病在腑易治妙香丸先身冷不驚掣啼叫病發脈沉微者為陰癇病在臟難治五生丸引神歸舍丹古方通治五癇五癇丸五色丸六珍丹風癇驟發項強直視此肝經有熱咬牙者瀉青丸合導赤散痰火俱盛清膈飲下硃砂安神丸痰多控涎丹導痰湯痰迷心竅金箔鎮心丸心熱痰迷清神湯火盛抽薪飲氣逆食滯大和中飲因驚抱膽丸因怒安神導痰湯心臟氣血不足滋陰安神湯清心溫膽湯神不守舍歸神丹癲癇屢發五癇神應丸病久則成窠囊日久必生蟲妙功丸神效婦人患癇由血失調加味逍遙散肥人多痰加味壽星丸瘦人多火清心滾痰丸癇愈復發斷癇丹癇病晝發灸陽蹺宜補中益氣湯加益智陽蹺起於足太陽膀胱經足外踝下五分陷中申脈穴也夜發灸陰蹺宜六味丸加鹿角膠陰蹺起於足少陰內踝前大骨下陷中然谷穴也石頑謂癇以補腎為本豁痰為標其由來不外肝腎龍雷上衝所致豈不信哉丹溪治癇主痰與熱以星半芩連為主熱多者涼膈散加川連麥冬以泄之痰多者戴人三聖散吐之如驚者東垣安神丸平之癇症脈候脈浮滑洪數為風癇細弦微緩為虛癇浮為陽癇沉為陰癇虛弦為驚沉數為實熱沉實弦急及虛散者皆不治細緩者雖久劇可治又目瞪如呆者不治