志多致目晴不轉不能言短氣自汗臥不安或眠多異夢隨即驚覺溫膽湯加棗仁臥多驚魘口中有聲溫膽湯下遠志丸若臥則魂夢飛揚驚悸多魘通夕不寐乃肝虛風襲入之先用獨活湯數服後用珍珠母丸至因大驚而病者寸脈必動如豆粒而無頭尾急宜鎮定黃連安神丸驚則氣亂鬱而生火生痰痰與氣搏變生諸症溫膽湯加棗仁蓮子金銀器煎或鎮心丹琥珀養心丹遠志丸膽虛善驚人參肉桂熟地棗仁五味子杞子柏子仁肝膽俱虛百藥不效宜補腎酒化鹿角膠五錢心氣虛神不定而驚妙香散心血虛神易擾而驚硃砂安神丸氣血俱虛恍惚煩躁而驚養心湯思慮過度清心補血湯痰擾心包加味定志丸被物所驚心跳不安蕊珠丸驚悸多屬血虛與痰瘦人多是血虛肥人多是痰飲時時心跳亦是血虛或陰火上衝所致驚症有二有因病而驚者當察客邪而兼治其標有因驚而病者宜安養心神滋培肝膽專扶元氣為主恐症內經兼心腎胃肝膽包絡諸經經曰足少陰之脈病善恐又曰恐懼而不解則傷精又曰恐則氣下又曰精氣並於腎則恐肝藏血血不足則恐又曰胃為恐注云胃熱則腎水微故恐又曰心怵惕思慮則傷神神傷則恐懼自失膽病者驚惕恐人將捕之肝病如人將捕之心包絡動心澹澹大動又曰恐則精卻而恐為腎志屬水本臟因旁及他經故治法亦別焉恐由於腎傷者補精髓人參散去桂心加牛膝遠志由於肝膽虛者養陰血酸棗仁湯去耆蓮加山萸丹皮白芍由於心包絡者鎮其神定志丸去朮加龍齒琥珀犀角金銀箔治在陽明胃者壯其氣四君子湯倍茯苓其思慮勞心而善恐者一味鹿角膠酒化多服效因腎中陽虛而善恐者八味丸怔忡驚恐脈候手厥陰脈動甚則心澹澹大動胃絡名虛里貫膈絡肺出左乳下其動應衣虛而有痰則動更須臾發一陣熱者是也以上怔忡脈驚悸脈必結代寸口脈動而弱動為驚弱為悸病在心膽其脈必大動驚者其脈止而復來其人目睛不轉不能呼氣以上驚脈恐則脈沉恐傷腎脈必沉其人恐怖其脈形如循絲累累然其面白色脫也以上恐脈附方心脾七福飲見三卷郁氣血大補元煎見一卷中風滋陰左歸飲見二卷虛損補陽右歸飲見二卷虛損三陰大營煎見三卷關格三陰理陰煎見二卷咳嗽心火二陰煎見本卷癲狂心火加減一陰煎生地白芍麥冬各二錢熟地三錢知母地骨皮各一錢甘草七分思郁逍遙散見一卷火思郁益營煎見本卷癇痰火溫膽湯見一卷溫寒痰薑朮湯姜術苓夏桂草棗消痰硃砂消痰飲膽星五錢硃砂二錢半麝香二分為末薑湯下心火安神丸見二卷汗即硃砂安神丸又名黃連安神丸血虛四物安神湯二地歸芍參術茯神棗仁黃連柏子仁麥冬竹茹烏梅辰砂勞神清鎮湯茯神棗仁遠志菖蒲石蓮當歸生地貝母麥冬心火天王補心丹見一卷火安心養心湯見二卷勞瘵不臥棗仁湯參耆歸苓陳草棗仁遠志蓮子茯神姜棗思煩養營湯參耆歸芍遠志棗仁茯神木香柏子仁憂鬱歸脾湯見二卷勞瘵氣結加味四七湯夏樸蘇草赤苓茯神遠志菖蒲姜棗痰火參胡溫膽湯溫膽湯加人參柴胡麥冬桔梗甘草香附姜棗痰火金箔鎮心丸見本卷癲狂水悸茯苓甘草湯苓桂草姜若再加半夏名半夏茯苓湯水凌五苓散見一卷溫痰侵導痰湯見一卷中風通治加味安神丸地芍歸芎陳貝連草茯神麥冬遠志棗仁蜜丸辰砂為衣卑惵人參養營湯見二卷勞瘵去痰控涎丹見二卷痰飲驚魘遠志丸見本卷癇症虛風獨活湯羌獨苓夏參味辛草前胡沙參棗仁烏梅姜肝虛珍珠母丸珍珠母研細七錢五分當歸熟地各一兩五錢人參棗仁柏子仁犀角茯苓各一兩沉香龍齒各五分煉蜜為丸多夢鎮心丹棗仁茯苓茯神麥冬五味肉桂人參熟地龍齒天冬遠志山藥車前硃砂蜜丸心跳琥珀養心丹琥珀龍齒遠志菖蒲茯神人參棗仁生地當歸黃連柏子仁硃砂牛黃豬心血和丸神虛妙香散見二卷衄思煩清心補血湯參苓歸芍芎地麥味陳梔草棗仁痰擾加味定志丸茯苓三兩遠志菖蒲各二兩人參一兩琥珀鬱金各五錢薑汁糊丸辰砂為衣心跳蕊珠丸豬心血一兩硃砂一兩干青靛花一匕將豬心血和靛花研勻加硃砂和丸茶下腎恐人參散人參枳殼桂心甘菊茯神山萸五味杞子各七錢五分柏子仁熟地各一兩酒下二錢心恐定志丸見本卷癲狂胃恐四君子湯參苓術草陽虛八味丸見一卷中風膽恐補膽防風湯防風一兩人參七分細辛甘草川芎茯神獨活前胡各八分為末煎怔忡脈案吳氏產後不寐心虛不安此去血多而心神失養也仿養心湯意熟地棗仁茯神柏子仁麥冬潞參五味子炙草白芍三服愈樊館課神勞心虛生熱治以天王補心丹汪氏病久失調延成虛損怔忡汗出手足心熱坐起眩暈善飢無寐診左寸虛散右寸關虛弦兩尺稍大此陰虧火炎之漸惟營虛生內熱故手足如烙寤煩神失安故汗液自泄虛陽挾風上蒙清竅故頭目眩暈肝陽肆橫陽明當其沖風火消鑠故善飢滋液熄風全用柔劑歸脾湯去耆朮木香歸姜加白芍丹皮熟地甘菊炒六服漸安去丹皮甘菊再加山藥柏子仁晚服六味丸全愈殷氏吐紅夜嗽舌瞤心惕自汗不寐晡寒食減脘痞不舒脈虛芤兩寸浮此營損及衛也用黃精柏子霜生耆炙草杞子棗仁茯神白芍川貝龍眼肉小麥煎湯緩服當晚穩寐三劑汗收嗽定矣又十餘服諸症俱愈驚恐脈案貢氏驚悸恍惚不飢不食不寐脈虛促病因怒恐而得膽火上冒則頭眩心忡胸脘刺痛氣結呵欠怯冷倏煩熱多驚皆陽越失鎮服藥鮮效總由治失其要先鎮浮陽再議和陰牡蠣龍骨俱煅研二錢磁石一錢柏子仁連翹心各五分茯神生棗仁各二錢三服症象大減改用羚羊角六分嫩桑葉三錢熟地棗仁茯神白芍各二錢小麥一合麥冬半夏各錢半數服能寐思食矣族女產後心虛善恐見聞錯妄此由肝膽怯也用酸棗仁湯養陰血棗仁潞參當歸茯神熟地遠志蓮子炙草服稍定時恍惚不思食去熟地加竹茹菖蒲服漸瘳煩躁論治內熱為煩外熱為躁煩出於肺躁出於腎熱傳肺腎則煩躁俱作然煩為陽屬有根之火故但頻不躁及先煩後躁者皆易治躁為陰系無根之火故但躁不煩及先躁後煩者皆難治傷寒論中有微煩反煩復煩煩滿煩熱煩渴胸煩心煩虛煩大煩皆熱也先煩漸躁者為煩躁先躁復煩者為躁煩煩多屬熱亦有陰寒而煩者傷寒熱在表而煩宜散桂枝湯在裡而煩宜下承氣湯在半表半裡而煩宜和小柴胡湯在胸膈以上而煩宜吐梔豉湯其陰寒而煩則有惡寒蜷臥及下利厥逆吐蛔之症宜溫溫用四逆湯蛔用烏梅丸若煩而足冷脈沉微者此陰症之煩也急用參附熱劑溫之悸而煩為虛建中湯煩而悸為熱調胃承氣湯如內傷陰虛火動而煩宜生脈散加生地黃熟地黃茯神棗仁或不得臥而煩硃砂安神丸若不煩而躁欲臥泥水中但飲水不得入口者此為陰盛格陽活人書用霹靂散或附子理中湯附子四逆湯其脈必沉細疾肢體厥冷躁擾不欲飲水是也若誤認為熱投以涼藥頃刻死矣傷寒有邪在表而煩躁者脈浮緊發熱身痛汗之則定大青龍湯有邪在裡而煩躁者脈數實有力不大便繞臍痛下之則定承氣湯有陽虛而煩躁者汗下後晝煩躁夜安靜脈沉微身無大熱乾薑附子湯有陰盛而煩躁者少陰症吐利手足冷煩躁欲死吳茱萸湯更有陰中伏陽煩躁者頭疼身溫指末冷胸滿噁心脈沉伏按至骨若有力須破散陰氣導達真火本事用破陰丹陰中伏陽症用熱藥助陽則為陰所隔絕不能導引真陽用冷藥則所伏真火立見消亡用破陰丹使水升火降得汗而解矣其雜症虛煩因津涸燥結而煩者人參固本丸加棗仁竹葉因血虛煩渴至夜躁熱尤甚者當歸補血湯因腎水下竭心火上炎而煩者生料六味丸煎服病後餘熱欲吐虛煩不安者人參竹葉湯竹茹湯病久煩熱不止六味湯加棗仁肥人虛煩不眠為痰溫膽湯煩而溺澀者五苓散加滑石煩而嘔者橘皮湯活人書曰陰氣少陽氣勝則熱而煩故太陽經傷風多煩而躁也戴元禮曰煩躁陰陽經皆有之陽明經有燥屎故煩此當下承氣湯太陽經已得汗渴煩者五苓散少陽胸滿而煩小柴胡湯陰煩少陰為多由陽氣傳入陰經陰得陽而煩自利而渴煩不眠者辰砂五苓散若非是陽氣傳陰陰氣犯陰經吐利手足厥冷而煩經云陽虛陰乘之故煩又云陰盛發躁欲坐井中吳茱萸湯甚者四逆湯加蔥白二莖外有虛煩一症乃病愈後陰陽未復時發煩熱竹葉石膏湯李東垣曰血虛發躁煩渴引飲至夜尤甚脈洪大按之無力當歸補血湯若以白虎湯服之則誤矣若脈浮大按之散此虛極將脫人參生脈散許學士治李信道六脈沉伏不見按至骨若有力頭痛身溫煩躁指冷胸中滿噁心此陰中伏陽仲景法中無此症用冷藥則所伏真火愈消即用熱劑助陽先為陰遏絕不能導引真陽須用破散陰氣導達真火之藥使水升火降然後得汗而解與破陰丹二百粒作一服冷鹽湯下不時煩躁狂熱手足躁擾其家大驚許曰俗所謂換陽也須臾稍定略睡身汗涼解又治一人傷寒身熱無汗譫語下後大便不通三日矣非躁非煩終夜不得臥時發嘆息許曰此懊憹怫鬱二症俱作由胃中有燥屎也與承氣湯下之愈素問云胃不和則臥不安仲景云陽明病下之心中懊憹微煩有燥屎者可攻又云有微熱怫鬱不臥者有燥屎又云胃中燥大便堅必譫語皆承氣湯症也附方表症桂枝湯桂芍草姜棗里症大承氣湯見一卷溫半表裡小柴胡湯見一卷溫虛煩梔豉湯梔子豆豉陰寒四逆湯見一卷暑蛔煩烏梅丸見三卷嘔吐悸煩建中湯見二卷衄血小建中湯加黃耆名黃耆建中湯煩實調胃承氣湯見二卷汗內傷生脈散參味麥神煩硃砂安神丸見二卷汗陰盛霹靂散川附子一枚燒灰存性為末作一服蜜水調陰躁附子理中湯見一卷中風表汗大青龍湯麻桂杏膏草姜棗陽虛乾薑附子湯四逆湯去甘草陰盛吳茱萸湯見三卷嘔吐伏陽破陰丹硫黃水銀各一兩陳皮青皮各半兩先將硫黃熔化次下水銀打勻令無星細研入後二味麵糊丸津少人參固本丸見一卷中風血虛當歸補血湯黃耆一兩當歸二錢腎虛六味丸見一卷中風病後人參竹葉湯一名竹葉石膏湯見一卷傷風除熱竹茹湯麥冬小麥炙草參夏苓竹茹痰多溫膽湯見一卷溫溺少五苓散見一卷溫少陰辰砂五苓散五苓散加辰砂煩嘔橘皮湯橘皮生薑健忘論治健忘者陡然忘之盡力思索不來也夫人之神宅於心心之精依於腎而腦為元神之府精髓之海實記性所憑也正希金先生嘗曰凡人外有所見必留其影於腦小兒善忘者腦未滿也老人健忘者腦漸空也隱菴云觀此則知人每記憶必閉目上瞬而追索之亦凝神於腦之義故治健忘者必交其心腎使心之神明下通於腎腎之精華上升於腦精能生氣氣能生神神定氣清自鮮遺忘之失惟因病善忘者或精血虧損務培肝腎六味丸加遠志五味或縈思過度專養心脾歸脾湯或精神短乏兼補氣血人參養營湯下遠志丸或上盛下虛養心湯或上虛下盛龍眼湯或心火不降腎水不升神明不定朱雀丸或素有痰飲茯苓湯或痰迷心竅導痰湯下壽星丸或勞心誦讀精神恍惚安神定志丸或心氣不足怔忡健忘辰砂妙香散或稟賦不足神志虛擾定志丸孔聖枕中丹或年老神衰加減固本丸若血瘀於內而喜忘如狂代抵當丸附方肝腎六味丸見一卷中風心脾歸脾湯見二卷勞瘵氣血人參養營湯見二卷勞瘵熱煩遠志丸見本卷癇下虛養心湯參耆歸術二冬菖蒲遠志茯神牛膝熟地木通上虛龍眼湯參耆麥冬草柴胡升麻茯神丹參龍眼遠志心腎朱雀丸沉香一兩茯神四兩人參二兩蜜丸痰飲茯苓湯參陳夏苓草香附益智各一錢烏梅一個竹瀝薑汁各二匙痰迷導痰湯見一卷中風補攝壽星丸參耆術草陳苓地芍歸味桂心膽星琥珀硃砂遠志豬心血糊丸恍惚安神定志丸人參白朮茯苓茯神菖蒲遠志麥冬棗仁牛黃硃砂龍眼蜜丸怔忡辰砂妙香散見二卷衄虛擾定志丸見本卷癲狂毓神枕中丹見本卷癲狂年老加減固本丸熟地天冬各一兩半麥冬炙草茯苓各一兩人參菖蒲遠志硃砂各五錢蜜丸血瘀代抵當湯見二卷血不寐論治陽氣自動而之靜則寐陰氣自靜而之動則寤不寐者病在陽不交陰也靈樞曰衛氣日行於陽夜行於陰厥氣客於臟腑則衛氣行於陽不得入於陰行於陽則陽氣盛陽氣盛則陽蹺滿不得入於陰則陰氣虛故目不瞑衛氣留於陰不得行於陽留於陰則陰氣盛陰氣盛則陰蹺滿不得行於陽則陽氣虛故目閉素問曰陰虛故目不瞑補其不足瀉其有餘調其虛實以通其道而去其邪飲以半夏湯其臥立至蓋不寐多由思慮勞神驚憂怒火氣鬱生涎用半夏湯半夏除痰而利小便秫米益陰而利大腸則陰陽交通而得臥也又曰胃不和則臥不安蓋胃氣主降若痰火阻痹則煩擾不寐也宜橘紅茯苓石斛半夏炙草枳實楂肉神麯之屬又曰臥則喘者是水氣之客也此水停心下不得眠宜茯苓甘草湯若夫心血不足或神不守舍宜歸脾湯琥珀養心丹由肝虛受邪夢中驚悸魂不守舍先服獨活湯後服珍珠母丸綱目曰人臥則血歸於肝今血不靜臥不歸肝故驚悸不得臥也由營衛俱虛神魂失守七福飲或大補元煎由膽火鬱熱口苦神煩溫膽湯加丹皮山梔鉤藤桑葉由腎陰久虧孤陽浮越六味湯加淡菜龜膠五味子由心火焦煩津干口渴宜補心丹由驚恐傷神心虛不安養心湯定志丸由思慮傷脾脾血虧損經年不寐歸芍六君子湯或益氣安神湯由膽虛不眠定志丸加熟棗仁或炒棗仁一兩研末酒調服由心膽俱怯觸事易驚十味溫膽湯由病後虛煩不眠竹葉石膏湯茯苓補心湯由虛勞煩熱不寐金匱酸棗仁湯或棗半湯由高年血衰不寐聖愈湯有喘不得寐者蘇子竹茹湯經曰肺者臟之蓋也肺氣盛則肺大不能偃臥有臥易驚醒者鱉甲羌活丸有通宵不寐者安臥如神湯有煩不得寐服藥不效者梔豉湯下硃砂安神丸有病久餘熱不止遺精不寐者六味丸加炒棗仁五味子病後及吐下後與潰瘍不得眠者屬膽虛人參茯神棗仁陳皮麥冬龍眼為主有火脈數加知母黃連竹茹心煩加炒山梔醫通曰凡婦人肥盛多郁不得眠者吐之從鬱結痰火治溫膽湯用豬膽汁炒半夏曲加柴胡熟棗仁凡怔忡驚恐健忘癲狂失志不寐皆由痰涎沃心以致心氣不足若涼心之劑太過則心火愈微痰涎愈盛惟以理痰順氣養心安神為第一義導痰湯加茯神人參石菖蒲附方內經半夏湯半夏五合秫米一升用清水揚萬遍煮服汗出即已臥喘茯苓甘草湯見本卷怔忡心血歸脾湯見二卷勞瘵安神琥珀養心丹見本卷怔忡風邪獨活湯見本卷怔忡肝虛珍珠母丸見本卷怔忡營衛七福飲見三卷郁補元大補元煎見一卷中風膽熱溫膽湯見一卷溫滋陰六味湯見一卷中風心火補心丹見一卷火心虛養心湯見二卷勞瘵心虛定志丸見本卷癲狂脾虛歸芍六君子湯六君子湯加歸芍脾虛益氣安神湯參耆苓草歸地麥連棗仁遠志膽星竹葉心膽十味溫膽湯溫膽湯加人參熟地棗仁遠志五味各一錢虛煩竹葉石膏湯見一卷傷風心煩茯苓補心湯苓夏陳草歸地麥冬茯神竹葉燈心補肝金匱酸棗仁湯見一卷中風虛煩棗半湯棗仁半夏地黃血衰聖愈湯見二卷勞瘵臥喘蘇子竹茹湯蘇子竹茹橘皮桔梗甘草驚醒鱉甲羌活丸羌獨防芎參耆味草鱉甲棗仁牛膝蔓荊通宵安臥如神湯茯苓茯神白朮山藥寒水石棗仁各一錢遠志炙草各五分人參四分辰砂五分虛煩梔豉湯梔子豆豉心火硃砂安神丸見二卷汗滌痰導痰湯見一卷中風多寐論治多寐者陽虛陰盛之病靈樞曰足太陽有通項入於腦者正屬目本名曰眼系在項中兩筋間入腦乃別陽蹺陰蹺陰陽相交陽入陰陰出陽交於目內眥陽氣盛則瞋目陰氣盛則瞑目心神昏濁不能自主脾氣困頓食已即倦皆能致之欲清心神如麥冬石菖蒲芽茶南燭之屬欲醒脾困六君子湯加砂仁身重脈緩多寐濕勝也平胃散加防風白朮神倦肢惰嗜臥氣弱也人參益氣湯長夏倦午四肢不收脾肺氣弱而傷暑也清暑益氣湯病後身熱好眠餘邪未清正氣未復也沈氏葳蕤湯膽實口苦嗜寐少陽經熱也生棗仁一兩研末茶清調服狐惑症病後腸胃空虛三蟲求食食人喉為惑上唇生瘡食人肛為狐下唇生瘡四肢沉重默默多眠黃連犀角湯治惑桃仁湯風溫症身熱脈浮自汗體重多眠鼻鼾語言難出治在少陰厥陰不可發汗葳蕤湯去麻羌熱症得汗後脈沉細身冷喜臥四逆湯少陰症欲寐從本病治附方脾虛六君子湯見一卷中風除濕平胃散術樸陳草氣弱人參益氣湯黃耆錢半人參防風升麻各七分生地白芍各五分炙草三分肉桂二分五味二十粒暑倦清暑益氣湯見一卷暑病後沈氏葳蕤湯葳蕤茯苓棗仁石膏各一錢人參七分狐惑黃連犀角湯黃連犀角烏梅木香桃仁各一錢狐惑治惑桃仁湯桃仁生槐子研艾葉各二錢熱症四逆湯見一卷暑風溫葳蕤湯見一卷溫三消論治消分上中下三症謂消渴消穀消腎也皆水火不交燥熱傷陰所致故經云二陽結謂之消手陽明大腸主津足陽明胃主液二經燥結失潤故為消上消主肺肺熱化燥渴飲無度是為消渴經所謂心移熱於肺傳為鬲消也中消主胃胃熱善飢能食而瘦是為消穀經所謂癉成為消中也下消主腎虛陽爍陰引水自救溺濁如膏精髓枯竭是為腎消經所謂腎熱病苦渴數飲身熱也三消之症上輕中重下危然上中不甚則不傳下矣故腎消者乃上中消之傳變肺胃之熱入腎消爍腎脂飲一溲二溲如膏油蓋肺主氣肺病則不能管束津液上朝咽嗌而盡輸於下其精微亦隨溲下也且消之由於火盛者陽消症也亦有氣血消乏而為陰消症者如經曰心移寒於肺為肺消飲一溲二死不治景岳以為元陽大衰金寒水冷水不化氣而氣悉化為水也脈經曰心脈微小為消癉可知症多陽虛而火多假火故治三消者必察其脈氣病氣形氣但見本源虧竭及假火症當速救根本以滋化源勿專以清火為急故金匱云男子消渴小便反多飲一斗小便一斗八味丸主之所以助氣化使津液得升也趙養葵亦曰治消症無分上中下但滋肺腎上消小劑中消中劑下消大劑概用六味丸加麥冬五味或命門火不歸源遊於肺為上消遊於胃為中消惟引火歸源宜八味丸使火歸釜底水火既濟氣上熏蒸肺受津潤消渴自止若過用寒涼恐內熱未除中寒又起古法以人參白虎湯治上消以調胃承氣湯治中消者非也必右寸滑數熱傷肺氣乃可人參白虎湯必右關數實濕熱內蘊乃可調胃承氣湯又經云二陽之病發心脾有不得隱曲其傳為風消謂憂傷心思傷脾鬱結不遂則營液暗耗胃大腸俱失通潤而肌肉風消也宜歸脾湯送固本丸或生脈散此亦陰消之類今統論之消症氣分渴者喜飲冷水宜寒涼滲劑以清熱血分渴者喜飲熱茶宜甘溫峻劑以和陰須細診脈之上下左右滑數沉細以定其有餘不足而審治之如上消氣分燥渴者黃芩湯血分燥熱者易簡地黃飲之氣血燥熱者竹葉黃耆湯肺火消渴咽乾便秘者生津飲心火消渴小水赤澀者清心蓮子飲心火上炎腎水不濟氣血日消者降心湯消渴夜甚者加減地黃丸消渴溺少身腫者紫蘇湯消渴脈浮微熱小水不利者五苓散鬲消胃滿心煩者麥門冬飲子老人虛人消渴者人參麥冬湯通治上消天花粉散中消能食而瘦渴飲便秘溺數者蘭香飲子食已如飢胃熱脈盛面黃肌瘦胸滿脅脹者七味白朮散胃火易飢熱在肌肉者瀉黃散胃熱乾渴水虧火炎者玉女煎心肺熱渴者丹溪藕汁膏脾肺津干不思飲食者本事黃耆湯通治中消黃連豬肚丸中消後胃熱傳腎消爍脂液腿細足痿者白茯苓丸下消渴飲溺如膏油者治宜攝固元菟丸秘元煎腎消虛澀者通攝兼施雙補丸腎消淋濁有火者補而兼瀉六味丸加知柏或大補地黃丸淋濁無火者補而兼攝下左飲或大補元煎火衰不能化氣氣虛不能化液者益火之源加減腎氣丸或八味丸右歸飲無火而滑小溲無度者益陽固陰鹿茸丸腎消強中莖長而堅精自出者此孤陽外張陰不內守難治由好色縱淫或餌丹石陽起石鍾乳粉之類直指曰服五石者真氣既盡石性獨留陽道興舉不交精泄名曰強中不可治其飲食如湯沃雪久則陽強精脫石子薺苨湯通治下消加減八味丸三消久小水不臭反甜者此脾氣下脫症最重七味白朮散若溺後溺面浮脂者此膏液下流腎不約制白朮散腎氣丸外有脾熱口甜為消癉經謂數食肥甘其氣上溢轉為消渴經用蘭草湯效肥令人內熱甘令人中滿治之以蘭除陳氣也此膏粱釀熱涸津即消中之漸宜地黃飲子玉泉丸有食㑊㑊易也飲食移易而過不生肌肉也經謂大腸移熱於胃善食而瘦胃移熱於膽皆名食㑊治同中消有酒渴由嗜酒積熱煩渴專嗜冷物烏梅木瓜湯有蟲渴臟腑生蟲耗津液而成消渴苦楝子湯其有渴飲一二口即厭少頃復渴但不若消渴者之無厭此中氣虛寒寒水上泛逼其浮游之火於喉舌間故上焦欲得水救水到中焦以水遇水即厭也如面赤煩躁宜理中湯送八味丸凡渴而不能食者末傳中滿鼓脹能食而渴者必發腦疽背癰皆不治此又消渴之傳變所必防者本事曰消渴全因坎水衰少腎陽不升肺為華蓋譬板覆釜暖氣上騰則板能潤若腎氣能蒸化則飲食精液上升自免乾渴宜八味丸徐忠可曰消因腎虛或因二陽結或為厥陰病其能食而渴者宜重二陽論治其飢不欲食氣撞心者宜重厥陰論治仲景傷寒論厥陰之為病消渴氣上撞心飢而不欲食皆由厥陰風鬱火燔也其飲一溲二者宜重腎虛論治此臨症時所宜細辨也繆仲淳曰三消渴疾以鮎魚涎和黃連末為丸每五七丸烏梅湯下日三服效以白芍甘草等分為末每一錢水煎日三服有患消渴九年服藥止而復作得是方服之七日頓愈不可以其平易而忽之以栝蔞根即天花粉黃連各三兩為末蜜丸每三十丸麥冬湯下日二服其飲水無度小便數者用田螺五升水一斗浸一夜渴即飲之每日一換水及螺或煮食飲汁亦妙飲水無度小便赤澀者用秋麻子仁一升水三升煮三四沸飲不過五升瘥腎消飲水溺如膏油者用茴香苦楝子等分炒研末食前酒服二錢消渴下元虛者用牛膝末酒蒸五兩生地汁五升浸日曬夜浸汁盡為度蜜丸酒下三十丸久服津液自生胃虛消渴者羊肚煮爛空腹食之消渴煩亂者干冬瓜瓤一兩水煎服消渴羸瘦小便不禁者兔骨和大麥苗煮汁服極效消中易飢者用蓯蓉山萸五味蜜丸每鹽酒下三十丸三消骨蒸者以冬瓜自然汁浸曬黃連末七次又以冬瓜汁和丸每三四十丸大麥湯下尋常口渴一服效三消脈候消渴脈實大病久可治脈懸小堅病久不可治內經趺陽脈數胃中有熱即消穀引飲大便必堅小便即數仲景消渴脈當緊實而數反沉澀而微者死心脈滑為渴滑者陽氣勝也心脈微小為消癉凡消症脈數大者生沉小者死脈經真陰耗竭腎氣不升肺臟枯燥寸口數盛為上消竭力房室服食剽悍火土太強恣情肥美氣口動滑為中消虛陽不守封藏不固右尺數大為下消張氏醫通消癉診論宜參玩附方腎虛六味丸八味丸俱見一卷中風上消人參白虎湯白虎湯見一卷中風加人參中消調胃承氣湯見二卷汗補脾歸脾湯見二卷勞瘵肺虛人參固本丸見一卷中風肺虛生脈散參麥