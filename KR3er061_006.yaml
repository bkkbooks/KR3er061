分乾薑八分煨木香五分廣皮炙草各六分砂仁一錢地榆酒炒八分數服止張氏女冬初胸脘熱痛食後脹痢血脈小數左關尺為甚陰陽兩傷天癸將至之年得此懼延損怯栝蔞仁炒錢二分枳殼黃芩白芍俱炒錢半厚朴制五分地榆酒炒八分生地炭錢半諸症漸減去栝蔞黃芩厚朴加當歸醋炒香附便制各錢半紅曲一錢血痢亦稀後服六味丸而安朱少年血痢由初春迄冬未瘳陰絡久損中間秋涼感瘧經邪或夾食滯治者不分經絡妄投大黃枳實延胡等通降理瘀元氣益削脈沉弱少神今冬怯寒食少日夜利血十數行腹不痛而滑泄治取溫澀以攝真元潞參茯苓黑甘草炮薑肉蔻牡蠣醋煅山藥炒訶子肉一服已減十數服全止族某初春痛痢痢後鮮血點滴腹痛後重脈大口燥怯冷動則氣急六旬以上痢久陰傷及陽大忌發熱仿駐車丸去黃連用烏梅阿膠煨沖當歸白芍熟地俱炒五味木香煨炙草粳米湯煎三服痢稀血止去烏梅木香加參耆陳苓蓮姜十數服而平譚氏六旬外下痢旬余猶然腹痛後重溺澀脈洪目赤顴紅寤煩口乾忽而香連丸忽而粟殼湯忽而大黃忽而肉桂用藥前後不倫失於疏理先以荸薺粉山梔石斛丹皮赤苓麥冬白芍木香汁枳殼地榆燈心一啜諸症減納粥糜矣轉方用煨木香陳皮白芍當歸茯苓地榆車前子甘草梢痢大減惟腹痛不定一處則虛氣滯也用蔥薑末炒麥麩絹包熱熨痛已服調理藥而安
