元佐瀉火後仍欲速效誤服前醫滋陰之劑遂成不治薛脾虛傷濕病發陰黃數年面浮足腫頭眩唇白便後血與調補藥稍愈近便血雖止溏而不爽小水短數腹大而硬身熱體倦脈細小濡數與補中升提佐以淡滲腿足腫退脈較有神繼與潞參生朮赤苓丹皮黑山梔茵陳牡蠣升麻大便爽熱較輕中脘偶痛去丹梔升術加木香陳皮白芍痛除改用腎氣湯去山萸澤瀉附子加炮姜腹漸軟後因不慎於口競以脹終耿久疸神疲頭眩面浮不時熱渴脈虛大陽浮不斂宜攝陰和陽牡蠣白芍五味洋參熟地麥冬石斛櫓豆皮數服效錢黃疸傷食腹脹溺黃用健脾分消之品加入茵陳湯腹脹如故擬陽明胃腑瘀熱鬱蒸用禹餘糧醋煅七次生地松蘿茶各四兩綠礬煅一兩棗肉煨研搗為丸服愈唐童年面黃能食目眩發熱不時由濕甚生熱熱蒸變黃胃熱谷消此為谷疸宜豬肚丸入秋食後脹眩便溏脈虛小熱與濕搏由太陰不運少陽化風主理脾陽佐以熄風生白朮潞參陳皮薏仁雞內金半夏曲俱炒茵陳赤苓甘菊炒天麻煨服愈瘧症論治瘧疾四時皆有而多發於夏秋以夏傷於暑汗出腠開當風浴水受淒滄之水寒及秋遇涼風束之裹邪不能外越則隨經絡以內薄舍於臟腑募原之間居半表半裡與日行之衛氣相值而瘧作焉當其邪正交爭並於陰則中外皆寒經所謂起於毫毛伸欠寒慄鼓頷腰脊俱痛也並於陽則外內皆熱經所謂頭痛如破渴欲冷飲也極則陰陽俱衰衛氣相離故病得休衛氣集則復作經云衛氣日行於陽夜行於陰瘧邪得陽而外出得陰而內搏是以日作邪氣之舍深內搏於陰陽氣獨發陰邪內著陰與陽爭不得出故間日作邪氣內搏五臟橫連募原其道遠其氣深其行遲不能與衛氣俱出故間日乃作其間二日者邪氣與衛氣客於六腑有時相失必休數日乃作也淺者邪發三陽隨衛氣以出則日一作深者邪舍三陰不能隨衛氣並出或間日間二三日而作病深者作愈遲以瘧邪有在經在腑在臟之別也己任編云臟腑相接處有虛界之募原而虛界中復有剛柔筋脈其為某臟腑之筋即為某臟腑之病究之臟腑瘧病皆募原伏邪之氣所遷移間日間二三日募原有遠近耳故邪傳陽分則作日早邪陷陰分則作日晏經曰邪客風府循膂而下與衛氣一日夜會於風府日下一節故其作晏其出風府日下一節二十五日下至骶骨二十六日入於脊內注於伏膂其氣上行九日出缺盆其氣日高故作日乃益早風府在項後入髮際一寸項骨三節脊骨二十一節其二十四節下為尾骶骨邪自風府日下一節故發晚二十五日至骶骨二十六日邪復自後而前入脊內注伏膂循脊上行無關節之阻故九日出缺盆其氣日高自陰就陽邪日退故作漸早治者須從陰分提出陽分作日早則易瘳無汗欲使有汗散邪為主而兼補汗多欲令汗少養正為主而兼散尤必分經以論治足太陽瘧腰痛頭重寒從背起先寒後熱熱止汗出難已羌活黃芩湯加減足少陽瘧身體解㑊見人心惕然熱多汗出甚小柴胡湯加減足陽明瘧頭痛渴飲灑淅寒甚久乃熱熱去汗出竹葉石膏湯加減足太陰瘧不嗜食寒多善嘔熱甚則渴桂枝湯加減參入建中湯足少陰瘧腰痛脊強口渴嘔吐寒從下起熱多寒少病難已桂枝人參白虎湯後加鱉甲牛膝足厥陰瘧腰痛少腹滿小便不利數便先用三黃石膏湯後用鱉甲牛膝湯加減此論六經瘧也若邪深伏則為五臟瘧如肺瘧令人心寒寒甚熱善驚桂枝加芍藥湯心瘧令人煩心欲得清水反寒多不甚熱桂枝黃芩湯肝瘧令人色蒼面色青太息狀若死四逆湯脾瘧令人寒腹中痛熱則腸鳴鳴已汗出小建中湯橘皮散腎瘧令人洒洒然腰脊痛大便難手足寒歸芍桂枝湯其在腑則胃瘧令人善飢而不能食食而支滿腹大二陳湯加枳殼草果既辨六經臟腑更審六淫所傷輕重如風瘧脈浮大春夏為多感風而得惡風自汗頭痛風為陽邪故先熱後寒宜紫蘇川芎白芷姜皮等寒瘧脈緊盛秋冬為多乘涼浴水感寒而成惡寒無汗寒為陰邪故先寒後熱宜桂枝生薑厚朴草果等暑瘧脈虛受暑熱熾煩冤邪傷上焦肺氣發必寒輕熱重唇燥舌絳渴喜冷飲盛暑發者白虎湯虛加人參麥冬秋涼伏暑發者杏仁貝母花粉黃芩半夏知母青蒿等濕瘧脈濡緩面浮身痛脘悶不飢嘔惡邪阻中焦脾絡發必寒重肢冷舌白苔膩喜熱飲大便不爽忽秘忽溏為濕結氣痹宜半夏厚朴白蔻草果薏苡滑石茯苓通草或胃苓湯去桂草其濕熱交蒸阻氣泄熱滲濕審其重輕切忌柴葛劫津宜杏樸芩夏橘紅生薑竹茹麥冬栝蔞枳殼癉瘧但熱不寒由陰氣先傷陽氣獨發壯熱少氣煩冤手足熱欲嘔邪內藏於心外舍肌肉令人消爍肌肉宜甘寒生津生地麥冬知母竹葉丹皮杏仁貝母花粉梨汁蔗漿盛暑發者白虎湯溫瘧脈如平人但熱不寒骨節煩疼時嘔金匱用桂枝白虎湯若溫邪兼濕宜半夏杏仁蔻仁滑石俱忌柴葛升舉牝瘧多寒金匱用蜀漆散宜酌用二陳湯加薑桂枝牝瘧邪伏於腎經氣分寒瘧邪伏於膽經營分若但寒不熱柴胡薑桂湯痰瘧素脾虛多痰瘧熱又能蒸痰胸悶欲嘔熱痰君貝母佐以竹茹橘紅栝蔞霜茯苓皮寒痰君白朮佐以半夏陳皮薑汁蘇子食瘧飲食生冷不節致寒熱較重飢不思食滿悶腹疼養胃湯減參朮瘴瘧嶺南氣炎感受山嵐澗溪之毒乍寒乍熱迷悶發狂須祛瘴滌痰平胃散加減疫瘧因染時邪寒熱成瘧其症沿門合境達原飲五瘟丹不換金正氣散鬼瘧夜發為邪入血分宜升散營中之邪內補建中湯加升柴生首烏脾虛者補中益氣湯勞瘧病久延虛尫羸氣怯因勞輒發寒熱模糊最難調治補中益氣湯加牛膝鱉甲制首烏瘧母久病失調邪入肝經挾瘀血痰涎脅下結塊宜疏通血絡用鱉甲桃仁蓬朮牡蠣加金鈴子歸鬚延胡桂枝甲片或鱉甲煎丸虛人瘧母宜補劑兼疏散藥瘧疾變痢因暑濕迫注失於解散由經入腑宜表裡分消用柴胡半夏黃芩枳殼陳皮紅曲滑石茯苓炙甘草連進大劑以痢愈為度瘧亦止此治諸瘧之大概也此外又有似瘧非瘧同一惡寒發熱或寒熱往來最宜詳辨脈症虛實勿以陰陽內損之初症誤認瘧邪輕用表散如小柴胡湯祛瘧飲之類若脈症皆虛即宜黃耆建中湯補中益氣湯升柴少用血虛發熱者逍遙散蓋陽虛則惡寒陰虛則發熱凡傷寒後及大病後產後勞怯等症俱有寒熱往來或一日一二發俱宜作虛治以瘧之寒熱有定時雜症之寒熱無定時為辨論中治法有未備者參觀後論瘧疾脈候瘧脈自弦弦數多熱弦遲多寒弦而浮大可吐弦短傷食弦滑多痰微則為虛代散者死遲緩者愈入門曰衛虛則先寒營虛則先熱表邪多則寒多里邪多則熱多表裡相半則寒熱相等附方太陽羌活黃芩湯羌芩陳草前胡豬苓知母口渴加麥冬石膏少陽小柴胡湯見一卷溫症口渴去半夏加麥冬石膏陽明竹葉石膏湯見一卷傷風痰多加橘紅貝母太陰桂枝湯桂芍草姜棗太陰建中湯見二卷衄血少陰白虎湯見一卷中風加人參名人參白虎湯加桂枝名桂枝白虎湯厥陰三黃石膏湯見一卷疫厥陰鱉甲牛膝湯鱉甲牛膝當歸陳皮柴胡熱甚加麥冬石膏口渴加花粉肺瘧桂枝加芍藥湯桂芍草姜棗倍芍藥用心瘧桂枝黃芩湯即桂枝湯加黃芩肝瘧四逆湯附子姜草脾瘧橘皮散橘紅薑汁浸者焙乾研末棗湯下三錢腎瘧桂枝加歸芍湯即桂枝湯加歸芍胃瘧二陳湯見一卷中風風瘧芎蘇飲見二卷咳嗽寒瘧露姜煎生薑四兩搗汁露一宿凡治瘧湯劑露一宿者取白露降則暑熱除之意暑瘧白虎湯見一卷中風濕瘧柴平煎小柴胡湯合平胃散濕瘧胃苓湯見一卷中風濕熱白虎蒼朮湯見一卷中風牝瘧蜀漆散蜀漆雲母燒二晝夜龍骨煅研末水調寒瘧柴胡薑桂湯柴姜桂芩草花粉牡蠣食瘧養胃湯參術陳夏苓樸砂曲丁香木香藿香麥芽草蓮子各七分加姜滌痰平胃散見一卷中風疫瘧達原飲見一卷疫疫瘧五氳丹芩連柏草香附紫蘇用大黃熬膏為丸辰砂雄黃為衣疫瘧不換金正氣散平胃散加半夏藿香鬼瘧內補建中湯黃耆建中湯加當歸補氣補中益氣湯見一卷中風瘧母鱉甲煎丸鱉甲灰酒浸煮汁一兩二錢柴胡白芍丹皮䗪蟲烏扇鼠婦蜣螂各四錢桂枝阿膠各三錢黃芩桃仁乾薑大黃半夏人參厚朴蜂房石葦紫葳各二錢葶藶瞿麥各一錢五分赤硝一兩以鱉甲汁為丸散邪祛瘧飲柴蘇檳陳楂枳草二母水煎露一宿散郁逍遙散見一卷火瘧脈案甲申予館新洲長夏感暑兼濕瘧間日發寒熱俱重涎沫甚多用平胃散加柴胡製半夏神麯赤苓二服愈又乙酉感風成瘧經曰風淫於內治以辛涼用芎蘇飲去乾葛木香加薄荷姜皮一服愈胡伏暑發寒熱如瘧頭暈脘痞此暑邪挾濕阻遏氣分故汗止在胸前宜辛涼解散用梔豉湯加杏仁枳殼黃芩半夏栝蔞滑石數服而平族婦暑症轉瘧寒微熱甚汗多頭眩便硬用竹葉石膏湯去參加知母服愈毛熱症未愈復因邪滯惡寒怯風胸滿腹脹午前寒熱如瘧至夜乃汗右關尺浮滑症兼表裡治宜經腑疏解用柴胡半夏薄荷蘇梗陳皮厚朴赤苓神麯生薑二服諸症退去薄荷加黃芩砂仁殼雞內金炙數服全愈侄寒瘧吐瀉脈遲虛用理中湯加半夏茯苓砂仁神麯薑汁一服吐瀉止瘧輕診脈虛而少力此中氣不足也令與稀糜用補中益氣湯神爽思食瘧止又服四君子湯加黃耆炙砂仁愈李秋瘧背寒肢厥從卯時冷至酉方熱夜半無汗自退不飢不食倦臥仿陳遠公解寒湯潞參於朮川附炙川芎柴胡桂枝草果煨研薑棗煎服得汗而寒減去川附加半夏穀芽陳皮當歸思食瘧止此症與丹溪所治少年足冷瘧相似但彼由接內此係陽虛王咳嗽痰多右膊痛瘧間日發脈浮緩此為肺瘧得之浴後當風經所謂夏傷於暑汗大出腠理開發因遇夏氣淒滄之水寒藏於腠理皮膚之中秋傷於風則病成也肺主皮毛故為肺瘧用柴胡湯合二陳去黃芩加防風蘇葉桑皮杏仁薑棗煎數服愈侄間日瘧寒熱俱重頭痛背寒肢麻肋悶嘔惡痰多由濕熱阻遏氣分白蔻仁厚朴各五分廣皮枳殼各一錢半夏茯苓各二錢青蒿八分杏仁錢半栝蔞竹茹各錢二分煨姜二錢一服脘悶已展嘔惡亦除痰降便通濕熱去瘧自止杏仁半夏各錢半赤苓二錢栝蔞枳殼橘紅甘菊各八分蔻仁三分竹茹一錢嫩桑葉三錢一劑瘧止前用溫膽湯愈瘧尚不嗜食大便難脘中欠爽病在左關不和因之腸腑失降用兩和厥陰陽明白芍旋覆花陳皮半夏栝蔞仁牡蠣粉杏仁竹茹枳實汁再服悉平族孫胎瘧停滯用寸金丹三錢薑湯服二次愈本間日瘧偏頭痛連齒夜煩不寐症由膽火升越震動心主致神憒語錯必熄膽絡風火瘧邪自已鉤藤鱉甲各二錢山梔丹皮麥冬各一錢黃芩連翹各七分半夏青鹽炒一錢半夜交藤五錢日二服兼下牛黃清心丸瘧輕改用烏梅二枚赤苓生首烏各三錢鱉甲二錢牛膝當歸丹皮各八分一啜而止梁氏粵產地暖氣泄客居黃河以北風土迥殊今夏秋暑雨蒸淫感症成瘧寒熱煩滿微汗以濕瘧治仿古柴平湯用柴胡黃芩半夏茯苓枳殼山梔茅朮生厚朴陳皮薑棗二服汗透寒熱減改用清暑退邪前方去茅朮樸枳加青蒿香薷薄荷再劑而愈某瘧間日發寒重熱輕汗多神倦發時頭不痛口不渴但凜寒拘急肢冷髀酸老人氣虛有痰此非暑非風乃虛邪入絡名曰勞瘧先時勿食汗後服保元湯扶正以逐絡邪參耆術草歸陳鱉甲炙柴胡半夏威靈仙姜煎一啜遂止陰瘧論治前論瘧邪伏於募原淺者客三陽經深者入三陰經夫臟腑之經各有界絡邪在某經即某經瘧因邪有淺深舍有遠近行有遲速故衛氣相值有日發間一日二日而發之殊間一日發與日發者治法同病亦易愈惟間二日為難治以伏邪深入三陰故名陰瘧也足太陰脾足少陰腎足厥陰肝其經深遠三陽瘧多發在夏至後處暑前三陰瘧多發在處暑後冬至前發愈晚者去亦遲以氣令收肅故也其發時亦不定有前間一日忽間二日發者有前間二日忽一日夜兩發者有連發二日中間一日者有間三日發不爽者或不忌口不節勞伏邪旁溢界絡皆能致之否則發期錯亂乃將愈之兆矣陰瘧主治之法惟和營調衛兼疏邪勿期速效用劫劑如常山飲七寶飲每見用常山巴霜劫痰得效者面色燻黑留邪在裡後多變成癆熱鼓脹不治良可恨悼因前論治法未盡而申之凡通治諸瘧初起宜散邪露姜煎往來寒熱小柴胡湯寒多者小柴胡湯加桂枝寒少熱多清脾飲濕盛平胃散痰多二陳湯二妙丸濕盛嘔瀉平胃散合四苓散加砂仁半夏濕熱俱盛清中驅瘧飲暑熱兼濕香薷飲加黃芩半夏赤茯滑石伏暑秋瘧黃芩知母花粉栝蔞枳殼竹茹熱瘧心下痞結半夏瀉心湯小陷胸湯加減此諸瘧通治法若陰瘧邪深本不在表三五發後乘元氣未衰用陳香櫞大者全個挖小蓋入水飛雄黃五錢納蓋銅絲紮好炭火煅煅時煙出勿令雄黃走出存性研末病者隔夜勿食明晨開水下以箸探喉吐盡膠痰再服再吐半日飲粥湯吐止頑痰既去隨服補劑歸脾湯加減效如未止寒熱必輕截瘧飲立效勿用常山等延久必虛專養正卻邪補中益氣湯加半夏如未止熱重於寒用丹皮鱉甲白芍當歸何首烏寒熱夜甚何首烏散加歸身發時漸晏大劑補中湯內升麻柴胡少用寒從背起陽虛汗泄人參黃耆桂枝炙草茯神大棗鹿膠牡蠣熱盛傷陰遺精便血固本丸加白芍首烏阿膠營衛兩虛人參養營湯或何人飲脾陽虛食不化六君子湯四獸飲俱加砂仁神麯穀芽甚者理中湯脾陰陽俱虛歸芍六君子湯加首烏胃陰虛不飢不食人參玉竹麥冬白芍石斛薏苡烏梅半夏脾胃兩虛肢寒泄瀉附子理中湯參苓白朮散邪入厥陰嘔沫腹痛蛔動肢厥半夏瀉心湯去參草大棗加牡蠣白芍厚朴烏梅久瘧腎陰虛面赤口渴六味湯加五味白芍肉桂腎水火俱虛瘧久成癆養營湯吞八味丸虛人瘧母不治成脹四獸飲加鱉甲當歸尾桂心元氣猶壯癖積左脅下鱉甲飲子不應何膝煎瘧久邪結血絡左脅脹痞連及少腹治宜通絡守補無效桃仁丹皮鱉甲歸尾桂心甲片延胡通其血絡痞脹乃除再用補劑自獲全愈己任編曰凡瘧將發時與正發之際勿施治治亦無效必待陰陽升極而退此邪留所客之地乃可服藥治之且當未發前二三時迎而奪之凡小兒胎瘧不能服藥用黃丹五錢生明礬三錢胡椒二錢五分麝香少許共研末以好醋調敷手心男左女右以絹包手掌藥發自汗而愈凡小兒未進穀食者患瘧久不止用冰糖濃煎湯喂之最驗出徐忠可金匱注附方劫痰常山飲常山酒浸炒二錢草果檳榔知母各一錢貝母錢半甲片一錢烏梅二個劫濕七寶飲常山草果檳樸青陳草水酒煎露散寒露姜煎見本卷瘧寒熱小柴胡湯見一卷溫熱多清脾飲樸術苓夏青草柴胡草果黃芩姜濕盛平胃散見一卷中風痰多二陳湯見一卷中風消痰二妙丸橘紅半夏神麯和丸滲濕四苓散五苓去桂見一卷溫濕熱清中驅瘧飲柴芩枳樸青陳術夏山楂草果姜暑瘧香薷飲見一卷中風痞熱半夏瀉心湯見一卷溫結熱小陷胸湯黃連半夏蔞仁補脾歸脾湯見二卷勞瘵截邪截瘧飲黃耆二錢參術苓各錢半砂仁草果橘紅各一錢五味三分甘草六分烏梅三個姜三片棗二枚養正補中益氣湯見一卷中風夜熱何首烏散生何首烏五錢青陳草各一錢姜七片大棗三枚露一宿陰陽固本丸見一卷中風營衛養營湯見二卷勞瘵營衛何人飲首烏人參各三錢當歸陳皮各二錢姜三片陽虛六君子湯見一卷中風補截四獸飲六君子湯加烏梅草果姜棗陽虛理中湯見一卷中風補脾歸芍六君子湯六君子湯加歸芍脾胃參苓白朮散見三卷睥胃吐蛔烏梅丸見三卷嘔吐陰虛六味湯見一卷中風陽虛八味湯見一卷中風氣癖鱉甲飲子鱉甲耆術檳樸芎芍陳草烏梅草果姜棗血癖何膝煎首烏制二兩牛膝鱉甲醋炙各一兩當歸五錢橘紅三錢虛加人參發日空心服陰瘧脈案房弟陰瘧寒熱俱重汗多不寐氣促腹痛大便頻左脈微軟右關尺弦長此脾虛肝乘而心陽不攝也用法宜以溫通甘緩兼佐酸泄理中湯加茯神龍眼肉草蔻肉蔻白芍三服而神爽痛瀉止寒熱亦減繼用歸脾湯丸加山藥蓮子何首烏等漸瘳毛三瘧早用截劑寒熱無定頭汗冷呃逆沫吐青色面慘黑手足厥脈沉數小乃邪入厥陰在裡瘀濁上犯清道治先通陽泄濁用吳茱萸湯加丁香乾薑製半夏青皮茯苓濁逆已止嗣用四逆湯肢和瘧二日發用四獸飲寒熱漸輕接服八珍丸料加首烏牛膝砂仁半夏薑汁煮棗肉為丸病除朱深秋瘧發三陰頭眩熱甚不渴溺痛右脈較大必系暑濕伏邪內蘊昔人治瘧無汗須令有汗乃邪從外泄今值霜降氣令收肅雖用辛解邪不得越尚難穩許愈期紫蘇半夏青蒿石斛生薏仁當歸鮮何首烏知母數服微汗寒熱減右脈平兩關稍虛治宜扶正兼去邪六君子湯加鮮何首烏炙鱉甲當歸知母以清透營分加薑棗煎服得痊錢氏懷妊六月餘客歲陰瘧未止因食牛脯腹滿不飢穀食亦脹致寒熱沉綿盛暑怯寒衣絮無汗此衛陽大衰腑失通降正虛邪錮須防胎損治宜溫衛通腑忌用耆朮守補潞參鹿膠當歸茯苓草果煨薑炒楂肉半夏陳皮六服瘧止族某三日瘧經年未止處暑後燥氣加臨日發寒熱食頃煩嘈乾嘔色悴甚渴眩痔痛此燥熱傷陰胃液虛而陰火上乘下迫也仿甘露飲意用生地黃炒知母酒炒麥冬石斛花粉生白芍阿膠水化數服症退用何人飲瘧止朱三陰瘧發日晏脘痞嘔酸乃半夏瀉心湯症耳猶服知母烏梅穿山甲等苦酸透絡截劑遂令寒熱無汗三日兩發舌有蟹爪紋是脾臟寒水旁溢支絡別成窠臼一增為兩求輕反重矣宜六君子湯溫脾以運濕水濕去則寒熱輕不致邪傷肝腎延成羸怯潞參於朮雲苓陳皮半夏薑製砂仁草果煨姜數服已去其一仍二日一發又數服發益早即寒熱亦微以原方藥制末加牛膝炒去草果用薑汁和棗肉為丸服愈房弟三日瘧初發寒痰甚多先令將陳香櫞去蒂納明雄黃五錢水飛研炭火煅勿令煙泄存性共研細空心開水下臥片時以箸探吐痰涎再服再吐能吐出膠痰更好吐半日飲粥湯吐止病愈後調補元氣以杜復發李患前症夜發用何首烏散後以勞力鼻衄寒止熱甚治宜和陰透邪烏梅肉二錢白芍三錢知母酒炒錢半鱉甲炙三錢生首烏四錢生地黃二錢半牛膝酒蒸錢半數服而止此酸味可以和陰陰藥可以透邪秦陰瘧誤藥寒熱纏綿無汗面浮腹腫眼色如金肉黃便瀉脈左沉緩右虛濡水濕漬里溢膚勢成痞脹用分消法大腹皮茵陳製半夏生薏仁茯苓各二錢蘇梗陳皮穀芽各一錢枳殼砂仁各八分厚朴五分姜三錢車前子五分溺爽汗出諸症俱退去蘇梗枳樸加雞內金炙三錢於術炒一錢仿利水實脾法得愈霍亂論治霍亂多發於夏秋之交其症煩滿腹痛上吐下利頭痛身熱揮霍撩亂甚則轉筋入腹四肢逆冷良由起居冷熱不調飲食生冷失節清濁相干水穀不化邪在上焦則吐在下焦則利在中焦則吐利交作謂之濕霍亂若胸腹絞痛欲吐不吐欲瀉不瀉煩躁悶亂俗名攪腸痧即為乾霍亂也故經曰清氣在陰濁氣在陽營氣順行衛氣逆行清濁相干亂於腸胃則為霍亂又曰厥氣上逆則為霍亂古今論治不一大約因濕土為風木所克又為炎暑蒸郁故嘔吐者暑熱之變泄瀉者濕土之變轉筋者風木之變其間更多飲食停滯氣不升降而成經曰太陰所至為中滿霍亂吐下土鬱之發民病嘔吐霍亂注下此言受濕霍亂又曰歲土不及風乃大行民病霍亂飧泄此言風木剋土為霍亂又曰熱至則身熱霍亂吐下此言受熱霍亂論治霍亂者劉河間主火熱孫真人主食積丹溪以為外感內積陽不升陰不降張子和主風濕暍三氣合而為邪張景岳主寒邪傷臟李士材兼主濕熱風暑虛實分別治羅謙甫專主氣不和用地漿治戴復庵隨病之緣感人之虛實而大旨重痰故用蘇合香丸通痞塞次用藿香正氣散吞來復丹以控痰涎初起陰陽攪亂先服燒鹽湯探吐之以吐中即寓發散也通用藿香散回生散若脹痛嘔瀉察其邪甚於上宜平胃散神香散或和胃飲邪甚於下宜五苓散胃苓湯無脹痛但嘔惡者二陳湯合丁香散加白蔻砂仁暑月感涼霍亂吐利胃苓湯加藿香半夏食後感寒腹痛吐利藿香正氣散加神麯傷生冷腹痛吐利六和湯傷暑身熱煩渴嘔利黃連香薷飲輕者五物香薷飲暑濕相搏煩渴滿悶二香散傷濕肢重骨節煩痛二朮二苓厚朴陳皮澤瀉或除濕湯若吐利轉筋為風木刑脾平胃散加木瓜或木瓜湯轉筋腹痛木瓜建中湯食滯腹痛香砂枳朮丸加神麯穀芽七情鬱結七氣湯加烏藥木香陳皮枳殼吐利不止元氣耗散或口渴喜冷或惡寒肢厥或發熱煩躁欲去衣被此並非熱乃陰盛格陽不可誤用寒涼宜理中湯甚則附子理中湯四逆湯加食鹽少許並冷服暴瀉如水汗冷脈微急用漿水散冷服吐利夏月泄瀉或嘔吐生薑汁調天水散冒暑腹痛嘔瀉轉筋木瓜吳萸食鹽各半兩同炒煎湯溫服吐利頭痛身熱而渴五苓散吐利口乾煩渴引飲麥門冬湯吐利虛煩不眠參胡三白湯異鄉初到不伏水土吐利加減正氣散乾霍亂上不得吐下不得瀉胸腹攪痛乃土鬱不能發泄或宿食與寒氣交搏而成蓋邪淺易得吐利邪深則陰陽格拒氣道不通不速治多致暴死急於委中穴刺出血先用鹽湯探吐或熱童便和燒鹽少許三飲三吐宜提其氣但清氣得升則濁氣可降而出治宜溫中破氣散滯之劑內用排氣散加減或神香散七氣湯外以吳萸青鹽各兩許略研炒熱熨臍下如小便不通冬葵子湯二便不通厚朴湯或已得吐瀉症勢略定宜二陳湯藿香散凡霍亂初定不可急與粥湯恐邪滯未盡復聚且胃氣逆不能和降也轉筋千金方曰陽明屬胃大腸以養宗筋吐瀉津液暴亡宗筋失養輕者兩腳轉筋而已重者遍體轉筋入腹手足逆冷危甚風燭矣倉猝間急以鹽填臍中炮艾不計壯數雖已死胸有暖氣者立醒急用木萸散木瓜食鹽吳萸各五錢同炒再加茴香蘇葉甘草煎服搗蒜塗兩足心雖昏危轉筋入腹亦效霍亂脈候脈伏或微澀者霍亂醫通脈代者霍亂代而亂者亦霍亂醫鑑氣口脈滑乃膈間有宿食雖吐當更以鹽湯探吐吐盡用和中藥脈浮洪可救微遲不語氣少難治得效脈微澀或代散或伏或結促不可便斷為死脈亂故也正傳轉筋入腹四肢逆冷氣欲絕脈洪大可治脈微而舌卷囊縮不治綱目乾霍亂吐瀉不得胸腹脹硬面唇青黑手足冷過腕膝六脈伏絕氣喘急舌短囊縮者死回春附方通治藿香散藿香蒼朮陳樸苓夏通治回生散藿香廣皮各五錢脹嘔平胃散術樸陳草氣逆神香散丁香白蔻寒濕和胃飲姜樸陳草利濕五苓散見一卷溫感涼胃苓湯見一卷中風痰嘔二陳湯陳夏苓草調氣丁香散丁香五分藿香枇杷葉各二錢姜一片感寒藿香正氣散見一卷中風生冷六和湯見一卷暑傷暑黃連香薷飲見一卷中風傷暑五物香薷飲見一卷中風暑濕二香散見一卷中風傷濕除濕湯見一卷中風轉筋木瓜湯木瓜二錢茴香六分茱萸錢半甘草三分姜五片腹痛木瓜建中湯桂芍各錢半草一錢飴糖二匙姜棗加木瓜二錢半柴胡一錢食滯香砂枳朮丸木香砂仁枳殼白朮情郁七氣湯見二卷咳嗽陰盛理中湯見一卷中風厥冷四逆湯見一卷暑脈微漿水散見一卷暑泄濕天水散見一卷溫煩渴麥門冬湯麥冬二錢陳夏術苓各一錢小麥半合參草各五分烏梅一個姜三片虛煩參胡三白湯人參五分苓術歸芍陳麥柴梔草各八分五味三分烏梅一個散滯排氣飲見三卷積聚溺澀冬葵子湯冬葵子滑石香薷各二兩木瓜一枚每服五錢便秘厚朴湯厚朴枳殼良薑檳榔朴硝各七錢五分大黃二兩每服三錢脾虛藿香安胃散藿香人參陳皮各一錢丁香五分姜十片霍亂脈案胡氏秋間吐瀉欲死診脈知為積寒感暑而發用藿香砂仁半夏焦神麯茯苓小茴香陳皮炙草煨姜煎服一劑愈此症多由溫涼不調生冷失節以致陰陽乖格清濁相干夏秋間為多也門人某於道光辛巳暑夜吐瀉是年時癘大行凡吐瀉霍亂見腳麻轉筋囊縮者立斃城鄉日以數十計大率口鼻吸入穢邪頭暈胸悶心腹猝痛傾吐注瀉陽脫肢冷目陷筋掣身溫汗油頃刻昏厥矣沿門闔境病勢一轍用六和湯去扁豆白朮杏仁加薄荷梗木青煨姜半日服二劑遂定後加意調攝得安王腹痛吐瀉煩躁不安腿足筋掣症由長夏務農水田烈日中多受濕暍脾陽不司運化吐瀉驟作煩渴無寐又下多傷陰筋失榮養故拘急而抽搐也若厥逆躁擾者死診其脈虛而促用生脈散加藿梗茯苓砂仁陳皮木瓜當歸白芍數服而平王暑夜停食腹痛霍亂用大和中飲乾薑改煨姜一服止李婺源暑月霍亂瀉利稀水嘔出宿腐右脈微小左更模糊不但脾失轉輸清濁相干且察其神氣索然理防痙厥急須主以溫中佐以分利參六和四苓合方半夏砂仁茯苓茯神豬苓藿梗潞參炙草煨薑穀芽一服吐瀉止再服小便利隨去豬苓加白朮用鍋巴湯煎二服霍然以起後誤以冷飲卒致不救泄瀉論治泄瀉者胃中水穀不分併入大腸多因脾濕不運內經所謂濕多成五泄也一曰飧泄完穀不化脈弦腸鳴濕兼風也平胃散加羌獨升柴經云春傷於風夏生飧泄二曰溏泄腸垢汙積脈數溺澀濕兼熱也清六丸大分清飲或胃苓湯加黃連經云暴迫下注皆屬於熱三曰鶩泄大便澄清如鴨屎脈遲溺白濕兼寒也治中湯附子理中湯加肉豆蔻經云諸病水液澄澈清冷皆屬於寒四曰濡泄身重腸鳴所下多水脈緩腹不痛濕自甚也四苓散加蒼朮胃苓湯加草果經云濕甚則濡泄五曰滑泄洞下不禁脈微氣脫濕兼虛也四柱六柱飲或四君子湯加升柴經云清氣在下則生飧泄難經所云五泄一曰胃泄飲食不化即風乘濕也胃氣湯二曰脾泄嘔逆腹脹即暑乘濕也香薷飲參桂苓甘露飲加姜三曰大腸泄腸鳴切痛即燥乘濕也五苓散四曰小腸泄便膿血小腹痛即火乘濕也承氣湯下之再以黃連解毒湯加歸芍治之次以芍藥柏皮湯止之五曰大瘕泄裡急後重數至圊而不能便莖中痛即寒濕變為熱泄也八正散加木香檳榔次用天水散此外有痰泄痰泄脈滑類弦積濕成痰留於肺中故大腸不固二陳湯加浮石黃芩神麯薑汁竹瀝或吳茱萸湯溫服探吐痰涎泄自愈有食泄食泄脈弦緊腹痛則泄泄後痛減治中湯加香砂枳朮楂肉陳皮穀芽麥芽傷酒泄嗜酒傷濕便青綠色葛花解酲湯有暑泄暑泄脈虛自汗面垢暴瀉如水薷苓湯桂苓甘露飲伏暑久瀉玉龍丸有盛暑傷其外陰冷傷其中為內外交迫連理湯有腎泄即五更泄一名晨泄由命火衰腎虛不攝宜補骨脂五味子山萸肉桂山藥茯苓小茴香杜仲菟絲有脾腎泄由二經並虛朝泄暮已久而神悴肉削四神丸有飯後即便亦由脾腎交虛真火不能腐熟水穀故食下即泄二神丸有滑泄久而不止固腸丸由氣虛下陷者補中湯或大便滑泄小便精出者萬全丸若老人諸泄不宜多用滲泄分利以人生五十後升氣少降氣多滲利太過是降而益降未免重竭其陽瀉多則亡陰謂亡其陰中之陽宜升提陽氣如升柴獨防佐以朮附補骨脂士材治泄九法淡滲升提清涼疏利甘緩酸收燥脾溫腎固澀治泄者當權其輕重緩急而用之凡泄皆兼濕初宜分理中焦滲利下焦久則升舉必脫滑不禁然後以澀藥固之凡泄水腹不痛者濕也宜燥滲完穀不化者氣虛也宜溫補腹痛腸鳴水泄一陣痛一陣者火也宜清利時瀉時止痰也宜豁之瀉後痛減食積也宜消之脾泄久宜澀下陷宜升提論腎泄腎中真陽虛而泄瀉者每於五更時或天將明即洞泄數次此由丹田不暖所以尾閭不固或先腸鳴或臍下痛或經月不止或暫愈復作此為腎泄蓋腎為胃關二便開閉皆腎臟所主今腎陽衰則陰寒盛故於五更後陽氣未復即洞泄難忍古方治腎泄用椒附丸五味子散若欲陽生於陰腎氣充固宜八味丸去丹皮加補骨脂菟絲子五味子用山藥糊丸為妙瀉與痢不同及先後傳變瀉由水穀不分病在中焦痢以脂血傷敗病在下焦在中焦者分利脾胃之濕在下焦者調理肝腎之傷若水瀉久則傳變而痢膿血是脾傳腎謂之賊邪故難愈若先痢後瀉是腎傳脾謂之微邪故易瘳泄瀉脈候胃脈虛則瀉脈滑按之虛必下利腎脈微小則洞泄肺脈微甚則泄泄瀉脈洪大者逆泄而脫血脈實者難治泄瀉脈緩時小結者生浮大數者死瀉脈多沉沉遲寒促沉數火熱沉虛滑脫暑濕緩弱多在夏月附方除濕平胃散見一卷中風飧泄升陽除濕湯見一卷濕分消清六丸滑石甘草紅曲熱泄大分清飲茯苓豬苓澤瀉木通山梔枳殼車前子各一錢濕泄胃苓湯見一卷中風食泄治中湯見三卷飲食寒泄附子理中湯見一卷中風滲濕四苓散見一卷中風虛泄四柱六柱飲參附苓木香名四柱飲加肉果訶子名六柱飲虛泄四君子湯見一卷中風胃泄胃風湯參術苓歸芍肉桂粟米脾泄香薷飲見一卷中風暑泄桂苓甘露飲見一卷暑小腸大小承氣湯見一卷溫清火黃連解毒湯見一卷溫清熱芍藥柏皮湯芍柏皮連歸瘕泄八正散見一卷火熱泄天水散見一卷溫痰泄二陳湯見一卷中風痰泄吳茱萸湯見三卷嘔吐酒泄葛花解酲湯見一卷濕暑泄薷苓湯香薷飲合四苓散暑泄玉龍丸硫黃硝石滑石明礬暑泄連理湯見一卷暑脾腎四神二神丸見三卷飲食滑泄固腸丸龍骨附子丁香訶子良薑蔻仁砂仁木香赤石脂升提補中益氣湯見一卷中風滑泄萬全丸赤石脂炮姜各一兩胡椒五錢醋糊丸腎泄椒附丸川椒附子各五錢山萸二兩螵蛸炙鹿茸烙去毛酒蒸焙龍骨各四錢酒糊丸腎泄五味子丸杜仲五味肉蔻故紙各一兩吳萸三錢薑棗為丸補陽八味丸見一卷中風通治泄瀉方白朮茯苓陳皮甘草澤瀉砂仁神麯麥芽寒加木香煨姜熱加黃芩白芍暑加香薷扁豆濕加蒼朮半夏豬苓滑石食加山楂枳實久加人參黃耆升麻滑泄不禁加肉蔻訶子腸滑久瀉方白麵炒黃二兩冬朮一兩故紙五錢滑加粟殼三錢臨服加白糖不食久瀉方糯米一升水浸一宿慢火炒熟研細懷山藥炒一兩研細和勻加白糖川椒調服泄瀉脈案湯氏初秋寒熱吐瀉或以為感暑用香薷飲或以為霍亂用藿香正氣散其家兩置之診其脈濡而弱煩熱無汗自利嘔渴予謂濕甚則濡瀉今濕鬱生熱熱蒸更為濕故煩而嘔渴也宜豬苓湯去阿膠主之豬苓二錢茯苓三錢澤瀉八分滑石六分加半夏錢半薄荷梗八分薏苡煨姜各三錢燈心六分一服嘔止泄稀去滑石煨薑半夏再加麥冬山梔車前二劑而安湯氏冒暑重感新涼寒熱頭暈口乾舌燥嘔瀉不已頭汗劑頸而還醫用消導轉益煩渴脈不數而滑大此邪鬱蒸痰先挑薑汁止嘔用正氣散加減藿香薄荷以辟惡丹皮梔芩以解熱夏曲煨姜以除痰赤茯豬苓薏仁以利濕花粉麥冬以生津一服汗涼脈和舌潤矣因有年體弱明晨怯寒手足微涼此脾陽虛也用理中湯炮姜改煨姜加砂仁苓薏炙草一劑嘔瀉止手足和但氣微墜宵分少寐原方去煨姜加茯神炙耆棗仁白芍升麻一服而安予館新洲江水泛潮地最卑濕長夏晨泄每陰雨前尤驗痰多不渴或吐白沫清晨左脅氣響必陣瀉稀水此濕多成五泄也胃苓湯加神麯炒半夏制乾薑少許一則劫陽明之停飲以燥濕一則開太陽之裡氣以導濕故一啜輒止良由長夏濕淫水穀停濕脾陽少運故也嗣後去桂加砂仁小茴二術生用或蒼朮薑曲煎服亦止潘色蒼嗜飲助濕釀熱濡瀉經年脈寸關實大豈溫補升提所得效細詢平昔吞酸去秋連發腿瘍明系濕邪蘊熱流注經絡所致治者不察當夏令主火仍以四神丸加炮薑烏梅補中湯加吳萸肉果愈服愈劇致頭暈口燥氣墜里迫溺澀肛痛皆火性急速徵據必清理濕熱之邪乃為按脈切理仍當戒飲毋謂六旬外久瀉延虛也四苓散加薏仁車前子麥冬山梔燈心二服已效加神麯砂仁殼枳椇子以理酒傷而瀉稀加黃芩白芍而脈斂後用參苓白朮散加減而痊曹脈左濡右關尺弦大腹鳴則痛墜泄瀉前因怫悒木製脾土為中焦痞痛服破氣燥劑再傷中氣每日晡少腹痛泄下焦陰氣又傷急須甘緩和中佐以溫攝潞參炙草白芍茯苓小茴橘核俱酒焙益智木香俱煨飴糖紅棗十數劑痛瀉止於五泄無不由濕寓居斥鹵水味鹹濁便瀉三年不止凡運脾利濕溫腎補土及升提疏利固澀諸法毫不一效今夏診右脈寸微關滑乃濕中伏熱大小腑清濁不分火性急速水穀傾注無餘脾失輸精肺苦燥渴氣不化液腎不司關所下汙液自覺熱甚或痛泄或不痛亦泄日夕數行口乾溺少時想涼潤略用守補即嫌脹滿可知氣墜全是腑症若清濁分則泄瀉漸已煎方茯苓豬苓車前山梔神麯薏苡大腹皮烏梅黃連午前服丸方益智仁煨補骨脂南燭子訶子茴香茯苓山藥廣皮砂仁半夏曲杜仲首烏蓮子蒸餅為丸晚服至秋漸愈痢症論治痢多發於秋即內經之腸澼也症由胃腑濕蒸熱壅致氣血凝結挾糟粕積滯進入大小腑傾刮脂液化膿血下注或痢白痢紅痢瘀紫痢五色腹痛嘔吐口乾溺澀裡急後重氣陷肛墜因其閉滯不利故亦名滯下也俗以白屬寒赤屬熱不知白傷氣分赤傷血分赤白相間氣血俱傷傷氣分則調氣四七湯木香化滯湯傷血分則和血四物地榆湯或理陰煎加減易老所謂調氣則後重除和血則便膿愈也然論致痢之由其暑濕傷胃者鬱熱居多生冷傷脾者寒滯為甚入手宜分氣陷則倉廩不藏陰亡則門戶不閉由脾傷腎勢所必然故鬱熱者清之芩連芍藥湯寒滯者溫之香砂枳朮丸香砂異功散濕勝者泄之四苓散白朮改蒼朮宿食者消之保和丸積滯者導之小承氣湯熟大黃丸腹痛者和之芍藥湯加木香氣陷下者舉之補中益氣湯虛滑者攝之赤石脂禹餘糧丸脂液涸者潤之豬臟湯阿膠丸久不愈者補而固之八珍湯加炮薑肉桂木香肉果烏梅牡蠣痢止後調之參苓白朮散治法盡此矣而症之寒熱虛實宜細審焉凡痢挾熱者多實初起外受暑熱內因停滯繞臍痛脹煩渴迸迫下痢鮮紅脈洪滑者宜清火導滯導氣湯芍藥湯去桂如挾虛感寒生冷不節脾失轉輸因而嘔逆下痢白膿脈弦弱者宜溫理脾胃兼佐行氣香砂溫胃飲蓋因寒傷臟忌用苦寒下奪也況所痢膿垢皆大小腸脂液所化已非胃腑宿食不得誤認積滯肆行攻下剝削殆盡但見下利血水或如屋漏水即須溫攝黑豆散加苓朮茴香肉果如痢純血鮮紅成塊者多心脾伏熱用黃連白芍丹皮黑梔黑荊芥生地若未止地榆丸其血紫黯稀淡乃陽虛不能攝陰宜溫調其氣非炮姜不治理中湯加木香痢色黑有二焦黑者熱極反兼勝己之化芩芍湯香連丸光如黑漆者為瘀血桃仁承氣湯純下清血者為腸胃風襲胃風湯加枳荊防五色痢乃五臟氣化並傷昔人以為腎損蓋不液不守精室受傷治必益火消陰實脾防水兼理其氣真人養臟湯赤白痢由冷熱不調駐車丸連理湯痢純白乃臟寒氣滑與暴注屬熱不同或如凍膠如魚腦由氣分致病為臟寒滯下先用沉香白蔻木香小茴砂仁次用理中湯加香砂白痢初起裡急後重為濕鬱化熱平胃散加香砂痢稀白肢冷腹痛不已附子理中湯痢清穀裡寒外熱汗出而厥通脈四逆湯先白痢後下膿血者戊己丸先白痢後下鮮血者阿膠四物湯先痢膿血後變青黑雜色腹痛倍常者駐車丸先膿血後變白沫白膿者補中益氣湯加炮薑赤石脂下痢發熱者疏其邪倉廩散腹痛身微熱者和其營小建中湯一種陰虛下血發熱煩渴至夜轉劇者急宜救液存陰阿膠丸阿膠梅連丸黃連阿膠丸下痢漸減津液枯燥肛門澀滯者豬臟湯痢後便秘後重由氣虛下陷者升其陽則陰自降補中益氣湯加防風膿血稠黏挾熱後重煩渴脈洪者白頭翁湯濕熱下痢後重者升陽除濕湯風邪傷衛後重不除者三奇散虛滑而後重者痢後不減真人養臟湯虛滑而腑陽向衰者桃花湯加人參裡急仍不得便屬氣滯蘇子降氣湯裡急頻見汙衣者為氣脫補中益氣湯去當歸加肉果洞瀉不止真人養臟湯下利大孔痛火因瀉陷升其氣則痛自定補中益氣湯噤口痢乃熱氣自下衝上而犯胃口腸中傳導皆逆阻似閉宜人參石蓮石菖蒲竹茹茯苓麥冬粳米丹溪用人參石蓮黃連濃煎加薑汁沖服但得下咽便開如胃虛嘔逆治中湯加丁香肝邪乘脾嘔逆吳茱萸湯加丁香白芍青皮黃連烏梅肉久痢噤口不食非大補胃氣兼行津液不能開香砂四君湯加扁豆薏仁藿香煨葛根粳米得胃氣一醒思食宜獨參湯少加橘皮休息痢屢止屢發經久不愈訶黎勒丸因兜澀太早積滯未清者香連丸加茯苓枳實因飲食失節者香連丸加楂肉神麯因中氣下陷者補中益氣湯因臟寒虛滑者大斷下丸風痢純下青沫蒼朮防風湯寒痢白如鴨溏腸鳴痛墜不甚理中湯訶子肉湯暑痢面垢煩冤燥渴引飲薷苓湯濕痢身重腹滿紅黑混濁除濕湯脾濕血痢蒼朮地榆湯氣痢下如蟹沫氣痢丸疫痢時邪傳染一方相似人參敗毒散加減蠱蛀毒痢血如雞冠烏梅丸蟯蟲痢蟲形極細從穀道溢出以雄黃銳散納下部內服蕪荑丸瘧後痢痢後瘧東坡薑茶飲瘧痢齊發補中益氣湯加減洞瀉不止厥逆附子理中湯胎前赤白痢連理湯加膠艾胎前痢產後未止最危駐車丸伏龍肝湯加減協熱下利由上受溫暑濕熱之邪循募原下陷腸胃或血水或黏膩皆濕熱傳化宜用分消清熱利濕如厚朴黃芩茯苓滑石豬苓澤瀉廣皮扁豆甚則加黃連凡治痢與治瀉異水瀉由清濁不分可利小便痢則邪毒膠滯津液枯澀大忌分利且痢久必傷腎腎陰虧宜滋液黑地黃丸六味地黃丸腎陽虛宜益火如四神丸及沉香桂附益智以腎為胃關開竅於二陰也故痢久先溫脾不應即溫腎丹溪以先瀉後痢為脾傳腎為賊邪難治先痢後瀉為腎傳脾為微邪易愈故治痢以脾腎為要噤口痢由熱氣自下上衝而犯胃口腸中傳導皆逆阻似閉宜清解熱毒如黃連酒炒黃芩白芍石蓮肉廣皮銀花楂肉木香汁又方五穀蟲焙黃研末黑糖拌勻新汲水送下即愈痢症初起有兼外感者身必發熱表裡俱病其症最重宜表裡並治痢疾初起必兼濕熱宿滯宜用治痢散葛根苦參松蘿茶葉麥芽山楂赤芍陳皮研末每服四錢加黃連尤效此方出醫學心悟不論赤白皆效葛根鼓舞胃氣上行也茶葉苦參清濕熱也麥芽山楂消宿食也赤芍陳皮行血調氣也腹痛裡虛者用橘餅半個紅棗十枚沙糖五錢煎湯服立效醫通曰痢後風者因痢後不善調攝或多行或房勞或受風寒或感濕氣致兩腳痿軟腫痛宜大防風湯又痢後變成痛風皆調攝失宜所致宜補中益氣湯加羌活續斷虎骨病機沙篆曰痢起夏秋濕熱鬱蒸因乎天生冷停滯由乎人當炎暑令行不能保攝脾胃多食瓜果肥甘土氣受傷無以制濕濕蒸熱壅氣機阻逆不得宣通因而腸胃反窒裡急後重小水赤澀宜苦寒之藥燥濕滌熱佐以辛溫便能開鬱運氣故行血則便膿自愈調氣則後重自除然虛寒實熱淺深新久之不同難一例治沈朗仲曰痢症初起形氣尚強脹實堅痛者可速去積積去痢止此通因通用症隨痢減之法若煩熱喜冷脈實腹滿或下純紅鮮血者此濕熱內盛法宜清利若經久正傷有傷陰傷陽兩途傷陰者精血脂液悉從痢去多煩躁熱渴之候宜以清潤養其陰傷陽者脾腎元陽悉從痢散多滑脫厥逆之候宜行溫補回其陽總之暴病多實久病多虛滑脫者多寒澀滯者多熱參之脈症合之新久百無一失矣附倪涵初痢疾三方初起煎方黃連去蘆黃芩白芍楂肉各一錢二分枳殼去穰厚朴薑汁炒檳榔青皮去穰各八分當歸地榆甘草炙各五分紅花酒炒三分木香二分桃仁研一錢如法炮製水二碗煎一碗空心服此方治紅白痢裡急後重身熱腹痛者皆宜如痢純白去地榆桃仁加橘紅四分木香三分如滯澀甚者加酒炒大黃二錢服一二劑仍除之若服過一劑滯澀已去不必再服年幼者大黃只用一錢上方用之三五日神效旬日亦效半月後則當加減加減煎方黃連酒炒六分生用四分白芍酒炒六分生用四分楂肉一錢橘紅青皮檳榔各四分炙草三分生用二分當歸五分地榆四分桃仁研粉六分紅花三分木香二分如法制服延至月餘脾胃虛弱而滑泄當補理補理煎方黃連酒炒五分黃芩酒炒六分白芍酒炒四分橘紅六分當歸五分人參五分白朮鹽炒五分炙草五分如法制服以上三方如婦人有胎去桃仁紅花檳榔服一忌溫補早痢起於濕熱蘊積膠滯腸胃宜清熱邪導滯氣行瘀血其病即去若用參術等溫補藥則熱愈盛氣愈滯血亦凝邪何由去一忌大下痢因邪熱膠滯用疏通則愈若用大承氣湯下之膠滯未去徒傷胃氣損元氣耳正氣傷損邪氣不可除壯者猶可弱者危矣一忌發汗痢發寒熱頭目痛眩由內毒熏蒸自內達外非表邪也若發汗則風劑燥熱愈助熱邪正虛於外邪熾於內鮮不斃矣一忌分利痢因熱邪膠滯津液枯澀若用五苓等分利其水則津液愈枯枯澀愈甚纏綿不止第清熱導滯則痢自愈而小便自清安用分利為利小便為治水瀉之良法以之治痢則大乖矣痢症脈