body:
  text: 重鋟本跋醫病易著書難著書易著書而有益於天下後世難先君著類證治裁以數十年之精力搜羅歷代綜覽百家採擇精英折中至當中而不偏簡而能備層層推勘縷析絲分廣大精微靡不包囿實足擴前聖不傳之緒啓後人入道之門而大有益於天下後世者也彼醫籍中或失之涼瀉或失之溫補或失之疏漏或失之浩繁者相去天淵烏可同日語耶咸豐元年付之剞劂八月告成六年兵禍版毀於火迄今二十餘年矣先君之著作文章其可流傳於後世垂法於將來者甚多竟以風霜兵燹散軼無存而是書早付手民遂若神靈呵護貽留至今卒得善本可以重鋟恿慫是舉者謂前日之開雕其力可以至今今此之重鋟其力之貽留不卜而知更遠此非獨是書之幸抑亦天下後世之幸也重鋟之舉又烏可緩哉光緒十年中秋前芝本謹跋
