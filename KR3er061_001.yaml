body:
  text: 皇清例授文林郎先考羲桐府君傳略府君諱珮琴字雲和號羲桐先祖翠岩公次子幼謹願不好戲弄嘗自孰中歸有忤之者怒而色赤翠岩公見之教曰君子所以學為能變化氣質汝坐不解此語耳府君志之終身不敢忘乾隆戊申翠岩公以曾祖父母命視叔祖養三公於武都府君作憶親詩轉憶翠岩公之念曾祖父母也有秦關雪盡增春水漢塞天低望白雲之句公歸見之為淚下方公之歸曉行抵邗上策騾過霜橋蹶而溺沉浮亂流中掣騾尾得出時冬月衣履沾濡行數里始抵逆旅由是感寒嘔噦其明年曾祖志開公病膈噎公設神位空室中伏地祈禱常至夜分及秋反得熱疾竟先志開公卒越數月志開公亦卒家計窘甚府君與叔父紉秋公季父釣磻公從叔西珍公從張斐園先生學而修脯無所出府君慮厪叔祖升儒公憂乃攜釣磻叔父館於鄰村紉秋叔亦館村孰為西珍叔父課讀伯父輯五公助升儒公經理家政俄而伯父亦以瘵卒所得館穀絲粟悉歸升儒公胡希呂學院歲試府君以第二名入縣庠諸叔父亦相繼遊庠嘉慶戊辰恩科鄉試府君中式經魁人謂吾祖孝行食報之始云府君湛深經術為文苦心融煉務去陳言每屬稿成弗愜輒棄去更草如是數四不厭為生徒點竄課作亦一字不苟或病其典重謂於場屋風氣非宜笑應曰詎有是耶性沉潛書史一寓目輒已默識所屋室躬自灑滌几席無纖塵獨坐晏如足迹罕履城市己巳禮闈報罷旋歸先有訛傳中途被盜劫者祖母鄒太孺人大憂因是終祖母之身不與會試丙子八月祖母卒先兄舫溎先一月殤道光甲申先兄偉堂暨先姊三姑相繼歿府君嘗自言獨居循省萬念都盡丙戌歲親友謂府君當預挑選迫促登程行至固安渡桑乾值大風雪太息作客路吟謂此生不宜再慕虛名渡河而北也蓋自己巳至丙戌始再入都然已大非府君意矣初志開公嘗以手録方書付府君曰後日習此可以救世府君讀之有省因遂博觀靈素以下諸名家書窮日課生徒舉業燈下披閲方書以油盡為率凡數十年以疾就者皆急之起奇疾甚多其有證非不治卒遷延至死者雖年久仍恨之以語兒輩因嘆世俗之多誤治也思有以正之丙戌自都中歸始令就醫者還所服方擇其要者著為醫案前列證論題曰類證治裁丙申夏患熱疾幾殆冬月復病咳喘精神大衰惟眼獨明於未病先作小行楷無須眼鏡喜曰此天助我成此書也為之愈恐不及己亥春咳喘益劇自知不起而深以治裁書未成為憾實則所撰凡三十萬言分八卷列證一百一十有奇內科可稱大備床褥間自制書序及凡例命芝本録之自謂如春蠶到死絲方盡也嗚呼傷哉府君孝愛仁慈篤於骨肉之誼而閔凶夭折所以處之獨難擴乎同仁之情而淡泊貞廉所以取於世至約隱居懷道以著述自娛行誼文章卓然可師表後進不肖芝本學行無似邀志銘以光泉埌大懼先業遂就湮沒謹撰次其略俟後世君子樂闡幽德者採焉府君所著四書文及詩古文詩餘十餘卷類證治裁八卷均皆手訂府君生於乾隆壬辰十月初六日卒於道光己亥六月十六日享壽六十有八配吾母薛氏生不肖三人長偉堂次舫溎先府君卒次即芝本女一字眭亦早卒孫五人嵩慶嵩庰嵩福嵩庚嵩鶖皆業儒男芝本泣血謹述賜同進士出身知江蘇蘇州府事年愚弟桂超萬頓首拜填諱凡例一醫籍浩如煙海求其搜羅賅備分析詳明莫如準繩一書茲編務期簡括俾觀者豁目爽心故徑途各出一仲景傷寒宜參各家辨論茲但取醫學心悟數條不能備載一春溫夏熱兩症多伏氣傷寒邪從腎出此即經所云冬傷於寒春必病溫冬不藏精春必病溫者也與口鼻吸入之邪伏於募原淺深異治學者當分別觀之一時疫症張景嶽既失之溫補吳又可又但主急下張氏醫通揭明地氣鬱蒸一義最宜參究一香岩葉先生所傳臨症指南案隨診立不暇修飾然如脾臟胃腑歷來混治先生獨因經旨喜燥喜涼悟出臟主守腑主通二義論東垣補中益氣治在脾仲景急下存陰治在胃何等超妙即如不食一症粗工但知燥脾愈燥愈結先生獨議養胃陰遵治輒驗此類皆素所服膺一肝風眩暈與類中風相近原可併為一門茲依指南例另為拈出意在醒目一目喉乳俱系專科病症治法繁瑣不能備輯茲但撮其要一各症宗經立論酌古用方列綱分目皆層層推勘而出但方中品味未能一一商訂皆垂暮精神不能周浹之故閲者諒之一論中於精要處用提綱處用俾閲者得其意旨一目瞭然一方名重復者則不注藥味但書見某卷某症至於方名同而藥味不同者則仍載原方一外科另屬一門今附論數篇列於卷末俾閲者略知要領
