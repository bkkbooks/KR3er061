seq: 1
front:
  text: 序醫之為道必其人有中和仁智之德而又洞乎陰陽之理性命之源寒暑異宜南北異稟之故沉潛焉以察其微反復焉以窮其變而後能消疵癘益虛孱以平造物之憾此治病之道昔人所以謂通於治國與丹陽林君雲和與余同舉戊辰鄉試訂交於京師既而別去不相問者三十餘載丁未冬君之子芝本攜君所輯方書曰類證治裁者乞序於余始知君之亡亦且八載矣君直外方內治學有根柢己巳禮闈報罷退而學醫活人甚多術既益精而病世之業醫者空疏不學或又拘於成法以蹈偏駁失中之弊於是彙輯古方別裁至當蘄與人人共明之嗚乎其用心若此可不謂中和仁智之君子乎余固瞢於醫於養身濟世之術未之有得春官十上幸獲通籍而衰態遽侵今茲待罪吳趨當時同榜中如顧耕石諸君均先朝露無可與語回首今昔益信窮達一致勞勞於仕宦而以隳其所業曾不若君之窮居著述猶得就一藝以自名此則序君書而不能無慨於中也至於是書之蘊足以抉陰陽而托性命後之讀者當自得之且已詳於君所為序故不贅述云道光歲次丁未十月知江蘇蘇州府事年愚弟桂超萬拜撰序先祖大銀臺謂崖公於乾隆間奉命總閲四庫全書獲見神農以來醫家言著録於文淵閣者九十六部一千八百十有三卷附存其目者九十四部六百八十一卷嘗語穎曰舊史醫家多置之簡末今四庫全書子部分十四家儒家第一兵家第二法家第三農家第四醫家第五醫雖一技民命攸關其特升諸他藝術上有以也謂崖公博涉於陰陽術數六壬聲律之書手録甚夥獨醫類無手定本家傳唯先大夫淡松公批訂葉氏臨證指南手澤猶新顧穎卒未能讀也林羲桐先生嘉慶戊辰舉鄉魁墨藝膾炙人口尤精岐黃家言貫串於靈樞素問難經諸書以意為變化而不泥於古著作之暇以濟時為心士大夫皆禮敬之余久耳其名丙戌余服闋入都謁部先生公車北上相晤于都門獲聞緒論盛德君子一望皆知辛亥春嗣君筠石茂才將刊先生所著類證治裁書而以序囑余書凡八卷外科附焉別類分門前列論方次之殆與沈氏尊生書體例略相近然詳略輕重之際妙於剪裁開卷瞭然言彌簡而法彌備使夫穎悟之士既得所範圍中材而下亦得循途以赴學者固當分別以觀矣昔人論難經本義謂滑壽以文士而精於醫故所著較諸家所得為多豫於先生亦云筠石嗣其先業揆度其恆無不立效叩其所學蓋得於是書成法者多顧不肯私為家傳而公諸同好其能體先生濟時之心者矣先生所著有來燕草堂四書文五百餘篇來燕草堂古文二卷駢體文二卷高臥樓古今體詩二卷百鳥詩一卷詩餘一卷皆余所服膺者筠石倘能次第開雕以昭先澤是又余之厚望也夫咸豐元年歲次辛亥孟夏之月賜進士出身誥授奉直大夫四川會理州知州同里愚弟吉鍾穎頓首拜撰時年八十有五序先伯父羲桐先生以制舉之學著聲藝林垂六十年學者覽其遺文望洋而嘆意謂先生畢生之精力殆竭於此而弗暇以他及而不知自其少壯喜讀方書五色奇咳術隨年進洎乎手訂治裁書一志殫心與老病相終始固自有不朽之業而如是乎身心以之者在也今夫方伎之事寖久失傳則益肆為鄙誕以相煽惑獨醫學以切於民生日用理近而事常得以相緣於勿替自仲景著方後賢纘而衍之湯液之功遂加於針石未可謂所傳之不永矣然而玉版真言靈蘭祕典儒者弗問醫亦舍旃證若繭絲法同射覆所施失當視他方伎為禍尤烈則豈非不學之咎哉然且果於自信率其謬誤出應人急籲可悲矣先生熟精靈素之言因遂博觀仲景以下諸名家書既已窮極源流然猶深自韜晦遊迹所至有主賓數年無識其能醫者里居日久數察奇恆聲譽所歸丐請至莫可卻則慨然以生人自任羸童貧叟匍匐偕臻靡不樂效其術乃至富家大族介其所親延緣造請輒十不一二應曰彼豈借僕生之者其不屑於應酬如此是書稿凡數易嘗語植本曰著書貴適於用吾年老且用吾術生人固不盡吾書成庶救時之心與無終極耳又曰近世名家著述其號為集大成者卷帙繁富學者恆憚於誦習又或主辨析名理治法弗取其備中材之士亦無由就一人一證而悟其全吾書務言簡意賅使人開卷瞭然而已嗚乎此殆即先生晚年刊落浮華粹然有用之言乎植本愚懵無識於先生著述精意不能有所闡發第就先生勤於學術而慎於用術之實以及當時辟咡之言涉是書者著於篇俾讀者有所據以考焉先生生時子芝本方習科舉先生未嘗授以醫及卒而求醫者謂當有異聞仍踵相接不得已循是書成法以應求者而所投輒驗所以勉勉於是刻者又豈徒存先人手澤之意云爾哉時咸豐元年歲次辛亥端陽前二日侄植本謹撰重鋟類證治裁序同治間余守潤州後又承乏江寧林生嵩鶖至署來謁蓋余守潤州時所取士也出其先祖羲桐先生醫書一册乞序於余書固有餘先師薌畦吉君原序先生與余師素號神交知先生以經濟之學郁不得志沉潛泛覽於古來之醫集抉其精英以為是書卓然必傳於後無疑也余疏於藝術醫學一道概未有知而勞勞仕官捧檄東西竊以牧民之道其通於醫術者為生告之當亂離之後民生凋蔽培植之政猶醫之急補元氣也姦民猾吏非種必鋤猶醫之滌瑕蕩穢不遺餘力也政治之施行必求其利害之所在猶醫之分經分絡不得妄施藥石也其他正治從治之法君臣佐使之宜虛實損益之故調和血氣燮理陰陽良醫之於病亦猶良吏之於民昔人所以謂治病之道通於治國也使先生當日幸獲通籍出經濟之學以治民當有更傳無窮者乃先生以大用之才為緒餘之見閲是書者咸謂先生惜不知士生一世只求有益夫生民治病治民其揆一也今先生之醫術傳先生之經濟不因是深人想象歟既為生告之遂書之以為序同治十三年知江寧府知府事天門鶴莊蔣啓勳拜序序昔人有言不為良相便為良醫醫蓋所以寄死生而托性命者也夫豈可漫言為哉必於天地化育之機參贊焉而不悖陰陽往復之理洞徹焉而靡遺而又於靈樞素問內經難經諸書及夫張仲景諸大家名言深求之以通其變精思之以會其微博觀約取觸類旁通平時先具灼見臨症別有主裁而後能沉疴頓起疵癘潛消登斯世於仁壽之場泯造物以不平之憾此醫之為道類非膚淺者所能窺其奧旨歟咸豐丙辰年間余避亂浙垣獲類證治裁一書取而閲之反復而詳辨之見其理明辭晰言簡意賅論證施治無不根柢聖經發揮精義首列別類分門次及附方醫案條貫詳明絲分縷析令人開卷瞭然蓋取法於古而不泥乎古自有得心應手之妙豫於醫道自揣未能竊嘆世之業醫者大都師心自用隨意揣摩甚且高自位置不輕示人每見窮鄉僻埌之所藜藿單寒之家有恙霑體無力求醫聽其不藥自愈詎知藥弗瞑眩厥疾弗瘳始則抱病纏綿終乃釀成莫救良可慨也於是欲將此書廣為傳布奈原版未獲印刷無從爰不惜工資重付剞劂俾購是書者得病尋方因方治病其於養生濟世之術不無小補云時同治丁卯六年孟夏月崇仁謝希昉旭初氏識自序司命之難也在識證識證之難也在辨證識其為陰為陽為虛為實為六淫為七情而不同揣合也辨其在經在絡在腑在臟在營衛在筋骨而非關臆度也顧脈理易淆洞垣誰屬賴古作家別類分門條列治要且於一症錯綜疑似縷析絲分參合脈象詳哉言之仰見心裁獨出矣然不先窺內經奧旨則皆無本之學也遂古聖人盡己性盡人性參贊元化仁壽斯民其心法備載靈素各八十一篇自越人祖述心法垂為難經嗣後長沙論傷寒分究六經河間治溫熱專主三焦東垣倡益氣補中丹溪創滋陰降火濟偏補缺要皆上闡經訓下啓法門卓然自成大家由有明迄今諸名家亦無不根柢聖經發揮心得以著於篇學者研經旁及諸家泛覽沉酣深造自得久之源流條貫自然胸有主裁第學不博無以通其變思不精無以燭其微惟博也故腕妙於應而生面別開惟精也故悟徹於元而重關直闢平時灼有定見臨證不設成心診畢矣審用何法法合矣選用何方權衡乎稟之厚薄病之淺深治之標本藥之浮沉及一切正治從治上取下取或上病取下下病取上或從陰引陽從陽引陰必先歲氣無伐天和乃知執一者拘多歧者泛師心者愎隨俗者庸至於體貼病情曲折都盡刀圭所授立起沉疴善矣若猶未也一法未合雖古法宜裁一方未純雖古方宜裁必吻合而後已此其難殆又在識證辨證後乎乃觀近日懸壺家大率學殖荒蕪心思膚淺甚則治溫疫以傷寒法治血枯以通瘀法與夫喜行溫補不顧留邪動輒攻消不知扶正輕者重重者死矣豫思矯而正之己巳計偕後歸而就館筆墨少間爰始搜輯丙戍後又苦南北奔馳今老矣分編討究懼有遺珠除傷寒全帙無容贅衍外余多宗經立論酌古用方更欲略輯瘍科兼及幼科而老病浸尋來日苦短缺略之憾統俟續成且生平本不業醫間有治案附於症後非云程式也聊存梗概以寓別裁之微意云爾編名治裁願與有志醫學者共裁之道光十九年歲次己亥端午日丹陽林珮琴自題
