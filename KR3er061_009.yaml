body:
  text: 卷之七腸鳴論治腸虛則鳴寒氣相搏或火激其水腸亦鳴經曰中氣不足腸為之苦鳴宜六君子湯加炙耆或補中益氣湯又曰脾虛則腹滿腸鳴飧泄食不化香砂六君子湯加神麯又曰腸中雷鳴上衝胸邪在大腸半夏瀉心湯又曰土鬱之發腸鳴而為數後平胃散加茯苓半夏木香又曰熱淫所勝病腹中腸鳴氣上衝胸葶藶木香散如臟寒有水理中湯加桂苓車前胃寒泄瀉智半湯下氣暫止復鳴益中湯火激動其水二陳湯加芩連山梔附方氣虛六君子湯見一卷中風升舉補中益氣湯見一卷中風飧泄香砂六君子湯六君子湯加木香砂仁胸痞半夏瀉心湯見一卷溫土鬱平胃散術樸陳草熱淫葶藶木香散二苓術澤桂為五苓散再加葶藶木香木通滑石甘草臟寒理中湯參術姜草泄瀉智半湯益智仁半夏各五分蒼朮四錢防風二錢術芍苓各一錢加姜煎下氣益中湯參術芩連姜枳草動痰二陳湯陳夏苓草大小腸癰論治小腸在臍之左關元穴屬小腸患癰則左腿不能伸大腸在臍之右天樞穴屬大腸患癰則右腿不能伸部位雖分為病相似治亦略同故金匱千金概名腸癰也其症小腹痞腫按之痛小便數似淋發熱時自汗出復惡寒身皮甲錯腹皮急如腫狀脈遲緊者膿未成可下之桃仁承氣湯脈洪數者膿已成大黃牡丹湯膿從瘡出或有出臍者惟大便下膿血者自愈按小便數似淋或小便出膿血者為小腸癰大便出膿血者為大腸癰膿從臍中出者為盤腸癰多不治此症總因濕毒瘀血結滯腸內而成其始發熱惡寒小腹滿痛反側不便或腿縮難伸即腸癰確候其腹皮急按之濡不煩渴者屬陰寒牡丹散內托十宣散其小腹痞堅按之痛而煩熱者屬結熱大黃牡丹湯或脈遲緊則膿尚未成急解毒通腸飲或大黃煎若脈滑數則膿已成宜排膿太乙膏排膿散如脈洪數小腹脹痛不食溺澀為膿壅滯宜疏通薏苡仁湯排之有瘀血小腹硬痛四物延胡湯若腹濡痛時下膿由元氣虛宜排膿藥中兼補益丹皮散或潰後痛甚淋膿不止由氣血大虧須峻補參耆地黃湯凡患腸癰者不可驚驚則腸斷而死坐臥轉側宜徐緩飲食不宜過飽庶可保生腸癰脈候腸癰之脈滑而數滑則為實數則為熱滑則為營數則為衛衛數下降營滑上升營衛相干血為敗濁脈經關內逢芤腸里癰脈訣附方未膿桃仁承氣湯見一卷疫膿成大黃牡丹湯大黃芒硝各一錢半栝蔞丹皮桃仁各二錢半一方有冬瓜仁服下有膿即出無即下血寒症牡丹皮散參耆苓丹薏芷歸芎天麻桃仁各一錢官桂甘草各五分木香三分寒症內托十宣散參耆歸芎防芷桔樸桂草為末調以酒下三錢未成通腸飲忍冬藤歸尾角刺花粉乳沒芷薏草或用黃占礬為丸未成大黃煎大黃朴硝各一錢丹皮白芥子桃仁各二錢下後以參耆補托已成太乙膏見六卷胃脘痛潰後排膿散耆歸防芷蔞翹草銀花甲片各一錢膿滯薏苡仁湯薏苡蔞仁各三錢丹皮桃仁各三錢血瘀四物延胡湯當歸延胡各一錢芎芍生地各五分桃仁紅花牛膝各七分水煎峻補參耆地黃湯參耆苓地丹萸肉山藥姜棗腸癰脈案李氏寒熱脈數少腹左偏痛引內膕數日一更衣左足不伸此小腸癰也蓋小腸火腑由氣血壅滯經隧發為癰毒宜先徹其在裡瘀熱則痛勢緩而癰內消用大黃三錢硝石一錢歸尾錢半赤芍二錢桃仁一錢數服痛減次用乳香甘草節金銀花連翹當歸木瓜薏米牛膝數服而消疝氣論治疝氣者小腹墜痛控引睪丸見症於肝而原於任脈故經謂任脈為病男子內結七疝女子帶下瘕聚任起中極之下上毛際循腹裡上關元故疝為任病瘕聚即婦人之疝也經言七疝沖狐厥㿗瘕㿉癃也經云從少腹上衝心而痛不得前後為沖疝言氣上衝心二便不通能上而不能下木香散又云肝所生病為狐疝言臥則入腹立則入囊仲景用蜘蛛散後人用二香丸又云黃脈土脈之至也大而虛積氣在腹中有厥氣名曰厥疝言脾受肝克氣逆上升寶鑑當歸四逆湯苦楝散又云三陽為病發寒熱其傳為㿗疝言小腸膀胱之邪傳為㿗疝囊丸腫大如栲栳頑痹不仁三層茴香丸荔枝散又云脾傳之腎病名疝瘕少腹冤熱而痛出白言脾失運化而傳於所勝則瘕聚成形痛出白淫烏頭梔子湯加橘核桃仁吳萸又云足陽明之筋病㿉疝腹筋急又云肝脈滑甚為㿉疝言肝木乘胃或至潰膿下血荔枝橘核湯橘核散又云腎脈滑甚為㿉癃又云厥陰之陰盛脈脹不通為㿉癃疝言內里膿血外小便閉加味通心散此內經所謂七疝也金匱論疝者主寒至巢氏分厥厥逆心痛症氣積如臂寒食冷腹痛氣乍滿乍減盤臍旁作痛腑臍下有積狼腹痛引陰大便難七疝張子和非之別列寒水筋血氣狐㿗七種謂諸疝不離乎肝以肝脈絡陰器故也其曰寒疝囊冷如石陰莖不舉寶鑑當歸四逆湯水疝囊如水晶濕癢出水加味五苓散去朮或腎氣丸筋疝莖痛筋急或挺縱不收龍膽瀉肝湯血疝狀如黃瓜在小腹兩旁復元通氣散氣疝上連腎下及囊因怒氣脹氣疝飲狐疝㿗疝治同前丹溪云自素問而下皆以疝為經絡有寒收引則痛不知始由濕熱壅遏在經又感外寒濕熱被郁不得疏散故痛蓋醉飽則火起於胃房勞則火起於腎大怒則火起於肝大勞則火起於筋火鬱濕生濁液凝聚進入血隧流於厥陰肝性急速為寒所束宜其痛矣宜枳實桃仁山梔吳萸山楂生薑若濕勝成㿗疝加荔枝核痛甚加鹽炒大茴香痛處可按加桂士材論寒則多痛熱則多縱濕則腫墜虛亦腫墜在血分者不移在氣分者多動皆足補前人所未備今按疝症初起必由虛寒勞力致之積久腑絡阻痹遂聚濕熱用藥不離辛泄苦降以肝司疏瀉也其觸寒驟痛兼犯生冷用荔香散若火注陰分而為熱痛必有熱症熱脈或便閉渴煩宜大分清飲若食積疝痛近臍必有塊梗起立效散瘀血疝痛在腹必有形不移金鈴子散加桃仁五靈脂因怒動肝脅脹必墜入腹宜木香青皮山梔香附歸鬚青蔥管舉重傷力氣虛必下穿囊舉元煎加法火腑留邪內行苦泄胃苓湯加枳殼山梔黃柏腎囊流濕外用湯熏以蛇床子川椒熟礬煎湯熏洗再用灶心土炒熱加川椒小茴末拌勻絹袋盛安腎囊下冷則易之氣聚絡虛理須疏導宜延胡山甲木香歸鬚小茴蘆巴橘核等胃虛濁逆法在溫通宜乾薑吳萸茯苓木通草豆蔻房勞疝發溫攝下元宜杞子沙苑子菟絲子茯苓鹿角膠蓯蓉當歸筋結疝㿗治同木腎宜穿山甲全蠍木瓜萆薢茯苓歸尾乳香白芷酒糊丸鹽湯下少腹偏墜散結為先香橘散加穿山甲或穿山甲茴香研末酒調下陰丸腫大逐濕可效荔枝核十枚煅研火酒調如糊服效別有小腸氣名曰氣㿉痛引腰臍天台烏藥散膀胱氣名曰水㿉不得小便加味五苓散又如奔豚響疝是氣水衝突下焦丹溪用理中湯去朮加桂心茯苓或一捏金散或木通川楝各一錢茴香五分飛鹽酒調服丹溪云桂能泄奔豚茯苓能伐腎邪苦白朮則助土剋水燥腎閉氣故宜去之凡㿗兒疝睪丸偏腫由啼哭動傷陰器導氣湯或用全蠍一錢核桃肉一兩蜜丸彈子大日一丸大約疝氣上攻者宜吳萸桂心枳殼茴香茯苓等下墜者宜川楝子香附橘核木香葫蘆巴等按之大痛者為實宜楂肉延胡青皮枳實桃仁牛膝等不痛者為虛宜參苓歸杞韭子核桃等痛處寒者必寒積宜川烏胡椒官桂沉香小茴乳香等痛處熱者必濕熱宜山梔川楝木通茯苓橘核蒼朮厚朴黃柏等莖縮者宗筋受寒宜虎潛丸去知柏或鹿茸沙苑子蓯蓉補骨脂韭子等腎疝者客邪在腎酒煮當歸丸卵大小上下不常者屬氣分聚香飲去肉桂囊腫脹堅頑不移者屬血分橘核丸若結硬者加朴硝蓋疝之上攻者沖病下注者任病偏墜者小腸病閉癃者膀胱病卵㿉出白者腎病余則筋急囊腫瘕聚濁逆肝胃病為多日久沉痼虛滑正氣陷邪氣留行立穿囊頑不知痛下焦路遠藥力難到遂成宿疴迄乎無子丹溪云不痛斷房事及厚味不可治信夫疝氣脈候心脈搏滑急為心疝肺脈沉搏為肺疝腎脈肝脈大急沉皆為疝肝脈滑甚為㿉疝心脈微滑為心疝腎脈滑甚為癃㿉脈急者曰疝瘕小腹痛內經疝瘕積聚脈弦急者生虛弦小者死脈經寸口脈弦而緊弦緊相搏則為寒疝正傳脈弦急搏皆疝弦數宜清熱弦緊宜溫經兼浮宜汗兼實宜下弦細為寒濕弦濡為濕熱醫通附方沖疝木香散木香陳皮良薑訶子乾薑枳實各一錢半草豆蔻黑牽牛川芎各一錢水煎狐疝蜘蛛散蜘蛛十四枚微炒桂心五分為末每服一錢白湯下狐疝二香丸木香香附各三兩楂肉二兩三稜蓬莪朮醋炒薑黃南星各一兩黃連炒吳萸橘核桃仁山梔各五錢薑汁糊丸厥疝寶鑑當歸四逆湯歸尾七分附子官桂茴香柴胡各五分白芍四分延胡川楝子茯苓各三分澤瀉二分水煎厥疝苦楝散木香川楝子巴豆拌炒去巴豆茴香鹽炒等分為末每服二錢酒調下厥疝蟠蔥散蒼朮甘草各一錢三稜莪朮茯苓青皮各七分丁香砂仁檳榔各五分延胡肉桂乾薑各三分共為末加蔥白一莖煎㿗疝三層茴香丸大茴香鹽拌炒川楝子去核炒沙參木香各一兩為末水煮米糊丸桐子大每服三錢空心鹽湯下日三服服完接服第二層此名第一層第二層前方加蓽茇一兩檳榔五錢丸法如前再不愈接服第三層第三層即前二方加入茯苓四兩川附一兩丸法如前此方雖數十年之久陰囊腫大如升如斗甚者大如栲栳服之皆可除根㿗疝荔枝散荔枝核十四枚燒灰沉香大茴香炒木香青鹽食鹽各一兩川楝子小茴香各二錢為末每服三錢酒調下㿗疝蠲痛丸延胡一兩川楝肉茴香各五錢白醜頭末當歸良薑青皮木香烏藥各二錢半全蠍七個薑汁糊丸燒棉灰調酒送下瘕疝烏頭梔子湯川烏頭炮梔子炒各三錢水二鍾煎服㿉疝荔枝橘核湯荔枝橘核桃仁山楂延胡苓朮枳草㿉疝橘核丸見三卷肝㿉癃加味通心散瞿麥木通芩梔翹枳草川楝歸尾桃仁山楂等分為末燈芯煎水疝加味五苓散豬苓茯苓白朮各一兩澤瀉八錢茴香四錢肉桂錢半為末每服四錢加鹽八分水煎日三服水疝腎氣丸見二卷虛損筋疝龍膽瀉肝湯見三卷諸氣血疝復元通氣散見六捲心痛氣疝氣疝飲黃連二錢用吳茱萸煎水浸炒人參白朮各一錢白芍陳皮各七分甘草三分姜三片熱疝大分清飲見四卷泄瀉食積立效散見六卷腹痛瘀血金鈴子散見三卷郁氣虛舉元煎見三卷飲食濕熱胃苓湯見一卷中風偏墜香橘散見六卷腹痛小腸氣天台烏藥散川楝子十個巴豆同炒烏藥木香茴香良薑青皮各五錢檳榔三錢為末每服一錢酒下奔豚理中湯見一卷中風奔豚一捏金延胡川楝肉全蠍茴香等分研末每服二錢酒下兒㿗導氣湯見三卷積聚莖縮虎潛丸見一卷中風腎疝酒煮當歸丸當歸附子炮茴香各一兩川楝子酒煮去皮核五錢上四味以酒三升煮酒盡焙乾入丁香木香各三錢延胡一兩全蠍十四個為末酒糊丸酒下氣分聚香飲乳香沉香檀香藿香木香丁香各八分薑黃烏藥桔梗肉桂甘草延胡各四分姜三片棗二枚久疝香楝散石菖蒲青木香荔枝核川楝肉萆薢每末二錢入麝香少許茴香鹽炒研末同熱酒沖調服疝氣脈案李疝病不離乎肝然經謂任脈為病男子內結七疝女子帶下瘕聚皆奇經主之宿病不理奇脈病結不解今觸寒輒發動氣有聲痛引睪丸宜導滯通絡仿茴香丸小茴橘核葫蘆巴延胡俱酒炒當歸鹿角膠和丸酒下效王由吞酸傳為少腹偏墜囊腫丸痛夫酸為肝鬱氣注下為疝皆濕熱之邪經云邪客於足厥陰之絡令人卒疝暴痛以肝脈絡陰器也子和治疝用金鈴子散泄肝導逆與此頗符用吳茱萸川楝子橘核茯苓青皮延胡青蔥管木通數服而安趙疝發自下衝上猝痛下引睪丸此七疝中衝疝也經言督脈生病從少腹上衝心而痛不得前後為沖疝用山梔川楝子去核酒炒荔枝核橘核延胡俱酒焙當歸赤苓降香夫暴疝多寒久疝多熱異熱疏滯腫痛自已王腹左偏墜睪丸腫痛寢息略定乃舉重勞力所致蓋肝脈絡陰器絡虛努掙氣穿入囊延久則成筋疝古人治疝必用辛香流動之品以肝得疏泄其痛乃緩服藥兼宜節勞香附鹽制升麻小茴香橘核延胡酒焙絲瓜筋薏米長流水煎二服愈呂因勞偏墜脈軟弱少年宿疴補以升之潞參三錢鹿角霜炙黃耆當歸杜仲熟地杞子焙各二錢升麻六分橘核酒炒續斷各錢半薑棗煎十服效淋濁論治腎有兩竅一溺竅一精竅淋出溺竅病在肝脾濁出精竅病在心腎同門異路分別宜詳內經論淋由於脾濕鬱熱病源謂腎虛則小便數膀胱熱則水下澀數而且澀則淋瀝引痛凡小腸有氣則小便脹小腸有血則小便澀小腸有熱則小便痛症有五石淋勞淋血淋氣淋膏淋也石淋系膀胱蓄熱溺則莖中急痛頻下沙石如湯瓶久受煎熬底結白鹼也宜清其積熱滌去沙石水道自利神效琥珀散如聖散石淋初起宜石膏滑石琥珀木通或加味葵子散蓋重則為石輕則為沙二神散勞淋有二因思慮煩憂負重遠行勞於脾者補中湯加車前澤瀉專因思慮者歸脾湯因強力入房勞於腎者生地黃丸加麥冬五味子老人精衰入房溺澀腹脹牽引穀道者腎氣丸血淋熱甚搏血失其常道以心主血與小腸為表裡血滲胞中與溲俱下須辨血瘀血虛血熱血冷如小腹堅莖痛脈沉弦而數者為血瘀雞蘇散或四物湯加牛膝丹皮木通脈虛弱者為血虛六味丸加側柏葉車前子白芍八珍湯送益元散如血色鮮紅脈數有力心與小腸實熱也大分清飲加生地黃芩龍膽草如血色黯淡面枯白尺脈沉遲者腎與膀胱虛冷腎氣湯血淋小腸熱甚者牛膝山梔生地犀角藕節車前子血虛熱者生地三兩黃芩阿膠各五錢柏葉少許血淋莖中痛淡秋石宜之或服薏苡根汁或日用黃繭絲煮湯服氣淋氣化不及州都胞中氣脹少腹滿痛溺有餘瀝沉香散瞿麥湯如氣虛八珍湯倍茯苓加杜仲牛膝氣虛下陷補中湯膏淋便有脂膩如膏浮於漩面此腎虛不能約制脂液而下流也海金沙散鹿角霜丸菟絲子丸大沉香丸膏淋溺不痛者須固精六味合聚精丸有熱淋莖中痛者導赤散加滑石燈芯莖不痛而癢者八味丸去附子溺艱澀如淋不作痛為虛六味加鹿茸肉蓯蓉老人氣虛成淋補中益氣湯又有寒客下焦水道不快先寒戰而後溲便由冷氣與正氣爭則寒戰成淋正氣勝則戰解得便是為冷淋腎氣丸肉蓯蓉丸有過服金石入房太甚敗精瘀隧而成淋者海金沙散有濕痰滲注而成淋者滲濕湯有淋而小腹脹甚者滑利通陽韭白汁小茴桂枝歸尾兩頭尖牛膝婦人產後成諸淋者白茅湯不論石膏淋皆治以上淋症治法此外有風寒濕客於胞中氣不能化胞滿而水道不通按之內痛而澀者為胞痹腎著湯腎瀝湯亦溺竅病也至赤白濁由心動於欲腎傷於色強忍不泄敗精流溢竅端時有穢物如瘡之膿如眼之眵淋瀝不斷由精敗而腐居多亦有濕熱流注而成者須分便濁精濁濁在便者色白如泔乃濕熱內蘊由過食肥甘辛熱炙爆所致苓朮二陳煎或徙薪飲濁在精者相火妄動或逆精使然至精溺並出牛膝赤苓黃柏遠志細生甘草或血不及變精乃為赤濁遠志丸加味清心飲當分精瘀精滑精瘀者先理其離宮腐濁古方用虎杖散繼與補腎六味丸精滑者乃用固攝秘元煎菟絲煎濁久而滑則任督脈必傷須升固奇經青囊斑龍丸或鹿茸龜甲杞子核桃杜仲補骨脂沙苑子茯神大法夾寒者脈遲萆薢分清飲內補鹿茸丸夾熱者脈數清心蓮子飲二苓清利飲濕痰流注者蒼朮二陳湯心經伏暑者四苓散加香薷麥冬人參石蓮或導赤散小便如常少頃澄濁在底或如米泔色者萆薢分清飲稠黏如膠莖中澀痛者腎氣湯去桂附積想心動煩擾傷精者加味清心飲瑞蓮丸腎虛氣下陷者補中湯以上濁症治法此外有溺血症其原由於腎虛無比山藥丸去巴戟蓯蓉加阿膠丹皮麥冬赤芍非如血淋因乎濕熱但以痛不痛為辨痛為血淋不痛為溺血也有白淫症經言思想無窮所願不得意淫於外入房太甚發為筋痿及為白淫宜降心火半苓丸清心蓮子飲又精傷白濁小便推出髓條痛不可忍者乃由房事失節宜使出髓條方凡此皆精竅病也諸淋皆腎虛膀胱生熱故小水澀而不利也治法初起宜清解結熱疏利水道通用五淋散加藕汁不用補澀淋而渴屬上焦氣分宜淡滲輕藥如茯苓通草燈心瞿麥澤瀉琥珀車前子之類清肺氣以滋水之上源淋而不渴屬下焦血分宜味厚陰品如知柏滋腎丸滋腎陰以泄水之下流如肺燥不能生水者生脈散加減心火及小腸熱者導赤散肺脾積熱移於膀胱者黃芩清肺飲腎水虧小便赤澀者加減一陰煎沙淋膀胱澀痛者牛膝湯加秋石勞淋脾腎不足者朝用補中益氣湯夕用六味丸血淋莖中熱痛者淡秋石泡湯溺澀不痛者一味琥珀末薄荷燈芯湯調服氣淋臍下妨悶木香沉香枳殼甘草梢滑石木通膏淋乃精溺並出精塞溺隧故小便澀痛初用海金沙散加茯苓若不痛須攝固其精勿與通利宜鹿角霜菟絲子蓮鬚山藥芡實後以六味丸合聚精丸調補冷淋寒客胞中欲溺先發寒慄腎氣丸加鹿膠沉香熱淋溺赤如血而少時煩渴者導赤散伏暑成淋六一散虛者生脈散因怒致淋宜青皮山梔沉香木通等因思慮成淋歸脾湯暑月汗多津液不降參澤湯妊婦病淋葵子湯赤白濁莖中熱痛如火灼刀割溺濁或赤或白赤傷血分白傷氣分也赤濁有溺赤有血赤其純見鮮血當從溺血條治法見前論若溺色黃赤固多火症然必赤而痛澀兼見火脈方可清利若勞倦傷中氣酒色傷腎陰溺短欠而無痛澀等症則系水虧液涸不可清利經所謂中氣不足溲溺為之變但滋補下元氣化則水自清加減六味丸鹿茸地黃丸白濁有濁在溺者白如泔漿此濕熱內生有濁在精者由相火妄動精離其位不能閉藏與溺並出或移熱膀胱溺孔澀痛皆白濁之因於熱也久之則有脾氣下陷土不制濕而水道不清者有相火已殺心腎不交精滑不固而遺濁不止者皆白濁之因於虛也熱者當辨心腎而清之虛者常求脾腎而固之舉之溺濁如泔為胃中濕熱下流二陳湯加萆薢黃柏澤瀉薑汁精濁如膏乃精溺並出澀痛甚者先清火抽薪飲久則澀痛去精濁未止宜固攝固陰煎元菟丹胃中濕熱濁痰下滲膀胱為溺濁與腎無干若牽膩如膏心動即遺或溺後遺出皆精病與濁無干肥人多白濁系濕痰二術二陳湯瘦人多赤濁系肝火龍膽瀉肝湯心虛遺濁者金鎖玉關丸脾虛下陷者補中益氣湯心脾兩虛者菟絲煎虛寒帶濁者五味丸淋瀝濕濁者威喜丸濁久足膝痿弱漩腳澄下如糊者六味丸加萆薢麥冬莖中大痛溺赤脈滑數宜清熱利水生地麥冬山梔知母加六一散腎虛淫火易動精滑黏膩如膏九龍丹收攝之若忍精不泄而成白濁者四苓散丹方治白濁杞子錢半菟絲子車前子韭子各一錢蓮子二十粒共入豬尿脬內煮加蔥酒啜汁並食豬脬蓮子連服二三次效赤濁者豬苓湯並加麝香杜牛膝以通瘀腐之在隧竅者有溺時結塊阻竅作痛塊中蓄水泡者必醉酒使內酒濕乘虛襲入精竅也治同上淋症脈候少陰脈數婦人則陰中生瘡男子則氣淋盛大而實者生虛小而澀者死濁症脈候赤白濁脈大而澀按之無力或微細或沉緊而澀為虛動滑為實尺脈虛浮急疾者皆難治遲者易痊附方石淋神聖琥珀散琥珀桂心滑石大黃膩粉磁石木通木香冬葵子燈芯湯下石淋如聖散馬藺花白茅根甜葶藶車前子麥冬檀香連翹各等分渴加黃芩石淋加味葵子散葵子三兩茯苓滑石各一兩芒硝半兩生草肉桂各二錢半為散服方寸匕沙淋二神散海金沙七錢五分滑石五錢為末每二錢入蜜少許以木通麥冬車前子煎湯下補中補中益氣湯見一卷中風補脾歸脾丸見二卷勞瘵勞淋生地黃丸生地黃耆各一兩半防風鹿茸茯神遠志栝蔞仁黃芩各一兩人參一兩二錢五分當歸五錢赤芍蒲黃戎鹽各七錢五分炙甘草七錢車前子滑石各二兩蜜丸勞淋腎氣丸見二卷虛損血淋雞蘇散雞蘇木通各二兩生地滑石各三兩每服五錢竹葉煎服血淋四物湯地芍歸芎血淋六味丸見一卷中風血淋八珍湯見一卷中風血淋益元散六一散加辰砂血淋大分清飲見四卷泄瀉溺血琥珀散琥珀末二錢車前根葉燈芯薄荷等分為末血淋柿蒂湯黃柏黃連生地丹皮白芍側柏葉木通茯苓澤瀉氣淋沉香散沉香石葦去毛滑石當歸瞿麥各五錢赤芍冬葵子白朮各七錢半炙草二錢半王不留行五錢為末每服二錢大麥心湯下氣淋瞿麥湯瞿麥穗木通大黃黃連桔梗當歸延胡枳殼羌活肉桂射干大腹皮牽牛膏淋海金沙散金沙滑石各一兩甘草二錢半每服二錢燈芯湯下膏淋鹿角霜丸鹿角霜茯苓秋石等分糊丸每服二錢膏淋菟絲子丸菟絲子酒蒸桑螵蛸炙各五錢澤瀉二錢半蜜丸米飲下膏淋大沉香散沉香陳皮黃耆各七錢半瞿麥三兩榆白皮韭子炒滑石各一兩黃芩炙草各五錢為末每服二錢米飲下固精聚精丸黃魚鰾膠一斤切碎蛤粉炒沙苑蒺藜八兩馬乳浸隔湯煮一柱香搗丸冷淋肉蓯蓉丸蓯蓉酒蒸焙熟地山藥石斛牛膝官桂檳榔各五錢附子黃耆各一兩黃連七錢半細辛甘草各二錢蜜丸鹽酒下二錢心火導赤散見一卷溫熱淋八味丸見一卷中風濕熱滲濕湯見一卷中風產淋白茅湯白茅根五錢瞿麥茯苓各一錢半冬葵子人參各一錢二分半蒲黃桃膠滑石各七分甘草五分紫貝煅二個江魚牙煅四個分二帖加生薑三片燈心二十莖煎服胞痹腎著湯見一卷濕胞痹腎瀝湯麥冬五加皮犀角各錢半赤芍桔梗桑螵蛸木通杜仲各一錢濕濁苓朮二陳煎豬苓茯苓澤瀉各一錢半白朮半夏各二錢陳皮一錢炙草八分熱濁徙薪飲陳皮八分黃芩二錢麥冬白芍黃柏茯苓丹皮各一錢半赤濁遠志丸遠志八兩茯神益智子各二兩研末酒煮麵糊丸棗湯下赤濁加味清心飲茯苓石蓮各錢半益智麥冬人參遠志石菖蒲白朮澤瀉甘草車前子各一錢燈心二十莖煎服有熱加薄荷精瘀虎杖散虎杖三兩古方用虎杖草汁今世不識代以杜牛膝加麝香一分燉服精滑秘元煎見四卷三消心脾菟絲煎人參山藥各二錢當歸棗仁茯苓各錢半菟絲子四錢遠志四分炙草一錢鹿角霜二錢任督青囊斑龍丸鹿角膠鹿角霜熟地菟絲子柏子仁茯苓補骨脂等分為末酒化膠杵丸挾寒萆薢分清飲益智仁萆薢石菖蒲烏藥各一錢加鹽一捻煎服挾寒內補鹿茸丸鹿茸刺蒺藜沙苑蒺藜肉蓯蓉菟絲子蛇床子桑螵蛸肉桂陽起石炙黃耆製附子紫菀蜜丸心火清心蓮子飲見一卷火莖痛二苓清利飲二苓二冬地草芩柏牡蠣澤瀉車前子濕痰蒼朮二陳煎二陳湯加蒼朮暑濁四苓散見一卷溫思傷瑞蓮丸茯苓石蓮炒生龍骨天冬麥冬柏子仁紫石英煅研遠志當歸棗仁龍齒各一兩乳香半兩為末蜜丸溺血無比山藥丸見六卷腰痛白淫半苓丸半夏茯苓髓條便出髓條方棗仁參苓術茴香補骨脂益智仁牡蠣等分鹽酒糊丸米湯下熱淋五淋散茵陳竹葉各一錢木通滑石甘草各一錢半山梔赤芍赤茯各二錢血分知柏滋腎丸見一卷火肺燥生脈散見一卷暑肺熱黃芩清肺飲見一卷火腎虧一陰煎見二卷咳嗽沙淋牛膝湯杜牛膝水煎加麝香淋渴參澤湯四苓散加人參或再加甘草妊淋葵子湯冬葵子桑白皮木通赤苓瞿麥各一錢黃芩白芍枳實車前子各五分姜五片補攝加減六味丸地苓丹萸山藥蓮鬚芡實菟絲子各二兩龍骨牡蠣澤瀉各一兩五味子五錢蜜丸補攝鹿茸地黃丸熟地五兩山萸酒炒山藥炒各三兩鹿茸一具酥炙龍骨煅一兩半蜜丸滲濕二陳湯苓夏陳草清火抽薪飲見四卷癇症固精固陰煎見二卷脫症攝腎元菟丹菟絲子十兩酒炒五味七兩酒浸茯苓蓮肉各三兩為末另研山藥末六兩酒煮糊丸米飲下濕痰二術二陳湯見二卷痰飲肝火龍膽瀉肝湯見三卷諸氣心虛金鎖玉關丸芡實蓮子蓮鬚藕節茯苓茯神山藥等分為末金櫻子熬膏杵丸虛寒五子丸菟絲子韭菜子益智子茴香炒蛇床子去皮炒等分為末酒糊丸濁濕威喜丸茯苓豬苓黃蠟清熱六一散見一卷溫症攝腎九龍丹見二卷虛損赤濁豬苓湯豬苓茯苓阿膠滑石澤瀉治濁丹方杞子錢半菟絲子韭菜子各一錢車前子五分蓮子二十粒入豬尿脬內煮加蔥酒啜汁並食豬脬蓮子連服二三次效淋濁脈案丁血淋溺痛左寸脈洪數此心移熱於小腸搏於血脈入於胞中與溲俱下因瘀熱迫注溺竅並莖中亦痛也當先清利火腑用導赤散加赤苓丹皮麥冬歸尾燈心木通一劑淋痛減後用生地茯苓歸身丹參遠志丹皮側柏葉鮮藕數服尋愈周遊幕縣署淋症失調晡後寒熱如瘧醫誤以為陰虛雜進補澀病益劇又進散劑疑不敢服涕泣求診脈虛軟而浮用補中湯數服寒熱止淋亦漸瘳後用六味丸加減而愈王二給役書館夜私出初便濁秘不言後乃不便自遺瘦怯不任起立常如欲溺狀或前欲溺而後亦不禁此濁久氣虛下陷也或以瀉熱之劑與服病益劇予用升舉法佐以利濕升麻茯苓豬苓白朮半夏炙草蓮鬚蓮子仿治濁固本丸意滑泄自止貢淋症愈而忽發色蒼形瘦食減便溏咽乾膝痛脈沉濡左寸稍大是心熱移於小腸而與濕相搏參萆薢分清飲赤苓生薏米各三錢生白朮澤瀉各八分石斛麥冬各二錢防己甘草各一錢萆薢通草各錢半滑石飛三分數服淋愈但脈來沉小食少足酸乃脾陽腎陰素虧宜兼調為治熟地杞子益智仁煨茯神甘草炙薏米山藥蓮子俱炒歸身同研末加粳米屑調服日二次食進而足亦健步岳勞淋是膀胱氣分病近日大便秘結食頃必脹足脛冷診脈弦而遲乃陰結胃氣不主下行而膀胱之轉輸不利乃為淋也治宜溫通勿進止澀川附生朮縮砂殼陳皮白韭子蔞仁蘇子俱炒研茯苓海金沙四服逆氣平脹秘良已脈亦和去川附蔞仁加牛膝蒸蓮子服愈江溺前澀痛莖端宿有瘀腐向服瞿麥湯痛減導火下行故也然脈來洪實搏指不特膀胱瘀熱未盡抑且心腎根源未清故痛減淋不減也宜收心節欲勿擾腎臟戒酒薄味靜養可安茯苓生地石斛萆薢蓮鬚甘草梢燈心澤瀉數服而效王便濁而數且痛午後寒熱不時頭眩神倦脈弱自秋延春兼溺血點乃勞力傷陰陰火迫注膀胱先用分利法導赤散加赤苓蓮鬚歸尾赤芍丹皮梔子燈草二服眩痛止去木通竹葉改熟地歸身又加萆薢三服諸症俱瘳又令服六味丸愈族某勞淋初用分清飲澀痛已減後服單方通利太過反致溺後精瀝腰足痠軟畏冷左脈虛澀少神腎氣不攝乃成虛滑攝固為宜沙苑子菟絲子杞子蓮子破故紙熟地砂仁末炒杜仲數服而效後加鹿膠潞參歸身茯苓山藥乃固眭勞力傷陰脈右弦左大腹痛溺澀出粉此為沙淋海金沙六分杜牛膝一錢當歸尾八分薏仁三錢燈心八分赤苓二錢小茴香鹽水炒八分數服澀痛止去前三味加杞子沙苑子益智子俱炒釵斛懷牛膝酒蒸數服甚適此溫通之劑能節勞則淋可不發族某膏淋溺面浮油有時便中推出髓條此積勞損傷腎陰所致宿恙經年近又兼病陰瘧真元日憊飲食無味益腎必先補脾潞參茯神山藥生白朮薏仁杜仲芡實蓮子俱炒何首烏沙苑子十數服全愈陳色蒼體長木火之質陰分易虧五旬外納寵急圖嗣續月前因濁成淋溺數而欠著枕仍然遺泄延至血水滴瀝而痛是為血淋精室既傷心火猶熾診兩尺左弦右數宜腰膝痿軟足心如烙也夫不痛為溺血痛為血淋雖腎虛挾火然導赤分清如方鑿圓枘五苓八正亦抱薪救焚急用生料六味作湯可濟燃眉熟地六錢生地三錢懷山藥炒二錢半茯苓三錢丹皮澤瀉各一錢生蓮子不去心一兩蓮子須麥冬各二錢五味子五分數服痛止淋減湯丸兼進而安遺泄論治凡臟腑之精悉輸於腎而恆擾於火火動則腎之封藏不固心為君火肝腎為相火君火一動相火隨之而夢泄焉其交則心之神肝之魂所幻而接也經曰恐懼不解則傷精時自下又曰厥氣客於陰器則夢接內然有有夢而泄者有無夢而自遺者昔人謂夢而後泄者相火之強為害不夢自遺者心腎之傷為多且謂五臟有見症宜兼治終不如有夢治心無夢治腎為簡要也乃詳求所因則有心陽暗熾腎陰內灼者宜涼心攝腎補心丹加減有腎精素虧相火易動者宜厚味填精熟地魚鰾杞子羊腎豬脊髓青鹽五味子之類介類潛陽龜甲牡蠣淡菜之類佐以養陰固攝山藥蓮子芡實菟絲子桑螵蛸之類有龍相交熾陰精走泄者宜峻補真陰承製相火三才封髓丹滋腎丸大補陰丸有用心過度心不攝腎者宜交心腎遠志丸佐靈砂丹有思慮積勞郁損脾氣者宜舒養脾營歸脾湯亦有脾虛下陷者宜補中益氣湯有腎虛不固者五倍子二兩茯苓四兩丸服效有積想不遂者宜安神固氣解鬱疏肝妙香散吞玉華白丹有精關久滑不夢而泄者宜固攝止脫桑螵蛸散金鎖玉關丸有房勞過度下元虛憊寐則陽陷而精遺不禁者宜升固八脈之氣固精丸或六味湯加鹿茸菟絲五味龍齒蓯蓉有壯年久曠精滿而溢者宜清火安神生地知母黃柏菖蒲遠志茯神蓮子有陰虛不攝濕熱下注而遺者宜泄熱導濕萆薢黃連黃柏茯苓澤瀉薏苡或秘精丸有因醇酒厚味釀成脾胃濕熱留伏陰中而為夢泄者宜清痰火二陳湯加二朮升柴有因經絡熱注夜則脊心熱而遺者豬苓丸清心飲亦有鬼魅相感者其狀不欲見人獨言笑時悲泣脈乍大乍小或綿綿不知度數顏色不變乃其候也宜蘇合香丸服之效此其所因不同為遺為泄亦異皆當分別施治大約陽虛者急補氣鹿茸大補湯陰虛者急益精大補陰丸大造丸陽強者急瀉火而已宜補陰瀉火湯滋陰降火湯遺泄脈候遺精白濁當驗於尺結芤動緊二症之的脈訣附方涼心天王補心丹見一卷火滋腎三才封髓丹天冬熟地各二兩人參一兩黃柏三兩砂仁一兩半炙草七錢半麵糊丸蓯蓉酒煎送下瀉火滋腎丸見一卷火瀉火大補陰丸見一卷火安心遠志丸見四卷癇鎮墜靈砂丹見二卷喘養脾歸脾湯見二卷勞瘵升提補中益氣湯見一卷中風安神妙香散見二卷衄固氣玉華白丹鍾乳粉一兩陽起石煅白石脂煅各五錢左牡蠣煅七錢糯米粉糊丸攝腎桑螵蛸散人參茯神遠志菖蒲桑螵蛸龍骨龜板當歸閉精金鎖玉關丸見本卷淋濁鎮固固精丸牡蠣菟絲子韭子龍骨五味桑螵蛸白石脂茯苓補腎六味丸見一卷中風導濕秘精丸白朮山藥茯苓茯神蓮子各二兩芡實四兩蓮鬚牡蠣各一兩五錢黃柏五錢車前子三兩共研末金櫻膏丸氣虛者加人參一兩補氣十補丸耆術各二兩茯苓山藥各一兩半參歸白芍遠志各一兩熟地三兩山萸杜仲續斷棗仁各二兩五味龍骨牡蠣各七錢五分金櫻膏為丸化痰二陳湯苓夏陳草姜痰迷豬苓丸半夏豬苓精滑清心飲參歸地草連茯神棗仁遠志蓮子鬼魅蘇合香丸見一卷中風陽虛鹿茸大補湯蓯蓉杜仲各一錢參術桂附芍夏五味各七分歸地耆苓鹿茸各五分甘草三分滋陰大造丸紫河車蒸搗一具生地四兩龜板天冬杜仲黃柏各兩半牛膝麥冬歸身各一兩二錢五味五錢米糊丸陽強補陰瀉火湯地芍歸芎術草知母天冬黃柏瀉火滋陰降火湯四物湯加知母黃柏元參遺泄脈案某無夢而遺勞心輒泄乃心腎失交症用茯神丸參六味人參熟地茯神遠志當歸山藥蓮鬚棗仁五味龍骨蓮實糊丸服數料全愈吉己巳同會試前數日同寓約觀梨圓座中遺泄如注歸寓後寒熱咳嗽吐痰此陰虛兼外感也令服補中湯寒熱退但脈虛而沉細欲絕斷為腎損難治粗畢場事神愈疲乏勞熱喘促痰嗽食減乃脾肺虛而氣不歸源也必用人參乃定彼吝費一友贈高麗參二錢予謂代用效減自須全投書人參養營湯去熟地與桂加茯神山藥蓮實彼又將高麗參二錢分作四服予哂之服後喘熱減飲食頗加又兩服改用潞參而效更減矣族某夢泄宿疴腰痛新兼脘痛脈弦細此傷精候也妙香散去黃耆麝辰砂加砂仁馬料豆炒服效呂少年未室每十日一夢泄積久疲乏面少神采素服滋陰斂澀等藥不效改服鎮心安神等劑亦不效予謂肝腎脈虛非相火為害但精關久滑氣少固攝耳詢之果有時無夢亦泄遂重用參耆佐以五味茯神山藥蓮子菟絲芡實杞子俱炒滑泄竟止更用丸劑加魚鰾炒研而固幼侄宵讀神勞即夢泄夜熱易飢左關脈搏按丹溪云主閉藏者腎司疏泄者肝二臟皆有相火而其繫上屬於心心君火也感物而動君火動則相火隨之雖不交會精亦暗流矣又隱菴謂腎之陰虛則精不藏肝之陽強則氣不固故夢而精脫也先用六味湯加減熟地山藥茯神丹皮遠志潞參麥冬芡實蓮心石斛數服而效後加龍骨白芍五味煉蜜為丸服愈此補肝腎參養心之劑君火安則神魂斂而龍雷不擾矣劉試場受驚心惕精走於下延為怔忡悸恐心君虛不主令相代其權乃至有夢無夢皆遺腰膝痠軟乏力診左寸沉數左關尺沉細如絲右尺微弦此心營損極神不攝精宜補養心神固納腎真經言怵惕思慮則傷神神傷則恐懼流淫不止又云恐懼不解則傷精精傷則骨酸痿厥精時自下大抵怵惕傷心恐懼傷腎心腎失交精關不固必精生神神攝精乃能卻病且情志之病尤在靜養善調勿希速效潞參熟地茯神各三錢龍骨山藥各二錢棗仁遠志當歸各錢半金櫻子一錢五味子柏子仁各六分蓮子十粒二服甚適診左寸綿綿不絕惟尺澤空精腑少藏耳若滋填精室旬日內漏卮勿泄尺脈可起又夜半易飢便滑前方去當歸柏子仁熟地山藥焙用加魚鰾三錢菟絲餅二錢十服神安精固惟骨節時酸脅肉時瞤坐臥恍惚如在波浪中此病後神未復元虛陽浮越也宜招集散亡封固管鑰更用潛陽填髓丸熟地八兩湖蓮芡實俱炒線膠淡菜茯神山藥各四兩五味一兩龜板遠志麥冬硃砂拌炒各二兩豬脊髓熬為丸又經云精不足補之以味午用豬心腎海參煨食晨用牛乳同糯米煮食調理數月漸安陽痿論治丸冷莖縮莖縱強中下疳附男子二八而精通八八而精絕陽密則固精旺則強傷於內則不起故陽之痿多由色欲竭精或思慮勞神或恐懼傷腎或先天稟弱或後天食少亦有濕熱下注宗筋弛縱而致陽痿者蓋前陰為肝脈督脈之所經經云足厥陰之脈入毛際過陰器抵少腹又督脈起少腹以下骨中央入系女子廷孔循陰器男子循莖下至篡又為宗筋之所會景岳云陰陽總宗筋之會會於氣街而陽明為之長此宗筋為氣血之孔道而陽明實氣血之化源陽明衰則宗筋不振故見症多肝腎主病云傷色欲者須辨水衰火衰水衰真陰虧乏歸腎丸還少丹地黃湯火衰精氣虛寒右歸丸八味丸甚者加人參鹿茸或加肉蓯蓉杞子若火衰不甚斫喪太過補骨脂丸傷思慮者心脾鬱結陽事不舉歸脾湯炒香散郁傷少陽生氣日索加味逍遙散傷恐懼者膽虛精卻大補元煎加棗仁鹿角膠先天精弱者房後神疲固陰煎秘元煎胃虛食少者水穀不充精髓失旺脾腎雙補丸七福飲玉母桃其濕熱傷及肝腎致宗筋弛縱為陽痿者如筋角近火則軟得寒則堅宜滋陰八味丸或龍膽瀉肝湯經謂腎欲堅急食苦以堅之也然必脈症果系濕熱方用苦堅淡滲若肝腎虛熱仍宜養肝滋腎地黃湯加龜板元參天麥冬五味子又有心腎失交夢泄致痿遠志丸加熟地棗仁白芍勞傷筋骨陽道痿弱無比山藥丸大造固真丹腎虛無子精冷精滑七寶美髯丹通治陽事不起如贊化血餘丹鹿茸地黃丸三子丸青娥丸等此治法大概也若夫元陽既傷真精必損必兼血肉溫潤之品緩調之如斑龍丸聚精丸二至百補丸之類純用剛熱燥澀之劑恐有偏勝之害其審而裁之可耳丸冷陰痿弱而兩丸冷陰汗如水溺有餘瀝此肝經有濕柴胡勝濕湯腎脈強大右尺尤盛此相火盛而反痿滋腎丸地黃丸有陰莖內縮乃肝之筋受寒四逆湯加參桂陰縱不收肝之筋傷熱小柴胡湯加酒炒黃柏又強中症莖舉不衰精流不止或由肝火太強或由金石性發宜瀉火解毒用知母石膏元參生地大豆甘草等夏子益奇疾方治玉莖長硬不痿精自出捏之脆癢如針刺用補骨脂家韭子各一兩研末每服三錢水煎日三次玉莖潰爛謂之下疳先用米泔水溫洗用爐甘石乳香血竭黃連各一錢輕粉五分冰片一分研末搽立效附方滋陰歸腎丸熟地八兩山藥炒萸肉茯苓當歸杞子杜仲鹽水炒菟絲子酒浸炒各四兩蜜丸益陰還少丹見一卷中風滋陰六味丸見一卷中風益火右歸丸見二卷虛損益腎八味丸見一卷中風通補補骨脂丸補骨脂炒香菟絲子酒蒸各四兩核桃肉一兩沉香錢半蜜丸鹽湯下心脾歸脾丸見二卷勞瘵調郁妙香散見二卷衄暢肝加味逍遙散見一卷火填精大補元煎見一卷中風攝腎固陰煎見二卷脫攝腎秘元煎見四卷三消脾腎脾腎雙補丸人參蓮子山藥山萸五味菟絲子巴戟砂仁橘紅肉蔻車前補骨脂蜜丸忌羊肉雙補七福飲見三卷郁扶脾玉母桃冬白朮泔浸炒熟地酒蒸杵何首烏九蒸巴戟肉甘草汁浸炒杞子等分蜜丸滋陰滋陰八味丸六味丸加知柏俱鹽水炒各三兩泄熱龍膽瀉肝湯見三卷諸氣安心遠志丸見四卷癇補腎無比山藥丸見六卷腰痛益精大造固真丹補骨脂杞子各六兩山藥菟絲子各四兩核桃肉萸肉各三兩巴戟蓯蓉人參鹿茸各二兩五味子小茴香各一兩半熟地十二兩於術六兩紫河車一具蜜丸酒下補陽七寶美髯丹赤白何首烏各一斤黑豆拌蒸茯苓乳蒸牛膝酒蒸當歸杞子酒浸菟絲子酒浸各半斤故紙芝麻拌炒四兩蜜丸鹽湯下通治贊化血餘丹血餘煅八兩熟地八兩杞子當歸鹿角膠菟絲子杜仲巴戟小茴香茯苓蓯蓉核桃肉何首烏各四兩人參隨宜填精鹿茸地黃丸見本卷淋濁通治三子丸蛇床五味菟絲蜜丸補火青娥丸見六卷腰痛督脈斑龍丹見本卷淋濁益精聚精丸見本卷淋濁填精斑龍二至百補丸鹿角膠黃精杞子熟地菟絲餅金櫻子天冬麥冬牛膝楮實龍眼肉以上熬成膏加煉蜜調入後藥末鹿角霜參耆苓地萸味芡實山藥知母共十味為末和前膏杵丸驅濕柴胡勝濕湯升柴羌苓澤草黃柏龍膽草歸尾麻黃根防己五味子水煎濕熱滋腎丸見一卷火陰縮四逆湯見一卷暑和解小柴胡湯見一卷溫蓄血論治凡跌撲傷損及努力負重忿怒氣逆皆使瘀血停蓄其症寒熱發黃胸脅小腹滿痛手不可近宜分上中下治之如吐衄停瘀屬上部必漱水不欲咽犀角地黃湯血結胸膈屬中部必燥渴譫語桃仁承氣湯少腹硬滿大便黑屬下部必發狂善忘抵當湯代抵當湯三焦蓄血必狂躁便實生地黃湯蓄血初起胸腹痛香殼散從高墜下惡血留停腹脅痛不可忍復元活血湯努傷血滯沉香降氣散胸前血瘀生韭汁和童便服夾血如見祟狀當歸活血湯身寒熱發黃脈弦細而伏千金用大黃芒硝歸尾桃仁人參桂心為末酒服二方寸匕蓄血下黑如漆最危必神脈不變方可治瘀血燥結玉燭散頭面身體發黃以絹包生薑渣擦之自退附方上部犀角地黃湯見一卷溫或加當歸桔梗陳皮甘草藕汁紅花中部桃仁承氣湯見一卷疫下部抵當湯水蛭三十個熬虻蟲三十個炒桃仁二十個大黃酒浸三兩下部代抵當湯見二卷血三焦生地黃湯生地汁一升乾漆炒五錢生藕汁半升藍葉一握虻蟲二十個水蛭十個大黃一兩桃仁五錢水煎分二服胸痛香殼散香附炒三錢枳殼炒二錢青皮陳皮烏藥赤芍蓬朮醋炒各一錢歸尾三錢紅花五分炙草二分生草三分研末每服四錢腹脅復元活血湯見二卷血怒傷沉香降氣散見三卷郁見祟當歸活血湯歸芍地姜桂苓枳柴草桃仁紅花燥結玉燭散見六卷腹痛溺血論治溺血與血淋異痛為血淋出精竅不痛為溺血出溺竅痛屬火盛不痛屬虛然經云胞移熱於膀胱則癃溺血膀胱者胞之室惟房欲損腎熱注膀胱腎與膀胱相表裡故血隨溺出亦火所迫也其脈洪數法當滋化源六味飲加生牛膝如肺腎陰虛口乾腰痠六味丸合生脈散小腸火盛血滲膀胱導赤散肝火脈洪不能藏血龍膽草湯加法膽火溺血頭痛眩暈當歸飲溺血日久腎液虛涸六味阿膠飲陰虛火炎一切溺血血淋保陰煎小溲自利後瀝血點痛如血淋小薊飲子小水不利赤濁淋閉大分清飲通治溺血益母草搗汁一升服效槐花炒鬱金煨各一兩研每用三錢豆豉煎湯下效治血淋琥珀研細以燈心薄荷煎湯下二錢脾虛不能攝血久而滑脫妙香散去桔梗麝加煅龍骨益智仁附方化源六味湯見一卷中風陰虛生脈散見一卷暑小腸導赤散見一卷溫肝火龍膽草湯一味龍膽草煎服膽火當歸飲當歸羚羊角赤芍各二錢生地刺薊葉各一錢液涸六味阿膠飲六味湯加阿膠童便虛火保陰煎見五卷痙血淋小薊飲子薊梔歸各一錢地藕節各錢半滑石蒲黃炒各錢二分通草甘草竹葉各八分淋閉大分清飲見四卷泄瀉脾虛妙香散見二卷衄便血論治腸風臟毒附便血與痢血異便血宿疾痢血新邪兼有膿雜與腸風臟毒尤別便血火淫腸風風淫臟毒濕熱淫兼積毒便血由腸胃火傷陰絡血與便下治分血之遠近虛實新久不可概行涼血澀血金匱以先便後血為遠血黃土湯先血後便為近血赤小豆當歸湯其血色鮮稠為實熱迫注多醇酒厚味釀成約營煎地榆丸色浠淡為脾胃虛寒歸芍異功散加炮姜色瘀晦為陽衰不攝因中寒食冷氣滯血凝必腹痛嘔瀉附子理中湯倍炮姜思傷心脾氣不統血或年衰病久歸脾湯惟初起血中伏火用桂圓肉包鴉膽子肉十枚勻兩包四五服效若未止用劉寄奴五錢松蘿茶一錢烏梅肉一枚煎服效久而氣陷血脫補中益氣湯血滑不止舉元煎下玉關丸若面色萎黃下元虛憊加味六君子湯下斷紅丸或十全大補湯去茯苓加防風其結陰便血脈必虛澀系厥陰肝血內結陽失統運滲入腸間諸家謂陰寒內結非也遵醫通補中益氣湯倍黃耆加炮姜宿有血症因感濕熱血下紫黑乃濕毒腸澼升陽益胃湯凡便血及腸風服藥不效山楂子散大便燥結肛頭血出熟地一兩蒸食腸風血清色鮮遠射四散如篩風性疏也經言久風入中則為腸風飧泄加減四物湯加秦艽虛者人參胃風湯腸風夾濕下如豆汁或瘀紫升陽除濕防風湯有熱加黃連當歸甘草若濕熱內蘊下血腹滿槐花散初起血熱槐花飲久則兼夾寒濕厚朴丸血滑不止惜紅煎脾脈浮緩土虛風濕交乘加味六君子湯十全大補湯腸風兼瀉米豆散臟毒血濁而色暗系濕熱蘊毒輕者豬臟丸重者臟連丸酒毒釀濕熱下血聚金丸若肛門血射如線或點滴不止為痔血秦艽白朮丸去皂角枳實澤瀉加槐花生地黃蜜丸痔與痢血另詳本門附方遠血黃土湯術附地芩草阿膠各錢半灶心土如雞子大一枚打碎水煎澄清再煎諸藥近血赤小豆當歸湯赤小豆二升浸出芽曬乾當歸三兩研末調服方寸匕日三次熱迫約營煎生地赤芍黃芩地榆續斷甘草槐花荊芥等分烏梅二個水煎血痢地榆丸見四卷痢症脾虛歸芍異功散參苓術草陳歸芍心脾歸脾湯見二卷勞瘵氣陷補中益氣湯見一卷中風氣陷舉元煎見三卷飲食如兼滑脫加烏梅文蛤血滑玉關丸白麵四兩炒枯礬文蛤各二兩醋炒五味炒訶子各一兩炒研末熟湯和丸脾虛加味六君湯六君湯見一卷中風再加黃耆柴胡下虛斷紅丸側柏葉續斷各三錢鹿茸一具阿膠為丸虛憊十全大補湯見一卷中風腸澼升陽益胃湯炙耆錢半參草各一錢術歸陳黃芩神麯炒各五分升麻柴胡各三分姜棗煎去瘀山楂子散楂肉炒研艾湯調下血鮮者加山梔槐花腸風加減四物湯地歸芎側柏葉各八分枳荊草槐花各四分地榆條芩防風各六分烏梅二個姜三片胃風胃風湯見四卷泄瀉夾濕升陽除濕防風湯防風二錢蒼朮泔浸蒸白朮飯蒸苓芍各一錢姜一片濕熱槐花散槐花二錢蒼朮厚朴陳皮當歸枳殼各一錢烏梅肉炙草各五分血熱槐花飲生地三錢當歸二錢側柏葉炒荊芥炒槐花炒川芎枳殼各一錢炙草五分如血不止加升麻阿膠寒濕厚朴丸厚朴生薑各四兩同炒術曲麥芽各炒一兩研末米糊丸血滑惜紅煎術草荊芍五味山藥地榆續斷烏梅水煎止泄米豆散馬料豆炒秈米陳倉米粟米鍋焦俱炒研白糖調服四錢臟毒豬臟丸用豬臟二尺洗淨入槐花二兩紮緊蒸搗焙乾研糊丸臟毒臟連丸黃連一兩酒炒研槐花二兩炒研陳倉米三合入豬臟內蒸杵丸酒毒聚金丸黃芩防風各二兩黃連四兩半生半酒炒研末醋糊丸米飲下痔血秦艽白朮丸秦艽白朮歸尾桃仁各一兩枳實皂角子燒存性澤瀉各五錢地榆二錢麵糊丸便血脈案夏便紅遇勞輒甚初服苦參子俗名鴉膽子以龍眼肉裹開水送下十粒效後屢試不驗予按東垣論脾為生化之源心統諸經之血思慮煩勞致心脾不司統攝宜用歸脾丸或暫服加味歸脾湯其血自止如言而瘥湯丸內俱去焦白朮幼侄鼻衄便紅寒熱無汗食減神疲脈大而數此脾肺氣虛陰火乘絡致血從清濁道橫溢而出用補中益氣湯去升麻加山梔白芍一服五更大熱比曉微汗身涼次日寒熱除脈頓斂三服而病已服侄壯歲便後瀝血色鮮乃腸胃遠血症屬腸風用升降法荊芥當歸俱醋炒白芍槐米俱酒炒黑山梔生地甘草炙黑側柏葉三服愈張辛苦傭作日夜便血數次由冬入夏未止陰絡已傷漸至食減無味神色慘悴脈來沉細而數勢必寒熱延成損怯勉用攝血佐以益脾以脾統血也仿駐車丸去黃連阿膠水化炮薑當歸土炒白芍熟地甘草俱炒黑蓮子炒紅棗南燭子茯神三服紅痢減寒熱亦止口中和據述腹不痛但裡急必連便二次此屬氣虛不攝專用潞參炙耆茯苓山藥地榆酒炒赤石脂便血遂止何童年便血面黃瘦能食此脾氣鬱而生火也用清理濕熱山梔赤苓生白芍生薏仁石斛當歸柿餅炭陳皮地榆數服效朱春正痢血一載未痊陰絡大傷秋間三瘧歷冬曾用常山劫劑未效面浮足腫食減神疲懍寒宵熱脈虛近數陰傷及陽延成損怯矣今痢純紅日夜十數次即培陽攝陰尚恐不及乃閱所服方仍用制軍輩屢次通里是欲竭其漏卮乎毋怪愈治愈劇也用潞參茯苓山藥白朮炒白芍甘草炙黑荊芥醋炒黑烏梅阿膠煨一服血減明日不甚怯寒矣又加減十數劑瘧痢漸瘳二便不通論治腎主五液開竅於二陰至前後不通氣機閉窒脹滿不食氣逆喘急危候也揆病所由有因三焦熱結者宜黃連黃芩山梔鬱金枳實海金沙檳榔有因三焦濕滯者宜薏苡通草厚朴茯苓廣皮澤瀉大腹皮有因濕熱阻氣者宜石膏滑石知母萊菔子郁李仁車前子木通有痰隔中脘氣痹上焦者二陳湯加木通探吐有肺氣不降者麥冬杏仁通草枳殼知母赤茯有胃實燥結者小承氣湯大分清飲或涼膈散有小腸氣痹者小溫中丸有火腑熱結者有厥陰熱秘者火腑用更衣丸厥陰用龍薈丸有腑陽不行者玉壺丹半硫丸熱藥多秘惟硫黃性緩而通玉壺丹半硫丸皆取通陽之義有血液枯燥者通幽湯有氣虛血熱者人參固本丸有陰囊腫脹熱蘊便閉者三白散按經云女子督脈入系廷孔男子循莖下至篡所生病不得前後據此則二便不通又宜通奇絡如桂心川楝子小茴香附當歸五靈脂桃仁麻仁等熱蘊腹脹或用田螺加鹽和殼搗碎帛系臍下一寸三分前後皆通有因膀胱溺滿支撐迴腸阻大便者五苓散加木通車前溺行便自出亦有先通大便水道自利者圓機活法在乎審症而施治焉大便不通有實秘虛秘熱秘冷秘風秘氣秘有陽結陰結仲景云脈浮數能食不大便為陽結脈沉遲不能食身重大便反硬為陰結東垣云實秘熱秘即陽結也宜散虛秘冷秘即陰結也宜溫氣燥以杏仁枳實行之血燥以桃仁大黃通之風燥以麻仁大黃利之氣澀不通以郁李仁皂角子潤之氣壅便秘以參歸麻仁大黃開之葉氏治腸痹必開降肺胃如杏仁栝蔞冬葵子枇杷葉鬱金汁紫菀以降肺半夏花粉竹茹橘紅枳實汁薑汁以和胃即丹溪開上竅以通下竅之微旨也今即其症分別言之由胃實者善飲食小水赤七宣丸由胃虛者不能食小便清利厚朴湯由熱秘者面赤脈實數脹悶欲得冷四順清涼飲潤腸丸由冷秘者面白脈沉遲欲得熱正氣散加官桂枳殼吞半硫丸或木香順氣散由風秘者風搏肺臟傳入大腸潤腸丸加防風皂角或去大黃加煨阿膠婦人風秘大麻仁丸由氣秘者氣不升降穀氣不行善噫蘇子降氣湯加枳殼由肺氣不通降失於傳送者杏蔞枳桔梔豉鬱金橘白由三焦不和胸膈痞滿者搜風順氣丸加栝蔞廣皮由大腸實者腹滿便硬麻仁丸由腎虛液少便燥者六味湯去茯苓加蓯蓉白蜜由血熱便難者當歸潤燥湯由風熱鬱滯者疏風潤腸丸由血燥兼氣秘者潤麻丸由血虛秘結者益血潤腸丸由津液枯涸者蓯蓉丸五仁丸由幽門不通者通幽湯由素有風病而便秘者皂角丸由病後氣血未復及老人津液衰少產後去血多者八珍湯倍當歸加蓯蓉蘇子杏仁阿膠黑芝麻由久病氣虛下陷致便難者補中益氣湯加杏仁蘇梗老人陽虛風秘者半硫丸老人氣秘橘杏丸二仁丸老人血秘蘇麻粥三仁粥又有脾約症傷寒陽明症自汗出小便數津液內竭其脾為約用脾約丸攻蕩為治然亦滋其陰血為穩宜當歸潤燥湯主之如陰寒秘結當用溫藥須略加清潤以去結秘若病本虛寒標現躁熱亦宜於通陽藥中稍佐苦寒以去躁熱躁止勿加如陰躁刻欲就冷兩尺虛或沉細遲勿用寒劑理中湯冷服或不效用外導法蜜煎入鹽五分皂角燒灰研五分和捻尖熱納肛中冷秘者蜜煎中加草烏頭末和捻如上熱秘者豬膽汁導之又有求通努力虛氣迫注肛門裡急後重氣逆嘔惡不堪通利不堪升提宜人參枳殼當歸陳香櫞或用川芎當歸煎湯入穢桶乘熱坐熏之亦效風秘發寒熱生何首烏兩許煎加蜜服或用固本丸熬膏服失血後煩渴便結一味生地黃汁煎服血液燥結熟地蒸熱每服五錢效若輕用硝黃利藥則秘愈甚小便不通經云膀胱者州都之官津液藏焉氣化則能出矣三焦者決瀆之官水道出焉是知膀胱主藏溺必待三焦氣化乃能出水也詳列所由有肺燥不能生水者用清潤法生脈散加沙參茯苓桑皮車前有氣閉不能通調水道以下輸者用探吐法以沉香木香陳皮枳殼小茴木通煎湯探吐有氣虛下陷升降不利者用升舉法補中益氣湯孕婦胎重壓胞小水閉者用補中湯探吐氣升則水降如滴水之器開其上則下自通矣有火鬱小腸溺短而痛者用清降法導赤散加滑石有濕壅三焦致閉癃者用分清法通草滑石蘆根薏苡茯苓車前有暑濕泄瀉氣不化水者用化氣法五苓散有濕勝而渴小水不利者用分利法四苓散有濕熱閉阻經府氣分致便不通者用宣通法石膏杏仁厚朴防己大腹皮海金沙合六一散由腎水燥熱致不利者用滋清法知母黃柏黃芩澤瀉通草有陽亢陰衰孤陽不化者用補陰抑陽法化陰煎若火不甚亢但由水虧者用補水法大劑六味湯經言無陽則陰無以生無陰則陽無以化熱在下焦而不渴服淡滲藥腹脹不通益甚者滋腎丸其陰陽大虧氣不化者腎氣湯溺閉轉筋喘急欲死者八味丸料大劑煎服緩則不及其血結而致閉者牛膝湯痰盛而致閉者導痰湯火閉者七正散氣虛溺不利者獨參湯少加廣皮效通治小水不通法用獨囊蒜頭數枚梔子三枚鹽少許爛搗攤紙貼臍上良久即通或用食鹽半斤炒熱布包熨之諸藥不效者用白菊花根搗爛以生白酒沖和取酒汁溫服神效又法用活田螺一個連殼搗如泥入麝香細研末少許置臍上以蛤蜊合之以帛扎定效大便不通脈候脾脈沉數下連於尺為陽結尺脈沉細虛遲為陰結右尺脈浮為風結附方痰氣二陳湯見一卷中風胃實小承氣湯見一卷溫熱結大分清飲見四卷泄瀉火盛涼膈散見一卷中風氣痹小溫中丸見三卷腫脹火府更衣丸硃砂五錢蘆薈七錢各研酒和丸每服一錢二分厥陰龍薈丸見一卷火通陽玉壺丹硫黃八兩配麻油八兩微火熬以桑條攪候溶盡即傾入水去油麵再溶傾入豆腐內煮糯米粉為丸通陽半硫丸製半夏硫黃等分蒸餅薑汁和丸治老人虛秘冷秘液燥通幽湯見一卷燥虛熱人參固本丸見一卷中風囊腫三白散白牽牛頭末一兩桑白皮白朮木通陳皮各二錢半研末薑湯下一錢利溺五苓散見一卷溫胃實七宣丸大黃木香檳榔訶子皮桃仁研末蜜丸胃虛厚朴湯樸陳術草枳實半夏曲姜棗熱秘四順清涼飲見一卷火熱秘潤腸丸麻仁羌活大黃歸尾桃仁蜜丸加防風皂角名疏風潤腸丸冷秘正氣散見一卷中風冷秘木香順氣散木香草蔻益智蒼朮各三分厚朴四分陳皮青皮半夏吳萸升麻柴胡各五分茯苓八分風秘大麻仁丸麻仁熟大黃各三錢木香枳殼檳榔各五錢蜜丸氣秘蘇子降氣湯見二卷失音氣秘搜風順氣丸大黃麻仁郁李仁山藥山萸車前牛膝菟絲防風獨活檳榔枳殼蜜丸實秘麻仁丸見一卷燥液虛六味丸見一卷中風血秘潤燥湯見一卷燥氣血潤麻丸麻仁桃仁生地當歸枳殼各一兩蜜丸血虛益血潤腸丸歸地荊枳麻仁杏仁蓯蓉蘇子蜜丸津少蓯蓉丸蓯蓉二兩沉香一兩麻仁汁糊丸米飲下津枯五仁丸桃仁杏仁各一兩柏子仁五錢郁李仁松子仁各三錢三分橘紅四錢蜜丸風秘皂角丸羌防杏枳陳芷桑皮檳榔麻仁牙皂蜜丸氣血八珍丸見一卷中風氣虛補中益氣湯見一卷中風氣秘橘杏丸橘皮杏仁等分蜜丸氣秘三仁丸杏仁麻仁枳殼訶子肉等分蜜丸血秘蘇麻粥蘇子麻仁水浸研汁和粳米煮粥血秘三仁粥桃仁松子仁郁李仁搗汁和粳米煮粥傷寒脾約丸酒蒸大黃枳實厚朴赤芍麻仁杏仁蜜丸虛寒理中丸見一卷中風清潤生脈散見一卷暑清降導赤散見一卷溫分利四苓散見一卷暑宣通六一散見一卷溫陽亢化陰煎二地牛膝豬苓澤瀉黃柏知母綠豆龍膽草車前水煎陰陽滋腎丸見一卷火氣化腎氣丸見二卷虛損喘急八味丸見一卷中風血結牛膝湯牛膝桃仁當歸黃芩水煎痰盛導痰湯見一卷中風火閉七正散車前赤苓山梔木通膽草甘草梢萹蓄竹葉燈心大便不通脈案朱八旬公車抵都途次委頓浹旬苦不得便脈洪大右尺虛予謂大腸主液此陽明液干熱秘象也宜潤腸丸因高年血液燥熱仿東垣潤燥湯用生熟地黃麻仁桃仁當歸紅花蜜沖服效房兄病後便秘脈虛於潤補劑中參升降法潞參熟地黃當歸升麻杏仁服愈熟地可加倍兩許用石氏老年風秘兼痔血腫痛脈洪而虛用滋燥養營湯加荊芥醋炒地榆酒炒胡麻升麻蓯蓉蒸煉蜜為丸服效滋燥養營湯見燥症李氏腑失傳送脅痛脘脹便艱皆氣機阻窒為患宜先導其腑氣用杏仁蘇梗厚朴鬱金橘白郁李仁當歸四服痛脹止兼令服牛乳便亦通潤後左脅鑽痛得湯浴則止乃肝氣滯由臟及腑用麩皮炒熨兼用延胡酒炒白芍炒當歸金橘皮煎湯降香木香俱磨汁服而平族婦大便旬餘一行或勸服大黃艱秘益甚兩尺沉大此清氣陷下也用補中益氣湯去柴胡白朮加桃杏二仁數服而復常小便不通脈案鄧氏陰虛陽搏謂之崩崩久成漏衝任經虛可知據述五月間因悲思血下成塊以後紅白相間至仲冬後淋瀝未止服藥不效近又少腹重墜兩拗掣痛如束小便至夜點滴不通或以為氣粗窒痛用茜草歸鬚桃仁等通絡不應又以為血虛滑脫用蒲黃石脂石英等鎮攝淋痛更劇脈沉弦予謂此症乃漏久而膀胱氣陷也通絡則漏卮益滲鎮攝則胞門益墜法宜溫而升之固以攝之於理為近用升麻六分菟絲餅赤苓各三錢延胡當歸俱醋炒各二錢阿膠棕灰各一錢半茴香補骨脂俱酒炒各一錢沙苑子二錢一服得溺而掣痛止數服淋漏俱除閉癃遺溺論治胞痹附閉者小便不通癃者小便不利遺溺者小便不禁雖膀胱見症實肝與督脈三焦主病也經云膀胱之胞薄以濡得酸則蜷縮約而不通水道不行又云膀胱不利為癃不約為遺溺此但主膀胱言之也夫膀胱僅主藏溺主出溺者三焦之氣化耳故經云三焦下腧並太陽正脈入絡膀胱約下焦實則閉癃虛則遺溺又云肝脈過陰器其病閉癃又云女子督脈入系廷孔男子循莖下至篡病不得前後此閉癃遺溺所由兼責諸經也分言之閉癃為實遺溺為虛閉為暴病癃為久病閉則點滴難通全資氣化或疏通利竅或用丹溪吐法以升提其氣諸溺閉治法已見小便不通論中此特詳溺癃治法癃為滴瀝不爽惟滋養真陰清熱化氣升提非所宜矣仲景云陰虛則小便難經曰陽入陰分則膀胱熱而小便難東垣云小便不通皆邪熱為病治分在氣在血以渴與不渴辨之渴而不利或黃或澀熱在上焦氣分也宜清肺氣而滋水源黃芩清肺飲閉而不渴熱在下焦血分也宜潤腎燥以導其流滋腎丸若服淡滲之味則陽無以化而陰愈閉窒矣其陰虛血熱渴而澀痛淋瀝者導赤散切忌用五苓或大便水瀉小便澀少五苓散滲泄之若濕熱傳於下焦水道不利益元散清利之若氣機閉塞升降不通二陳湯去半夏加木通滑石升麻以提之若右寸數大肺燥不能生水是氣化不及州都生脈散去五味加紫菀車前子茯苓左寸數大心火盛移熱於小腸天冬麥冬犀角黃連赤茯白芍或腎火衰水不能化金匱腎氣丸或元氣下陷宜升清降濁補中益氣湯加木通車前或血瘀下焦小便閉澀代抵當湯此治閉癃大概也若遺溺一症有睡中自遺者有氣不攝而頻數不禁者有氣脫於上則下焦不約而遺失不知者睡中自遺幼稚多有俟其氣壯乃固或調補心腎自愈寇氏桑螵蛸散惟水泉不止膀胱不藏多是年衰氣弱以氣為水母水不能蓄由氣不固攝也宜參耆歸朮益智五味補骨脂升麻甚至氣脫而遺失不知惟類中風症及大病後有之宜獨參湯大抵遺溺失禁由肺腎膀胱氣虛肺虛補中益氣湯加五味牡蠣腎虛菟絲子散膀胱虛固脬丸夾寒家韭子丸夾熱白薇散滑脫秘元丹牡蠣丸命火衰右歸飲鞏堤丸治水必先治氣治腎必先治肺惟鞏堤丸一方凡心脾肺腎之屬皆宜有因恐懼輒遺者此心氣不足下及肝腎而然宜歸脾湯或五君子煎下元虧損固精丸睡中自遺多屬下元虛冷宜螵蛸丸然遺失不知必交通心腎寇氏桑螵蛸散小兒自遺多屬熱沈氏閟泉丸間或因寒閟泉丸去山梔加山萸補骨脂老人不禁多虛寒大菟絲子丸加減間亦有熱萆薢分清飲節齋謂老人溺頻數者由膀胱血少陽火偏旺宜滋腎中真陰補膀胱津液六味丸加麥冬五味戴氏云老人溺多者由下元虛寒腎不攝水以致滲泄宜八味丸生料鹿茸丸其滴瀝不禁者為真陽不固宜固脬散若不效加減桑螵蛸散晝甚為陽虛補中益氣湯夜甚為陰虛八味丸脬氣不足溺頻晝甚者縮泉丸夜間溺多者八味丸加五味溺頻而少為熱宜滲之四苓散加滑石甘草頻數久而益甚者屬脾虛氣弱補中益氣湯加五味山藥若溺澀得補益甚者為膀胱熱結宜山梔茯苓木通滑石甘草竹葉燈芯溺澀而莖中痛者屬肝腎濕熱龍膽瀉肝湯溺後餘瀝屬腎氣虛茯菟丸加覆盆子益智仁咳而遺溺屬膀胱急茯苓甘草湯不應五苓散可效妊婦溺出不知或由脬熱加味逍遙散或由脾肺氣虛補中益氣湯或由肝腎陰虛六味丸產後小便不禁或脬損固脬丸八珍湯補脬飲加參術或豬羊脬煎俟飢時大劑飲之令氣血驟長遲則難效產育不順致傷膀胱或收生不謹損破尿脬皆能致小水失禁也或由膀胱氣虛加味補中湯此治遺溺大概也胞痹胞居膀胱之中受氣化以藏溺出溺者也經曰胞移熱於膀胱蓋膀胱內別有胞得氣化而為溺以出也若氣痹不通必由膏粱積熱於上作強傷精於下濕熱乘虛結於胞中故痹也經曰胞痹者小腹膀胱按之內痛若沃以湯澀於小便上為清涕蓋以膀胱既虛不能上吸肺氣肺氣不清不能下通水道所以痹塞不利得熱湯之助則小便澀澀微通其氣循經蒸發肺乃暫開清涕亦得上泄矣條其治法由膀胱傷濕致痹而溺澀者腎著湯加萆薢由實熱致痹而溺痛者葵子丸由濕熱致痹而溺不利者腎瀝湯由虛寒致痹而溺閉者巴戟丸其艱澀如淋不痛者非胞病屬腎陰虛六味丸加肉蓯蓉鹿茸其老人精氣已衰猶不絕欲小便澀痛少腹脹閉牽引穀道者腎氣丸晝苦溺澀夜則遺溺者屬腎氣大虧地黃飲子其膀胱氣墜溺道不爽者補中益氣湯石頑有治胞痹案數則醫者忽之今特標為論焉附方氣分黃芩清肺飲見一卷火血分滋腎丸見一卷火淋痛導赤散見一卷溫化氣五苓散見一卷溫濕熱益元散見一卷溫痰氣二陳湯見一卷中風肺燥生脈散見一卷暑腎虛腎氣丸見二卷虛損升清補中益氣湯見一卷中風瘀閉代抵當湯見二卷血遺溺寇氏桑螵蛸散見本卷遺泄腎虛菟絲子散菟絲子五味蓯蓉杜仲牡蠣雞肫皮炒研末服二錢膀胱固脬丸茴香三兩附子五錢戎鹽一錢桑螵蛸炙五錢制菟絲子三兩酒糊丸夾寒家韭子丸家韭子炒六兩鹿茸酥炙四兩蓯蓉牛膝熟地當歸各二兩菟絲子巴戟肉各兩半杜仲石斛桂心乾薑各一兩為末酒糊丸夾熱白薇散白薇白蘞白芍等分滑脫秘元丹龍骨煅三兩靈砂二兩砂仁一兩訶子肉炮十個為末糯米粥丸空心酒下三十丸火衰右歸飲見二卷虛損火衰鞏堤丸熟地菟絲子酒煮白朮各二兩五味益智仁補骨脂各酒炒附子茯苓韭子炒各一兩為末山藥糊丸加人參尤妙心脾歸脾丸見二卷勞瘵肝腎五君子煎參苓術草炮姜精虛固精丸見本卷遺泄虛冷螵蛸丸桑螵蛸炙三十個鹿茸酥炙炙黃耆各三兩煅牡蠣赤石脂人參各二兩為末山藥糊丸鹽湯下兒遺沈氏閟泉丸益智仁茯苓白朮白蘞黑山梔白芍水煎此沈芊綠先生自制方自云用之頗效老人大菟絲子丸桂附菟絲子鹿茸石龍芮各一兩地萸牛膝茯苓杜仲蓯蓉巴戟茴香沉香續斷故紙各三兩桑螵蛸覆盆子五味子各五錢蜜丸濕熱萆薢分清飲見本卷淋濁水火六味丸八味丸俱見一卷中風溺多鹿茸丸鹿茸酥炙椒紅炒桂心附子牡蠣補骨脂石斛蓯蓉雞肶胵炙沉香各一兩桑螵蛸四錢為末酒糊丸酒下失禁固脬湯桑螵蛸酒炒二錢黃耆酒炒五錢沙苑子萸肉各三錢當歸酒炒茯神益母子各二錢生白芍錢半升麻五分羊脬一個煎湯代水再煎此沈芊綠先生尊生全書自制產後胞損失禁方與固脬丸各別晝頻縮泉丸烏藥益智仁煨等分為末酒煮山藥糊丸鹽湯下尤治小兒遺尿滲熱四苓散見一卷暑澀痛龍膽瀉肝湯見三卷諸氣餘瀝茯菟丸制菟絲子五兩茯苓三兩石蓮肉二兩為末酒糊丸鹽湯或米湯下三五十丸咳遺茯苓甘草湯茯苓桂枝各二兩甘草一兩生薑三兩妊婦加味逍遙散見一卷火產後八珍湯見一卷中風產婦補脬飲生黃絲絹一尺剪碎白牡丹根皮白芨各一兩為末水煮必絹爛如餳空心服不得作聲作聲即不效濕痹腎著湯見一卷濕熱痹葵子丸冬葵子赤茯豬苓枳實瞿麥滑石木通黃芩甘草車前子各一錢姜五片濕熱腎瀝湯見本卷淋濁虛痹巴戟丸巴戟一兩半桑螵蛸遠志生地山藥附子川斷蓯蓉各一兩杜仲石斛鹿茸龍骨菟絲子五味子山萸官桂各三錢蜜丸腎虧地黃飲子見一卷中風癃遺脈案族女產後嗽熱小水失禁脈虛數無力由真元不固臨產艱難損傷胞脈所致宜攝固真元佐以甘溫退熱用潞參茯神杞子黃耆白芍五味子川貝石斛牡蠣煅研桑螵蛸炙炙草五服嗽熱減加遠志熟地菟絲餅十服前症漸瘥族姑衰年病後失調遺溺不禁兩尺濡弱症由膀胱血虛溺孔不能約制水液用歸身白芍杞子沙苑子覆盆子杜仲炒核桃肉紅棗熟地炒煎服效後用補中益氣湯而固轉胞交腸論治水液自小腸泌入膀胱胞受氣化變溺以出胞蓋居膀胱中主藏溺泄溺者也東垣曰膀胱雖為津液之腑至受盛津液則又有胞居膀胱之中故經曰胞移熱於膀胱若忍溺入房或溺急疾走水逆氣迫則胞系屈戾名曰轉胞其症臍下急痛小水不通與尋常溺閉自異直指曰此症孕婦多有或忍溺入房使小腸氣逆而不通大腸氣與之俱滯外水不得入膀胱內水不得出膀胱淋瀝急數大便亦裡急頻並因而腹脹治用涼藥疏利小腸仍與通泄大腸胞即歸正小水自流丹溪曰妊婦轉胞疏通無效因思胞為胎壓展在一邊胞系了戾不通爾胎若舉起懸在中央胞系得舒小水自行宜升舉其氣補中益氣湯或再以渣煎服探吐或令孕婦臥榻上將榻倒豎起則胎不壓而溺自通若臨盆之際胎壓膀胱小便不通者以手指托起其胎小水自出丹溪治一婦患此診之兩手似澀重取則弦此得之憂患澀為血少氣多弦為有飲以參朮飲空心服以指探吐少頃又與一服凡與八服而安後歷試皆驗或用參朮湯強忍房事致胞轉而閉者非沉香不治老人轉胞困篤欲死六味湯倍澤瀉少年溺澀蒲黃散滑石散驚憂暴怒氣乘膀胱致胞轉溺閉蔥白湯交腸症由大小腸失於傳送致清濁混淆也或因病後因嗜酒大便前出小便後出丹溪治一婦嗜酒常痛飲忽糟粕出前竅溲尿出後竅六脈沉澀用四物湯加海金沙木香檳榔桃仁木通服愈回春曰一婦病愈後前陰出屎先服五苓散二劑又用補中益氣湯而愈則此症惟婦人有之耳附方氣虛補中益氣湯見一卷中風妊婦參朮飲參術陳草夏地芍歸芎姜棗服後探吐妊婦參朮湯參術陳草夏芍歸服後探吐老人六味地黃湯見一卷中風通治蒲黃散蒲黃滑石等分為末服三錢雞蛋清調下清利滑石散寒水石二兩滑石血餘炭車前子木通各一兩冬葵子一合驚憂蔥白湯陳皮三兩冬葵子一兩蔥白三莖水五升煎三升分三服補血四物湯地芍歸芎通利五苓散見一卷溫脫肛論治肛頭癢痛附脫肛元氣陷下症也惟氣虛不能禁固故凡產後及久痢用力多老人病衰幼兒氣血不足多有之大劑補中益氣湯升麻用醋炒入門曰肺主魄門肺熱則肛門閉肺寒則肛門脫必溫補肺氣前湯加訶子樗根皮以肺與大腸相表裡也如脾胃虛寒瀉痢而滑脫者胃關煎加烏梅五味脾虛下陷而脫者補中益氣湯肝腎陰虛而下陷者補陰益氣煎虛中夾火或熱赤腫痛補中益氣湯加芩連槐花之屬產後脫肛六物煎加升麻或殿胞煎加人參仍用溫湯洗而收之有濕熱下墜疼痛脫肛者抽薪飲或大分清飲腸風下血脫肛者人參胃風湯便秘努掙致脫者人參固本丸加槐角兼痔而痛者四物湯加槐花黃連升麻外煎洗法寒者以荊芥胡蔥煎洗以伏龍肝鱉頭骨灰百藥煎研末油調敷熱者以朴硝白礬湯洗以黃柏面牡蠣粉摻搽焮赤腫痛以田螺去厴入冰片化水搽之小兒脫肛鱉頭炙灰塗之肛頭癢朴硝煎湯熏洗內經曰下者舉之徐之才曰澀可去脫治脫肛之法也古人多用參耆歸朮川芎甘草升麻之類以升之補之或兼用烏梅五味之屬以固之澀之外仍用熏洗收澀之藥則無不愈矣肛頭癢痛風濕火兼病也大腸受濕流注肛頭則作癢秦艽羌活湯得風與濕熱則生蟲而癢神應黑玉丹萹蓄湯外以苦楝根煎湯洗若蟲蝕其肛則上唇有瘡化䘌丸大腸有火則肛門作痛七聖丸秦艽白朮丸甚或便燥腸頭努出下血當歸郁李仁湯丹溪曰凡醉飽入房忍泄前陰之氣歸於大腸木乘火勢而侮燥金故火就燥也大便必秘其疾甚者必以苦寒瀉火以辛溫和血潤燥疏風止痛是其治也宜秦艽白朮丸寬腸丸當歸郁李仁湯附方通治補中益氣湯見一卷中風升提舉元煎見三卷飲食通治參朮芎歸湯參術芎歸耆草芍苓山藥升麻虛寒胃關煎熟地三錢山藥扁豆白朮各二錢黑姜炙草各一錢吳萸五分陰虛補陰益氣煎參草陳柴各一錢熟地三錢山藥當歸各二錢升麻五分產脫六物煎熟地錢半白芍當歸人參各一錢川芎升麻各五分炙草八分產脫殿胞煎當歸五錢芎桂苓草各一錢濕熱抽薪飲見四卷癇濕熱大分清飲見四卷泄瀉腸風胃風湯見四卷泄瀉努脫人參固本丸見一卷中風痔脫四物湯地芍歸芎血熱涼血清腸散地歸芍各錢半芩連荊防芎草升麻香附各五分血虛秦艽四物湯四物湯加秦艽丹防柴柏濕癢秦艽羌活湯羌活錢半秦艽黃耆各一錢防風七分升麻麻黃柴胡甘草各五分紅花細辛各三分蟲癢神應黑玉丹蝟皮四兩豬懸蹄二十五個牛角䚡三兩血餘敗棕各二兩炙槐角一兩半苦楝根皮一兩二錢雷丸脂麻各一兩乳香麝香各一錢酒糊丸下蟲萹蓄湯萹蓄一握水煎蟲蝕化䘌丸桃仁槐子陳艾各三錢紅棗肉杵丸火痛七聖散郁李仁一兩半羌活一兩大黃制八錢桂心檳榔木香川芎各五錢蜜丸白湯下肛痛秦艽白朮丸見本卷便血下血當歸郁李仁湯郁李仁皂角仁各一錢槐花米七分秦艽麻仁當歸尾生地蒼朮各五分大黃制三分熱秘寬腸丸黃連枳殼等分糊丸米飲下五十丸痔漏論治耳痔鼻痔腦漏偷糞鼠瘡跨馬癰附凡澤旁突起高阜為峙竅中突出瘜肉為痔故有眼痔鼻痔牙痔等名至肛邊腫痛發瘡經謂醉飽入房筋脈橫解腸澼為痔又督脈生病癃痔言精氣脫泄陰火流注篡間兩陰之交多患痔疾然陰虛生熱或服餌辛毒如椒酒及固精等藥蓋川椒燒酒最能發痔或用熱藥固精不泄毒氣流注勢必至穿漏矣大腸燥秘及憂恐氣結奔走勞動致瘡孔生管流膿斯成漏矣痔有七肛外發露肉珠狀如鼠奶曰牡痔即外痔肛內腫突膿潰即散曰牝痔肛邊痛癢顆顆發㿔更衣輒出清血曰脈痔腸內結核痛而登廁肛脫曰腸痔因便血注不止曰血痔憂思恐怒立見腫痛大便艱難曰氣痔皆內痔飲酒發動瘡痛流血曰酒痔其形有雞冠蓮花櫻桃胡桃雞心鼠奶之狀久而生蟲便前血射一縷為痔瘻瘻即漏也經云陷脈為瘻近旁穿穴中生脆管流膿不止即為漏有串臀者有串腸者有串陰者有穢從瘡口出者漏卮不塞精血日枯漸成損怯難治宜戒酒色節勞茹淡滋填精血如魚鰾熟地龜膠鹿膠豬脊髓之類立齋論治痔焮痛便秘宜清熱涼血潤燥疏風治漏宜養元氣補陰精大便秘宜潤燥養血紅墜作痛宜瀉火除濕作癢宜祛風勝濕腫痛溺澀宜瀉肝導濕若疝與痔兼患六味地黃丸補中益氣湯並服按痔初起腸頭腫成塊者大腸濕熱也滲而清之如生地槐米黃芩甲片歸尾茯苓枳殼澤瀉等作痛者肺大腸風熱也宣而散之如荊芥元參當歸杏仁乳香木香枳殼銀花等大便秘結者脾腎燥火也清以潤之滋燥養營湯去防風加麻仁白蜜等潰膿者熱勝血也涼以和之秦艽白朮湯去朮加生地槐角等痛兼血者陰虛有火也滋而養之四物湯加阿膠黃芩烏梅地榆等痔血漏膿久不止者元氣不固也升而攝之補中益氣湯耆朮用生去柴胡或暫用樗皮散血痔諸藥不應黑以止之石煤槐花空心烏梅湯下神效氣痔內因七情者調其鬱歸脾湯耆朮用生加枳殼廣皮酒痔多因濕熱釀火者解其毒芩連四物湯槐角丸加金銀花甘草不拘痔漏腸紅通用梅連丸以止其血不論痔瘻蟲痔通用水銀棗子膏以絕其蟲腫痛用洗痔法以魚腥草苦楝根馬齒莧朴硝煎湯熏洗洗翻花痔以荊芥防風朴硝煎洗次以木鱉子鬱金等分加冰片研細水調敷點痔法以蝸牛膠熊膽膠或用田螺水等縮痔法用大鱉頭火煅研細搽效枯痔法以鰾膠一味炒研為末日用一錢砂糖調服久自枯落敷痔法用蠶繭納男子指甲填滿外用童發纏裹燒存性蜜水調敷經云陷脈為瘻音漏留連肉腠言寒氣陷入血中而生瘍漏因瘡穿膿潰不已初則淡紅微腫或小核久則上面槁白內已黑腐淫蟲惡臭生焉故治漏先須透膿用追毒丸再用閉管丸如漏之四邊有硬肉突起閉管丸中加蠶繭二十個炒末和入藥內此方治遍身諸漏皆效治穿腸漏用水安息香搽之十日全消水安息香出波斯國以椰子盛香形似膏藥稀黏黃黑色著手其香透爪甲者為真治漏退管用蝟皮丸去管兼能生肌用聖祖御賜方及明太祖親驗方倘管退漏眼未平宜生肌膏大抵漏瘡孔中必有惡穢之物先用洗藥以露蜂房白芷苦參煎湯熏洗日三次嗣用透管管退嗣用生肌近日專門治漏用韭葉彎刀披開其孔量漏之淺深捻入線藥爛管續用生肌散敷平瘡口待愈愈後仍須滋填精血兼戒房勞奔走及辛熱動風諸發物每見不守禁忌創愈復潰或轉成怯症者有之亟當慎也耳痔耳中生如羊奶內服梔子清肝湯外點硇砂一錢輕粉雄黃各三錢冰片五釐水調和點之效鼻痔鼻中生出瘜肉用甜瓜蒂甘遂炒各四錢枯礬五分共研細淨松香五分為衣香油調為丸每用一丸入鼻內點痔日一次即化臭水而愈腦痔腦中時流臭涕用辛夷二錢羌活獨活防風藁本細辛各五分蘄艾一兩將藥末摻艾內卷作條點火熏鼻即愈或用黃荊樹葉搓塞鼻中效偷糞鼠瘡生近肛門潰膿後極易穿漏腫痛時用屋上干貓屎金魚同搗爛敷患處立消或用貓頭骨炙灰研同酒服亦效跨馬癰一名懸癰生肛門前陰根後交界處初起如松子大漸如蓮子後如桃李用甘草梢四兩水煎服即愈外用生大黃三錢熟石膏一兩紫金錠一塊同搗碎水調敷立止痛若肝經濕熱用龍膽瀉肝湯已成膿者用生黃耆人參川芎當歸各一錢白芷官桂甘草防風各五分一服痛止再服內潰十服肉便生痔漏脈候脈弦絕澀者難治滑大柔和者易治附方晚服六味丸見一卷中風朝服補中益氣湯見一卷中風清火滋燥養營湯見一卷燥通治秦艽白朮湯見本卷便血涼血四物湯見一卷中風再加黃芩黃連名芩連四物湯澀血樗皮散臭椿皮微炒石榴皮黃連地榆阿膠各一兩艾葉三錢炒為末粥飲下二錢調郁歸脾湯見二卷癆瘵止紅梅連丸川連一兩酒浸研末百草霜一兩烏梅即用浸川連酒杵蒸一兩共搗為丸桐子大每空心服四五十丸三日服效十日即愈殺蟲水銀棗子膏水銀一兩紅棗肉二兩共研不見星為度捻如棗核薄綿裹納肛中明日蟲出點痔蝸牛膏蝸牛一個冰片麝香各少許同研爛以瓷器盛次早以汁敷患處定痛熊膽膏熊膽五分梅片一分二味研細以井花水調雞翅掃痔上定痛田螺水以大田螺將針挑開厴蓋入冰片白蜜少許在內少頃螺即化水雞翔蘸水拂之定痛而愈透膿追毒丸胡黃連薑汁炒一兩刺蝟皮炙切炒黃為末二兩麝香二分為細末以軟飯為丸如麻子大每空心服一錢酒下閉口閉管丸胡黃連浮末一兩甲片麻油內煮黃石決明煅槐花炒各五錢為末煉蜜丸麻子大每服一錢空心米飲下早晚日服二次漏深者服四十日愈退管蝟皮丸刺蝟皮大者一張新瓦上炙脆為末象牙一兩研末青黛三錢槐米一兩五錢陳細茶五錢綠豆粉一兩飯丸每服三錢金銀花湯下解毒御賜方夏枯草八兩甘草節連翹各四兩為末金銀花一斤煎濃汁泛丸如龍眼大每早晨鹽湯下三錢初起者半料愈年久者一料愈此聖祖御賜浙江提督陳山凱方也涼血生肌太祖親驗方犀角屑象牙屑乳香沒藥各一兩明礬黃蠟各五錢銅器熔化黃蠟入藥末為丸以連翹金銀花浸酒煮半日服丸每服二十一丸此明太祖驗方也長肉生肌膏雞旦黃去白熬出油三錢輕粉研細一錢乳香血竭龍骨研細各五分入油內和勻日以雞翎塗患孔內外蓋膏藥半月可以完口退管透管方麻油四兩安鍋內以雞子四個女發一握蓋上面慢火煎至油干其發亦化空心陳酒下雞旦以醉為度管自出通治槐角丸槐角炒黃芩地榆當歸防風枳殼炒各等分為末酒糊丸桐子大每服六十丸空心米飲下極效或加烏梅亦妙痔漏脈案某痔血延久不痊便後血色鮮紫雖似腸胃遠血然恐腸盡肛頭舊損所滲沿便之一線而來尾閭不禁滄海易枯無怪面色萎悴也治用涼以潤之黑以止之固以攝之槐米炒柿餅煅烏梅蒸爛側柏葉搗汁地榆炒百草霜熟地杵膏加煉蜜丸服效王氣虛下陷痔墜腫痛兼脫肛膿血用補中益氣湯加槐米茯苓外用牡蠣粉黃柏面安紙上承以布托肛入數次效某便燥出血痔核腫痛參東垣潤燥通幽二湯用熟地生地桃仁麻仁紅花當歸酒潤杏仁甘草枳殼蜜丸此入血分潤燥結服效諸蟲論治氣化之生蟲也木朽為蠹草腐為螢日氣蒸雨變生螟螣臟腑之生蟲也肥甘不節生冷失宜中脘氣虛濕熱不運諸䘌乃生如發症龜瘕疳蟲屍疰狐惑應聲之類其候心嘈腹痛面色萎黃沉默嗜眠食減羸瘦唇有紅白點嘔多青綠涎或專嗜生米茶葉泥螺瓦灰之類此在小兒為多其痛時作時止其脈忽大忽小其腹有氣梗起往來痛定便能食者是古分五臟蟲形如心之蟲曰蛔脾之蟲曰寸白腎之蟲如刀截絲縷肝之蟲如爛杏肺之蟲如蠶諸蟲皆能殺人惟肺蟲蝕肺令人癢咳至咯血聲嘶最為難治又有三蟲長蟲赤蟲蟯蟲惟蟯蟲最能病人治之必於月初蟲頭向上空腹先飲肉汁令其聞香聚而求食以迂仙丹下之蟲下淨乃啜粥止之蟲性喜甜得甘則動得苦則止得酸則軟得辛則伏如烏梅丸連柏之苦梅醋之酸椒姜之辣古法治傷寒蛔厥理中湯加川椒五粒檳榔五分臟寒吐蛔及胃腑咳嘔長蟲出烏梅丸胃虛蛔上入膈理中安蛔丸諸蟲攻胸急痛掃蟲煎蟲齧心痛貫心則死蕪荑散蟲痛口流清涎以烏梅川椒姜煎服腹有蟲積萬應丸去幹漆蟲痛腹熱化蟲丸蟲痛肢冷集效丸蟲積堅久脹痛黃瘦獵蟲丸一切蟲積追蟲丸元氣實者木香檳榔丸虛寒蟲動嘔瀉成疳溫臟丸脾疳蟲積肚大肌消齦腐生瘡六味肥兒丸蟲積嗜生米泥炭等物為蟲疳以使君子榧子檳榔南星研細砂糖水調服蟲血積久成膈嘔涎秦川翦紅丸肺嗽有蟲骨蒸成瘵百部膏屍疰傳染獺肝丸鰻魚湯消渴蟲耗陰液苦楝根白皮一握切焙加麝香少許水煎服則蟲下渴止殺寸白蟲榧子四十九枚砂糖水煮每上旬平日空心服七枚七日盡蟲化水腹生鱉瘕白馬溺飲之鱉化水嘔吐蝦蟲銅綠煎湯飲之遂絕口發言腹應聲搗藍汁飲或服雷丸湯狐惑症狀類傷寒起臥不安四肢沉重蟲食其臟上唇生瘡為惑必聲啞宜桃仁湯或甘草瀉心湯蟲蝕其肛下唇生瘡為狐必咽乾宜苦參湯洗以雄黃銳散納穀道中穀道微癢糞後蛆蟲宜調補脾胃四君歸脾溫臟等湯或化䘌丸外用楝根白皮煎湯洗之大腸蟲出行坐不得用鶴蝨灰五錢水調服自愈小腸濕熱溺竅蟲出導赤散加使君子萆薢黃柏婦人陰蝕蟲癢用蛇床子煎湯洗拭乾內摻桃仁雄黃等細末渾身蝨出血肉俱壞飲鹽醋湯半月即安陰毛生蝨蝨有八腳生肉中出毛孔肝腎陰虧內服六味地黃丸外以白果肉擦之筋肉化蟲如蟹走皮膚內作聲急用雄黃雷丸各一兩為末摻豬肉上炙熟食儘自愈凡治蟲勢驟急者行攻逐如大黃黑醜乾漆檳榔三稜莪朮等蟲去則調其脾胃勢緩者用制伏如川連胡連烏梅苦參苦楝川椒蕪荑鶴蝨等脾弱者兼運脾胃滯者兼消滯脾胃氣強蟲乃不生尤宜審臟氣之虛實而治之毋專恃攻下為也諸蟲脈候乍大乍小者蟲脈巢氏曰腹痛脈當沉弱若反洪大者蛔蟲也凡蟲痛時作時止或大痛不可忍面色或青或黃或白而唇則紅附方攻下遇仙丹牽牛檳榔大黃三稜蓬莪朮木香共研末用皂角子研碎煎濃湯去渣煮麵糊為丸以茶清下四十丸臟寒烏梅丸見三卷嘔吐蛔厥理中湯見一卷中風胃虛安蛔散見三卷嘔吐攻胸掃蟲煎青皮小茴檳榔榧子肉烏藥吳茱萸烏梅雄黃硃砂前七味煎好去渣入後二味再煎攪勻徐徐服之貫心蕪荑散見三卷積聚蟲積萬應丸三稜莪朮陳皮麥芽使君子神麯雷丸乾漆檳榔木香蕪荑鶴蝨胡黃連砂仁為末米醋糊丸綠豆大薑湯下腹熱化蟲丸鶴蝨胡粉炒苦楝根不出土者炒檳榔各一兩蕪荑使君子各五錢枯礬一錢為末水丸米飲下蟲厥集效丸大黃炒一兩五錢鶴蝨檳榔訶子皮木香蕪荑乾薑製附子各七錢五分蜜丸烏梅湯下婦人醋湯下蟲積獵蟲丸蕪荑雷丸桃仁乾漆炒雄黃錫灰皂角燒檳榔輕粉使君子榧子肉為末湯浸蒸餅杵丸綠豆大每服六七分蟲積追蟲丸黑醜取頭末檳榔各八錢雷丸醋炒南木香各二錢為末用茵陳二兩大皂角苦楝根白皮各一兩共煎濃汁為丸如綠豆大壯人服四錢弱人小兒服錢半於五更時以沙糖水吞下去惡毒蟲積二三次以粥補之攻下木香檳榔丸檳榔木香鶴蝨炒貫仲錫灰乾漆炒使君子輕粉雷丸巴仁為末麵糊丸麻子大每服二十丸虛寒溫臟丸參術歸芍苓川椒炒榧子肉使君子檳榔炮姜吳萸泡為末神麯糊丸白湯下或加附子脾疳六味肥兒丸黃連陳皮川楝子炒神麯麥芽炒蕪荑為末糊丸麻子大每服二十丸米飲下蟲膈秦川翦紅丸雄黃另研木香各五分檳榔三稜煨莪朮煨貫仲去毛乾漆炒煙盡陳皮各一兩大黃一兩五錢為末麵糊丸每服五十丸肺蟲百部膏取百部肥實者酒浸竹刀刮去心皮同款冬百合沙參麥冬五味紫菀貝母杏仁白蜜等熬膏殺蟲治嗽屍蟲獺肝丸獺肝一具陰乾為末水服二錢日三次治鬼疰傳屍傳屍鰻魚湯鰻魚淡食治虛損骨蒸勞瘵屍蟲應聲雪丸湯雷丸一味煎狐惑桃仁湯桃仁去皮尖炒槐花米各三錢生艾五錢大棗十枚水煎狐惑甘草瀉心湯見三卷痞滿外治雄黃銳散見四卷痢調郁歸脾丸見二卷勞瘵蟲蝕化䘌丸見本卷脫肛濕熱導赤散見一卷溫補腎六味丸見一卷中風蟲脈案周自幼糞後下小白蟲如蛆肛內微癢中年時發時止此得之腸虛受風宿病再為濕熱迫注遂至化䘌延久未愈憶友人亦於童年患此服攻逐殺蟲之劑罔效後有人令服人乳數月蟲絕知徒商逐蟲無濟也因疏溫臟丸用四君子湯加歸芍薏蓮川椒榧實使君子俱煨炮薑檳榔為末神麯糊丸空心白湯下輒效
