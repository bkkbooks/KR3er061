當由産後浴早水濕乘虛襲入子宮下部先腫漸至通體重著殆傷濕之見症也開發腠理逐去濕邪宜羌活滲濕湯加陳皮半夏防己茯苓皮一啜濕從汗解身可轉側浮腫漸退再為健脾利濕飲食亦進以婦體素肥氣鬱生涎時或昏冒用溫膽湯調理而痊某氏露産冒暑煩熱汗出直視不語脈軟數醫謂惡露未行治宜逐瘀豫曰直視者足太陽經血虛筋急牽引直上也不語者暑先入心手少陰脈系舌本絡舌旁邪入營分舌系縮也煩熱則易鬱冒汗多亦慮液亡失治必變昏痙危疴用生脈散加生地當歸石斛連翹丹皮木瓜甘草藕汁沖服諸症退能言又加減前方數十服得安張氏中年産育旬日外鮮紅下注自汗身熱此陰虛陽無所附也用十全大補湯去桂加炮薑小麥煎湯二服汗收血止是症血去則亡陰汗多則亡陽産後危症也徐氏産後夜熱煩渴脈促數因決其胎必下當夜遂産惡露甚少逾日鮮血暴注暈絶用潞參茯神熟地炮薑荊芥醋炒山梔甘草俱炒黑石斛阿膠神蘇血止楊氏産後鮮血足膝熱乳少脈芤宜攝固下元兼升舉中氣桑螵蛸炙研熟地杞子杜仲鹽水炒黃耆蜜炙升麻二服血止去桑螵蛸加生黃耆甘草當歸紅棗而乳倍常李氏産後鬱冒昏睡不語慮其痙厥用鮮石菖蒲根汁熱服漸次蘇醒能言詢所苦但云目暗咽塞心系下引遂悶絶不知人此為風火痰阻竅也因用桔梗荊芥甘菊炒連翹貝母茯神山梔菖蒲汁沖二服而安張氏官署坐蓐輒動鄉思經旬宵熱如烙脈虛疾插髻銀簪一夕色黑以紙拭去明晨如漆駭極豫云此産後血虛火炎汗澤所蒸耳宜滋陰退熱以熟地白芍丹皮當歸丹參石斛茯神杞子甘草四服熱退簪色不變矣去丹皮丹參加棗仁山藥蓮子蜜丸服愈此前取甘涼除熱後取酸澀安神吳氏蓐損不復寒熱往來自汗咳嘔吐沫心悸耳鳴脈虛數經言陽維為病苦寒熱陽失維護奇脈已損況中宮小鎮致咳嘔悸眩肝陽升逆面色忽青忽赤延為難治惟大便未溏腎關未撤尚堪借箸擬晨服黃耆建中湯去姜加參苓山藥橘白衛外扶中晚服熟地杞子俱炒牡蠣醋煅棗仁白芍茯神五味蓮子小麥煎服攝陰斂陽症減背時凜寒晨服方中再加鹿角膠外以白胡椒末摻布膏藥貼背脊第三椎至第七節仍照前分早晚各服五七劑乃安巢氏初春小産寒熱頭痛煩嘔汗後復熱血下如豆汁篡間糜損脈右洪大左沉數此溫邪化熱乘虛襲入下焦也以豆豉山梔蔞仁鮮生地石斛知母麥冬丹參阿膠血稀熱減去知母阿膠加丹皮竹葉心元參汗透身涼而脈和鄒氏冬寒當産艱難損動元氣嗣以月內便泄交春寒熱往來痰嗽汗泄晡時火升頰紅唇燥食入嘔滿小腹痛墜瀉利稀白無度支離委頓所服丸劑一味混補不顧滋膩豈胃弱火衰食已不化小腹重墜氣更下陷尚堪滑膩增瀉浸至蓐勞莫挽矣急用溫中運脾痛利可減嘔滿可除炮薑小茴益智仁茯苓白朮半夏曲穀芽俱炒橘白數劑利止寒熱減食亦知味去炮薑小茴穀芽半夏曲白朮橘白等加砂仁熟地炭潞參五味丹皮山藥蓮子叉斛虛陽漸退並去益智茯苓加甜杏仁茯神白芍百合嗽止調理而康乳症論治乳症多主肝胃心脾以乳頭屬肝經乳房屬胃經而心脾鬱結多見乳核乳岩諸症乳癰焮腫色紅屬陽類由熱毒婦女有之膿潰易愈乳岩結核色白屬陰類由凝痰男婦皆有惟孀孤為多一潰難治且患乳有兒吮乳易愈無兒吮乳難痊其瀝核等日久轉囊穿破洞見肺腑損極不復難以挽回而乳岩尤為根堅難削有歷數年而後痛歷十數年而後潰者痛已救遲潰即不治須多服歸脾養榮諸湯切忌攻堅解毒致傷元氣以速其亡乳汁為氣血所化而源出於胃實水穀精華也惟衝脈隸於胃故升而為乳降而為經新産三日後發寒熱名蒸乳宜逍遙散去朮少婦初産乳脹不得通暢宜清利連翹金貝煎若産多乳少由氣血不足宜滋補異功散加歸芍杞子熟地蔞仁仍以羹臛引之産後乳自出屬胃氣虛宜固補七福飲加黃耆五味子以攝之乳多脹痛而溢者以溫帛尉而散之小兒吮乳鼻風吹入令乳房壅結腫痛名外吹不急治多成乳癰內服栝蔞散外以南星末敷之甚則連翹金貝煎孕婦胎熱寒熱乳腫名內吹用橘葉散治之新産兒未能吮乳余乳停蓄滋脹發熱內渴腫硬結痛名妒乳宜擠去宿乳或吮通之以貝母栝蔞甘草節木通煎服倘兒或不育産母蒸乳寒熱脹痛宜斷乳法以炒麥芽一兩煎服消之有氣血頗壯乳汁不即下者通草豬蹄湯通草散或祕傳湧泉散行之痰氣阻閉經絡乳汁不下肥人為多神效栝蔞散疏降之或以絲瓜絡連子燒存性酒下三錢蓋被取汗即通其氣血虛虧乳汁不下玉露散或八珍湯加黃耆麥冬調補之因肺胃虛寒乳汁不下千金鍾乳湯溫養之婦女膽胃二經熱毒壅遏氣血乳腫焮痛名乳癰初起寒熱腫痛肉色焮赤宜涼血疏邪四物湯加柴胡山梔丹皮貝母栝蔞甘草乳房結核腫痛色赤宜疏肝清胃內服牛蒡子湯外用活鯉魚連頭骨搗爛以香臘槽一團研勻敷上即消氣血凝滯結核不散連翹飲子肝失條暢乳癰結核寒熱腫潰清肝解鬱湯心脾郁傷乳癰發熱結核腐潰歸脾湯耆朮草生用乳癧腫痛用大貝母白芷乳香沒藥當歸身每服四錢白酒下乳癧潰爛用兩頭尖雄鼠糞土楝子經霜者佳露蜂房各三錢俱煅存性研末分三服酒下間兩日一服痛止膿斂如膿成不潰或膿水清稀用托裡消毒散潰久不斂用桑根木芝或菌燒灰和梅片末摻之即愈乳內結小核一粒如豆不紅不痛內熱體倦月事不調名乳岩急早調治若年久漸大腫堅如石時作抽痛數年潰腐如巉巖深洞血水淋瀝者不治潰後大如覆碗不痛而癢極者內生蛆蟲也症因憂思鬱結虧損肝脾氣血而成初起小核用生蟹殼爪數十枚砂鍋內焙研末酒下再用歸陳枳貝翹薑白芷甘草節煎服數十劑勿間可消蟹爪灰與煎劑間服曾經驗過若未消內服益氣養榮湯外以木香餅尉之陰虛晡熱加味逍遙散去焦術加熟地寒熱抽痛歸脾湯元氣削弱大劑人參煎服可消若用攻堅解毒必致潰敗不救凡潰後最忌乳沒等藥産後兩乳伸長細如雞腸垂過小腹痛難刻忍名乳懸此怪症也偶亦有之急用芎歸各一斤切片只取四兩水煎服令産婦伏桌上下置火爐將余片芎歸入爐漫燒以口鼻及乳吸烟令上如藥盡未收如前法煎服熏吸便可縮上否則用萆麻子三粒研塗發頂心少頃便去之即收附方思郁歸脾湯見二卷勞瘵虛損益氣養榮湯參苓陳貝耆地芍歸芎香附各一錢甘草桔梗各五分生白朮二錢姜水煎蒸乳逍遙散見一卷火清利連翹金貝煎金銀花土貝母蒲公英夏枯草各三錢紅藤七錢連翹五錢花粉三錢酒煎補脾異功散見一卷中風補中七福飲見三卷郁外吹栝蔞散栝蔞乳香酒煎內吹橘葉散柴芩青陳芎梔翹石膏各一錢橘葉二十張通乳通草豬蹄湯通草一兩同豬蹄煮汁服通利通草散柴桔瞿麥花粉各一錢通草七分青皮芍翹芷草木通各五分水煎通乳湧泉散王不留行白丁香漏蘆花粉殭蠶甲片為末每服四錢用豬懸蹄煮汁調下此方與薛按湧泉散不同疏降神效栝蔞散栝蔞一個研生甘草當歸各五錢乳香沒藥各一錢酒煎服良久再服治一切癰疽消腫潰膿通補玉露散參苓芎芷歸芍桔各一錢甘草五分水煎補虛八珍湯見一卷中風溫養千金鍾乳湯石鐘乳四錢甘草二錢漏蘆二錢通草栝蔞根各半兩水煎一方有桂心涼血四物湯見一卷中風肝胃牛蒡子湯陳皮牛蒡山梔金銀花甘草栝蔞黃芩花粉連翹角刺柴胡青皮水煎和酒服結核連翹飲子連翹川芎栝蔞角刺橘葉青皮甘草節桃仁各一錢水煎和肝清肝解鬱湯四物合二陳再加青貝蘇桔梔遠志木通香附姜煎膿清托裡消毒散參耆苓術芎歸芍各一錢銀花白芷各七分甘草五分煎腫痛木香餅子木香五錢生地一兩杵膏和勻作餅另患處大小貼之以尉斗尉之補托托裡散參耆各一錢生術熟地歸芍苓陳各八分水煎乳症脈案某氏孀居右乳潰膿已穿六孔左乳核堅抽痛寒熱食少脈弦數審為肝脾鬱結氣血虧損為疏濟生歸脾湯其戚屬云前服歸脾反痛奈何因檢前方耆術皆炒用豫謂此致痛之由也但生用自效彼瘍醫不諳藥性生熟耳三服寒熱止食進前湯加栝蔞貝母白芍陳皮五服右瘡平左核俱軟以前藥為丸服而消許氏産後乳頭紅腫焮痛用鮮天門冬搗汁和酒蒸熱服以渣敷患處兩三次愈何氏乳房結核症屬陰寒用鹿角尖磨水酒沖服效吳氏暑月左乳焮腫成膿寒熱往來脈右小數左弦長症由肝鬱生火仿清肝解鬱湯內用當歸白芍大貝栝蔞天冬乳香丹皮山梔甘草銀花外用內消散加減甲片乳香沒藥歸尾角刺生大黃黃芩蜜調敷左乳頭潰根盤漫腫右乳又硬急用內托帶消法生黃耆天冬栝蔞香附歸身白芍貝母桔梗陳皮甘草一服痛定左瘡孔膿稠右腫稍軟又數服數敷根盤消散瘡口用生肌散得平張氏産後妒乳去冬潰未即斂今春近旁腫痛夫乳頭屬厥陰乳房屬陽明今患在乳頭不致轉囊但潰後藥忌乳沒消腫宜托消兼用旋覆花香附生大貝黃耆生栝蔞廣皮鬱金甘草節當歸二服痛止腫軟四服潰斂何氏左乳結核經六七載潰後深洞如碗是名乳岩由脾肝鬱結氣血失暢結核漸大潰則巉巖深陷可畏一僧猶用乳沒破耗氣血不知年衰茹素日夕抽痛膿水清稀營衛日虧毒奚由化恐三伏難延矣峻補氣血托裡滋液患口雖難遽斂尚冀痛勢略定遷延歲月耳八珍湯去炒術加生耆五味麥冬大貝數服膿稠痛緩入夏延秋患內作癢者肉腐蛆生以烏梅肉臘雪水浸雄黃末雞羽蘸抹其弟婦張氏並系早孀亦患乳核二十餘年未潰堅大如胡桃勞則抽痛脈來沉緩症屬郁損心脾用歸脾湯加香附汁炒熟地牡蠣粉大貝忍冬藤數十服而核漸軟熱入血室論治凡診婦人先問經候婦人病熱值經水來邪隨血去其病自愈若邪踞半表半裡經水適來適斷血舍空虛熱邪陷入晝靜夜劇寒熱如瘧煩渴耳聾譫語見鬼此為熱入血室小柴胡湯加生地黃主之凡經行後似瘧譫語便是熱入血室蓋血為邪迫上入肝經肝受邪則譫語見鬼邪入膽經則血結於胸手觸之輒痛非藥所及故當刺期門穴屈乳頭向下盡處骨間是仲景云婦人中風惡寒發熱經水適來得之七八日熱除脈遲身涼胸滿如結胸狀者刺期門若晝則明瞭暮則譫語治無犯胃氣及上二焦活人以小柴胡湯主之邪入血分故發狂且譫語屬陽明胃經者居多故戒犯胃氣陽明病下血譫語此為熱入血室隨其實瀉之犀角地黃湯加丹參木通或加味四物湯汗出愈如寒熱有時經來適斷晝明瞭暮譫語醫用剛劑遂胸膈不利涎潮上湧喘急昏冒當先化其痰後除其熱用一呷散再用小柴胡湯加生地黃如寒熱譫語胸脅滿如結胸狀此邪與血結用陶氏小柴胡湯去參棗加生地栝蔞桃仁丹皮山楂肉若少陽本經血結自甚必少腹急痛小柴胡湯去參甘棗加延胡當歸尾桃仁若熱入血室譫語如狂血逆心包胸中滿痛為血結胸用桂枝紅花湯加海蛤桃仁若寒熱如瘧經水適來狂言見鬼或脅下硬脾陽虛者乾薑柴胡湯若熱入血室譫語發狂不省人事者牛黃膏按此症必寒熱譫語總宜小柴胡湯加減其結胸少腹滿痛或小陷胸湯加丹參赤芍陳皮枳殼或桃仁承氣湯玉燭散選而用之附方和解小柴胡湯見一卷溫瀉熱犀角地黃湯見一卷溫涼血加味四物湯四物湯加丹梔柴龍膽草化痰一呷散蔞貝芩連丹梔柴草散瘀陶氏小柴胡湯柴芩夏草地丹桃仁楂肉或加犀角栝蔞血結桂枝紅花湯桂芍草丹紅花或加海蛤桃仁方出王海藏燥脾乾薑柴胡湯柴胡四兩花粉桂枝各一兩半牡蠣粉乾薑炙草各一兩每服五錢溫服取汗譫狂牛黃膏牛黃二錢半硃砂鬱金丹皮各三錢腦子甘草各一錢為末蜜丸桐子大每服一丸胸痞小陷胸湯見三卷痞滿攻瘀桃仁承氣湯見一卷疫去瘀玉燭散見六卷腹痛血結海蛤散海蛤滑石甘草各五錢芒硝一兩為末每服二錢用雞蛋清調下熱入血室脈案丁氏秋間寒熱似瘧入暮譫語潮熱少腹滿此為熱入血室用小柴胡湯去參姜棗加丹皮赤芍生地楂肉生歸尾三五劑瘳危氏夏初時疫恰值經斷血海虧虛壯熱陷里口燥汗多夜煩不寐用清化飲加山梔澤蘭藕汁清理血分而愈胡氏冬溫化熱月信適來邪熱搏血醫用清解外不甚熱而臍腹脹痛小水赤澀用導赤散加紅花桃仁延胡車前子再劑愈眭婦傷寒發熱咳嘔右脅刺痛邪在少陽未解忽經行少腹煩悶醫不知熱陷血海且有無犯胃氣及中上焦之戒猶用杏蔞穀芽等味煩悶益劇仿陶氏加減小柴胡湯去參棗加生地丹皮赤芍鬱金山梔枳殼數服而病霍然韋氏溫熱症煩渴昏譫脈虛促不受按此必病中經行也詢之則初病旬日內再至矣以澤蘭赤芍生地麥冬山梔赤茯連翹石菖蒲汁藕汁沖服先清血分熱邪昏譫已減後去澤蘭赤芍加白芍當歸炙草紅棗酸甘和血得安痃癖癥瘕諸積論治大全良方分痃癖癥瘕八瘕癥痞食癥血癥血瘀凡七門多婦科下部症而名目紛沓症狀相近反遺腸覃石瘕今統敘而條分之以類相從不淆亦不眩矣痃者近臍左右各有一條筋起急痛因氣而成如弦狀名曰痃癖者僻在兩肋間有時而痛名曰癖疝瘕者小腹氣聚成塊或上逆或下墜也八瘕者黃瘕青瘕燥瘕血瘕脂瘕狐瘕蛇瘕龜瘕皆胎産經行氣血不調之所生也癥者積堅不可推移痞者氣壅不得宣暢既有食癥血癥不應復出癥條宜改痰痞為優傷食成積堅而難移名食癥瘀血成塊堅而難移名血癥若腹中血瘀則留滯不行未至成塊者也別有石瘕生胞中腸覃生腸外詳載內經亦癥癖之類併為條列症治於後痃癖二症皆陰陽不和冷氣搏結經絡血氣作楚痃近臍左右兩條筋起急痛大如臂小如指癖隱兩肋冷則痛發宜蔥白散再服烏雞丸若脅腹脹痛肝脾失和木香順氣散去蒼朮加鬱金延胡疝瘕小腹有塊或時動移因損傷胞門宜八珍湯加疏氣藥血虛受寒宜寬脹湯加歸芍氣虛下墜補中益氣湯血瘀氣逆當歸散石瘕生胞中由寒客子門子門閉塞惡血當瀉不瀉衃以留止日益大狀如孕堅如石月事不下見晛丸加減或以坐導藥下之八瘕皆生於左胞宮右子戶多由經行交合小腹滿急經血瘀阻因成瘕聚如懷孕甚則溺澀痛苦如淋今人無子一黃瘕經行不利左脅氣結陰中刺痛淋露黃汁用坐導皂莢散二青瘕新産浴早風襲瘕聚左右脅崩中不禁下青汁用坐導戎鹽散三燥瘕經行胃熱心煩汗多大便艱澀瘕聚如杯加味四物湯四血瘕經行勞動感寒留絡不去腰腹急痛宣血瘕方或調經散五脂瘕新産交合早胞傷子戶失禁精血雜下如膏宜坐導脂瘕方六狐瘕經行受驚心志恍惚邪入於陰月閉溺難宜狐瘕方七蛇瘕經後陰未復食飲誤中虺毒成形長而㽲痛宜蛇瘕方八龜瘕經行浴水水精與邪氣襲入子戶形如小拌少腹切痛宜龜瘕方此照巢氏病源刪節爽淨簡要有體痰痞涎沫凝結為痰氣道壅滯為痞中脘痰氣不利砂枳二陳湯痰結胸滿順氣導痰湯心下痞發熱而嘔半夏瀉心湯心下積冷如覆杯按之有水聲熱手尉之如冰脈沉遲三聖散吐之次服白朮調中湯食癥脾胃先弱飲食失調生冷不化日漸成塊治先主疏導而佐以和中大和中飲或消食丸若氣壅血滯形寒者烏藥散脾氣虛血不行者芎歸四君子湯脾氣鬱血不行者歸脾湯肝脾血燥不行者加味逍遙散血癥經水不調結而成塊臍下冷痛五物煎情志郁損氣血乖違加味歸脾湯恚怒傷肝加味逍遙散産後惡露失笑散血積脹滿當歸活血湯肝脾虛損芎歸六君子湯凡癥塊有形皆正虛邪實宜扶正除邪毋輕議攻伐也薛云此症多因七情虧損五臟如脾統血肝藏血故郁傷脾怒傷肝者多患脅腹作痛正肝脾經症也宜養正則積自除血瘀經水不行或産後惡露未淨得寒則澀為瘀久而不消則為癥腹痛畏手按者內有血瘀通瘀煎加桃仁延胡牛膝怒傷肝者脅腹脹痛化肝煎郁傷脾者食減刺痛歸脾湯腸覃寒氣客腸外與衛氣搏癖而內著瘜肉乃生大如雞卵漸如懷子按之則堅推之則移月事以時下是氣病血未病也二陳湯加香附若堅久作痛宜晞露丸統按前症宜辨新久有形無形或痛不痛動不動在氣在血在胸脅在少腹在衝任在腸外在胞宮新者易治久者難治痛猶通連氣血不痛則另結窠囊瘕者假也無形而聚亦能散癥者徵也成形而堅不可移成形者或由食積為食癥由血結為血癥無形者但在氣分氣滯則聚而見形氣行則散而無跡痃癖與痛俱現不痛則隱痰氣居多疝瘕氣結石瘕血結八瘕阻於胞宮腸覃生於腸外月事不異又氣血痰沫所成痰痞各分寒熱且痰有物而痞無形其狐瘕蛇瘕鱉瘕異氣所感或飲食誤中留聚臟腹假血而成與宿血之自內而凝為癥為瘀者不同古法敗梳治蝨瘕銅屑治龍瘕曲柏治米瘕石灰治酒瘕理可類推矣血瘕血癥血瘀血同而新久分且血必隨氣氣行則血行故治血先理氣又必察其正氣衰旺若正氣已虛必先補正乃可除邪或兼外治法助之阿魏膏琥珀膏三聖膏古方治死血食積痰飲成塊在脅用化積丸治氣血鬱結食積脹痛用開鬱正元散氣血兼治寒熱互施治血積月水不調用當歸丸血瘀痛不可忍用琥珀散余如血竭散牡丹散俱主熱桃仁煎三稜煎並主攻乃寒則溫之結則散之堅則削之也其峻厲猛劑如硝石丸硇砂丸巴豆丸乾漆散或不得已用之恐傷元氣後成不救宜仿立齊景嶽治法為穩準繩以癥瘕並屬血病綱目謂癥瘕積聚並起於氣以瘕屬血病者氣聚而後血凝也立齊治一婦內熱作渴腹瘕如雞卵漸大四寸許經水三月一至凡瘕聚癥塊在子宮則不孕在衝任則不月肢體消瘦脈洪而虛左關尤甚此肝脾鬱結症也外貼阿魏膏午前用補中益氣湯午後用加味歸脾湯肝火稍退脾土稍健用六味丸歸脾丸間服又日用蘆薈丸二服空心以逍遙散下日晡以歸脾湯下調理年餘而愈又治一婦腹塊上攻作痛吞酸痞悶面色青黃此肝脾氣滯症也六君子湯加芎歸柴連木香吳萸各少許二服又以歸脾湯送下蘆薈丸三月餘肝脾和諸症退以調中益氣湯加茯苓牡丹皮而經調景嶽論瘀血成形初成形則根盤未固痛在臍腹者五物煎決津煎如病氣形氣俱實腹脹痛甚者通瘀煎元胡當歸散稍久而堅者消磨之三稜煎萬病丸形氣強壯瘀滯不行腹脹痛甚者下之桃仁承氣湯或穿山甲散然須詳慎其氣壅瘕聚為脹為痛者排氣飲木香順氣散如血中之氣滯為瘀為痛者通瘀煎調經飲疝瘕氣聚者荔香散肝氣逆而為聚者解肝煎三焦壅滯氣道不利中滿腫脹者廓清飲李氏曰治癥瘕者調其氣破其血消其食豁其痰衰其大半而止不可峻攻以傷元氣且扶脾胃待其自化愈後用大小烏雞丸八珍湯交加散交加地黃丸調之若用攻擊胃氣先傷或待塊消盡而後補養遲不及矣癥瘕脈候婦人積聚疝瘕脈弦急者生虛弱者死少陰脈浮而緊緊則疝瘕腹中痛半産而墮傷浮則亡血惡寒絶産附方除冷積蔥白散地芍歸芎參苓姜桂朴枳木香茴香青皮麥芽神麯苦楝子三稜莪朮等分為末每服三錢加連須蔥白食鹽煎補虛烏雞煎丸參耆丹術烏藥蛇床子各一兩桂心附子川烏紅花各三錢蒼朮一兩半白芍莪朮陳皮延胡木香肉蔻熟地琥珀草果各五錢研細以烏雄雞一隻去肚腸毛翅將上藥末納雞腹中用瓷瓶入好酒一斗同煮去骨焙乾為末煉蜜和丸桐子大每服三十丸當歸湯下脅脹木香順氣散木香香附檳榔青陳砂枳朴蒼朮各一錢炙草五分氣血八珍湯見一卷中風陰疝寬脹湯檳榔官桂木香沉香大腹皮青皮各一錢香附小茴各錢半水煎加食鹽七分補中補中益氣湯見一卷中風血瘀當歸散見本卷調經石瘕見晛丸見三卷積聚黃瘕皂莢散皂角一兩炙去皮子川椒一兩炒去汗細辛一兩半搗末囊盛大如指長二寸納陰中惡水畢出以溫湯洗之青瘕戎鹽散戎鹽一升皂角五錢炙去皮子細辛一兩同上坐導燥瘕加味四物湯四物湯加延胡桃仁砂仁紅花香附莪朮水煎血瘕血瘕方乾薑烏賊骨炙各一兩桃仁去皮尖一兩研末酒服方寸匕日二服血瘕調經散或作飲見本卷調經脂瘕脂瘕方皂莢七錢半川椒細辛礬石五味乾薑各五錢坐導法同前狐瘕狐瘕方取新死鼠一枚以新絮裹之包以黃泥煅研為末以桂心末二錢半調勻酒服方寸匕蛇瘕蛇瘕方大黃黃芩芒硝各五錢炙草三錢烏賊骨二枚皂角炙一兩半水煎芒硝後下服十日後再服瘕即下龜瘕龜瘕方大黃乾薑附子桂心細辛白朮䗪蟲王䱉側子研末酒服方寸匕日三服痰氣砂枳二陳湯砂仁枳殼加二陳湯痰結順氣導痰湯導痰湯見一卷中風此加木香厚朴痞嘔半夏瀉心湯見一卷溫吐積三聖散見一卷中風痰痞白朮調中湯白朮茯苓澤瀉橘紅各五錢甘草一兩乾薑官桂砂仁藿香各二錢半為末白湯化蜜服食癥大和中飲見三卷飲食食癥消食丸楂肉神麯麥芽萊蔔子青皮陳皮香附各二兩阿魏醋浸研一兩為末以湯泡蒸餅為丸薑湯下寒滯烏藥散烏藥莪朮桂心當歸木香桃仁青皮等分為末每服二錢熱酒下脾虛芎歸四君子湯芎歸加四君子湯脾虛歸脾湯見二卷勞瘵血燥加味逍遙散見一卷火血癥五物煎四物湯加桂心氣血加味歸脾湯見本卷胎前産後失笑散見六卷胃脘痛血癥當歸活血湯赤芍歸尾生地各一錢半桃仁紅花香附各一錢川芎丹皮延胡莪朮各八分三稜青皮各七分虛損芎歸六君子湯六君子湯加芎歸血瘀通瘀煎見五卷厥怒傷化肝煎見二卷血痰氣二陳湯見一卷中風腸覃晞露丸莪朮三稜各酒浸一兩巴豆三十個切炒上二味去巴豆乾漆炒煙盡川烏各五錢硇砂四錢青皮雄黃另研茴香鹽炒甲片炮各三錢輕粉一錢另研麝香五分研細薑汁糊丸每服二十丸外治阿魏膏見三卷積聚外治琥珀膏見三卷積聚外治三聖膏見三卷積聚通治化積丸黃連一兩半以吳萸益智各炒一半去萸智萊蔔子香附山楂各一兩川芎山梔三稜煨神麯桃仁各五錢研末蒸餅為丸通治開鬱正元散白朮陳皮香附山楂青皮海粉桔梗茯苓砂仁延胡神麯麥芽甘草等分為末每服一兩生薑水煎血積當歸丸當歸赤芍川芎熟地三稜莪朮各五錢神麯百草霜各二錢半為末酒糊丸桐子大每服六七十丸開水下血瘀琥珀散琥珀乳香沒藥各五錢每服二錢水酒各半煎入地黃自然汁二合再熬去渣入溫酒和服血瘕血竭散見本卷産後血塊牡丹散牡丹當歸延胡桂心各一兩赤芍牛膝莪朮各三兩三稜一兩半為末每服三錢水酒各半煎癥痞桃仁煎桃仁一兩訶子皮白朮赤芍當歸各七錢半三稜莪朮各炒五錢陳皮去白三兩鱉甲醋炙一兩半為末每服二錢水煎加姜熱服癥積三稜丸莪朮醋浸炒三稜各三兩青皮麥芽半夏各一兩為末醋糊丸桐子大每服四十丸醋湯下峻攻硝石丸硝石三兩大黃四兩人參甘草各二錢為末醋和丸米飲下三日一服峻攻硇砂丸木香沉香巴豆各一兩青皮二兩銅青五錢硇砂一錢先將青皮同巴豆炒紫色去巴豆為末再和藥蒸餅為丸峻攻巴豆丸巴豆硇砂大黃靈脂桃仁木香蜜丸醋下峻攻乾漆散乾漆木香芫花赤芍桂心當歸琥珀川芎各五錢大黃二兩牛膝七錢桃仁一兩麝香二錢半每末一錢酒下補陰六味丸見一卷中風腹瘕蘆薈丸見三卷積聚