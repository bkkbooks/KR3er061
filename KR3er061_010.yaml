升陰絡既傷奇脈不固虛陽易炎左部虛不受按右部浮大少力治宜固攝衝任兼鎮虛陽赤石脂二錢五味五分龍骨煅丹皮各錢二分杜仲鹽水炒熟地砂仁蒸白芍山藥俱炒各二錢叉石斛茯神各三錢蓮子十五粒雞血藤膏二錢四服淋痛已止去石脂龍骨加杞子焙一錢五分龜甲心炙三錢虛火亦除衝任為奇經崩久不止必固奇經之藥雞血藤膏用以引入陰絡也鄒氏五旬外暴崩成塊暈絶而蘇脈虛芤此虛風擾動陰絡也用阿膠三錢水煨服血止仍用熟地茯神白芍荊芥醋炒黑續斷杞子甘草炙黑烏梅取甘酸化陰熄風之旨尋愈貢氏小水閉澀服導赤散加歸尾赤芍赤苓牛膝得利尺脈猶堅搏知必經閉血瘀為患逾旬寒熱腹痛暴崩紫黑成塊繼而鮮紅如注後則淡紅如水或紅白相間淋瀝匝月不止頭暈脘痞粥飲不入神憊肢冷脈細欲絶此陽衰不能攝陰滑而將脫也急用四維散加半夏砂仁茯神脈症乃定後用大補湯而安吳氏胎漏半産已匝月崩帶未止用補氣攝血之劑猶淋瀝不斷延至怔忡不安腰腿痠痛脈訣所謂崩中日久為白帶漏下多時骨髓枯也急須攝固奇經仿徐之才澀以止脫意用金鎖匙丹龍骨煅研牡蠣醋煅研茯神遠志炒赤石脂研杞子酒焙加杜仲棗仁俱炒烏梅一服漏止怔忡亦減又加減前方而安王氏七七之期經斷半載忽又崩淋不已雖血海虧虛但宜續杜攝血兼艾附調氣足矣醫輒以棕灰黑蒲黃止澀乃至小腹脹滿硬痛拒按頭疼脘痞熱渴心煩小水短澀脈左弦右數此絡瘀阻痹攻痛宜主理瘀佐通絡乃奇經治法非失笑散決津煎之比五靈脂鬱金汁各八分牛膝栝蔞橘絡各錢半延胡桃仁赤芍木通各一錢當歸鬚降香末各二錢三服瘀行腹軟但口乾微渴頭仍不清必由液虛風動改用阿膠甘菊炒麥冬石斛荊芥醋炒棗仁茯神白芍蓮子龍眼肉血止諸症亦退又下白帶為氣虛陷用黨參玉竹茯苓續斷杜仲鹽水炒生地炭芡實杞子俱焙三服全愈許氏中年血脫延為帶濁必衝任脈虛夫沖為血海任主擔受而衝脈隸於陽明陽明先衰胃納不旺致血海不固擔任失司此淋漏根由也近則食後脘腹不爽或暖腐宵脹必由脾腎陽虛治法攝陰先在益陽以崇生氣以納穀味且脈來左右緩弱溫通為宜製附子三分益智仁煨八分沙苑子白芍歸身製半夏各二錢破故紙杞子俱焙烏鰂骨醋炙續斷酒炒各一錢半胡桃肉二枚煨姜三錢三服漏止食進去附子故紙半夏加芡實杜仲菟絲子俱炒又數服乃固包氏經閉疑胎血下每謂胎漏忽然崩注雜下脂膜甚多身熱頭暈面赤心煩咳嘔緑沫上咳則下漏嘔作暈頻湯飲不納急用煨薑汁止嘔咳逆定神漸蘇脈虛小而數沉候如無兩尺空空顯非胎象良由起居不時生冷失節氣血阻滯一時暴下陰虛陽失依附變化內風眩冒嘔逆如風翔浪翻當知陰虛陽搏崩漏乃成血海空乏虛陽升逆乃氣不攝血之咎況陰從陽長宜宗立齊景嶽兩先生治法斂陽以攝陰用洋參焙茯神白芍炒各三錢炮姜一錢五味五分製半夏焦白朮甘草炙黑續斷杜仲鹽水炒各二錢二服漏止熱退稍惡寒陽氣尚虛前劑加制川附五分遂愈謝氏天癸當斷之年屢患崩漏近兼利血白帶頭震耳鳴項麻面赤症由任帶兩虧火升風煽致心神浮越怔悸不安治以鎮陽攝陰務使陽下交陰陰上戀陽震麻暫已再血海存貯陰絡不傷下元重振專在靜攝勿以操持擾動厥陽則宵寤汗泄漸安矣熟地山藥五味焙杞子焙龜板龍骨阿膠牡蠣煅研杜仲鹽水炒龍眼肉數服甚適去龍骨牡蠣杜仲加羚羊角丹皮白芍茯神蓮子芡實續斷等熬膏即用阿膠收小麥煎湯和服漸愈王氏崩漏成帶至小溲如泔如涕髀骨痛腰膝酸從未餌藥勢必瀝枯髓液延成不治近又春溫氣泄身熱食少口渴頰紅液涸陽升脈右弦左弱急攝陰固下熟地炒阿膠煬石斛各二錢洋參三錢麥冬茯神赤石脂各錢半白芍杜仲青鹽炒甘杞子續斷各三錢加蓮棗煎數服症漸減去石脂再服又去阿膠加芡實山藥俱炒各三錢又數十服得效魏氏經阻暴崩疑為胎漏按脈無孕象乃聚瘀日久致患曾經調治得安今暑濕令行頭暈嘔惡晡後骨蒸寤不成寐忽又暴崩脈虛疾症屬內因必由陽明脈虧木火乘侮是以貫膈犯巔震及血海血海一空則骨骱生熱治宜和陽安胃佐以鎮絡嫩桑葉甘菊炒天麻白芍叉斛棗仁茯神牡蠣煅研海螵蛸醋炙橘紅半夏曲炒續斷數服諸症悉平惟左關尺芤弱乃肝腎陰傷用熟地萸肉山藥白芍俱炒茯苓杜仲鹽水炒海螵蛸鱉甲俱炙阿膠煬數十服得痊又接服雞血藤膏而經固胎前論治婦人受孕則月事不行診其脈足少陰腎脈動甚者妊子也經云陰搏陽別謂之有子王注陰謂尺中搏謂獨搏於指與寸脈俱別則為孕故胎脈微滑若經候三月不行欲驗之用探胎飲腹中微動者胎也否則是經滯金匱云妊娠下血腹中痛為胞阻膠艾湯主之腹中㽲痛此木邪剋土當歸芍藥湯主之嘔吐不止此為惡阻參姜半夏湯主之常服易産當歸散主之徐之才曰受孕一月名胎胚足厥陰肝脈養之二月名胎膏足少陽膽脈養之三月名始胞手少陰心脈養之四月形體成手少陽三焦脈養之五月男女分足太陰脾脈養之六月筋骨具足陽明胃脈養之七月毛髮生手太陰肺脈養之八月臟腑具手陽明大腸脈養之九月穀氣入胃足少陰腎脈養之十月足太陽膀胱脈養之臟腑齊通納天地氣于丹田俟時而生亦有未及期而産或過期而産者凡懷孕則血留氣聚脈多滑數其殞胎多在三月是血熱故胎前症治率以清熱涼血為主蓋胎得涼則安其有外邪則邪去胎自安若妊婦稟弱脈微症屬虛寒法當溫補者又當別論也女科纂要云産前當補脾清熱養血如金匱當歸散之類蓋補脾則中氣固而無半産胎動之虞清熱則火不妄動而無胎漏煩淋之患養血則胎有所資而無坐草艱難之苦至八九月仍加順氣之劑俾氣順而骨自開血足而胎自滑惡阻受孕二三月間衝任上壅氣不下行嘔吐痰水頭重目眩懶動嗜臥惡食喜酸或偏嗜一物間作寒熱為阻病千金用半夏茯苓湯及茯苓丸今人以半夏動胎鮮用通用白朮湯二香散竹茹湯人參丁香散縮砂散然半夏實未動胎也脾虛食少者六君子湯胃虛多痰者橘皮湯飲食停滯者香砂湯加神麯穀芽脹滿不安者小和中飲或香殼散肝氣致逆者解肝煎氣滯兼痰者七氣湯中寒吐逆者溫胃飲胎漏妊娠血下衝任經虛不能約制也通治安胎當歸湯絡虛者膠艾四物湯氣虛者四君子湯去茯苓加人參阿膠棗漏血腹痛者鉤藤湯漏血發熱者加味逍遙散入房致損者八珍湯加膠艾亦有妊後按月經至而胎不損者系陰血有餘不必強止但與涼血胎漏黃漿或如豆汁炙耆六兩糯米五合煎湯分四服或苧根二兩耆五兩水酒煎服若肝脾濕熱升陽除濕湯肝脾鬱結加味歸脾湯肝經風熱防風黃芩丸妊娠溺血胎漏血自人門出尿血血自溺門出熱乘血分滲入脬中續斷湯兼痛導赤散怒動肝火小柴胡湯加山梔膀胱血熱四物湯加山梔發灰因暑渴煩益元散稍虛者膠艾四物湯症久用龍骨一錢蒲黃末五錢酒調服胎動此胎氣熱動而不安也通治安胎散加減風熱傷絡失安者鉤藤湯胎氣逆上喘急者紫蘇飲加桑皮杏仁飲酒房室損動者四君子湯十聖散觸損胞宮者血下腰痛膠艾湯立安有微熱去艾葉甘草加續斷蔥白若負重跌墜凝瘀作痛用黑糖熬膏入紅酒童便調服嚼連皮胡桃肉痛即止如未止必血下胎傷益母地黃湯安胎飲加減若因母病致胎不安但治母病胎自安暴下水胎必墮急用補氣安胎藥救之凡胎漏胎動皆下血而胎動有腹痛胎漏無腹痛故胎動宜行氣胎漏宜清熱胎不長胎之長養全賴母氣其精血雖由肝腎輸運專恃乎脾脾衰食減者異功散加砂仁心脾不足者歸脾湯加減元氣不足者大劑保元湯增助母氣則兒受蔭自無干萎之患若氣虛兼衰者八珍湯胎大孕至七八月胎大宜布束之則腰健內服達生散如膏梁安逸身肥胎大須防難産宜瘦胎飲或枳殼散胎墮胎動不安勢必下墮多由妊母衰病或觸損顛仆所致然墮在三五七單月居多且前次三月墮後次至期必墮乘其虛也須早服養氣血護胎元之劑加減八珍湯添續斷陳皮杜仲砂仁蓋氣虛則提攝不固血虛則灌溉不周胎元飲加減或泰山磬石散孕後最忌腰痛胞系於腎而腰為腎府腰痛則防墮千金保孕丸必察所傷之由豫培其損若待臨期則無及矣半産俗名小産由衝任氣虛不能攝養或因閃動及熱病溫瘧之類其險甚於大産凡孕未足月痛而欲産八珍湯去茯苓熟地加阿膠艾葉炙甘草黃耆若胎下血不止用參耆朮草膠艾歸杜等虛熱加炮薑五味子寒熱腹痛手按益痛者宜散瘀芎歸延胡桃仁香附丹皮澤蘭童便選用按之痛緩為血虛宜溫補八珍湯去芍加炮姜痛而嘔瀉為胃虛六君子湯加炮姜去血多發熱聖愈湯汗不止保元湯發熱煩躁筋惕肉瞤十全大補湯大渴面赤脈洪而虛當歸補血湯身熱面赤脈沉而微四君子湯加薑附東垣曰正産及半産漏下昏冒不省瞑目無知由心血暴亡心神失養包絡火升故令昏冒火勝其肺故令目瞑不可用寒涼瀉火之藥蓋瞑目之病悉屬陰即如傷寒鬱冒得汗乃解必補而升舉之如補中益氣湯加麥冬五味或大劑獨參湯尤妥助其陽則目張而神蘇矣子煩煩出於肺躁出於腎妊娠心驚膽怯終日煩悶繫心肺虛熱竹葉湯夏令心火乘肺胎動心煩宜生脈散或麥冬湯心肺壅熱犀角散肝火致煩加味逍遙散肺胃燥熱竹茹湯腎虧火躁加味地黃湯煩躁口乾知母丸子懸胎氣湊上胸膈滿悶必素多鬱悶痰氣壅塞致胎氣乘鬱火升自心下急以童便灌之次以紫蘇飲四五服若胎上逼心煩悶脈浮滑者蔥白二七莖煮汁飲胎立安胎上衝心煩痛欲死者當歸湯痛立止子腫因土不制水小便閉澀致面目肢體浮腫然有水氣有胎氣其胎中夾水水血相搏浸漬肌肉令腫者為水氣立齊云胸腹急脹脅肋不分溺閉者千金鯉魚湯脾虛者佐以四君子湯水溢肢體面目虛浮者全生白朮散六君子湯脾虛濕熱下部腫者補中益氣湯加半夏茯苓飲食失節嘔瀉者六君子湯加神麯砂仁炮姜若胎至七八月脛膝漸腫足趾出黃水者為胎氣非水也至分娩方消宜天仙藤散鄭虛庵云身半以上腫者發汗身以下腫者利小便上下俱腫者汗利分消其濕子嗽妊娠咳嗽胸膈不利者百合散風邪傷肺者香蘇散寒邪傷肺者小建中湯火邪傷肺者紫菀湯肺胃氣虛者異功散脾肺氣虛者六君子湯加當歸子喑岐伯曰人有重身九月而喑此胞絡脈絶也胞絡脈繫於腎少陰脈貫腎系舌本當十月復石頑曰不語者多痰蔽心竅濃煎生脈散服地黃丸助肺腎之氣以養胎若與通聲開發之藥則誤矣子癇妊娠受風痰湧發搐口噤身強冒昧不醒須臾自蘇此陰火豉動其痰宜清熱化痰理氣仍以安胎為主勿過用風藥血虛膽火加味逍遙散加羌活羚羊角棗仁鉤藤豆淋酒煎服肝膽風熱鉤藤湯氣逆痰滯紫蘇飲脾郁痰滯二陳湯加竹瀝薑汁中風口噤目吊角弓反張羚羊角散子暈此症屬氣與痰虛陽上升則痰動古謂無痰不作眩暈也目昏發厥用紫蘇飲去蔥姜加炒甘菊羚羊角若口噤不能言用白朮三錢荊芥穗二錢黑豆三合炒淋酒煎服得汗即愈子淋此小腸膀胱虛熱虛則不能制水熱則不能通利故溺頻澀而成淋本事安營散然胞系於腎若腎經虛移熱於膀胱溺數而痛宜生料六味丸加麥冬五味子桂心車前膀胱陽虛陰無以化腎氣丸肺氣虛而頻數短少生脈散加山藥澤瀉小腸熱而赤澀導赤散肺虛膀胱熱而氣化不行生脈合導赤散肺經蘊熱黃芩清肺飲肝經濕熱加味逍遙散頭眩溺不利葵子茯苓湯潰溺妊婦潰溺不知胎滿故也千金白薇散立齊以胞中有熱加味逍遙散脾肺氣虛補中益氣湯加益智仁肝腎虛熱六味丸轉胞胎逼及脬壓在一邊脬系轉捩臍下急痛溺數或閉也若舉起其胎如補中益氣湯服後探吐以提其氣溺自出矣丹溪用參朮飲服後探吐八次而效傷風頭重鼻塞發熱惡風香蘇散去香附加蔥豉熱服取微汗若咳嗽多痰加桔梗或紫蘇飲加蔥豉本草蔥能通陽安胎豆豉能解肌取汗傷寒身背拘急發熱惡寒千金用蔥白十莖生薑二兩水煎熱服取汗或蔥豉湯汗出即安或量加薄荷山梔若妊婦熱病亦用蔥豉加薄荷山梔等忌用發表諸藥若溫熱時行邪氣內犯熱毒迫胎並宜千金石膏大青湯孕瘧寒熱有時感六淫食滯之邪而發熱邪甚則損胎故以安胎為主初起頭痛喜嘔胸滿脅痛而寒熱者小柴胡湯主之寒多熱少者人參養胃湯寒少熱多者清脾飲去半夏寒嘔多痰者二陳湯或柴陳煎去黃芩脾虛食減者六君子湯不應補中益氣湯久瘧正氣衰或間二日發者必扶正如異功散加當歸砂仁鱉甲首烏山藥大棗姜煎服嘗見胎前陰瘧不愈産後延成蓐損者多矣孕痢張氏醫通曰孕痢有三禁五審一禁蕩滌腸胃使胎氣下墜二禁滲利膀胱使陰液脫亡三禁兜澀滯氣使後重轉加故治先調氣以陳皮煨木香厚朴之屬開通壅滯則後重除矣一審飲食之進不進清理積滯加梔連砂枳曲半等則飲食進矣二審溲之通不通升清降濁補中加茯苓之類則水道通矣三審腹之痛不痛紅痢急痛者為火宜芩連梔芍等白痢虛痛者為寒宜丁香肉果煨姜等四審後之重不重初痢後重宜開通其滯即香朴陳枳等久痢後重宜升舉其陽舉元煎五審身之熱不熱加人迎浮數先用和營透表宜當歸紫蘇薄荷白芍生薑等疏解後再行清理若初起未發熱痢久衛虛因感冒而發熱者左三部必浮緩須理中湯加桂枝表裡合治若痢久身熱脈來漸小或虛大少力此真陰內亡虛陽外露平人或可辛溫峻補以斂之妊娠又難輕用桂附惟藉參朮薑萸膠艾之屬大劑煎服庶可挽回五審既明三禁勿犯再察其積之稠不稠色之鮮不鮮倘黏稠如糊暫與清理若汁沫如水色晦如塵急須溫理其氣故凡沫之清稀不稠色之瘀晦不鮮者皆系虛寒急投參苓薑艾或可保全嘗治妊娠腹脹後重白痢黏稠用厚朴湯去乾薑妊娠腹痛食少白沫清稀用甘草乾薑湯或理中湯腹脹後重痢兼赤白朴姜參甘半夏湯能食後重血痢稠黏用芩芍湯送香連丸少腹重痛痢血或鮮或瘀用連理湯合千金三物膠艾湯發熱後重陰虛血痢用駐車丸熱毒內攻噤口不食腹脹後重膿血稠黏用白頭翁湯加甘草阿膠膿血清稀久痢胎動用千金膠艾榴皮湯瘧痢氣虛胎墜溺數用補中益氣湯以上皆孕痢方內並加砂仁以調氣烏梅以調血未嘗不隨手輒效也傷暑妊娠感暑煩渴悶亂黃連香薷飲十味香薷飲熱甚而渴香薷飲加麥冬五味子石膏黃芩知母花粉之屬諸痛胎前頭痛川芎茶調散宿有偏正頭風前散加甘菊花心氣痛火龍散心痛悶絶産寶丸胃脘痛養胃湯脅痛解肝煎去半夏背痛氣滯紫蘇飲腹痛因寒因食並正氣散腰痛通氣散腎虛腰痛大補元煎小腹痛絡虛為風寒所襲紫蘇飲加姜寒氣滯痛香附小茴等溫而散之腰腹痛胎不安當歸阿膠甘草蔥白湯胎動血下腰腹急痛苧根湯孕癰小腹近下腫痛皮薄光亮者癰也千金托裡散若急痛煩悶胎氣上衝面青汗冷血下不止者不治乳泣未産乳汁先下名乳泣生子多不育腹啼兒在腹中啼哭者因妊娠登高舉臂兒口脫出臍帶以此致啼若令妊婦曲腰就地如拾物狀或令掃地臍帶血管仍入兒口即止亦有胎熱不安致啼者濃煎黃連汁常呷之即止又妊婦腹內鐘鳴用空房下鼠穴中土一塊令妊婦口噙之即止鬼胎鬼胎脈多沉細弦澀大小不調或由經行飲冷血蓄衝任而成者或由停痰蓄水與絡中瘀積互結而成皆內因之病實非外感之邪其腹雖漸大亦且微動究與其胎各別治以理氣行血為主加莪朮蘇木牛膝南星桃仁桂心麝等味虛人用十全大補湯緩圖收效不可峻用川烏巴豆厲劑急追取咎嘗見孕過期産出水胎異形其後必費調理胎死産母舌青腹中冷而重墜是胎死矣宜速用脫花煎後察虛實調補若舌與爪甲俱青腹脹氣喘口中臭穢者危速令穩婆以手法下之古法用童便調朴硝五錢或平胃散水酒煎調朴硝虛寒用理中湯倍人參調朴硝冬月胎死腹覺冷用香桂散加烏頭或黑神散黑龍丹惡血上逆嘔搐昏暈用童便乘熱灌之唇青吐沫不治凡面赤舌青母活子死面青舌赤母死子存面舌俱青母子兩亡過期不産因氣虛者補氣因血漏者培血氣血不足者益其氣血若過期脈沉細者非胎也亦有胎已萎而在腹不腐服補劑以和其氣血而自下者胎前脈候婦人經停二三月脈微滑而數尺中按之不絶者妊脈凡妊脈宜滑利數實不澀不弦不伏大忌遲澀浮緩辨男女脈法左大為男右大為女然多素稟偏大者惟寸口滑實為男尺中滑實為女又如兩寸俱滑實為雙男兩尺俱滑實為二女左寸右尺俱實為一男一女此最驗者醫通妊脈初時寸微小呼吸五至三月而尺數也脈滑疾重以手按之散者胎三月脈重手按之不散但疾不滑者五月也脈經若脈沉細按之冰冷或兩尺乍大乍小乍有乍無鬼胎也脈急如風雨少停復來如初者夜叉胎也寸微關滑尺帶數流利往來並雀啄小兒之脈已見形數月懷妊猶未覺脈訣欲産之脈必離經其來大小不勻停或如雀啄屋漏應腰痛腹痛眼生花産在須臾卻非病附方驗胎探胎飲川芎為末空心煎艾湯調下腹動者胎也臍下動者瘕也不動者血凝也胞阻膠艾四物湯見本卷調經腹痛當歸芍藥湯見本卷調經惡阻參姜