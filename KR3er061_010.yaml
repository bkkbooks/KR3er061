甲片白蘚皮青風藤白芷木瓜角刺甘草節栝蔞仁防己胡麻各二錢土茯苓四兩分二服日二服梅毒西聖復煎丸乳沒兒茶丁香各一兩血竭阿魏白花蛇各四錢面白一斤炒焦黃色煉蜜六兩煎香油四兩大棗肉二十枚共研末搗丸彈子大以一丸煎土茯苓二兩再煎服摻藥五寶散石鐘乳四錢珍珠二錢冰片一錢琥珀二錢研細以藥末二錢加面白八錢研勻用土茯苓一斤水八碗煎五碗作五次服加五寶散一分和勻服之忌一切發物結毒紫金丹龜板炙研末二兩辰砂六錢石決明煅童便淬六錢研細飯丸麻子大每服一錢土茯苓煎湯下頭痛天麻餅子天麻薄荷甘松白附子白芷蒼朮川芎川烏草烏防風細辛甘草各一錢雄黃全蠍各三錢研末麵糊丸作餅每服二三十餅蔥白煎湯下鼻吸碧雲散見六卷目鼻塞通鼻散葫蘆殼燒灰石鐘乳膽礬冰片各等分研末吹鼻出黃水日二三次喉蝕硫黃不二散硫黃一錢靛花一分研細用涼水一杯調服吹喉結毒靈藥水銀一兩辰砂雄黃硫黃各三錢研細入湯罐內泥封固鐵盞梁兜固封口按紅升丹之煉法火畢次日取出盞底靈藥約一兩五六錢治尋常腐爛症靈藥五錢輕粉五錢同研細小罐收以紗封之用時以甘草湯洗淨患處將藥摻之油紙蓋之若喉爛靈藥一錢加人中白二分研吹外貼解毒紫金膏明淨松香皂礬各一斤煅赤共研細末香油調稠先用蔥艾甘草煎湯洗淨患處再搽此藥油紙蓋住以軟布扎緊三日一換疔毒論治經云膏粱之變足生大疔疔瘡火毒也由恣食厚味及感四時疫癘之氣而生其瘡生頭面四肢為多初起麻木形如粟米或黃頭小疱或寒熱癢痛四肢沉重其毒重其頭堅其根深旦發夕死初宜服奪命湯外須拔去疔根而後可生用細瓷鋒砭破疔頭擠去惡血用拔疔至寶丹塗貼瘡上或針挑小孔用立馬回疔丹插入孔內外以膏蓋追出疔根然明疔易治暗疔難療如生耳鼻內及腋際隱處遲延失治毒必走黃切忌風燥辛熱等劑如辛芷椒姜之類蓋諸瘡毒宜散疔瘡毒宜聚聚則毒在原處拔其根自愈若見患者怯寒誤用風燥豈知疔由火毒熱極生冷風燥助火逼毒內攻矣初覺即宜早治若前丹一時難覓急用蝸牛搗爛敷之或用家菊根搗敷之內用菊花葉五錢紫花地丁三錢生甘草一錢煎服或用梅花點舌丹或用蟾酥丸一二服俱用菊根汁和熱酒送下汗出為度種福堂方云治疔用家園菊花搗爛取汁一碗服下即愈如無花葉根搗汁服亦可有此方諸方皆廢古云疔瘡先刺血內毒宜汗泄禁灸不禁針怕綿不怕鐵初發項以上者用鈹針刺入疔頭四五分挑斷疔根捻盡毒血用回疔丹或蟾酥條插入孔內巴膏蓋之項以下者亦可艾灸灸之不痛仍須針刺出血插蟾酥條挑法用針干將毒頂焦皮刮開以針刺入疔根堅硬如鐵者為順若針刺入綿軟者為逆如此百無一生挑出紫黑血再挑至鮮血以知痛為止隨填撥疔散以萬應膏蓋過三時辰即換三四日後瘡頂乾燥以琥珀散蓋令疔根托出換九一丹摻之以黃連膏抹之外以白膏蓋之生肌斂口若失治走黃毒氣內攻嘔惡神昏瘡必塌陷急於走黃處按經尋有芒刺直豎即是疔苗急用鈹針刺出惡血若漫腫悶亂急服回疔散頃刻大痛痛則許救毒化黃水痛止命活人中疔鼻下唇上硬腫麻痛急用蟾酥丸研敷內服菊花地丁湯外用菊葉搗敷亦可此症屬肺火顴疔生顴骨間發小疱如粟米如赤豆頂凹堅硬按似釘頭麻癢木痛宜蟾酥丸或麥靈丹汗之次服黃連消毒飲清之外治悉按前法此症屬胃火鼻療生鼻孔內鼻竅腫塞痛引腦門甚則唇腮浮腫宜蟾酥丸汗之再用蟾酥丸研細末吹入鼻孔中此症屬肺火舌疔舌上生核強硬作痛用針點破搽冰硼散內服加味二陳湯效此症屬心脾火耳疔生耳竅暗藏處色黑根深形如椒目疼如錐刺破流血水以蔥白湯送蟾酥丸汗之再以蟾酥丸水調濃滴耳內此症屬腎火唇疔生上下唇鎖口疔生口角間初起如粟米色紫堅如鐵腫甚麻癢木痛唇疔則唇皮外翻鎖口疔則口不能開治法照前忌灸上唇脾火下唇胃火口角心脾火牙療牙縫腫起一粒形如粟米痛連腮項用銀簪挑破出血搽拔疔散再以蟾酥丸徐徐噙化咽之若煩躁口渴宜服黃連解毒湯即愈此症屬胃火或是大腸濕熱紅絲疔生手臂足脛疱起紫黑上發紅絲一縷急從紅絲起止兩頭用針挑斷血出而愈或從疔起處用蟾酥條插入萬應膏蓋之隨服黃連解毒湯不刺斷毒入腸胃不救種福堂方云針刺紅絲歧出之處擠出惡血再以浮萍根嚼細敷之立愈手掌疔生手掌堅硬黃疱如釘用磁石煤炭荔枝肉不拘分兩同搗勻敷上痛止一宿愈治疔通用蛇頭疔生手指起疱色紫疼痛初宜蟾酥丸汗之外敷雄黃散簡便方名羅疔以橄欖核醋磨塗漸消生指甲兩旁名蛇眼疔如豆色紫硬痛生指甲根後名蛇背疔如棗色赤胖腫生指中節繞指俱腫名蛇節疔色或黃或紫生指中節前面如魚肚名蛇肚疔色赤疼痛初服蟾酥丸外敷雄黃散暗疔腋下堅腫無頭寒熱拘急焮痛先服麥靈丹汗之內疔寒熱腹痛數日間忽腫一塊初起牙關緊急用蟾酥丸三五粒蔥湯研化灌之俟蘇再以前丸三粒嚼蔥白黃酒送下蓋被出汗無汗飲熱酒催之暗疔治同此不用挑法冷疔生足跟起紫白疱疼痛徹骨腐爛深孔久不斂者神燈照法照之鐵粉散敷之內服十宣散刀鐮疔形闊如韭葉肉紫黑如烙長寸余忌行針刺以生礬三錢蔥白七莖共搗爛作七塊蔥白煎湯逐塊送下蓋被出汗忌房事酒肉生冷辛辣等味羊毛疔寒熱類傷寒前後心有紅疹或成紫黑斑點用針從前後心斑點處挑出如羊毛狀用黑豆蕎麥研粉塗之即立時汗出而愈一法用明雄末二錢青布包扎蘸熱燒酒於前心擦之毛奔至後心再於後心擦之羊毛俱出即愈忌茶水一日爛頭疔未潰頭已腐者白菊根一把白梅二個蜒蝣大者二條共搗爛加明雄同敷干則另換敷數次即愈紫馬疔疔頭色紫而發速生白酒豨蘞草紫花地丁車前草煎服愈金鑑云火焰疔多生唇口及手掌指節間發紅黃疱痛癢麻木寒熱交作屬心經火毒紫燕疔多生手足腰肋筋骨間初發紫疱次流血水三日後串筋爛骨屬肝經火毒黃鼓疔多生口角腮顴眼胞黃疱光亮四畔紅暈嘔噦麻痛屬脾經火毒白刃疔多生鼻孔兩手白疱頂硬根突易腐易陷屬肺經火毒黑靨疔多生耳竅牙縫胸腹腰腎隱處黑斑紫疱頑硬如釘屬腎經火毒五疔應五臟而生初服蟾酥丸蔥湯下汗之寒熱仍作宜五味消毒飲汗之輕者宜化疔內消散毒將走黃急服疔毒復生湯已走黃心煩悶憒急用七星劍湯救之若肢冷脈絶毒氣閉遏先服蟾酥丸隨服木香流氣飲其脈自見凡疔潰後不宜補早雖真虛只可平補忌用溫補即生肌膏藥亦不宜早貼也附方全生奪命湯銀花黃河車赤芍細辛蟬蛻黃連殭蠶防風澤蘭青皮甘草各等分水煎通用清涼解毒飲連翹大力子芩地丹梔銀草紫花地丁元參花粉赤芍熱重加黃連犀角汁溺澀加木通拔疔拔疔至寶丹硇砂二錢白礬四錢硃砂雄黃各五分硼砂一錢緑礬四錢火硝四錢七味各另研極細合研後入水銀四錢放嚼碎茶葉少許研不見星將藥入瓦罐文火熬半個時辰以藥餅堅硬為度取罐放大面盆中罐上用皮紙封固盆中實以淨灰留罐頂半寸灰上以瓦片鋪滿上以白炭圍滿罐頂慢火煽一炷香去炭候罐冷用鵝翎掃下淨白者為上瓷罐收貯放地下出火氣一半作末子用一半用厚糊打細條雄黃為衣收貯瓶內聽用凡疔瘡用碗鋒砭破將血捻淨用丹一丸研細搽之若挑破有小孔以藥挑插於孔內俱用皮紙打濕數層封好過一二日揭去疔頭自然緩緩脫出貼膏即愈拔疔立馬回疔丹輕粉蟾酥酒化白丁香硇砂各一錢乳香六分雄黃硃砂麝香各三分蜈蚣炙一條金頂砒五分共研細麵糊丸如麥子大每用一粒插入孔內通治梅花點舌丹牛黃冰片蟾酥熊膽各一錢珍珠麝香各六分硃砂硼砂葶藶血竭沉香乳香沒藥雄黃各二錢將人乳浸蟾酥熊膽為丸每重三四釐金箔為衣曬乾入瓷瓶收貯聽用此丹專治疔瘡對口乳癤癰疽及一切無名腫毒初起以一丸入蔥白內嚼碎酒下出汗即愈惟孕婦忌服消疔蟾酥丸蟾酥二錢酒化輕粉銅緑枯礬寒水石煅膽礬乳香沒藥麝香各一錢硃砂三錢雄黃一錢蝸牛二十一個以上各研末先將蝸牛研爛同蟾酥和研入各藥共搗勻丸如緑豆大每服三丸令患者用蔥白嚼爛以熱酒送下蓋被出汗初起即消此丸一名飛龍奪命丹專治諸疔惡瘡化腐消堅貼毒巴膏一名白膏用巴豆肉十二兩萆麻子十二兩去殼香油三斤浸三日再將蝦蟆五個浸一宿臨熬時入活鯽魚十尾共熬焦去渣再熬加官粉二斤乳香五錢攪勻攤貼消疔拔疔散硇砂白礬硃砂食鹽以鐵繡刀燒紅將白礬食鹽放刀上煅之各等分擇丁日午時研細收之搽患處化硬搜根貼毒萬應膏見前諸瘡活瘀琥珀膏血餘八錢花椒十四粒麻油十二兩熬焦去渣入黃蠟四兩熔化以夏布濾淨入瓷瓶內先將定粉銀硃各四錢輕粉三錢琥珀五分各研極細合一處徐徐入油內用柳枝攪勻以冷為度用紙攤貼此膏專貼瘡瘍能活瘀解毒化腐生新疔潰九一丹煅石膏九錢黃靈藥一錢共研細摻患處疔潰後拔膿除根潤燥黃連膏黃連三錢歸尾五錢生地一兩黃柏薑黃各三錢香油十二兩將藥熬枯去渣入黃蠟四兩熔化以夏布濾淨傾入碗中柳枝攪勻貼走黃四疔散土蜂窠有子者一兩蛇蛻一條泥裹火煅存性為末研和如疔毒發腫神昏謂之走黃用此散二錢白湯下少刻大痛可救諸瘍麥靈丹鮮蟾酥二錢活蜘蛛二十一個取黑色者兩頭尖一錢即鼠屎飛羅面六兩共研用菊花熬成膏捻成麥子形每服七粒治一切惡毒清熱黃連消毒飲黃連一錢黃耆二錢生地連翹知母防風歸尾各四分桔梗防己黃芩人參各五分甘草三分陳皮蘇木澤瀉各二分水煎空心服舌疔冰硼散冰片五分硼砂元明粉各五錢辰砂六分共研細用少許搽之即效如咽喉腫痛吹之立止痛消痰加味二陳湯陳夏苓草芩連薄荷姜三片通治簡便方瓦雀糞不拘多少以韭汁浸化入白鹼少許研拌敷上即可拔去疔根反唇簡便方壁蝨七個用米飯搗爛敷患處疔即出一法於人腿拗中紫筋上針刺出血即愈即委中穴也煩躁黃連解毒湯見一卷溫症蛇頭雄黃散明雄黃二錢輕粉五分蟾酥二分冰片一分共研細水調敷以薄紙蓋之日換三四次一法用陳醬茄子套指上痛即止蛇節敷藥方紅痛徹骨即以溺壺塹帶濕敷之立止冷疔神燈照法硃砂雄黃血竭沒藥各一錢麝香四分共研細每用三分紅綿紙裹藥捻長七寸以麻油浸透凡癰疽一切惡毒初起七日前後皆可用此照法以火點著離瘡半寸自外而內周圍照之火頭同上藥氣入內毒隨火解初用三根漸加至四五根照後用敷藥黑腐鐵粉散針砂末三錢黃丹輕粉松香各一錢麝香一分共研勻以蔥湯洗去血水以香油調敷油紙蓋之能蝕腐生新內補十宣散參耆歸各二兩防桔芎朴桂芷草各一兩共研末每服三錢熱黃酒調下通治五味消毒飲銀花菊花蒲公英紫花地丁紫背天葵各一錢二分水煎加酒和服汗出為度輕症化疔內消散知母貝母甲片白芨乳香花粉角刺銀花歸芍草各一錢水酒煎走黃疔毒復生湯銀花山梔地骨皮牛蒡子連翹木通牡蠣煅大黃角刺花粉乳香沒藥各八分水酒各半煎汗散七星劍蒼耳頭野菊花豨蘞草紫花地丁半枝蓮各三錢蚤休麻黃各三分水酒各半煎宣散木香流氣飲歸芍芎蘇枳桔陳苓夏耆檳大腹皮青皮烏藥防風澤瀉甘草節木香各五分姜三片棗二枚水煎發背搭手論治蓮子發蜂窩發竟體疽附背文正脊分上中下三發俱屬督脈經上發背生天柱骨下是火毒傷肺其形橫廣如肚中發背生背心正對前心是火毒傷肝其形中闊兩頭有尖如瓜下發背生腰中正對前臍是火毒傷腎其形平漫如龜初起皆如粟米焮痛麻癢寒熱拘急宜隔蒜灸以知痛為度則毒氣隨火而散有表症者寒熱無汗荊防敗毒散汗之有里症者溺澀便閉內疏黃連湯下之兼表裡症者神授衛生湯雙解之以減瘡勢其紅腫痛甚脈洪數有力熱毒症也易治漫腫赤痛色黯作渴脈洪數無力陰虛症也難治若不腫不痛或漫腫色黯脈微細者氣虛症也尤難治瘡頂發一頭或二頭紅腫高突者為癰屬陽宜清涼消毒如焮痛發熱脈數者內消散托裡散如腫硬疼痛脈實者活命飲五香連翹湯若初起一頭如粟不腫不赤悶痛煩躁渴飲便祕四五日間瘡頭不計其數瘡口各含如粟狀如蓮蕊積日不潰數日後瘡頭迸出通結一衣揭去又結色紫黯者為疽屬陰宜溫補托裡如氣血兩虛往來寒熱者托裡當歸湯不能起發不能腐潰者托裡養營湯將潰時腳根走散不收束者四圍以鐵桶膏塗之已潰後腐肉不去者外貼巴膏化之潰後仍痛宜兼消托者內服托裡消毒散如膿稀不稠或膿成不潰腐肉化遲者內服托裡散加參耆肉桂惡寒形寒或不收斂系陽氣虛者十全大補湯晡熱內熱或不收斂系陰血虛者四物湯加參術如作嘔噦或不收斂系胃氣虛者六君子湯加炮姜食少體倦或不收斂系脾氣虛者補中湯加茯苓半夏小便頻數煩躁作渴系腎陰虧者加減八味丸余按諸瘡總論治法上搭手生肩下肺俞穴脊骨第三節傍開一寸半屬膀胱經偏左屬肝偏右屬肺由氣鬱痰熱凝結而成初宜神授衛生湯雙解之次以逍遙散消之兼以六郁湯調之中搭手生脊旁膏肓穴脊骨第四節傍開三寸屬膀胱經由怒火而生初宜三香連翹飲散之次以清氣飲消之氣血虛不即潰腐者參耆托裡散補之下搭手生腰傍肓門穴脊骨第十四節傍開三寸亦屬膀胱經由腎經虧熱熾而成初宜活命飲解毒次以內托黃耆散托毒次服地黃湯滋陰潰後治法同前又有生脊背及兩肋形似蓮蓬名蓮子發屬膽膀胱經火毒生肩後及脊傍形似蜂房名蜂窩發由脾經蘊熱高腫半背若頭尖向上屬心火熱極防毒火內攻若形長尺許根橫滿背名竟體疽急服黃連消毒飲以清心解毒余按前法治之附方表症荊防敗毒散見一卷疫里症內疏黃連湯見本卷諸瘡表裡神授衛生湯皂角刺防風羌活白芷山甲炙連翹歸尾乳香沉香銀花石決明花粉甘草節紅花大黃酒炒水煎加酒服消散內消散知母貝母花粉乳香製半夏白芨山甲炒角刺銀花各一錢水酒各半煎服留渣搗加秋芙蓉葉研末加蜜調敷托消托裡散見本卷諸瘡消腫仙方活命飲見五卷鶴膝風散結五香連翹飲乳香木香沉香丁香香附黃耆射干連翹升麻木通獨活桑寄生甘草各一錢氣血托裡當歸湯當歸川芎白芍熟地人參黃耆各一錢柴胡甘草各五分煎潰膿托裡養營湯見本卷諸瘡緊束鐵桶膏銅緑五錢礬四錢明礬四錢五倍子炒一兩白芨五錢輕粉鬱金各二錢麝香三釐研細以陳米醋熬起金色黃泡待溫調藥末一錢如膏頓溫塗之化腐巴膏桑槐桃柳杏枝各五十寸香油四斤熬上五枝熬枯撈出入象皮穿山甲各六錢頭髮一兩二錢熬化再入山梔子八十個熬枯用絹將藥渣濾盡入黃丹六兩攪勻慢火熬至滴水成珠住火入血竭研細一錢兒茶研細二錢硇砂另研細二錢等末攪融將膏傾入涼水用手扯膏千餘遍換水數次去火氣瓷罐收貯用時重湯燉化紙攤貼之神效托消托裡消毒散見本卷諸瘡陽虛十全大補湯見一卷中風血虛四物湯地芍歸芎胃虛六君子湯參苓術草加陳皮半夏姜棗脾虛補中益氣湯見一卷中風陰虧加減八味丸見六卷咽喉和解逍遙散見一卷火調氣六郁湯見三卷郁止痛三香連翹飲乳香木香香附當歸羌活牛蒡子連翹車前子金銀花赤芍水煎定痛清氣飲人參地黃木香桔梗川芎羌活金銀花黃耆連翹當歸乳香白芷麥冬茯苓皂角刺水煎補托參耆托裡散見本卷乳症托毒內托黃耆散當歸白芍炒川芎白朮陳皮穿山甲炒研皂角刺黃耆各一錢檳榔三分肉桂五分水煎滋陰六味地黃湯見一卷中風竟體疽黃連消毒飲生地連翹知母防風獨活歸尾各四分桔梗黃芩防己各五分蘇木陳皮澤瀉各二分黃連一錢黃耆二錢人參甘草各三分羌活一分將潰透膿散見本卷諸瘡舌色辨芝本著難經立望聞問切四者以治病而望而知之謂之神內經辨望色之理多端而不及舌近世醫者看舌色矮人看場而不明其理惟張氏醫通有傷寒舌鑑列圖論方而其法亦簡略不備且傷寒之外雜症未暇論及也葉香岩先生溫熱論中兼及舌色最為獨出手眼冠絶千古而細筋入骨切中病機比之張石頑所列圖論相去天淵張石頑舌鑑凡白者一小柴胡黃者一大柴胡灰者一涼膈黑者一承氣灰黑虛寒入陰者理中四逆此層殊不細理非不是而舌色之理不明不備且舌黑而言入足三陰用溫藥殊足誤人香岩先生看舌色別有神悟歷練而知所謂不傳其妙也其論溫邪初起舌白而燥者肺陰亡也宜麥冬花粉元參等白虎湯舌中心絳乾者心胃火燔也玉女煎及梨蔗藕汁舌白如粉者熱據上焦也梔豉湯及枳杏蔞桔蒡等舌黃厚者熱據中焦也承氣湯舌尖紅絳者心營暗熾也宜犀角羚羊角鮮石斛鮮生地等舌中心焦黑者腎陰涸心胃火熾也犀角地黃湯牛黃丸至寶丹紫雪丹選用舌厚芒刺斷紋燥裂者積滯熱極也涼膈散碧雪丹舌焦而齒煤唇血燥裂者火熾血涸欲成風痙也炙甘草湯加犀角汁舌乾枯而短者腎氣竭也宜阿膠雞蛋黃地黃等舌生大紅點者熱極生疳也宜黃連金汁方諸水等無苔而紅絳者熱傷血分也宜丹皮地黃麥冬元參等有苔而黃白者熱滯胃脘也宜枳實厚朴明粉涼膈散溫邪變態最速舌色一黃頃刻即變成灰黑以其火中挾風天下至速莫如風火火就燥口渴舌乾皆熱邪橫肆迷漫三焦也又有舌灰齒煤乾枯之至其脈細澀若無身已不熱者此如火過成炭只須大劑補陰宜熟地洋參麥冬阿膠龜板雞蛋黃不必寒涼以其病已無熱也大抵舌有白苔丹溪謂丹田有熱胸中有寒此論大謬白苔在雜症是胃中積滯白苔在溫症亦屬積滯定屬熱邪更無寒邪一二日間變成黃黑矣且舌白而尖漸紅口漸燥其為熱亦何疑若無苔而舌白兼淡紅者方是虛寒亦非溫症所有溫症中舌尖紅唇亦繹目必赤面色亦紅煩躁有譫語即可用犀角至寶丹舌灰斷宜犀角至寶丹舌厚而燥或黃或灰或黑急下存陰舌苔不厚而干大劑救陰初起舌白厚宣通氣分病久舌黃厚宣通血分病久有苔而燥瀉積救陰病久無苔而干滋陰養液有舌白而語譫者其舌必乾玉女煎有舌紅絳而語譫者熱入心營牛黃丸至寶丹舌灰舌黑斷無不語譫者大劑犀角至寶丹紫雪等其不語譫乃陰證非溫症也舌色紫亦熱傳營分宜琥珀丹參丹皮等舌乾枯欲救陰瀉火已難必須大劑鮮生地鮮石斛赤芍元參麥冬俱一兩用若唇焦齒煤腎水已枯宜熟地阿膠麥冬雞蛋黃更難得效矣至若傷寒溫症外舌色並無古書言及香岩先生溫症舌論引而不發便可觸類旁通如疫症舌白厚必須大黃利下不爽亦須承氣黃苔不必再言此吳又可所以專主急下至瘧痢舌白厚必須枳朴或白而兼黃必須枳朴加芩連若寒飲停泊嘔吐唇淡舌灰有津必須桂附肥人舌灰有津亦然霍亂手足冷煩躁舌灰亦然又有痢疾舌灰而不甚干亦屬熱邪不得用桂附者或其人素吃鴉片最易灰黑乃用芩連有久痢已虛反生厚苔而舌邊糜爛陰火上衝水來剋火或白或黃終成不治有舌唇淡白無華必須溫理有舌色深絳無苔定屬營虛傷血宜養血不宜寒涼以症非外感也有雜症舌中心絳干須清營熱有雜症舌中心灰色有津須引火歸原有雜症舌黃味苦味酸皆脾經有熱宜芩連知母亦有脾虛口甜舌淡宜四君六君大抵無苔而淡白者寒無苔而紅絳者熱淡白而口乾者以桂附補命火則津液熏蒸上朝於肺不得以口乾燥而用寒涼以其干與溫症之舌乾有別不過病人自覺干而視舌者不知其干也凡有苔而退者由舌尖退至中由中退至根若舌本乾燥服藥後有津則苔必退亦有舌尖中根漸薄而一齊退者舌灰薄者易消陰症舌灰必薄熱邪舌灰薄者邪輕舌黑厚者邪重舌苔漸退者邪亦退舌苔漸進者邪亦進婦人胎死腹中則舌灰舌青而舌青皆厥陰之病凡病舌青者不治又有重舌木舌舌衄此非舌症非舌之色也舌尖主心主上焦舌中主胃主中焦舌根主下焦而舌為心之苗心為君主皆宜細細辨明用藥方合病症非深心領會烏足入神聖之門哉生死辨芝本著季路問死聖人示以知生知從無處而生則必從有處而死忽然而生忽然而死漸漸而生漸漸而死生有則皆有無所不有死無則悉無一無所有初生有似乎死而已生初死尚近乎生而實死既生則與死反既死則與生反此聖人所以言未知生焉知死也而醫者掌人生死必先識得生死必先識得人之所以死而後知人之所以生於是用藥乃足以起死而回生識死之法多端朱文公言氣聚則生氣散則死是為一言提要如病者氣急不續氣已散魚口氣粗氣已散自汗如雨氣隨汗散大吐大利氣隨吐利而散自利遺尿嘔血脫精氣亦散氣者陽也氣散則由陽而陰死者陰也死為鬼鬼者歸也陰之靈也凡病人終日昏寐不語語而無聲喜暗惡明面暗向里手足厥冷目瞑見鬼目無精光絶谷不食諸象皆近乎陰者也皆死之兆也至若色脈之言死內經難經論之詳而義深詞奧醫者每未洞悉今約略言之大抵性情反常者死男女不知羞恥者死無脈者死脈魚翔蝦游者死脈躁急者死脈數八九至者死脈遲一二至者死脈結代者死真臟脈現者死陽症得陰脈者死跌陽衝陽無脈者死病後脈無胃氣者死形肉已脫九候雖調者死天柱骨倒者死目窠低陷者死面青者死口角青者死面晦黑者死久病色赤者死舌齒枯黑者死疹黑斑黑者死目瞪呆神去者死內閉外脫者死鼻息奔喘者死藥大誤者死陰症下之死陽症汗之死中風鼻鼾者死汗如油者死手撒者死遺尿者死眼合者死溫症霍亂救陰不潤者死救陽不溫者死手足厥冷躁擾者死舌卷囊縮者死尋衣摸床者死痙厥不返者死病久自利者死腹餒絶谷者死勞損聲啞者死勞損喉痛者死大肉脫者死上損過中者死下損過中者死非腫脹而腹脹大有形者死小便不通高突有形者死痢下發熱不退者死痢下除中者死真頭痛真心痛肝痛皆死婦人産後內閉者死風痙者死汗大泄者死小兒慢驚者死童勞者死室女經閉者死高年噎膈者死衰年卑脹者死癰疽內陷者死癰疽不知痛者死大抵出者為虛汗多亡陽有一分陽氣不死亡陽必死上脫下脫陽脫陰脫皆死先天離者死後天絶者死凡人將死喉間痰響有聲以為痰涎閉窒而致氣卒者大謬乃其真氣已離痰隨氣浮而有聲也亦有實症氣閉窒而死者如中暑中暍中寒中經中毒其死後身體必發青紫此其大略也
