body:
  text: 卷之八調經論治婦科首重孕育孕育先在調經素問曰女子二七天癸至任脈通太衝脈盛月事以時下言天一之真精至月信亦通乃能孕子謂之月事者女子屬陰其血如潮應月之盈虧有常期者也故謂之經倘一愆期則失其常度而諸病生焉夫任主胞胎沖為血海二脈流通臟腑之血皆匯注於此衝任皆奇經而血之生化由脾胃若七情內損六淫外侵兼之飲食勞倦致脾胃日虧化源日薄衝任日衰神色日奪所重尤在調肝蓋婦女善郁木失條暢枝時萎悴肝不藏血經之所由不調也然不調之中有先期有後期有錯亂有痛經有倒經有居經有淋瀝不斷有枯閉不通經不準必不受孕然參前數日受孕者首之當經行食禁生冷藥忌寒涼以血得寒則凝澀不行不慎禁忌則腹痛瘕泄亦致不調且血隨氣行經不調多由於氣丹溪謂經來成塊者氣之凝也將行作痛者氣之滯也行後作痛者氣血虛也先期而來者血熱後期乃至者血虛亦無不由氣也錯經妄行者氣之亂也色淡者虛而夾水也紫者氣之熱黑者熱甚也乍少乍多淋瀝不斷者氣不攝血也故調經必兼氣藥更若臟損經閉則由悲傷肺憂傷心思傷脾怒傷肝房勞傷腎肺傷則氣陷血脫心傷則驚悸盜汗脾傷則食減肌瘦肝傷則發焦筋痿腎傷則淋帶骨蒸甚至嗽熱泄瀉衝任虧敗源涸流竭如素問云二陽之病發心脾有不得隱曲其在女子為不月夫心主血脾統血思慮過度所願不遂鬱而成損則先經閉而後干嗽纍月經年遂成乾血勞瘵治難措手矣古謂經前勿補經後勿瀉此為經期腹痛者言之其實調經之要務令血氣和平自然經准受孕如陽太過則先期原因有火然虛而生火仍當養營攝血亦有無火而先期或補中氣或固腎關不宜過用寒涼也陰不及則後期本屬血虛然有血熱而燥瘀者宜清補亦有血逆而留滯者宜疏利毋庸預執溫補也其陰陽乖亂錯經妄行或由火邪搏營遲早互見或由經氣舛逆口鼻上衝務審其虛實寒熱而調之至於經期前後腹痛虛實懸殊經未行而先痛者血為氣滯經通則痛自除經已行而猶痛者衝脈本虛血去則痛益甚滯者理其氣溫而行之虛者培其營峻以填之設淋瀝不止必固以攝之亦有腹愈痛經愈多至痛欲死者系火搏於血治宜行血如芎歸等斂血如芩芍等理脾如苓術等以益母破氣中之血以延胡破血中之氣以香附開其鬱虛者加人參理脾則血有統破結則火痛悉除故調經莫如八珍湯加益母延胡其經閉不行肥人多痰塞導痰湯加川芎川連瘦人多鬱火四物湯加丹皮山梔澤蘭因脾胃虧而食少者旺其運納之權歸芍異功散因肝腎虧而骨蒸者壯其營陰之本地黃湯去萸澤加龜板五味子因思慮郁損心脾者歸脾丸小營煎因勞嗽咳傷肺氣者劫勞散紫菀湯或溫養下焦熟地沙苑子杜仲龍眼芡實鹿角膠或宣通奇脈杞子牛膝當歸澤蘭茯神香附若枯閉日久輕用破血通經則愈枯其枯矣又有經後發熱倦怠兩目如帛蔽不明此脾腎精華不能上注於目也朝用補中益氣湯夕用地黃丸加杞子至於七七數盡當斷不斷或因氣血有餘若已斷復來者即為崩漏宜固攝衝脈大補元煎加續斷阿膠海螵蛸菟絲年高經或大行腹痛不止者危經閉論治潔古曰經言月事不來者胞脈閉也胞脈屬於心絡於胞中今氣上迫肺心氣不得下通故月事不來先服降心火之劑如芩連四物湯三和湯去硝黃後服局方五補丸後以衛生湯治脾養血也李氏論經閉有二曰血滯血枯如經行時余血一點未淨或外感風寒內傷生冷七情鬱結為痰為瘀凝窒經絡為血滯或經盡後勞傷衝任咳嗽骨蒸火逼水涸為血枯血滯經閉如當歸散元歸散以破瘀加味導痰湯以滌痰滯去則經通若血枯經閉多主傷肝素問云有病胸脅支滿妨於食病至則先聞腥臊臭出清液先唾血四肢清目眩時時前後血病名血枯此得之年少時有所大脫血若醉入房中氣竭肝傷故月事衰少不來也治以四烏鰂骨一蘆茹二物併合之丸以雀卵大如小豆日乾以五丸為後飯飲以鮑魚汁利腸中及傷肝也蓋胸脅支滿肝病也妨食肝病傳脾也故聞腥臊臭出清液肝病肺乘也故唾血四肢清目眩肝血傷矣蘆茹即茜根能散血後飯先藥也鮑魚汁利腸垢和肝傷取臭穢以佐烏鰂骨闢宿瘀也有因飲食勞倦損傷脾胃者節齊云只宜補養脾胃白朮為君茯苓芍藥為臣佐以黃耆甘草陳皮麥芽川芍當歸柴胡脾能生血經自行矣有因思郁致損心血者寇宗奭云童男室女積想在心思慮過度男則神色消散女則月水先閉蓋憂愁思慮多傷心脾故神衰食減火炎爍金肺金燥腎水絶木氣失榮四肢干痿五臟傳遍死矣能改易心志用藥扶持宜柏子仁丸澤蘭湯益陰制火忌青蒿虻蟲等涼血行血凡經閉因血滯者多凝瘀積痰牛膝散導痰湯若胃熱消渴津液燥竭玉燭散若思郁成損歸脾湯潮熱骨蒸加味逍遙散加熟地龜板室女經行復閉羸熱成勞肝脈弦出寸口上魚際者急與婚配宜加味小柴胡湯若干嗽地黃湯去丹澤加甜杏仁五味白芍貝母婦人經少漸閉五心煩熱肌削脈數乃陰虛陽乘當養血益陰人參固本丸下利而經斷者利止經自來若脈微澀雖經止二三月不行亦非胎養血經自行也經早先期至者主血熱加味四物湯添鮮藕紅棗立齊分肝經血燥者加味逍遙散脾經鬱滯者歸脾湯肝經怒火者加味小柴胡湯血分有熱者加味四物湯勞役動火者補中益氣湯景嶽分血赤膿紫脈洪多火而經早者清化飲微火陰虛內熱動血者保陰煎脈證無火心脾不攝經亦早者小營煎七福飲加杜仲五味子若一月二三至者乃氣血敗亂當調其寒熱虛實不得以經早血熱概之大約血熱者腹多不痛其來必多固經丸加生地黃芍藥經遲後期至者主血虛加味五珍湯立齊分脾經血虛者人參養營湯肝經血少者地黃湯氣血俱弱者八珍湯景嶽分血淡不鮮脈微遲無火而後期者大營煎亦有陰火內爍血本熱而仍後期者乃水虧血少加味四物湯地黃丸過期作痛者氣血兩虛八珍湯加木香肥人過期色淡為痰二陳湯加芎歸貝母大約血虛者腹多空痛脈大無力或濡細八物湯加香附經亂遲早無定乍前乍後多因心肺虛損滋血湯或因受驚氣亂經亦亂者茯神棗仁柏子仁麥冬下歸附丸或氣盛於血不受孕者抑氣散景嶽分三陰虧兼陽虛者大營煎去牛膝憂思損心脾者歸脾湯七福飲食少脾不健運宜溫燥者理中湯六君子湯脾虛不攝為淋漏者保元湯加杜仲芡實牡蠣肝虛不藏多驚惕者補肝散去獨活木瓜加茯神情志不遂肝脾氣結經期亂者逍遙飲經痛有經前身痛拘急者散其風越痛散加秦艽有經前腹痛畏冷者溫其寒調經飲加薑桂茴香氣滯者行其滯加味烏藥湯血瘀者逐其瘀通瘀煎氣血㽲結者理其絡失笑散癥瘕痞脹者調其氣血交加地黃丸虛寒急痛者溫其里五物煎痛在經後者補其虛八珍湯加香砂一切心腹攻築脅肋刺痛月水失調者和其肝元胡索散加枳殼經滯臍腹痛不可忍者導其壅琥珀散從本事方改訂並治産後惡露不快血上搶心迷悶不醒氣絶欲死金匱云婦人腹中痛當歸芍藥湯主之此補中瀉木又云婦人腹痛小建中湯主之此亦補脾伐肝之意經色凡經以色紅為正其紫者風也四物湯加荊防白芷黑者熱甚也四物湯加芩連紫黑兼腹痛者氣血並也四烏湯加蓬朮川連不痛者但加川連淡白者虛而兼帶也芎歸湯加參耆朮芍赤白兼臍腹冷痛者虛寒也伏龍肝湯如米泔水如屋漏水或帶黃混濁模糊者濕痰也六君子湯加蒼朮香附如豆汁者熱也四物湯加丹參丹皮成塊成片者血隨氣凝或風冷乘之也通瘀煎去澤瀉風入胞門忽崩鮮血一味防風丸旋夏花湯下倒經經期氣逆直犯清道而為吐衄折其逆勢而調之用山梔丹皮生地丹參白芍蘇子鬱金童便或用四物湯和韭汁童便服因怒火傷肝致逆者龍膽丹皮青皮黃芩白芍山梔因心氣不足衄血面黃者茯苓補心湯居經三月一行為居經俗名按季或由脈微氣血俱虛或由寸口脈微而澀少陰脈微而遲或由陽脈浮大陰脈反弱又一歲一行者為避年此因稟受不齊勿與經閉同治淋瀝不止症多氣不攝血止經湯加參耆子宮虛寒淋瀝膠艾四物湯血分有熱不斷蒲黃散乍多乍少經水過多當歸飲過多淋瀝膠艾四物湯或保元湯經水澀少四物加葵花湯調經脈候尺脈滑血氣實婦人經脈不利少陰脈弱而微微則少血寸口脈浮而弱浮則為虛弱則無血脈來狀如琴絃苦少腹痛主月水不利孔竅生瘡肝脈沉主月水不利腰腹痛尺脈來而斷續者月水不利當患小腹引痛氣滯上攻胸臆腎脈微澀為不月附方氣血八珍湯見一卷中風痰阻導痰湯見一卷中風補血四物湯見一卷中風補脾歸芍異功散異功散見中風此加歸芍各二錢補腎六味地黃湯見一卷中風心脾歸脾湯見二卷勞瘵心脾小營煎歸地各二錢半白芍杞子山藥各二錢炙草一錢茯神棗仁各二錢勞嗽劫勞散見二卷咳嗽咳傷紫菀湯見二卷肺癰升補補中益氣湯見一卷中風固攝大補元煎見一卷中風降火芩連四物湯四物湯加芩連心火三和湯地芍歸芎芩梔翹草大黃朴硝薄荷等分水煎氣血五補丸參地苓牛膝地骨皮等分蜜丸酒下氣血衛生湯歸芍各二兩黃耆三兩炙草一兩每服半兩水煎破瘀當歸散歸芍劉寄奴枳殼延胡沒藥等分為末酒下二錢破瘀元歸散元胡索當歸每服三錢加姜煎通補柏子仁丸柏子仁牛膝卷柏各五錢澤蘭葉續斷各一兩熟地三兩酒煮杵成膏蜜丸通補澤蘭湯澤蘭葉三兩歸芍各一兩甘草五錢每服五錢水煎通瘀牛膝散牛膝一兩歸芍桂丹桃仁延胡木香各七錢五分為末每服三錢酒調瀉熱玉燭散見六卷腹痛肝燥加味逍遙散見一卷火肝怒加味小柴胡湯小柴胡湯見一卷溫此加麥冬生地各二錢益陰固本丸見一卷中風血熱加味四物湯四物湯加丹梔柴火熱清化飲地芍丹芩苓麥各二錢石斛一錢如小水赤熱怒火動血加黑山梔夜熱加地骨皮內熱保陰煎見五卷痙心脾七福飲見三卷郁經多固經丸黃藥白芍各三兩黃芩二兩炙龜板四兩樗根皮便制香附各一兩半酒糊丸桐子大每服五七十丸白湯下氣血加味八珍湯八珍湯加柴胡黃耆各五分香附丹皮各八分血虛養營湯見二卷勞瘵經遲大營煎見三卷關格痰阻二陳湯見一卷中風虛痛八物湯地芍歸芎延胡苦楝各一錢木香檳榔各五分經亂滋血湯參耆苓山藥各一錢芎芍地各八分氣亂歸附丸當歸四兩香附八兩童便浸透曬乾再加酒醋鹽薑汁製為末醋糊丸空心砂仁湯下三錢血虛加熟地寒加桂附氣盛抑氣散香附四兩陳皮一兩茯神甘草各五錢為末開水下二錢脾虛理中湯見一卷中風補脾六君子湯見一卷中風脾虛保元湯見一卷火肝虛補肝散地術各一兩棗仁獨活各四兩歸芎耆味山藥山萸木瓜各五錢為末每服五錢加棗煎情志逍遙飲熟地三錢當歸棗仁各二錢茯神白芍各錢半陳皮八分遠志五分炙草一錢氣虛加人參風痛越痛散虎骨歸芍術苓草防芷續斷藁本各三錢附子八分每服五錢水煎寒痛調經飲當歸牛膝各三錢制香附二錢茯苓青皮各錢半山楂炒二錢水煎脹悶加厚朴砂仁氣滯加烏藥行滯加味烏藥湯烏藥砂仁木香元胡索各一兩香附二兩炙草一兩半為末每服七錢姜三片水煎逐瘀通瘀煎見五卷厥症理絡失笑散見六卷胃脘疼氣血交加地黃丸生地一斤搗汁浸生薑渣生薑一斤搗汁浸生地渣香附八兩人參一兩五錢桃仁二兩延胡索當歸川芎白芍沒藥木香各一兩五錢糊丸溫里五物煎熟地當歸各二錢白芍錢半川