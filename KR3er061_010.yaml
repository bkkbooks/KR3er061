燈心薏米杜仲沙苑子加黃耆炙甘草飴糖貝母百合數服而起何氏五旬外寒從背起督脈陽虛帶下經旬腎真失固多奇經主病脈象兩尺虛澀右關滑左寸強系操勞擾動心陽中脘停痰時悶時熱煩嘈乾嘔恍惚失寐先用溫膽湯去枳實加茯神梔子炒一服能寐子後便瀉怯冷有年陽分素虧急須溫攝鹿角霜杞子炭茯神杜仲炒砂仁潞參龍眼肉蓮子炒一啜寒止三劑諸症全瘳前陰諸疾論治肝脈抵少腹環陰器督脈起少腹以下骨中央女子入系廷孔循陰器凡婦科前陰諸症不外肝督二經主病然有陰腫陰癢陰冷陰挺陰蝕等類為條列而分治之陰腫玉門焮腫並兩抅俱痛憎寒發熱小水澀少肝經濕熱也龍膽瀉肝湯滲而清之陰腫急痛寒熱往來肝火血虛也加味逍遙散涼而調之風熱客於陰經焮發腫痛小水淋瀝積熱閉結也元參荊芥藁本甘草梢加入大分清飲宣以泄之陰腫下墜氣血虛陷也補中益氣湯舉而補之但腫痛者加味四物湯涼而和之腫痛而玉門不閉者夾虛也逍遙散或十全大補湯和而補之濕癢出水兼痛者憂思過也歸脾湯加丹芍柴梔調暢之腐潰者內服逍遙散外以黃柏面海螵蛸末滲之如因産傷陰戶而腫者不必治腫但調氣血腫自退産後受風而腫者芎歸湯加羌防荊芥等煎湯洗之陰腫如石痛不可忍二便不利用枳實陳皮各四兩炒香研末乘熱以絹包從上身尉至下部並陰腫處頻頻尉之冷則互換氣行自愈又陰腫以海螵蛸散外敷陰癢陰中癢多由肝經濕熱化生䘌蟲微則癢甚則痛或膿水淋瀝治宜清肝火加味逍遙散龍膽瀉肝湯如小腹脹痛晡發寒熱者加味小柴胡湯怒傷肝脾胸悶陰癢者加味歸脾湯瘦人陰虛燥癢者六味丸三錢合滋腎丸一錢外用蛇床子川椒煎湯熏洗日三次癢甚必有蟲以甘庶渣燒灰入冰片擦之或以豬肝煮熟納陰中引蟲出一婦患此諸藥不效因食黍穄米飯粥而愈陰冷婦人陰冷由風冷客於子臟宜五加皮酒其肥盛而陰冷者多濕痰下流二術二陳湯加羌活防風立齊謂陰冷屬肝經濕熱外乘風冷若小便澀滯小腹痞痛宜龍膽瀉肝湯內傷寒熱經候不調宜加味逍遙散寒熱體倦飲食少思加味四君子湯鬱怒發熱少寐懶食加味歸脾湯下元虛冷腹痛便溏八味丸陰冷用溫中坐藥蛇床子研末白粉少許和勻如棗大綿裹納陰中自熱或以蛇床子五錢吳茱萸三錢加麝少許為末蜜丸以綿裹納之陰挺婦人陰中挺出數寸如菌如芝因損傷胞絡或臨産用力所致以升補元氣為主補中益氣湯若肝經濕熱小水澀滯龍膽瀉肝湯陰虛滑脫固陰煎祕元煎肝脾氣鬱歸脾湯服藥不效用一捏金丸婦人瘕聚陰中突出如茄子與男疝同亦名㿗疝臥則上升立則下墜多因氣虛勞力舉重宜大補元煎陰蝕陰中生瘡如小蛆名曰䘌痛癢如蟲行膿水淋瀝乃七情鬱火傷損肝脾致濕熱下注其外症突出蛇頭或如雞冠腫痛濕癢潰爛出水其內症口乾內熱經候不調飲食無味體倦發熱胸膈不利小腹痞脹赤白帶下其治法腫痛者加味四物湯濕癢者加味歸脾湯淋澀者龍膽瀉肝湯潰腐者加味逍遙散腫悶脫墜者補中益氣湯加山梔丹皮佐以外治法肘後方杏仁雄黃白礬各五錢麝香二分為末敷入交接出血女人交接輒出血作痛多由陰氣薄弱腎元不固或陰分有火而然如肝腎陰虛不攝者固陰煎陰分有火者保陰煎心脾不攝者歸脾湯千金方用桂心伏龍肝各五錢為末酒下交接違理出血用亂髮青布燒灰敷之立止或以赤石脂末滲之或以五倍子末摻之一婦交接出血輒面黃如蠟終身不育傷丈夫頭痛強弱相陵四肢沉重頭痛昏暈局方來復丹立齊用補中益氣湯六味丸以滋化源集驗方用生地八兩白芍五兩甘草三兩香豉一升蔥白四兩生薑二兩水七升煮取二升分三服忌房事小戶嫁痛內用甘草生薑白芍各五分桂心二分煎服外用甘草小麥煎湯洗效或以海螵蛸燒為末酒調服前陰症脈候少陰脈滑而數者陰中生瘡少陰脈弦者白腸必挺核脈經附方泄熱龍膽瀉肝湯見三卷諸氣除蒸加味逍遙散見一卷火泄濕大分清飲見四卷泄瀉升補補中益氣湯見一卷中風涼血加味四物湯見本卷調經補虛十全大補湯見一卷中風調補歸脾湯見二卷勞瘵和血芎歸湯芎歸芷草龍膽草煎湯熏洗敷藥海螵蛸散海螵蛸人中白等分為末先以百草湯煎洗再以此藥摻之如干以麻油調或加冰片敷之治陰腫癢及下疳皆效和解加味小柴胡湯見本卷産後滋陰加味歸脾湯見本卷胎前滋陰六味丸見一卷中風降火滋腎丸見一卷火散寒五加皮酒五加皮乾薑丹參蛇床子熟地杜仲各三兩杞子一兩鍾乳粉四兩以酒十五斤浸溫服燥痰二術二陳湯見二卷痰飲補脾加味四君子湯參苓術草耆扁豆各一錢加薑棗煎溫補八味丸見一卷中風止脫固陰煎見二卷脫攝陰祕元煎見四卷三消暖肝一捏金見七卷疝氣補元大補元煎見一卷中風清火保陰煎見五卷痙通利來復丹一名養正丹見三卷嘔吐前陰脈案夏氏暑月孕後小水赤澀子戶癢甚日晡寒熱此由胞宮虛感受濕熱也內用龍膽瀉肝湯加赤苓燈心煎服外用蛇床子川椒白礬煎湯熏洗再用杏仁雄黃朝腦研末摻入戶內愈姜氏孕六月濕襲子戶小水淋瀝作癢用茅朮生五加皮苦參當歸蛇床子川椒煎湯熏洗內服導赤散加滑石愈王氏産後氣虛陰脫兩尺空用補中湯去柴胡加菟絲子杜仲芡實外用龍骨牡蠣俱研細托之孔氏陰挺時流膿水脈虛澀內服補陰益氣煎加白芍外用川芎當歸白芷熟礬銀花甘草煎湯熏洗拭乾用五倍子研末摻之唐氏數年經閉陰瘡內潰晡熱食減頭眩口乾肢痛便燥身面俱發丹毒紅暈據述為伊夫疳毒所染內服加味四物湯添金銀花甘草嫩桑枝外用忍冬藤魚腥草甘草苦參煎湯熏洗拭乾用海螵蛸人中白冰片名螵蛸散摻之數次熱痛減紅暈消改加味逍遙散去朮加生熟地黃麥冬等服又用青黛黃柏研面山梔薄荷俱研麻油調搽諸瘡論治經云諸痛癢瘡皆屬於心瘡者癰疽之總名凡紅腫焮熱稱癰癰發六腑為陽白陷硬痛稱疽疽生五臟為陰癰發速而疽起遲疽根深而癰毒淺總因氣血凝結經絡阻滯而成癤則癰毒之小焉者也古云陰滯於陽則發癰陽滯於陰則發疽脈浮洪滑數為陽沉小澀遲為陰亦有似陽不甚焮赤似陰不甚木硬漫腫微痛此為半陰半陽症凡寒熱腫痛如風邪內作無頭無根時毒漫腫無頭有根氣血交搏有頭有根血與氣壅則成腫血為毒勝則成膿毒為寒凝則平陷絡為痰滯則結核腫高而軟者發於血脈陷下而堅者發於筋骨平漫色黯者發於骨髓宜分氣血虛實毒勢淺深輕重為治瘡根大而牢者深盤小而浮者淺初起惡寒壯熱拘急煩躁者重起居如常飲食知味者輕頭如粟米發如蓮蓬者重一頭焮赤腫高知痛者輕凡腫瘍主治初起熱甚焮痛宜清涼消散真人活命飲或金銀花酒若見表症寒熱往來宜疏邪荊防敗毒散無表裡症焮腫有頭宜和解兼消清熱消風散去耆術裡實便祕宜疏通內疏黃連湯若表裡不實內熱口渴宜生津竹葉石膏湯患成未消宜化毒從小便出內消散若毒氣內攻嘔惡煩躁口乾宜護膜解毒護心散琥珀蠟礬丸以指按患頂陷而不高起而不熱者膿未成也作膿而痛托裡消毒散按之半軟半硬者膿未熟也透膿散按之隨指而起頂已軟而熱甚者膿已熟也針以泄之無膿仍宜消散醒消丸有膿勿令久留代刀散敷腫瘍熱毒用如意金黃散貼用五龍膏其散漫未作膿者敷用真君妙貼散或妙貼散留頂以泄毒潰瘍主治膿將成而根盤散漫者氣虛不能束血緊附也內服托裡養營湯外敷鐵桶膏紅活而潤者氣血化毒外出也外紅里黑者毒滯於內也托裡消毒散紫黯不明者氣血未充不能化毒成膿也托裡散或托裡黃耆湯瘡口久不斂者氣血兩虛也參耆托裡散八珍湯口不斂肌不生者脾氣虛也四君子湯加白芍木香潰後反痛者亦虛也內補黃耆湯外敷乳香定痛散如氣虛作痛四君子湯加歸耆血虛作痛四物湯加參耆腎水虛作痛六味地黃湯已潰脈虛數焮痛營分熱也宜滋陰四物湯生熟地黃並用加地骨皮銀花已潰作渴便祕者胃火熾也宜滋液竹葉石膏湯潰後腐肉不化者陽虛氣陷也宜溫托四君子湯加黃耆肉桂凡毒發陰分平漫木硬不甚腫痛者乃由痰氣陰寒非陽和通腠不能解其冰凝營血枯衰非溫暢滋陰何由厚其膿汁如陽和湯以麻黃開腠以白芥子理痰以熟地鹿膠和陰陽以薑桂解寒凝蓋毒以寒凝溫散則毒自化膿由氣血溫托而膿乃成如人參養營湯十全大補湯若清涼之劑止可施於紅腫癰癤而已其有嘔逆者不可泥於毒氣內攻概用敗毒等散有寒涼藥傷胃致嘔者宜托裡溫中湯倘誤用攻毒則內陷者不能外潰矣其半陰半陽似腫非腫欲潰不潰因元氣失於補托宜沖和湯補而兼散可也其膿熟不潰以替針丸塗瘡頭膿自出若膿未流利用針於紋中引之以線藥紉之膿出仍腫痛或為筋膜間隔亦用針引紉以線藥倘刀針割傷瘡口不合用豬蹄湯洗敷貼神異膏服內托黃耆丸則瘡口斂潰後血自出四物湯加山梔丹皮潰後真陰虧虛火炎發熱作渴急用加減八味丸或五味子湯潰後發熱煩躁不寐血虛也聖愈湯自汗不止氣虛也四君子湯加黃耆五味發熱煩擾筋惕肉瞤氣血虛也八珍湯大渴面赤脈浮洪陰虛發熱也當歸補血湯煩擾面赤脈沉微陰盛發躁也四君姜附湯其潰後便瀉有因胃傷寒涼不化者六君子湯加神麯乾薑有因脾氣虛弱失運者六君子湯送二神丸有因脾胃兩虛食少無味嘔瀉者八仙糕有因氣虛下陷者補中益氣湯送二神丸有因脾腎虛寒者參附湯送二神丸凡一切潰爛諸瘡宜貼貝葉膏摻腐盡生肌散潰爛紅腫熱痛摻生肌定痛散或輕乳生肌散蓋腐去則新生然必毒氣已盡方用生肌藥若太早則患更腐潰如果毒盡而脾氣壯則肌肉自生以脾主肌肉也如欲腐脫肌生宜貼絳珠膏生肌通用宜搽玉紅膏外以太乙膏蓋之梅瘡杖瘡臁瘡下疳等症去腐生新宜貼瑩珠膏新肉已滿不能生皮宜月白珍珠散摻之附方消散真人活命飲見五卷鶴膝風清消金銀花酒金銀花五兩甘草一兩煎好入酒分三服疏散荊防敗毒散見一卷疫和解清熱消風散柴耆翹陳角刺蒼朮紅花各一錢芎草防歸芍芩花粉銀花各五分表裡內疏黃連湯梔荷翹芩桔歸芍連木香檳榔各一錢大黃二錢甘草五分加蜜一匕水煎生津竹葉石膏湯見一卷傷風化毒內消散二母乳沒銀夏花粉白芨甲片角刺各一錢水酒煎解毒護心散緑豆粉一兩乳香三錢辰砂甘草各一錢研細每服二錢開水調日二次護膜蠟礬丸黃蠟一兩白礬一兩二錢熔化入雄黃錢二分琥珀研一兩白礬一錢攪勻作丸如桐子大硃砂一錢為衣每服二三十丸消托托裡消毒散見本卷乳潰毒透膿散生耆四錢甲片一錢芎三錢歸二錢角刺錢半水煎消散醒消丸乳沒各一兩麝香一錢半雄精五錢共研和黃米飯一兩搗丸酒下三錢醉蓋取汗潰膿代刀散角刺黃耆各一兩草乳各五錢每酒下三錢敷毒如意金黃散大黃朴芷星陳柏草姜黃花粉蒼朮或蜜蔥汁及酒調敷貼毒五龍膏五龍草即烏蘞銀花豨蘞草車前草陳小粉等分上四味用鮮者搗爛加飛鹽三分貼敷毒真君妙貼散蕎麵五斤硫黃十斤研白麵五斤用清水拌捍成薄片曬乾用時再研水調貼氣血托裡養營湯參耆術歸芍芎各一錢熟地二錢五味麥冬甘草各五分姜三片棗一枚煎根散鐵桶膏銅緑五錢明礬四錢膽礬三錢五倍子炒一兩白芨五錢輕粉鬱金各二錢麝香三釐研細以米醋於杓內漫火熬調藥末一錢塗瘡根上毒滯