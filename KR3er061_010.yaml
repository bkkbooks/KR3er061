胎死平胃散見一卷中風腹冷香桂散麝香五分桂心二錢酒下腹冷黑神散見二卷血産難黑龍丹五靈脂當歸生地川芎良薑各二兩以上入砂罐內鹽泥封固煅紅研細入百草霜三錢乳香硫黃琥珀花蕊石煅各研三錢共和糊丸彈子大臨服煅紅入薑汁浸服酒下胎前脈案石氏灑淅惡寒嘔吐絶谷湯飲不下者四旬余奄奄沉困身冷而陽垂絶診之脈伏沉候似無豫斷為胎其家疑未信豫謂此惡阻之重者胎無疑也夫胞宮血聚氣不下行必至濁陰上犯阻塞陽和嘔逆厥冷非姜附無以通陽泄濁其翁懼熱藥胎墮豫曰經云有故無殞保無憂也先與熱薑汁繼和以米汁嘔吐止進附子理中湯加製半夏二劑身溫嗣用異功散加砂仁煨姜五服而安至期産一女鄭氏寒熱咳痰食減經阻醫謂損怯進補劑中滿嘔噦惡聞食氣煩暈善驚更醫以為肝風用和營鎮驚延及神色困憊時或暈絶舉家惶惑請臨診一決豫曰此胎脈右尺已動滑勿藥可也經云陰搏陽別謂之有子言陰搏於下陽別於上氣血調和即胎脈也脈訣云尺內不止真胎婦尺脈綿綿不絶為胎結也無已姑用益陰和陽白芍柏子仁茯神甘菊炒棗仁炙草小麥桑葉南棗四服漸安後生一子某氏經閉成塊疑為瘀腹痛猝崩醫云瘀滯未浮用攻消藥淋脹日甚豫謂瘀血既行理無作脹診脈陽虛而陰搏知妊娠血漏用七味阿膠散加白芍木香杜仲續斷血止脹消後果孕産此安胎止漏兼暢脾攝血脹痛自除蓋妊娠下血名曰胎漏多由閃挫損傷胞絡致之若轉用攻伐再動新血益加虛痛作脹直至墮胎方悔耳魏氏經止兩月腹痛脹食減夜熱醫謂經閉用通利藥血下不止更醫見同用牛膝紅花炮薑枳殼漏益甚腹加痛脹頭暈腰疼煩熱不寐豫診之覺尺脈搏指兩寸獨別胎脈也但熱久攻伐藥多恐損動胎元且致胞系不固耳用香附童便制白芍炒行氣和血以除痛脹蒲黃炒黑荊芥醋製止血而除暈杜仲酒炒阿膠水化熟地炒固腎以攝下茯神麥冬棗仁炒安神以止煩一服症減而思食胎如指墮前方去白芍阿膠蒲黃麥冬加楂肉當歸醋炒炙草蓮子數服乃安謝氏孕逾三月男女分形病者漫謂血癥治者誤行攻伐致血下注胎墮身熱汗煩眩暈不寐索方乃桃仁牛膝莪朮紅花等劑明晨更加生楂肉豫見駭甚詢之則曰胎墮未便告知婉云瘀血已行耳醫尚未知所下男胎也因嘆庸手殺人殊堪髮指急以參耆茯神固攝元氣佐以炙草荊芥醋炒阿膠煬麥冬五味牡蠣醋煅龍眼肉紅棗數服汗收血止湯氏孕四月胎漏鮮紅系傷胞絡輒用芩芍苧根湯轉致腹痛泄瀉據脈候虛緩本非火迫絡傷致漏宜溫補彌隙自安仿膠艾湯海螵蛸阿膠杜仲茯苓杞子艾絨續斷炙草砂仁數服而安眭氏孕五月屢墮翁商之豫謂孕逢五月足太陰脈養胎想脾血素虧耳若獲孕先二三月預服固攝之劑用胎元飲參苓朮草地芍歸陳杜仲續斷砂仁菟絲芡實薑棗水煎每月服五七劑胎遂固生一子僅綿一線後竟不孕薛氏孕六月因勞便紅頭微眩此腸風宿恙因熱傷陰分而成用白芍地榆俱酒炒當歸荊芥俱醋炒山梔炒茯神炙草阿膠酒化側柏葉搗水煎三服而瘳侄女孕七月久泄瀉肛墜足腫吐咳腹微痛晡寒熱如瘧脈弦右尺滑大此中氣下陷土衰木乘以補中益氣湯減歸耆加砂仁製半夏茯苓煨姜數服痛墜寒熱俱減因其腸胃久滑不戒葷茹泄瀉仍作加穀芽炒茴香炮姜等味而安酆氏孕七月餘與夫口角為麵杖所傷左脅大痛下部如裂胎氣上逼撐拒欲死服婦科藥入咽格格不下喘吼待斃而已診之脈洪數無倫體如烙面如赭察其唇舌未變青紫知胎未損慰之曰幸母子俱無恙也用牛膝蘇梗栝蔞紅花各二錢歸尾枳殼各錢半降香銼三錢丹皮一錢煎服喘止痛定熱退進粥碗許隨用順氣安胎之劑而平族女孕八月因勞吐紅鮮紫成盆火升則嗆咳顴赤少寐口不知味服童便阿膠不止診脈左寸關大兩尺俱伏此君相之火逼傷陽絡必得火降嗆咳平紅自止用生地山梔連翹白芍杏仁貝母百合茯神甘草蓮子燈芯阿膠煬三服咳稀血止安寐矣後用熟地當歸白芍杜仲鹽水炒杞子焙以實下元尺脈亦起呂氏將産腹痛血下脈短滑左虛芤豫謂脈未離經決非正産右關短滑系食滯腹痛見紅由觸損但須行氣補血用紅米曲陳皮楂肉利氣消滯以當歸白芍和血定痛逾兩旬乃産某氏過期不産按月經行事所或有今述孕已兩載兼見乳汁腹大不産計欲攻墮然細診卻非産脈須知漏卮不塞孕何由成且萬無攻墜之理雖屬怪症應以常法主治惟明理者知之方用熟地潞參當歸白芍白朮炙草杜仲杞子續斷砂仁廣皮蓮棗此以氣攝血之劑多服則漏止胎長接服二十劑又逾八九月而産臨産治要臨産將護良方條列備已陳自明編婦人良方薛立齊附訂醫按茲並考綱目醫通諸家張石頑老人著醫通武之望編濟陰綱目周頲作産寶張介賓景嶽全書撮舉其要凡孕至八九月服達生散數劑則易産至臨月胞漿未破而血先下者或是傷胎尚非正産宜大劑保元湯加當歸阿膠如胎氣上逆急服熱童便或用紫蘇飲若正産時氣血動蕩脈必滑疾異常如脈尚安和腹雖痛而未緊猶試痛也必腹連腰陳痛益緊兒欲轉身順産自然胞破水下如瓜熟蒂落不用催生太早只須産前補血降氣用滑胎煎繼則活血行氣用保生無憂散亦有胎衣不固或用力太早隨觸而破至胞漿下而仍不産恐其水涸路澀兒難轉身但服八珍湯或大劑五物湯加葵子枳殼助其氣血則胎滑易産若持久力乏用獨參湯補接元氣雖逾數日旬日而産者有之男胎向內女胎向外皆首居上足居下臨産時必倒轉順出須再三緩緩扶掖走動使得旋轉否則有橫逆之患丹溪云催生只用佛手散最穩而效或合濟生湯亦佳更有兒頭正抵産戶而交骨不開此陰氣虛用加味芎歸湯不應加人參童便若坐産艱難用兔腦丸如聖散如意散其兒手先出為橫生足先出為倒産由産母用力太早當令仰臥以鹽少許擦兒手足心以中指摸其肩攀正之候其身正方可用力更有兒頭偏注左右腿者為偏産由母力逼致之亦令仰臥輕輕以手推上扶正用力送下若兒頭已正不能即産因臍帶絆其肩者為礙産亦令仰臥推兒向上以指按兒肩去其絆若兒未出産母腸先出者為盤腸生待兒並胎衣下後用香油抹手徐徐送入或用醋和水噀産母面每噀一縮三噀盡收其萆麻子研塗頂心腸可吸入法殊不效驗然後半坐以軟布抵之內服舉元煎若胎死腹中須驗産母舌青黑爪青紫口沫腹陰寒而氣穢急用平胃散加朴硝若胎死久幹著背者葵子阿膠滑之胎衣不下先用軟帛繫住臍帶乃斷兒臍帶勿令血入衣中脹而難下內服回生丹或牛膝湯可下如久不下血入衣中上衝心胸喘急痛脹急宜逐瘀用牛膝散或失笑散溫酒調服胎衣立下景嶽云胞在腹中形如荷葉上仰則聚血而脹凝難出當令穩婆以指攀其上口令惡露傾瀉則腹空胞自落矣如氣虛腹不脹痛只宜無憂散或黑豆二合炒透燒紅鐵稱錘淬酒將豆淋酒化益母丹二丸既産陰氣虛産門不閉或陰火下流陰挺突出其氣血虛而不閉者十全大補湯加五味子補而斂之其憂思傷脾熱痛者加味歸脾湯腫而焮痛者逍遙散加丹皮山梔荊芥暴怒傷肝動火者龍膽瀉肝湯元氣虛子宮不收補中益氣湯加桂心醋炒白芍補而舉之産時氣隨血去忽頭眩眼黑神昏口噤其症有二一為氣脫一為血暈氣脫者面白眼閉口開手冷脈細欲絶速用人參一二兩濃煎徐灌但得下咽即蘇稍遲則無救矣血暈者臨産元氣已損惡露乘虛上攻頭暈眼花心胸悶絶速用熱童便灌服清魂散如下血多而暈神昏煩亂者芎歸湯加人參三五錢澤蘭葉一握煎童便半盞和服補而兼散之下血少而上搶心者童便煎失笑散加鬱金汁痰壅氣粗者二陳湯加薑汁並用燒紅稱錘以醋沃之使産母嗅其氣則暈可止若狂亂失志為敗血衝心多死花蕊石散或奪命散嘔惡腹滿為惡露沖胃平胃散加薑桂面赤嘔逆為氣血沖肺人參蘇木煎其惡露不行腹痛拒按用桃仁歸尾延胡赤芍等逐瘀惡露不止淋瀝太多血熱者保陰煎絡傷者固陰煎肝脾氣虛者補中湯氣血虛色淡者十全大補湯怒火傷肝者加味四物湯兒枕作痛用生熟山楂肉砂糖煎服或用延胡散腹痛連腰按之痛緩為虛宜當歸香附炙草杜仲小茴香等或用當歸建中湯此皆臨産成法撮舉之為因心化裁者鑑焉論血暈産後血暈因陰血暴虛孤陽上冒忽然頭旋眼黑昏悶不醒急用清魂散或以童便熱服然有血下過多而暈者有血下少而暈者暈雖同治法則異如血下多而暈神昏煩亂而已治宜補血清心如生地白芍當歸茯苓麥冬阿膠人參龍齒棗仁等渴煩汗熱加烏梅山梔丹參浮小麥等煩熱去當歸加童便血下少而暈乃惡露不下上搶心心下滿急神昏口噤治宜行血破瘀加生楂肉桃仁牛膝桂心歸尾蘇木合失笑散或用四味散黑神散鹿角散鬱金散若痰火上壅用導痰湯加硃砂安神丸清降治之有一産婦暴死但胸微熱陸曮診之曰血悶也以紅花煮沸入木桶寢婦於上熏之湯冷加之遂指動而蘇論産後諸禁一禁臥恐氣未定遽臥則惡血上升也二禁酒恐助火升動其陽致眩暈也三禁浴恐水濕沁竅致喘滿腫重也四禁寒恐血氣凝滯腹痛吐瀉諸變叢生也五禁汗恐風藥性升開泄傷陽也六禁下恐腸腑津液傷也七禁利小便恐傷腎氣蟄藏也八禁寒涼藥恐傷胃或滋瘀痛也白芍地黃黃芩等皆慎用九禁交合早恐百脈開張頭眩少腹急滿也十禁起早作勞不避風寒不謹食忌致滋疾也臨産脈候胎前脈宜實胎後脈宜虛産後寸口脈洪疾不調者死沉微附骨不絶者生沉微而滑者生實大弦急者死胎前脈當洪數産後仍洪數者死胎前脈細小産後脈洪大者多死附方順胎達生散大腹皮三錢人參陳皮紫蘇各五分歸身白朮各一錢白芍錢半炙草二錢蔥五條黃楊葉梢七個水煎傷胎保元湯見一卷火上逆紫蘇飲見本卷胎前降氣滑胎煎歸地各三錢山藥杜仲各二錢川芎枳殼各七分催生保産無憂散歸芎芍枳草木香各一錢半水煎再入乳香研血餘燒存性研各五分和勻服助氣血八珍湯見一卷中風催生五物湯四物湯加肉桂催生三合濟生湯當歸三錢川芎枳殼各二錢制香附大腹皮各錢半蘇葉八分甘草七分水煎待腰痛腹痛時服之立産開骨加味芎歸湯當歸一兩川芎五錢敗龜板一個酥炙婦人頭髮一握燒灰每服一兩水煎産難兔腦丸兔腦研如膏一個乳香二錢半母丁香一錢麝香一字共研細以兔腦髓和丸芡實大陰乾每一丸溫水下産難如聖散紫蘇當歸等分每服三五錢産難如意散人參乳香各一錢辰砂五分為末臨産時用雞蛋清一個調藥末再用薑汁調服催生佛手散當歸三兩川芎四錢研末分四服加酒半杯和服固血如神散百草霜白芷各等分每服二錢以童便米醋和加沸湯調服治橫生逆産血得黑則止能固血免血涸也産難立應散當歸車前子冬葵子白芷各三錢牛膝大腹皮枳殼川芎各二錢白芍一錢水煎治橫生逆産盤腸舉元煎見三卷飲食胎死平胃散見一卷中風滑胎葵子阿膠湯葵子一升阿膠二兩水煎胎衣不下回生丹蘇木三兩水煮去渣紅花三兩酒煮去渣黑豆三升水煮去豆大黃一斤為末煮熬成膏次下上三汁再熬人參白朮青皮木瓜各三錢當歸川芎延胡香附蒼朮蒲黃赤茯桃仁熟地各一兩牛膝三稜山萸五靈脂地榆甘草楂肉陳皮白芍各五錢良薑四錢烏藥二兩半木香沒藥乳香各一錢共為細末用前膏杵丸彈子大金箔為衣隨症酌用每一丸白湯下同上牛膝湯牛膝瞿麥各四兩歸尾通草各六兩滑石八兩葵子五兩分五六服水煎一方有桂心逐瘀牛膝散牛膝川芎朴硝蒲黃各七錢五分當歸一兩半桂心五錢為末每服五錢加姜三片生地五錢水煎服消瘀失笑散見六卷胃脘痛峻補十全大補湯見一卷中風脾傷加味歸脾湯見本卷胎前腫痛逍遙散見一卷火火傷龍膽瀉肝湯見三卷諸氣升提補中益氣湯見一卷中風昏暈清魂散澤蘭人參各二錢半川芎八分荊芥穗醋炒二錢甘草一錢童便一杯和服痰暈二陳湯見一卷中風衝心花蕊石散見二卷血衝心奪命散血竭沒藥等分研細每服二錢白湯下沖肺參蘇煎人參蘇木各一兩血熱保陰煎見五卷痙絡傷固陰煎見二卷脫怒火加味四物湯四物湯香附炒五靈脂炒另研各一錢水煎痛甚加桃仁四分腹痛延胡索散見本卷調經腹痛當歸建中湯見一卷傷風血暈四味散當歸延胡血竭沒藥童便煎血暈黑神散見二卷血行血鹿角散鹿角炙灰童便酒調下行血鬱金散鬱金燒研二錢醋調下痰火導痰湯見一卷中風痰火硃砂安神丸見二卷汗産後論治新産營血大損陰倏虧於下陽易冒於上其甚者氣脫血暈遲則不救稍輕則頭汗目眩為鬱冒風入筋急為發痙陰虛陽浮為發熱火炎灼金為喘嗽氣促為虛煩不眠為驚悸盜汗而蓐勞成焉皆陰虛陽亢之咎徵也金匱論新産三症一血虛多汗出善中風故病痙二亡血復汗寒多故病鬱冒三亡津液胃燥故大便難心典云血虛汗出筋脈失養風入而益其痙此筋病也亡陰血虛陽氣遂厥而寒復郁之則頭眩而目瞀此神病也胃藏津液以滲灌諸陽亡津液胃燥則大腸失潤而大便難此液病也三症不同其亡血傷津則一故用藥忌辛熱再劫其陰即有外因亦忌風藥升舉其陽致汗脫血暈而斃産後陰傷下焦必損而奇經多麗於下衝任督帶皆失所司最多厥逆上攻腰脊腹痛紅白自下等症香岩先生案中於衝脈為病每用紫石英鎮逆任脈為病用龜板靜攝督脈為病用鹿角膠鹿茸溫煦帶脈為病用當歸宣補陽維為病苦寒熱用當歸桂枝湯和營陰維為病苦心痛用生化湯加肉桂溫寒此産後症所當審而用之者診新産先問腹之痛否以驗惡露有無如小腹脹痛者惡露未淨也鬱金桃仁牛膝延胡之屬行之手摸臍腹成塊者兒枕未消也失笑散或楂肉砂糖之屬消導之腹痛喜熱手按者虛寒氣滯也砂仁木香香附小茴當歸薑棗溫而通之再詢頭身痛否及曾否寒熱有汗無汗以辨外因內因如外感頭痛脈必浮芎芷防芥甘菊蔓荊辛散之血虛頭痛脈近數四物湯白芍用酒炒主之産後感冒不可輕汗如頭痛發熱脈浮傷風也香蘇飲加芎歸薑蔥輕解之身痛拘急惡寒脈緊寒邪也芎蘇飲加生薑溫散之初起頭暈發熱即煩渴脈右大溫熱症也蔥豉湯微汗之若脈遲身痛營分虛也當歸建中湯和之汗出身痛者營衛俱虛也歸耆建中湯兩和之自汗屬陽虛汗多亡陽輕則參耆地芍五味小麥之屬補而斂之重則耆附湯固其陽盜汗屬陰虛汗本陰液六味湯加麥冬五味牡蠣固其陰産後頭汗暈厥陽上冒也生地阿膠龍骨牡蠣茯神棗仁烏梅白芍小麥養陰以鎮陽産後惡寒陽不足也寸脈微補中益氣湯加薑棗發越之産後發熱陰不足也尺部弦六味湯加肉桂收攝之陰陽相乘憎寒發熱八珍十全諸湯調補之其惡露未淨者大調經散消補之若血去多不時發熱孤陽無所依附也四物湯益其陰必以炮姜苦溫收其浮越其肌灼面赤渴飲脈虛大者當歸補血湯以無形之氣生有形之血也寒熱咳嗽肌羸色悴者蓐勞也母雞湯豬腰湯或用參耆苓草五味山藥棗仁當歸白芍蓮子以扶脾其臟寒腹痛者下焦虛也歸姜羊肉湯溫養之白帶多腰脊痛者督脈空也鹿角膠杞子杜仲沙苑子菟絲餅芡實等填補之蓐勞寒熱食減泄瀉者損及脾陽也異功散加砂仁蓮子山藥益智肉果訶子溫攝之吐逆泄瀉肢寒者胃陽虛也附子理中湯溫胃飲急溫之嘔痞痰多者脾氣滯也香砂六君子湯健運之外感咳嗽聲重鼻塞者腠理疏也杏桔蘇前生薑先散之再用異功散去白朮加生黃耆以實之內傷嗽脾肺氣虛有痰者六君子湯加蜜炙桑皮主之火炎灼金嗆嗽者六味去萸澤加麥冬五味主之乾咳無痰火鬱於肺也甘桔湯加玉竹貝母杏仁百合開潤之産後血脫氣喘為孤陽絶陰危候也貞元飲主之吸氣促自汗肢冷虛陽欲脫也參附湯急救之若風寒外邪入肺而喘急者必氣粗嗽痰與吸促氣短不侔以金水六君煎主之或去熟地加杏桔蘇疏痰利氣若敗血沖肺致喘者人參蘇木煎奪命散主之産後腹滿悶嘔吐脘間有敗血者抵聖湯宜之傷飲食者和中飲消導之脾氣虛寒者六君子湯加炮薑木香溫補之胃虛氣逆者橘紅半夏湯加蔞杏苦降之肝木侮土者六君子湯加升柴疏暢之胃虛厄逆危症也理中湯加丁香古法用丁香散如不應急加參附遲則難救其因寒者丁香柿蒂散因痰者橘皮竹茹湯産後身面浮腫者氣虛水濕不行也須辨表裡如因浴早水漬入竅身重肌浮者濕腫也羌防芎蘇當歸防己汗之因水穀聚濕小便不爽者水腫也苓夏澤蘭車前木通利之如四肢浮脅腿刺痛者敗血流入經絡也小調經散或牛膝山甲歸尾琥珀紅花蘇木等消其瘀如氣不化水腫脹溺澀者腎陽虛也腎氣湯去丹萸以化氣而利水産後因驚發狂者血虛神不守舍也加味八珍湯主之敗血乾心狂言見鬼者心包受邪也茯苓散琥珀散加菖蒲汁鎮理之驚悸恍惚者心神不安也歸脾湯補之産後不語者或因敗血上閉心胞以清魂散加牛黃丹參蘇木理之因痰涎上干心竅用溫膽湯加菖蒲汁豁之因心腎氣虛不能上通於舌用七珍散補而開之産後汗多必發痙牙關緊急口噤肢搐者血虛風徑也十全大補湯加製附子峻補之若攻風則死然古法用小續命湯及大豆紫湯獨活湯最效朱奉議云無汗惡寒為剛痙小續命湯主之有汗不惡寒為柔痙上湯去麻黃加葛根産後汗出頭暈欲成痙厥者肝陰虛風陽動也阿膠生地黃茯神小麥牡蠣粉棗仁以生液産後類中風口眼喎斜腰背反折者血虛兼風火痰也芎歸湯加荊芥穗炒黑豆淋酒煎服以行血祛風或川芎散清理痰火凡筋脈夾寒則急夾濕則縱血虛風火入絡則狀類中風産後若作真中風用小續命等湯治則誤矣類中痿廢不起氣血虧筋緩弛也宜滋陰大補丸以壯養肝腎瘛瘲者筋脈拘急為瘛弛縱為瘲産後脫血風火熾而筋失榮養也八珍湯加丹皮鉤藤以生陰而退陽如不應用四君芎歸加丹皮鉤藤以補脾土如左脈弦血虛火灼也加味逍遙散六味丸以清肝火滋陰血古法用愈風湯交加散效産後麻瞀氣血虛而夾痰也右半身麻而暈經脈空而痰飲襲入也六君子湯加歸耆肉桂左半身麻而暈營血虧而風火襲入也十全大補湯産後顫振氣血虛而生風也急用十全大補湯手足拘攣制動者風客經絡也舒筋湯主之夾風熱加味逍遙散如虛寒十全大補湯産後鼻衄及口鼻黑氣胃絶肺敗也如血虛滯用參蘇煎加製附子如虛火上炎舌黑犀角地黃湯瘀血逆升鼻衄益母丸童便化服經驗方用緋線一條併産婦預心發二條緊繫中指節即止産後泄瀉脾上虛寒也六君子湯加炮姜溫攝之脾腎虛寒補中湯合四神丸升攝之命門火弱以八味丸補其母若傷食瀉六君子湯加楂肉神麯穀芽消運之完穀不化陽火虛也理中合四神丸瀉白沫如腸垢元氣陷也補中湯加桂苓炮姜升舉之滑泄不止參香散收澀之産後痢疾青白屬寒紫赤屬熱寒熱相搏赤白雜下寒熱生冷傷腸胃也虛寒腹痛理中湯加木香白芍主之胃虛嘔痢六君子湯調補之熱痢後重白頭翁湯加甘草阿膠清理之赤白雜下腹絞痛救急散去熟地調之久痢後重補中益氣湯升舉之瀉痢脈濡緩胃濕也湯藥愈滋其濕宜參苓白朮散加肉豆蔻煎薑棗湯調服久瀉久痢肉蔻理中丸溫攝之瘧邪由感犯風暑一日髮間日發者小柴胡湯減黃芩補中益氣湯去黃耆選用風加紫蘇薄荷暑加香薷厚朴若産前陰瘧延及産後歸耆建中湯加參朮首烏和其陰陽寒多加黃耆熱重加鱉甲産後暑熱傷陰狀如瘧發治法忌表散劫液以鱉甲烏梅棗仁麥冬地黃石斛等甘酸生津以退熱且産後吸受時邪尤宜審治如暑傷肺氣必嘔悶以川貝母杏仁通草栝蔞鬱金肅降之燥傷肺津必咳渴以花粉天冬杏仁玉竹百合貝母蜜潤之熱陷心營必昏譫少寐以竹葉麥冬犀角生地連翹菖蒲汁涼沁之濕阻三焦必頭脹舌白不渴胸滿身痛溺少便溏以茯苓皮半夏桂枝厚朴栝蔞滑石上下分清之風溫犯上焦必灼熱頭蒙脘痞昏睡以山梔豆豉栝蔞桑葉貝母羚羊角辛涼以宣通微苦以清降濕溫化熱阻氣必頭重身熱痛咽痛脛冷以元參銀花杏仁栝蔞石斛薏苡滑石甘淡微苦輕解之寒暄失正痰飲上干必脅痛背冷咳逆不得臥或腸中漉漉有聲兼溺短足腫以桂枝半夏乾薑薏苡五味子茯苓白芍甘草辛酸淡滲泄之産後霍亂吐瀉停食者藿香正氣散主之虛寒者理中湯溫之吐瀉逆冷者附子散來復丹溫通之産後虛煩氣短者竹葉湯清補之産後積聚風冷與氣血相搏而成也積為陰在臟聚為陽在腑痛有常處四神散痛無定處芍藥湯選用血瘕氣血壅結因氣病而成血病也痛無定處失笑散加行氣藥後必扶正歸脾湯大便閉結津液涸也四物加桃杏仁潤之或五仁丸蘇麻粥皆效小便淋澀膀胱虛熱也六味湯或四物加茯苓甘草梢補而分利之潰溺頻數者氣虛不能約制也補中湯加益智仁覆盆子萸肉佐以桑螵蛸散升而攝之小水不禁脬損也桑螵蛸龍骨散攝之手傷脬破者歸耆湯加黃絲絹豬羊脬固補之氣虛補中湯加益智仁腎虛六味丸去丹瀉小便血熱乘血虛滲入脬中也發灰滑石甘草止之大便血鬱結傷脾也加味歸脾湯若因思慮傷心者炒香散膏粱積熱者加味清胃散醇酒濕毒者葛花解酲湯怒動肝火者加味小柴胡湯大腸風熱者四物湯加側柏槐花大腸血熱者四物湯加芩連槐花腸胃虛弱者六君子湯加升麻柴胡元氣下陷者補中湯加茯苓半夏氣血虛者八珍湯加升柴産後諸淋虛則頻數肺虛補中益氣湯腎虛六味丸熱則澀痛滑石散血淋加味四物湯産後帶下下元虛滑也金鎖匙丹或苓朮菟絲丸産後經行太早者乳必少年壯不自乳者不在此例脾虛不能攝血補中益氣湯心脾不能統血加味歸脾湯肝火迫血妄行加味逍遙散氣血兼虛八珍湯小便出糞大小腸交也先用六君子湯再用五苓散産後陰脫努力所傷也以當歸人參湯升之外用五倍子末固之生腸不收虛而滑也內服芎歸參耆升麻等外用香油潤腸絹托之或以燈草搐鼻取嚏立上産門不閉陰氣失斂也十全大補湯峻補之腫熱焮痛肝經虛熱注也加味逍遙散若因憂怒肝脾郁傷也加味歸脾湯因暴怒肝火血傷也龍膽瀉肝湯有産後産戶下一物如手帕丹溪云是肝痿以參耆歸朮升麻升舉之有産後水道中出肉線一條長三四尺動之則痛絶先服失笑散次以帶皮姜二斤研爛入清油二斤煎油干為度用絹兜起肉線屈曲於水道邊以姜渣熏冷則尉之乃縮上再服失笑散芎歸湯如肉線斷者不治諸凡産後症不一端而危莫危於血暈氣喘厄逆風痙難莫難於蓐勞虛嗽泄瀉積聚所尤要者産後下焦陰虛為傷其肝腎也而衝任督帶多隸肝腎用藥宜溫養固攝切勿重虛其虛致成下損不能復元前所條列大約根據良方薛按粗舉梗概其治法不盡於此云産後脈候新産之脈緩滑吉實大弦急者死沉小吉堅牢凶寸口澀疾不調死沉細附骨不絶生附方寒熱當歸桂枝湯見一卷傷風通治生化湯當歸三錢川芎炮姜炙草各一錢桃仁十三粒水煎塊痛失