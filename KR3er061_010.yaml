以加味逍遙散加澤蘭牛膝解鬱調經立齊謂堅而不潰潰而不斂皆由於氣血不足不加調補變為瘵症朝用補中益氣湯夕用六味地黃丸若發寒熱眼內有赤脈貫瞳人者死不治結核經年不紅不痛堅而難移久而漸腫疼者為痰核多生耳項肘腋等處宜消核丸專由肝膽經氣鬱痰結毒根深固不易消潰未潰前忌貼涼膏外宜山藥膏忌服涼劑內宜養營湯全生內消法用陽和犀黃丸王維德著外科症治全生集若堅久難消咸以軟之海帶丸寒凝氣滯溫以散之夏枯草白芥子厚朴半夏橘紅生香附風痰鬱結成核搜而逐之消風化痰丸氣火爍筋為痛清以泄之鉤藤山梔生地丹皮貝母連翹血結入絡為腫鹹辛通理之旋覆花湯加當歸尾延胡腫痛潰膿不痊和之內托白蘞散生耳項加鉤藤川芎連翹夏枯草生肘臂加薑黃桑條桂枝生兩腋加柴胡青皮白芥子生遍體多是痰注竹瀝達痰丸潰久不愈照瘰癧治法更有癭瘤初生如梅李狀皮嫩而光漸如杯卵癭生肩項瘤隨處皆有其症屬五臟其原由肝火癭有五筋癭者筋脈呈露宜玉壺散破結散血癭者赤脈交絡宜化癭丹合四物湯肉癭者皮色不變宜人參化癭丹氣癭者隨憂思消長宜白頭翁丸消癭散歸脾丸石癭者堅硬不移宜破結散瘤有五筋瘤者自筋腫起按之如筋或有赤縷此怒動肝火血涸而筋攣也六味丸或四物湯加山梔木瓜血瘤者自肌肉腫起久而現赤縷或皮色赤此勞役動火血沸而邪搏也四物湯加茯苓遠志肉瘤者自肌肉腫起按之實軟此鬱結傷脾肌肉傷而邪搏也歸脾湯補中益氣湯氣瘤者自皮膚腫起按之浮軟此勞傷肺氣腠疏而邪搏也補中益氣湯骨瘤者自骨腫起按之堅硬此房勞腎傷陰虛不榮骨也六味丸外有膿瘤宜海藻丸石瘤神效開結散一井散脂瘤用針挑去脂粉自愈凡癭瘤皆忌決破令膿血崩潰多致夭枉宜敷桃花散止血藥惟脂粉瘤紅色全是痰結可決去脂粉又有形似垂茄根甚小者用五灰膏點其蒂俟茄落以生豬脂貼自愈又有手背生瘤如雞距如羊角嚮明照之如桃膠名膠瘤以排針刺破按出膿立平生於面名粉瘤海藻浸酒飲有翻花瘤用馬齒莧燒灰研豬脂調服立齊云瘤者留也隨氣留滯皆因臟腑受傷氣血乖違當求其屬而治其本勿用蛛絲纏芫花腺等治又有毒堅如石形長似蛤瘡名馬刀亦屬肝膽三焦經部分浸及太陽陽明流注胸脅腋下不論未潰已潰用鮮夏枯草熬膏服並敷患處初起氣血未損用立應散一錢濃煎木通湯下毒從小便出如粉片血塊是也倘小便澀用益元散煎燈芯湯調下宣毒後接服薄荷丹疏散風熱若腫猶不消海藻潰堅湯消腫湯氣血已虧補中勝毒餅潰久不愈依前瘰癧法治附方單癧小犀角丸犀角黑牽牛半生半炒青皮陳皮各一兩連翹五錢皂角二條錘泡絞汁一碗鮮薄荷二斤取汁熬膏和上藥為丸蛇蟠癧清毒化堅湯炙草龍膽草薄荷黃芩花粉白芍元參牛蒡子昆布羌升歸耆柴桔陳翹生薑蓮子癧內消丸牽牛子二兩青皮陳皮二兩皂角去皮弦子搗四兩薄荷五兩後二味取汁熬和上藥末為丸每服三十丸荊芥湯送下蓮子癧琥珀散白醜滑石殭蠶黃芩各一兩木通連翹各七錢斑蝥去足翅炒三錢甘草三錢琥珀二錢研細分作六股水煎服之流注夏枯草散夏枯草六錢甘草一錢研末每服二錢茶清下又方取夏枯草一兩煎服虛人多服妙表邪荊防敗毒散見一卷疫外治敷瘰丹乳沒血竭麝香辰砂兒茶龍骨白芷甲片百草霜雄黃鯉魚膽各等分研敷外用膏貼解毒立效散皂角刺八兩挫細炒甘草二兩乳沒各一兩栝蔞五個研細每用一兩好酒煎服外貼琥珀膏琥珀肉桂辰砂丁香木香當歸白芷木通防風松脂木鱉子麻油煎至黑色去渣下黃丹收膏貼內托托裡散見本卷乳症風熱梔子清肝湯見五卷癘風血燥加味逍遙散見一卷火陰虛六味地黃丸見一卷中風核堅連翹散堅湯柴胡龍膽草土瓜根芩連歸陳芍草蒼朮水煎核堅海藻潰堅湯神麯四錢半夏二錢海藻昆布龍膽草蛤粉通草貝母松蘿茶枯礬各三錢蜜丸白湯下怒傷柴胡清肝散見二卷衄郁傷歸脾湯見二卷勞瘵膿清八珍湯見一卷中風自汗保元湯見一卷火婦癧化氣調經湯廣皮二兩香附羌活白芷各一兩牡蠣花粉角刺甘草各五錢為末每服二錢酒和日二服不斂益氣養營湯見本卷乳溫補十全大補湯見一卷中風去核必效散硼砂二錢半輕粉一錢麝香五分巴豆去心膜五粒斑蝥去頭足米炒黃四十個檳榔一個研細以雞子清調藥仍入殼內蒸熟曬乾研用五分酒下熱咳加味地黃丸六味丸加柴胡五味補中補中益氣湯見一卷中風結核消核丸橘紅鹽水炒赤茯熟大黃連翹各一兩黃芩山梔各八錢半夏元參牡蠣花粉桔梗栝蔞各七錢殭蠶五錢蒸餅為丸外貼山藥膏生山藥一塊萆麻子三個各去皮研勻攤貼結核養營湯見二卷勞瘵內消陽和犀角丸桂心麻黃炭姜犀角乳沒麝香取黃米飯搗爛入藥末搗為丸每服三錢軟堅海帶丸海帶青皮陳皮貝母等分蜜丸食後服或加昆布搜風消風化痰丸白附子木通各一錢南星半夏赤芍翹桔天麻殭蠶天冬銀花各七分羌防芷皂角各五分全蠍陳皮各四分蜜丸通絡旋覆花湯見二卷痰飲托裡內托白蘞散歸芍翹各一錢芩芷白蘞栝蔞仁各八分川芎花粉乳香各七分防風桔梗柴胡各五分白蒺藜甘草各四分注痰竹瀝達痰丸大黃黃芩各八兩沉香五錢參術陳苓草夏各三兩礞石焰硝煅一兩以竹瀝薑汁和如稀糊曬乾研仍以竹瀝薑汁和丸服筋癭玉壺散海藻海帶昆布俱洗雷丸各一兩青鹽廣皮各五錢陳火酒為丸含化筋癭破結散即海藻潰堅湯去松蘿茶加桑寄生三錢蜜丸蔥白湯下三十丸或酒下血癭化癭丹海藻海帶昆布海蛤俱洗焙澤瀉連翹各五錢豬靨羊靨各十枚即豬羊囊