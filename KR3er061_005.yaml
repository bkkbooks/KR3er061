陽有餘必需介屬以潛之柔靜以攝之味取酸收或佐酸降務清其營絡之熱則升者伏矣治肝氣先疏其鬱宜逍遙散因怒動肝小柴胡湯加山梔青皮噯而吐沫代赭旋覆湯嘔而脹滿三因七氣湯加枳殼木香怒傷脅痛生白芍金橘皮山梔枳殼鬱金汁降香末腸鳴飧泄則泄木安土人參安胃散加半夏曲㿉疝腫硬則導滯和肝橘核丸加減若氣有餘便是火治肝火實吞酸脅痛左金丸抑青丸脅大痛引腰背汗泄忌辛燥耗氣劫液宜甘酸化陰甘草柏子仁杞子棗仁阿膠牡蠣木瓜生白芍五味子鱉甲金橘皮虛痛久痛必入絡宜理營絡旋覆花湯加當歸鬚丹皮延胡桃仁濕熱火盛脅痛筋痿溲血龍膽瀉肝湯火盛狂躁胸痞咽阻便祕當歸龍薈丸陰虛痿弱虎潛丸去鎖陽厥逆四逆散痞滿半夏瀉心湯厄噎橘皮竹茹湯吐衄失血犀角地黃湯加山梔藕汁至於肝陽化風上擾清竅則巔痛頭暈目眩耳鳴心悸寤煩由營液內虛水不涵木火動痰升其實無風可散宜滋液和陽復脈湯去薑桂或用熟地白芍杞子茯神棗仁炒甘菊霜桑葉牡蠣石斛五味其由腎虛陽浮者宜填髓補精阿膠龜甲淡菜青鹽牛膝萸肉熟地磁石其由土弱木乘者宜緩肝益胃酸棗仁湯去川芎加人參山藥小麥其因怒勞致舌麻肢痹筋愓肉瞤由五志過極陽亢陰衰風從火出宜柔潤熄風河間地黃飲子去桂附巴戟菖蒲其火風上郁頭重脘痹宜清金肅降杏仁鮮菖蒲根栝蔞鉤藤菊葉薄荷其年高水虧風火易升頭暈便祕宜壯水滋燥還少丹去杜仲巴戟楮實茴香加桑葉黑芝麻柏子仁炒甘菊茯神牡蠣其陽明絡虛風火易震食少知飢宜填實空際人參山藥炙草牡蠣棗仁茯苓白芍南棗大抵肝為剛臟職司疏泄用藥不宜剛而宜柔不宜伐而宜和正仿內經治肝之旨也丹溪曰病人自言冷氣從下而上非真冷也此上升之氣自肝而出中挾相火自下而上其熱為甚自覺冷者火極似水積熱之甚也陽亢陰微故見此症又曰氣從左邊起肝火也宜左金丸氣從臍下起陰火也黃柏丸坎離丸氣從足下起入腹虛之極也滋陰降火湯外用津調附子末塗湧泉引熱下行附方疏郁逍遙散見一卷火因怒小柴胡湯見一卷溫噯氣代赭旋覆湯見本卷嘔吐嘔脹三因七氣湯見二卷咳嗽飧泄人參安胃散參一錢耆二錢生草炙草各五分白芍七分茯苓四分陳皮三分黃連二分㿗疝橘核丸橘核川楝海帶海藻昆布桃仁各二兩延胡厚朴枳實木通桂心木香各五錢肝火左金丸見一卷火症脅痛抑青丸黃連一味以茱萸湯浸一宿為丸理絡旋覆花湯見二卷痰飲火盛龍膽瀉肝湯見本卷諸氣狂火當歸龍薈丸見一卷火痿弱虎潛丸見一卷中風陽厥四逆散柴胡白芍枳實炙草胸痞半夏瀉心湯見一卷溫厄逆橘皮竹茹湯見本卷嘔吐吐衄犀角地黃湯見一卷溫滋液復脈湯見一卷中風益胃酸棗仁湯見一卷中風類中地黃飲子見一卷中風老人還少丹見一卷中風陰火黃柏丸黃柏一味酒炒水丸陰火坎離丸見一卷火滋火滋陰降火湯白芍一錢三分當歸一錢二分熟地麥冬白朮各一錢生地八分知母黃柏炙草各五分陳皮七分加薑棗水煎肝氣脈案本脅左隱痛胸間動氣頭暈肢麻寐即舌乾似辣中夜自汗清晨咳痰便瀉覺爽肝陽挾風火上冒侵犯脾土使然秋深左關脈弦長牢實醫謂金弱木強非時脈見來春木必侮土膈逆司憂遂用滋腎鎮肝數十劑脈症未退更醫進胃愛丸服後痰較少而泄氣多且皆健脾藥不能制肝陽歷冬並右脈亦弦徑胸脘引痛豫謂前症自是肝陽肆橫但肝為剛臟不任剋制專用滋清恐又致痛為脹若仿內經治肝以酸瀉之法自然柔伏矣因用白芍木瓜烏梅萸肉五味金橘棗仁等加牡蠣醋煅橘絡木香茯神芝麻小麥桑枝膏為丸服後左關漸軟不見弦長矣且示以靜攝戒怒節勞右脈亦和諸症漸除王高年胸脅氣阻痛脈虛弦用苦鹹酸以泄降厚朴薑汁製五分枳殼旋覆花各錢半牡蠣粉醋煅二錢白芍炒三錢木瓜八分降香末二錢三服肝逆已平尚未嗜食用甘涼以調胃陰石斛二錢麥冬錢半甘草五分茯苓白芍當歸各二錢小麥一撮紅棗五枚五服全安沈氏寒熱食減厥氣攻注痛連胸背脈弦左浮大服平肝鎮逆之劑攻注稍緩宿有脹症曾用通腑法獲痊今懼其壅而成脹兼用通鎮庶幾善後之防白雲苓二錢鬱金厚朴各六分砂仁烏藥各八分蘇梗枳殼汁各錢半代赭石石決明各二錢金器同煎三五服愈何氏肝鬱失暢循經則頭項作脹乘脾則痰濁化酸入絡則肌肉刺痛腋下零濕經信愆期左關沉弦治在疏肝佐以滲濕厚朴香附鬱金白芍茯苓金橘皮山梔鉤藤當歸鬚三四服諸症減自述平昔腸鳴必傾瀉乃爽亦木氣乘土之咎且肥人慮虛其陽前方去鬱金山梔加製半夏炒白朮薏米炙草經亦調蔡小腹氣上衝膈食下嘔吐寒熱便瀉溺痛病久脈弦左虛乃厥陰濁逆為吐攻腸為瀉治在泄濁安胃吳萸泡川楝子酒蒸小茴香酒炒茯苓車前子橘核白芍俱炒生薑半夏曲數服諸症退去吳萸川楝子車前子生薑加砂仁炮薑廣皮服愈束氏經阻疑孕胸痞嘔酸寒熱脛冷食減便難兩部沉弦乃氣逆濁踞非惡阻病宜和肝泄濁吳萸香附鹽水炒茯苓厚朴半夏俱薑汁炒橘白蘇梗枳殼煨薑三服前症漸平張當春脈弦肝木乘土噫氣大便艱少常欲入廁皆肝氣忽升忽降致之青皮旋覆花降香白芍牡蠣炙草當歸半夏薑汁製二服噫氣平大便不結惟睪丸注痛加橘核酒炒服全瘳丁神傷思慮則肉脫意傷憂愁則肢廢高年憂思菀結損動肝脾右脅氣痛攻胸引背不能平臥氣粗液奪食少便難由肝胃不和腑不司降耳鳴肢麻體瘦脈弦風動陽升脂肉消鑠有暈僕之懼香岩謂肝為剛臟忌用剛藥仲景法肝病治胃是有取乎酸泄通降之品矣白芍木瓜牡蠣金橘皮蘇子蔞仁杏仁歸鬚枳殼再服頗適然症由情懷內起宜娛情善調不宜專恃藥餌也陳脅脹胸痛嘔吐肝氣上升陽明當其沖必犯脘傾液而出脈左遲虛右弦小陰瘧宿恙未愈治在益胃和肝勿使瘧厥白芍茯苓各二錢製厚朴六分製半夏錢半橘白枳殼各一錢砂仁連殼八分烏梅二枚煨薑二片數服脹痛若失陰瘧亦瘳於先由吞酸漸次胸脅滿悶食後必吐病因肝鬱失暢延至木氣犯土水濁不降勢必溺少便結肝乘胃反矣苦降逆辛泄濁主之製厚朴吳萸乾薑蘇子炒研各五分枳殼降香末半夏曲各錢半茯苓二錢椒目十粒數服漸安潘少腹本厥陰部分㽱痛不已利下黏膩如魚腦又嘔紫血甚多繼以鮮紅夜煩不寐足厥冷左脈虛弦右虛小此土受木侮必飲啖後鬱勃動肝厥陰凌犯中下焦清濁互傷嘔利並劇節交雨水風陽猝乘藥忌剛燥但柔肝熄風緩痛為宜阿膠水煨白芍木香小茴香鹽水炒香附醋炒延胡酒炒茯神一服血止痛利大減足亦和再加炮薑黑楂肉服症悉平改用潞參茯苓白芍山藥炙草砂仁訶子肉粳米棗肉調脾而食進但嘔利傷陰精神未復因事棖觸寒熱煩痛按捶略爽是營衛流行之機未免鈍窒矣且咳喘痰灰腎虛氣少攝納必補中則營衛自和攝腎則喘嗽可定潞參炙耆歸身炙草茯神五味山藥骨脂核桃肉沙苑子漸次調理向安從侄左乳下一縷氣升熱痛至項明是肝陽郁久致然恰當暑濕炎蒸每歲屢發本由怫悒肝久失暢經隧痰氣阻塞致肺胃不主升降痞噯吞酸大便忽溏忽硬脈來沉澀仿丹溪越鞠丸山梔川芎神麯香附醋炒蔞仁旋覆花杏仁貝母枳殼煎服輒安嚴中年氣從季脅橫攻中上脘嘔沫失血年餘未愈近日食少神衰服燕窩湯滋脹兩關虛緩冷涎上泛此肝濁瘀滯久則入絡致滿宜辛溫泄濁吳萸鹽水炒半夏薑製廣皮延胡酒焙厚朴薑製茯苓降香末當歸鬚二服冷涎痛脹悉止但陽衰脛冷法在益陽去吳萸加桂枝炮薑草果煨等三劑食進吳冬初由水瀉後腹脹是臟寒生滿脈虛食少治先溫通理陽用益智炮薑潞參茯苓製半夏縮砂殼廣皮陳粳米煎湯眼數劑頗適晚餐少運化加神麯雞內金俱炒脹寬冬季因怫逆動肝脅腹脹痛寒熱脈微數轉方用白芍當歸潞參蘇梗鮮橘葉縮砂殼鬱金汁兩合肝胃痛緩藥停春正上脘痛嘔沫由肝邪乘胃胃氣失降則脹壅肝陽上升則嘔痛因肝為剛臟法當柔以軟之甘以緩之且肝陰久虧觸事生怒脾元不復病先肉脫劣手竟用赭石重鎮桂心剛制炒術壅氣兼蒺藜青皮疏肝伐肝一啜煩躁大痛再劑脅如刃割腹絞痛欲絶豫聞擬甘潤柔劑用阿膠雞蛋黃白芍甘草棗仁當歸飴糖等遙寄片紙藥未及撮而歿志此為以剛治剛好言平肝者鑑肝火脈案趙左脅痛脈洪耳鳴時嘔脹腹痛皆肝火焮騰濁瘀不肯泄降宜戒怒節飲可愈仿梔萸湯山梔薑汁炒黃連吳茱萸汁炒白芍牡蠣生杵丹皮金橘皮服效肝風脈案本寐醒舌乾辣華池津不上朝頭眩耳鳴肢麻脅痛肝風內震腹滿腸鳴晨瀉不爽木氣直犯中宮矣左關浮弦右浮滑痰嗽不利太陰受戕有年須防類中晨服方運脾陽以利濕生白朮茯苓半夏青鹽制炙草薏米炒砂仁益智仁煨山藥炒小麥晚服方養肝陰以熄風阿膠水化杞子茯神麥冬石斛白芍桑枝甘菊炒黑芝麻牡蠣粉寐後用柿霜二匙含舌下以生廉泉之津服效沈氏當夏鬱怒不寐五更起坐倏然頭搖手戰目閉耳鳴暈絶身冷此怒動肝陽內風挾痰火上冒也急煎淡青鹽湯以降風火一啜即醒用牡蠣鉤藤山枝桑葉白芍茯神菊花炒二服神志已清轉方用熟地黃炒杞子焙石斛棗仁炒龜板炙牡蠣粉磁石鎮補肝陰而安沃煩勞傷陽陽氣化風上巔兩太陽刺痛耳鳴口乾寒熱不寐自汗便瀉下元疲乏脈模糊治先熄風鎮陽甘菊炒荷葉磁石牡蠣粉茯神甘杞子焙熟地炭白芍五味炒數服諸症向安惟不嗜味微嗽加甜杏仁潞參蓮棗以補脾肺原方去前四味嗣用丸方牡蠣粉淡菜首烏熟地杞子牛膝酒蒸五味焙阿膠水化和煉蜜丸以滋填下元匝月而愈鬱症論治凡病無不起於郁者如氣運之乖和也則五郁之病生經言木鬱達之宜吐火鬱發之升散土鬱奪之攻下金鬱泄之解表利小便水鬱折之制其沖逆此論勝復之變情志之怫抑也則六郁之病作經言怵愓思慮則傷神憂愁不解則傷意悲哀動中則傷魂喜樂無極則傷魄盛怒不止則傷志恐懼不解則傷精此論氣血之損又言嘗貴後賤雖不中邪病從內生名曰脫營嘗富後貧名曰失精以及病發心脾不得隱曲思想無窮所願不得皆情志之郁也夫六氣外來之郁多傷經腑如寒火濕熱痰食皆可以消散解若思憂悲驚怒恐之郁傷氣血多損臟陰可徒以消散治乎七情內起之郁始而傷氣繼必及血終乃成勞主治宜苦辛涼潤宣通苦能泄熱辛能理氣涼潤能濡燥宣通能解結用劑必氣味相投乃可取效以郁為燥邪必肺氣失宣不能升降中氣日結不能運納至血液日涸肌消骨蒸經閉失調乳岩項癧而鬱勞之症成不止血嗽氣膈狂癲失志而已今分條列治如思郁傷脾氣結宜鬱金貝母當歸柏子仁桔梗木香汁思郁傷神精滑神傷必不攝腎故遺精淋濁固陰煎思郁傷肝潮熱逍遙散思郁傷心脾失血歸脾湯去白朮加白芍憂鬱傷肺氣阻杏仁栝蔞皮鬱金枳殼枇杷葉竹瀝薑汁半夏憂鬱傷中食少七福飲去熟地加砂仁悲憂臟躁欲泣甘麥大棗湯驚郁膽怯欲迷人參棗仁茯神龍骨石菖蒲南棗小麥驚郁神亂欲狂清心溫膽湯怒郁肝傷氣逆解肝煎怒鬱火升動血化肝煎恐郁陽消精怯八味丸加減或鹿角膠酒化服諸郁久風陽內生眩悸咽痛宜阿膠生地石斛茯神牡蠣白芍麥冬甘草氣鬱脈沉而澀七氣湯血鬱脈澀而芤四物化郁湯氣鬱生涎心悸溫膽湯血鬱絡傷脅痛金鈴子散加桃仁歸鬚鬱金降真香肺脾郁營損肌瘦養營湯去桂心減熟地黃心