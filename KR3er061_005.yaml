脂丸反胃初起多因土弱火衰以致朝食暮吐暮食朝吐治宜扶胃土以通陽異功散加益智丁香乾薑砂仁粳米益命火以蒸化八味丸其立法要使辛滑通痞薑汁竹瀝貝母杏仁栝蔞枇杷葉韭白汁而脘痹以開甘酸化陰人參天冬麥冬蔗汁棗仁白芍烏梅木瓜而液枯以潤或健脾理痰四君子六君子湯或二陳湯加竹茹不偏任溫燥以劫液或滋陰養血生地阿膠牛乳梨汁芝麻柿霜或四物湯不偏用清潤以助痰氣滯成噎者宣理氣隧九香蟲丁香皮鬱金檀香石見穿枳殼廣皮廣木香血瘀成膈者兼通血絡桃仁紅花延胡當歸鬚雞血藤膏士材治血膈用人參五靈脂歸尾桃仁鬱金云岐人參散用冰麝亦同此法也因胃陽虛而濁瘀反胃者用通補胃腑辛熱泄濁法參苓吳萸乾薑益智陳皮半夏砂仁殼因氣鬱痰阻用苦降辛通法黃連杏仁橘紅薑汁竹茹蘇子半夏因肝鬱氣逆用兩通厥陰陽明法當歸白芍香附半夏茯苓杏仁橘紅竹瀝薑汁因酒熱鬱傷肺胃用輕劑清降枇杷葉杏仁鬱金栝蔞前胡桑白皮及苦辛開肺法桔梗貝母杏仁蔻仁生薑橘紅山梔其由憂思傷脾氣鬱生涎飲可下食難入香砂寬中丸去青皮檳榔由七情鬱結胸脘拒痛脈必沉澀七氣湯加鬱金栝蔞砂仁木香由痰飲阻滯嘔吐翻胃脈必結澀先以來復丹控其痰再用大半夏湯加茯苓枳殼竹瀝由瘀血積滯傳化不變反上行者脈必芤澀滋血潤腸丸加減至脾氣敗血液耗胃脘枯稿溺少便祕補氣健脾丸參入滋血潤腸丸或韭汁牛乳飲若口吐白沫糞如羊屎不可治矣勉用薑汁杏酪白蜜牛乳益智韭子半夏醫學心悟云開關用啓膈散最效又如五汁飲以清燥利膈丸以通壅汞硫散以止吐總忌香燥破氣辛熱耗液惟一種胃陽衰不能運化者暫用辛溫開結繼仍以益陰養胃為宜粳米人參山藥蓮棗牛乳小麥膈症生蟲用河間雄黃散有梅核膈吐不出咽不下咽喉妨礙由氣鬱痰結滌痰丸由死血昆布當歸桃仁韭汁童便有翻胃食入即翻出或痰或熱壅阻膈間非如反胃之早食晚吐晚食早吐也清熱二陳湯再論噎由氣結膈由痰與氣逆或瘀血一種氣噎臨食輟箸嗌阻沫升氣平食入病在上焦肺胃間治以輕揚利膈苦降則過病所一種痛膈食下格拒嘔涎嘈痛而飢焰中焚病在中焦治以辛香通降不效必兼理血絡一種胃稿脘系窄隘即勺飲亦妨礙由衰年血液漸枯胃管扃閉飲入則涎升淚出二便俱少開合都廢治以辛滑潤養大忌香燥耗液剛熱劫陰此脘血失榮下咽易梗一切礙滯閉氣食品咸宜禁忌嘗見食山芋而成噎者食雞子而咽成膈者若再憂思鬱怒結於中而莫解情志之病尤難霍然徐靈胎謂噎膈症十死八九反胃症十愈八九再論反胃由食久不化腐濁上攻徹底翻瀾二腸失司傳送病在幽門以下古法多謂胃中無陽精微不能蒸化然經云諸嘔吐逆皆屬於熱且胃津先奪熱燥難投必細參脈症或苦降辛通宣行壅滯曾記一壯年反胃吐食服八味湯暫止復吐食羊血得愈又沈姓年高嗜飲兼情悒不遂吐沫拒食半載未愈一老醫投藥四劑病勢減半再用十劑料浸酒服而全愈方用大生地五錢海浮石一兩烏藥錢半牛膝靈磁石雲苓歸身各三錢玩此方兼溫清鎮泄升降氣血性味不偏傳者目睹治驗因附記備考病愈後禁忌凡噎膈反胃得藥而愈者不可便與粥飯惟以真人參五錢陳皮二錢老黃米一兩作湯細啜旬日後方可食粥倉廩未固便進米穀常致不救又一年之內切忌房欲犯之必舊症復發而死噎膈反胃脈候緊而滑者吐逆小弱而澀者反胃噎膈反胃脈浮緩者生沉澀者死沉澀而小為血不足大而弱為氣不足附方調脾歸脾湯見二卷勞瘵養心養心湯見二卷勞瘵潤燥豬脂丸杏仁松子仁白蜜橘餅各四兩豬脂熬淨一杯同搗食之和胃異功散四君子湯加陳皮益火八味丸見一卷中風健脾四君子湯參苓術草加陳夏名六君子湯消痰二陳湯陳夏苓草補血四物湯地芍歸芎酒膈云岐人參散人參一兩煎成加麝香冰片各五釐治好飲熱酒膈痛血瘀胃口寬膈香砂寬中丸苓術陳夏朴草木香砂仁蔻仁香附青皮檳榔薑蜜丸開鬱七氣湯見二卷咳嗽控涎來復丹見本卷嘔吐反胃大半夏湯參夏蜜血枯滋血潤腸丸地芍歸紅花桃仁枳殼大黃韭汁沖服脾虛補氣健脾丸參苓耆術陳夏草砂仁薑棗通潤韭汁牛乳飲見一卷燥開關啓膈散沙參丹參各三錢茯苓一錢川貝錢半鬱金五分砂仁殼四分荷葉蒂兩枚杵頭粳五分水煎虛加人參吐蟲河間雄黃散雄黃瓜蒂赤小豆各一錢為末每服五分溫水調滴入狗油數匙服下吐蟲化痰滌痰丸南星半夏枳殼橘紅菖蒲人參茯苓竹茹甘草痰熱清熱二陳湯二陳湯加人參白朮山梔竹茹砂仁麥冬各一錢烏梅一枚薑棗理氣烏龍丸九香蟲半生半焙一兩車前子炒陳皮各四錢白朮五錢杜仲酥炙八錢蜜丸降痰枇杷葉煎枇杷葉橘紅各三錢生薑五錢滑潤五汁飲蘆芽荸薺甘蔗竹瀝薑汁溫服又方韭汁梨汁人乳薑汁藕汁通補利膈丸參歸藿枳草朴木香檳榔大黃止吐汞硫散硫黃水銀同研細如煤色用陳酒薑汁調服次日大便出黑物即不吐反胃丁香煮散丁香三七粒蓮肉二七粒二味另研生薑七片黃秫米半合水煮熟去薑啜粥通治狗寶散用六君子加狗寶作散調服寒嘔千金五噎丸乾薑川椒吳萸桂心細辛各一兩參術各二兩陳苓各兩半附子一枚吐逆千金五膈丸參草各二兩麥冬三兩川椒遠志桂心細辛乾薑各一兩川附一枚外治啄木鳥膏啄木鳥去毛和骨搗爛熬膏入麝香一錢蜜收入瓷罐不時嗅之開膈雄黃二豆丸烏梅二十個硇砂雄黃各二錢乳香一錢百草霜五錢黑豆緑豆各四十九粒為末和烏梅肉杵丸反胃大七香丸香附麥芽砂仁藿香甘草官桂陳皮丁香甘松烏藥蜜丸通治五膈散參術蔻夏桔草沉香枇杷葉薑潤補生薑汁煎薑汁白蜜牛酥各五兩人參百合各二兩熬膏人參百合湯下順氣神香散丁香蔻仁潤燥膈噎膏人參牛乳蔗汁梨汁蘆根汁龍眼肉汁薑汁人乳熬膏蜜收此繆仲淳祕方也豁痰七聖湯半夏黃連白蔻人參茯苓竹茹生薑二片噎膈脈案蔣色蒼形瘦是體質本屬木火食入脘阻嘔沫經言三陽結謂之膈夫三陽皆行津液而腎實五液之主有年腎水衰三陽熱結腐濁不行勢必上犯此格拒之由香岩先生所謂陽結於上陰衰於下也通陽不用辛熱存陰勿以滋膩一則瘦人慮虛其陰一則濁沫可導而下半夏青鹽拌制竹茹蔞霜熟地炭杞子炭牛膝炭茯苓薤白薑汁數服漸受粥飲兼服牛乳數月不吐耿年近古稀兩尺脈微右關弦遲氣噎梗食吐出涎沫氣平食入夫弦為木旺遲為胃寒弦遲在右胃受肝克傳化失司治在泄肝溫胃痰水自降丁香益智仁煨蘇子霜茯苓青皮砂仁薑煨數服痰氣兩平陳酒客中虛氣阻成噎必有蒸濕釀痰脈來遲弱中脘陽衰飲米粥亦拒得熱酒輒行明系陽微欲結法宜通陽則胸脘得展濕痰得降而運納有權潞參茯神茯苓砂仁丁香半夏薑製廣皮薑棗煎數服粥飲不拒矣後再加乾薑炮淡二分益智仁生研數服胸舒而納食某氏因惱怒曾嘔瘀血已是肝逆今胸痛吐沫脈澀尺微食入反出火土兩衰蒸化無力乃脾腎陽衰候也然犯辛燥又虞動血擇其辛溫通降者宜之韭子炒研蘇子沙苑子砂仁降香汁沖茯苓半夏曲益智子煨研數服食進痛沫悉止鍾氏脾胃陽衰濁飲不降食入脹痛有吐逆反胃之虞右脈濡澀左脈弦宜泄肝濁以通腑陽厚朴薑製五分椒目六分茯苓三錢半夏薑製錢半蘇子炒研七分枳殼炒陳皮加薑此三因七氣湯加法氣降則飲降矣再服嘔脹減大便得通嗣用溫脾胃兼辛通降逆半夏砂仁韭子炒研益智仁煨研茯苓石見穿生薑數服漸納穀食矣丁中年喪子悲惋成噎脘痛吐食此清陽不旋逆氣不降宜善自排遣達觀隨化非藥石能愈之疴貝母鬱金茯神製半夏栝蔞韭白汁薑汁蘇子汁沖服痛嘔俱減族某客冬怫悒吐食粒米不納僅進粥飲今春怯寒吐沫二便俱少脈細澀模糊濁逆陽微肝腎不主吸氣豈容再服萸地酸膩閲所服方競不識辛通大旨仿兩通厥陰陽明主治為近理蘇子杏仁川貝益智橘白潞參茯苓製半夏薑汁韭白汁沖服數劑涎沫少粥飲多進間進牛乳亦不吐用香粳米炒黃九香蟲煎湯煨藥更適轉方用大半夏湯穀食安而大便漸通翻胃脈案某長夏吐食症屬翻胃服四君異功加炮薑桂附不應豫謂五臟以守為補六腑以通為補此不易之經訓四君異功本脾藥非胃藥胃腑宣通則和一與守中必致壅逆白朮炮薑皆守劑且陽土喜柔涼忌剛燥劫液久吐則胃陰傷須辛通使胃氣下行則效韭子炒研杏仁豆蔻衣半夏砂仁太子參薑汁粉栝蔞仁戒毋穀食暫用麵食蓋谷性陰而滯面性陽而通加意調養可痊畢嗜飲翻胃麵食頗安穀食則越宿傾吐無餘此胃陽衰酒食化痰瘀濁不降故也用通陽泄濁法製半夏茯苓益智仁乾薑陳皮吳萸砂仁惜不能戒酒故時發時愈云關格論治下不得出為關二便俱閉也上不得入為格水漿吐逆也下關上格中焦氣不升降乃陰陽離絶之危候景嶽以此為陽亢陰竭元海無根症見粒米不能下咽渴飲茶湯少頃即吐復飲復吐熱藥入口隨出冷藥過時亦出大小便俱阻關無出之由格無入之理急症難從緩治內經以陰氣太盛則陽不能榮故曰關陽氣太盛則陰弗能榮故曰格陰陽俱盛不得相榮故曰關格關格者不得盡期而死因是症氣逆於上津涸於下與噎膈反胃同而勢較驟最忌燥熱劫陰法宜甘潤滋液生脈散加甜杏仁玉竹等或甘酸化陰參麥阿膠地黃白芍烏梅牛膝等如脈洪大者先降火山梔犀角竹茹黃連等沉滑者先豁痰大半夏湯兼虛弦者先和陰甘露飲去茵陳黃芩喘滿者先降逆降氣湯去桂陽結者先通痞用半夏瀉心湯加減液虛者主通潤一陰煎真陰素虧者滋化源大營煎氣血兩不足者填虛損大補元煎嘗治一老人吐欲死便不通上格下關用參苓歸芍山藥牛膝麥冬百合等吐止用炒粳米湯濃煨三陰煎調理便通獲愈可以審所治矣關格脈候經言寸口主中人迎主外兩者相應俱往俱來若引繩大小齊等春夏人迎微大秋冬寸口微大如是者為平人寸口即太陰氣口內經本以人迎察六腑之陽氣口察五臟之陰若人迎盛至四倍且大且數名溢陽為外格此孤陽獨存水不濟火陰為陽格也寸口盛至四倍且大且數名溢陰為內關此元陰失附氣不歸精陽為陰關也人迎氣口俱盛且大且數為關格與之短期此陽氣不藏故陰中無陽陰氣不升故陽中無陰陰陽相離死不治越人以上魚為溢為外關內格入尺為復為內關外格及仲景東垣等以在尺為關在寸為格皆與經背附方滋液生脈散見一卷暑豁痰大半夏湯參夏白蜜和陰甘露飲見二卷衄血降逆降氣湯見二卷失音通痞半夏瀉心湯見一卷溫液虛一陰煎見二卷咳嗽滋陰大營煎熟地三錢當歸杞子杜仲各二錢牛膝錢半肉桂炙草各一錢填虛大補元煎人參山藥當歸杞子杜仲各二錢熟地三錢萸肉炙草各一錢調理三陰煎見二卷汗諸氣論治天地之氣和則沴戾不作生人之氣和則諸疾不興其氤氳一身有宗氣有衛氣有元氣有中氣宗氣積於胸中為氣之海衛氣行於脈外為營之護元氣根於脾土中氣出納丹田顧經云百病皆生於氣者由六淫戕於外七情戰於中則氣之沖和者致偏清純者化濁流利者反滯順行者多逆如寒則氣收暑則氣泄喜則氣緩怒則氣上悲則氣消恐則氣下驚則氣亂思則氣結勞則氣耗清氣在下則生飧泄濁氣在上則生䐜脹甚則厥逆噦厄痞嘔噎膈攻逐刺痛無非氣所主病局方治法通用辛香燥劑然當審其虛實新久如氣虛