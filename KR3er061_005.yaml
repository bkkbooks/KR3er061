滯為厄者陰凝濁逆丁香散二陳湯橘皮乾薑湯其肺痹為厄者咽阻胸悶枇杷葉川貝母鬱金白通草杏仁淡豆豉其胃火為厄者脈實便堅安胃飲其胃虛為厄者虛陽上逆橘皮竹茹湯旋覆代赭湯其怒動肝火者脅痛吐酸佐金湯加白芍山梔金器金器取鎮逆以平肝其氣逆作厄者肝邪乘胃旋覆代赭湯加降香其痰滯為厄者飲停氣阻丁香二陳湯其食滯為厄者腹痛噯腐養胃湯去蔻附肉果或大和中飲去乾薑澤瀉傷寒少陽症噦逆者半表半裡氣為邪抑小柴胡湯或柴陳煎寒加丁香火加黃芩傷寒陽明症失下內熱三焦乾格陰道不行氣衝作厄者宜去火白虎湯竹葉石膏湯加減去閉承氣湯逆氣降噦自止其吐利後胃虛膈熱而厄者橘皮竹茹湯加川貝其病後發厄者察其中虛必補脾察其陰虛必補腎大補元煎右歸飲其中焦脾胃虛寒氣滯為厄者丁香柿蒂散或理中湯溫胃飲俱加丁香其下焦虛寒肝腎不能暢達或虛人元陽無力易為遏抑而致厄者歸氣飲或理陰煎加丁香丹溪謂厄逆因肝腎陰虛氣從臍下直衝於口由相火挾沖氣上逆者用大補陰丸峻補真陰承製相火東垣謂陰火上衝吸氣不得入胃脈反逆陰中伏陽即為厄用滋腎丸壯水制火引以歸源以瀉陰中伏熱此陽虛陰虛之辨所當詳審施治者也産後厄逆最危四逆湯加人參羌活附子湯或桂心五錢薑汁三合水煎急灸期門左穴艾柱如豆大醫通曰平人飲熱湯及食椒薑即厄者此胃有寒痰死血也死血用韭汁童便下越鞠丸虛人用理中湯加蓬朮桃仁痰加茯苓半夏蓋厄逆皆是寒熱錯雜二氣相搏故治之亦多寒熱相兼之劑如丁香柿蒂並投之類試觀平人冷厄令其思想則止思則脾火氣乘而胃和矣厄逆脈候厄逆如身強氣盛脈見滑實者多宜清降若聲小氣微脈見微弱者多宜溫補附方寒滯丁香散丁香柿蒂各一錢青皮陳皮炙草良薑各五分消痰二陳湯夏陳苓草薑加丁香名丁香二陳湯寒厄橘皮乾薑湯橘皮通草各錢半參桂各一錢乾薑炙草各五分火厄安胃飲見本卷脾胃熱厄橘皮竹茹湯見本卷嘔吐氣逆旋覆代赭湯見本卷嘔吐肝火左金湯黃連吳萸食滯養胃湯藿朴苓夏各一錢半肉果人參白朮陳皮各一錢丁香砂仁蔻仁沉香各七分麥芽神麯甘草各一錢川附三分消食大和中飲見本卷飲食少陽小柴胡湯見一卷溫少陽柴陳煎即二陳湯加柴胡陽明白虎湯見一卷中風胃火竹葉石膏湯見一卷傷風補脾大補元煎見一卷中風補腎右歸飲見二卷虛損氣滯丁香柿蒂散丁香柿蒂良薑參夏陳苓草虛寒理中湯見一卷中風胃寒溫胃飲見一卷中風陽虛歸氣飲熟地三錢茯苓扁豆各三錢藿香錢半炮薑丁香陳皮各一錢炙草八分陰陽理陰煎見二卷咳嗽陰虛大補陰丸見一卷火瀉熱滋腎丸見一卷火産後四逆湯附子乾薑甘草感寒羌活附子湯羌活附子炮薑各一錢茴香八分丁香五分死血越鞠丸見本卷諸氣厄脈案潘厄逆連聲日夜不止醫用丁香柿蒂散加白蔻木香刀豆莢之屬隨止隨發悶絶而蘇坐不能臥診其脈虛浮而疾逆氣自丹田上升直犯清道此肝邪犯胃也丁蒂蔻香辛溫助火何濟於事用重以鎮逆法旋覆代赭湯去人參加石決明醋煅刺蒺藜醋炒以瀉肝半夏青鹽制以降痰沉香磨汁以下氣一啜逆氣鎮定神安熟寐夢一老嫗引小兒以手捋其左脅曰愈矣醒而厄逆大減再劑若失問所夢何人豫曰此鎮肝而心脾之神得安也蓋脾之神黃婆心之神嬰兒云薛痰火厄逆身熱咳嗽脈浮數此肺受火灼膈上痰結遂失肅清下降之權治用苦辛降逆橘皮竹茹湯去參草加山梔杏仁前胡貝母栝蔞豆豉鬱金汁再劑悉平潘冬初寒熱自利煩渴不寐嘔吐濁痰右脈小數模糊左關弦而微徑是協熱下利胃虛木欲乘土必作噦逆治先表裡清解仿景嶽柴陳煎柴胡黃芩半夏曲茯苓陳皮栝蔞枳殼薑寒熱退煩渴解而厄果作此係濁痰不降木氣上升宜降痰兼鎮逆用蘇子杏仁俱炒研橘紅竹茹茯苓赭石石決明醋煅研薑汁一服左關脈平再服厄逆亦定惟右關虛乃商鎮補中宮法所謂胃虛則厄也用山藥扁豆薏仁俱炒炙草半夏陳皮茯苓沉香汁厄平但宵分少寐上脘略悶則痰沫隨氣上泛厄仍間作治用通攝佐以運脾所謂脾能為胃行其津液也蔞仁煨薑薏米生茯神橘白砂仁半夏蓮子氣平厄止思食前方去蔞仁加潞參山藥棗仁健飯如初包厄逆嘔沫食後為劇是肝胃病據述陰瘧愈後夏秋浴池兼啖生冷遂致嘔厄不時寒懍夫肺主皮毛水寒外襲感病在經胃主通納生冷傷陽氣隨濁逆怯寒乃肺衛虛非在經客邪仲景以嘔涎沫為肝病肝病必犯陽明胃腑先用溫通泄濁吳茱萸湯加半夏椒目嘔逆止再用旋覆代赭湯而厄平桂病後脈虛疾左關尺尤駃胃虛厄逆必肝腎之氣上奔而陽明當其沖因作厄也化痰利氣是開其道矣有年體虛法當鎮攝牡蠣醋煅三錢石決明煅研二錢赭石錢半竹茹二錢潞參降香末各三錢一服厄止再劑去決明赭石加茯神棗仁遠志山藥服脈亦和𩞄症論治𩞄症屬胃俗云心𩞄非也其狀似飢非飢似痛非痛脘中懊憹不安或兼噯氣痞悶漸至吞酸停飲胸前隱痛丹溪謂皆痰火為患或食鬱有熱華岫云謂脾屬陰主血胃屬陽主氣胃易燥全賴脾陰以和之脾易濕必賴胃陽以運之合沖和之德為後天生化之源若胃過燥則𩞄雜似飢得食暫止治當以涼潤養胃陰如天冬麥冬玉竹柏子仁石斛蓮棗之品或稍佐微酸如白芍棗仁木瓜之屬若熱病後胃津未復亦易虛𩞄治當以甘涼生胃液如生熟地黃當歸沙參蔗汁之屬或但調其飲食凡甘滑之類若胃有痰火或噁心吞酸微煩少寐似飢非飢治宜清火如黃連山梔俱用薑汁炒及芩芍竹茹等稍佐降痰如二陳湯及橘紅半夏曲又有脾胃陽衰積飲內聚似酸非酸似辣非辣治宜溫通外臺茯苓飲加減但由脾虛飲食不化吐沫噯腐治宜健運六君子湯加砂仁雞內金或肝火作酸左金丸𩞄雜醋心吳茱萸湯食後噯腐保和丸濕痰阻氣氣鬱氣婦女悒鬱胸𩞄逍遙散下左金丸血虛心𩞄宜地黃白芍天冬麥冬茯神棗仁等大抵脈洪數者多火宜薑汁炒山梔川連等脈滑大者多痰宜導痰湯加芩梔竹茹等脈沉弦者多郁越鞠丸又有過用消克藥飢不能食精神漸減異功散加白芍紅棗蓮子棗仁皆𩞄症所當審治者醫通曰𩞄雜與吞酸一類皆由肝氣不舒木挾相火以乘脾土胃之精微不行濁液攢聚為痰為飲都從木氣化酸肝木搖動中土中土擾擾不安故𩞄雜如飢求食自救得食稍止止則復作蓋土虛不禁木所搖治法必補脾運痰土厚載物則風木自安不必伐肝但以六君子湯為專藥若火盛作酸加吳茱萸川黃連若不開鬱補土務攻其痰久久致虛必變反胃痞滿眩暈等病矣附方降痰二陳湯見一卷中風溫通外臺茯苓飲見一卷中風健運六君子湯參苓術草加陳皮名異功散再加半夏名六君子湯平肝左金丸見一卷火降濁吳茱萸湯茱萸一味消導保和丸見二卷痰飲開鬱氣鬱湯苓夏芎陳貝梔草香附蒼朮木香檳榔紫蘇散郁逍遙散見一卷火降痰導痰湯見一卷中風治郁越鞠丸見本卷諸氣噯氣論治噯氣即內經所謂噫也經言脾病善噫又言寒氣客於胃厥逆從下上散復出於胃故為噫後人因謂脾胃氣滯起自中焦出於上焦凡病後及老人脾胃虛弱者多有之顧亦有肝氣逆乘噯酸作飽心下痞硬噫氣不除者仲景謂胃虛客氣上升必假重墜以鎮逆旋覆代赭湯亦有肺氣失降而作噯者蘇子降氣湯去桂加杏仁貝母之屬其胃虛氣滯而作噯者十味保和湯其胃寒氣滯而作噯者和胃煎其胃虛嘔痰噯氣者和胃二陳煎其胃寒飲食難化時作虛飽噯氣者養中煎或理中丸如脾腎虛寒命門火衰濁陰不降致痞滿噯氣者理陰煎加減如胃有痰火噯氣者星夏梔子湯專由脾胃陽虛中氣為陰邪阻格者和中為要健脾散若木來乘土厥逆上干之氣非鎮制不能遏也附方鎮逆旋覆代赭湯見本卷嘔吐降氣蘇子降氣湯見二卷失音虛滯十味保和湯參術苓夏陳藿草香附砂仁木香寒滯和胃煎朴陳薑草或加苓夏丁香木香砂仁藿香亦可驅痰和胃二陳湯見本卷飲食虛飽養中煎見本卷飲食溫中理中丸見一卷中風火衰理陰煎見二卷咳嗽痰火星夏梔子湯半夏南星香附石膏梔子和中健脾散人參白朮丁香藿香砂仁肉果神麯炙草薑棗噯脈案侄左脅痞悶上撑胸臆頻噯不舒按丹溪云凡上升之氣自肝而出左脅肝部也痞而上逆必犯胃仿仲景旋覆代赭湯成氏所謂咸以軟堅重以鎮逆也代赭湯去甘草薑棗加廣皮栝蔞皮枳殼俱麩炒三服而愈痞滿論治心下滿而硬痛為結胸滿而不痛為痞痞則閉而不開滿則悶而不舒病在胸膈氣分而外不脹急但不知飢不欲食脈緩弱或虛弦不宜過用消耗重損元氣經云太陰所至為痞滿保命集曰脾不能行氣於肺胃結而不散則為痞傷寒之痞從外之內故宜苦泄雜病之痞從內之外故宜辛散治傷寒熱痞用苦寒藥大黃黃連瀉心湯治傷寒陰陽不和而痞兼用寒熱藥三黃加附子湯治傷寒陰盛陽虛而痞則辛甘藥多而苦寒藥少半夏甘草生薑諸瀉心湯二黃瀉心湯治傷寒心下痞關上脈浮附子瀉心湯治傷寒心下痞復惡寒汗出去附子名三黃瀉心湯治傷寒熱痞半夏瀉心湯治胸滿而嘔甘草瀉心湯治胃虛氣逆生薑瀉心湯治脅有水氣痞雖虛邪然表氣入里熱鬱於心胸之分必用苦寒為瀉辛甘為散諸瀉心湯所以寒熱互用也雜病痞滿亦有寒熱虛實之不同如胃口寒滯停痰痞悶者辛溫泄濁橘皮半夏湯或二陳湯加丁香飲食寒涼傷胃致痞者溫中化滯和胃煎加楂肉麥芽砂仁或厚朴溫中湯脾胃陽微胸不清曠者辛甘理陽苓桂朮甘湯中氣久虛精微不化者升清降濁補中益氣湯加豬苓澤瀉醫通曰升柴從九地之下而升其清苓瀉從九天之上而降其濁所以交否而為泰也脾虛失運食少虛痞者溫補脾元四君子湯異功散胃虛氣滯而痞者行氣散滿保和湯或三因七氣湯食滯未除作痞者專消導大和中飲或枳朮丸資生丸食滯既消脾氣受傷者宜調補異功散養中煎心脾鬱結而成痞者調其氣歸脾湯治中湯暴怒傷肝氣逆而痞者舒其鬱解肝煎肺失肅降痰熱阻痞者清理上焦清肺飲去五味甘草加豆豉栝蔞山梔竹茹枇杷葉枳殼氣閉化熱不食便祕者辛潤開降蔻仁杏仁麻仁栝蔞仁貝母竹茹石斛鬱金或小陷胸湯熱邪里結噁心中痞者苦酸泄降半夏瀉心湯去參甘棗加枳芍烏梅暑邪阻氣熱渴滿悶者暑邪面垢脈虛胸悶脘痞辛涼清上三物香薷飲消暑丸加桔梗竹茹杏仁茯苓滑石鬱金汁濕邪阻氣嘔惡胸痞者濕邪頭脹舌白不飢脘痞噁心脈緩甘淡滲濕六一散加蘆根茯苓杏仁薏仁通草藿梗半夏蔻仁或平胃散寒熱往來胸脅痞滿者和解半表半裡小柴胡湯加枳桔栝蔞皮噎膈痞塞乃痰與氣搏不得宣通痰為氣激而升氣為痰膩而滯故痞塞而成噎膈也連理湯生薑瀉心湯痰挾瘀血成窠囊作痞脈沉澀日久不愈惟悲哀鬱抑之人有之宜從血鬱治桃仁紅花丹皮香附降香蘇木韭汁童便痞滿脈候脈弦急而滑胸驟痞乃肝氣與食滯所成為實脈弦或沉澀或虛大無力氣口為甚此脾胃受傷為虛寸口脈沉滑遲滑為有滯附方熱痞大黃黃連瀉心湯大黃黃連加黃芩名三黃瀉心湯惡寒附子瀉心湯芩連大黃附子脅水半夏瀉心湯見一卷濕若除人參加甘草名甘草瀉心湯痞嘔生薑瀉心湯即半夏瀉心湯加生薑消痰橘皮半夏湯陳夏薑痰痞二陳湯見一卷中風溫中和胃煎見本卷噯氣溫中厚朴溫中湯朴陳苓草木香豆蔻乾薑理陽苓桂朮甘湯見二卷痰飲補中補中益氣湯見一卷中風補脾四君子湯參苓術草加陳皮名異功散和補保和湯參術苓草夏陳藿香砂仁香附木香薑棗散滿三因七氣湯見二卷咳嗽消滯大和中飲見本卷飲食消補枳朮丸枳實一兩白朮二兩為末以全荷葉裹燒飯搗丸米飲下消補資生丸參術陳苓曲朴草山藥薏苡楂肉黃連扁豆白蔻蓮子麥芽芡實桔梗藿香澤瀉蜜丸溫補養中煎見本卷飲食歸脾歸脾湯見二卷勞瘵溫利治中湯見本卷飲食和肝解肝煎見本卷諸氣理肺清肺飲見二卷痰飲消結小陷胸湯見一卷溫祛暑三物香薷飲香薷一兩厚朴扁豆各五錢冷服卻暑消暑丸見一卷暑淡滲六一散見一卷溫除濕平胃散術朴陳草燥濕小柴胡湯見一卷溫暑瀉連理湯見一卷暑痞滿脈案金氏寒熱拘急脈不緊數胃痛飲入輒嘔中焦痞阻溺澀痛宜宣通法白通草製半夏橘白草豆蔻枳殼蘇梗赤苓甘草梢煨薑一啜症減痞滿未除用瀉心法半夏黃連俱薑汁炒黃芩乾薑陳皮枳殼甘草梢木通山梔二服全安殷氏身熱胸痞氣促微咳嘔吐粥飲痰黏溺澀經止數月脈息三五不調兼帶浮數醫投桂附熱劑致咽喉腫礙格陽於上豫謂此懷妊惡阻兼外感也宜辛涼以解痰熱用豆豉杏仁蔞皮鮮竹茹陳皮茯苓製半夏枇杷葉二服熱退痞消張氏寒熱似瘧胸痞不食汗止腋下閲所服方混用枳朴楂糵檳榔青皮之屬此邪在上焦誤行克伐徒傷中下焦耳豫用半夏瀉心湯去芩連甘草加柴胡煨薑蔞皮蘇梗茯苓數服隨愈巢氏發熱胸痞時嘔脹入背脅脈沉小仿小陷胸湯用半夏栝蔞枳殼陳皮茯苓加薑煎二服病除腫脹論治腫在外屬水脹在內屬氣腫分陽水陰水脹彆氣實氣虛因濕熱濁滯致水腫者為陽水因肺脾虛致水溢者為陰水濁氣在上為實脹中氣不運為虛脹辨其位則臟腑脈絡皮膚上下表裡皆有之辨其因則寒熱濕痰氣血鬱滯蟲積皆致之經云三陰結謂之水三陰手太陰肺足太陰脾也又云濁氣在上則生䐜脹此實脹也又曰飲食起居失節入五臟則腹滿閉實此虛脹也又曰臟寒生滿病此寒脹也又曰諸脹腹大皆屬於熱此熱脹也又曰營氣循脈衛氣逆之為脈脹衛氣並脈循分肉為膚脹又經論五臟六腑之脹甚詳不備録岐伯曰水始起目窠微腫如新臥起之狀其頸脈動時咳陰股間寒足脛腫腹乃大水已成以手按其腹隨手而起如裹水之狀光腫如泡此水腫也膚脹者寒氣客於皮膚𪔣𪔣然不堅腹大身盡腫皮厚按其腹窅而不起腹色不變此腹脹也皮厚色蒼一身盡腫或自上而下者多屬氣皮薄色澤腫有分界或自下而上者多屬水鼓脹者腹脹身皆大大與膚脹等色蒼黃腹筋起此鼓脹也膚脹屬肺鼓脹屬脾別有蠱脹因氣血鬱痹久則凝滯不行腹形充大中實有物非蠱即血非如鼓脹之腹皮弸急中空無物也有單腹脹四肢不腫但腹脹也症最難治亦名蠱脹經言諸濕腫滿皆屬於脾又言其本在腎其末在肺皆積水也腎何以聚水腎者胃之關也關門不利故聚水而從其類也是知腫脹無不由肺脾腎者以肺主氣化脾主運輸腎主藏液也且脹不必兼腫腫則或兼脹亦有腫脹並至者病在水分以治水為主而兼理氣氣化水自化也病在氣分以理氣為主而兼利水水行氣亦行也但其間虛實必辨凡陽症必熱熱者多實陰症必寒寒者多虛溺赤便祕脈數有力為實溺清便瀉脈微無力為虛實者六淫外客飲食內傷忽然浮腫其來必速虛者情志操勞酒色過度病後氣虛其腫漸至知此而後治法可詳治水腫必健脾導水實脾飲治鼓脹必通腑疏肝草果厚朴益智青皮枳殼牛膝腹皮濕在下者用分利小分清飲大橘皮湯濕在上中下者用分消通草杏仁厚朴海金砂木通雞內金陳皮蔔子濕濁在裡者潔淨腑四苓散六一散膀胱為淨腑潔滲利也風水脈浮者開鬼門越婢湯腠理為鬼門開發汗也肺脾不運者消皮水防己茯苓湯五皮飲按五水風水皮水正水石水黃汗也仲景曰風水脈浮骨節疼痛惡風皮水脈亦浮跗腫按之沒指不惡風腹如鼓不渴當發汗正水脈沉遲身發熱自喘石水脈沉腹滿不喘黃汗其脈沉遲發熱胸滿四肢頭面腫久不愈必發癰膿肺氣壅熱者用肅降麥門冬湯加茯苓皮山梔滑石杏仁薏苡仁淡豆豉脘痞鬱熱者用苦降半夏瀉心湯清陽痞結者通腑陽栝蔞杏仁半夏茯苓薤白薑胃滿濁逆者泄肝木杏仁厚朴檳榔椒目吳茱萸川楝子胃陽虛者用溫通人參橘白半夏砂仁蓽茇薑脾陽虛者用健運六君子湯加益智神麯脾腎陽虛者用氣化腎氣湯中氣陷者用升提補中湯木邪侮土者和肝胃木香枳殼白芍竹茹木瓜陳皮當歸肝經鬱熱者降逆火山梔丹皮黃連鉤藤青皮金橘暴怒傷肝者平逆氣解肝煎三焦壅滯者用疏利廓清飲濕熱夾滯者兼消利雞金散食滯中滿者專消導和中丸氣虛中滿者兼消補消導寬中湯氣虛兼寒者宜溫補理中湯溫胃飲氣血鬱積夾濕熱者平肝胃小溫中丸清濁混淆氣喘溺少通身腫脹者暖下泄濁禹餘糧丸濕熱痰積脈實有力者滌宿水禹功散導水丸神佑丸血沫凝澀經隧者利搜逐桃仁承氣湯脹實堅滿拒按者大小承氣湯病後虛腫及産後面浮足腫者補元氣六君子湯歸脾丸單腹脹症多屬腑腑宜通勿用滋膩守補沙苑子益智茯苓牛膝枳殼車前子砂仁殼麻仁郁李仁椒目杏仁栝萎仁大腹皮單腹脹俗名蜘蛛脹腹腫四肢瘦由脾氣虛極真臟已傷也論中屬腑句宜活參婦人先腫脹而後經斷者為水分先經斷而後腫脹者為血分水分五皮飲送通經丸血分通經丸先喘而後脹者治在肺五皮五子飲先脹而後喘者治在脾理中湯腎氣丸水腫先起於腹後散四肢者可治先起於四肢後歸於腹者死凡病水分皆陰勝與氣分不同水腫症其色明潤其皮光薄其腫不速每自下而上按肉如泥腫有分界病在氣分則陽症陰症皆有之若病在水分多陰症凡虛腫溺澀香蘇散濕勝不化胃苓湯濕滯中滿白朮丸枳朮丸因於肺者五皮飲因於脾者補中湯因腎陰虛真陽無以化者六味丸加牛膝車前因腎中命火衰不能蒸動關門者腎氣丸夫水為至陰其標在肺其本在腎其制在脾腎虛則關閉其水必逆而上泛脾不能制而反為水所漬故肌肉浮腫肺不能化而反為水所凌故氣息喘急皆陰勝之害也經言膀胱藏津液氣化則能出所謂氣化者即右腎命門真火也火衰則不能蒸動腎之關門而水聚焉腎氣丸以桂附蒸動其關積水始下以陽主開也此法不獨治水腫凡治脹者其要亦在通陽而已凡下氣虛乏中焦氣壅欲散滿則恐虛其下欲補下則滿甚於中當以啓峻湯峻補其下疏啓其中故氣得峻補則上行而啓其中中焦運行壅滯疏通中滿自消下虛自實經所謂塞因塞用也若水腫喘促清理肺氣為主凡禽畜無肺者無溺故水腫宜清肺也腫脹症須分陰陽濕熱壅滯屬陽濁氣凝滯屬陰陽症按之痛陰症按之不痛陽症起於中焦陰症起於下焦陽症治在腑陰症治在臟陽症宜清陰症宜溫毫釐千里不可不辨腫症易治脹症難治腫辨陽水陰水陽水易治陰水難治脹症頭緒更多首辨有形無形無形則輕劑宣通有形則重劑攻伐又須辨在絡在經在腑在臟經絡易治臟腑難治又須察虛實實者可治虛者難治此其大綱也然後再辨其因寒因熱因濕因痰因氣因血因滯因積審而治之徐靈胎曰脹滿症即使正虛終屬邪實古人慎用補法又脹必有濕熱倘脹滿或有有形之物宜緩下之濕熱無形滯積有質宜辨按脹在腸胃則食入脹加治在通腑若二便通調則脹在臟即肝脾腎等臟如靈樞所論或脹在腸外三焦脂膜間靈樞所以謂脹皆在臟腑之外排臟腑而廓胸脅也治在辨其陰陽虛實上下表里皮膚經絡氣分血分水分因寒因熱因濕因郁因痰飲因積滯或有形無形宜汗宜利宜分消宜辛泄宜清肅宜溫通宜升舉宜疏利宜補攝宜開鬱宜緩攻宜軟堅化痞宜理瘀導滯要在宣通勿用守補若腫症身面大勢已退其肢節足跗之水濕浸潤未消宜針刺以決其流此出路也腫脹脈候沉而滑浮而遲弦而緊者皆水腫盛而緊大堅以澀遲而滑者皆脹滿二病之脈實大可治虛微難治腫由腹散入四肢可治由四肢脹入腹難治凡水腫病唇黑肝傷缺盆平心傷臍突脾傷背平肺傷足心平腎傷五者不治靈樞經曰腹脹身熱脈大一逆也腹鳴而滿四肢清泄脈大二逆也腹脹大四末清脫形泄甚三逆也腹脹便血四逆也並不治腹脹肚見青筋腹脹便泄久瘧虛腫皆不治附方陰水實脾飲見一卷濕利濕小分清飲見一卷濕陽水大橘皮湯五苓散合六一散再加陳皮木香檳榔薑泄濁四苓散見一卷暑利濕六一散見一卷溫風水越婢湯見二卷咳嗽皮水防己茯苓湯防己黃耆茯苓甘草桂枝膚脹五皮飲大腹皮赤茯皮陳皮桑白皮薑皮腫水麥門冬湯麥冬五十枚粳米五十粒痞滿半夏瀉心湯見一卷溫健運六君子湯見一卷中風陽虛金匱腎氣丸見二卷虛損補中補中益氣湯見一卷中風肝逆解肝煎見本卷諸氣三焦廓清飲陳苓枳朴澤瀉大腹皮萊蔔子白芥子消滯雞金散雞內金沉香砂仁陳香櫞為末參湯下消導和中丸陳苓夏枳楂曲麥芽砂仁五穀蟲香附消補寬中湯陳苓夏枳楂曲術朴萊蔔子薑溫補理中湯見一卷中風溫胃溫胃飲見一卷中風濕熱小溫中丸二陳湯加白朮神麯生香附苦參黃連針砂醋水打神麯糊丸寒濕禹餘糧丸禹餘糧蛇含石針砂羌活川芎蓬朮三稜白蔻蒺藜陳皮青皮本香大茴香牛膝當歸炮薑附子肉桂研細神麯糊丸葉天士去附子蓬朮青皮加茯苓導水禹功丸黑牽牛茴香薑汁調服或加木香攻下神芎導水丸芩連黑醜川芎薄荷大黃滑石水丸峻下舟車神佑丸甘遂大戟芫花大黃輕粉黑醜青皮陳皮木香檳榔水丸蓄血桃仁承氣湯見一卷疫攻滯大小承氣湯見一卷溫補脾歸脾丸見二卷勞瘵經斷通經丸赤芍歸尾生地川芎牛膝紅花桃仁香附琥珀蘇木屑五靈脂水脹五皮五子飲五皮飲加蘇子車前子大腹子葶藶子菟絲子入豬肝煮蘸蒜食虛腫香蘇散橘紅防己木通蘇葉生薑利濕胃苓湯見一卷中風氣虛白朮散術苓陳曲砂仁五穀蟲荷葉米湯調服消補枳朮丸見本卷痞滿胃陰六味丸見一卷中風喘脹安肺湯黃芩桑皮貝母花粉杏仁知母天冬沙參枇杷葉腹脹加味枳朮丸枳術陳夏芩蘇桔草桂檳榔五靈脂薑蠱脹參朮健脾丸參術陳苓歸芍炙草大棗導水導水茯苓湯赤苓麥冬澤瀉白朮桑皮紫蘇木瓜木香大腹皮陳皮砂仁檳榔燈心水煎瀉積二蛟散芒硝三兩炒乾為末和老黃米三兩炒研加黑糖調服三錢血蠱調營飲芎歸陳檳榔蓬朮延胡白芷産婦大調經散大黑豆五錢茯苓三錢三分西琥珀三分半每末三錢紫蘇湯下日三服血蠱小調經散沒藥西琥珀桂心白芍當歸各一錢細辛麝香各五分酒薑調服堅滿當歸散歸芍丹術陳苓桂心木香木通檳榔腫脹脈案弟寒濕腫脹水漬經隧少腹陰囊腿足通腫大腹按之硬缺盆平肢冷目黃面頰俱浮便滑溺少脈沉遲而虛背寒腹熱坐不得臥病在水分法先分消佐以通陽防己木通大腹皮洗豬苓茯苓薏米半夏砂仁殼附子薑三服腫退肢暖命卻鹹食淡然後主以健運佐以淡滲去防己木通腹皮附子加生朮雞內金炙半夏曲炒杜仲數服食進微汗出囊濕便乾此經腑水濕俱有出路惟診左尺虛酌腎氣湯桂心牛膝車前茯苓山藥椒目茵陳五加皮薏米十數服悉愈後用八味丸調理得安侄孫由腿脛腫入腹漸至胸脅堅滿法在不治姑與分消之劑得汗腫略退然寒濕內蘊非溫通不愈用厚朴桂心附子牛膝茯苓大腹皮砂仁殼老薑三服由面目退及胸腹又數服腿足腫全消王陰瘧服劫藥瘧止面色晦黑決其後必病脹不信豫曰劫痰暫效邪原未淨一也今卯月中旬木火司令一逢辰上濕痰內動脾陽失運必變中滿二也毒品易犯食忌三也面黑無澤腎水侮土小便不利四也後果如言視其目窠微腫如新臥起狀知其裹水先用實脾利水之劑再用金匱腎氣丸料煎湯數十服腫脹悉退藥乍止時交未月濕土已旺漸脹小溲不利又服前丸兩月全愈族某軀長體壯病腫脹或用破氣消滯之品脹益劇行立腸幾裂出臍突缺盆平法本不治診其脈細如絲度必勞力傷精脾腎兩憊之症詢所由自言長途輦重池間出浴酒後入房忽覺溺澀通是濁血驚眩欲僕食減腹膨繃急欲死遂用腎氣丸料大劑煎服減附子丹澤熟地炒炭用一劑腹有皺紋再劑缺盆現溺爽膈寬又數服腹脹漸退仍用加減腎氣丸服經言用力舉重若入房過度汗出浴水則傷腎故與腎氣方合後不守禁忌飽食山芋及未熟雞蛋脹復作求治豫言前方必不驗卒如言房兄病後失調面浮跗腫腹膨食少小水短澀腰膝乏力經言諸濕腫滿皆屬於脾然土衰必補其母非命火不能生脾土且腎為胃關關門不利故聚水必得桂附之陽蒸動腎氣其關始開積水乃下經所謂膀胱氣化則能出也用桂附參朮炮薑茯苓車前牛膝砂仁陳皮山藥為丸一料而安陳傷酒病單腹脹診其脈知脾陽虛用葛花解酲湯加牛膝枳椇子腹寬展能進食矣後用參朮健脾丸去炙草大棗加益智仁煨砂仁殼服愈韋病後感寒腹痛漸成脹滿脈沉微溺少食入脹加腑陽不行治以溫通則脹已大茴香大腹皮洗草果木通砂仁益智仁煨茯苓廣皮煨薑空心四服而愈石腹脹不飢小水不利脈沉澀腑氣痹窒不宣用砂仁殼枳殼木通茯苓益智仁草果俱煨五穀蟲雞內金俱炙萊蔔子炒研數服愈陳五旬以上病單腹脹食後作飽得氣泄略寬明系胃病服謬藥浸至脅滿跗冷脈來沉濡左關微弦症由腑氣久衰疏泄失職氣分延虛漸乾水分致嗌乾口燥小水不清化源乏力矣通陽佐以益腎通陽則傳送速益腎則氣化行腹脹自寬沙苑子韭子懷牛膝酒蒸各錢半益智仁煨橘白砂仁殼各一錢茯苓三錢杞子大腹皮洗各二錢枳殼麩炒錢二分十服脹寬口潤便爽跗溫右脈漸起惟兩尺虛不受按加補骨脂核桃肉去腹皮枳殼食宜淡戒腥膩難化及一切壅氣食物再以豬肚納卵蒜其中扎定淡者食之腑氣通則納食不壅服之甚通暢脹去七八矣又加沉香牡蠣十數服小腹之硬者亦軟焉族女脘脹噯腐經遲腹痛間發寒熱按東垣云胃為衛之本脾乃營之源脾胃陽衰納運不旺致脹滿瘀停宜乎營衛失度衝任不調矣仿內經濁氣在上則生䐜脹之例以通陽降濁二陳湯去甘草加白蔻殼韭子益智子俱炒小茴香穀芽神麯俱炒香附薑汁製煨薑數服諸症皆平沈氏胎前腹滿産後面目肢體浮腫咳頻溺少此肺氣不降水溢高原也或勸用腎氣湯豫力阻不可一服而小水點滴全無脹益甚脈虛濡欲絶用五皮飲參茯苓導水湯去白朮木瓜檳榔腹皮加杏仁蘇梗栝蔞皮冬瓜皮製半夏數服腫消腹漸寬矣後用茯苓半夏生朮砂仁薏仁陳皮蘇子木香厚朴水泛丸服兩料遂平按肺為水之上源主氣此症水阻氣分以肺不能通調水道下輸膀胱故溢則水留而為脹其症年餘無汗得蘇杏微汗而腫消得五皮行水而便利兼仿內經開鬼門潔淨府遺法也李氏有年食入氣壅繞臍積冷脹連胸脅溺少便溏脈沉微全是腑陽向衰濁陰凝結前用二苓木通開太陽之裡砂仁陳夏理太陰之滯乾薑厚朴薏仁溫通利濕冷脹減便溺爽而胸痹未舒猶是中脘清陽不旋之故其家用俗傳牛口中蝕出秈稻草煎湯服甚適豫仿用仲景栝蔞薤白白酒湯加半夏青皮厚朴烏藥木香旋轉清陽可以納穀張氏腹䐜脹連帶脈腰圍緊掣如束脈堅而搏指此病久兼入奇經宜通其腑並理帶脈枳實大腹皮懷中膝酒蒸各錢半砂仁木通各八分當歸鬚茯苓郁李仁各二錢鬱金六分四劑脹寬帶脈亦不緊掣矣後去郁李仁枳實加沉香磨汁三匙數服全愈薑氏五旬余腹膨中空外繃急食入不加脹頭眩耳鳴口乾舌硬溺赤沫便艱足重墜脈沉微症屬三焦濕鬱生火內經亦謂諸腹脹大皆屬於熱諸病跗腫皆屬於火若鬱熱不除遂成鼓脹不治用山梔大腹皮黃柏知母俱酒炒生地麥冬丹皮赤苓冬瓜皮車前子數服已效後去黃柏丹皮加海金砂萆薢服得安眭嫗脾宜升則健胃宜降則和今脘中食入作飽腑氣不司下行醫用流氣之劑更致腰痛帶下吐瘀診脈右關沉微經所謂濁氣在上則生䐜脹也藥以辛溫通陽泄濁為宜製半夏砂仁殼枳殼益智仁韭子茯苓陳皮栝蔞皮穀芽杜仲煨薑數服諸症俱除紀氏先因右脅痛繼而脘腹滿悶食入脹加腑氣失降實由肝失疏泄左關脈不甚弦右寸近滑恐屬妊兆泄肝通腑仍不礙胎為穩椒目砂仁殼茯苓栝蔞皮杏仁陳皮木香數服而平趙童年色萎腹蠱脈疾寒熱無汗溺澀以腎氣湯治牛膝益智仁車前子茯苓薏米熟地牡蠣數服病減加參桂砂仁殼服愈張小腹乃肝腎部分脹滿溺澀已屬下焦氣化失司今通大腹腫硬如石脈右弦大左虛澀症屬單脹治宜通陽勿用守補黨參茯苓牛膝炭沙苑子益智仁煨杞子炭沉香磨汁數服溺爽脹寬張黃疸積年不愈近成單脹腹堅滿食減便瀉乃氣不化水然神脈頽弱難挽之疴姑用牡蠣薏仁茯苓車前子茵陳砂仁殼益智仁牛膝桂心腹軟溺利伊兄復請終以沉疴辭之本陰水腹大腫硬如石脈緩肢冷囊腫用腎氣湯桂心五分附子三分蒸牛膝二錢車前子一錢茯苓三錢大腹皮錢半椒目二十粒八服囊濕如淋腹軟溺利加乾薑山藥研末大腹皮煎湯泛丸以通陽崇土防水而安張脅痛脹少腹腫硬誤服攻蕩劫劑脹劇氣注睪丸脈沉小右弦澀乃肝失疏泄氣鬱留濁治先理肝以泄濁厚朴七分小茴香青皮各錢二分枳殼錢半茯苓橘核各二錢大腹皮三錢延胡八分椒目二十粒車前子三分四服脅痛疝墜俱止但腹右硬痛不任偏臥食不加脹二便如常按脈論症單脹何疑然病因臟損治在通攝兼施厚朴五分枳殼錢半牡蠣茯苓各三錢歸鬚橘核各二錢牛膝一錢桂心三分四服症平後仿腎氣丸用牛膝車前桂心茯苓山藥當歸牡蠣白芍萸肉蜜丸愈金氏中年經斷脘腹脹大季脅緊掣如束食下滿逾時痛便瀉日數行晡後股脛重墜脈陽搏陰微症由瘕聚胞宮氣閉衃留可導使下失治則沖病及帶腰圍弸急中下焦氣機鈍窒運納無權滿痛瘕泄氣虛下陷由來漸矣前年立法溫通腑陽脹寬能納今先主通降脹緩再議半夏曲茯苓草果煨砂仁殼蘇子橘白大腹皮川椒目降香三服滿痛除專調帶絡為其氣虛則弸急而陷下也潞參升麻益智子沙苑子茯神牛膝炭當歸鬚三五服後腰肋松而股脛復常鄒六旬外由泄瀉漸次足腫入腹為脹延及通腹堅滿面浮肢腫水濕不運溏瀉未止若論平昔嗜飲便紅宜丹溪小溫中丸分理濕熱然脈來沉小兩尺如絲明系脾腎久衰火土俱弱致氣鈍濕壅清濁混淆此消導破氣決非治法但溫理脾腎兼佐泄濕自可向安炮薑三分肉蔻神麯炒各一錢益智仁煨錢半茯苓三錢牛膝蒸砂仁殼各一錢半大腹皮洗二錢車前子橘白各八分冬瓜皮二錢倒蝕牛口秈稻草二兩煎湯代水數服腫退瀉止去薑蔻神麯加沙苑子半夏曲粳米炒數十服脹全消匝月後不節葷茹濕面復脹溺少仍用牛膝車前茯苓益智仁炮薑萊蔔子砂仁麥芽雞內金俱炒脹消而健韋胸高突腹腫硬面黃鼻衄足腫溺澀夜分不寐想成童後恣啖生冷秋冬以來邪痼氣窒延春身熱膝冷食入脹加臟腑經脈窒痹治先分理濕熱佐以軟堅栝蔞仁山梔茯苓砂仁殼大腹皮車前子牛膝炒神麯杏仁生牡蠣椒目六七劑脹寬腫軟者十四五知肝失疏泄脾失運輸分消中宜佐暢肝運脾用陳皮鬱金蘇梗當歸石斛山梔茯苓薏苡雞內金炙黃牡蠣表裡分消而溺利汗出矣惟晡後陽升頰熱頭眩溺色渾行則氣急懼當春鼻仍易衄治在降陽和陰熟地牛膝俱炒炭丹皮山梔石斛薏仁赤苓大腹皮冬桑葉燈心小麥溺清眩熱已惟宵則氣急寐不甚穩去赤苓加茯神蔞霜桑皮蜜炙防己炙草數服氣舒而胸突漸平腹寬而膝冷漸和積聚論治諸有形而堅著不移者為積諸無形而留止不定者為聚積在五臟主陰病屬血分血有形而靜者也聚在六腑主陽病在氣分氣無形而動者也難經既以積聚分屬臟腑經曰外中於寒內傷憂怒則氣上逆六俞不通凝血蘊裹不散津液澀滲著而不去積乃成已難經曰積者五臟所生始發無常處痛不離其部上下有終始左右有窮處聚者六腑所成始發無根本上下無留止痛無常處巢氏病源別立癥瘕之名以不動者為癥動者為瘕亦猶難經之積聚而已第無形之瘕聚其散易有形之癥積其破難治之者先辨有形無形在氣在血可略得其概矣其生於五臟者肺之積曰息賁在右脅下肝之積曰肥氣在左脅下心之積曰伏梁在臍上上至心下脾之積曰痞氣在胃脘腎之積曰奔豚發於少腹上至心上下無時其見於臍下為癥瘕癥者按之不移即血癥食癥之屬瘕者假物成形如血鱉石瘕之類見於胸脅為痞癖痞乃結塊在肌肉而可見癖由內著結隱僻而難蹤既分其部必原所起初由寒氣瘀血痰沫交結於肓膜久而盤踞堅牢至元氣日削盤踞日深攻補兩難措手惟先理其氣大七氣湯排氣飲氣行則脈絡通或先調其中補中益氣湯參苓湯脾運則積滯化其藥性宜辛散溫通方能入陰出陽解散凝聚然初為氣結在經久則血傷入絡必理血分如歸尾桃仁蘇木延胡鬱金琥珀桂心兼通絡瘀如歸尾韭根鯪鯉甲桂枝尖新絳雞血藤搜逐之中酌補元氣如五積等丸用參苓桂附之類即邪深積錮務令脾胃氣旺乃可消磨堅結否則專事攻削正氣益衰積聚何由去乎知養正則邪可除而後結者散之客者除之留者行之堅者削之強者奪之咸者軟之苦者瀉之和其中外可使必已且經曰大積大聚毒可犯也衰其大半而止懼盡攻其邪必傷其正也今條列方治有息積病脅下滿氣逆不妨於食化氣湯木香調氣散有腸覃寒客腸外與衛氣搏因有所繫癖而內著瘜肉乃生始如雞卵稍以益大狀如懷子月事以時下阿魏麝香散有石瘕生於胞中寒氣客於子門氣不得通惡血留止狀如懷子月事不以時下和血通經湯若不應見晛丸虛人十全大補湯送下二症皆生於女子有奔豚病從少腹起上衝咽喉得之驚恐金匱奔豚湯有伏梁環臍而痛金匱大建中湯加桂苓其息賁肥氣痞氣諸積東垣用五積丸分治凡通治五積成形堅久攻積丸化積丸通治六聚隨氣上下散聚湯有血癥沈氏血癥丸有食癥大和中飲有疝瘕導氣湯有蛇瘕赤蜈蚣散有鱉瘕蕪荑湯有發瘕香澤油有痞塊連蘿丸潰堅湯有痞積脅堅如石大黃散化痞膏有胸痞半夏瀉心湯有脅痞右脅有形推氣散有瘧痞左脅有形屬血分鱉甲丸有飲癖口吐清涎六君子湯合五苓散有酒癖傷酒成積保和丸有茶癖嗜茶成積星術丸好食茶葉成癖椒紅茶葉各一兩研末炒飛麵糊丸茶清下好食生米土灰成癖大七氣湯加檳榔使君子有面積阿魏丸或萊蔔子薑酒煎有肉積小阿魏丸或狗肉積杏仁山楂硇砂阿魏有菜果積桂香丸有魚蟹積紫蘇橘皮蘆根薑汁有蛋積白蔻豆豉橘紅生薑有小腹癥積形如卵攻痛時發茴香丸有蟲積雷丸檳榔棐子使君子妙應丸有血積跌撲蓄瘀面黃糞黑桃仁承氣湯有寒積附子理中湯有痰積導痰湯有疳積肥兒丸脾胃虛者六君子湯肝脾虛者歸脾湯肝火鬱者蘆薈丸憂思郁者六郁湯肝腎虧者腎氣丸量新久酌虛實或一補一攻或三補一攻以積聚由漸而成治必由漸而去故緩攻通絡勿峻用吐下致傷胃氣而損真元也況堅頑之積多在腸胃以外募原之間非藥所能猝及宜用阿魏膏琥珀膏水紅花膏三聖膏以攻其外用針法以攻其內且以艾火灸法消散固結為尤效仲景曰積聚癥瘕不轉動者難治五積中奔豚症最難治得效曰宿血滯氣結為癥瘕腹中痞塊堅硬作痛當以破氣藥治之或以類從如敗梳治蝨瘕銅屑治龍瘕曲糵治米瘕石灰治發瘕叔微曰治積要法大抵所惡者攻之所喜者誘之則易愈入門曰積初屬寒宜辛溫消導大七氣湯烏白丸久則為熱宜辛寒推蕩木香檳榔丸通元二八丹壯人無積虛者有之先補虛使氣血旺則積消木香枳殼丸士材曰嘗制陰陽攻積丸通治五積六聚七癥八瘕痃癖蠱血痰食不問陰陽皆效藥品稍峻用之有度補中數日然後攻伐不問積去多少又與補中待其神壯則復攻之屢攻屢補以平為期此豫獨得之訣百發百中者也積聚脈候右脅有積氣肺脈結結甚則積甚結微則積微難經五積為陰沉伏附骨六聚沉結痼則沉伏脈訣脈弦緊為積弦緊而微細者癥也積聚癥瘕之脈皆弦緊在心下即寸脈弦緊在胃脘即關脈弦緊在臍下即尺脈弦緊積脈堅強者生虛弱者死沉而有力為積沉緊為寒積弦而牢為積聚弦而伏腹有癥不可轉不治脈經癥瘕脈多弦弦細為癥弦急為瘕回春郁脈沉澀積脈弦堅附方通治陰陽攻積丸茱萸乾薑官桂川芎各一兩黃連半夏橘紅茯苓檳榔厚朴枳實菖蒲延胡人參沉香琥珀桔梗各八錢巴霜另研五錢皂角六兩煎汁泛丸每服八分漸加至一錢半薑湯下此丸通治五積六聚七癥八瘕痃癖蠱血痰食皆效肺積息賁丸厚朴八錢黃連一兩二錢人參二錢炮薑茯苓川椒紫菀各錢半桔梗三稜天冬陳皮川烏蔻仁各一錢青皮五分巴霜四分各研末方入巴霜蜜丸桐子大初服二丸日加一丸至大便溏日減一丸仍至二丸再日加增肝積肥氣丸柴胡二兩黃連七錢厚朴五錢川椒四錢炙草三錢莪朮昆布人參各二錢半皂角去皮弦子煨茯苓各錢半川烏錢二分乾薑巴霜各五分巴霜後入蜜丸服法照前積塊減半勿服心積伏梁丸黃連一兩二錢人參厚朴各五錢黃芩二錢肉桂茯神丹參各一錢川烏炮薑紅豆菖蒲巴霜各五分丸同前脾積痞氣丸厚朴五錢黃連八錢茱萸三錢黃芩白朮各二錢茵陳砂仁乾薑各錢半茯苓人參澤瀉各一錢川烏川椒各五分巴霜另研肉桂各四分蜜丸如前腎積奔豚丸厚朴七錢黃連五錢苦楝子酒煮三錢茯苓澤瀉菖蒲各二錢延胡錢半全蠍川附獨活各一錢川烏丁香巴霜另研各五分肉桂二分蜜丸如前東垣五積丸多用人參且磨積用丸不用湯取漸次消磨之義也行氣大七氣湯青陳桔藿桂草三稜蓬朮益智香附各一錢一方加大黃檳榔初積排氣飲香附烏藥澤瀉陳皮藿香枳殼各錢半木香厚朴各一錢食加曲糵寒加薑桂調中補中益氣湯見一卷中風調中參苓湯參苓術草芎歸芍木香香附延胡薏苡息積化氣湯莪朮乾薑青皮陳皮丁香茴香炙草各五錢桂心木香各二錢半胡椒沉香各一錢一分每服二錢薑湯下息積木香調氣散青陳芎朴枳烏藥木香香附蒼朮各一錢桂心甘草各三分砂仁五分腸覃阿魏麝香膏阿魏五錢麝香一錢雄黃三錢紅蓼花子四兩人參白朮各一兩肉桂五錢每服三錢石瘕和血通經湯當歸熟地蘇木各二錢三稜莪朮木香貫仲肉桂各八分紅花三分血竭五分紅酒煎服石瘕見晛丸附子四錢鬼箭羽紫英各三錢澤瀉肉桂延胡木香各二錢檳榔二錢半血竭錢半大黃三錢桃仁三十枚三稜五錢水蛭一錢糊丸虛人十全大補湯見一卷中風奔豚金匱奔豚湯歸芍芎苓草各一錢半夏甘李根白皮葛根各二錢薑三片此治衝脈為病未嘗用少陰藥也設泥奔豚為腎積而用伐腎之劑則謬矣伏梁大建中湯川椒乾薑人參飴糖通治攻積丸茱萸乾薑官桂川烏各一兩黃連橘紅檳榔茯苓厚朴枳實人參沉香琥珀延胡半夏曲各八錢巴霜五錢五積化積丸三稜莪朮阿魏浮石香附雄黃檳榔蘇木瓦楞子五靈脂水丸六聚散聚湯二陳湯加當歸杏仁桂心檳榔血積血癥丸五靈脂大黃甘草梢桃仁各五錢生地七錢牛膝四錢官桂二錢延胡當歸各六錢三稜莪朮赤芍乳香沒藥各一錢食積大和中飲見本卷飲食疝瘕導氣湯川楝子四錢木香三錢茴香二錢茱萸一錢蛇瘕赤蜈蚣散蜈蚣一條炙研酒服治誤食菜中蛇精或食蛇肉致成蛇瘕腹內常飢食物即吐鱉瘕蕪荑湯蕪荑炒不拘分兩煎水代茶亦有用雷丸鍚灰之屬治之者發瘕香澤油香油一升入香澤煎盛置頭邊令氣入鼻蟲當口出急以石灰手捉取抽盡又方以敗梳煎湯服痞塊連蘿丸黃連吳萸白芥子蘿蔔子山梔川芎香附楂肉神麯蒸餅為丸堅塊潰堅湯歸術陳夏枳楂朴香附砂仁木香汁痞積大黃散三稜大黃薑橘皮湯下堅積化痞膏三稜莪朮當歸各五錢大黃三錢全蠍十四個甲片十四片蜈蚣五條木鱉子七個入香油二斤四兩煎去渣熬下黃丹一斤阿魏一兩乳香沒藥各五錢硝石三錢開水和服胸痞半夏瀉心湯見一卷溫肋痞推氣散砂仁肉桂各二分半木香三分炙草茴香丁香陳皮青皮乾薑各五分蓬朮四分胡椒沉香各一分瘧痞鱉甲丸醋炙鱉甲一兩三稜莪朮香附青皮桃仁紅花神麯麥芽海粉各五錢醋糊丸脾虛六君子湯見一卷中風飲癖五苓散見一卷溫酒癖保和丸見二卷痰飲茶癖星術丸星術青陳面積阿魏丸酒浸阿魏肉桂莪朮麥芽神麯萊蔔子青皮白朮乾薑各五錢百草霜三錢巴霜三七粒糊丸薑湯下肉積小阿魏丸阿魏山楂各一兩黃連六錢連翹五錢醋糊為丸菜積桂香丸肉桂麝香飯丸小腹茴香丸蘆巴八錢小茴香六錢巴戟川烏各二錢川楝肉四錢茱萸五錢酒糊丸鹽酒湯下蟲積妙應丸附子四個去皮臍刓孔入硇砂一兩七錢麵裹煨蓽茇故紙青皮各三兩半糊丸薑陳皮湯下血積桃仁承氣湯見一卷疫寒積附子理中湯見一卷中風痰積導痰湯見一卷中風疳積肥兒丸胡黃連神麯麥芽各五錢檳榔一錢肉蔻二錢使君子二錢半木香一錢蒸餅為丸肝脾歸脾丸見二卷勞瘵火鬱蘆薈丸蘆薈川連胡黃連木香青皮蕪荑各五錢歸陳苓各一兩半炙草七錢米糊丸憂鬱六郁湯見本卷郁腎虛腎氣丸見二卷虛損外治阿魏膏羌活獨活元參官桂赤芍甲片生地猳鼠矢大黃白芷天麻各五錢紅花五錢土木鱉二十個用麻油煎去渣下黃丹五錢煎再入芒硝阿魏乳香沒藥各五錢再入蘇合油五錢麝香三錢調勻成膏取兩許攤貼紅緞上正當痞塊用熱尉斗尉之外治琥珀膏大黃朴硝各一兩為末大蒜搗膏和勻作片貼之一方加麝香五分名硝黃膏外治水紅花膏紅蓼子二錢大黃朴硝山梔石灰各一錢酒酵六錢共搗成膏以布攤貼尉斗尉之外治三聖膏石灰半斤為末瓦器炒令淡紅少頃下大黃末一兩候熱退入桂心末五錢略炒入米醋熬成膏以紙攤貼初積烏白丸烏梅肉生薑各四兩白礬半夏各二兩搗勻火焙入神麯麥芽青皮陳皮蓬朮丁香皮大腹子各一兩酒糊丸久積木香檳榔丸大黃四兩黑醜黃芩各二兩木香檳榔黃連枳殼當歸香附青皮陳皮蓬朮黃柏各一兩水泛丸積熱通元二八丹黃連八兩白芍當歸生地烏梅各五錢雄豬肚一個入藥末於內線縫蒸熟搗丸薑湯下攻補木香枳殼丸大黃黑醜各二兩茯苓白朮厚朴半夏曲人參木香青皮陳皮檳榔神麯三稜蓬朮麥芽各一兩薑汁糊丸積聚脈案薑左脅氣逆攻胸久而痞聚妨食作脹醫用硝黃攻奪無形元氣受傷腹鳴便瀉脘中堅聚成塊診脈左強右弱食少不運木旺土衰必延吐逆之咎議和肝通腑降濁驅脹白芍牡蠣粉枳殼栝蔞仁俱炒青皮砂仁殼益智仁煨茯苓製半夏煨薑五服病減食加塊亦軟小去枳蔞加黨參生術扶脾陽而右脈亦振張小腹積聚自用大黃鬱金枳實等下瘀血數次暫寬恃氣壯頻年屢用豫謂積聚隨元氣為消長元氣衰而後邪氣踞之屢行攻奪終損脾元經言大積大聚其可去也衰其半而止宜扶脾兼消積為穩方用六君子料加木香青皮歸尾延胡白芍官桂之屬水泛丸庶痞積日漸消磨不至損動真元耳房弟少腹偏左瘕聚有形感寒墜痛昔用針刺原得痛緩今宿疴遇勞輒發塊腫不任峻攻仿痛久傷絡之例兼咸以軟堅主治宜效特下焦深遠之鄉乃厥陰宗筋所主直達病所良復不易舶茴香橘核俱酒焙當歸須韭子炒延胡葫蘆巴俱酒炒牡蠣醋煅沉香汁沖服三劑痛定腫消塊亦漸軟房侄右脅上痞脹按之腫滿繃急漸妨飽食仿石室祕録軟治法用生朮茯苓神麯地栗粉鱉甲炙白芍製半夏白芥子厚朴桂心潞參蜜丸服以食物壓之效
