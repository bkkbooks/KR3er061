body:
  text: 卷之三脾胃論治脾胃皆屬土脾為己土胃為戊土而臟腑分焉脾為臟胃為腑凡臟主守腑主通臟陰而腑陽也經言胃為水穀之海飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱脾主為胃行其津液者也故胃主納脾主運胃喜涼脾喜燥昔人每多混治惟葉氏醫案謂脾宜升則健胃宜降則和太陰濕土得陽始運陽明陽土得陰始安以脾喜剛燥胃喜柔潤也仲景急下存津其治在胃東垣大升陽氣其治在脾又言五臟以守為補六腑以通為補卓然有見岫雲華氏稱其議論越出千古其敘葉案曰脾胃論莫詳於東垣其補中益氣調中益氣升陽益胃諸湯以勞倦內傷為主故用人參黃耆以補中白朮蒼朮以溫燥升麻柴胡升下陷之清陽陳皮木香理中宮之氣滯以太陰惡濕而病人胃陽衰者居多用之得宜效如桴鼓若脾陽不虧胃有燥火則當用香岩養胃陰之法凡病後熱傷肺胃津液以致虛痞不食舌絳嗌乾煩渴不寐便不通爽此九竅不和皆胃病豈可以耆朮升柴治乎故先生必用降胃之法所謂胃宜降則和者非辛開苦降亦非苦寒下奪以損胃氣不過甘平或甘涼濡潤以養胃陰則津液來復使之通降而已此即宗內經六腑者傳化物而不藏以通為用之理也故治胃陰虛不飢不納用清補如麥冬沙參玉竹杏仁白芍石斛茯神粳米麻仁扁豆子治胃陽虛食穀不化用通補如人參益智陳皮厚朴烏藥茯苓生朮地栗粉半夏韭子生薑黃米治脾陰虛胸嘈便難用甘潤如甘草大麥仁白芍當歸杏仁麻仁紅棗白蜜治脾陽虛吞酸噯腐用香燥如砂仁丁香炒朮神麯麥芽乾薑如四君六君異功凡守補皆脾藥治脾胃陽虛運納俱少食已欲瀉用升降法如補中益氣湯加茯苓益智木瓜或益黃散治濕傷脾胃用平胃散或清暑益氣湯加減治中氣虛用補中益氣湯加麥冬五味子治飢傷痛而納食稍安病在脾絡因傷飢餓而得當甘緩以養脾營當歸建中湯治食傷傷食惡食腹痛作飽當分消胃土用生益智草果廣皮茯苓雞內金炒楂肉神麯煨薑病後調理脾元參苓白朮散或六君子湯其分治合治於病情尤為允愜者矣白朮炒用則守生用則和甘草炒用則補生用則瀉火上方分列脾胃大抵脾臟以守為補胃腑以通為補脾宜升運胃宜通降也其方治與飲食症參觀則備矣附方補中補中益氣湯見一卷中風調中調中益氣湯即補中益氣湯去歸術加木香蒼朮升陽升陽益胃湯六君子加耆芍羌獨防柴連澤瀉薑棗補脾四君子湯參苓術草加陳皮名異功散再加半夏名六君子湯脾陽益黃散陳皮一兩青皮訶子肉炙草各五錢丁香二錢利濕平胃散見一卷濕祛暑清暑益氣湯見一卷暑飢傷當歸建中湯芍桂飴草薑棗當歸病後參苓白朮散參苓術草山藥扁豆蓮子桔梗砂仁薏仁脾腎蟠桃果芡實蓮子核桃熟地棗肉用豬腰子摻入茴香末蒸熟去膜同藥搗成餅胃火安胃飲黃芩石斛澤瀉木通陳皮楂肉麥芽若熱甚去後三味加石膏生地麥冬脾濕半夏枳朮丸半夏枳術和胃養胃湯人參藿香厚朴蒼朮各一錢茯苓錢二分陳皮錢五分草果炙草各六分加烏梅二個生薑三片水煎脾胃脈案張髫年寒熱肢冷食少便瀉尚作瘧治遂神疲色慘脈沉須防慢驚急理脾陽先用理中湯少加附子手足乃溫專用異功散加蓮棗理脾熱減瀉止於脅痛吞酸已止肝火悉平但中脘氣窒口燥不知飢右脈欠和胃陰未復用沙參麥冬花粉當歸白芍栝蔞小麥蔗汁三服得平薑左脈浮而鉤右弦緩脘中久痛納食稍緩乃飢傷脾絡所致經言脾欲緩急食甘以緩之勿用平肝克伐生氣潞參當歸鬚白芍飴糖紅棗甘草牡蠣粉糯稻根鬚降香末數劑而安飲食症論治飲以養陽食以養陰飲食人所以衛生而脾胃實生之本也胃旺則多食不滯過食不飢脾運則分五臟榮潤四肢若生冷戕胃飢飽戕脾中氣先餒不宜專事消導宜補中益氣湯加茯苓砂仁夫中氣即脾胃沖和之元氣也然胃氣以下行為順脾氣以健運為能胃強脾弱則消穀而便溏脾強胃弱則知飢而納少故胃陽虛飽食輒噯者宜溫通如橘紅厚朴益智枳殼半夏曲草蔻蘇子穀芽若守補則壅忌炙草焦白朮炮薑脾陽虛多食不化者宜香燥如砂仁丁香木香白朮半夏神麯薏苡橘白雞內金若膩補則滯忌地黃萸肉等脾胃陰虛不飢不食口淡無味者宜清潤以養之如沙參扁豆子石斛玉竹當歸白芍麻仁粳米大麥仁若消導則耗氣劫液忌枳朴楂肉蘿蔔子曲糵傷飲惡飲傷食惡食嘔而腹滿為胃寒生痰和胃二陳煎食填太陰腹悶絞痛為木鬱食厥急吐之用陰陽水燒鹽湯探吐痛定後服藿香散飲食留滯脘痞腹脹者為腑氣不宣消導之大和中飲飲冷吐利脾元受困者溫其寒理中湯或溫胃飲去黃耆食下氣逆噦厄噎膈者開其鬱神香散加橘皮竹茹半夏食後動怒脅滿而痛者平肝氣柴胡枳殼香附青皮山梔子生白芍飲酒傷中發熱嘔瀉者利其濕葛花解酲湯肝胃不和脈弦脘痹者泄木安土木瓜吳萸白芍金橘益智良薑紅棗小麥脾腎兩衰虛寒滑脫者溫中補陽四維散加肉蔻但腎陽衰者二神丸凡嗜熱酒者脘必瘀血宜鬱金木香丹參當歸降真香喜冷食者症多中寒宜八味理中丸胃虛則嘔悸動風宜牡蠣白芍茯神人參棗仁炙草阿膠胃實則痞滿內熱枳實消痞丸生薑瀉心湯脾虛則食後反飽異功散去甘草加砂仁穀芽脾疸則口甜畏食佩蘭葉煎湯胃上逆則導其濁滯豆豉枳實竹茹栝蔞仁橘皮地栗粉厚朴甚則小承氣湯脾下陷則升其清陽舉元煎濕傷脾胃腹腫便難宜兼升降則運化宣通半夏砂仁殼茯苓橘白厚朴枳實草蔻煨薑若飲食不甘口苦不寐膽熱乘脾者宜導痰泄熱則土鬱舒加味溫膽湯去熟地加丹皮山梔桑葉生棗仁食已吐酸肝逆犯胃者宜降火泄濁則木鬱達戊己丸加茯苓山梔脅痞者黃連瀉心湯其飲食減少有脾胃虛熱安胃飲有中氣虛寒養中煎有中寒虛痞治中湯有思慮傷脾歸脾湯有脾濕水瀉加味平胃散或胃苓湯有胃氣痛逆調氣平胃湯不能食而瘦多脾虛宜山藥茯苓白朮炙草當歸白芍人參雞內金砂仁陳皮蓮子黃米屑調服善食而瘦多胃火瀉黃散或用太清飲去木通加生地白芍一切食滯成積消食丸凡旦晝陽盛穀氣易消食可飽暮則陰盛穀氣難化食宜少夏暑秋涼晚餐尤宜簡泊則脾不困胃不滯矣附方補中補中益氣湯見一卷中風消痰和胃二陳湯夏陳苓草炮薑砂仁棗消導大和中飲楂朴枳夏陳乾薑澤瀉木香麥芽砂仁溫中理中湯見一卷中風去寒溫胃飲白蔻人參澤瀉益智砂仁厚朴甘草乾薑薑黃黃耆陳皮開鬱神香散丁香蔻仁酒傷葛花解酲湯見一卷濕補陽四維散人參四兩附子炮薑各二錢烏梅五分炙草一錢水拌蒸烘乾再研每服二錢腎陽二神湯故紙肉蔻棗肉薑汁加吳萸五味名四神湯溫中八味理中丸理中加茯苓麥芽神麯砂仁痞滿枳實消痞丸枳實黃連各五錢厚朴四錢苓術薑草夏麥芽各二錢痞熱生薑瀉心湯芩連參草夏乾薑生薑大棗補脾異功散見一卷中風導滯小承氣湯見一卷溫升陽舉元煎參耆各三錢術草各一錢升麻五分薑棗水煎膽熱溫膽湯見一卷溫加人參遠志棗仁熟地名十味溫膽湯吐酸戊己丸黃連吳萸白芍脅痞黃連瀉心湯黃連酒炒水煎服虛熱安胃飲見本卷脾胃虛寒養中煎參苓薑草山藥扁豆虛痞治中湯參術薑草青陳半加生薑思傷歸脾湯見二卷勞瘵去濕平胃散見一卷中風加扁豆木通名加味平胃散濕瀉胃苓湯見一卷中風胃氣調氣平胃散見一卷中風胃火瀉火散見一卷火清胃太清飲知母石斛木通各一錢半石膏三錢麥冬二錢食積消食丸楂肉神麯麥芽蘿蔔子青皮陳皮香附各二兩阿魏一兩補元參朮膏人參白朮嘔吐論治嘔吐症胃氣失降使然也而多由肝逆沖胃致之靈樞謂足厥陰所生病者胸滿嘔逆是也夫胃司納食主乎通降其上逆而嘔吐者乃肝邪犯胃或胃虛肝乘故治嘔吐必泄肝安胃用藥主苦降辛通佐以酸泄其肝陽上亢食入嘔吐者用苦辛降逆如黃連川楝子吳茱萸半夏厚朴薑汁之屬或苦酸泄熱如烏梅白芍木瓜枳實左金丸戊己湯其胃陽衰風木乘克食入不變者用溫胃平肝如人參乾薑丁香半夏青皮白芍或吳茱萸湯其脾陽衰不能運化腹脹痛嘔者用辛溫行滯香砂六君子湯加益智厚朴神麯其胃虛客氣上逆噫噯欲嘔者用鹹以軟痞重以鎮逆旋覆代赭湯加二陳其中陽虛濁陰犯胃吐黑緑苦水者用辛熱開濁理中湯加川椒半夏附子茯苓之屬其肢冷脈微時吐清水者用辛熱扶陽附子理中湯真武湯其肝火鬱熱吞酸吐酸者用辛鹹苦降左金丸或鹽炒吳茱萸湯去棗其胸痞痰阻食已漾漾欲吐者用辛泄生薑瀉心湯或二陳湯加蔻仁吳萸薑汁其肝厥上逆脘痛嘔涎者用辛通佐以酸泄如川椒乾薑桂枝烏梅白芍半夏其因驚怒動肝致脅痛乾嘔而液虛者用辛通潤補大半夏加茯神麥冬青皮白芍當歸其支飲湯水下咽嘔吐者用辛泄小半夏湯其肝陰胃津兩虛肝風擾胃嘔吐者用柔劑滋液熄風養胃如人參白芍麥冬阿膠小麥半夏茯苓粳米之屬其肝風犯胃嘔吐眩暈者用苦酸以和陽如黃連白芍烏梅牡蠣之屬其嘔傷胃津熱邪乘胃食入即吐者用辛涼化痰溫膽湯加石斛山梔其氣衝嗆咳吐逆者肝火上凌過胃犯肺用清肅苦降如蘇子杏仁枇杷葉前胡山梔栝蔞仁降香末其氣衝心痛飢不欲食吐蛔者用苦辛酸以伏蟲理中安蛔丸蛔厥者臟寒蛔上入膈口乾心煩手足冷脈沉遲宜寒熱互用酸苦雜投烏梅丸臟厥者陽氣垂絶痛嘔不納躁擾不安安胃丸或半夏瀉心湯加枳實其久嘔致傷肝腎並衝脈上逆者用溫通柔潤如蓯蓉茯苓當歸杞子桂心沙苑子鹿角霜其厥陰濁邪上攻痛從少腹逆沖為嘔者用辛溫泄濁如吳萸小茴桂枝韭白汁茯苓其嘔而絶粒者取生鵝血熱飲每食必嘔者煮羊血熟食之皆立止集諸名家嘔吐噦治法有聲有物為嘔有物無聲為吐有聲無物為噦昔人以嘔屬陽明吐屬太陽噦屬少陽噦即乾嘔東垣以三者俱屬脾胃虛潔古從三焦分別三因上焦在胃口主納中焦在中脘主腐熟水穀下焦在臍下主出而不納上焦吐者因於氣食已即吐渴欲飲水治當降氣和中中焦吐者因於積或先痛後吐或先吐後痛治當去積和氣下焦吐者因於寒朝食暮吐暮食朝吐溺清便閉治當通其閉溫其寒後人又分隨食隨吐為嘔小半夏湯食入乃吐為暴吐生薑橘皮湯食已後吐為嘔吐橘皮半夏湯枳桔湯加參白芍半夏食久乃吐為反胃金花丸理中湯食在而吐者為翻胃紫沉丸旦食暮吐暮食朝吐下焦病半夏生薑大黃湯此從食下久暫分上中下脘而治者也古法嘔吐氣壅谷不得下小半夏湯胃虛穀氣不行嘔而液傷大半夏湯胸滿食谷欲嘔吳茱萸湯心下痞嘔而腸鳴半夏瀉心湯嘔而思水飲停膈上豬苓散乾嘔噦手足厥橘皮湯噦逆虛熱橘皮竹茹湯噦逆虛寒半夏乾薑湯乾噦胃口有痰二陳湯加薑汁寒吐者肢冷脈細二陳湯加丁香炮薑諸藥不效紅豆丸熱吐者煩渴脈洪二陳湯加梔連竹茹枇杷葉薑汁蘆根汁客寒犯胃理中湯肝火入胃左金丸由脾氣鬱結歸脾湯加吳萸由肝脾鬱滯香砂六君子湯怒時飲食嘔吐胸滿膈脹關格不通二陳湯加青皮木香不效加丁沉砂蔻藿朴曲薑由痰積者遇寒輒發蔻仁丁香砂仁乾薑半夏陳皮由食滯者消導乃安山楂神麯陳皮枳殼厚朴砂仁雞金先吐後瀉身熱腹悶名曰漏氣因上焦傷風邪氣內著麥門冬湯二便不通氣逆不續名曰走哺因下焦實熱人參湯主之吐而中氣久虛必借穀食以和之焦米神麯參苓苡米穀芽甘草陳皮薑