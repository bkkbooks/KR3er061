body:
  text: 卷之六頭痛論治大頭痛發頤眉稜骨痛眼眶痛附頭為天象諸陽經會焉若六氣外侵精華內痹鬱於空竅清陽不運其痛乃作經曰風氣循風府而上為腦風新沐中風為首風犯大寒內至骨髓為腦逆頭痛以上風寒痛下虛上實為腎厥頭痛頭痛耳鳴九竅不利為腸胃所生頭痛甚腦盡痛手足青至節不治陽氣敗絶以上虛痛條而列之有因風因寒因濕因痰因火因鬱熱因伏暑因傷食傷酒傷怒與氣虛血虛及真頭痛偏頭痛內風擾巔腎虛水泛腎虛氣逆諸症因風者惡風川芎茶調散因寒者惡寒桂枝羌活湯因濕者頭重羌活勝濕湯因痰者嘔眩肢冷為太陰痰厥頭痛半夏天麻白朮湯因火者齒痛連翹丹皮桑葉羚羊角山梔薄荷菊葉苦丁茶因鬱熱者心煩清空膏加麥冬丹參或菊花散因伏暑者口乾荷葉石膏山梔羚羊角麥冬因傷食者胸滿香砂枳朮丸因傷酒者氣逆葛花解酲湯因傷怒者血逆沉香降氣湯氣虛者脈大補中湯加川芎細辛血虛者脈芤或魚尾上攻眉尖後近髮際為魚尾四物湯加薄荷真頭痛客邪犯腦手足青至節黑錫丹炙百會穴偏頭痛屢發日久不痊菊花茶調散芎犀丸透頂散內風擾巔者筋惕肝陽上冒震動髓海三才湯加牡蠣阿膠白芍茯神炒甘菊花腎虛水泛者頭痛如破昏重不安六味湯去丹皮加沉香更以七味丸人參湯下因腎虛氣逆為腎厥玉真丸來復丹外如雷頭風頭痛起塊或鳴如雷震清震湯大頭痛頭面盡腫由天行時疫甚則潰膿普濟消毒飲輕者發頤腫耳前後甘桔湯加薄荷荊芥鼠黏子連翹黃芩眉稜骨痛由風熱外干痰濕內郁選奇湯眼眶痛俱屬肝經肝虛見光則痛生熟地黃丸肝經停飲痛不可開晝靜夜劇導痰湯東垣曰頭痛每以風藥治者高巔之上惟風可到味之薄者陰中之陽自地升天者也太陽頭痛惡風寒脈浮緊川芎羌活獨活麻黃之類為主少陽頭痛脈弦細往來寒熱柴胡黃芩為主陽明頭痛自汗寒熱脈浮緩長實升麻葛根白芷石膏為主太陰頭痛必有痰體重腹痛脈沉緩蒼朮半夏南星為主少陰頭痛足寒氣逆為寒厥脈沉細麻黃附子細辛湯主之厥陰頭項痛或吐涎沫厥冷脈浮緩吳茱萸湯主之太陰少陰二經雖不上頭然痰與氣逆壅於膈頭上氣不得暢而為痛也此六經頭痛之治也頭痛脈候寸脈緊急或浮弦或短皆頭痛浮滑為風痰易治短澀為虛難治浮弦為風浮洪為火細或緩為濕附方風痛川芎茶調散見一卷傷風寒痛桂枝羌活湯桂羌防草濕痛羌活勝濕湯見一卷濕痰痛半夏天麻白朮湯夏麻術參耆陳苓姜麥芽神麯蒼朮澤瀉鬱熱清空膏芩連羌防柴芎草茶調三錢風熱菊花散見五卷頭風食積香砂枳朮丸木香砂仁枳術陳夏荷葉包陳米煨飯為丸傷酒葛花解酲湯見一卷濕傷怒沉香降氣散見三卷郁氣虛補中益氣湯見一卷中風血虛四物湯地芍歸芎溫腎黑錫丹硫黃黑鉛加沉香附子肉桂茴香故紙肉豆蔻金鈴子木香葫蘆巴偏痛菊花茶調散即川芎茶調散加菊花殭蠶偏痛芎犀丸川芎犀角參苓辛梔麥冬草石膏辰砂片腦阿膠偏痛透頂散見五卷頭風肝陽三才湯天冬熟地人參腎虛六味丸七味丸俱見一卷中風腎厥玉貞丸見五卷厥通利來復丹見三卷嘔吐大頭普濟消毒飲見一卷疫耳腫甘桔湯甘草桔梗荊防杏葛石膏鼠黏子元參前胡眉稜選奇湯見五卷頭風肝虛生熟地黃丸生地熟地甘菊石斛枳殼防風牛膝羌活杏仁蜜丸滌飲導痰湯見一卷中風寒厥麻黃附子細辛湯麻附辛厥冷吳茱萸湯見三卷嘔吐頭痛脈案張氏女患頭痛每發須吐盡痰沫痛乃止診其脈沉緩知為太陰痰厥頭痛仿東垣半夏天麻白朮湯加減愈按太陰頭痛必有痰也蒼朮半夏湯主之少陰頭痛脈沉細足寒而氣逆麻黃附子細辛湯主之太陰少陰二經雖不上頭然痰與氣逆壅於膈間則氣不暢而頭為痛也侄頭右偏痛右上牙齦迄耳根緊掣右鼻亦窒一醫用大黃滑石失之沉降一醫用柴胡升麻失之升提豫謂火鬱生風宜清涼發散用辛以散風苦以降火參氣味主治內用羚羊角山梔甘菊炒連翹天麻煨桔梗丹皮薄荷鉤藤青荷蒂外用細辛白芷羌活川芎當歸蘇葉煎湯熏洗日數次汗泄鼻通緊痛頓減後於內服原方去連翹加知母為其便燥數服而平此症多由少陽風火鬱遏所致其脈或左弦右沉至陽升巔頂兩寸必較浮大此其驗也耳症論治足少陰腎竅於耳腎氣充則耳聽聰故經言精脫者耳聾也又言肝病氣逆則頭痛耳聾以膽附於肝而膽脈上貫耳中也精脫失聰治在腎氣逆閉竅治在膽凡耳聾以及耳鳴治法悉准乎此第就中條析之有因勞力傷氣者補中湯加鹽水炒黃柏知母茯苓菖蒲有因房勞傷腎者滋陰地黃湯益腎散加鹽炒知柏有因陰虛火動者磁石六味丸加減有因病後虛鳴者四物湯加鹽炒知柏腎氣丸加磁石龜板有因心腎虧肝陽逆虛風上旋蒙竅者用填陰鎮逆佐以酸味入陰咸以和陽如山萸地黃磁石龜板天冬麥冬白芍五味牛膝秋石有臟氣逆為厥聾者流氣散當歸龍薈丸有風入絡為風聾者必兼頭痛防風通聖散有因怒氣壅者流氣散清神散有因驚火鬱者清膽湯有氣閉猝聾者芎芷散有年久耳聾者勝金透關散有小兒耳聾者通鳴散有腎經熱右耳重聽兼苦鳴者地黃湯有肝膽火升常聞蟬鳴者龍膽瀉肝湯清膽湯有因痰火升而鳴者加減龍薈丸總之由痰火者其鳴甚由腎虛者其鳴微又有耳中津液結塊名耳聤梔子清肝湯有風溫上郁耳聤右脹者馬勃散有左耳聤痛挾暑風上郁者須辛涼輕劑菊葉苦丁茶山梔滑石連翹淡竹葉有因暑邪閉竅者鮮荷葉湯有耳聤脹少陽火鬱羚羊角湯耳聤流膿黃柏面或甲片麝末研吹小兒胎風耳膿魚牙散吹耳忽大痛如蟲蠕動蛇蛻燒存性鵝管吹寒熱耳大痛者疔也以疔治之內外紅腫痛者耳癰也活命飲加升麻桔梗耳菌耳痔不寒熱不作膿黃連消毒飲活命飲皆足少陰手少陽腎與三焦風熱上壅致之此耳症大概也耳症脈候尺脈浮而盛為風洪而實為熱細而澀為虛兩尺數為陰火上衝附方補氣補中湯見一卷中風房勞滋陰地黃湯六味地黃加歸芍芎菖蒲遠志知母黃柏傷腎益腎散磁石巴戟沉香菖蒲川椒各研末二錢用豬腰子一個切開和蔥白食鹽紙包煨空心酒下陰虛磁石六味丸六味地黃加磁石病後四物湯地芍歸芎病虛腎氣丸見二卷虛損氣逆流氣散參苓術草青陳芷枳檳朴藿夏桂麥冬香附丁香木香木瓜木通腹皮草果蓬朮菖蒲蘇葉氣逆當歸龍薈丸見一卷火風聾防風通聖散見五卷癘風怒氣清神散羌防荊芎菊草殭蠶木通木香菖蒲火鬱清膽湯青蒿菊葉薄荷連翹苦丁茶荷葉氣閉芎芷散川芎錢半芷辛朴夏陳蘇桂草蒼朮木通各七分姜三片蔥白二莖久聾勝金透關散鼠膽川烏細辛膽礬麝香小兒通嗚散菖蒲遠志防風柴胡麥冬細辛杏仁磁石葶藶蔥白湯下腎虛六味湯見一卷中風肝火龍膽瀉肝湯見三卷諸氣痰火加減龍薈丸芩梔歸柴龍膽大黃青皮青黛蘆薈膽星木香麝香神麯糊丸耳聤梔子清肝湯見五卷癘風風溫馬勃散馬勃薄荷桔梗杏仁連翹通草暑邪鮮荷葉湯鮮荷葉青菊葉夏枯草芩梔苦丁茶蔓荊子連翹少陽羚羊角湯羚羊角薄荷丹皮連翹牛蒡桑葉耳膿魚牙散黃魚齒煅研和冰片麝香末吹之耳癰仙方活命飲見五卷鶴膝風菌痔黃連消毒飲即普濟消毒飲見一卷疫通治耳中出膿方枯礬干胭脂炙存性各一錢黃丹龍骨螵蛸各錢半乳沒各錢二分蛇蛻炙六分明雄七分麝香少許研細以棉蘸藥引入耳中耳脈案侄腎開竅於耳膽脈亦絡於耳夜讀神勞素有遺泄弱冠內真陰未充虛陽易於升動故氣閉清竅若聞鳴響宜用輕劑清少陽膽火之郁鮮桑葉丹皮梔皮連翹甘菊炒食後泡湯服久之一日耳中忽清亮如涼風捲霧豁然朗徹矣王七旬耳猝刺痛伏枕不減右尺沉按有力凡來勢驟者莫如火老人真陰涸故相火易炎權用鎮攝法靈磁石一錢黃柏酒炒五分山梔錢半熟地三錢二劑效目症論治經云五臟六腑之精氣上注於目而為之睛睛之窠為眼骨之精為瞳子筋之精為黑眼血之精為白眼肉之精為約束裹擷故肝屬木為黑睛曰風輪心屬火為二眥曰血輪脾屬土為上下胞曰肉輪肺屬金為白仁曰氣輪腎屬水為瞳神曰水輪此五輪也膽之府為山廓大腸之府為天廓膀胱之府為澤廓肝之府為風廓腎之府為水廓命門之府為火廓脾胃之府為地廓小腸之府為雷廓此八廓也八廓有名無位或蘊積風熱或鬱結七情之氣各隨五臟所屬而見風則散之熱則清之氣結則調之瞳胞自癢清淚赤痛是謂風眼洗肝散烏輪突起胞硬紅腫是謂熱眼黃連湯瀉青丸眼昏而淚胞腫而軟酸澀微赤怒則目疼是謂氣眼宜石決明草決明楮實蟬蛻香附木賊川芎甘草等子和云目不因火則不病氣輪赤肺火也肉輪赤脾火也水風輪翳遮肝腎火也赤脈貫目火自甚也治目者專主治火一句可了東垣云目得血而能視五臟六腑之精皆稟受於脾治目者宜理脾胃養血安神為主二者皆有見地不可執一也目痛目痛有二一目眥白眼痛一目珠黑眼痛眥白屬陽晝痛點苦寒藥則效珠黑屬陰夜痛點苦寒藥反劇治目珠夜痛夏枯草散風熱痛瀉青丸洗肝散天行赤熱怕熱羞明涕淚交流酒煎散大黃當歸散暴風客熱白仁壅起包小烏睛疼痛難開瀉肺湯赤腫痛甚瀉肺湯加黃連目赤痛而頭目浮腫普濟消毒飲怕熱羞明頭目腫痛選奇湯珠疼如針刺心經實火洗心散熱結膀胱小便不通五苓散雷頭風目痛便祕清震湯陽邪風症眉稜骨痛兼火者選奇湯還睛丸陰邪風症腦後枕骨疼三因芎辛湯巔頂風症頂骨內痛連及目珠脹急瘀赤外症之惡候也若昏眇則內症成矣外症用羌活勝風湯內症用沖和養胃湯目赤戴復庵云眼赤皆血壅肝經所致屬表者羌活勝風湯屬裡者瀉肝散赤久生翳膜者春雪膏蕤仁膏並用碧雲散吹鼻凡赤而腫痛當散濕熱赤而干痛當散火毒赤而多淚當散風邪赤而不痛當利小便其或血灌瞳神大黃當歸散赤脈貫睛凡外障有此頗為難治洗心散導赤散赤絲亂脈點以石燕丹服用大黃當歸散酒煎散目腫腫有胞腫珠腫不同胞腫多濕珠腫多火暴風客邪胞腫如杯洗肝散龍膽飲五輪壅起目脹不能轉若鶻之睛酒煎散風毒濕熱瘀血灌睛胞與珠脹出如拳石膏散加羌辛芎芍薄荷若珠爛則無及矣至於氣輪平水輪亦明惟風輪泛起或半邊泛起服以涼膈散點以石燕丹若水輪高而綻起如螺為肝熱甚點以石燕丹春雪膏內服雙解散或六味丸加知柏神珠自脹麻木淚痛因五臟毒風所蘊大黃當歸散目癢風熱四生散血虛四物湯加羌防蒺藜黃耆大凡有病之目癢一番則重一番而病源非一微癢則屬虛火治宜姜粉枯礬硼砂津唾調如米大時將一丸納大眥及鹽湯蒸洗或用珍珠膏點之外障屬風熱上壅上下胞胬肉菩蕾磨蕩其睛久之生翳宜消風散熱外用點藥退之或如雲霧如絲縷如稱星在睛外遮暗皆涼藥過多脾胃受傷生氣不能上升所致自內眥而出者羌活勝風湯加蔓荊自鋭眥而入者上湯加膽草藁本自上而下者上湯加黃連倍柴胡自下而上者上湯加木通搐鼻以碧雲散點藥皆用春雪膏蕤仁膏或以地栗粉和人乳點之如去老翳則以石燕丹春雪膏熊膽膏選用張石頑曰外障內治之藥雖多咸以神消散皂角丸為主外治之藥不一莫如石燕丹為最血翳包睛破血藥兼硝黃下之或紅翳如輕霞映日之狀治宜去風散血若黃膜上衝服以神消散點以石燕丹黃膜下垂遮滿瞳神蟬花散加石膏膽草大黃點以石燕丹赤膜下垂神消散去二蛻加皂莢石決明點絳雪膏凝脂翳在風輪上急用神消散皂莢丸花翳白陷龍膽飲破壞風輪神膏綻出凸如蟹睛防風瀉肝散斑脂翳色白而帶青黑內服神消散外點石燕丹有翳從上而下貫及瞳神狀如懸膽服以石膏散點以石燕丹烏珠上白顆如星蟬花散去蒼朮加蒺藜穀精並用碧雲散吹鼻烏珠上細顆或白或黃或聚或散或頓起或漸生多由痰火服羚羊角散或補腎丸胬肉起於大眥漸侵風輪掩過瞳神宜和血清火點以石燕丹大眥起紅肉如雞冠一塊害及氣輪宜三黃丸加芒硝點以絳雪膏此治外障法也內障屬虛挾氣鬱外似好眼而不能照物不痛不癢惟瞳神裡面有隱隱青白者皆臟腑中邪乘虛入而為翳也青風障內有氣色如晴山籠淡煙之狀急宜治之免變緑色羚羊角湯緑風障瞳神濁而不清久則變為黃風方同上黑風障與緑風相似但時時黑花起先與去風後用補腎磁石丸黃風銀風障不治絲風障瞳神內隱隱有一絲橫經宜六味丸加細辛蒺藜偃月障如新月復垂先與三因芎辛湯後用補腎丸仰月障瞳神下半邊有白氣一灣如新月仰從下而上補腎丸銀障瞳神白色如銀初服羚羊補肝散次服補腎丸金障治同上緑映瞳神瞳神內隱隱緑色先服黃連羊肝丸後服補腎磁石丸其自視如蠅飛花墮旌斾飄揚或黃或白或青或黑黃白者痰火傷肺皂莢丸青黑者宜補腎補腎磁石丸瞳神散大六味丸加五味子石決明或補腎磁石丸瞳神緊小先服黃連羊肝丸後服六味丸加二冬或用滋腎丸瞳神欹側六味丸加蒺藜當歸暴盲經云氣脫者目不明急用大劑獨參膏雀盲蛤粉丸煮肝散至於膏傷珠陷神水將枯並宜大補腎精不可寒涼又有目珠上下轉運如轆轤甚則瞳神反背補中益氣湯加羌活此治內障法也雜症能遠視不能近視陰氣不足也治在心腎加減地芝丸或六味丸能近視不能遠視陽氣不足也治在膽腎加味定志丸或八味丸倒睫拳毛由目緊皮縮所致久則赤爛神水不清以三稜針刺目眶瀉其濕熱後服防風飲子搐鼻以碧雲散更以木鱉子一枚為末左塞右右塞左一夜即直睥翻黏瞼血壅於內皮急吊於外宜鐮剔開導法風沿爛眼年久不愈而多癢者服柴胡飲子點蕤仁膏若迎風赤爛川芎茶調散洗肝散因風流淚菊花散其實熱生瘡宜瀉心火祛風熱椒瘡生於睥內紅粒如椒而堅硬者是也宜祛風熱粟瘡亦生睥內色黃而軟如粟宜退濕熱五疳症木疳生於風輪青碧色實者瀉青丸虛者補腎丸火疳生於睥眥及氣輪初起如椒瘡三黃湯導赤散土疳俗呼偷針眼瀉黃散金疳生於睥內與玉粒相似失治則變漏瀉肺湯水疳生睥眥及氣輪狀如黑豆若在風輪目必破損頭風人多有此清空膏至於瘡久成大眥漏金花丸加羌活蠍尾小眥漏導赤散加透風清熱藥正漏生風輪上流膿如痰急宜瀉肝偏漏生氣輪上流出白水急宜瀉肺更有精神亂而妄見視定反動視正反邪生暈變色皆陰精虧也駐景丸益氣聰明湯或點百草膏又或目為物傷積血青紫撞破白仁黃仁宜酒煎散漸生翳障犀角地黃湯加大黃當歸飛絲入目宜頭垢點之上論根據石頑醫通與其大略如此用藥例表藥連翹薄荷黃柏膽草蔓荊細辛厚朴桑皮前胡甘草以上各味為君紅加赤芍丹皮散血加紅花桃仁當歸尾血熱頭痛加鬱金黃連黃芩地骨有風加防風羌活荊芥有毒加升麻花粉有腫加朴硝大黃有淚加木賊膽草蒼朮有癢加蟬蛻蒺藜凡虛弱年老人宜里不宜表里藥熟地防風茯苓薄荷厚朴枳殼以上各味為君虛紅加歸尾烏梅川芎丹皮風加防己白芷腫加荊芥車前元明粉淚加青鹽夏枯草香附心經黃連山梔知母黃芩柴胡連翹薄荷麥冬羚羊款冬菊花牛蒡肝經白芍黃柏膽草款冬青葙子草決明夏枯草細辛石斛楮實脾經石膏元參朴硝厚朴黃柏茯苓地膚子廣皮前胡肺經羚羊角桑皮桔梗五味人參花粉枳殼貝母天冬百部麻黃山梔檳榔葶藶腎經枸杞巴戟牛膝地黃菟絲子當歸磁石白芍青鹽知母覆盆子蓯蓉黃耆川椒茯苓黃柏元參去翳青葙子木賊蒺藜密蒙花夜明砂石決明穀精草草決明犀角人參朴硝瞿麥蟬蛻止淚夏枯草蔓荊香附甘菊膽草白附子皮硝青鹽去風防風羌活薄荷獨活升麻甘菊防己藁本元參細辛白芷蟬蛻退腫大黃朴硝白芍赤芍楮實鬱金元明粉秦皮枳殼甘菊散血歸尾蘇木赤芍紫草茺蔚子生地青皮烏梅苦參牛膝延胡蒺藜熟地當歸治盲夜明砂石決明密蒙花膽草地黃蟬蛻磁石石斛去膜蒺藜銅緑明目青葙枸杞菟絲子石決明草決明夜明砂望月砂甘菊茺蔚子羚羊角元明粉槐角退熱黃連黃芩黃柏梔子連翹赤芍柴胡元參石膏甘草犀角硃砂膽草大黃朴硝鬱金元明粉止痛乳香沒藥附方風眼洗肝散薄荷當歸羌活防風山梔甘草各一兩酒製大黃二兩川芎八錢每服三錢日三服熱眼黃連湯黃連甘草熱痛瀉青丸膽草山梔大黃川芎當歸羌活防風蜜丸珠痛夏枯草散夏枯草制香附甘草茶調服或痛久血傷加當歸白芍生地黃耆赤翳酒煎散漢防己防風炙草荊芥當歸赤芍牛蒡子甘菊加酒煎壅腫大黃當歸散酒製大黃酒炒黃芩各一錢紅花二錢蘇木當歸酒炒黑山梔木賊各五錢外障瀉肺湯羌活元參黃芩地骨桑皮大黃芒硝甘草各八分大頭普濟消毒飲見一卷疫脹痛選奇湯見五卷頭風積熱洗心散麻黃當歸大黃白朮芍藥荊芥甘草薄荷姜便閉五苓散見一卷溫雷頭清震湯見五卷頭風風疼還睛丸生白朮菟絲子蒺藜木賊羌活青葙子密蒙花防風炙草等分蜜丸陰風三因芎辛湯附子川烏南星乾薑細辛川芎各一錢炙草五分姜七片茶一攝外症羌活勝風湯羌活生白朮各一錢川芎桔梗枳殼荊芥柴胡前胡黃芩各八分白芷六分防風五分細辛二分薄荷甘草各四分水煎食後服內症沖和養胃湯