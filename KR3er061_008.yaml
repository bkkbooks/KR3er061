緊為陰毒發汗後脈弦遲身痛為氣血不和一身關節盡痛而脈沉弦為中濕肢體重痛微腫汗出惡風關節不利不可轉側脈緩為風濕遍身痛脈弦小或滑大為氣血虛損附方傷寒麻黃湯麻桂杏草傷寒羌活湯見五卷破傷風傷寒桂枝加人參湯桂枝芍藥甘草生薑大棗人參中暑清暑益氣湯見一卷暑中濕除濕湯見一卷中風霍亂五苓散見一卷溫陰毒升麻鱉甲湯升麻鱉甲當歸甘草川椒雄黃寒濕甘草附子湯草附芍藥風濕除濕蠲痹湯見五卷痹濕熱當歸拈痛湯見一卷濕內傷補中益氣湯見一卷中風肝火加味逍遙散見一卷火走注三痹湯見五卷痹泄濕防己黃耆湯見一卷濕
