辛散溫邪上冒痛連巔頂玉女煎少陽火鬱結核齦痛羚羊角山梔丹皮元參金銀花連翹知母痰火注絡攻痛二陳湯加細辛枳殼瘀血攻齦痛如針刺加減甘露飲以醋煎五靈脂含漱齒齦有孔蟲蝕齲痛一笑散定痛散噙漱齦腮俱痛連頭面腫者實火也升麻石膏湯齒齦腫痛頭面不腫者虛火也滋陰抑火湯齒齦黑爛由腎虛者安腎丸胃火上攻齒縫出血者清胃散齒齦腐爛血出不止者犀角地黃湯摻人中白散牙宣出血絲瓜藤燒灰搽效牙挺出一二分常咋生地黃炒牙日長出妨食名髓溢白朮煎湯效牙癰由陽明毒熱先刺出血後服清胃散骨槽風名穿腮毒生耳下及項由小核漸大如胡桃齒齦腫痛牙關緊急用鵝翎探吐風痰內服黃連解毒湯仙方活命飲加柴胡桔梗元參黃芩忌刀針點藥若腎元虛牙齦宣露動搖宜大補六味丸還少丹又小兒牙疳口瘡其色通白及為風疳蝕透殭蠶炒黃去毛研末蜜調服效齒齦突出胬肉生地汁一杯皂角數片炙熱淬汁內再炙再淬曬研服效齒齘乃睡中上下齒相摩有聲由胃熱也齒齼由食酸也嚼胡桃肉良又齒齦或上齶生多骨疽腫硬腐脫屬腎虛腎主骨也補中湯腎氣丸多服其骨自出骨脫後仍服補劑若生他處依法治之此皆齒所生病也舌病多屬心木舌由心經壅熱舌腫大塞口不能轉掉不急治殺人黃連湯清熱如聖散琥珀犀角膏外以針刺令血出則腫消再敷藥龍腦破毒散又硼砂末以生薑片蘸揩效重舌亦由心火太盛舌根下生形如小舌口不能聲飲食不入急瀉心火青黛散摻之內服黃連湯外以針刺出惡血以竹瀝調黃柏末塗搽舌菌生舌上如菌狀色紅紫多因氣鬱所致舌症主方摻青黛散舌墊舌下腫起核舌墊方舌出不收片腦末摻舌上應手而縮産婦舌出不收硃砂敷舌上舌腫硬血出如湧泉蒲黃散不硬但腫痛流血涼血清脾飲犀角地黃湯舌腫滿口蒲黃散舌猝腫滿口如豬脬不治殺人醋調釜底墨塗舌下脫則更敷即消舌卷囊縮為肝絶死舌生苔由邪氣傳裡津液結搏邪在表舌無苔邪初傳裡胸中之寒與丹田熱火相激則苔生而滑逮寒變為熱則舌苔不滑而澀以熱耗津液滑者齒舌症脈候尺脈洪大而虛主齒動疏豁右關洪數主木舌重舌附方通治齒症主方元參丹皮知母白芍甘草地骨皮山梔黃柏車前子熱甚加煅石膏為君炒黑升麻為佐有風加荊芥虛加杞子熟地去山梔穿腮毒用消腫解毒之品加紫花地丁甘菊小便不利煎劑內加六一散甚效風熱犀角升麻湯犀角三錢升麻錢半羌防各二錢二分白芷黃芩白附子各六分炙草四分風冷溫風散歸芎辛芷蓽茇藁本蜂房各一錢煎服含漱開笑散白芷細辛良薑蓽茇川椒香附蜂房等分為末水煎含漱或擦之積熱涼膈散見一卷中風寒痛羌活附子湯羌防升芷耆草麻黃蒼朮生附子殭蠶黃柏有嗽加佛耳草寒痛細辛散荊芥細辛白芷川椒蓽茇草烏皂角為末擦之溫邪玉女煎見一卷溫痰火二陳湯見一卷中風瘀血加減甘露飲見本卷口鼻蟲痛一笑散川椒末巴豆一粒研成膏飯丸棉裹安蛀孔蟲痛定痛散辛芷椒姜歸地翹連桔草烏梅苦參漱口後咽下實火升麻石膏湯荊防歸芍翹桔芩草升麻石膏薄荷燈心熱甚加大黃虛火滋陰抑火湯歸地荊防丹草知柏蒺藜燈心腎虛安腎丸見五卷痹胃火清胃散或作湯見本卷口鼻腐爛犀角地黃湯見一卷溫吹摻人中白散人中白兒茶黃柏薄荷青黛冰片吹走馬疳出涎口外骨槽黃連解毒湯見一卷溫風痛仙方活命飲見五卷鶴膝風腎虛六味丸見一卷中風腎虛還少丹見一卷中風補中補中湯見一卷中風多骨腎氣丸見二卷虛損心熱黃連湯連梔歸芍地麥草犀角薄荷水煎木舌清熱如聖散翹連蒡梔柴荊桔草花粉薄荷燈心熱壅琥珀犀角膏人參棗仁茯神各二錢犀角琥珀辰砂各一錢冰片一分蜜丸麥冬湯下木舌龍腦破毒散盆硝四錢蒲黃五錢馬勃三錢殭蠶甘草青黛各八錢麝香龍腦各一錢重舌青黛散連柏牙硝硃砂雄黃牛黃硼砂冰片研摻舌菌舌症主方連梔地芍丹麥冬翹草犀角木通燈心兼口唇加石膏郁痰加貝母便祕加元明粉舌墊舌墊方荊防辛芷羌獨陳香附燈心出血蒲黃散螵蛸炒蒲黃研摻流血涼血清脾飲歸地芩芍防翹草薄荷石菖蒲津傷炙甘草湯見一卷中風齒舌脈案王氏風熱牙痛用辛涼解散荊芥薄荷桔梗山梔防風赤芍甘草二服愈房兄胃火牙痛用石膏煅研開水沖服隨手而效堂妹牙癰由情志抑鬱致患左下牙齦腫癢日久撐出多骨外科用推車散不效腐孔血水淋漓近又寒熱食減神疲宜扶正為要用潞參茯苓白朮當歸熟地山梔白芍俱炒六七服效劉舌根腫自用黃連瀉心兩旬後寸脈猶浮大舌邊紫泡咽腫妨食耳痛乃上焦火風阻絡宜辛涼輕劑薄荷連翹桔梗山梔鉤藤燈心苦丁茶葉菊葉竹葉心服愈喉症論治爛喉痧附喉以納氣而通於天咽以納食而通於地會厭管乎其上以司開闔惟其為心肺肝腎呼吸之門飲食聲音吐納之道關係死生為害速矣經云一陰手少陰心一陽手少陽三焦結謂之喉痹以君相二火經脈並系咽喉熱結則腫痹痹者閉也閉則痰塞以死將發先三日胸必不利一二日腫痛三四日勢定有形第三日必發寒熱或頭痛兼風寒者須疏散察其二便祕結系實火者以重劑潤下去其積熱壯實者用硝黃弱者但滋燥潤腸虛者宜蜜煎導法大便行乃可清利上焦痰熱清上丸若虛火便澀心脈數腎脈微宜滋陰降火養金湯其症喉痹為總名有纏喉風乳蛾喉癬喉癰喉菌喉閉䴂舌喉杵等症而纏喉風及傷寒喉閉症為尤險喉痹腫痛閉塞為風痰鬱火熱毒上攻之症去風痰解熱毒自愈咽喉總絡系肺胃急清此二經之熱牛蒡湯外用通隘散如惡寒寸脈小一時患者皆同為天行邪氣宜先表散其病之由來有二一者少陽司天三陽之氣民病喉痹仲景用桔梗湯依陽毒施治一者太陰濕勝火氣內郁民病喉痹又太陰在泉濕淫所勝病喉腫喉痹仲景用半夏甘桔湯依陰毒施治若不惡寒寸脈大滑實為陽盛陰虛下之愈酌用大小承氣湯其輕者可緩治喉痹散不可驟用寒涼以痰實結胸遇寒不運漸至喘塞不治也其氣急閉塞欲死者緩則殭蠶炒末薑湯下立愈或馬藺根苗搗汁和醋含漱急則用吹法硼砂膽礬末吹患處或皂角末吹鼻噴嚏亦開吐法搗皂角水灌入或新汲水磨雄黃灌入即吐或雞鵝翎蘸桐油探吐針法用砭針於腫處刺出血若口噤針不能入刺少商穴左右皆刺二分出血立愈或捽頂心頭髮一把力拔之其喉自寬又有陰虛陽浮痰結於上脈浮大重取或澀者作實症治必死加減八味丸喉痹連項腫芩連消毒飲纏喉風喉腫大連項痛喉有紅絲纏緊且麻且癢指甲青痰壅肢厥由平時多怒兩日前胸不利痰塞氣促症最急過一日夜目直視齒噤喉響燈火近口即滅此氣已離根不治治法如喉痹用金碧二丹頻吹內加牛黃效更速針法手足冷以水溫之針照海然谷四穴使血出如珠若刺少商穴出血散而不收者不治照海穴在內踝下四分軟骨陷中然谷穴在內踝前大骨下陷中皆腎經穴也乳蛾有單雙有連珠單輕雙重連珠尤重多因酒色鬱熱而生單蛾生會厭一邊一日痛二日紅腫三日有形如細白星發寒熱者凶吹藥先用碧丹五金丹一後用金丹二碧丹三內服喉症主方俟大便行自痊如至三日喉中但紅腫無細白星即是喉癰宜辨雙乳蛾生會厭左右兩邊俱有細白星藥照前用左屬心右屬肝煎藥於主方內左加黃連犀角右加赤芍柴胡雙蛾則兼用之大便祕加枳殼元明粉連珠蛾一二白星上下相連用藥照前或外用成吹藥加冰片吹之內服三黃桔梗湯喉癬為虛火上炎肺受燥熱致咽喉生紅絲如哥窯紋如秋海棠背紋乾燥而癢阻礙飲食雖不喪命不能速愈吹用碧丹噙化青靈膏內服喉症主方加土貝母須戒憂怒酒色忌鹽醬及一切動風助火之物一月可愈喉癰紅腫而痛別無形狀因過食辛辣炙爆厚味而發症屬胃大腸二經重則寒熱頭痛犀角地黃湯吹用金丹一碧丹十四五日可愈若鼻中出紅涕為毒攻腦不治喉菌因憂鬱氣滯血熱婦人多患之狀如浮萍略高面厚色紫生喉旁初起吹碧丹九金丹一後用金丹二碧丹三內服喉症主方勿間斷輕則半月重或經月亦須守戒忌口䴂舌喉癰肥人感熱性燥者多患此犀角地黃湯加減吹用金丹但須吹至舌根下兩旁時刻勿間方能速愈喉內吹用碧丹十全丹一亦須勤吹凡舌下小舌為䴂舌連喉腫痛即為喉癰不痛者非癰大約䴂舌兼喉癰而發十有六七其勢凶煎藥多加黃連山梔犀角喉閉傷寒後發為氣閉不通無形無聲難治喉項強硬目睛上視故多不治喉杵喉極痛腫甘桔射干湯外點燒鹽散此外又有咽嗌痛由陰虛火炎者喉痹飲倍荊芥元參有喉中結塊飲食不通者百靈丸重者不過二丸有懸癰喉痛生上齶有紫泡如豆大用簪腳挑破血出愈或口疳藥吹亦可風熱上搏者啓關散有懸癰垂長咽中煩悶者枯礬鹽花研細箸頭點上去涎有喉中生肉者棉裹箸頭蘸鹽揩之日數次有梅核梗塞咽中咯不出咽不下因為七情鬱結者四七湯噙化丸有喉痛因於相火用涼藥不愈者六味丸加桔梗元參知母黃柏有風火上郁咽痛頭脹項腫當用辛涼者滑石連翹杏仁桑皮西瓜翠衣近世爛喉痧最重初起憎寒壯熱咽痛渴煩先宜解表務令透達或兼清散若驟服寒涼外邪益閉內火益焰咽痛愈劇潰腐日甚矣至丹痧透發已無惡寒等症則宜寒涼泄熱不宜雜進辛散煽動風火致增腫腐必至滴水下咽痛如刀割蓋此症由感風火濕熱時邪而發治法因風熱者主清透普濟消毒飲去升麻柴胡因濕熱者主清滲甘桔湯加栝蔞通草燈心因痰火凝結者主消降消氣化痰丸去半夏加貝母淡竹茹邪達則痧透痧透則爛止利膈湯清咽太平丸選用然症有可治不可治其口氣作臭喉色淡黃或深黃者系痰火所致皆可治若爛至小舌及鼻塞目閉元氣日虛毒氣深伏色白如粉皮者皆不可治其愈後四肢痠痛難於屈伸者由火灼陰傷絡失所養宜進滋陰勿與痹症同治驗症訣尤氏曰凡喉痹屬痰喉風屬火總因火鬱而兼熱毒致生乳蛾等症治法去風豁痰解熱開鬱其症自痊若喉症初起寒戰發後身涼口不破碎又無重舌二便俱利不可誤認熱症皆由陰氣虛寒而發其痰即精神所化不宜去盡先以藥吹之使咽喉通即便服藥首劑發散和解第二宜溫補若三四日後再發寒戰或心痛骨脅肋痛半屬難治發時牙關緊急喉舌俱痛腫口碎而臭或有重舌或舌上起黃屑發後下午再發寒熱二便閉者即是熱症用石膏排毒散治之如起三四日後而寒熱者其症雖凶無害惟症未減牙關反不緊急不腫脹如無病人不治或舌腫滿口如胡桃如茄子並不治如以箸按舌則起白色去箸則生紅紫此其身內之血已死又或口有臭氣口渴氣急而多稠痰如桃膠者一頸俱紅腫者紅帶紫而青帶白神氣短少者不語者面色少神愛坐低處者喉症無痰者傷寒患連珠蛾及喉痹者小兒口疳臭爛而黑者舌下紫筋下通於腎色白而腫者皆不治附方痰熱清上丸熊膽雄黃薄荷青鹽硼砂膽礬蜜丸壓舌下化之滋陰養金湯見二卷失音肺胃牛蒡湯升麻牛蒡黃藥子元參紫背浮萍花粉桔梗甘草吹喉通隘散硼砂二分兒茶青黛滑石寒水石各一分連柏蒲黃枯礬各半分冰片二釐研吹陽毒桔梗湯桔梗甘草各三錢陰毒半夏甘桔湯夏桔草下火大小承氣湯俱見一卷溫喉閉喉痹散荊蒡桔貝草元參薄荷殭蠶前胡花粉款冬燈心散亦作飲補虛加減八味丸八味丸見一卷中風此加五味減附子喉痹芩連消毒飲即普濟消毒飲見一卷疫喉痹喉痹急方火硝五錢硼砂錢半薄黃一錢冰片兒茶各五分珍珠一分為末吹喉大吐痰涎數管即愈並治口疳牙疳牙關緊閉者通治十寶丹梅礬薄荷兒茶各一兩甘草五錢乳石三錢血竭珍珠琥珀各二錢冰片三分梅礬取大青梅切下圓蓋去核將礬研細入梅覆用圓蓋以竹釘釘好炭火煅之去梅取礬輕白如膩粉味極平酸收貯聽用此方凡喉口症皆可效喉閉金鎖匙火硝錢半硼砂五錢殭蠶一錢冰片一分雄黃二錢研吹再刺少商穴吹藥碧丹煉礬牙硝各三分百草霜硼砂各五分薄荷末三分燈草灰冰片各一分甘草二分煉礬法明礬研細傾入銀罐內小半罐入爐用浮炭火煨煬以銅箸入擾無礬塊為度即將研細鸅硝投入礬內十分之三次將細研白硼砂投入亦十分之三少傾再投生礬末逐漸投下候礬煬盡照前投硝硼少許逐漸投完待礬鋪出罐口高如饅頭而止加炭燒至礬枯乾乃用瓦片覆罐上一時取起將牛黃少許為末以水五六匙調滴礬內將罐仍入火烘乾取罐覆淨地上七日收貯煉礬須輕鬆無豎紋者佳此即名玉丹最貴多制時候愈久愈妙煅燈草灰法揀肥白燈草鋪桌上噴濕將筆套用水濕管以濕紙塞緊一頭將濕燈草捏入管內以竹箸築實再以濕紙塞口入炭火煅之煙盡為度取出置地上碗蓋之去管口紙取灰黑成團者佳煅時勿令筆套炮碎碎則不堪用不可太過過則灰白無用不可不及不及則不成灰而不可用此丹最輕煅時又難得法須平日多制待用可也此即名元丹取百草霜燒茅柴者佳須近鍋底者用若鍋心及鍋口邊者不用須刮去面上一層取中間用之著鍋者亦無用配藥法即碧丹每煉礬三分加百草霜半匙研細次入燈草灰一釐研勻如瓦灰色再入甘草末三匙薄荷末三分研再入冰片半分研勻入瓷瓶塞口勿令出氣此丹須當時配合如過五日即不堪用若遇陰雨一日即無效如欲出痰加牙皂末少許吹之喉癰及單乳蛾輕症單用碧丹又名青藥即效若遇重症須兼黃藥即金丹凡初起令病者低頭開口溜出痰涎初起用青藥九分配黃藥一分吹過五管次用青八黃二再次用青七黃三如症重青黃藥兌半用至吹五次痰涎必不壅然後用青三黃六若症重甚用黃八青二尤效青藥消風痰解熱毒性尚緩不及黃藥消腫除熱開喉痹出痰涎為效然初起黃藥不可多用因其直走入內與病不入也吹藥金丹即黃藥蒲黃二分硝九分硼砂冰片薄荷葉末各一分制硝法馬牙硝長白厚大者溫湯蘸過棉紙挹干仍用紙包好放灶上明管洞內自乾白如霜配藥法即金丹每牙硝一錢蒲黃生用四分研細次下殭蠶炙末一分牙皂末一分半共研極細如淡鵝黃色加冰片一分研勻此藥可留久惟冰片臨時加用可耳金丹能消腫出痰若遇牙叉䴂舌穿牙疔專用此治之如咽喉症則兼用青藥看症輕重用之症重者再加牛黃如喉痹及纏喉風加殭蠶牙皂餘隻用牙硝硼砂薄荷蒲黃冰片即可喉症即重三日前未成膿藥能消散五日膿成穿破必爛成窠爛處須用口疳藥多龍骨珍珠吹喉口疳藥薄荷葉研細三分兒茶末二分半制黃柏末一釐龍骨末二釐白芷末如腫痛用三四釐如不腫痛用二釐半生甘草末用五釐珍珠末五釐冰片三釐研勻瓷瓶封固凡遇口碎及各種口疳皆效若初起腫而熱甚者多加薄荷冰片取其辛涼發散也若患不腫熱甚而痛則以長肉藥為主吹喉長肉藥即前口疳藥多用兒茶末龍骨末配成紫色此方專治喉症口碎者若用此治走馬牙疳穿牙毒小兒胎毒口疳則本方加牛黃倍珍珠如黑爛者不治至痧痘後口疳非此不除則去黃柏龍骨加牛黃五釐倍珍珠末六釐通治喉症煎藥主方牛蒡子炒研前胡銀花連翹山梔甘草枯芩炒黑元參桔梗花粉薄荷燈心泉水煎如發寒熱加柴胡頭痛加石膏胸悶加枳殼鬱熱而發加赤芍貝母口渴加麥冬癬菌蜜調藥薄荷葉末為君煉礬為臣燈草灰川貝母為佐百草霜冰片甘草末為使先將煉礬百草霜研和入燈草灰再研後入薄荷貝母冰片研勻成青灰色用白蜜調此方專治喉癬喉菌時刻噙咽內服喉症煎藥主方此方一名青靈膏連珠蛾成吹藥硼砂一分兒茶二分龍骨五分青黛一分本藥三分追風二分冰片三釐再加膽礬麝香附追風散方牛膝川烏草烏冰片麝香青黛以上諸方皆尤氏祕傳方法名為尤氏喉科世少傳本識者珍之連珠三黃桔梗湯芩連柏梔蒡芍桔草薄荷元參水煎食後服喉癰犀角地黃湯見一卷溫喉杵甘桔射干湯桔梗二錢射干山豆根荊防蒡翹元參各一錢二分甘草五分加竹葉十四片喉杵燒鹽散取橡斗大者實鹽滿殼燒存性以碗覆地入麝香少許研細點之結塊百靈丸百草霜蜜丸芡實大水化服風熱啓關散牛蒡子生甘草水煎梅核四七湯陳苓夏朴檳蘇青枳蔻曲砂仁益智姜梅核噙化丸冰片射干鍾乳粉升麻牙硝黃耆大黃甘草生地蜜丸相火六味丸見一卷中風風熱普濟消毒飲見一卷疫濕熱甘桔湯見本卷頭痛痰火清氣化痰丸星夏陳枳杏蔞芩苓薑汁糊丸痧爛利膈湯銀花荊防芩桔連梔翹蒡薄荷元參大黃朴硝粉草痧爛清咽太平丸芎防桔草薄荷犀角柿霜蜜丸喉痹玉液上清丸薄荷十四兩柿霜五兩桔梗四兩五錢甘草二兩五錢川芎二兩八錢百藥煎五錢防風一兩六錢砂仁四錢五分青黛三錢冰片元明粉白硼砂各二錢研細蜜丸芡實大每服一丸噙化不拘時候專治風痰上壅頭目不清咽喉腫痛口舌生瘡服之生津液化痰涎昔宋神宗患喉痹服此藥一丸立愈牙疳犀角丸犀角粉草朴硝各二錢桔梗一兩赤茯生地連翹牛蒡子元參各五錢青黛一錢蜜丸龍眼大每一丸薄荷湯下專治小兒走馬牙疳吹喉三仙散膽礬六分半生半炒廣木香三分熊膽三分共研極細用番木鱉一個磨碎和勻吹在患處治喉風口噤死在須臾以箸開口吹入即愈敷藥牙疳方婦人溺桶中白垢火煅一錢銅緑三分麝香一分五釐各研和勻敷上立愈喉脈案房侄舌下地丁左畔略腫誦讀勞倦則發渴頰紅脘悶痰稠呼吸不利脈沉少力或進寒涼藥腹痛食減此素廩陰氣不足神勞則五志火動脾氣困倦故痰氣壅而成痹也經言一陰一陽結謂之喉痹一陰少陰君火也一陽少陽相火也二經之脈夾咽循喉火動痰升結而不散其源總由腎陰素虛水不制火使然用六味丸熟地砂仁末拌蒸丹皮酒炒加參麥貝膝藕粉蜜丸服而平尹氏久患梅核氣塞如梗妨咽不利非火非痰乃氣鬱為患用鬱金木香貝母桔梗陳皮栝蔞皮甘草數服效胸痹論治胸痹胸中陽微不運久則陰乘陽位而為痹結也其症胸滿喘息短氣不利痛引心背由胸中陽氣不舒濁陰得以上逆而阻其升降甚則氣結咳唾胸痛徹背夫諸陽受氣於胸中必胸次空曠而後清氣轉運布息展舒胸痹之脈陽微陰弦陽微知在上焦陰弦則為心痛此金匱千金均以通陽主治也金匱云胸痹喘息咳唾胸背痛短氣寸口脈沉遲關上小緊數栝蔞薤白白酒湯胸痹不得臥心痛徹背栝蔞薤白半夏湯胸痹氣急胸滿脅下逆搶心枳實薤白桂枝湯胸痹氣塞短氣茯苓杏甘湯橘枳生薑湯胸痹緩急者薏苡附子散心中痞諸逆心懸痛桂枝姜枳湯心痛徹背背痛徹心烏頭赤石脂丸千金治胸痹達背痛細辛散胸中逆氣心痛徹背少氣不食前胡湯胸中滿噎塞喉燥唾沫橘枳生薑湯不應治中湯胸背閉滿上氣喘急下氣湯胸背疼痛尉背散大約陽微者用甘溫苓桂朮甘湯陰凝者用溫通理中湯飲逆者用辛泄吳茱萸湯痞阻者用辛滑栝蔞薤白半夏湯喘逆者用苦降桂枝加朴杏湯痹久者兼通絡旋覆花湯只在旋轉上焦清陽疏利膈間痰氣不與胸痞結胸等症混治則得之矣喻嘉言曰胸中陽氣如離照當空曠然無外設地氣一上則窒塞有加故知胸痹者陽氣不用陰氣上逆之候也然有微甚不同微者但通其不足之陽於上焦甚者必驅其厥逆之陰於下焦仲景通胸中之陽以薤白白酒或栝蔞半夏桂枝枳實厚朴乾薑白朮人參甘草茯苓杏仁橘皮選用對症三四味即成一方不但苦寒盡屏即清涼不入蓋以陽通陽陰藥不得預也甚者用附子烏頭川椒大辛熱以驅下焦之陰而復上焦之陽補天浴日獨出手眼世醫不知胸痹為何病習用豆蔻木香訶子三稜神麯麥芽等藥坐耗其胸中之陽其識見亦相懸哉胸痹脈候脈陽微陰弦即胸痹痛金匱寸口脈沉遲關上小緊數陽衰胃以上陰寒結聚附方陽微栝蔞薤白白酒湯栝蔞薤白白酒不臥栝蔞薤白半夏湯蔞薤酒半夏飲邪枳實薤白桂枝湯枳薤桂蔞朴虛寒人參湯參術姜草利肺茯苓杏甘湯苓杏草疏胃橘枳生薑湯橘枳姜復陽薏苡附子散薏仁附子痞逆桂枝姜枳湯桂姜枳溫填烏頭赤石脂丸赤石脂烏頭附子乾薑川椒溫散細辛散細辛甘草各六錢枳姜蔞地術各一兩桂心茯苓各兩半酒服下氣前胡湯前胡夏芍草各二錢參歸芩各一錢姜三片棗三枚竹葉一握理氣治中湯見三卷飲食下氣下氣湯杏仁檳榔童便煎外治尉背散烏頭桂附羌辛芎椒為末綿裹烘令暖陽虛苓桂白朮甘草湯苓桂術草陰凝理中湯見一卷中風飲逆吳茱萸湯見三卷嘔吐喘逆桂枝加朴杏湯桂芍草朴杏姜棗絡瘀旋覆花湯旋覆蔥管新絳胸痹脈案趙有年胸痹食阻由舉重傷氣所致脈小弱是陽結欲閉之候述數月前膈痛飲糜粥輒阻自謂膈噎已成今作胸痹治通其脘中欲閉之陽參金匱法栝蔞薤白桔梗杏仁橘白丁香用辛滑溫通胸脘俱爽食入不拒竟進粥飯然病初愈恣意粉團乾飯非高年祝噎所宜馬病後脈弦胸痛金不制木當節勞戒怒栝蔞橘白白芍茯神杏仁炙草煨姜二服愈糜氏中年脘痞食減不飢吐沫漸成胸痹乃上焦氣阻腑失通降治者以為噎膈專用朮附蔻朴燥脾破氣劫津漸致陰傷液涸大便不通下焦壅則上焦益加脹滿恐延關格重症矣宜辛通苦降法蔞仁杏仁郁李仁貝母枳殼蘇梗鬱金汁薤白汁五七服胸膈舒大便潤而食進金氏諸陽受氣於胸中喻氏謂胸中陽氣所經如離照當空曠然無外設地氣一上則晦塞有加今脘閉食脹清陽不旋濁氣失降午後足腫陽益下陷矣用升清降濁桔梗半夏橘白升麻砂仁殼枳殼茯苓加薑棗煎服愈趙脈緩胸痹陽氣不舒用苓桂朮甘湯加砂仁殼數服效蔣胸右偏痛呼號欲絶日夕不能臥醫初疑胃氣疏香燥破氣方不應改用乳香當歸延胡靈脂由氣分兼入血分乃益痛更謂心痛徹背豫問曾嘔吐否曰未也豫謂痛不在心胃乃胸痹耳症由胸中陽微濁陰上干仲景治胸痹喘息短氣用栝蔞薤白白酒湯通陽豁痰復加半夏正合斯症仍加橘紅一啜遂定心痛論治心疝心癰附心當歧骨陷處居胸膈下胃脘上心痛與胸脘痛自別也心為君主義不受邪故心痛多屬心包絡病若真心痛經言旦發夕死夕發旦死由寒邪攻觸猝大痛無聲面青氣冷手足青至節急用麻黃桂附乾薑之屬溫散其寒亦死中求活也若五臟之邪干心包致痛通用必應散經云邪在心則心痛喜悲時眩僕此包絡受邪在腑不在臟也經云手少陰之脈動則病嗌乾心痛渴而欲飲此言支脈受邪在絡不在經也經云厥心痛與背相控如從後觸其心傴僂者腎心痛也神保丸腹脹胸滿胃脘當心痛上支兩脅胃心痛也草豆蔻丸清熱解鬱湯如以錐針刺其心心痛甚者脾心痛也訶子散復元通氣散色蒼蒼如死狀終日不得太息肝心痛也金鈴子散加紫降香臥若徒居心痛間動作痛益甚色不變肺心痛也七氣湯加枳殼鬱金腎厥心痛由陰火上衝胃厥心痛由胃中停滯脾厥心痛由中焦寒逆肝厥心痛由火鬱血分肺厥心痛由上焦氣分不清經之論厥心痛以諸痛皆肝腎氣逆上攻致之但分寒熱兩種寒厥心痛者身冷汗出手足逆便利不渴心痛脈沉細朮附湯熱厥心痛者身熱足厥煩躁心痛脈洪大金鈴子散清郁湯凡暴痛非熱久痛非寒宜審經又云陽明有餘上歸於心滑則病心疝生韭汁和五苓散小茴香煎湯下又心疝宜疝氣門求治心痛引少腹滿上下無定處溲便難者取足厥陰肝心痛腹脹嗇然大便不利取足太陰脾心痛短氣不足以息取手太陰肺心痛引背不得息取足少陰腎以上皆他腑臟之邪干心而致痛須加各腑臟藥治之金匱云九痛丸治九種心痛醫通曰九種心痛乃久客之劇症即腎水乘心腳氣攻心等別名也痛久血瘀陰邪團結故用參附乾薑溫氣散邪加狼毒巴霜吳茱萸驅之使從陰竅出藥雖峻利而改湯為丸取緩攻不取急蕩也後人因分九種心痛曰飲噁心煩悶嘔水由停飲蓄注也胃苓湯甚則小胃丹曰食飽悶噫敗卵氣由生冷食物過多也青皮丸加砂枳曰寒外受寒宜溫散桂枝七氣湯內受寒宜溫利朮附湯加蔻朴枳陳寒久鬱則成熱用山梔為熱藥響導佐以生薑多用川芎開之虛寒宜溫補歸脾湯加乾薑桂心菖蒲腎寒乘心痛則心懸如飢泄痢下重五積散寒客背俞則脈血澀注於心相引痛桂枝七氣湯神效丸曰火痛不時發薑汁炒山梔少加炮薑甘草若熱鬱痛脈數口渴便祕清中湯曰氣脈沉結或弦胸中氣壅攻刺作痛沉香降氣散中氣虛按之則痛定二陳湯加炮姜不應理中湯久服破氣藥太過脈大無力六君子湯加炮姜曰血好飲熱酒血留胃口脈必澀或芤飲作厄手拈散加桔梗開提其氣虛人血瘀四物湯加桃仁穿山甲桂心降香曰悸心痛而煩發熱動悸此為虛傷辰砂妙香散加味七氣湯曰蟲面有白斑唇紅口沫能食翦紅丸因蛔動則嘔痛有休止烏梅丸妙應丸曰疰鬼疰心痛昏憒妄言或猝倒口噤由感惡也蘇合香丸此為九種心痛若心痛脈微欲絶手足逆冷者桂心三錢煎服猝心痛脈洪數者黃連三錢煎服若脈弦數木剋土也小建中湯取芍藥酸收於土中瀉木如脈沉細水侮土也理中湯取乾薑味辛於土中泄水大寒客心胸嘔逆不食氣上衝痛不可觸近金匱大建中湯寒痛綿綿不絶朮附湯加草果厚朴凡按之痛減者氣虛也參朮散按之痛甚者氣實也梔萸丸又有心癰發胸乳間一名井疽狀如豆大發如蜂窠繫心熱盛宜疏導心火涼血飲緩則不救小便澀者清心散或涼膈散去硝黃加白芷天花粉木通瞿麥大便祕者內固清心散涼膈散去硝黃加白芷花粉生地丹溪曰心胃痛須分新久若明知身受寒口食冷物而得其初當與溫散如桂枝七氣湯或溫利之如九痛丸若得之稍久則成郁郁久必生熱熱久必生火若溫散溫利即助火添邪由是方中以山梔為熱藥之響導則邪易除正易復痛易安又曰心胃痛須用劫藥痛乃止如倉猝散山梔四十九枚連皮炒大附子一個炮去皮臍共為粗末每三錢水一盞酒半盞煎七分入鹽少許服加川芎尤妙能治氣自腰腹間攣急疼痛不可屈伸痛不可忍自汗如洗手足冷而垂死者又如愈痛散五靈脂延胡索蓬朮良薑當歸等分為末每三錢醋湯調服治急心胃痛心痛脈候心脈微急為痛短而數或澀皆心痛浮大弦長者死沉細者生胃脈微滑為痰飲滑實為宿食沉緊為冷積沉澀為氣滯數為火弦澀或芤為死血忽大忽小為蟲痛甚脈必伏心痛在寸腹痛在關下痛在尺附方通治必應散延胡香附艾灰歸身砂仁生薑腎心痛神保丸全蠍七個巴霜十粒木香胡椒各二錢半辰砂為衣薑湯下胃心痛草蔻丸枳殼二個草蔻煨白朮各一兩麥芽神麯半夏各五錢乾薑青陳各二錢炒鹽五分同上清熱解鬱湯山梔錢半枳芎香附各一錢黃連蒼朮各七分陳皮薑炭炙草各五分姜三片脾心痛訶子肉湯見四卷痢同上復元通氣湯白醜二兩炙甲片茴香炒各一兩五錢陳皮延胡炙草各一兩木香五錢為末每服二錢薑湯下肝心痛金鈴子散見三卷郁肺心痛七氣湯見二卷咳嗽寒厥朮附湯術附草熱厥清郁湯陳夏苓曲連梔蒼朮香附各一錢川芎六分炮姜五分炙草三分姜三片心疝五苓散見一卷溫通治九痛丸附子三兩茱萸人參炮姜巴霜各一兩狼毒五錢蜜丸桐子大溫酒下三五丸飲痛胃苓湯見一卷中風飲痛小胃丹芫花甘遂大戟大黃黃柏以白朮煎膏和丸食痛青皮丸青皮山楂神麯麥芽草果溫散桂枝七氣湯七氣湯見二卷咳嗽此加桂芍參陳草虛寒歸脾湯見二卷勞瘵腎寒加減五積散見一卷濕血澀神效散青陳枳曲桂芍草芷木香麥芽三稜蓬朮延胡補骨脂各七分丁香畢澄茄各三分姜棗火痛清中湯連梔陳苓夏草草蔻姜氣痛沉香降氣散見三卷郁有痰二陳湯見一卷中風中虛理中湯見一卷中風補虛六君子湯見一卷中風血痛手拈散延胡醋炙五靈脂醋炒草蔻沒藥每服三錢酒下血痛四物湯見一卷中風悸痛辰砂妙香散見四卷健忘悸痛加味七氣湯七氣湯加遠志炙草各五分茯神菖蒲各錢半姜棗蟲痛翦紅丸莪朮三稜雄黃木香檳榔乾漆陳皮大黃貫仲糊丸米湯下蛔痛烏梅丸見三卷嘔吐蛔痛妙應丸見三卷積聚疰痛蘇合香丸見一卷中風和胃小建中湯見二卷衄血去黃耆寒嘔大建中湯見三卷積聚氣虛參朮湯參術姜陳草豆蔻砂仁丁香各一錢姜三片或加炒蚌粉二錢尤妙氣實梔萸丸山梔一兩半吳萸香附各二錢五分生薑湯下心癰涼血飲荊芷地麥冬芍梔翹草木通瞿麥薄荷花粉車前子各八分燈心十條竹葉二十片溺澀清心散地芍麥冬草遠志赤苓知母各一錢姜三片棗二枚加黃連尤妙便澀涼膈散見一卷中風便祕內固清心散白蔻人參硃砂赤苓雄黃緑豆朴硝甘草皂角各一錢冰片麝香各一分每服一錢心胃痛倉猝散山梔連皮炒四十九枚大附子一個炮去皮臍為末每三錢水一盞酒半盞煎七分入鹽少許服加川芎尤妙心痛愈痛散五靈脂延胡蓬朮良薑當歸等分為末每二錢醋湯調下通治心頭痛方烏梅三個元棗三個杏仁七個麝香一字搗如泥黃酒一杯煎溫服胃脘痛論治胃脘癰附胃脘當心下主吸受飲食若煩勞冷熱致氣血痰食停瘀作痛或肝氣犯胃及腎寒厥逆皆能致之症與心痛相似但胃脘痛必見胃經本病如脹滿嘔逆不食便難面浮肢倦與心痛專在包絡者自別治法須分新久初痛在經久痛入絡經主氣絡主血也初痛宜溫散以行氣久痛則血絡亦痹必辛通以和營未可概以香燥例治也其因胃陽衰而脘痛者食入不運當辛甘理陽香砂六君子湯加桂枝良薑因肝乘胃而脘痛者氣衝脅脹當辛酸制木吳萸白芍青皮木瓜厚朴延胡金橘因腎寒厥逆而脘痛者吐沫嘔涎當辛溫泄濁吳茱萸湯因煩勞傷氣而脘痛者得食稍緩當甘溫和中小建中湯因客寒犯膈而猝痛者嘔逆不食當溫中散寒大建中湯加白蔻仁積寒致痛綿綿不絶無增無減當辛熱通陽朮附湯加厚朴草蔻火鬱致痛發則連日脈必弦數當苦辛泄熱薑汁炒黃連山梔瀉火為君香附川芎陳皮枳殼開鬱為臣反佐炮姜從治為使痰積脘痛必嘔惡清中湯加海石南星香附停飲脘痛必吞酸胃苓湯左金丸食滯脘痛必噯腐香砂枳朮丸加半夏曲氣鬱脘痛必攻刺脹滿沉香降氣散傷力脘痛必瘀血停留鬱金歸尾桃仁蘇木或手拈散怒氣脘痛必厄逆胸痞半夏瀉心湯蛔動脘痛必有休止安蛔丸痛久不愈必入血絡歸鬚桃仁延胡紫降香或失笑散效若痛而肢冷脈微欲絶桂心煎服甚效凡痛有虛實按之痛止者為虛按之痛反甚者為實虛者參朮散實者梔黃丸痛甚者脈或伏用藥不宜守補參耆朮地之屬以痛則不通通則不痛故也若膈間腫痛不能進食但喜水飲或咽腫人迎盛而氣口緊者當作胃脘癰治胃脘癰由熱毒攻聚胃口而發靈樞經曰中脘穴屬胃隱隱痛者胃脘癰也聖濟總録曰胃脘癰不比肺癰之可認苟不嘔膿血未免他誤矣其症氣逆於胃脈必沉細或陽氣為風寒所遏不得上升人迎必盛人迎者胃脈也盛則熱矣診得此脈即胃脘癰之候其人必寒熱如瘧身皮甲錯咳嘔膿血若脈洪數則膿已成急宜排膿如脈遲緊乃屬血瘀急當議下否則毒氣內攻腸胃並腐如初起寒熱如瘧咳吐膿血射干湯若風熱固結唇口瞤動薏苡仁湯積熱不散清胃散芍藥湯毒成未潰內消沃雪湯未潰毒盛東垣托裡散胸乳間疼吐膿腥臭牡丹散若在膈下膿出大便排膿湯膿稀太乙膏虛者八珍湯加黃耆忍冬連翹胃經穴人迎在結喉兩旁動脈應手其脈見於左手人迎盛則熱聚胃口為癰肺癰咳膿如米粥胃癰但嘔膿以其結聚胃脘從濕化也凡舌苔經久不退色黑垢膩口甜氣穢即胃脘發癰之候用涼膈散加石斛連翹下盡宿垢再以保元湯加苓橘調理可安胃脘痛脈候弦為痛澀為痛胃脈微滑為痰飲滑實為宿食沉緊為冷積沉澀為氣滯數大為火芤弦為血忽大忽小為蟲沉小者生實大浮長者死附方陽衰香砂六君子湯六君子湯加木香砂仁肝乘枳殼煎枳殼汁五匙烏藥汁七匙白芍汁二十匙木香汁五匙燈心土一錢砂仁五分二味煎沖諸汁服之腎厥吳茱萸湯見三卷嘔吐煩勞小建中湯桂芍草姜飴棗客寒大建中湯見二卷汗積寒朮附湯見五卷痙火痰清中湯見本捲心痛飲痛胃苓湯見一卷中風肝火左金丸見一卷火食痛香砂枳朮丸見本卷頭痛氣鬱沉香降氣散見三卷郁血滯手拈散見本捲心痛痞痛半夏瀉心湯見一卷溫蛔動安蛔湯見三卷嘔吐絡痛失笑散靈脂蒲黃俱炒等分水酒煎虛痛參朮散參術草實痛梔萸丸山梔吳萸初起射干湯射干去毛山梔赤茯升麻各一線赤芍錢五分白朮五分煎去渣入地黃汁一合煎服風熱薏仁湯薏仁防己赤小豆炙草等分積熱清胃散見二卷衄血積熱芍藥湯赤芍石膏犀角麥冬木通朴硝薺苨升麻元參甘草毒成內消沃雪湯歸芍耆翹芷貝陳乳沒甘草節角刺花粉甲片銀花各五分水酒煎毒盛東垣托裡散銀花當歸各二錢大黃牡蠣花粉角刺連翹朴硝各六分赤芍黃芩各四分水酒煎膿臭牡丹散丹皮地榆薏仁黃芩各錢半赤芍桔梗升麻甘草敗醬各一錢已潰排膿湯湯或作散見二卷肺癰膿稀太乙膏地芍歸芷桂元參大黃各二兩麻油二斤熬去渣再熬下黃丹調補八珍湯見一卷中風嘔膿涼膈散見一卷中風調補保元湯見一卷火胃脘痛脈案房叔胃脘痛脈細澀服香砂六君子湯去白朮加煨薑益智痛定後遇勞復發食鹽炒蠶豆時止時痛豫謂昔人以諸豆皆閉氣而蠶豆之香能開脾鹽之咸能走血痛或時止知必血分氣滯乃用失笑散一服痛除巢氏素有胃氣或用溫胃之劑不效延至痛引背脅脈短澀豫謂短為宿食澀為氣中血滯宜㽲痛無已也用延胡五靈脂酒炒當歸紅曲降真香末痛止史脘痛日久血絡亦痹理用辛通當歸鬚延胡索橘絡香附枳殼降香鬱金汁服效張操勞傷陽脈遲小胃口隱痛綿綿不已治用辛溫理氣製半夏良薑金橘皮茯苓檀香歸鬚韭子炒研一啜痛止薛痛久熱鬱口乾內煩不宜香燥劫液詢得食痛緩知病在脾之大絡受傷由忍飢得之甘可緩痛仿當歸建中湯法炒白芍二錢半當歸錢半炙草一錢豆豉炒錢半橘白八分糯稻根鬚五錢飴糖熬三錢沖數劑痛定常時食炒粳米粥嗣後更與調養胃陰杏仁麥冬白芍當歸蔞仁半夏青鹽炒南棗數服痛除脅痛論治肝脈布脅膽脈循脅肩下曰膊膊下曰臑臑對腋腋下曰胠胠下曰脅脅後曰肋肋下曰季肋俗名肋稍季肋下為腰故脅痛皆肝膽為病而膽附於肝凡氣血食痰風寒之滯於肝者皆足致痛氣鬱者大怒氣逆或謀慮不遂皆令肝火動甚清肝湯小龍薈丸血瘀者跌撲閃挫惡血停留按之痛甚復元活血湯痰痛者痰飲流注其經嗽則氣急控涎丹以二陳湯下或白芥子湯食積者食滯脅下有一條扛起消食丸風寒者外感之邪留著脅下小柴胡湯加桔梗枳殼左痛多留血右痛為肝邪入肺為氣痰食亦在右風寒則不論左右脅痛多實不可輕用補肝致令肝脹亦有虛痛者補肝散怒傷者香附湯郁傷者逍遙散初痛在經久必入絡經主氣絡主血有營絡虛寒得食痛緩者辛溫通絡甘緩補虛當歸桂枝湯有肝陰虛者熱痛嗌乾宜涼潤滋液三才湯加柏子仁白芍有液虛風動者脅氣動躍宜滋液熄風復脈湯去桂姜有鬱熱脹痛者宜苦辛泄降川楝子黃連山梔鬱金降香末有因怒勞致氣血皆傷肝絡瘀痹者宜辛溫通絡旋覆花湯加歸鬚小茴新絳延胡青蔥管有痞積攻痛者宜辛散通瘀桃仁鯪鯉甲乳香沒藥丹皮歸鬚牡蠣粉澤蘭有氣逆嘔涎由脅攻胃者用酸泄和肝木瓜白芍金橘皮棗仁橘葉代赭石按內經治肝不外甘緩辛散酸瀉三法凡脅痛藥忌剛燥以肝為剛臟必以柔濟之乃安也丹溪曰肝苦急是木氣有餘急食辛以散之用川芎青皮醋炒又曰肝火盛兩脅痛不得伸舒先以琥珀膏貼患處以薑湯下當歸龍薈丸最妙咳引脅痛宜舒肝氣用青皮枳殼香附白芥子之類兩脅走痛控涎丹正傳曰凡脅痛皆肝木有餘小柴胡湯加川芎青皮芍藥龍膽草甚者加青黛麝香凡性急多怒之人常患腹脅痛小柴胡湯加川芎青皮白芍下龍薈丸甚效入門曰肝熱鬱則脅必痛發寒熱脅痛似有積塊必是飲食太飽勞力所致當歸龍薈丸肝氣實脅痛者煩燥不安臥小柴胡湯加川芎白芍當歸青皮龍膽草肝氣虛脅痛者悠悠不止耳目䀮䀮善恐四物湯加柴胡青皮醫鑑曰脅痛必用青皮醋炒煎服末服並效以青皮乃肝膽二經藥多怒脅有鬱積宜此解之若二經氣血不足當先補血少用青皮脅痛脈候肝脈搏堅而長當病墮若搏因血在脅下令人喘逆寸口脈弦脅痛拘急雙弦者兩脅痛肝脈沉之而急浮之亦然脅痛支滿引小腹痛小便難得之有所墮墜脈沉澀氣鬱胸脅痛宜作郁治附方肝鬱清肝湯白芍錢半當歸川芎各一錢山梔丹皮各四分柴胡八分肝鬱小龍薈丸龍膽草蘆薈歸芎梔連大黃木香麝香粥丸薑湯下肝瘀復元活血湯見二卷吐血痰飲控涎丹見二卷痰飲痰痛二陳湯夏陳苓草痰痛白芥子湯白芥子木鱉子沒藥桂心木香等分為末每一錢煎食積消食丸楂曲青陳麥芽萊蔔子香附阿魏肝邪小柴胡湯見一卷溫肝虛補肝散地芍歸芎羌防怒傷香附湯香附歸芍柴胡青皮郁傷逍遙散見一卷火和營當歸桂枝湯歸桂芍草姜棗滋液三才湯天冬熟地人參熄風復脈湯見一卷中風通絡旋覆花湯旋覆新絳蔥外貼琥珀膏見三卷積聚肝火當歸龍薈丸見一卷火肝虛四物湯地芍歸芎右脅推氣散片薑黃枳殼桂心各五錢炙草二錢每服三錢薑湯調下左脅芎枳散川芎枳實各五錢炙草二錢每服三錢薑湯調下脅痛脈案某氏左脅痛臥必偏右咳則氣急痰帶血絲症由五志怫抑損傷營絡仿內經肝苦急急食甘以緩之潞參茯苓甜杏仁白芍杞子棗仁川貝母俱炒桑皮蜜炙金橘皮炙草紅棗煎服效沈氏氣攻肋脅左右上入乳際痛引胸背子夜特甚思人身氣血於子丑時注肝膽子時注膽丑時注肝今肝陽上升諸氣皆逆勢必營衛失度瘀濁不降嘔逆便艱有自來矣用微苦微辛以泄降杏仁當歸鬚青皮醋炒延胡鬱金枳殼炒栝蔞廣木香汁沖二服隨定堂弟右脅久痛牽引背膊呼吸不利咳則痛甚坐必體傴食入稍安右脈浮弦此操勞所傷損動肺絡當春木旺痛難遽止夫諸氣膹郁皆屬於肺然痛久則入絡姑用苦辛宣通老韭根當歸鬚鬱金杏仁川貝母陳皮佛手柑二服痛減按其脅仍覺痞硬仿咸以軟堅用旋覆花牡蠣粉白芍金橘皮延胡當歸降香二服轉用甘緩理虛以參苓歸芍陳貝甘草痛緩其親戚一醫以為肝腎陰虛用熟地滋膩竟成單脹矣郭去秋肋痛痰血見症於肝不足於腎入春醫用通攝奇經未效改用桂心蒺藜等藥平肝不知肝為剛臟藥忌剛燥痛宜益加矣延至夏初木火相乘體羸食減日晡寒熱咳嗽氣促口乾舌膩坐則脅背牽引刺痛脈來弦數無神症由情志不遂肝膽寄居之相火上侮肺金以至痰紅氣急日就羸怯此以水涵木之法急宜進商也阿膠麥冬白芍貝母各二錢五味子五分石斛黑豆皮各三錢丹皮錢半二服寒熱止嗽痛減食加餐矣又令晨服燕窩湯晚服生脈散症有起色韓右脅有塊梗起攻胸氣痹食少宵脹引背此肝強胃弱升降失和泄肝通胃可效厚朴枳殼杏仁蔞仁青皮旋覆花降香末木瓜三服而平腹痛論治腹中窄狹附人身背為陽腹為陰中脘屬太陰小腹左右屬厥陰臍腹正中屬少陰衝任經論寒痛十一條熱痛一條寒熱痛二條血虛痛一條此泛言猝痛而腹痛該之矣其症有暴痛久痛實痛虛痛有痛在氣分血分在腑在臟在經絡之辨凡暴痛非熱久痛非寒虛痛喜按實痛拒按痛在氣分者攻注不定在血分者刺痛不移痛在腑者脈多弦滑在臟者脈多沉微初痛邪在經久痛必入絡經主氣絡主血也感寒腹痛者氣滯陽衰喜熱手按脈沉遲治在溫中香砂理中湯去白朮感寒嘔痛者氣虛兼痰脈弦滑治在健運香砂六君子湯去白朮氣滯兼食者腹中有一條扛起利後痛減脈沉滑治在消導香砂枳朮湯加神麯麥芽或保和丸寒氣滯痛兼脹滿者治在溫通排氣飲加砂仁去澤瀉胃虛肝乘吐酸濁者治在辛泄吳茱萸湯傷寒腹急痛陽脈澀陰脈弦治在甘緩小建中湯太陰寒痛自利脈沉理中湯厥陰寒痛肢厥脈細當歸四逆湯少陰寒痛四肢沉重咳嘔下利脈沉細真武湯外感兼宿食或中暑霍亂吐瀉藿香正氣散六和湯胸腹絞痛上不得吐下不得瀉名乾霍亂脈沉伏急以燒鹽湯探吐再服藿香正氣散火鬱痛時作時止熱手按而不減脈洪疾清中湯或二陳湯加梔蒼連芍鬱金熱厥痛時作時止金鈴子散七情氣鬱攻衝作痛三因七氣湯五磨飲理氣不應脈芤澀痛如芒刺為血鬱手拈散血虛腹痛飢勞必甚芍藥甘草湯加桂棗當歸氣血虛寒腹痛脈微按之溫之必稍緩大營煎理陰煎當臍㽲痛審系肝脾絡血痧結失笑散加歸鬚桃仁韭汁若腎虛任脈為病六味丸加龜板凡痛久必入血絡非香燥可劫治宜宣絡旋覆花湯加歸鬚桃仁生鹿角死血痛由血絡阻痹桃仁承氣湯加蘇木紅花積聚痛由宿有癥瘕木香檳榔丸去大黃牽牛加鬱金有熱阿魏丸跌傷痛由血瘀脅腹復元活血湯酒積痛由濕熱阻滯曲糵丸小腹滿痛由經閉血滯玉燭散去硝黃加延胡索香附思傷脾氣㽲結悸痛歸脾湯去白朮怒傷肝火痞結刺痛柴胡疏肝散或左金丸蟲痛時作時止有塊梗起口吐清水唇有紅點脈乍大乍小理中安蛔散烏梅丸加減疝氣痛必引睪丸香橘散立效散腸癰痛身皮甲錯小便如淋腹皮急按之濡右左足屈者大小腸癰牡丹皮飲十味排膿散中惡腹痛霍亂吐利蘇合香丸大抵腹痛寒淫為多熱淫為少以陰寒尤易阻塞陽氣也腹痛氣滯者多血滯者少理氣滯不宜動血理血滯則必兼行氣也古謂痛則不通通則不痛故治痛大法不外溫散辛通而其要則初用通腑久必通絡尤宜審虛實而施治者矣腹中窄狹醫通云肥人乃是濕痰留滯氣不升降當行氣燥濕越鞠丸平胃散為主瘦人乃是陰虛火旺熏蒸臟腑當降火開鬱逍遙散左金丸為主肥人腹中轆轆有聲須作痰治二術二陳湯氣虛者加人參腹痛脈候陰弦腹痛細小緊急皆腹痛濡滑為痰飲短滑為宿食芤澀為死血沉伏為氣滯尺脈緊臍下痛弦急小腹痛痛甚者脈必伏大為病久細小而遲者易治實大堅疾緊數浮長者難治大痛而喘人中黑者死陰弦或緊宜溫沉弦滑實可下附方溫中香砂理中湯理中加木香砂仁健運香砂六君湯六君子湯加木香砂仁消導香砂枳朮丸見本卷頭痛消導保和丸見二卷痰飲溫通排氣飲見三卷積聚辛泄吳茱萸湯見三卷嘔吐甘緩小建中湯桂芍姜草棗飴厥陰當歸四逆湯歸桂芍辛草通草棗少陰真武湯見二卷喘霍亂藿香正氣散見一卷中風和解六和湯見一卷暑火鬱清中湯見本捲心痛痰熱二陳湯夏陳苓草熱厥金鈴子散見三卷郁氣鬱七氣湯見二卷咳嗽行氣五磨飲四磨飲見二卷哮此去人參加枳實木香白酒磨名五磨飲血鬱手拈散見本捲心痛和營芍藥甘草湯芍草脈緩傷水加桂枝生薑脈洪傷氣加黃耆大棗脈澀傷血加當歸血虛大營煎見三卷關格氣血理陰煎見二卷咳嗽絡瘀失笑散見本卷胃脘痛補陰六味丸見一卷中風宣絡旋覆花湯旋覆新絳蔥通瘀桃仁承氣湯見一卷疫症積聚木香檳榔丸見三卷積聚熱積阿魏丸連翹黃連各五錢山楂阿魏各一兩醋煮阿魏糊丸白湯下跌傷復元活血湯見二卷吐血酒積曲糵丸神麯麥芽枳實白朮經閉玉燭散四物湯加大黃芒硝甘草傷脾歸脾湯見二卷勞瘵痞結柴胡疏肝散見二卷勞瘵肝火左金丸黃連吳萸蟲動理中安蛔散見三卷嘔吐蛔厥烏梅丸見三卷嘔吐疝痛立效散楂肉一兩川楝子茴香鹽水炒枳實茅朮香附山梔薑汁炒青皮醋炒各五錢吳萸三錢為末每服五錢腸癰大黃湯丹皮栝蔞各三錢桃仁大黃芒硝各二錢腸癰牡丹散見本卷胃脘癰腸癰排膿散見一卷肺癰中惡蘇合香丸見一卷中風六郁越鞠丸見三卷郁利濕平胃散術朴陳草降火逍遙散見一卷火除痰二術二陳湯見二卷痰飲腹痛脈案夏氏當臍㽲痛觸寒屢發痛來飲食都廢神色清減脈虛弦據述服和肝調氣不應數年前曾以鴉片煙腳為丸服下痛止夫鴉片能行下身經絡此症明系血絡阻滯為患況痛久入絡宜辛溫以通之若但如四七湯四磨飲僅開氣分昔賢謂經主氣絡主血不分經絡安能應手用當歸鬚酒拌延胡小茴酒焙新絳桃仁研旋覆花絹包煨服效薛寒熱咳嗽數日後小腹掣痛疑為腸癰診脈浮弦全不沉數乃絡虛氣聚非腸癰也用杏仁栝蔞茴香橘核當歸延胡俱酒焙木瓜二服全瘳沈氏冬寒小腹瘕聚左脅撐痛上攻胸背大小便不通脹悶欲絶湯飲不下兼發寒熱脈短澀宜先導其瘀滯古云痛則不通也枳殼桃仁各二錢厚朴薑製青皮麩炒各七分延胡酒炒歸尾酒潤各錢半蘇梗郁李仁各二錢沉香磨汁三分二服痛定二便通調惟左脅偶一隱痛原方去桃仁歸尾蘇梗延胡加鬱金香附沉香改木香仍磨汁沖服又將煎劑挫為細末服愈肩背手臂痛論治經曰背者胸中之腑背曲肩隨腑將壞矣又曰肺病者喘咳逆氣肩背痛汗出又曰肺盛有餘則肩背痛風寒汗出中風小便數而缺氣虛則肩背寒少氣不足以息溺色變又曰邪在腎則肩背痛是腎氣上逆也蓋肩背為太陽經所循又為肺臟分域凡太陽經及肺俞為病固足致痛而腎氣逆攻亦足致痛焉故肩背痛不可回顧此手太陽經氣鬱不行宜風藥散之防風通氣散肩背痛脊強腰似折項似拔此足太陽經氣鬱不行羌活勝濕湯如肺受風熱而肩背痛羌活散肺氣虛而肩背寒補中益氣湯加麥冬五味腎氣逆沖挾脊而上攻背痛者系督脈主病治在少陰宜川椒桂枝茯苓附子牛膝遠志沉香小茴香亦有肝濁逆沖從腹而上攻背痛者系衝任主病治在厥陰宜乾薑川椒桂枝烏梅川連白芍細辛川楝肉傷濕而肩背重痛者當歸拈痛湯寒飲伏結肩背冷痛者白朮附子湯素有痰飲流注肩背手臂作痛者導痰湯因於氣滯者烏藥順氣散因於血虛者四物湯加秦艽薑黃因營虛絡脈失養風動筋急者舒筋湯陽明脈衰肩胛筋緩不舉而痛宜調補絡脈生耆於朮當歸防風根薑黃桑枝甘杞子橘絡督脈虛背痛脊高突鹿角霜杞子歸身杜仲茯苓沙苑子勞力或坐久而致脊背痛者補中益氣湯或八珍湯加黃耆凡背痛通用薑黃散更須加防風羌活引經肥人喜捶而痛減者屬痰宜除濕運痰兼補脾氣六君子湯加木香瘦人多由營弱衛衰宜調氣養血聖愈湯加桂枝白芍手臂為手六經交會或為風寒濕所搏或因飲液流入或因提摯重物皆能致痛因風濕者除濕蠲痛湯加薑黃當歸桂枝因風熱者秦艽地黃湯因寒濕者五積散加減濕痹經絡者蠲痹湯肢節痛臂不能舉者舒筋湯加油松節威靈仙骨痛筋攣血脈凝澀者透經解攣湯痰飲流入四肢肩背手臂痠痛軟痹者導痰湯加薑炒白朮薑黃木香中脘停痰伏飲脾不能運臂戰不舉脈來沉細者指迷茯苓丸挈重傷筋臂痛宜和氣調血十全大補湯血不榮筋者四物秦艽湯加玉竹手屈而不能伸者病在筋薏苡仁湯伸而不能屈者病在骨白朮附子湯手腫痛連臂蠲痹湯加桑枝凡用薄桂能橫行手臂片子薑黃能引至手臂油松節能透入骨節丹溪治臂痛以二陳湯加酒炒黃芩蒼朮羌活是風痰濕熱兼治也附方散風防風通氣散羌防荊梔術歸芍芎翹薄荷各五錢桔梗黃芩石膏各一兩甘草滑石各二兩每服八錢加薑蔥水煎除濕羌活勝濕湯見一卷濕風熱羌活散羌防辛芎枳菊芩苓草蔓荊前胡石膏加姜煎升提補中益氣湯見一卷中風傷濕當歸拈痛湯見一卷濕寒飲朮附湯見五卷痙痰飲導痰湯見一卷中風氣滯烏藥順氣散見一卷中風血虛四物湯地芍歸芎營虛舒筋湯薑黃四兩草羌各一兩歸術赤芍海桐皮各二兩每服五錢姜水煎勞力八珍湯見一卷中風通用薑黃散薑黃四兩炙草羌活白朮各一兩每服一兩水煎補脾六君子湯見一卷中風氣血聖愈湯見二卷勞瘵風濕除濕蠲痛湯一名除濕蠲痹湯見五卷痹風熱秦艽地黃湯見五卷痹寒濕加減五積散見一卷濕濕痹蠲痹湯見五卷痹攣痛透經解攣湯炮甲片三錢羌防歸荊草紅花蘇木蟬蛻天麻各七分白芷一錢連翹川芎各五分水煎停飲指迷茯苓丸見二卷痰飲摯重十全大補湯見一卷中風血虛秦艽四物湯見五卷痹筋不伸薏仁湯薏苡歸芍麻黃官桂蒼朮甘草姜痰注二陳湯見一卷中風腰脊腿足痛論治腰痠腰僂廢腰軟尻膝跟附經云腰者腎之腑又云太陽所至為腰痛惟腎與膀胱相表裡故腰在經則屬太陽在臟則屬腎經言太陽腰痛者外感六氣也經言腎經腰痛者內傷房勞也而又為衝任督帶之要會其所由致痛者以腎氣本虛而風寒濕熱之邪皆可乘虛而入即諸奇經亦多統系焉凡腰脊酸痿綿綿作痛並腿足痠軟者腎虛也遇陰雨則隱痛或久坐覺重者濕也得寒則痛喜近溫暖者寒也得熱則痛喜近清涼者熱也閃挫痛或跌撲損傷者血瘀也肝脾傷由憂思鬱怒者氣滯也負重致痛者勞力也凡此皆屬標而腎虛為本詳其治法腎虛痛者多由房欲但察其既無表邪又非濕熱或年力衰頽或情志怫鬱或行立不支而坐臥少可或疲倦無力而動勞益甚或面色慘晦脈候虛微皆腎經不足也但腎陽虛者脈微無力小便清利神疲氣短宜益火之源腎氣丸鹿茸丸腎陰虛者脈洪而數虛火時炎小便黃赤宜壯水之主地黃湯大補丸腎陰陽俱虛者脈虛而大宜水火平調無比山藥丸其六氣乘虛侵犯太陽如傷風腰痛症必寒熱脈必浮痛連背脊牽引兩足小續命湯加減傷寒腰冷如冰脈必緊得熱則減姜附湯加肉桂杜仲外用摩腰膏傷濕由坐臥濕地或傷雨露身重脈緩天陰更甚腰溶溶如坐水中宜茯苓皮木防己晚蠶砂滑石厚朴萆薢薏苡滲濕湯腎著湯濕兼風一身盡痛羌活勝濕湯獨活寄生湯濕兼寒腹痛自利姜附湯濕兼熱郁久化火當歸拈痛湯風寒濕痹痛川烏頭三個生搗為末少加鹽水調攤帛上貼痛處立止熱痛脈必洪數口渴便祕甘豆湯加續斷天麻如陰虛火盛當滋陰降火滋陰八味丸閃挫跌撲諸痛肝脈搏堅而長兩尺實不可俯仰復元通氣散酒調下若血瘀痛轉動如刺大便黑或祕結四物湯加紅花桃仁穿山甲延胡索大黃外用酒糟蔥白生薑搗爛罨之尤效氣滯腰痛脈沉弦或結伏烏藥順氣散不應八味順氣散肝氣失暢臥覺腰痛頻欲轉側曉起則止柴胡舒肝散痰注痛脈滑或沉痛在一塊導痰湯加香附烏藥枳殼傷力腰痛大補湯下青娥丸腰肋如帶束引痛此帶脈為病宜辛散其結甘緩其急用延胡歸鬚桑寄生杞子小茴沙苑子或調肝散痛久絡虛宜調補奇脈用核桃當歸杜仲羊腰鹿角杞子牛膝補骨脂老人虛人腎虧腰痛不能轉側宜二至丸或立安丸腰痠屬房勞腎虛宜峻補青娥丸若走精六味丸去澤瀉加魚鰾沙苑子五味子婦女腰痠六味丸加杜仲續斷腰僂廢乃熱邪深入血脈久閉桃仁承氣湯多用肉桂少用熟附子行經痛者可治不痛久廢者不可治腰軟濕襲經絡者腎著湯風襲腰背者牛膝酒斫喪太過者八味丸補髓丹脊者督脈及太陽經所過項脊常熱而痛者陰虛也六味丸加麋茸常寒而痛者陽虛也八味丸加鹿茸太陽經脊痛項強腰似折項似拔羌活勝濕湯脈浮緊為傷寒麻黃湯沉緩為風濕柴胡湯加減尻乃足少陰及督脈所經兼屬厥陰尻痛屬腎虛者七味丸不應加鹿茸肥人屬濕痰二陳湯合二妙散腿足為足六經所至痛有陰虛陽虛血虛血寒腎虛風襲寒濕風濕濕熱之症陰虛者體羸足心及股脛熱痛左尺細數或兩尺數盛虎潛丸去陳皮加肉桂陽虛者足浮腫無力大便瀉右尺虛大或兩尺浮遲脾與命火俱衰先用補中益氣湯加炮姜再用八味丸血虛者足不任地行則振掉脈細弱六味湯加續斷鹿茸杜仲血寒者筋急脈沉喜近湯火舒筋三聖散腎虛風襲則下體痿弱骨節疼痛尺中浮大而數安腎湯寒濕者兩腿隱痛或麻頑作腫身重肢節痛脈沉者白朮附子湯脈浮澀者除風濕羌活湯風濕者腫痛走注獨活寄生湯濕熱者或上或下或紅或腫溺赤脈濡數當歸拈痛湯更有腿轉筋上衝入腹宜瓜萸散詳腳氣門膝者筋之腑屈伸不利行則僂俯筋將憊矣其膝痛在筋則屈不能伸而