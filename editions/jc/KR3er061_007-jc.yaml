喎搖頭直視此火風入筋劫爍血液熱深厥深之象急救營液以熄火風用阿膠水化生地犀角汁麥冬鉤藤木瓜山梔石斛生藕汁煎日再服症定脈數減去犀角加生龜甲龍膽草專退肝膽風熱漸平同時一侄孫症同脈更沉數飲以臘雪湯西瓜汁暫定逾時輒復躁擾譫妄服至寶丹稍靜予一見其舌乾薄齒如灰糕決其腎水枯竭勉用方諸水煎生地犀角生龜甲元參石斛等熱勢輒定然卒不救可知溫熱症由伏邪內發者多死於陰虛水涸之體也眩暈論治頭為諸陽之會煩勞傷陽陽升風動上擾巔頂耳目乃清空之竅風陽旋沸斯眩暈作焉良由肝膽乃風木之臟相火內寄其性主動主升或由身心過動或由情志鬱勃或由地氣上騰或由冬藏不密或由高年腎液已衰水不涵木或由病後精神未復陰不吸陽以至目昏耳鳴震眩不定甚則心悸舌辣肢麻筋惕寤不成寐動則自汗起則嘔痰無痰不作眩此經所謂諸風掉眩皆屬於肝也顧內風肆橫虛陽上升非發散可解非沉寒可清與治六氣風火大異法宜辛甘化風或甘酸化陰葉氏所謂緩肝之急以熄風滋腎之液以驅熱肝風既平眩暈斯止條其治法如上焦竅絡火鬱用羚羊角山梔連翹天花粉丹皮生地桑葉鉤藤天麻以泄熱從膽治也如中虛風陽擾胃用人參山藥黃耆小麥炙草龍眼肉以填補從胃治也肝風內擾陽明正當其沖故須補中如下元水涸火升用阿膠熟地石斛何首烏杞子天冬黑芝麻磁石五味子以攝納從肝腎治也其陽冒不潛用牡蠣淡茶龜甲痰多作眩用茯苓川貝橘紅竹瀝薑汁心悸不寐用棗仁麥冬茯神龍骨厥陽不斂用萸肉白芍牛膝炭土被木克嘔吐不食宜泄肝安胃用橘白木瓜半夏曲茯苓動怒鬱勃痰火風交熾用二陳湯下龍薈丸至於熄風之品如甘菊炭煨天麻鉤藤之屬皆可隨症加入者也附方除痰二陳湯見一卷中風瀉火龍薈丸見一卷火眩暈脈案褚氏高年頭暈冬初因怒猝發先怔忡而眩僕汗多如洗夜不能寐左寸關脈浮大無倫此膽氣鬱勃煽動君火虛陽化風上冒巔頂所致用丹皮山梔各錢半甘菊白芍俱炒各三錢鉤藤茯神各三錢柏子仁棗仁生研各八分桑葉二錢浮小麥二兩南棗四枚二服悸眩平汗止熟寐矣隨用熟地潞參五味茯神麥冬蓮子白芍數服全愈凡營液虛膽火上升蒙竅須丹梔鉤藤桑葉以泄熱炒菊芍以熄風和陽再加茯神棗仁柏子仁小麥以安神涼心風靜汗止必收斂營液為宜豐氏眩暈痞嘔多酸苦濁沫肝木乘土胃虛食減瘀濁不降得虛風翔則傾溢而出厥陽上冒清竅為蒙故眩暈時作診脈澀小數兩寸尤甚先用降濁熄風栝蔞霜蘇子半夏茯苓杏仁天麻甘菊炭鉤藤橘皮諸症平思納食矣又照原方去蘇子杏仁鉤藤加茯神蓮子釵石斛荷葉煎湯十數服而安室人煩勞傷陽無寐耳鳴頭暈欲嘔伏枕稍定虛陽上巔風動痰升眩嘔乃作宜潛陽熄風牡蠣煅研白芍五味甘菊炭天麻煨半夏青鹽炒生地炒茯神棗仁桑葉二服隨愈肖勞力先曾失血數次近日頭眩耳鳴目昏心悸脘悶兩尺浮大弦勁相火易炎龍雷失制痰隨火乘上干清竅所謂無痰不作眩悸也養陰潛陽淡菜牡蠣熟地炭石斛甘菊白芍貝母茯神數服得效後宜服六味丸許氏中年經行太多目眩頭暈用攝陰和陽熟地白芍甘菊俱炒各二錢當歸醋炒八分丹皮牡蠣粉各錢半甘草炙黑一錢嫩桑葉三錢紅棗三枚二服愈王伏暑病後失調脈虛疾頭暈熱渴而煩虛風上巔議苦辛泄熱佐以甘潤山梔甘菊丹皮麥冬釵斛天麻煨黨參花粉甘草嫩桑葉二服而愈堂兄寤後舌辣津不上朝頭眩肢麻陽升風動主和陽熄風佐酸味以生津鮮生地玉竹石斛白芍五味花粉烏梅甘菊炭牡蠣粉桑枝黑芝麻常服效姜弱冠勞力傷陽神疲頭眩發熱口苦食減嘔濁兩寸脈數厥氣上冒有風翔浪湧之勢治以鎮陽泄濁牡蠣白芍茯神橘紅製半夏吳茱萸甘菊炭金器同煎二服濁降嘔止脈仍小數頭目不清緣春溫膽火上升仿葉氏泄膽熱法丹皮嫩桑葉荷葉邊鉤藤白芍生山梔生地炭數服眩除熱減去桑葉生地炭加玉竹茯神杞子焙山藥熟地俱炒潞參蓮棗脈平肖冒雨後濕鬱成熱蒸而為黃宿恙又經操勞屢次失血當春虛陽升動咳而頭眩口乾目黃怔忡失寐治先清泄火風生地石斛山梔心茯神丹皮羚羊角杏仁鉤藤甘菊炒四服頭目清怔忡息食進寐穩矣但神疲力倦去生地加參芍蓮棗以扶脾元數服更適後去羚羊角杏仁鉤藤甘菊加茵陳松羅茶葉黃漸退厥症論治氣自下逆上手足冷為厥厥者盡也危候也經曰下虛則厥故陽衰於下則為寒厥陰衰於下則為熱厥陰陽之氣不相順接則病厥逆手之三陰三陽相接於手十指足之三陰三陽相接於足十趾陽氣內陷陽不與陰相順接故手足厥冷也寒厥者身寒面清四肢逆冷指甲冷蜷臥不渴便利脈微遲即陰厥也熱厥者身熱面赤四肢厥逆指甲暖煩渴昏冒便短澀脈滑數即陽厥也按內經論十二經陰陽之厥詳矣而仲景以厥隸厥陰活人亦謂諸手足逆冷皆屬厥陰以肝臟風火為厥逆之主故厥症種種類由肝風痰火沖激閉塞以至昏痙為多今標舉其目有寒熱氣血食痰屍蛔煎薄痿痹風癇喑郁骨痛腎色暴瘧諸厥施治最所宜審寒厥初病即肢冷腹痛脈微附子理中湯或表熱裡寒下利清穀厥逆乾嘔咽痛脈沉細而微四逆湯獨指尖冷名清厥理中湯熱厥初病身熱煩臊脈滑數日後忽肢冷乍溫乃熱深發厥火鬱湯便秘大柴胡湯煩渴躁妄失下而手足冷乃陽極似陰熱極似寒不可疑作陰症輕用熱藥熱微厥亦微四逆散熱深厥亦深承氣湯如陰衰於下足下熱而厥者六味湯凡傷寒之厥辨邪氣寒厥宜溫熱厥可散可攻若由陰陽之衰則元氣為重寒厥宜補陽熱厥宜補陰氣厥症有二氣虛氣實皆能致厥氣虛而厥者必形色消索身微冷脈微弱為氣脫參耆歸朮地黃枸杞之屬甚者回陽飲獨參湯氣實而厥者形色鬱勃脈沉弦而滑胸膈喘滿為氣逆先理其氣四七湯排氣飲再隨症調之血厥症有二血脫血逆皆能致厥吐衄暴崩及產後血大脫則氣隨之故猝僕宜先掐人中或燒醋炭以收其氣急煎人參湯灌之但氣不盡脫必漸蘇血逆者暴怒傷陰血逆於上先理其氣則血自行通瘀煎化肝煎俟血行氣舒隨症調之食厥由醉飽過度偶感風寒惱怒食氣填中脾陽不運忽僕不省誤作中風中氣治則死煎姜鹽湯探吐食出則愈如感風寒藿香正氣散傷氣滯八味順氣散縱飲痰升猝僕者名酒厥二陳湯加青皮葛根砂仁痰厥由痰熱阻蔽心包肢冷猝僕先探吐其痰瓜蒂散痰開再治本病火痰宜清降寒痰宜溫散濕痰宜燥利因脾虛者健脾因腎虛者補腎屍厥即中惡之候因犯不正之氣忽手足厥冷牙緊口噤昏不知人或由登塚吊死飛屍鬼擊語妄面青蘇合香湯灌之候蘇服調氣平胃散仲景云屍厥脈動無氣氣閉不通者還魂丹蛔厥多因胃寒蛔蟲攻胃心腹痛不可忍或吐涎沫或吐蛔蟲發有休止不宜用寒藥理中湯加炒川椒檳榔水煎下烏梅丸或安蛔散蕪荑散蛔蟲得苦則安得酸則止得辛則伏吐蛔亦有陽症口瘡咽疼吐蛔竟以冷劑取效者不可專以胃冷概也煎厥者諸動屬陽煩勞則陽氣暴張勞火亢炎而精絕遷延至夏內外皆熱孤陽厥逆如煎如熬宜清心益腎或鹹寒降逆人參固本丸加淡菜阿膠方諸水薄厥者肝本藏血怒則火起於肝迫血上行而厥蒲黃酒降之痿厥亦熱厥症厥從肝起致四末不用因水虧則陽風爍筋絡熱沸騰須血肉咸潤之品熬膏服以填其隙鱉甲龜板阿膠淡菜生地豬羊脊髓痹厥腳氣頑麻初發必身痛肢節腫當歸拈痛散其自踝以下痛極者五獸三匱丸滋腎丸風厥手足搐搦身體強直名痙厥小續命湯癇厥肝風發痙肢掣液涸固本丸加阿膠雞子黃龍骨喑厥乃類中風症暴喑不語經所謂內奪而厥則為喑痱地黃飲子加減郁厥亦血厥症平居無疾忽默默無知目閉口噤惡聞人聲移時方寤由熱升風動鬱冒而厥婦人多有之羚羊角散虛則填補奇經杞子當歸鹿角霜茯苓肉蓯蓉骨厥骨枯爪痛六味丸痛厥由胃陽久衰肝木來乘濁氣攻胃吳萸半夏茯苓薑汁廣皮之屬腎厥火由背脊上升肢逆吐沫椒附湯其有腎厥氣逆至巔頭腦大痛玉真丸色厥乃縱欲竭情精脫於下氣脫於上獨參湯暴厥脈至如喘氣閉肢冷若鼻及心腹微溫目中神采不變口無涎卵不縮皆可救備急丸瘧厥由瘧邪陷陰發厥不省當和正以托邪人參半夏知母草果烏梅生薑之屬凡諸厥脈大浮洪有力易醒脈細沉伏數急不連貫凶厥僕大指掐拳內凶掐拳外輕面青環口青唇白鼻青孔黑人中吊危也諸厥脈候寸脈沉大而滑沉為實滑為氣實氣相搏猝厥血氣入臟即死入腑即愈唇青身冷為入臟身溫汗出為入腑猝厥脈大而緩者生緊大而浮者死屍厥脈伏者死凡厥脈沉微為寒沉數為熱細為氣虛芤大血虛浮數滑為痰脈至如喘為氣沉滑緊疾為食洪大而滑為蛔脾脈緩為痿浮澀而緊為痹附方寒厥理中湯見一卷中風寒厥四逆湯見一卷暑熱厥火鬱湯見一卷火便秘大柴胡湯見一卷溫散熱四逆散見三卷肝火蕩熱小承氣湯見一卷溫滋陰六味湯見一卷中風補陽補中益氣湯見一卷中風氣脫四味回陽飲參附姜草氣逆四七湯一名七氣湯見二卷咳嗽氣逆排氣飲見三卷積聚血逆通瘀煎歸尾山楂香附紅花烏藥青皮木香澤瀉怒傷化肝煎見二卷血霍亂正氣散見一卷中風氣滯八味順氣散見一卷中風酒厥二陳湯見一卷中風吐痰瓜蒂散見一卷中風屍厥蘇合香丸見一卷中風屍厥調氣平胃散見一卷中風氣閉還魂丹辰砂雄黃玳瑁麝香白芥子安息香熔化為丸黍米大每服五分止蛔烏梅丸見三卷嘔吐止蛔安蛔散見三卷嘔吐殺蛔蕪荑散見三卷積聚煎厥固本丸見一卷中風薄厥蒲黃酒蒲黃一兩炒褐色清酒十杯沃之溫服痹厥當歸拈痛湯見一卷濕痹厥五獸三匱丸見本卷痿瀉熱滋腎丸見一卷火風厥小續命湯見一卷中風喑厥地黃飲子見一卷中風郁厥羚羊角散見本卷痹腎厥椒附湯見四卷泄瀉頭痛玉真丸硫黃硝石石膏半夏薑汁糊丸暴厥備急丸大黃乾薑巴霜各二兩蜜丸豆大猝厥者酒下三丸即活厥脈案房叔秋感時癘煩悶吐瀉筋掣囊縮手足厥逆脈微邪陷厥陰與六和湯去扁豆白朮杏仁加吳茱萸煨姜吐瀉止手足溫忽發痙項背強直時或反張頭面冷至胸背躁擾欲冷飲目閉心了了口不能語由吐瀉後真陰大傷厥氣上逆陰陽失交虛風入絡故現痙厥重症雖神明未昏而腎水欲枯微陽垂絕勉用參二錢附三分回陽歸二錢芍三錢救陰麥冬錢半五味四分生津木瓜鉤藤各錢半舒筋茯神遠志各二錢斂神服後陽回躁定再劑諸症悉退腳氣論治腳氣壅疾也多由蘊濕而成經所謂緩風濕痹也頑弱為緩風痛著為濕痹然有風濕寒濕濕熱厥逆攻注等因東垣謂南方多感寒濕北方多傷濕熱千金方直謂風毒所中由坐立濕地風濕襲入經絡皮肉遂成腳氣初起甚微人多不覺惟猝起腳屈弱不能動或腫不腫或頑痹或緩縱或攣急其發也身痛壯熱大類傷寒或小腹不仁或腹痛下利或二便秘澀或忡悸昏憒嘔逆轉筋但病起自腳或腫滿或枯細便作腳氣治勿用傷寒等藥其小腹頑痹不仁者腳多不腫頑後三日令人嘔吐為腳氣入心死在旦夕腎乘心水剋火也丹溪以八味丸去山藥救之後人又以浮腫為濕腳氣當利濕疏風不腫為乾腳氣當潤血清燥干即熱也治法大要疏通其壅氣滯者檳蘇散四七湯食滯者枳黃湯風勝者自汗走注脈浮弦越婢加白朮湯寒勝者無汗攣急掣痛脈沉澀酒下牛膝丸暑勝者身熱渴煩脈洪數清暑益氣湯濕勝者腫痛重著脈濡細除濕湯寒濕勝者頑弱無力脈細緩葫蘆巴丸熱甚者加味蒼柏散腫甚者勝濕餅子桑白皮散腳氣初發渾身痛肢節腫二便秘先用羌活導滯湯導之後用當歸拈痛散除之風毒甚頭痛身熱肢節痛或一腳偏軟小續命湯加木瓜三陽經熱毒註腳踝焮赤腫痛寒熱如瘧敗毒散加蒼朮三陰經寒濕著脛膝枯瘦色淡少腹不仁或腹急痛上氣喘急八味丸加沉香腳氣入腹沖胸欲絕千金半夏湯入脅作痞杉木節湯腳氣衝心為火氣逆上金鈴子散加黃柏別以附子末津調敷湧泉穴衝心滿痛二便俱阻沉香導氣湯腹脹喘急蘇子降氣湯佐以養正丹嘔逆噁心平胃散加木香腿肚轉筋以蒜擦足心令熱即安仍以冷水食一瓣其厥氣升濕濁不降木萸湯腎氣虛小溲不利金匱腎氣丸氣血虛屈伸不利獨活寄生湯羌活續斷湯腳氣走注痛不可忍捉虎丹骨節腫痛五加皮丸腿筋不舒苧根湯厥氣上攻便秘三將軍丸腹脹喘急威靈仙末二錢酒下足腫成瘡沈氏腳氣湯濕瘡蟲癢甘蔗渣燒灰生豬脂搗敷油紙紮效注踝成漏人中白煅研敷孔良此症最忌房室及一切牛羊雞鴨魚肉蔥蒜酒面犯之則成痼疾東垣云腳氣實由水濕然有二焉南方卑濕清濕襲虛則病起於下此為外感北方常食膻乳飲酒太過脾胃不能運化水濕下注此因內至外者也腳氣脛腫是為壅疾治當疏下然太過則損脾不及則病不去南方多見兩足粗大與疾偕老初起治宜檳榔湯香蘇散並加檳榔橘皮以宣通其氣不使其壅壅既成砭去惡血然後服藥千金論云腳氣有冷有熱不同者足有三陰三陽寒中三陽所患必冷暑中三陰所患必熱脾受陽毒必熱頑腎受陰濕即寒痹活人書云凡腳氣服補藥及用湯藥渫洗逼邪入於經絡者皆醫之大戒也醫通云腳氣服補藥太過小便不通者用薑汁炒山梔木通赤芍赤茯苓當歸甘草梢不時煎服腳氣遍身腫滿喘促煩悶者木通散腳氣上入少腹不仁者八味丸凡腳氣多從暑濕得之故腫痛多屬濕熱其兼寒兼風當詳春夏病因六淫治之至於枯細而熱者屬陰虛瘦弱而寒者屬陽虛當別以本症治之腳氣脈候腳氣之脈浮弦為風濡弱為濕遲澀因寒洪數熱鬱沉伏毒在筋骨澀澀不調毒在血分夏暑腳膝冷其脈陽濡陰弱為濕溫浮大緊駃及沉細而駃皆惡脈心下急氣喘自汗脈促短數嘔吐不止者死附方頑痹八味丸見一卷中風氣滯檳蘇散蒼朮二錢香附蘇葉陳皮木瓜檳榔羌活牛膝各一錢甘草三分蔥白二莖姜三片氣滯枳黃湯枳實五分酒浸大黃三錢羌活錢半當歸一錢風勝越婢加朮湯麻黃石膏白朮甘草姜棗寒勝牛膝丸牛膝二兩川椒五錢附子一錢虎脛骨六錢酒浸曬研蜜丸酒下忌食動風物暑勝清暑益氣湯見一卷暑濕勝除濕湯見一卷濕寒濕葫蘆巴丸葫蘆巴酒浸一宿焙故紙炒各四兩共研以木瓜切頂去瓤入藥令滿簽合蒸爛搗丸熱甚加味蒼柏散蒼朮一錢白朮八分知母黃柏黃芩各六分歸芍地各四分木瓜檳榔牛膝木通羌獨防草各三分腫甚勝濕餅子白醜黑醜各二兩取頭末五錢甘遂五錢蕎麥麵一兩半水調作餅如錢大飯上蒸熟空心服以利為度腫甚桑白皮散赤苓二錢木香防己檳榔各一錢二分桑皮郁李仁各一錢蘇葉木通大腹子青皮各七分姜三片疏下羌活導滯湯大黃酒煨二錢四分羌活獨活各一錢二分防己歸尾各七分枳實五分濕熱當歸拈痛散見一卷濕中風小續命湯見一卷中風熱毒敗毒散見一卷傷風胸悶半夏湯半夏人參桂心各三錢乾薑二錢附子炙草各錢半細辛蜀椒各一錢分三服脅痞杉木節湯杉木節一升橘葉切一升無葉則以橘皮代之檳榔七枚童便三升煮一升半分二服火逆金鈴子散見三卷郁滿阻沉香導氣湯羌活白芍檳榔各一錢川芎香附各八分枳殼七分蘇葉蘇子木瓜姜各六分炙草沉香各五分喘脹蘇子降氣湯見二卷失音喘急養正丹見三卷嘔吐嘔惡平胃散術樸陳草姜棗肝氣木萸湯木瓜檳榔各二錢半吳茱萸錢半腎虛腎氣丸見二卷虛損虛弱獨活寄生湯見一卷濕偏痿羌活續斷湯羌續辛防艽芷參地歸芍苓桂牛膝杜仲走注捉虎丹五靈脂白膠香草烏黑豆同煮木鱉子地龍各兩半乳沒歸各七錢半麝京墨各三錢半糯米糊丸酒下腫痛五加皮丸五加皮四兩酒浸遠志四兩酒浸曬研酒糊丸酒下筋急苧根湯杜仲三錢當歸川斷胡桃肉杞子白苧根各二錢桑枝炒四錢紅花秦艽桃仁各一錢煎服將藥渣乘熱熨之厥氣三將軍丸茱萸木瓜大黃等分糊丸專治腳氣攻心大便不通瘡爛腳氣湯萆薢五錢茯苓桑枝各三錢蒼朮薏仁牛膝各二錢秦艽澤瀉各錢半衝心檳榔湯檳榔木香茴香等分加童便薑汁溫服初起香蘇散香附三兩蘇梗二兩陳皮一兩甘草五錢姜三片蔥白連根二莖腫滿木通散木通紫蘇豬苓各一兩桑白皮薑汁炒檳榔赤苓各二兩每服五錢蔥姜水煎腳氣脈案湯氏腳氣宿恙不離濕熱恰逢梅夏陰雨溽蒸舌痕灰黃食少不飢藥忌濁膩脾惡濕也再以衰年肝腎脈虛寒熱足腫帶下腰痛季脅自左注右不能側臥乃陽維帶脈兼病治從絡脈佐理脾陽仿古飲子法濁藥清投熟地炭錢半沙苑子鹽水炒杞子焙各二錢牛膝酒炒炭歸鬚酒拌各一錢砂仁殼八分茯苓薏苡生杜仲桑寄生續斷各二錢糯稻根鬚兩半一劑痛止再劑食進多服並腳氣不數發鶴膝風論治膝遊風膝眼毒膝癰附膝者筋之府屈伸不利兩膝壅腫內外皆痛腿細膝粗如鶴之膝是名鶴膝風多由足三陰經虧損風邪乘之使然治在活血榮筋兼理風濕十全大補湯加杜仲牛膝羌活獨活初起漫腫不紅屈伸不利用蔥熨法內消之或隔蒜灸內服大防風湯切忌針刺或用陳芥子研細蔥薑汁和白蜜調塗一伏時患上起泡泡干皮脫自愈若寒熱齊作五積交加散加烏藥殭蠶若皮色不變大腿通腫神效散若無根虛火倏忽發熱十全大補湯血虛發熱面赤脈大而渴當歸補血湯陰虛形瘦發熱六味地黃湯若挾濕熱蒼龜丸或二妙散若系風濕換骨丹散膝湯若侵水濕蒸膝湯食少面黃六君子湯中氣不足補中益氣湯屈伸不利活絡丹成膿潰爛大防風湯膿清肌肉不生或頭暈吐痰八味地黃丸加鹿茸牛膝由腳軟漸成鶴膝獨活寄生湯但一膝引痛上下不甚腫而微紅者名膝遊風防風通聖散加木瓜牛膝或換骨丹或膝兩旁腫痛憎寒壯熱腫處手不可近者名膝眼毒勝金丹仙方活命飲加牛膝或膝蓋上腫痛亦發寒熱名膝癰治同上醫通曰婦人鶴膝風因鬱怒致損肝脾而為風邪所襲或先肢體筋攣膝漸大腿漸細如鶴膝狀其腫高赤痛者易治漫腫不紅痛者難治二三月潰而膿稠者易治半載後潰而膿清者難治誤用攻伐復傷元氣尤為難治宜固元氣為主其食少體倦六君子湯晡熱內熱寒熱往來逍遙散發熱惡寒十全大補湯驚悸少寐歸脾湯月經過期補中益氣湯月經先期加味逍遙散腎陰虛弱六味地黃丸凡潰後宜大補脾胃若膿出反痛或寒熱煩渴皆屬氣血虧損治以培補為宜八珍湯小兒鶴膝風多因先天腎氣衰薄陰寒凝聚於腰膝古方以六味丸補腎水以鹿茸引至骨節而壯里此治本良法也喻嘉言曰鶴膝風即風寒濕之痹於膝者也如膝骨日大上下肌肉日枯未可先治其膝宜養氣血使肌肉漸榮再治其膝可也此與治偏枯之症大同小異急溉其未枯者使氣血流行而復榮倘不如此但用麻黃防風等散風之藥鮮有不全枯者故治鶴膝而急攻其痹必並其足痿而不用矣附方溫補十全大補湯見一卷中風溫散大防風湯耆地歸芍杜仲防風各一錢附子川芎各七分半羌活人參牛膝炙草各五分白朮錢半姜棗溫散加減五積散見一卷濕退腫神效散人參二錢歸芍耆地術附羌防杜仲牛膝甘草各一錢姜三片補血當歸補血湯當歸黃耆陰陽六味丸八味丸俱見一卷中風濕熱蒼龜丸二術龜板各二兩半黃柏五錢粥丸每五十丸四物湯加陳皮甘草煎濕熱二妙散見一卷濕風濕換骨丹當歸一兩虎脛骨酥炙一具羌防獨萆薢各二兩秦艽牛膝蠶砂杞子油松節各五兩白茄根八兩蒼朮四兩龜板一兩用無灰酒一罈浸服盡將藥曬乾研末糊丸酒下風濕散膝湯黃耆五兩防風三錢肉桂五錢茯苓一兩水煎服取汗風濕蒸膝湯生耆八兩石斛薏苡各二兩肉桂二錢水煎二碗先服一碗覆被取汗再服汗透二劑全愈補脾六君子湯見一卷中風補氣補中益氣湯見一卷中風舒筋活絡丹見本卷痹濕痹獨活寄生湯見一卷濕遊風防風通聖散見本卷癘風膝眼毒勝金丹白砒制麝香各五分蟾酥一錢雄黃辰砂乳沒血竭各錢半全蠍天龍甲片各三錢殭蠶五錢為末每三錢砂糖調蔥白酒送下消毒仙方活命飲甲片防芷草赤芍歸尾花粉貝母角刺各一錢陳皮銀花各三分乳沒各一錢水酒各半煎除蒸逍遙散見一卷火安神歸脾丸見二卷勞瘵培補八珍湯見一卷中風破傷風論治破傷濕破傷火附凡金瘡跌撲損破皮肉及瘡瘍潰後切忌當風用扇若為風邪所乘皆能傳入經絡名破傷風其症寒熱間作牙關微緊即宜威靈仙五錢獨頭蒜一枚同搗爛熱酒沖服汗出愈甚則發痙口噤項強體直殺人急用獨聖散蘇木為末三錢酒服立效或用生蟾二兩半切剁如泥入花椒一兩同酒炒熟再入酒二盞熱服少頃通身汗出神效其破傷重亡血多筋絡失榮賊風易襲經所謂風邪乘虛入之也此為風虛邪宜桂枝湯合當歸補血湯若因營熱煽風瘡勢焮腫河間所謂熱甚風搏並於經絡也此為風火邪當歸地黃湯夫傷風法當疏表然不宜峻用汗劑者仲景謂瘡家不可發汗汗之則變痙故破傷症輕者但用蔥白香豉湯加白芷當歸鯪鯉甲麝香蠍尾症重者亦用本方加防風遠志黃耆肉桂犀角鯪鯉甲甚則用萬靈丹煎蔥豉湯下若嘔逆不食系風引邪毒攻心內用護心散外用蔥熨法大便不通但用蜜煎導症勢稍退即宜保元湯仍加遠志肉桂犀角鯪鯉甲解散餘毒如久不合口瘡毒內蘊熱甚生風周圍起白痂不甚腫身發寒熱牙關微緊急服玉真散口噤者童便調下即用此散敷瘡口倘瘡勢紅腫用杏仁泥和白麵水調敷腫處即消如身冷牙噤腰脊反張四肢強直急服全蠍散或大蜈蚣散用小蜈蚣散擦牙吐出痰涎立蘇如服後不解邪漸入里發搐目直視二便秘用左龍丸其背後搐者太陽也為在表太陽經行身後背後搐如角弓反張無汗急汗之防風湯九味羌活湯小續命湯汗過多止之防風當歸散白朮防風湯身前搐者陽明也為入里陽明經行身前身前搐如頭低視下手足牽引急下之先用小芎黃湯二服後用大芎黃湯下之兩旁搐者少陽也為半表半裡少陽經行身側兩旁搐如左右一目視或左右一手一足搐宜和之小柴胡湯或防風通聖散加減此河間法也其但言三陽不及三陰者謂風邪傳入三陰其症必危惟天靈蓋煅末一錢鯪鯉甲半錢麝香一字同研煎蔥白香豉湯送下若少腹滿自利口燥咽乾舌卷囊縮額上珠汗不流肢體痛極不在傷處終為死候凡通治破傷風宜曹氏秘方荊芥黃蠟魚鰾各五錢艾葉三片無灰酒一碗重湯煮一炷香熱飲汗出愈若發痙宜蠲痙湯病久衰弱宜主調營四物湯加防風白芷細辛瘡瘍風邪攻注身痛攣急羌活防風湯加地骨皮荊芥穗如破傷焮腫膿不透出硃砂指甲散酒調服外用玉真散薑汁調敷又或用湯淋洗濕氣侵入瘡口流膿其人昏述沉重者名破傷濕先用除溫湯後用白朮膏若艾灸火烘火氣逼入瘡口腫赤其人煩躁發熱者名破傷火小芎黃湯加薄荷黑山梔酒炒黃連醫鑑曰諸瘡欲變痙宜急風散發汗多成痙宜防風當歸散亡血多成痙宜當歸地黃湯破傷風脈候破傷風脈浮而無力太陽也長而有力陽明也浮而弦者少陽也正傳洪數者傷火芤細者傷濕虛細而澀皆不治附方傷風桂枝湯見四卷瘧血虛當歸補血湯黃耆當歸營熱當歸地黃湯地芍歸芎防芷藁本各一錢細辛五分散表蔥白香豉湯見一卷溫通治萬靈丹歸芎荊防辛草麻黃天麻川烏草烏首烏茅朮石斛雄黃蜜丸毒攻護心散綠豆粉一兩乳香三錢辰砂甘草各一錢研細早暮各服三錢開水下外治蔥熨法大蔥一握隔湯蒸熟以線扎切平其底乘熱熨背冷即更換得微汗為度明日再熨便秘蜜煎導用蜜熬捏成如棗核納肛內補元保元湯見一卷火風痙玉真散防風南星等分為末每服一錢薑汁和酒調服名定風散以此蜜調敷瘡效再加白芷天麻羌活白附子等分杵末調敷瘡口名玉真散凡打傷欲死唯是心頭溫者用藥末二錢熱酒童便下二服效身冷全蠍散蠍尾七個為末熱酒調服日三次凡破傷風非此不除風毒大蜈蚣散蜈蚣二條魚鰾炒左蟠龍即鴿糞炒煙盡各五錢為末每服二錢防風湯下去風小蜈蚣散蜈蚣一條全蠍二個炒研擦牙出涎治口噤身反張不省人事入里左龍丸左蟠龍即鴿糞炒殭蠶炒魚鰾蛤粉炒各五錢雄黃一兩天麻二錢飯糊丸桐子大每服十五丸溫酒下日三服如症重每藥末一錢飯糊中加入巴豆霜五釐每服中加一丸漸加至十丸以利為度痛愈即止一方有大蜈蚣二條無汗防風湯防芎羌獨各一錢二分半水煎調蜈蚣散溫服之大效通治九味羌活湯羌活錢半防風茅朮各一錢細辛五分芎芷芩地各八分炙草六分蔥白二莖姜三片棗一枚散風小續命湯見一卷中風汗多防風當歸散防歸芎地各一錢半固衛白朮防風湯術耆各二錢防風四錢陽明小芎黃湯川芎黃芩各一錢半炙草一錢蔥白四莖香豉四合水煎風秘大芎黃湯即小芎黃去甘草加酒炒大黃三錢羌活錢半水煎少陽小柴胡湯見一卷溫風熱防風通聖散見本卷癘風通治曹氏秘方荊芥黃蠟魚鰾各五錢艾葉三片無灰酒一碗重湯煎一炷香熱飲汗出愈通治蠲痙湯羌獨防杏地榆營虛四物湯地芍歸芎風痛羌活防風湯羌防芎歸芍草藁本各一錢地榆細辛各五分透膿硃砂指甲散硃砂南星薑製獨活各二錢人手指甲六錢燒存性為末分三服酒下傷濕除濕湯見一卷濕傷濕白朮膏一味生白朮熬變痙急風散麝香一字辰砂一兩生黑醜二錢半草烏三兩半生半焙醋淬每末五分酒下
