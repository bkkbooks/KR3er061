body:
  text: 卷之五頭風論治雷頭風附風邪上干新感為頭痛深久則為頭風其症頭巔重暈或頭皮麻痹或耳鳴目眩眉稜緊掣舊素有痰火復因當風取涼邪從風府入腦鬱而為熱為痛甚則目病昏眩頭風不治必害眼當分偏正左右寒熱氣血治之痛在正頂多太陽經風鬱宜川芎羌活蔓荊蘇葉等散之太陽經從額至顛絡腦後也痛在左右多少陽經火鬱宜甘菊花丹皮山梔桑葉鉤藤等發之少陽經從頭角下耳及耳之前後也痛偏左為風虛宜川芎當歸防風薄荷痛偏右為痰熱宜蒼朮半夏黃芩石膏氣虛者為勞補中益氣湯加川芎天麻血虛者善驚四物湯加薄荷白芷熱痛者惡熱消風散冷痹者畏寒追風散寒熱久郁發時悶痛欲綿裹者多痰二陳湯加酒芩荊芥川芎薄荷石膏細辛風兼熱者茶調散菊花散寒挾濕者導痰湯加蒼朮白芷痛連齒齦者鉤藤散加荊芥薄荷痛掣眉稜者選奇湯鼻流臭涕者芎犀散或透頂散搐鼻出涎腦後筋掣者鉤藤荷葉邊連翹苦丁茶甘菊氣上攻痛者全蠍散年久不愈者烏頭南星末蔥汁調塗太陽穴婦女血分受風者養血祛風湯其有因膽火上逆為暈痛治宜泄熱者用羚羊角生地丹皮甘菊苦丁茶嫩桑葉因肝陽乘胃為嘔吐治宜熄風者用茯神甘菊炭鉤藤半夏曲薄荷山梔因肝陰虛內風動治宜滋液者用復脈湯去參薑桂加雞子黃白芍因暑熱上蒙清竅治宜清滲者用石膏荷梗薄荷羚羊角通草苡米因陰傷陽浮齒痛筋惕治宜鎮攝者用阿膠牡蠣生地人參白芍鉤藤因內風頭痛淚冷目昏治宜潤養者用杞子首烏茯神白芍柏子仁甘菊炭頭腦鳴響狀如蟲蛀名天白蟻者茶子末吹鼻效頭多白屑作癢者零陵香白芷煎汁入雞子白攪勻敷雷頭風腫痛起塊憎寒壯熱腦震如雷鳴者清震湯解雷湯雷頭風病在三陽不可過用寒涼重劑誅伐無過河間立清震湯腦風項背怯寒腦戶穴冷者神聖散首風因於新沐汗多惡風者川芎丸白芷丸余參頭痛門治頭風脈候浮為風緊為寒浮滑為風痰洪數為風熱陽弦為頭痛細而堅為濕弦而澀為氣虛芤為血虛滑為痰厥頭痛脈急短澀者死凡診寸脈短者頭痛寸口緊急或浮或短或弦皆主頭痛附方氣虛補中益氣湯見一卷中風血虛四物湯見一卷中風熱痛消風散見二卷失音冷痛追風散炮川烏煅石膏炒殭蠶荊防芎草各五錢天麻制南星白附子羌活地龍全蠍白芷各二錢半乳香沒藥各一錢二分為末每服五分茶調下痰痛二陳湯見一卷中風風熱茶調散見一卷傷風風熱菊花散甘菊花旋覆花防風枳殼羌活石膏蔓荊子甘草各一錢五分姜三片痰濕導痰湯見一卷中風齒齦鉤藤散鉤藤陳夏防苓參草麥冬石膏甘菊或加生地荊芥眉稜選奇湯防風羌活各三錢黃芩一錢甘草八分臭涕芎犀散川芎硃砂石膏片腦人參茯苓炙草細辛犀角山梔麥冬阿膠搐鼻透頂散細辛二莖瓜蒂七個丁香三粒糯米七粒冰片麝香各一分半研勻用豆許隨病左右搐鼻出涎即愈氣攻全蠍散全蠍二十一個地龍六條土狗二個五倍子五錢為末酒調攤貼太陽穴血風養血祛風湯芎歸荊防羌辛地夏草藁本石膏旋覆蔓荊各五分姜棗滋液復脈湯見一卷中風雷頭清震湯升麻蒼朮荷葉各四錢雷頭解雷湯落帚子三錢升麻川芎蒼朮各一錢先煎荷葉水加姜再入藥煎七分服腦風神聖散葛根半生半炒麻黃細辛藿香等分為末薄荷荊芥湯下首風川芎丸川芎四兩天麻一兩蜜和每作十丸以一丸細嚼茶酒任下首風白芷丸新白芷不拘多少挫細以蘿蔔汁浸曬乾研蜜丸彈子大每一丸細嚼荊芥湯下一名都梁丸雷頭風脈案薛憎寒發熱頭痛腦如雷鳴一夕頂發塊礌甚多延及項後都成疙瘩俗醫以為外症用敷藥罔效診其脈浮大審知為雷頭風按東垣先生論此症狀類傷寒病在三陽不可過用寒涼重劑誅伐無過故劉河間立清震湯治之用升麻三錢蒼朮米泔浸炒四錢青荷葉一枝薄荷三錢如法二服立消此痰火上升故成結核腫痛用蒼朮除濕痰薄荷散風火升麻荷葉引入巔頂升發陽氣自得汗而腫消癘風論治腎臟風繡球風雁來風蛇皮風鵝掌風赤白遊風紫白癜風紫雲風癬疥癩斑附癘風惡疾也俗名大麻風其症皮肉麻頑身麵疙瘩攝之則癢痛腐潰漸至目紅鼻赤四體攣搐頭面突腫蓋中天地間一種風毒厲氣淫於腑臟骨髓注於經絡肢節久而後發亦有骨肉傳染而得者立齋分別五臟受病謂眉先落者毒在肺面發紫泡者毒在肝足底痛或穿者毒在腎遍身如癬者毒在脾目先損者毒在心一皮死麻木不仁二肉死針刺不痛三血死潰爛流膿四筋死指脫趾墮五骨死鼻柱崩塌至於聲啞目盲皆為難治內經治法以銳針刺其腫上出惡血重泄毒也其惡血滯在肌表經絡者宜汗宜刺汗用紫萍散刺取委中穴毒蘊腑臟非盪滌不除如涼膈雙解之類毒在外非砭針不散砭刺臂腿手足指縫出血表裡毒盛非外砭內泄不退上體患多以醉仙散取毒血從齒縫中出並刺臂腕指縫下體患多以再造散取蟲積從穀道中出仍針腿脛趾縫上下相等用必勝散兼取治法內通腑臟外達經絡養營益衛補正逐邪若妄投燥熱膿水淋漓肝血益涸風熱益熾腎水益傷矣初起頭面搔癢發出紅紫疹塊者用防風通聖散加苦參天麻蟬蛻數服接服八珍湯聖愈湯外用白玉蟾浴湯加羌活薄荷蔥白煎洗浴後白玉蟾擦藥搽凡遍體腫塊以生薑蘸擦藥擦之其燥起白屑系血不榮膚四物湯加荊防白芷地骨皮搔如隔帛系氣不充表養營湯面部麻木系氣血不能上榮補中益氣湯加川芎白附癮疹赤暈系風熱入營實者胡麻散虛者祛風丸疙瘩破癢系風毒傷血羌活當歸散或當歸飲加山梔鉤藤指節攣拳系陰火爍筋加味逍遙散加鉤藤與換肌散間服鼻赤眉落屬肺經風熱人參消風散加天麻殭蠶面發紫泡屬肝經風毒梔子清肝湯加鉤藤金銀花兼服六味丸筋骨攣痛屬肝腎陰虛六味地黃湯口眼喎斜屬風動痙厥用全蠍酒洗鹽焙研殭蠶白附子末各七錢每服錢半寒熱往來小柴胡湯陽虛怯冷補中益氣湯十全大補湯瘡久潰爛摻紅玉散敷坎離膏足心穿破服六味湯摻香珠散氣血虧敗固命丹通治風癩豨薟丸胡麻丸一切毒癘危症五龍丸千年藥東華玉髓馮夷瓊漿諸方選用若夫癘瘍類症則有兩臁如癬蟲蝕成瘡者為腎臟風用四生散以去風邪六味丸以滋腎水腎囊濕癢者為繡球風蛇床子湯加川椒茴香蔥皮頑肌燥至秋癢發者為雁來風宜羌活白芷散或加味逍遙散膚裂癢痛形似蛇紋者為蛇皮風初用火龍散繼服補劑外用雄黃硫黃硃砂赭石枯礬川椒樟腦研香油調擦掌心頑厚白皮鱗屑者為鵝掌風內服大消風散外用土槿皮川椒煎湯熏洗再用桐油調鴿糞擦之臂腿㾦㿔遊走不定者為赤白遊風赤用加味逍遙散白用人參消風散其肌肉斑駁紫白為紫白癜風通用川附硫黃研末薑汁調勻茄蒂擦之或用水銀輕粉調薑汁擦之身發紫斑延暈如霞者為紫雲風何首烏散加豨薟蛇床子夏枯草煎洗牛皮頑癬用火酒浸土槿皮大楓子雄黃川椒羌活斑蝥朝腦紅砒煙膏明礬以穿山甲刮破筆擦之新久疥癲一掃光夏月汗斑用密陀僧末洋糖醋調黃瓜蒂擦之雀斑酒刺白屑風癢玉肌散擦此因癘風類及之他如脫跟魚鱗蛓蠔虼蚤雞爪等風不過多立名色前明沈氏專科前明沈之間著解圍元藪四卷皆論風癩治法以祛風瀉火殺蟲排毒為先補血壯元導滯堅筋相濟忌用熏刺鋒鐮輕粉戒房室禁炙爆鹽醬大楓子性畏鹽及一切辛葷動風食品方可延生否則愈而再發必死昔孫真人治此症百餘人得免於死者二朱丹溪治五人得免者僅一婦人然則癘豈易治哉癘風脈候癘風陽脈浮弦關前陰脈實大關後兩寸浮而緊或浮而洪浮緩者易治洪大而數或沉實者難治脈若沉而病反在上浮而病反在下皆不治附方發汗紫萍散紫背浮萍一味曬乾研末每服三錢以黑豆淋酒臨臥調服取汗弱者間二三日再服攻蕩涼膈散見一卷中風表裡雙解散見一卷疫肺風樺皮散樺皮四兩炒灰荊芥穗二兩炙草五錢枳殼四兩杏仁二兩每服四五錢上體醉仙散胡麻牛蒡蔓荊枸杞俱炒各一兩白蒺藜苦參防風花粉各五錢為末每用一兩五錢入輕粉二錢拌勻每服一錢茶清調晨午各一服服至五七日齒縫中出臭涎令人如醉下盡惡物病根乃去一方多乳香沒藥麝香全蠍蛤粉大楓子藿香等味下體再造散鬱金角刺各五錢大黃制一兩白牽牛取頭末半生半炒六錢為末酒下五錢上下必勝散檳榔角刺各五錢大黃制一兩白牽牛取頭末半生半炒六錢甘草生熟各半二錢輕粉二錢為末分七服糖五匙薑汁五匙調服疹塊防風通聖散荊防歸芍芎術苓梔桔草連翹麻黃薄荷大黃芒硝石膏滑石蔥氣血八珍湯見一卷中風兩補聖愈湯見二卷勞瘵洗浴白玉蟾浴湯蒼耳子馬鞭草防風荊芥紫蘇苦參銀花白芷遍地香澤蘭外治白玉蟾擦藥白芷草烏南星杏仁半夏大楓子白芨白蘞蛇床子等分為末薑片擦之血燥四物湯地芍歸芎血虛養營湯見二卷勞瘵氣陷補中益氣湯見一卷中風風熱胡麻散胡麻兩半苦參荊芥首烏各八錢威靈仙防風菖蒲牛蒡甘菊蔓荊子白蒺藜炒炙草各六錢每服三錢風熱祛風丸耆枳防芍杞草地骨皮生地熟地蜜丸風毒羌活當歸散歸芎羌防荊芩翹芷草黃連牛蒡子升麻各一錢水煎血熱當歸飲歸芎地芍荊防蒺藜各錢半耆草首烏各一錢水煎血燥加味逍遙散見一卷火肺風消風散見二卷失音肢攣換肌散白花蛇黑花蛇酒浸各三兩地龍當歸細辛白芷天麻蔓荊威靈仙荊芥菊花苦參紫參沙參木賊草白蒺藜不灰木甘草天冬赤芍九節菖蒲定風草首烏胡麻草烏炮去皮臍川芎蒼朮木鱉子各一兩研末每服五錢溫酒調下肝火梔子清肝湯柴梔丹各二錢歸芍苓芎牛蒡各七分水煎腎虛六味丸見一卷中風寒熱小柴胡湯見一卷溫陽虛十全大補湯見一卷中風瘡爛紅玉散文蛤白芷當歸大黃白芨草烏各一兩乳香沒藥兒茶雄黃血竭韶粉東丹各三錢為末香油調搽外敷坎離膏血竭三錢冰片一錢輕粉水銀各二錢大楓子一兩白蠟五錢研極細加熬熟香油調入麝香二分大風久爛以甘草湯洗搽足心香珠散木香硃砂赤石脂東丹車前子各等分研細先以茶葉川椒煎湯洗淨再摻藥外用綿紙紮好風虛固命丹人參熟地各四兩杞子麥冬各六兩茯苓當歸各十六兩仙靈脾取葉一斤去毛酒拌蒸為末蜜丸每服四十丸米湯下通治豨薟丸豨薟草五月取赤莖者陰乾以蜜酒蒸曬一斤歸芍熟地各一兩川烏黑豆制六錢羌活防風各一兩蜜丸二錢以酒下通治胡麻丸胡麻一斤苦參皮五斤酒浸荊芥穗四斤豨薟草三斤蒼耳葉紫背浮萍各二斤曬研末酒糊丸硃砂為衣每服百丸追毒黃龍丸舶上硫黃打碎熔化傾入釅醋內取淨硫一斤入竹筒內以蠟封口浸糞缸中一年取起放長流水中四十九日松香熔化加火酒煮七沸傾入冷水內但取淨松香三兩茅朮米泔浸刮一斤檀香白膠香川烏炮川芎各四兩惡實草烏天麻各三兩地龍二兩研末陳米糊丸每服五十丸開水下滌穢濁烏龍丸肥皂角刮去皮筋子水浸捶爛絞去渣取汁入瓦器用黑牽牛末共搗為丸桐子大每服五十丸白湯下利三五次不傷正氣逐濕白龍丸乳香沒藥川烏草烏地龍南星酒糊丸每服四十丸或酒或荊芥湯下除濕花龍丸蒼朮黃柏龜殼酥炙牛膝當歸萆薢防己茄根皮各一兩酒糊丸每服百丸痿痛赤龍丸麝香二錢半乳香沒藥當歸各七錢地龍白膠香各二兩五錢木鱉子三錢川烏五靈脂各二兩京墨線膠炒紫背浮萍各二兩