升麻三錢茯神人參防風犀角羚羊角羌活各一錢桂心三分加竹瀝半杯和服脈痹秦艽四物湯四物湯加秦艽薏苡蠶砂甘草鎮補人參丸人參麥冬茯神龍齒石菖蒲遠志肉耆歸地蜜丸肌痹神效黃耆湯參耆芍陳草蔓荊子尿澀加澤瀉身熱加丹皮皮痹秦艽地黃丸四物湯加秦艽荊防羌芷升麻蔓荊甘草大力子各一錢五臟五痹湯參苓歸芍芎術五味子細辛或加引經之藥痹脈案李左臂自肩以下骨節大痛經所謂寒勝則痛也來勢甚驟若遊走上下骨骱即俗謂白虎歷節風痛如虎咬刻不可忍此非厲劑不除投以川烏頭炮去臍皮草烏頭炮去皮薑汁製松節油一劑服後飲酒以助藥勢達病所夜半身麻汗出平旦而病若失矣此仿活絡丹法張五旬外左臂素患腫痛因涉江受風一夜全身麻痹脈虛濡此真氣虛而風濕為病乃痱中根萌也經曰營虛則不仁衛虛則不用營衛失調邪氣乘虛襲入經絡蠲痹湯主之數服而效準繩云凡風痹偏枯未有不因真氣不周而病者治不用黃耆為君人參歸芍為臣桂枝鉤藤荊瀝竹瀝薑汁為佐徒雜烏附羌活以涸營而耗衛未之能愈也嚴氏蠲痹湯用黃耆炙草以實衛當歸白芍活血以調營羌防除濕疏風薑黃理血中滯氣入手足而驅寒濕用酒和服專藉以行藥力也王傷酒涉水濕襲陰絡右腿痹痛由髀骨直至委中穴參用三痹湯內服桂心茯苓牛膝杜仲白朮蒼朮當歸獨活桑枝煎湯外用防風桂枝木瓜當歸豨薟蔥白煎湯熏洗汗出為度夫濕痹重著今腿痛已定通移膝脛仍以逐濕通痹法治川烏桂心獨活牛膝虎脛骨歸尾沒藥以溺少加茯苓車前子二服兼用洗藥痛止能行數十日內戒酒肉風冷勞動王氏女風寒濕合而成痹蘊邪化熱蒸於經絡四肢痹痛筋骨不舒蓋邪中於經為痹中於絡為痿金匱云經熱則痹絡熱則痿倘經腑治失宣通延為痿躄杏仁滑石石膏赤苓威靈仙蠶砂薏仁數服痛減乃用白朮薏仁茯苓桂枝片薑黃釵斛歸身玉竹五加皮桑枝煎湯數十服肢體活動又服丸劑平補肝腎步履如常族婦右臂痛手不能舉此為肢痹用舒筋湯片薑黃當歸羌活炙草姜渣海桐皮加桂枝四五服漸瘳凡筋得寒則急得熱則縱緛短為拘弛長為痿風寒濕三氣雜至合而成痹風勝為行痹寒勝為痛痹濕勝為著痹宜宣風逐寒燥濕兼通絡如臂痛服舒筋湯必腋下漐漐汗出則邪不滯於筋節而拘急舒矣如氣虛加參耆血虛加地芍肩背加羌活狗脊鹿膠腰脊加杜仲獨活沙苑子臂指加薑黃桂枝骨節加油松節虎膝下部加牛膝薏苡五加皮虎脛骨經絡加桑寄生威靈仙鉤藤久而不痊必有濕痰敗血瘀滯經絡加桂心膽星川烏地龍紅花桃仁以搜逐之王有年盛暑脈沉緩身半以下痠痛脛膝無汗手足不溫便艱夢泄皆濕熱壅阻致痹先通其壅用蒸牛膝當歸秦艽川芎玉竹杏仁陳皮淡蓯蓉二服便潤去蓯蓉杏仁專理經絡濕邪加桂枝桑寄生獨活薏苡杜仲熟地炒十數服全瘳痿症論治痿者肢弱而無力筋弛而不收為熱傷血脈之症經曰五臟因肺熱葉焦發為痿躄夫五臟皆有痿如肺熱為皮毛痿宜犀角桔梗湯心熱為脈痿宜鐵粉丸肝熱為筋痿宜紫葳湯脾熱為肉痿宜二陳湯加參耆腎熱為骨痿宜金鋼丸而經論痿躄必原肺熱者以肺為臟之長體燥居上主氣而畏火若金受火爍則氣傷而不能營攝一身乃發為痿躄矣其治痿獨取陽明何也經曰陽明者臟腑之海主潤宗筋宗筋主束筋骨而利機關也陽明虛則宗筋縱帶脈不引故足痿不用此治痿必使胃納水穀化精微五臟得所稟以行血氣濡筋骨利關節也河間論痿主血衰不能營養百骸子和謂痿必火乘金病多作於五六七月午為少陰君火之位未者濕土庚金伏火之地申者少陽相火之分故病痿者脈浮大戴人主腎水衰則骨髓枯竭直言痿病無寒丹溪云瀉南方則肺金清而東方有制土不受戕補北方則心火降而西方有養金不苦燥凡痿症不可作風治而用風藥東垣治痿以黃柏為君黃耆為佐士材論胃虛食減成痿宜藿香養胃湯治脾下陷足痿用補中益氣湯石頑主陽明濕熱各具確見今參而酌之通治濕熱成痿脈洪滑者主清燥二妙丸加味二妙丸隨症加減濕熱傷肺成痿者主清土如沙參麥冬玉竹杏仁石斛百合花粉通草山梔濕熱壅胃成痿者主通腑大豆黃卷茵陳滑石石膏萆薢茯苓枳實檳榔濕熱著筋骨成痿者主理隧金毛狗脊地骨皮知母防己牛膝龜甲五加皮或三妙丸陽明脈虛宗筋不約者主潤肺人參茯苓杞子當歸桑葚肉蓯蓉桑寄生芝麻山藥肝胃陰虛風動肢痿者主通攝熟地牛膝遠志杞子石斛鉤藤肝腎陰虛足熱枯痿者填精髓牛骨髓豬骨髓鹿筋膠羊肉膠熟地杞子牛膝青鹽或滋陰大補丸腎督陽虛脊軟腿痠者壯筋骨鹿角膠丸四斤丸太陽督脈虛形俯痿廢者理腰脊香茸丸衰年足軟肌麻蹺維不用者以溫行流暢奇絡橘絡木瓜杞子杜仲狗脊肉蓯蓉牛膝當歸鬚鹿膠病後陰傷骨痿六味丸去丹澤加虎脛骨龜甲牛膝當歸久病筋骨痿不起於床金剛丸牛膝丸煨腎丸五獸三匱丹陰虛挾濕熱脈滯而數為痿厥虎潛丸加減不應少加川附子長夏暑濕成痿清暑益氣湯加減腎傷暑暍痿厥清燥湯加減膏粱濕熱傷精脛膝痿弱神龜滋陰丸大補地黃丸血衰筋緩不收補血榮筋丸氣虛舉動無力四君子湯加肉桂黃耆半身偏痿須分左右審氣血陰陽十全大補湯加減屈伸不利行步艱難安腎丸肢軟脈滑腰膝麻木或腫屬濕痰二術二陳湯加薑汁竹瀝食滯脾氣不得運於四肢成痿脈必氣口弦滑而惡食木香檳榔丸加山楂神麯木瓜防己瘀血留於腰胯成痿脈必沉澀而兼痛四物湯加桃仁莪朮穿山甲心熱亢兼實積者為脈痿大承氣湯瘦人病痿脈澀或大多血虛有火二妙四物湯肥人病痿脈滑或沉多氣虛有痰二妙六君湯子和云四末之疾動而或勁為風不仁或痛為痹弱而不用為痿逆而寒熱為厥風必兼熱痹必風寒濕合邪痿必火乘金厥則或寒或熱皆從下起奈何不察其源概謂風淫末疾以風藥例治耶痿症脈候脾脈緩甚為痿厥內經診痿躄脈虛者生緊急疾者死脈經尺脈虛弱緩澀而緊病為足痛或為痿病脈訣痿脈多浮而大子和附方肺痿犀角桔梗湯黃耆石斛天冬麥冬百合山藥犀角通草桔梗黃芩杏仁秦艽心痿鐵粉丸鐵粉銀箔黃連苦參石蜜龍膽龍齒牛黃秦艽丹皮白蘚皮地骨皮雷丸犀角肝痿紫葳湯紫葳天冬百合杜仲黃芩黃連萆薢牛膝防風菟絲子白蒺藜脾痿二陳湯陳苓夏草腎痿金剛丸見二卷虛損胃虛藿香養胃湯參術苓草苡仁藿香半夏曲烏藥神麯砂仁畢澄茄姜棗脾虛補中益氣湯見一卷中風通治二妙丸見一卷濕濕熱加味二妙丸見本卷痹濕熱三妙丸二妙丸加酒蒸牛膝二兩陰虛滋陰大補丸熟地山藥萸肉茯苓牛膝杜仲五味巴戟小茴香肉蓯蓉遠志石菖蒲杞子紅棗蜜丸陽虛鹿角膠丸鹿角膠鹿角霜熟地人參當歸牛膝茯苓菟絲子白朮杜仲虎骨龜板壯筋四斤丸虎脛骨一兩牛膝蓯蓉各兩半川烏天麻各一兩木瓜一斤為末以蓯蓉搗膏酒糊丸加乳香沒藥名加味四斤丸督虛香茸丸鹿茸三兩生當歸二兩麝香一錢生川烏五錢雄羊腎三對酒煮搗爛為丸陰傷六味湯見一卷中風溫理牛膝丸見二卷虛損益陽煨腎丸見二卷虛損益陽五獸三匱丹鹿茸酥炙血竭虎脛骨酥炙牛膝酒浸狗脊燒去毛各一兩共為末此五獸也附子一個去皮臍去中心入辰砂末一兩填滿木瓜一個去皮去中心入附子於內以附子末蓋口此三匱也卻以三匱正坐於瓷缸內重湯蒸爛和五獸末搗丸木瓜酒下痿厥虎潛丸見一卷中風暑痿清暑益氣湯見一卷暑肺燥清燥湯耆錢半蒼朮一錢陳術澤瀉各五分五味子六粒參苓升麻各三分麥冬歸地草神麯黃柏豬苓各二分柴胡黃連各一分水煎濕熱神龜滋陰丸龜板酥炙四兩黃柏知母各鹽酒炒二兩杞子五味鎖陽酒炙各一兩乾薑五錢為末以豬脊髓和丸每服五錢鹽湯下滋燥大補地黃丸見一卷燥筋痿補血榮筋丸蓯蓉酒製菟絲子酒煮焙天麻煨各二兩牛膝酒煮四兩鹿茸酥炙一對熟地六兩木瓜薑汁炒五味子焙各一兩為末蜜丸溫酒下氣虛四君子湯見一卷中風氣血十全大補湯見一卷中風陽衰安腎丸見本卷痹濕痰二術二陳湯見二卷痰飲食滯木香檳榔丸木檳術枳陳香附神麯糊丸瘀血四物湯見一卷中風熱積大承氣湯見一卷溫血虛二妙四物湯二妙合四物氣虛二妙六君湯二妙合六君痿脈案蕭中年後腎虧火動足膝痠軟脈虛駃而促初用六味湯加懷牛膝繼用虎潛丸去鎖陽服後甚適但坐久腰府熱騰小腹收引氣升脘膈不舒症因沖督經虛龍焰不伏非理臟真所得效擬龜鹿二仙膏加豬脊髓同熬酒和服得效李瘧邪失汗誤藥濕邪入絡四肢痿廢用除濕理絡手足能運然值冬寒氣血斂澀少腹逼窄背脊拘急脛膝麻頑步履歪倒知其陰陽維不司約束侵及任督俱病也用杜仲狗脊強筋骨而利俯仰五加皮牛膝益肝腎而治拘攣當歸白芍以和營茯苓萆薢以逐濕秦艽獨活以治痹玉竹桑枝以潤風燥理肢節加桑寄生通經絡煎服十數劑諸症漸減又將前方參入鹿膠沙苑子小茴香以通治奇脈丸服酒下獲痊族兒脊骨手足痿縱此督脈及宗筋病內經治痿獨取陽明以陽明為宗筋之會陽明虛則宗筋失養無以束筋骨利機關也童年坐臥風濕虛邪襲入遂致筋脈失司欲除風濕須理督脈兼養宗筋乃效方用歸芎參朮牛膝鹿膠茯苓木瓜寄生桑枝薑黃威靈仙十服肢體運動已活去鹿膠薑黃川芎木瓜威靈仙加杜仲玉竹杞子虎脛骨數十服行立復常張氏四肢痿弱動履艱難脈澀且弱為營虛之候經言天癸將絕系太衝脈衰乃陰吹帶濁宿恙頻興因知沖為血海隸於陽明陽明虛則衝脈不榮而宗筋弛縱無以束筋骨利機關法當調補營血以實奇經人參杞子茯苓牛膝酒蒸熟地當歸杜仲酒焙山藥炒木瓜薑棗水煎十數服漸愈痛風歷節風論治痛風痛痹之一症也其痛有常處掣者為寒腫者為濕汗者為風三氣入於經絡營衛不行正邪交戰故痛不止靈樞謂之賤風素問謂之痛痹金匱謂之歷節後世更名白虎歷節風近世俗名箭風初因寒濕風鬱痹陰分久則化熱攻痛至夜更劇治以辛溫疏散寒濕風邪開發腠理宜十生丹若痛處赤腫焮熱將成風毒宜敗毒散如風濕攻注肢節疼痛大羌活湯其歷節風痛無定所遍歷骨節痛如虎齧又名白虎歷節蓋痛風之甚者也或飲酒當風汗出浴水因醉犯房皆能致之其手指攣曲身多瘣㿔其腫如脫漸至摧落其痛如掣不可屈伸須大作湯丸不可例以常劑治烏頭湯主之因於寒宜從溫散防風天麻湯因於火宜從清涼犀角散加減若筋脈攣痛伸縮不利系血虛燥四物湯加木瓜何首烏甘杞子肢節痠痛脈沉短氣繫有留飲半夏芩術湯或導痰湯加減肢節注痛得捶摩而緩者系風濕在經靈仙除痛飲肢節腫痛遇陰雨而甚者系風濕入絡虎骨丸沒藥散或虎骨散肢節煩痛肩背沉重者系濕熱相搏當歸拈痛散肢節刺痛停著不移者系瘀血阻隧趁痛散肢節熱痛者系陰火灼筋加味二妙散或潛行散用四物湯間服周身麻痛者系氣血凝滯五靈丸歷節久痛者系邪毒停留乳香定痛丸活絡丹肥人肢節痛多風濕痰飲流注宜導痰湯瘦人肢節痛是血枯宜四物湯加羌活防風老人性急作勞患腿痛宜四物湯加桃仁牛膝陳皮生甘草煎成入薑汁或潛行散有瘀積者加熱酒服並刺委中穴出血風氣遊行痛無常處如蟲行遍體日靜夜劇者麝香丸主之痛風歷節二症宜參酌治之東垣以痛風多屬血虛主用芎歸佐以桃仁紅花薄桂威靈仙或趁